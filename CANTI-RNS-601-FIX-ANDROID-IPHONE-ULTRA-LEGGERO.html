var canti = [
{n:'A1',t:'INONDA IL MIO CUOR',c:'Inonda il mio cuor, \ninonda il mio cuor, \no Spirito inonda il mio cuor. \nCon olio d\'amor, \ncon olio d\'amor, \no Spirito inonda il mio cuor. \n \nTi voglio servir, \nti voglio servir, \nGesù io ti voglio servir. \nCon il tuo poter, \ncon il tuo poter, \nGesù io ti voglio servir. \n \nTua gloria sarò, \ntua gloria sarò, \no Padre tua gloria sarò. \nCon i figli tuoi, \ncon i figli tuoi, \no Padre tua gloria sarò.',s:'inonda il mio cuor inonda il mio cuor inonda il mio cuor o spirito inonda il mio cuor con olio d amor con olio d amor o spirito inonda il mio cuor ti voglio servir ti voglio servir gesu io ti voglio servir con il tuo poter con il tuo poter gesu io ti voglio servir tua gloria saro tua gloria saro o padre tua gloria saro con i figli tuoi con i figli tuoi o padre tua gloria saro a1',type:'A',i:0},
{n:'A2',t:'SPIRITO DI DIO',c:'Spirito di Dio scendi su di noi. (2x) \nFondici, plasmaci, riempici, usaci. \nSpirito di Dio scendi su di noi. \nSpirito di Dio scendi su di LUI (o LEI). \nFondilo/a plasmalo/a riempilo/a usalo/a \nSpirito di Dio scendi su di LUI (o LEI) \nSpirito.. su di me. \nFondimi, plasmami, riempimi, usami.',s:'spirito di dio spirito di dio scendi su di noi 2x fondici plasmaci riempici usaci spirito di dio scendi su di noi spirito di dio scendi su di lui o lei fondilo a plasmalo a riempilo a usalo a spirito di dio scendi su di lui o lei spirito su di me fondimi plasmami riempimi usami a2',type:'A',i:1},
{n:'A3',t:'PADRE EFFONDI',c:'Padre effondi in lui/lei (2v) \nlo Spirito d\'Amore',s:'padre effondi padre effondi in lui lei 2v lo spirito d amore a3',type:'A',i:2},
{n:'A4',t:'DISCENDI SANTO SPIRITO SEQUENZA',c:'1) Discendi Santo Spirito, le nostre menti illumina \ndel ciel la grazia accordaci, Tu Creator degli uomini. \n2) Chiamato sei Paraclito e dono dell\'Altissimo; \nsorgente limpidissima, d\'amore fiamma vivida. \n3) I sette doni mandaci, Onnipotente Spirito \nle nostre labbra trepide, in Te sapienza attingano. \n4) I nostri sensi illumina, fervor nei cuori infondici, \nrinvigorisci l\'anima, nei nostri corpi deboli. \n\n5) Dal male tu ci libera serena pace affrettaci, \ncon te vogliamo vincere, ogni mortal pericolo. \n6) Il Padre tu rivelaci e il Figlio Unigenito, \nper sempre tutti credano, in Te divino Spirito. Amen.',s:'discendi santo spirito sequenza 1 discendi santo spirito le nostre menti illumina del ciel la grazia accordaci tu creator degli uomini 2 chiamato sei paraclito e dono dell altissimo sorgente limpidissima d amore fiamma vivida 3 i sette doni mandaci onnipotente spirito le nostre labbra trepide in te sapienza attingano 4 i nostri sensi illumina fervor nei cuori infondici rinvigorisci l anima nei nostri corpi deboli 5 dal male tu ci libera serena pace affrettaci con te vogliamo vincere ogni mortal pericolo 6 il padre tu rivelaci e il figlio unigenito per sempre tutti credano in te divino spirito amen a4',type:'A',i:3},
{n:'A5',t:'SPIRITO D\'AMORE',c:'Spirito d’amore fammi vibrar \ncome le corde dell’arpa di David. \nSpirito santo suonaci insieme \ncome le corde dell’arpa, \nle corde dell’arpa, \nle corde dell’arpa di David. \nSpirito d’ Amore scendi su di me, \ncome la musica nel cuore di David. \nSpirito santo dimora in noi \ncome la musica nel cuore, \nla musica nel cuore, \nla musica nel cuore di David. \nSpirito d’Amore fammi amar, \ncome il Figlio dei figli di David. \nSpirito Santo guidaci Tu, \nfino al Figlio dei figli \nal Figlio dei Figli, \nal Figlio dei figli di David.',s:'spirito d amore spirito d amore fammi vibrar come le corde dell arpa di david spirito santo suonaci insieme come le corde dell arpa le corde dell arpa le corde dell arpa di david spirito d amore scendi su di me come la musica nel cuore di david spirito santo dimora in noi come la musica nel cuore la musica nel cuore la musica nel cuore di david spirito d amore fammi amar come il figlio dei figli di david spirito santo guidaci tu fino al figlio dei figli al figlio dei figli al figlio dei figli di david a5',type:'A',i:4},
{n:'A6',t:'SPIRITO DEL DIO VIVENTE',c:'Spirito di Dio vivente accresci in noi l\'amore. \nPace, gioia, forza nella tua dolce presenza (x2). \nFonte d\'acqua viva purifica i cuori, \nsole della vita ravviva la tua fiamma. (2v)',s:'spirito del dio vivente spirito di dio vivente accresci in noi l amore pace gioia forza nella tua dolce presenza x2 fonte d acqua viva purifica i cuori sole della vita ravviva la tua fiamma 2v a6',type:'A',i:5},
{n:'A7',t:'SPIRITO DI DIO',c:'Spirito di Dio scendi su di noi, \nSpirito d’amore fondi i nostri cuor. \nPadre effondi il tuo spirito d’amor \nsu di noi, plasmaci. \nSpirito Santo guida i nostri cuori, \nguidali guidali a Gesù. \nSpirito di Dio scendi su di noi.',s:'spirito di dio spirito di dio scendi su di noi spirito d amore fondi i nostri cuor padre effondi il tuo spirito d amor su di noi plasmaci spirito santo guida i nostri cuori guidali guidali a gesu spirito di dio scendi su di noi a7',type:'A',i:6},
{n:'A8',t:'SPIRITO DI DIO CONSACRAMI',c:'Spirito di Dio riempimi \nSpirito di Dio battezzami \nSpirito di Dio consacrami \nVieni ad abitare dentro me! \n \nSpirito di Dio guariscimi \nSpirito di Dio rinnovami \nSpirito di Dio consacrami \nVieni ad abitare dentro me! \n \nSpirito di Dio riempici \nSpirito di Dio battezzaci \nSpirito di Dio consacraci \n \nVieni ad abitare dentro noi! (x3)',s:'spirito di dio consacrami spirito di dio riempimi spirito di dio battezzami spirito di dio consacrami vieni ad abitare dentro me spirito di dio guariscimi spirito di dio rinnovami spirito di dio consacrami vieni ad abitare dentro me spirito di dio riempici spirito di dio battezzaci spirito di dio consacraci vieni ad abitare dentro noi x3 a8',type:'A',i:7},
{n:'A9',t:'SPIRITO DI VITA',c:'Vieni su di noi (me) e trasformaci (mi) \nO Spirito di vita. \nGuariscici /Riempici /Liberaci / Fondici',s:'spirito di vita vieni su di noi me e trasformaci mi o spirito di vita guariscici riempici liberaci fondici a9',type:'A',i:8},
{n:'A10',t:'SPIRITO SANTO DAI LUCE',c:'Spirito Santo scendi su di me ( noi ) \ninfiamma il mio cuore, \ndai luce alla mia mente. \nTu sei speranza, tu sei la vita. \nO Consolatore, riempimi di te.',s:'spirito santo dai luce spirito santo scendi su di me noi infiamma il mio cuore dai luce alla mia mente tu sei speranza tu sei la vita o consolatore riempimi di te a10',type:'A',i:9},
{n:'A11',t:'SPIRITO SANTO VIENI',c:'Spirito Santo, Spirito Santo \nSpirito Santo vieni vieni dai quattro venti, \nSpirito del Signore, Spirito dell\'amore, \nSpirito Santo, vieni. \nVieni Santo Spirito, manda a noi dal cielo \nun raggio della tua luce. \nLava le nostre colpe, trasformaci in primizia \ndi creazione nuova. (RIT) \n \nVieni Santo Spirito, fa splendere la tua luce, \nrinnova il volto della terra. \nDal regno delle tenebre guidaci \n\nalla sorgente del primo eterno amore. (RIT)',s:'spirito santo vieni spirito santo spirito santo spirito santo vieni vieni dai quattro venti spirito del signore spirito dell amore spirito santo vieni vieni santo spirito manda a noi dal cielo un raggio della tua luce lava le nostre colpe trasformaci in primizia di creazione nuova rit vieni santo spirito fa splendere la tua luce rinnova il volto della terra dal regno delle tenebre guidaci alla sorgente del primo eterno amore rit a11',type:'A',i:10},
{n:'A12',t:'MUOVITI IN ME',c:'E\' LO SPIRITO DI DIO \n \nE’ lo Spirito di Dio \nche sta in questo luogo \ne’ lo Spirito di Dio \nche sta in questo luogo. \nLui sta qui per consolar, \nLui sta qui per liberar, \nLui sta qui per guidar \ne’ lo Spirito di Dio che sta qui. \n \nMuoviti in me, muoviti in me \ntocca il profondo del mio cuor \nla mia vita col tuo amor \nmuoviti in me, Dio Spirito \nmuoviti in me \n \nE’ lo Spirito di Dio \nche sta in questo luogo, \ne’ lo Spirito di Dio \nche sta in questo luogo, \nLui sta qui per consolar \nLui sta qui per liberar \nLui sta qui per guidar \ne’ lo Spirito di Dio che sta qui. \n \nMuoviti in noi, muoviti in noi \ntocca il profondo dei nostri cuori \nle nostre vite col tuo amor \nmuoviti in noi \nDio Spirito muoviti in noi, \nmuoviti in noi \nDio Spirito muoviti in noi.',s:'muoviti in me e lo spirito di dio e lo spirito di dio che sta in questo luogo e lo spirito di dio che sta in questo luogo lui sta qui per consolar lui sta qui per liberar lui sta qui per guidar e lo spirito di dio che sta qui muoviti in me muoviti in me tocca il profondo del mio cuor la mia vita col tuo amor muoviti in me dio spirito muoviti in me e lo spirito di dio che sta in questo luogo e lo spirito di dio che sta in questo luogo lui sta qui per consolar lui sta qui per liberar lui sta qui per guidar e lo spirito di dio che sta qui muoviti in noi muoviti in noi tocca il profondo dei nostri cuori le nostre vite col tuo amor muoviti in noi dio spirito muoviti in noi muoviti in noi dio spirito muoviti in noi a12',type:'A',i:11},
{n:'A13',t:'A REMAR',c:'Sulla barca gli amici di Gesù, \nsono attenti alla voce del Signor, \nla Parola ascoltan con amor, \nGesù parla e dice al loro cuor: \n \n*A remar, a remar, \nforza amici tutti insieme *a remar \nNon temere se qualcuno ti dirà, \n\n“sei da solo, Gesù non tornerà”, \nse non senti la mia voce nel tuo cuor, \nprega ancora e ritrovi il tuo Signor \n \n*A pregar, a pregar ... \nSe la barca sei tentato di lasciar \ne la rete vuota vuoi abbandonar \nabbi fede, continua a cantar, \nnotte e giorno non smetter di lodar. \n \n*A lodar, a lodar … \nSulla riva non fermarti a riposar, \ncon le reti tra le mani non restar. \nVieni amico ricomincia a gridar: \ntutti insieme, torniamo a pescar: \n*A pescar, a pescar ... \n \n \nAGGIUNTE LIBRO VECCHIO NON USATO',s:'a remar sulla barca gli amici di gesu sono attenti alla voce del signor la parola ascoltan con amor gesu parla e dice al loro cuor a remar a remar forza amici tutti insieme a remar non temere se qualcuno ti dira sei da solo gesu non tornera se non senti la mia voce nel tuo cuor prega ancora e ritrovi il tuo signor a pregar a pregar se la barca sei tentato di lasciar e la rete vuota vuoi abbandonar abbi fede continua a cantar notte e giorno non smetter di lodar a lodar a lodar sulla riva non fermarti a riposar con le reti tra le mani non restar vieni amico ricomincia a gridar tutti insieme torniamo a pescar a pescar a pescar aggiunte libro vecchio non usato a13',type:'A',i:12},
{n:'A14',t:'GIOVANE DONNA',c:'Giovane donna attesa dell\'umanità \nun desiderio d\'amore è pura libertà \nil Dio lontano è qui vicino a te \nvoce e silenzio annuncio di novità. \n \nAVE MARIA , AVE MARIA. \n \nDio l\'ha prescelta qual Madre \npiena di bellezza \ned il suo amore ti avvolgerà \nnella sua ombra \nGrembo di Dio venuto sulla terra. \nTu sarai madre \ndi un uomo nuovo. (RIT) \n \nEcco l\'ancella che vive della sua Parola \nlibero il cuore perché l\'amore trovi casa. \nOra l\'attesa è densa di preghiera \ne l\'uomo nuovo è qui in mezzo a noi. (RIT)',s:'giovane donna giovane donna attesa dell umanita un desiderio d amore e pura liberta il dio lontano e qui vicino a te voce e silenzio annuncio di novita ave maria ave maria dio l ha prescelta qual madre piena di bellezza ed il suo amore ti avvolgera nella sua ombra grembo di dio venuto sulla terra tu sarai madre di un uomo nuovo rit ecco l ancella che vive della sua parola libero il cuore perche l amore trovi casa ora l attesa e densa di preghiera e l uomo nuovo e qui in mezzo a noi rit a14',type:'A',i:13},
{n:'A15',t:'DAVANTI AL RE',c:'Davanti al Re, ci inchiniamo insieme \nper adorarlo con tutto il cuor \nVerso di lui eleviamo insieme \ncanti di gloria al nostro Re dei re',s:'davanti al re davanti al re ci inchiniamo insieme per adorarlo con tutto il cuor verso di lui eleviamo insieme canti di gloria al nostro re dei re a15',type:'A',i:14},
{n:'A16',t:'LODE AL NOME DI GESÙ',c:'Lode a te Gesù, lode a te Gesù, \nmia roccia, mia fortezza, \nmio liberatore, io confido in te. \nLode al nome di Gesù.',s:'lode al nome di gesu lode a te gesu lode a te gesu mia roccia mia fortezza mio liberatore io confido in te lode al nome di gesu a16',type:'A',i:15},
{n:'A17',t:'IL TUO CORPO, ILTUO SANGUE',c:'Adesso Signore mangerò il tuo corpo \ne riceverò nel cuore il dono di salvezza. \nAdesso Signore io berrò il tuo sangue \ned accoglierò nel cuore il dono di vita eterna \n \nIL CORPO TUO SANTO E IL SANGUE TUO DIVINO, \nCUSTODIRÒ NEL CUORE E IN ME DIMORERAI. \nIL TUO SACRIFICIO CELEBRERÒ SIGNORE, \nL\'ANIMA MIA REDENTA IN ETERNO TI LODERÀ. \n \nTu solo Signore hai liberato il mondo \ned hai tolto ad ogni uomo il giogo del peccato. \nEd ecco Signore ci hai donato la tua vita \ne ti sei immolato per offrirci la redenzione [Rit] \n \nEd ora Signore in mezzo a noi la tua presenza \nconfidiamo solo in te, nostra unica speranza. \nTu sei nostra roccia, la nostra protezione, \nsicuri da ogni male, in te noi dimoriamo. [Rit]',s:'il tuo corpo iltuo sangue adesso signore mangero il tuo corpo e ricevero nel cuore il dono di salvezza adesso signore io berro il tuo sangue ed accogliero nel cuore il dono di vita eterna il corpo tuo santo e il sangue tuo divino custodiro nel cuore e in me dimorerai il tuo sacrificio celebrero signore l anima mia redenta in eterno ti lodera tu solo signore hai liberato il mondo ed hai tolto ad ogni uomo il giogo del peccato ed ecco signore ci hai donato la tua vita e ti sei immolato per offrirci la redenzione rit ed ora signore in mezzo a noi la tua presenza confidiamo solo in te nostra unica speranza tu sei nostra roccia la nostra protezione sicuri da ogni male in te noi dimoriamo rit a17',type:'A',i:16},
{n:'A18',t:'SHALOM',c:'È la mia che io ti dò, è la mia pace che io ti dò \nè la mia pace che io ti dò \nla stessa pace che il Signore mi dà \n \nSHALOM, SHALOM, SHALOM, \nPACE A TE. \nSHALOM, SHALOM, SHALOM, \nPACE A TE. \n \nÈ il mio amore .. \n \nÈ la mia gioia .. \n \nÈ il mio cuore ..',s:'shalom e la mia che io ti do e la mia pace che io ti do e la mia pace che io ti do la stessa pace che il signore mi da shalom shalom shalom pace a te shalom shalom shalom pace a te e il mio amore e la mia gioia e il mio cuore a18',type:'A',i:17},
{n:'A19',t:'GERICO LE TUE MURA CROLLERANNO',c:'GERICO LE TUE MURA CROLLERANNO, \nGERICO LE TUE MURA CROLLERANNO, \nGERICO LE TUE MURA CROLLERANNO, \nLA TROMBA DEL SIGNORE SUONERÀ, \nLA GLORIA DEL SIGNORE SPLENDERÀ. \n \nL’amore del Signore è su di noi, \nla mano del Signore vincerà, \nla luce del Signore brillerà, \nla forza del Signore ha vinto già. (RIT) \n \nfinale GERICO.',s:'gerico le tue mura crolleranno gerico le tue mura crolleranno gerico le tue mura crolleranno gerico le tue mura crolleranno la tromba del signore suonera la gloria del signore splendera l amore del signore e su di noi la mano del signore vincera la luce del signore brillera la forza del signore ha vinto gia rit finale gerico a19',type:'A',i:18},
{n:'A20',t:'PACE IN TE SIGNOR',c:'Pace in te Signor, \npace in te Signor, \nil mio riposo è in te, \ngloria a te, Signor \n \nCUSTODISCIMI O DIO, \nNON PRIVARMI DEL TUO AMOR, \nMIA POTENTE SALVEZZA, \nNESSUN MAL, TEMERÒ. \n \nLuce è in te Signor, \nluce è in te Signor, \nil mio riposo è in te, \ngloria a te, Signor. (RIT) \n \nGioia è in te Signor, \ngioia è in te Signor, \nil mio riposo è in te, \ngloria a te, Signor. (RIT)',s:'pace in te signor pace in te signor pace in te signor il mio riposo e in te gloria a te signor custodiscimi o dio non privarmi del tuo amor mia potente salvezza nessun mal temero luce e in te signor luce e in te signor il mio riposo e in te gloria a te signor rit gioia e in te signor gioia e in te signor il mio riposo e in te gloria a te signor rit a20',type:'A',i:19},
{n:'A21',t:'PER LA TUA GLORIA',c:'Io ti dono la mia vita o Signor, \ntrasformala se vuoi, per la tua gloria, \ntrasformala se vuoi, nella tua vita, \nfà che possa amare, \nfà che possa amare, \nfà che possa amar come ami tu. \n \nIo ti dono le mie mani … \n\n \nIo ti dono il mio cuore …',s:'per la tua gloria io ti dono la mia vita o signor trasformala se vuoi per la tua gloria trasformala se vuoi nella tua vita fa che possa amare fa che possa amare fa che possa amar come ami tu io ti dono le mie mani io ti dono il mio cuore a21',type:'A',i:20},
{n:'A22',t:'ALLA TUA MENSA',c:'Tu ci inviti alla tua mensa \ne ci doni il pane e vino. \nCol tuo Corpo e col tuo Sangue \ntu ti offri per amore. \n \nVITA NUOVA ABBIAMO IN TE, SIGNOR \nLA SALVEZZA È SOLO IN TE, SIGNOR \nE AL BANCHETTO DEL TUO REGNO \nCON I SANTI NOI VERREMO. \n \nSull\'altare tu ti immoli \ncome agnello senza colpa. \nBuon pastore ci raduni \ne dimori in mezzo a noi (RIT)',s:'alla tua mensa tu ci inviti alla tua mensa e ci doni il pane e vino col tuo corpo e col tuo sangue tu ti offri per amore vita nuova abbiamo in te signor la salvezza e solo in te signor e al banchetto del tuo regno con i santi noi verremo sull altare tu ti immoli come agnello senza colpa buon pastore ci raduni e dimori in mezzo a noi rit a22',type:'A',i:21},
{n:'A23',t:'RICEVERÒ IL TUO AMORE',c:'Nella santità, del Tuo amore, \nnella Santità, del Tuo splendore, \nio mi prostrerò alla Tua presenza \ne riceverò il Tuo amore. (2v) \n \nIo mi prostrerò alla Tua presenza \ne riceverò il Tuo amore. \nE riceverò il tuo amore.',s:'ricevero il tuo amore nella santita del tuo amore nella santita del tuo splendore io mi prostrero alla tua presenza e ricevero il tuo amore 2v io mi prostrero alla tua presenza e ricevero il tuo amore e ricevero il tuo amore a23',type:'A',i:22},
{n:'A24',t:'RE DI GLORIA',c:'Ho incontrato Te Gesù \ne ogni cosa in me è cambiata \ntutta la mia vita ora ti appartiene \ntutto il mio passato \nio lo affido a Te \nGesù Re di gloria mio Signor. \n \nTutto in Te riposa, \nla mia mente il mio cuore \ntrovo pace in Te Signor, \nTu mi dai la gioia \nvoglio stare insieme a Te, \nnon lasciarti mai \nGesù Re di gloria mio Signor \n\n \n \nDAL TUO AMORE CHI MI SEPARERÀ \nSULLA CROCE HAI DATO LA VITA PER ME \nUNA CORONA DI GLORIA MI DARAI \nQUANDO UN GIORNO TI VEDRÒ. \n \nTutto in Te riposa, \nla mia mente il mio cuore \ntrovo pace in Te Signor, \nTu mi dai la gioia \nvoglio stare insieme a Te, \nnon lasciarti mai \nGesù Re di gloria mio Signor.. \n \nDAL TUO AMORE CHI MI SEPARERÀ \nSULLA CROCE HAI DATO LA VITA PER ME \nUNA CORONA DI GLORIA MI DARAI \nQUANDO UN GIORNO TI VEDRÒ. \n \n(RIT. 2 volte) e (finale) \n \nIO TI ASPETTO MIO SIGNOR \nIO TI ASPETTO MIO SIGNOR \nIO TI ASPETTO MIO RE',s:'re di gloria ho incontrato te gesu e ogni cosa in me e cambiata tutta la mia vita ora ti appartiene tutto il mio passato io lo affido a te gesu re di gloria mio signor tutto in te riposa la mia mente il mio cuore trovo pace in te signor tu mi dai la gioia voglio stare insieme a te non lasciarti mai gesu re di gloria mio signor dal tuo amore chi mi separera sulla croce hai dato la vita per me una corona di gloria mi darai quando un giorno ti vedro tutto in te riposa la mia mente il mio cuore trovo pace in te signor tu mi dai la gioia voglio stare insieme a te non lasciarti mai gesu re di gloria mio signor dal tuo amore chi mi separera sulla croce hai dato la vita per me una corona di gloria mi darai quando un giorno ti vedro rit 2 volte e finale io ti aspetto mio signor io ti aspetto mio signor io ti aspetto mio re a24',type:'A',i:23},
{n:'A25',t:'SPIRITO SANTO CUORE DELL’ UMANITÀ',c:'Spirito Santo, scendi su di noi,  \ncon la Tua grazia riempi i nostri cuor,  \ncon la Tua forza rialza i figli tuoi,  \nsolo Tu sei il Consolator.  \n \nSPIRITO SANTO  \nCUORE DELL\'UMANITÀ  \nVIENI E DONACI UNITÀ  \nSPIRITO SANTO  \nFUOCO CHE SEMPRE BRUCERÀ  \nVIENI E INFIAMMA TUTTI NOI  \n \nTocca le labbra, fa\' che parlino di Te,  \ntocca questi occhi per vedere il nostro Re.  \nfa\' che ascoltiamo la tua voce, o Signor,  \n\nnel nostro cuore l\'amore sarà  \n \nSPIRITO SANTO  \nCUORE DELL\'UMANITÀ  \nVIENI E DONACI UNITÀ  \nSPIRITO SANTO  \nFUOCO CHE SEMPRE BRUCERÀ  \nVIENI E INFIAMMA TUTTI NOI.',s:'spirito santo cuore dell umanita spirito santo scendi su di noi con la tua grazia riempi i nostri cuor con la tua forza rialza i figli tuoi solo tu sei il consolator spirito santo cuore dell umanita vieni e donaci unita spirito santo fuoco che sempre brucera vieni e infiamma tutti noi tocca le labbra fa che parlino di te tocca questi occhi per vedere il nostro re fa che ascoltiamo la tua voce o signor nel nostro cuore l amore sara spirito santo cuore dell umanita vieni e donaci unita spirito santo fuoco che sempre brucera vieni e infiamma tutti noi a25',type:'A',i:24},
{n:'A26',t:'O MADRE DEL SIGNORE',c:'O Madre del Signore, \naccogli i tuoi figli  \ne svelaci il volto del Signor.  \nVestita sei di sole, \nsul capo una corona,  \ndifendi noi tuoi figli, \nproteggi i nostri cuori. \n \nO Vergine gloriosa, \nsei stella tra le stelle  \nche brilla più di tutte \nsu nel ciel.  \nFeconda sei di grazie, \nci doni il Salvatore.  \nMaestra sei d’amore, \ndi gioia e di umiltà.',s:'o madre del signore o madre del signore accogli i tuoi figli e svelaci il volto del signor vestita sei di sole sul capo una corona difendi noi tuoi figli proteggi i nostri cuori o vergine gloriosa sei stella tra le stelle che brilla piu di tutte su nel ciel feconda sei di grazie ci doni il salvatore maestra sei d amore di gioia e di umilta a26',type:'A',i:25},
{n:'A27',t:'L’AMORE DEL PADRE',c:'Ecco il momento e l’ora Signore, \noggi Ti voglio incontrare \ne ritornare nella Tua casa \nper restare insieme a Te. \nNon sono degno, questo lo so, \ndi esser chiamato Tuo figlio, \nIl mio peccato è sempre innanzi a me \nma confido nel Tuo amore. \n \nO Signor, ecco il mio cuore \nvoglio donarlo a Te, \nTi darò la mia povertà, \ne tutto quel che ho. \nCon amore mi abbraccerai \ne farai festa per me, \nse con forza io griderò, \nPadre io voglio il Tuo amor. \n\n(finale x3)',s:'l amore del padre ecco il momento e l ora signore oggi ti voglio incontrare e ritornare nella tua casa per restare insieme a te non sono degno questo lo so di esser chiamato tuo figlio il mio peccato e sempre innanzi a me ma confido nel tuo amore o signor ecco il mio cuore voglio donarlo a te ti daro la mia poverta e tutto quel che ho con amore mi abbraccerai e farai festa per me se con forza io gridero padre io voglio il tuo amor finale x3 a27',type:'A',i:26},
{n:'A28',t:'GESÙ E LA SAMARITANA',c:'Sono qui conosco il tuo cuore, \ncon acqua viva Ti disseterò. \nSono io oggi cerco te, \ncuore a cuore ti parlerò. \nNessun male più ti colpirà, \nil tuo Dio non dovrai temere…. \nSe la mia legge in te scriverò. \nAl mio cuore ti fidanzerò…. \nE mi adorerai in Spirito e Verità….. \n \n(tutto 2 volte)',s:'gesu e la samaritana sono qui conosco il tuo cuore con acqua viva ti dissetero sono io oggi cerco te cuore a cuore ti parlero nessun male piu ti colpira il tuo dio non dovrai temere se la mia legge in te scrivero al mio cuore ti fidanzero e mi adorerai in spirito e verita tutto 2 volte a28',type:'A',i:27},
{n:'A29',t:'DAVANTI A QUESTO AMORE',c:'Hai disteso le tue braccia \nanche per me Gesù, \ndal tuo cuore, come fonte, \nhai versato pace in me, \ncerco ancora il mio peccato ma non c\'è. \nTu da sempre vinci il mondo \ndal tuo trono di dolore. \n \nDIO, MIA GRAZIA, MIA SPERANZA, \nRICCO E GRANDE REDENTORE. \nTU, RE UMILE E POTENTE, \nRISORTO PER AMORE, \nRISORGI PER LA VITA. \n \nVERO AGNELLO SENZA MACCHIA, \nMITE E FORTE SALVATORE SEI. \nTU, RE POVERO E GLORIOSO \nRISORGI CON POTENZA, \nDAVANTI A QUESTO AMORE \nLA MORTE FUGGIRÀ. \n \n(daccapo)',s:'davanti a questo amore hai disteso le tue braccia anche per me gesu dal tuo cuore come fonte hai versato pace in me cerco ancora il mio peccato ma non c e tu da sempre vinci il mondo dal tuo trono di dolore dio mia grazia mia speranza ricco e grande redentore tu re umile e potente risorto per amore risorgi per la vita vero agnello senza macchia mite e forte salvatore sei tu re povero e glorioso risorgi con potenza davanti a questo amore la morte fuggira daccapo a29',type:'A',i:28},
{n:'A30',t:'DIO HA TANTO AMATO IL MONDO',c:'Oggi viene a te la luce vera, \nquella che illumina ogni uomo. \nSe l\'accoglierai, avrai il potere \n\ndi esser figlio suo \ne grazia su grazia \nnel tuo cuore nascerà. \n \nDIO HA TANTO AMATO IL MONDO \n(DA OFFRIRE GESÙ,) \nPERCHÉ CHIUNQUE CREDA IN LUI \nABBIA LA SALVEZZA. \nCON LO SPIRITO D\'AMORE \nCI HA CHIAMATI ALLA LIBERTÀ. \n \nDIO HA LIBERATO IL MONDO, \nPERCHÉ TU OGGI CREDA IN LUI \nE IN FEDE E IN CARITÀ, \nCON LO SPIRITO D\'AMORE, \nLIBERO PER SEMPRE TU VIVRAI. \n \nOggi viene a te la gioia piena, \nquella che sanerà ogni cuore. \nSe l\'accoglierai, avrai il potere \ndi esser figlio suo, \nlui viene nel mondo \ne il tuo cuore rivivrà. (RIT)',s:'dio ha tanto amato il mondo oggi viene a te la luce vera quella che illumina ogni uomo se l accoglierai avrai il potere di esser figlio suo e grazia su grazia nel tuo cuore nascera dio ha tanto amato il mondo da offrire gesu perche chiunque creda in lui abbia la salvezza con lo spirito d amore ci ha chiamati alla liberta dio ha liberato il mondo perche tu oggi creda in lui e in fede e in carita con lo spirito d amore libero per sempre tu vivrai oggi viene a te la gioia piena quella che sanera ogni cuore se l accoglierai avrai il potere di esser figlio suo lui viene nel mondo e il tuo cuore rivivra rit a30',type:'A',i:29},
{n:'A31',t:'PANE DI VITA',c:'Pane di vita sei,  \nspezzato per tutti noi,  \nchi ne mangia per sempre in te vivrà  \nVeniamo al tuo santo altare,  \nmensa del tuo amore,  \ncome pane vieni in mezzo a noi  \n \nIL TUO CORPO CI SAZIERÀ  \nIL TUO SANGUE CI SALVERÀ  \nPERCHÉ SIGNOR  \nTU SEI MORTO PER AMORE  \nE TI OFFRI OGGI PER NOI.  \n \n(RIT si ripete 2 volte)  \n \nFonte di vita sei,  \nimmensa carità,  \nil tuo sangue ci dona l\'eternità  \nVeniamo al tuo santo altare,  \nmensa del tuo amore,  \ncome vino vieni in mezzo a noi.  \n\n \n(RIT si ripete 2 volte poi finale)  \n \nE TI OFFRI OGGI PER NOI',s:'pane di vita pane di vita sei spezzato per tutti noi chi ne mangia per sempre in te vivra veniamo al tuo santo altare mensa del tuo amore come pane vieni in mezzo a noi il tuo corpo ci saziera il tuo sangue ci salvera perche signor tu sei morto per amore e ti offri oggi per noi rit si ripete 2 volte fonte di vita sei immensa carita il tuo sangue ci dona l eternita veniamo al tuo santo altare mensa del tuo amore come vino vieni in mezzo a noi rit si ripete 2 volte poi finale e ti offri oggi per noi a31',type:'A',i:30},
{n:'A32',t:'ABBÀ MISERICORDIA',c:'Non sono degno di essere qui, \nho abbandonato la tua casa, \nho dissipato i tuoi beni \nPadre ho peccato contro il cielo \ne contro di Te. \n \nABBÀ, MISERICORDIA ABBÀ, \nMISERICORDIA ABBÀ, AB BÀ \nABBÀ, MISERICORDIA ABBÀ, \nMISERICORDIA ABBÀ, ABBÀ, ABBA. \n \nNon sono degno di esser tuo figlio, \nin Gesù Cristo rialzami \ne in Lui ridammi la vita, \nPadre ho peccato contro il cielo \ne contro di Te. (RIT) \n \nNon sono degno del Tuo amore, \nriempi il mio cuore del tuo Spirito, \ninsieme a Te farò festa per sempre, \nPadre ho peccato contro il cielo \ne contro di Te. (RIT)',s:'abba misericordia non sono degno di essere qui ho abbandonato la tua casa ho dissipato i tuoi beni padre ho peccato contro il cielo e contro di te abba misericordia abba misericordia abba ab ba abba misericordia abba misericordia abba abba abba non sono degno di esser tuo figlio in gesu cristo rialzami e in lui ridammi la vita padre ho peccato contro il cielo e contro di te rit non sono degno del tuo amore riempi il mio cuore del tuo spirito insieme a te faro festa per sempre padre ho peccato contro il cielo e contro di te rit a32',type:'A',i:31},
{n:'A33',t:'USAMI SIGNORE',c:'O Signore tocca \nil mio cuore le mie mani, \nvoglio sentirmi usato da te, \ndal tuo Spirito. \nC\'è un regno da costruire, \ne chi soffre lo aspetta: \nè la speranza di un mondo \nche risorgerà. \n \nUsa il mio cuore, \nusa i miei occhi per te. \nFammi strumento \ndi un amore nuovo per noi, \nin un mondo che attende \n\nl\'aurora di luce: \nche nasce da te, \nche muori e risorgi per noi. \n \n \n \nLIBRO NUOVO DIO DELLA  MIA LODE \n  \n001',s:'usami signore o signore tocca il mio cuore le mie mani voglio sentirmi usato da te dal tuo spirito c e un regno da costruire e chi soffre lo aspetta e la speranza di un mondo che risorgera usa il mio cuore usa i miei occhi per te fammi strumento di un amore nuovo per noi in un mondo che attende l aurora di luce che nasce da te che muori e risorgi per noi libro nuovo dio della mia lode 001 a33',type:'A',i:32},
{n:'1',t:'GUARDAMI SIGNOR',c:'Guardami Signor, leggi nel mio cuor. \n sono tuo  figlio, ascoltami!  \n  \nABBA PADRE, ABBA PADRE,  \n  \nABBÀ, ABBÀ, ABBÀ.(x2) \n  \nPiù solo non sarò, a te mi appoggerò.  \nSono tuo figlio, abbracciami! (RIT)  \n  \nPer ogni mio dolor la pace invocherò.  \nSono tuo figlio, guariscimi!  (RIT) \n  \nGrazie a te Signor per questo immenso amor.  \nSiamo tuoi figli, Alleluia!   (RIT)',s:'guardami signor guardami signor leggi nel mio cuor sono tuo figlio ascoltami abba padre abba padre abba abba abba x2 piu solo non saro a te mi appoggero sono tuo figlio abbracciami rit per ogni mio dolor la pace invochero sono tuo figlio guariscimi rit grazie a te signor per questo immenso amor siamo tuoi figli alleluia rit 1',type:'N',i:33},
{n:'2',t:'ACCLAMATE A DIO',c:'ACCLAMATE A DIO DA TUTTA LA TERRA,   \nCANTATE ALLA GLORIA DEL SUO NOME,  \nDATE A LUI SPLENDIDA LODE.   \nSTUPENDE SONO LE SUE OPERE,   \nSTUPENDE SONO LE SUE OPERE.  \n  \nPer la grandezza della sua potenza  \ndavanti a lui si piegano i nemici.  \nA Dio si prostri la terra,  \na lui canti inni, canti al suo Nome  (RIT)  \n  \nIl mare ha cambiato in terra ferma,   \ncon la sua forza regnerà in eterno.  \nDio salva la nostra vita  \nper questo in lui esultiamo di gioia. (RIT) \n \nAcclamate a Dio, \nacclamate a Dio,  \nacclamate a Dio.  \nStupende sono le sue  opere.  \n \n\nVenite, voi tutti che temete Dio,  \ne narrerò quanto per me ha fatto.  \nA lui ho rivolto il mio grido,  \nla mia lingua cantò la sua lode.  \n  \n ACCLAMATE A DIO DA TUTTA LA TERRA,  \nCANTATE ALLA GLORIA DEL SUO NOME,  \n DATE A LUI SPLENDIDA LODE.  \n STUPENDE SONO LE SUE OPERE.  \n  \nOH, OH,  OH,  \n  \nCANTATE ALLA GLORIA DEL SUO NOME,  \nDATE A LUI SPLENDIDA LODE.  \nCANTATE A DIO,CANTATE LE SUE OPERE, \nSTUPENDE SONO LE SUE OPERE.  \nAMEN, AMEN, AMEN.',s:'acclamate a dio acclamate a dio da tutta la terra cantate alla gloria del suo nome date a lui splendida lode stupende sono le sue opere stupende sono le sue opere per la grandezza della sua potenza davanti a lui si piegano i nemici a dio si prostri la terra a lui canti inni canti al suo nome rit il mare ha cambiato in terra ferma con la sua forza regnera in eterno dio salva la nostra vita per questo in lui esultiamo di gioia rit acclamate a dio acclamate a dio acclamate a dio stupende sono le sue opere venite voi tutti che temete dio e narrero quanto per me ha fatto a lui ho rivolto il mio grido la mia lingua canto la sua lode acclamate a dio da tutta la terra cantate alla gloria del suo nome date a lui splendida lode stupende sono le sue opere oh oh oh cantate alla gloria del suo nome date a lui splendida lode cantate a dio cantate le sue opere stupende sono le sue opere amen amen amen 2',type:'N',i:34},
{n:'3',t:'ACCOGLI NELLA TUA BONTÀ',c:'ACCOGLI NELLA TUA BONTÀ  \nI DONI CHE OGGI NOI TI OFFRIAM  \nE FA\' CHE AL MONDO NOI POSSIAM   \nESSERE SEGNO D\'UNITÀ.  \n  \nNoi ti lodiam  \nper la tua fedeltà,  \nla tua bontà  \nè alta più del ciel.  \nNoi ti doniam  \nla nostra povertà  \nche trasformerai  \nin gioia e carità. (RIT)    \n \nIn te Signore  \nrifugio noi troviam,  \ntu sei per noi  \nvia, vita e verità.  \nRavviva in noi  \nla fiamma del tuo amor,  \ncon la gioia che  \ntu solo sai donar (RIT)',s:'accogli nella tua bonta accogli nella tua bonta i doni che oggi noi ti offriam e fa che al mondo noi possiam essere segno d unita noi ti lodiam per la tua fedelta la tua bonta e alta piu del ciel noi ti doniam la nostra poverta che trasformerai in gioia e carita rit in te signore rifugio noi troviam tu sei per noi via vita e verita ravviva in noi la fiamma del tuo amor con la gioia che tu solo sai donar rit 3',type:'N',i:35},
{n:'4',t:'ADESSO TU SEI QUI',c:'Adesso tu sei qui Signore,  \nqui nel mio cuore.  \n\nMi dici parole nuove,  \nparole d\'amore.  \n  \nNON HO CHE TE,   \nVIVO E MUOIO PER TE.  \nCOME FAI A NON VEDERMI SE  \nIO RISORGO IN TE.  \n  \nAdesso tu sei qui Signore,  \nsono assetato d\'amore.  \nCercavo qualcosa d\'amare,  \nhai squarciato il tuo cuore. (RIT)  \n  \nAdesso tu sei qui Signore,  \nio come fiume nel mare.  \nNel Signore voglio sperare,  \nho bisogno d\'amare. (RIT)   \n  \nAdesso tu sei qui Signore,  \nsei la quiete nel silenzio.  \nSei la pace, la gioia, l\'armonia,  \nsei tu la mia fiducia. (RIT)   \n  \nNON HO CHE TE,  \nVIVO E MUOIO PER TE.   \nCOME FAI A  NON VEDERMI SE  \nIO VIVO IN TE.',s:'adesso tu sei qui adesso tu sei qui signore qui nel mio cuore mi dici parole nuove parole d amore non ho che te vivo e muoio per te come fai a non vedermi se io risorgo in te adesso tu sei qui signore sono assetato d amore cercavo qualcosa d amare hai squarciato il tuo cuore rit adesso tu sei qui signore io come fiume nel mare nel signore voglio sperare ho bisogno d amare rit adesso tu sei qui signore sei la quiete nel silenzio sei la pace la gioia l armonia sei tu la mia fiducia rit non ho che te vivo e muoio per te come fai a non vedermi se io vivo in te 4',type:'N',i:36},
{n:'5',t:'AD UNA VOCE',c:'Con un cuore solo,  \nfigli dello stesso Padre  \nvogliamo vivere Signore.  \nCon un cuore solo,  \nfigli dello stesso Padre  \nper adorare  te.  \n  \nA TE GRIDIAMO ABBA,  \n \nRENDICI UNO IN TE   \nCON IL TUO SANTO SPIRITO.  \nA TE GRIDIAMO ABBA,  \n \nRENDICI UNO IN TE   \nCON IL TUO SANTO SPIRITO,  \nCANTEREMO A TE  \nAD UNA VOCE.  \nNel tuo nome Padre  \nfacci segno del tuo amore,  \n\nperché il mondo creda in te.  \nNel tuo nome Padre  \nfacci segno del tuo amore,  \nper annunciare te.  (RIT) \n  \nCon un cuore solo,  \nfigli dello stesso Padre  \nper adorare te. (RIT) \n  \nCon un cuore solo, \ncon un cuore solo, con un cuore solo,  \nCon un cuore solo, con un cuore solo.',s:'ad una voce con un cuore solo figli dello stesso padre vogliamo vivere signore con un cuore solo figli dello stesso padre per adorare te a te gridiamo abba rendici uno in te con il tuo santo spirito a te gridiamo abba rendici uno in te con il tuo santo spirito canteremo a te ad una voce nel tuo nome padre facci segno del tuo amore perche il mondo creda in te nel tuo nome padre facci segno del tuo amore per annunciare te rit con un cuore solo figli dello stesso padre per adorare te rit con un cuore solo con un cuore solo con un cuore solo con un cuore solo con un cuore solo 5',type:'N',i:37},
{n:'6',t:'AGNELLO DI DIO (Comunità Shalom)',c:'Agnello di Dio  \nche togli i peccati del mondo  \nabbi pietà di noi.  (x2)  \n  \nAgnello di Dio  \nche togli i peccati del mondo   \ndona a noi la pace.  \n  \nL\'Agnello immolato per noi   \nè  degno di onore e di gloria.',s:'agnello di dio comunita shalom agnello di dio che togli i peccati del mondo abbi pieta di noi x2 agnello di dio che togli i peccati del mondo dona a noi la pace l agnello immolato per noi e degno di onore e di gloria 6',type:'N',i:38},
{n:'7',t:'AGNELLO DI DIO',c:'Agnello di Dio  \nche togli i peccati del mondo,  \nabbi pietà di noi. (x2) \n \n   \nAgnello di Dio  \nche togli i peccati del mondo,   \ndona a noi la pace.',s:'agnello di dio agnello di dio che togli i peccati del mondo abbi pieta di noi x2 agnello di dio che togli i peccati del mondo dona a noi la pace 7',type:'N',i:39},
{n:'8',t:'AI PIEDI DI GESÙ',c:'Signore sono qui ai tuoi piedi,  \nSignore voglio amare te.  \nSignore sono qui ai tuoi piedi,   \nSignore voglio amare te.  \n  \nACCOGLIMI, PERDONAMI,  \n\nLA TUA GRAZIA INVOCO SU DI ME.  \nLIBERAMI,GUARISCIMI  \nE IN TE RISORTO PER SEMPRE IO VIVRÒ!  \n  \nSignore sono qui ai tuoi piedi,  \nSignore chiedo forza a te.   \nSignore sono qui ai tuoi piedi,  \nSignore chiedo forza a te. (RIT) \nSignore sono qui ai tuoi piedi,  \nSignore dono il cuore a te.   \nSignore sono qui ai tuoi piedi,  \nSignore dono il cuore a te. (RIT)',s:'ai piedi di gesu signore sono qui ai tuoi piedi signore voglio amare te signore sono qui ai tuoi piedi signore voglio amare te accoglimi perdonami la tua grazia invoco su di me liberami guariscimi e in te risorto per sempre io vivro signore sono qui ai tuoi piedi signore chiedo forza a te signore sono qui ai tuoi piedi signore chiedo forza a te rit signore sono qui ai tuoi piedi signore dono il cuore a te signore sono qui ai tuoi piedi signore dono il cuore a te rit 8',type:'N',i:40},
{n:'9',t:'ALABARE\' / TI LODERO’',c:'ALABARÉ,  ALABARÉ,  \nALABARÉ A MI SENOR.  (x2)  \nTI LODERÒ, TI LODERÒ,  \nTI LODERÒ O MIO SIGNOR. (x2)  \n  \nHo visto il numero di tutti i redenti  \nche insieme lodavano il Signor.  \nAlcuni pregavan, altri cantavan  \ne tutti lodavano il Signor. (RIT)  \n \nNon c\'è Dio grande come te,  \nno, non c\'è; no, non c\'è. (x2) \nNon c\'è Dio che possa far le cose  \ncome quelle che fai tu. (x2)  \n  \nNé con la spada, né con gli eserciti  \nma col suo Santo Spirito. (x2)   \nPersino i monti si muoveran... (x3)  \nma col suo Santo Spirito! (RIT) \n  \nE anche l\'Italia si salverà ... (x3)  \n \nE anche noi ci salverem ... (x3)',s:'alabare ti lodero alabare alabare alabare a mi senor x2 ti lodero ti lodero ti lodero o mio signor x2 ho visto il numero di tutti i redenti che insieme lodavano il signor alcuni pregavan altri cantavan e tutti lodavano il signor rit non c e dio grande come te no non c e no non c e x2 non c e dio che possa far le cose come quelle che fai tu x2 ne con la spada ne con gli eserciti ma col suo santo spirito x2 persino i monti si muoveran x3 ma col suo santo spirito rit e anche l italia si salvera x3 e anche noi ci salverem x3 9',type:'N',i:41},
{n:'10',t:'ALLA DOLCE PRESENZA TUA SIGNOR',c:'Alla dolce presenza tua Signor  \nil Nome tuo santo adoriam.  \nAlla dolce presenza tua Signor  \nil Nome tuo santo adoriam,  \n\n \nil tuo Nome Gesù,  \nil Nome che pari non ha,  \nil tuo Nome Gesù,  \nil Nome che pari non ha.',s:'alla dolce presenza tua signor alla dolce presenza tua signor il nome tuo santo adoriam alla dolce presenza tua signor il nome tuo santo adoriam il tuo nome gesu il nome che pari non ha il tuo nome gesu il nome che pari non ha 10',type:'N',i:42},
{n:'11',t:'ALLA TUA PRESENZA',c:'Alla tua presenza portaci Signor,  \nnei tuoi atri noi vogliamo dimorar.  \nNel tuo tempio intoneremo inni a te,  \ncanti di lode alla tua  maestà.  \n \nIl tuo Santo Spirito ci guidi là dove sei tu,  \nalla tua presenza Signore Gesù.  \nIn eterno canteremo gloria a te, Signor.  \n \nAlla tua presenza,  \nalla tua presenza...  \nper sempre insieme a te Gesù.  \n \n(da capo)',s:'alla tua presenza alla tua presenza portaci signor nei tuoi atri noi vogliamo dimorar nel tuo tempio intoneremo inni a te canti di lode alla tua maesta il tuo santo spirito ci guidi la dove sei tu alla tua presenza signore gesu in eterno canteremo gloria a te signor alla tua presenza alla tua presenza per sempre insieme a te gesu da capo 11',type:'N',i:43},
{n:'12',t:'ALLELU',c:'Allelu allelu allelu alleluia,  \nGloria al Signor.  (x2)  \n \nGloria al Signor, alleluia,  \nGloria al Signor, alleluia,   \nGloria al Signor, alleluia,  \nGloria al Signor.  \nAllelu, allelu, allelu, alleluia,  \nCristo è Signor. (x2)  \nCristo è Signor, alleluia,  (x3)  \nCristo è Signor.  \n  \nAllelu, allelu, allelu, alleluia,  \nSpirito è amor. (x2)  \nSpirito è amor, alleluia, (x3)  \nSpirito è amor.',s:'allelu allelu allelu allelu alleluia gloria al signor x2 gloria al signor alleluia gloria al signor alleluia gloria al signor alleluia gloria al signor allelu allelu allelu alleluia cristo e signor x2 cristo e signor alleluia x3 cristo e signor allelu allelu allelu alleluia spirito e amor x2 spirito e amor alleluia x3 spirito e amor 12',type:'N',i:44},
{n:'13',t:'ALLELUIA',c:'Alle alle alleluia,   \nalle alle alleluia,    \nalle alleluia,  \n\nalleluia alleuia.',s:'alleluia alle alle alleluia alle alle alleluia alle alleluia alleluia alleuia 13',type:'N',i:45},
{n:'14',t:'ALLELUIA A COLUI CHE RISUSCITÒ',c:'ALLELUIA, ALLELUIA  \nA COLUI CHE RISUSCITÒ.  \nALLELUIA, ALLELUIA,   \nGLORIA AL NOME DI GESÙ.  \n  \nCristo è il Signor  \ndel mondo intero;  \nGesù è il Re del creato. (RIT) \n  \nPortiamo a tutti il suo Vangelo:  \nGesù è morto e risorto (RIT) \n  \nCon Cristo, morti sulla croce,  \nda lui avremo la vita. (RIT)   \n  \n Dio  effonde la sua pace,  \nche ogni uomo attende. (RIT) \n \nLode al Padre e al Figlio  \ne allo Spirito. Amen! (RIT)',s:'alleluia a colui che risuscito alleluia alleluia a colui che risuscito alleluia alleluia gloria al nome di gesu cristo e il signor del mondo intero gesu e il re del creato rit portiamo a tutti il suo vangelo gesu e morto e risorto rit con cristo morti sulla croce da lui avremo la vita rit dio effonde la sua pace che ogni uomo attende rit lode al padre e al figlio e allo spirito amen rit 14',type:'N',i:46},
{n:'15',t:'ALLELUIA AL RENDENTORE',c:'ALLELUIA, ALLELUIA, ALLELUIA,  \nALLELUIA, ALLELUIA, ALLELUIA.  \n \nGesù è nato tra gli uomini,  \nvenite adoriamo il nostro Signor.    \nEgli è la stella che illumina i popoli,  \nè il nostro Redentor. (RIT)  \n  \nGloria in terra e nell\'alto dei cieli,   \nsia pace a coloro che amano Dio.   \nOggi si compie l\'antica promessa,  \nnasce il Salvator. (RIT) \n  \n\nOggi un figlio ci è stato donato:  \nE’ il servo fedele mandato dal Padre.   \nStabilirà la giustizia e la pace,  \nper sempre regnerà. (RIT)',s:'alleluia al rendentore alleluia alleluia alleluia alleluia alleluia alleluia gesu e nato tra gli uomini venite adoriamo il nostro signor egli e la stella che illumina i popoli e il nostro redentor rit gloria in terra e nell alto dei cieli sia pace a coloro che amano dio oggi si compie l antica promessa nasce il salvator rit oggi un figlio ci e stato donato e il servo fedele mandato dal padre stabilira la giustizia e la pace per sempre regnera rit 15',type:'N',i:47},
{n:'16',t:'ALLELUIA! AL SIGNORE CHE REGNA',c:'ALLELUIA! AL SIGNORE CHE REGNA  \nSIA LODE. AMEN!  (x2)  \n  \nCantiam con gioia ed esultiam,  \nal suo nome  \nsanto diam gloria! (RIT) \n  \nBenedizione, potenza e onor  \na Cristo, agnello immolato! (RIT) \n  \nSia lode a lui: è il Salvator,  \nperché è degno di ogni nostro canto. (RIT)',s:'alleluia al signore che regna alleluia al signore che regna sia lode amen x2 cantiam con gioia ed esultiam al suo nome santo diam gloria rit benedizione potenza e onor a cristo agnello immolato rit sia lode a lui e il salvator perche e degno di ogni nostro canto rit 16',type:'N',i:48},
{n:'17',t:'ALLELUIA AL SIGNORE DEI CIELI',c:'Lodate il Signore che è nei cieli,  \nlodate le sue meraviglie.  \nLodate il Signore che è nei cieli,  \nlodatelo perché è qui.  \n  \nALLELUIA, ALLELUIA  \nAL SIGNORE DEI CIELI,  \nALLELUIA, ALLELUIA  \nAL SIGNORE DEI CIELI.  \n  \nLodate il Signore che è nei cieli,   \nlodate le sue meraviglie.  \nLodate il Signore che è nei cieli,  \nlodate la sua bontà. (RIT)   \n  \nCantate al Signore che viene in terra,   \ncantate la sua presenza.  \nCantate al Signore che viene in terra,  \ncantate perché è qui. (RIT)   \nGioite al Signore che ci perdona,   \ngioite alla sua carità.  \nGioite al Signore che ci perdona,  \ngioite è il Redentor. (RIT)  \n\n \nALLELUIA, ALLELUIA  \nAL SIGNORE DEI CIELI,  \nALLELUIA, ALLELUIA  \nAL SIGNORE DEI CIELI.  \n \nParlate al Signore che tutti ama,   \nparlate al suo cuore grande.  \nParlate al Signore che tutti ama,  \nparlate vi ascolterà. (RIT) \n  \nDanzate al Signore che ci protegge,   \ndanzate sicuri di lui.  \nDanzate al Signore che ci protegge,  \ndanzate è nostro Padre. (RIT)',s:'alleluia al signore dei cieli lodate il signore che e nei cieli lodate le sue meraviglie lodate il signore che e nei cieli lodatelo perche e qui alleluia alleluia al signore dei cieli alleluia alleluia al signore dei cieli lodate il signore che e nei cieli lodate le sue meraviglie lodate il signore che e nei cieli lodate la sua bonta rit cantate al signore che viene in terra cantate la sua presenza cantate al signore che viene in terra cantate perche e qui rit gioite al signore che ci perdona gioite alla sua carita gioite al signore che ci perdona gioite e il redentor rit alleluia alleluia al signore dei cieli alleluia alleluia al signore dei cieli parlate al signore che tutti ama parlate al suo cuore grande parlate al signore che tutti ama parlate vi ascoltera rit danzate al signore che ci protegge danzate sicuri di lui danzate al signore che ci protegge danzate e nostro padre rit 17',type:'N',i:49},
{n:'18',t:'ALLELUIA ALLELUIA ALLELUIA',c:'ALLELUIA, ALLELUIA, ALLELUIA!  \nALLELUIA, ALLELUIA, ALLELUIA!  \n  \nLodate il Signore  \ne invocate il suo Nome,  \nproclamate tra i popoli  \nle sue opere. (RIT) \n  \nCantate a lui con canti di gioia,   \ngioite nel Signore.  \nRicordate le sue meraviglie,  \negli è il nostro Dio. (RIT)  \n  \nLodate il Signore popoli tutti,   \nvoi tutte nazioni dategli gloria,  \nperché forte è il suo amore per noi,  \neterna è la sua fedeltà. (RIT)  \n  \nLo lodi il sole, lo lodi la luna,   \nlodatelo voi stelle del cielo.   \nLo lodino i cieli e le acque,  \ntutta la terra canti a Dio. (RIT)',s:'alleluia alleluia alleluia alleluia alleluia alleluia alleluia alleluia alleluia lodate il signore e invocate il suo nome proclamate tra i popoli le sue opere rit cantate a lui con canti di gioia gioite nel signore ricordate le sue meraviglie egli e il nostro dio rit lodate il signore popoli tutti voi tutte nazioni dategli gloria perche forte e il suo amore per noi eterna e la sua fedelta rit lo lodi il sole lo lodi la luna lodatelo voi stelle del cielo lo lodino i cieli e le acque tutta la terra canti a dio rit 18',type:'N',i:50},
{n:'19',t:'ALLELUIA, CRISTO È RISORTO',c:'ALLELUIA, CRISTO È RISORTO,  \nGLORIA A TE SIGNOR  \nALLELUIA, CRISTO È RISORTO,   \n\nGLORIA A TE SIGNOR.  \n  \nSono la vite e voi i miei tralci   \ne il Padre è il vignaiolo,    \nse uno rimane nel mio amor   \nmolto frutto farà. (RIT)   \nSono il pane disceso dal cielo,   \nchi viene a me non ha più fame   \ne chiunque crede in me  \nsete più non avrà. (RIT)  \n  \nSono la vita,  \nla Risurrezione,   \nchiunque crede in me,  \nanche se morrà in eterno vivrà. (RIT)  \n  \nChi crede in me  \nfarà le stesse cose che ho fatto io,   \nanzi, di più grandi ne farà  \nper la gloria del Padre. (RIT) \n  \n Chiedete  al Padre: di certo vi darà,   \ncercate e troverete,  \nbussate ed egli è alla porta,  \ndi certo vi aprirà. (RIT)  \n  \nSe uno domanda nel mio nome  \ncerto con fiducia e possedesse anche  \nun briciolo di fede  \nle montagne sposterà. (RIT)  \n  \nOgni ginocchio si pieghi  \nnei cieli, in terra e in ogni luogo   \ned ogni lingua lo proclami  \nche Gesù è il Signor. (RIT)',s:'alleluia cristo e risorto alleluia cristo e risorto gloria a te signor alleluia cristo e risorto gloria a te signor sono la vite e voi i miei tralci e il padre e il vignaiolo se uno rimane nel mio amor molto frutto fara rit sono il pane disceso dal cielo chi viene a me non ha piu fame e chiunque crede in me sete piu non avra rit sono la vita la risurrezione chiunque crede in me anche se morra in eterno vivra rit chi crede in me fara le stesse cose che ho fatto io anzi di piu grandi ne fara per la gloria del padre rit chiedete al padre di certo vi dara cercate e troverete bussate ed egli e alla porta di certo vi aprira rit se uno domanda nel mio nome certo con fiducia e possedesse anche un briciolo di fede le montagne spostera rit ogni ginocchio si pieghi nei cieli in terra e in ogni luogo ed ogni lingua lo proclami che gesu e il signor rit 19',type:'N',i:51},
{n:'20',t:'ALLELUIA, GESÙ È IL RE',c:'Alleluia                 Alleluia    \nAlleluia                 Alleluia                     \nGesù è                 Gesù è \nil Signor                il Signor \nAlleluia Gesù è il Signor.  \n \nAlleluia                 Alleluia    \nAlleluia                 Alleluia                     \n\nGesù è il Re        Gesù è il Re \nGesù è il Re        Gesù è il Re \nAlleluia Gesù è il Re  \n  \nAlleluia                Alleluia Gesù è Il Signor  \nAlleluia                Alleluia Gesù è il Signor.  \nGesù è il Re        Gesù è il Re  \nAlleluia Gesù è il Re.  \n  \nAlleluia                 Alleluia Gesù è il Signor.  \nAlleluia                 Alleluia Gesù è il Signor    \nGesù è                 Gesù è \nil Signor                il Signor \nAlleluia Gesù è il Signor.  \n  \n \nAlleluia                   Alleluia Gesù è il Signor   \nAlleluia                   Alleluia Gesù è il Signor  \nGesù è il Re           Gesù è il Re.  \nAlleluia Gesù è  il Re  \n \nAlleluia Gesù è il Re \n  \n  \n021',s:'alleluia gesu e il re alleluia alleluia alleluia alleluia gesu e gesu e il signor il signor alleluia gesu e il signor alleluia alleluia alleluia alleluia gesu e il re gesu e il re gesu e il re gesu e il re alleluia gesu e il re alleluia alleluia gesu e il signor alleluia alleluia gesu e il signor gesu e il re gesu e il re alleluia gesu e il re alleluia alleluia gesu e il signor alleluia alleluia gesu e il signor gesu e gesu e il signor il signor alleluia gesu e il signor alleluia alleluia gesu e il signor alleluia alleluia gesu e il signor gesu e il re gesu e il re alleluia gesu e il re alleluia gesu e il re 021 20',type:'N',i:52},
{n:'21',t:'ALLELUIA GLORIA A DIO',c:'ALLELUIA GLORIA A DIO NEL CIELO  \nE PACE AGLI UOMINI IN TERRA!  \n  \nPadre,  Padre o Padre,  \na te appartiene la gloria,  \nPadre d\'amore. (RIT)  \n  \nGesù, Gesù, Gesù,  \nnoi ti offriamo i cuori,  \ndiletto Figlio di Dio. (RIT) \n  \nSpirito, Spirito Santo,  \nvieni Consolatore  \nad insegnarci la vita. (RIT)   \n  \nALLELUIA GLORIA A DIO NEL CIELO   \nE PACE AGLI UOMINI IN TERRA!  \n  \nALLELUIA GLORIA A DIO NEL CIELO   \nE PACE AGLI UOMINI IN TERRA!  \n \n\nAMEN!',s:'alleluia gloria a dio alleluia gloria a dio nel cielo e pace agli uomini in terra padre padre o padre a te appartiene la gloria padre d amore rit gesu gesu gesu noi ti offriamo i cuori diletto figlio di dio rit spirito spirito santo vieni consolatore ad insegnarci la vita rit alleluia gloria a dio nel cielo e pace agli uomini in terra alleluia gloria a dio nel cielo e pace agli uomini in terra amen 21',type:'N',i:53},
{n:'22',t:'ALLELUIA PADRE MIO',c:'Alleluia Padre mio,  \nperché hai dato a noi Gesù,  \nlo hai mandato nel mondo  \ne lo hai dato a tutti noi.  \nSapevi che lo avremmo  \ncacciato via dal mondo.  \n \nAlleluia Padre mio,  \nnella morte sua son nato.  \nAlleluia Padre mio,  \nnella vita sua io vivo.',s:'alleluia padre mio alleluia padre mio perche hai dato a noi gesu lo hai mandato nel mondo e lo hai dato a tutti noi sapevi che lo avremmo cacciato via dal mondo alleluia padre mio nella morte sua son nato alleluia padre mio nella vita sua io vivo 22',type:'N',i:54},
{n:'23',t:'ALLELUIA salmo 118',c:'ALLELUIA, ALLELU ALLELUIA,  \nALLELUIA, ALLELUIA!   \nALLELUIA, ALLELU ALLELUIA,   \nALLELUIA, ALLELUIA!  \n  \nlo credo nel tuo amor, spero nella tua bontà.  \nLa tua legge amerò,  Dio di santità. (RIT)   \nFedele è il tuo amor e il tuo aiuto.  \nSenza fine canterò la tua fedeltà. (RIT) \n  \nTu sei mia roccia, mia cittadella.  \nTu il mio riposo, mio liberator. (RIT) \n  \nSei tu il mio Salvator, tu il mio Signore.  \nConto sulla tua bontà, Dio di verità. (RIT)  \n  \nPer te io vivrò, per te io canterò  \ne in me opererai la tua volontà. (RIT)',s:'alleluia salmo 118 alleluia allelu alleluia alleluia alleluia alleluia allelu alleluia alleluia alleluia lo credo nel tuo amor spero nella tua bonta la tua legge amero dio di santita rit fedele e il tuo amor e il tuo aiuto senza fine cantero la tua fedelta rit tu sei mia roccia mia cittadella tu il mio riposo mio liberator rit sei tu il mio salvator tu il mio signore conto sulla tua bonta dio di verita rit per te io vivro per te io cantero e in me opererai la tua volonta rit 23',type:'N',i:55},
{n:'24',t:'ALZANO I FIUMI, SIGNORE',c:'ALZANO I FIUMI, SIGNORE,  \nALZANO I FIUMI LA VOCE,  \nALZANO I FIUMI IL LORO FRAGORE.  \nALLELUIA!  \n(x2)  \n \n   \nMa più potente delle voci   \ndi grandi acque,  \n\npiù potente dei flutti del mare,  \npotente nell\'alto è il Signore! (RIT)   \n \nIl Signore si riveste,  \nsi cinge di forza,   \nsaldo è il tuo trono di gloria,  \nda sempre tu regni, Signore! (RIT)  \n \nSono degni di fede  \ni tuoi insegnamenti,   \nla santità della tua casa  \nper tutti i giorni, Signore! (RIT)',s:'alzano i fiumi signore alzano i fiumi signore alzano i fiumi la voce alzano i fiumi il loro fragore alleluia x2 ma piu potente delle voci di grandi acque piu potente dei flutti del mare potente nell alto e il signore rit il signore si riveste si cinge di forza saldo e il tuo trono di gloria da sempre tu regni signore rit sono degni di fede i tuoi insegnamenti la santita della tua casa per tutti i giorni signore rit 24',type:'N',i:56},
{n:'25',t:'ALZATI E RISPLENDI',c:'Alzati e risplendi, ecco la tua luce,   \nè  su te la gloria del Signor. (x2)  \nVolgi i tuoi occhi e guarda lontano,  \nche il tuo cuore palpiti di allegria.  \nEcco i tuoi figli che vengono a te,  \nle tue figlie danzano di gioia.  \n  \nGERUSALEM, GERUSALEM,  \nSPOGLIATI DELLA TUA TRISTEZZA.  \nGERUSALEM, GERUSALEM,  \nCANTA E DANZA AL TUO SIGNOR.  \n  \nMarceranno i popoli alla tua luce  \ned i re vedranno il tuo splendor. (x2) \nStuoli di cammelli ti invaderanno,  \ntesori dal mare affluiranno a te.  \nVerranno da Efa, da Saba e Kedar  \nper lodare il nome del Signor. (RIT) \n  \n \nFigli di stranieri costruiranno le tue mura  \ned i loro re verranno a te.(x2) \nIo farò di te una fonte di gioia,  \ntu sarai chiamata \"Città del Signore\".  \nIl dolore e il lutto finiranno,  \nsarai la mia gloria tra le genti. (RIT)   \n  \nGERUSALEM, GERUSALEM,  \nSPOGLIATI DELLA TUA TRISTEZZA.  \nGERUSALEM, GERUSALEM,  \nCANTA E DANZA AL TUO SIGNOR.',s:'alzati e risplendi alzati e risplendi ecco la tua luce e su te la gloria del signor x2 volgi i tuoi occhi e guarda lontano che il tuo cuore palpiti di allegria ecco i tuoi figli che vengono a te le tue figlie danzano di gioia gerusalem gerusalem spogliati della tua tristezza gerusalem gerusalem canta e danza al tuo signor marceranno i popoli alla tua luce ed i re vedranno il tuo splendor x2 stuoli di cammelli ti invaderanno tesori dal mare affluiranno a te verranno da efa da saba e kedar per lodare il nome del signor rit figli di stranieri costruiranno le tue mura ed i loro re verranno a te x2 io faro di te una fonte di gioia tu sarai chiamata citta del signore il dolore e il lutto finiranno sarai la mia gloria tra le genti rit gerusalem gerusalem spogliati della tua tristezza gerusalem gerusalem canta e danza al tuo signor 25',type:'N',i:57},
{n:'26',t:'AMEN JAHVÈ',c:'AMEN JAHVÈ DI TUTTO CUOR  \nPER LA TUA PAROLA.  \nAMEN, AMEN SIGNOR, CREDO.  \n  \nSu ali d\'aquila ci hai sollevato,  \nabbiam goduto il tuo poter,  \nJahvè tu sei nostro Signor,  \nla tua parola è verità. (RIT)   \nNon hai tenuto segreti  \nnell\'oscurità della terra.  \nLa tua parola splende come il sole,  \nad ogni uomo è verità. (RIT) \n  \nTutte le cose passeranno  \nma non le mie parole.   \nPrima che accada ogni cosa  \nio ti avvertirò. (RIT) \n  \nQuel che prometto mantengo,  \nquel che dico avverrà.  \nSol che tu credi e speri  \nsta\' certo lo vedrai. (RIT)  \n  \nA colui che hai chiamato  \ne formato dalla polvere,  \na colui che hai pensato in eterno  \nhai mostrato la tua sapienza. (RIT)',s:'amen jahve amen jahve di tutto cuor per la tua parola amen amen signor credo su ali d aquila ci hai sollevato abbiam goduto il tuo poter jahve tu sei nostro signor la tua parola e verita rit non hai tenuto segreti nell oscurita della terra la tua parola splende come il sole ad ogni uomo e verita rit tutte le cose passeranno ma non le mie parole prima che accada ogni cosa io ti avvertiro rit quel che prometto mantengo quel che dico avverra sol che tu credi e speri sta certo lo vedrai rit a colui che hai chiamato e formato dalla polvere a colui che hai pensato in eterno hai mostrato la tua sapienza rit 26',type:'N',i:58},
{n:'27',t:'AMO',c:'AMO IL SIGNORE PERCHÉ ASCOLTA  \nIL GRIDO DELLA MIA PREGHIERA.   \nSU DI ME HA STESO LA MANO   \nNEL GIORNO CHE LO CERCAVO.  \n  \nHo invocato il nome del Signore   \ned egli mi ha risposto.   \nBuono e giusto è il nostro Dio,  \nprotegge gli umili e gli oppressi. (RIT) \n  \nAnima mia torna alla tua pace  \nil Signore ti ha ascoltato.  \nHa liberato i tuoi occhi dalle lacrime  \n\ne non sono più caduto. (RIT) \n  \nHo creduto anche quando dicevo  \nsono troppo infelice.  \nChe cosa posso rendere al Signore  \nper quello che mi ha dato. (RIT)  \n \nIl calice della salvezza innalzerò   \ne invocherò il nome tuo Signor.   \nTu lo sai io sono il tuo servo,  \na te offrirò sacrifici. (RIT)',s:'amo amo il signore perche ascolta il grido della mia preghiera su di me ha steso la mano nel giorno che lo cercavo ho invocato il nome del signore ed egli mi ha risposto buono e giusto e il nostro dio protegge gli umili e gli oppressi rit anima mia torna alla tua pace il signore ti ha ascoltato ha liberato i tuoi occhi dalle lacrime e non sono piu caduto rit ho creduto anche quando dicevo sono troppo infelice che cosa posso rendere al signore per quello che mi ha dato rit il calice della salvezza innalzero e invochero il nome tuo signor tu lo sai io sono il tuo servo a te offriro sacrifici rit 27',type:'N',i:59},
{n:'28',t:'ANAMNESI',c:'Annunciamo la tua morte o Signore   \nproclamiamo la tua risurrezione  \nnell\'attesa della tua venuta.',s:'anamnesi annunciamo la tua morte o signore proclamiamo la tua risurrezione nell attesa della tua venuta 28',type:'N',i:60},
{n:'29',t:'APOCALISSE 19,6',c:'ALLELUIA, ALLELUIA.  (x2)  \n  \nHa preso possesso  \ndel suo regno il Signore,  \nil nostro Dio,    \nl\'onnipotente. (RIT) \n \nRallegriamoci  \ned esultiamo,  \nrendiamo a lui,    \na lui la gloria! (RIT) \n \nPerché son giunte  \nle nozze dell\'agnello.  \nLa sua Sposa  \nè già pronta. (RIT) \n  \nLe hanno dato  \nuna veste  \ndi lino puro,  \npuro e splendente. (RIT)',s:'apocalisse 19 6 alleluia alleluia x2 ha preso possesso del suo regno il signore il nostro dio l onnipotente rit rallegriamoci ed esultiamo rendiamo a lui a lui la gloria rit perche son giunte le nozze dell agnello la sua sposa e gia pronta rit le hanno dato una veste di lino puro puro e splendente rit 29',type:'N',i:61},
{n:'30',t:'APPLAUDITE POPOLI TUTTI',c:'APPLAUDITE POPOLI TUTTI,  \nACCLAMATE CON VOCI DI GIOIA.  \nAPPLAUDITE POPOLI TUTTI  \nSÌ!  \nACCLAMATE CON VOCI DI GIOIA.  \n\n  \nPoiché grande Re è il Signore,  \nAltissimo è il suo Nome.  \nCantate inni, cantate al nostro Re. (RIT) \n  \nDio regna sulle nazioni,  \nsiede sul suo trono santo.  \nCantate inni, cantate al nostro Re. (RIT) \n  \nDio è Re di tutta la terra,  \ncantate a lui con arte.  \nCantate inni, cantate al nostro Re. (RIT) \n(coda facoltativa) \n  \nSu cantate, (x7) su cantate con noi.  \nSu cantate, su cantate con noi. (x4)  \nSu cantate, (x3) su cantate con noi.  \nSu cantate, su cantate con noi.  \nSu cantate, su cantate con noi.  \nSu  cantate con noi.',s:'applaudite popoli tutti applaudite popoli tutti acclamate con voci di gioia applaudite popoli tutti si acclamate con voci di gioia poiche grande re e il signore altissimo e il suo nome cantate inni cantate al nostro re rit dio regna sulle nazioni siede sul suo trono santo cantate inni cantate al nostro re rit dio e re di tutta la terra cantate a lui con arte cantate inni cantate al nostro re rit coda facoltativa su cantate x7 su cantate con noi su cantate su cantate con noi x4 su cantate x3 su cantate con noi su cantate su cantate con noi su cantate su cantate con noi su cantate con noi 30',type:'N',i:62},
{n:'31',t:'APRI LE TUE BRACCIA',c:'Hai cercato la libertà lontano,    \nhai trovato la noia e le catene,   \nhai vagato senza via,   \nsolo con la tua fame.  \n  \nAPRI LE TUE BRACCIA,  \nCORRI INCONTRO AL PADRE,  \nOGGI LA SUA CASA  \nSARÀ IN FESTA PER TE. (x2)  \n  \nSe vorrai spezzare le catene  \ntroverai la strada dell\'amore,  \nla tua gioia canterai:  \nquesta è la libertà (RIT) \n \nI tuoi occhi ricercano l\'azzurro,  \nc\'è una casa che aspetta il tuo ritorno  \ne la pace tornerà,  \nquesta è la libertà. (RIT)',s:'apri le tue braccia hai cercato la liberta lontano hai trovato la noia e le catene hai vagato senza via solo con la tua fame apri le tue braccia corri incontro al padre oggi la sua casa sara in festa per te x2 se vorrai spezzare le catene troverai la strada dell amore la tua gioia canterai questa e la liberta rit i tuoi occhi ricercano l azzurro c e una casa che aspetta il tuo ritorno e la pace tornera questa e la liberta rit 31',type:'N',i:63},
{n:'32',t:'A TE ELEVO LA VOCE',c:'A te elevo la voce o Signor,  \na te elevo la voce o Signor,  \na te elevo la voce e glorifico  \nil tuo Nome.  \nA te elevo la voce o Signor.  \n  \nA te innalzo le mani o Signor...   \n \nA te offro la vita o Signor...  \n \nA te canto la lode o Signor...',s:'a te elevo la voce a te elevo la voce o signor a te elevo la voce o signor a te elevo la voce e glorifico il tuo nome a te elevo la voce o signor a te innalzo le mani o signor a te offro la vita o signor a te canto la lode o signor 32',type:'N',i:64},
{n:'33',t:'AVE MARIA',c:'Ave Maria, piena  di  grazia,   \nil Signore è con te.  \nE benedetta  sei fra le donne  \ne benedetto è il frutto  \ndel tuo seno, Gesù.  \n  \n \nSanta Maria, madre di  Dio,  \nprega  per noi   peccatori.  \nAdesso e nell\'ora della nostra morte.  \nCosì sia, ave Maria.',s:'ave maria ave maria piena di grazia il signore e con te e benedetta sei fra le donne e benedetto e il frutto del tuo seno gesu santa maria madre di dio prega per noi peccatori adesso e nell ora della nostra morte cosi sia ave maria 33',type:'N',i:65},
{n:'34',t:'AVE MARIA',c:'Ave Maria piena di grazia, il  Signore è con te.   \nTu sei benedetta fra tutte le donne  \ne benedetto è il frutto del tuo seno Gesù.  \nSanta Maria,  Madre di Dio, \nprega per noi peccatori  \nadesso e nell\'ora della nostra morte.  \nAmen.',s:'ave maria ave maria piena di grazia il signore e con te tu sei benedetta fra tutte le donne e benedetto e il frutto del tuo seno gesu santa maria madre di dio prega per noi peccatori adesso e nell ora della nostra morte amen 34',type:'N',i:66},
{n:'35',t:'AVE O MARIA',c:'Ave o Maria,  \no tu piena di grazia.  \nIl Signore è con te  \ne il frutto del tuo seno è benedetto.  \nMaria madre di Dio,  \no Vergin benedetta.  \n\nIntercedi per noi peccatori  \nadesso e nell\'ora  della morte.',s:'ave o maria ave o maria o tu piena di grazia il signore e con te e il frutto del tuo seno e benedetto maria madre di dio o vergin benedetta intercedi per noi peccatori adesso e nell ora della morte 35',type:'N',i:67},
{n:'36',t:'BENEDETTO IL NOME DEL SIGNOR',c:'Benedetto il nome del Signor,   \negli e degno di ogni lode e onor.   \nInnalziam le nostre mani e adoriam.   \nBenedetto è il Signor, degno di ogni onor,  \nbenedetto il nome del Signor. (x2)',s:'benedetto il nome del signor benedetto il nome del signor egli e degno di ogni lode e onor innalziam le nostre mani e adoriam benedetto e il signor degno di ogni onor benedetto il nome del signor x2 36',type:'N',i:68},
{n:'37',t:'BENEDETTO SEI TU SIGNORE',c:'Padre del cielo, noi t\'amiamo   \ned esaltiam il tuo Nome sulla terra.   \nChe il tuo Regno venga nelle nostre lodi,   \nche il tuo popolo proclami il tuo amor.  \n \nBenedetto sei tu, Signore  \nIddio santo e onnipotente.  \n   \nBenedetto sei  tu, Signore  \nper sempre regnerai!',s:'benedetto sei tu signore padre del cielo noi t amiamo ed esaltiam il tuo nome sulla terra che il tuo regno venga nelle nostre lodi che il tuo popolo proclami il tuo amor benedetto sei tu signore iddio santo e onnipotente benedetto sei tu signore per sempre regnerai 37',type:'N',i:69},
{n:'38',t:'BENEDICIAMO IL SIGNORE',c:'BENEDICIAMO  IL SIGNORE,  \nA LUI ONORE E GLORIA NEI SECOLI !  \n  \nAngeli del Signore benedite il Signore!  \nE voi o cieli benedite il Signore!  \nAcque sopra il cielo benedite il Signore!   \nPotenze del Signore benedite il Signore!  \n  \nSole e luna, benedite il Signore!   \nAstri del cielo, benedite il Signore! \npiogge e rugiade, benedite il Signore!   \no venti tutti benedite il Signore! (RIT) \n \nBENEDICIAMO  IL SIGNORE,  \nA LUI ONORE E GLORIA NEI SECOLI !  \n \nFuoco e calore, benedite il Signore!  \nFreddo e rigore, benedite il Signore!  \nrugiada e brina, benedite il Signore!  \ngelo e freddo, benedite il Signore!   \n\n \nghiacci  e nevi, benedite il Signore!  \nluce e tenebre, benedite il Signore!  \nnotti e giorni, benedite il Signore!  \nlampi e tuoni benedite il Signore!  (RIT) \n  \nTutta la terra benedica il Signore!  \nMonti e colli benedite il Signore!  \nOgni vivente benedica  il Signore!  \nAcque e fonti benedite il Signore!  \n \nMari e fiumi, benedite il Signore!  \nuccelli del cielo, benedite il Signore!  \ncetacei e pesci, benedite il Signore!  \nbelve e armenti benedite il Signore! (RIT) \n  \nFigli degli uomini benedite il Signore!  \nPopolo di Dio benedici il Signore!  \nSacerdoti del Signore benedite il Signore!  \nServi del Signore benedite il Signore!  \n  \nAnime dei giusti, benedite il Signore!  \nsanti di Dio, benedite il Signore!  \numili di cuore, benedite il Signore!  \nora e per sempre benedite il Signore! (RIT)',s:'benediciamo il signore benediciamo il signore a lui onore e gloria nei secoli angeli del signore benedite il signore e voi o cieli benedite il signore acque sopra il cielo benedite il signore potenze del signore benedite il signore sole e luna benedite il signore astri del cielo benedite il signore piogge e rugiade benedite il signore o venti tutti benedite il signore rit benediciamo il signore a lui onore e gloria nei secoli fuoco e calore benedite il signore freddo e rigore benedite il signore rugiada e brina benedite il signore gelo e freddo benedite il signore ghiacci e nevi benedite il signore luce e tenebre benedite il signore notti e giorni benedite il signore lampi e tuoni benedite il signore rit tutta la terra benedica il signore monti e colli benedite il signore ogni vivente benedica il signore acque e fonti benedite il signore mari e fiumi benedite il signore uccelli del cielo benedite il signore cetacei e pesci benedite il signore belve e armenti benedite il signore rit figli degli uomini benedite il signore popolo di dio benedici il signore sacerdoti del signore benedite il signore servi del signore benedite il signore anime dei giusti benedite il signore santi di dio benedite il signore umili di cuore benedite il signore ora e per sempre benedite il signore rit 38',type:'N',i:70},
{n:'39',t:'BENEDICTUS',c:'BENEDETTO IL SIGNOR DIO D\'ISRAE LE  \nCHE HA VISITATO E REDENTO IL SUO POPOLO \nE HA SUSCITATO UNA SALVEZZA POTENTE  \nNELLA CASA DEL SUO SERVO ISRAELE.  \n  \nCome aveva promesso ai nostri padri.  \nper bocca dei profeti d\'un tempo,  \nsalvezza dai nostri nemici  \ne dalle mani di quanti ci odiano. (RIT) \n  \nMisericordia ha concesso ai nostri padri  \nricordandosi  la santa alleanza,  \ndel giuramento fatto ad Abramo,  \nliberarci dalle mani dei nemici. (RIT) \nDi servirlo in santità e giustizia \nalla sua presenza per sempre \ne tu bambino sarai profeta \nperchè andrai a preparargli le strade. (RIT) \n  \n\nPer donare al popolo salvezza  \nnella remissione dei peccati,   \ngrazie alla bontà del nostro Dio,  \ndall\'alto un sole sorge e ci visiterà. (RIT) \n  \nPer rischiarare quelli che son nelle tenebre   \ne nell\'oscurità della morte  \ne dirigere i nostri passi sulla via della pace. (RIT)  \n  \nSia gloria al Padre e al Figlio e allo Spirito Santo,   \ncome era nel principio e ora è sempre  \nnei secoli dei secoli. Amen. (RIT)',s:'benedictus benedetto il signor dio d israe le che ha visitato e redento il suo popolo e ha suscitato una salvezza potente nella casa del suo servo israele come aveva promesso ai nostri padri per bocca dei profeti d un tempo salvezza dai nostri nemici e dalle mani di quanti ci odiano rit misericordia ha concesso ai nostri padri ricordandosi la santa alleanza del giuramento fatto ad abramo liberarci dalle mani dei nemici rit di servirlo in santita e giustizia alla sua presenza per sempre e tu bambino sarai profeta perche andrai a preparargli le strade rit per donare al popolo salvezza nella remissione dei peccati grazie alla bonta del nostro dio dall alto un sole sorge e ci visitera rit per rischiarare quelli che son nelle tenebre e nell oscurita della morte e dirigere i nostri passi sulla via della pace rit sia gloria al padre e al figlio e allo spirito santo come era nel principio e ora e sempre nei secoli dei secoli amen rit 39',type:'N',i:71},
{n:'40',t:'BENEDIRÒ IL SIGNORE',c:'BENEDIRÒ IL SIGNORE IN OGNI TEMPO.  \nBENEDIRÒ IL SIGNORE,  \n(x2)  \nSULLA MIA BOCCA LA SUA LODE.  \nSEMPRE BENEDIRÒ IL SIGNOR,  \nSEMPRE BENEDIRÒ IL SIGNOR,  \nBENEDIRÒ IL SIGNOR SEMPRE,  \nBENEDIRÒ IL SIGNORE.  \n  \nGuardate a lui e sarete raggianti,   \nnon sarete mai confusi.  \nGustate e vedete quanto è buono il Signore,   \nbeato l\'uomo che in lui si rifugia. (RIT) \n  \nTemete il Signore voi tutti suoi santi,  \nnulla manca a chi lo teme.  \nVenite figli io v\'insegnerò  \nil timore del Signore. (RIT) \n  \nGridano e il Signore li ascolta,  \nli salva dalle angosce.  \nIl Signore è vicino a chi ha il cuore ferito,   \negli salva gli spiriti affranti. (RIT)',s:'benediro il signore benediro il signore in ogni tempo benediro il signore x2 sulla mia bocca la sua lode sempre benediro il signor sempre benediro il signor benediro il signor sempre benediro il signore guardate a lui e sarete raggianti non sarete mai confusi gustate e vedete quanto e buono il signore beato l uomo che in lui si rifugia rit temete il signore voi tutti suoi santi nulla manca a chi lo teme venite figli io v insegnero il timore del signore rit gridano e il signore li ascolta li salva dalle angosce il signore e vicino a chi ha il cuore ferito egli salva gli spiriti affranti rit 40',type:'N',i:72},
{n:'41',t:'BENEDIRÒ IL TUO NOME',c:'Tu sei il mio Dio, il mio Signor,  \nio vengo a te per dar lode al tuo Nome.  \nIl cuore mio anela a te,  \n  \ngioisce in te, unica fonte d\'amore.  \n  \nBENEDIRÒ PER SEMPRE IL TUO NOME,  \nLE MANI MIE INNALZERÒ A TE SIGNORE.  \nNELLA NOTTE DELLA VITA TU MI HAI SOCCORSO,  \n\nFORTE DEL TUO AMORE VIVRÒ.  \nBENEDIRÒ PER SEMPRE IL TUO NOME,  \nCANTANDO A TE CONTEMPLERÒ LA TUA GLORIA.   \nNELLA NOTTE DELLA VITA TU MI HAI SOCCORSO,   \nPER IL TUO NOME VIVRÒ.  \nTu sei il mio Dio, il mio Signor,  \nio vengo a te per dar lode al tuo nome.   \nIl cuore mio anela a te,  \ngioisce in te, unica fonte d\'amore. (RIT) \n  \nBENEDIRÒ, BENEDIRÒ     SEMPRE.  \n \nNELLA NOTTE DELLA VITA TU MI HAI SOCCORSO,  \nPER IL TUO NOME VIVRÒ.  \n \nBENEDIRÒ PER SEMPRE IL TUO NOME,    \nCANTANDO A TE CONTEMPLERÒ LA TUA GLORIA.   \nNELLA NOTTE DELLA VITA TU MI HAI SOCCORSO,   \nPER IL TUO NOME VIVRÒ.',s:'benediro il tuo nome tu sei il mio dio il mio signor io vengo a te per dar lode al tuo nome il cuore mio anela a te gioisce in te unica fonte d amore benediro per sempre il tuo nome le mani mie innalzero a te signore nella notte della vita tu mi hai soccorso forte del tuo amore vivro benediro per sempre il tuo nome cantando a te contemplero la tua gloria nella notte della vita tu mi hai soccorso per il tuo nome vivro tu sei il mio dio il mio signor io vengo a te per dar lode al tuo nome il cuore mio anela a te gioisce in te unica fonte d amore rit benediro benediro sempre nella notte della vita tu mi hai soccorso per il tuo nome vivro benediro per sempre il tuo nome cantando a te contemplero la tua gloria nella notte della vita tu mi hai soccorso per il tuo nome vivro 41',type:'N',i:73},
{n:'42',t:'BENEDITE',c:'Anima mia benedici il Signore,  \nche io possa lodare il suo Nome,   \nnon ti scordare i suoi benefici,  \negli sazia di beni i tuoi giorni.   \nEgli rimette tutte le tue colpe  \ne ti risana le molte ferite  \ne ti incorona di grazia,  \ncome aquila è la tua giovinezza.  \n  \nBENEDITE IL SIGNORE  \nVOI ANGELI SUOI,  \nBENEDITE IL SIGNORE  \nVOI TUTTE SUE SCHIERE,  \nBENEDITE IL SIGNORE OPERE TUTTE  \nE IN OGNI LUOGO SI LODI DIO.  \n  \nIl Signore è tenerezza,  \nlento all\'ira e pieno d\'amore,  \ndalla fossa mi ha sollevato,  \nun\'alleanza con me ha compiuto.  \nCome erba sono i giorni dell\'uomo,  \nla sua vita è un fiore del campo,  \npoi il vento lo sfiora,  \nné più si sa il luogo dove era. (RIT) \n\n  \nCanterò al mio Signore  \nla mia gioia per la vita,  \nrenderò a lui grazie,  \nper sempre inneggerò alla sua gloria.   \nCosì risuoni il mare  \ne quanto in esso si racchiude,  \ncosì esultino i monti  \ne tutti i fiumi battano le mani. (RIT)',s:'benedite anima mia benedici il signore che io possa lodare il suo nome non ti scordare i suoi benefici egli sazia di beni i tuoi giorni egli rimette tutte le tue colpe e ti risana le molte ferite e ti incorona di grazia come aquila e la tua giovinezza benedite il signore voi angeli suoi benedite il signore voi tutte sue schiere benedite il signore opere tutte e in ogni luogo si lodi dio il signore e tenerezza lento all ira e pieno d amore dalla fossa mi ha sollevato un alleanza con me ha compiuto come erba sono i giorni dell uomo la sua vita e un fiore del campo poi il vento lo sfiora ne piu si sa il luogo dove era rit cantero al mio signore la mia gioia per la vita rendero a lui grazie per sempre inneggero alla sua gloria cosi risuoni il mare e quanto in esso si racchiude cosi esultino i monti e tutti i fiumi battano le mani rit 42',type:'N',i:74},
{n:'43',t:'BENEDITE IL SIGNOR  (servi suoi)',c:'Benedite il Signor voi tutti servi suoi  \nnella casa del Signor celebrate il suo Nome,   \nalzate le mani e benedite il Signor  \ne verso il tempio suo santo benedite  \nil nome del Signor e lui vi benedirà,  \nperché da Sion il Signor vi benedirà.   \n \nRingraziate...  \n \nLodate...',s:'benedite il signor servi suoi benedite il signor voi tutti servi suoi nella casa del signor celebrate il suo nome alzate le mani e benedite il signor e verso il tempio suo santo benedite il nome del signor e lui vi benedira perche da sion il signor vi benedira ringraziate lodate 43',type:'N',i:75},
{n:'44',t:'CAMINANDO VOY',c:'Caminando voy a Jerusalem. (x3)  \nOh gloria a Dios caminando voy a Jerusalem.  \n  \nCantando...  \n \nAlabando ...  \n \nSaludando...  \n \nAplaudiendo ...',s:'caminando voy caminando voy a jerusalem x3 oh gloria a dios caminando voy a jerusalem cantando alabando saludando aplaudiendo 44',type:'N',i:76},
{n:'45',t:'CANTA ALLELUIA',c:'(uomini)   \nCanta alleluia al Signor.   \nCanta alleluia al Signor.  \n\nCanta alleluia, canta alleluia.   \nCanta alleluia al Signor!  \n  \n(uomini)                                     (donne) \nCanta alleluia al Signor             Canta alleluia  al Signor  \nCanta alleluia al Signor             Canta alleluia  \nCanta alleluia,  canta alleluia,   \ncanta alleluia al Signor.',s:'canta alleluia uomini canta alleluia al signor canta alleluia al signor canta alleluia canta alleluia canta alleluia al signor uomini donne canta alleluia al signor canta alleluia al signor canta alleluia al signor canta alleluia canta alleluia canta alleluia canta alleluia al signor 45',type:'N',i:77},
{n:'46',t:'CANTANDO GLORIA',c:'Noi siamo il tuo popolo, Gesù.  \nTu ci hai chiamati per lodarti, Signor, \nPer adorarti in verità,   \ncon il tuo Spirito con gioia lodiam \ncantando:  \n  \nGLORIA, GLORIA AL TUO NOME,  \nGLORIA AL SIGNORE!  \nGLORIA, GLORIA AL TUO NOME,  \nGLORIA AL SIGNORE!  \nSU TUTTA LA TERRA SEI RE !  \nNOI TI ESALTIAMO SIGNORE!  \n  \nNoi cantiamo la tua fedeltà.  \nIl tuo nome proclamiamo Gesù.   \nTutta la terra ascolterà  \nla lode gioiosa che innalziamo a te  \ncantando: (RIT) \n  \nAnche se il buio è dentro noi  \na te le mani innalziamo Signor.  \nE come incenso salirà  \nla nostra lode che con forza gridiam  \ncantando: (RIT) \n  \nFinale: Su tutta la terra sei Re  \nNoi ti esaltiamo! (Signor)  \nTi glorifichiamo (Signor)   \nNoi ti proclamiamo \"il Re!\".',s:'cantando gloria noi siamo il tuo popolo gesu tu ci hai chiamati per lodarti signor per adorarti in verita con il tuo spirito con gioia lodiam cantando gloria gloria al tuo nome gloria al signore gloria gloria al tuo nome gloria al signore su tutta la terra sei re noi ti esaltiamo signore noi cantiamo la tua fedelta il tuo nome proclamiamo gesu tutta la terra ascoltera la lode gioiosa che innalziamo a te cantando rit anche se il buio e dentro noi a te le mani innalziamo signor e come incenso salira la nostra lode che con forza gridiam cantando rit finale su tutta la terra sei re noi ti esaltiamo signor ti glorifichiamo signor noi ti proclamiamo il re 46',type:'N',i:78},
{n:'47',t:'CANTATE AL SIGNORE CON GIOIA',c:'Gloria, onore e potenza    \ndiamo al nostro Signor.   \n\nLode, sapienza e grazia   \nal nostro Salvator.  \n  \n CANTATE AL SIGNORE CON GIOIA,  \n LODATE LA SUA MAESTÀ,  \n GIOITE NEL SUO SANTO NOME,  \n CANTATE LA SUA FEDELTÀ.  \n(x2)  \n  \nI suoi giudizi son giusti,  \nle sue vie son verità.  \nBenedizione e salvezza  \nal nostro Dio che verrà. (RIT) \n   \nSia lode al Signore per sempre,  \nnei cieli la sua bontà.  \nS\'innalzi la sua potenza,  \nin eterno la sua fedeltà. (RIT) \n  \nGrande è il Signore e potente,  \nmirabile in santità.  \nOgni ginocchio per sempre  \ndavanti a lui si piegherà. (RIT) \n  \nRe di giustizia e di pace,  \nprincipe e consolator,  \nPadre di tutte le genti,  \nsia gloria al nostro Signor. (RIT)',s:'cantate al signore con gioia gloria onore e potenza diamo al nostro signor lode sapienza e grazia al nostro salvator cantate al signore con gioia lodate la sua maesta gioite nel suo santo nome cantate la sua fedelta x2 i suoi giudizi son giusti le sue vie son verita benedizione e salvezza al nostro dio che verra rit sia lode al signore per sempre nei cieli la sua bonta s innalzi la sua potenza in eterno la sua fedelta rit grande e il signore e potente mirabile in santita ogni ginocchio per sempre davanti a lui si pieghera rit re di giustizia e di pace principe e consolator padre di tutte le genti sia gloria al nostro signor rit 47',type:'N',i:79},
{n:'48',t:'CANTATE LODI',c:'Date al Signore, figli di Dio,  \ndate al Signore gloria e potenza.  \nDate al Signore la gloria del suo Nome,  \nadoriamo la bellezza, la santità.  \n  \nCANTATE LODI ALLA ROCCIA ETERNA,  \nCANTATE LODI A GESÙ IL SIGiNOR,  \nVENITE ADORATELO,   \nINCHINATEVI A LUI,  \nCANTATE LODI A GESÙ IL SIGNOR!  \n \n \n(da capo)',s:'cantate lodi date al signore figli di dio date al signore gloria e potenza date al signore la gloria del suo nome adoriamo la bellezza la santita cantate lodi alla roccia eterna cantate lodi a gesu il siginor venite adoratelo inchinatevi a lui cantate lodi a gesu il signor da capo 48',type:'N',i:80},
