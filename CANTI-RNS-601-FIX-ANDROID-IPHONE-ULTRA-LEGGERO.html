{n:'122',t:'GLORIA (Gloria)',c:'Gloria, gloria a Dio nell\'alto dei cieli  \ngloria e pace e pace  \nin  terra agli uomini di buona volontà.  \n \nTi lodiamo (ti lodiamo), ti benediciamo (ti benediciamo),  \nti adoriamo (ti adoriamo), ti glorifichiamo (ti glorifichiamo),   \nti  rendiamo grazie  \nper  la  tua gloria  immensa.  \n \n\nSignore, Figlio unigenito, Gesù Cristo. Signore Dio,  \nAgnello di Dio,  Figlio del Padre, tu che togli i peccati,  \ni peccati del mondo abbi pietà di noi, abbi pietà di noi.  \nTu che togli i peccati, i peccati del mondo   \naccogli, accogli la nostra supplica.      \n \nTu  che siedi alla destra,    \nalla  destra del Padre  \nabbi pietà di noi,  abbi pietà di noi.  \n  \nPerché tu solo il Santo, (perché... il Santo)  \nTu solo il Signore (tu... il Signore)  \nTu solo l\'Altissimo, (tu solo l\'Altissimo)  \nGesù Cristo (Gesù Cristo)  \nCon lo Spirito      Santo nella gloria di Dio Padre.  \nAmen.',s:'gloria gloria gloria gloria a dio nell alto dei cieli gloria e pace e pace in terra agli uomini di buona volonta ti lodiamo ti lodiamo ti benediciamo ti benediciamo ti adoriamo ti adoriamo ti glorifichiamo ti glorifichiamo ti rendiamo grazie per la tua gloria immensa signore figlio unigenito gesu cristo signore dio agnello di dio figlio del padre tu che togli i peccati i peccati del mondo abbi pieta di noi abbi pieta di noi tu che togli i peccati i peccati del mondo accogli accogli la nostra supplica tu che siedi alla destra alla destra del padre abbi pieta di noi abbi pieta di noi perche tu solo il santo perche il santo tu solo il signore tu il signore tu solo l altissimo tu solo l altissimo gesu cristo gesu cristo con lo spirito santo nella gloria di dio padre amen 122',type:'N',i:154},
{n:'123',t:'GLORIA A DIO',c:'GLORIA A DIO NELL\'ALTO DEI CIELI  \nE PACE IN TERRA  \nAGLI UOMINI AMATI DAL SIGNORE!  \nTI LODIAMO, TI BENEDICIAMO,  \nTI ADORIAMO, TI RENDIAMO GRAZIE  \nPER LA TUA GLORIA IMMENSA!  \n  \nSignore Dio, Re del cielo  \nDio, Padre onnipotente,  \nSignore, Figlio unigenito, Gesù Cristo.  \n  \nSignore lddio, Agnello di Dio,  \nFiglio del Padre: tu che togli i peccati del mondo  \nabbi pietà di noi. (RIT) \n  \nTu che togli i peccati del mondo  \naccogli la nostra supplica.  \nTu che siedi alla destra del Padre  \nabbi pietà di noi.  \n  \nPerché tu solo il Santo,  \ntu solo il Signore,  \ntu solo l\'Altissimo, Gesù Cristo.  \nCon lo Spirito Santo  \nnella gloria di Dio Padre. (RIT) \n \nAmen,   amen.',s:'gloria a dio gloria a dio nell alto dei cieli e pace in terra agli uomini amati dal signore ti lodiamo ti benediciamo ti adoriamo ti rendiamo grazie per la tua gloria immensa signore dio re del cielo dio padre onnipotente signore figlio unigenito gesu cristo signore lddio agnello di dio figlio del padre tu che togli i peccati del mondo abbi pieta di noi rit tu che togli i peccati del mondo accogli la nostra supplica tu che siedi alla destra del padre abbi pieta di noi perche tu solo il santo tu solo il signore tu solo l altissimo gesu cristo con lo spirito santo nella gloria di dio padre rit amen amen 123',type:'N',i:155},
{n:'124',t:'GLORIA A DIO',c:'Gloria a Dio nell\'alto dei cieli  \ne pace in terra agli uomini amati dal Signore!  \nTi lodiamo, ti benediciamo,  \nti adoriamo e ti rendiamo grazie  per la tua gloria immensa!  \n  \nSignore Dio, Re del cielo,   \nDio Padre onnipotente,    \nSignore, Figlio unigenito,   \nGesù Cristo.                       Gesù  Cristo. (RIT) \n \nSignore lddio, Agnello di Dio,  \nFiglio del Padre.  \nTu che togli i peccati del mondo,  \nabbi pietà di noi.                Pietà di noi. (RIT) \n \nTu che togli i peccati del mondo,  \naccogli la nostra supplica.  \nTu che siedi alla destra del Padre  \nabbi pietà di noi.               Pietà di noi. (RIT) \n  \nPerché tu solo il Santo, tu solo il Signore,  \ntu solo l\'Altissimo  \nGesù Cristo, con lo Spirito Santo  \nnella gloria di Dio Padre    di Dio Padre. (RIT) \n \nAmen, Amen! Amen!',s:'gloria a dio gloria a dio nell alto dei cieli e pace in terra agli uomini amati dal signore ti lodiamo ti benediciamo ti adoriamo e ti rendiamo grazie per la tua gloria immensa signore dio re del cielo dio padre onnipotente signore figlio unigenito gesu cristo gesu cristo rit signore lddio agnello di dio figlio del padre tu che togli i peccati del mondo abbi pieta di noi pieta di noi rit tu che togli i peccati del mondo accogli la nostra supplica tu che siedi alla destra del padre abbi pieta di noi pieta di noi rit perche tu solo il santo tu solo il signore tu solo l altissimo gesu cristo con lo spirito santo nella gloria di dio padre di dio padre rit amen amen amen 124',type:'N',i:156},
{n:'125',t:'GLORIA A DIO (S. Martinez)',c:'Gloria a Dio nell\'alto dei cieli.  \nGloria a Dio nell\'alto dei cieli  \ne pace in terra agli uomini   \namati dal Signore.  \n  \nTi lodiamo, ti benediciamo,  \nti adoriamo, ti glorifichiamo,  \nti rendiamo grazie  \nper la tua gloria immensa,  \n \nSignore Dio, re del cielo,  \nDio Padre onnipotente  \nSignore, Figlio unigenito, Gesù Cristo,  \n  \nSignore lddio, Agnello di Dio, Figlio del Padre,  \n\ntu che togli i peccati del mondo, abbi pietà di noi;  \n  \ntu che togli i peccati del mondo,  \naccogli la nostra supplica;  \ntu che siedi alla destra del Padre,  \nabbi pietà di noi.  \n  \nPerché tu solo il Santo, il Signore,  \nl\'Altissimo, Gesù Cristo,  \ncon lo Spirito Santo:  \nnella gloria di Dio Padre.  \nAmen, amen.',s:'gloria a dio s martinez gloria a dio nell alto dei cieli gloria a dio nell alto dei cieli e pace in terra agli uomini amati dal signore ti lodiamo ti benediciamo ti adoriamo ti glorifichiamo ti rendiamo grazie per la tua gloria immensa signore dio re del cielo dio padre onnipotente signore figlio unigenito gesu cristo signore lddio agnello di dio figlio del padre tu che togli i peccati del mondo abbi pieta di noi tu che togli i peccati del mondo accogli la nostra supplica tu che siedi alla destra del padre abbi pieta di noi perche tu solo il santo il signore l altissimo gesu cristo con lo spirito santo nella gloria di dio padre amen amen 125',type:'N',i:157},
{n:'126',t:'GLORIA AL RE DEI RE',c:'GLORIA, GLORIA  \nGLORIA AL RE DEI RE!  \nGLORIA, GLORIA  \nGLO RIA AL RE DEI RE!  \n  \nChi è il Re della gloria?  \nIl suo nome è Gesù!  \nLa sua gloria sulla terra  \ne il suo Nome annunzierò! (RIT) \n \nSaliranno al monte del Signore,  \nal suo luogo santo,  \nchi ha mani innocenti  \ne cuore puro. (RIT) \n  \nSollevate o porte i frontali  \nporte antiche alzatevi,  \navanzi il Re della gloria,  \nil Signore è il nostro Re! (RIT)',s:'gloria al re dei re gloria gloria gloria al re dei re gloria gloria glo ria al re dei re chi e il re della gloria il suo nome e gesu la sua gloria sulla terra e il suo nome annunziero rit saliranno al monte del signore al suo luogo santo chi ha mani innocenti e cuore puro rit sollevate o porte i frontali porte antiche alzatevi avanzi il re della gloria il signore e il nostro re rit 126',type:'N',i:158},
{n:'127',t:'GLORIA AL SUO NOM',c:'Gesù è il Signor, gloria al suo Nom,  \ngloria al suo Nome.  \nGesù è il Signor, gloria al suo Nome  sulla  terra.  \n \nGLORIA AL SUO NOM, GLORIA AL SUO NOM,  \nGLORIA AL SUO NOME SULLA TERRA.  \n  \nÈ il Salvator...  \n\n  \nÈ il Re dei re...',s:'gloria al suo nom gesu e il signor gloria al suo nom gloria al suo nome gesu e il signor gloria al suo nome sulla terra gloria al suo nom gloria al suo nom gloria al suo nome sulla terra e il salvator e il re dei re 127',type:'N',i:159},
{n:'128',t:'GLORIA ALLELUIA',c:'GLORIA, ALLELU IA!  \nGLORIA, ALLELU IA!  \n   \nSia gloria e onor al nostro Signor,   \nil cuore innalziam, le mani leviam.  \nGioiosi acclamiam, insieme cantiam! (RIT) \n \nSuo Figlio Gesù venuto è quaggiù,  \nsi è fatto bontà e via e verità.  \nSia gloria e onor al nostro Signor! (RIT) \n \nDel male gli orror l\'Agnello portò,  \nper noi morì e risuscitò.  \nDi vita il tesor a tutti donò! (RIT) \n  \nSì, santo è il Signor è il Dio dell\'amor  \nche era e che è e sempre sarà.  \nSignore Gesù  ritorna  quaggiù! (RIT)',s:'gloria alleluia gloria allelu ia gloria allelu ia sia gloria e onor al nostro signor il cuore innalziam le mani leviam gioiosi acclamiam insieme cantiam rit suo figlio gesu venuto e quaggiu si e fatto bonta e via e verita sia gloria e onor al nostro signor rit del male gli orror l agnello porto per noi mori e risuscito di vita il tesor a tutti dono rit si santo e il signor e il dio dell amor che era e che e e sempre sara signore gesu ritorna quaggiu rit 128',type:'N',i:160},
{n:'129',t:'GLORIA A TE SIGNORE',c:'Gloria a te Signore in eterno,  \nquanto sei grande nella tua maestà. (x2)  \n  \nA TE VOGLIO CANTARE FINCHÉ IO VIVO,  \nESULTA IL MIO CUORE, LA MIA GIOIA È IN TE.  \n  \nOnore a te Signore in eterno,  \nquanto sei grande nella tua maestà. (x2) (RIT) \n \nLode a te Signore in eterno,  \nquanto sei grande nella tua maestà. (x2) (RIT) \n  \nGloria a te Signore in eterno,  \nquanto sei grande nella tua maestà. (x2) (RIT) \n  \n\nGloria a te Signore in eterno,  \nquanto sei grande nella tua maestà.',s:'gloria a te signore gloria a te signore in eterno quanto sei grande nella tua maesta x2 a te voglio cantare finche io vivo esulta il mio cuore la mia gioia e in te onore a te signore in eterno quanto sei grande nella tua maesta x2 rit lode a te signore in eterno quanto sei grande nella tua maesta x2 rit gloria a te signore in eterno quanto sei grande nella tua maesta x2 rit gloria a te signore in eterno quanto sei grande nella tua maesta 129',type:'N',i:161},
{n:'130',t:'GLORIA, GLORIA, GLORIA IO L\'HO INCONTRATO',c:'GLORIA, GLORIA, GLORIA   \nIO L\'HO INCONTRATO.   \nGLORIA, GLORIA, GLORIA   \nIO L\'HO INCONTRATO.  \nGLORIA, GLORIA, GLORIA  \nIO L\'HO INCONTRATO,  \nHO INCONTRATO IL MIO SIGNOR.  \n  \nNel suo Santo Spirito io l\'ho incontrato.  \nNel suo Santo Spirito io l\'ho incontrato.  \nNel suo Santo Spirito io l\'ho incontrato.  \nHo incontrato il mio Signor. (RIT) \nNella santa Chiesa io l\'ho incontrato...  (RIT) \n \nPer mezzo di Maria io l\'ho incontrato...  (RIT)',s:'gloria gloria gloria io l ho incontrato gloria gloria gloria io l ho incontrato gloria gloria gloria io l ho incontrato gloria gloria gloria io l ho incontrato ho incontrato il mio signor nel suo santo spirito io l ho incontrato nel suo santo spirito io l ho incontrato nel suo santo spirito io l ho incontrato ho incontrato il mio signor rit nella santa chiesa io l ho incontrato rit per mezzo di maria io l ho incontrato rit 130',type:'N',i:162},
{n:'131',t:'GLORIFICATE  DIO',c:'Glorificate  Dio,  glorificate il Santo,  \nglorificate il Re dei re!     (x2)  \n(uomini)  \n  \nGlorificate Dio, glorificate il Santo,  \nglorificate il Re dei re!      (x2) (donne)  \n \nOffrite un sacrificio di lode a lui.  \nAl Signore, l\'eterno, l\'Agnello immolato per noi.   (x2) (tutti)  \n  \nCantate lodi a Dio, cantate lodi al Santo,   \ncantate lodi al Re dei re!        (x2)  \n(uomini)  \n \n     \nCantate lodi a Dio, cantate lodi al Santo,  \ncantate lodi al Re dei re!          (x2) (donne)  \n \n   \nOffrite un sacrificio di lode a lui, al Signore,  \nl\'eterno, l\'Agnello immolato per noi.  (x2) (tutti)  \n  \nRendete grazie a Dio, rendete grazie al Santo,  \nrendete grazie al Re dei re!  \n  \nGlorificate Dio, cantate lodi al Santo,  \nrendete grazie al Re dei re!  \n\n \nOffrite un sacrificio di lode a lui.  \nAl Signore, l\'eterno, l\'Agnello immolato per noi.',s:'glorificate dio glorificate dio glorificate il santo glorificate il re dei re x2 uomini glorificate dio glorificate il santo glorificate il re dei re x2 donne offrite un sacrificio di lode a lui al signore l eterno l agnello immolato per noi x2 tutti cantate lodi a dio cantate lodi al santo cantate lodi al re dei re x2 uomini cantate lodi a dio cantate lodi al santo cantate lodi al re dei re x2 donne offrite un sacrificio di lode a lui al signore l eterno l agnello immolato per noi x2 tutti rendete grazie a dio rendete grazie al santo rendete grazie al re dei re glorificate dio cantate lodi al santo rendete grazie al re dei re offrite un sacrificio di lode a lui al signore l eterno l agnello immolato per noi 131',type:'N',i:163},
{n:'132',t:'GRANDE È IL SIGNORE',c:'Grande e degno di ogni lode è il Signore.  \nLa città del nostro Dio è un luogo santo.  \nLa gioia sulla terra.  \n   \nGrande è il Signore in cui abbiamo la vittoria   \nperché ci salva dal nemico,   \nprostriamoci a lui.  \n   \nSIGNORE NOI ESALTIAMO IL TUO NOM,  \n VOGLIAMO RINGRAZIARTI    \nPEI PRODIGI CHE TU HAI FATTO,  \nABBIAM FIDUCIA SOLO NEL TUO AMOR  \nPOICHÉ TU SOLO SEI L\'IDDIO  \nETERNO IN CIELO E SULLA TERRA.',s:'grande e il signore grande e degno di ogni lode e il signore la citta del nostro dio e un luogo santo la gioia sulla terra grande e il signore in cui abbiamo la vittoria perche ci salva dal nemico prostriamoci a lui signore noi esaltiamo il tuo nom vogliamo ringraziarti pei prodigi che tu hai fatto abbiam fiducia solo nel tuo amor poiche tu solo sei l iddio eterno in cielo e sulla terra 132',type:'N',i:164},
{n:'133',t:'GRANDE SEI O MIO SIGNOR',c:'Grande sei o mio Signor,    \nRe in eterno resterai.  \nL\'anima mia riposa  solo in te,  \nche mi  perdoni e mi consoli.  \n \nCon te voglio abitare o Re,  \ncon te che siedi su nel ciel,  \ncon te che hai tutto  ai  piedi tuoi.  \nTu sei l\'amore, tu sei Gesù  \nil  Re!',s:'grande sei o mio signor grande sei o mio signor re in eterno resterai l anima mia riposa solo in te che mi perdoni e mi consoli con te voglio abitare o re con te che siedi su nel ciel con te che hai tutto ai piedi tuoi tu sei l amore tu sei gesu il re 133',type:'N',i:165},
{n:'134',t:'GRAZIE SIGNORE',c:'Se guardo la luna, il cielo e le stelle che tu hai creato   \nche cos\'è l\'uomo perché ti ricordi di lui.   \nEppure l\'hai fatto poco meno degli angeli,   \ndi onore e di gloria tu lo hai rivestito.  \n\n   \nGRAZIE SIGNORE PER AVERCI CREATO.  \nGRAZIE SIGNORE PER AVERCI AMATO.  (x2)  \n \nDi te parlerò ai miei fratelli,  \nil tuo nome io annunzierò.  \nIn te io porrò la mia fiducia,  \no Signore amante della vita. (RIT)',s:'grazie signore se guardo la luna il cielo e le stelle che tu hai creato che cos e l uomo perche ti ricordi di lui eppure l hai fatto poco meno degli angeli di onore e di gloria tu lo hai rivestito grazie signore per averci creato grazie signore per averci amato x2 di te parlero ai miei fratelli il tuo nome io annunziero in te io porro la mia fiducia o signore amante della vita rit 134',type:'N',i:166},
{n:'135',t:'GUARDA AL DI LÀ',c:'GUARDA AL DI LÀ DEL PANE CHE MANGI,  \nVEDRAI GESÙ, IL SALVATOR.  \nGUARDA AL DI LÀ DEL VINO CHE BEVI,  \nVEDRAI IL SANGUE SUO DIVIN.  \n  \nDacci un segno, affinché crediamo in te,  \nai padri mandasti la manna dal cielo. (RIT) \n  \nSono il pane disceso dal cielo,  \nchi mangia di questo pane in eterno vivrà. (RIT) \n  \nIl pane che io vi do è vera carne  \ne il mio Sangue è vera bevanda. (RIT) \n  \nQuest\'uomo parla duramente,  \nno, noi mai lo seguiremo. (RIT) \n  \nAnche voi volete abbandonarmi?  \nNo, Signore, noi mai; da chi andremo? (RIT) \n  \nSei il pane di Dio che è per la vita,  \nSignore dacci sempre di questo pane. (RIT)',s:'guarda al di la guarda al di la del pane che mangi vedrai gesu il salvator guarda al di la del vino che bevi vedrai il sangue suo divin dacci un segno affinche crediamo in te ai padri mandasti la manna dal cielo rit sono il pane disceso dal cielo chi mangia di questo pane in eterno vivra rit il pane che io vi do e vera carne e il mio sangue e vera bevanda rit quest uomo parla duramente no noi mai lo seguiremo rit anche voi volete abbandonarmi no signore noi mai da chi andremo rit sei il pane di dio che e per la vita signore dacci sempre di questo pane rit 135',type:'N',i:167},
{n:'136',t:'HO LA PACE COME UN FIUME',c:'Ho la pace come un fiume,  \nho la pace come un fiume,  \nho la pace come un fiume nel mio cuor.  \nAlleluia!  \n \nHo la pace come un fiume,  \nho la pace come un fiume,  \n\nho la pace come un fiume nel mio cuor!  \nHo la pace come un fiume,  \ncome un fiume nel mio cuor,  \nho la pace come un fiume.  \nAlleluia!  \n·  \n  \nHo la gioia come una fonte...  \n \nHo l\'amore come il mare...',s:'ho la pace come un fiume ho la pace come un fiume ho la pace come un fiume ho la pace come un fiume nel mio cuor alleluia ho la pace come un fiume ho la pace come un fiume ho la pace come un fiume nel mio cuor ho la pace come un fiume come un fiume nel mio cuor ho la pace come un fiume alleluia ho la gioia come una fonte ho l amore come il mare 136',type:'N',i:168},
{n:'137',t:'IL BUON PASTORE (S. Martinez)',c:'Il Signore è il mio pastore   \nmi conduce ad acque tranquille.   \nMi rinfranca, mi guida nel cammino   \nper amore del santo suo Nome.   \nMi rinfranca, mi guida nel commino   \nper amore del santo suo Nome.  \n \nPur andando per valli oscure  \nnon dovrò mai temere alcun male,  \nperché tu mi sostieni e mi proteggi,   \nil tuo braccio mi dà sicurezza.  \nPerché tu mi sostieni e mi proteggi,  \nil tuo braccio mi dà sicurezza.  \n   \nTu prepari per me una mensa  \n sotto gli occhi dei miei nemici  \ne cospargi di olio il mio capo,  \nil mio calice è pieno e trabocca.  \nE cospargi di olio il mio capo,  \nil mio calice è pieno e trabocca.  \n   \nMi  accompagnano gioia e grazia  \ntutti i giorni di questa mia vita.  \nNella casa di Dio abiterò,  \nper lunghissimi e splendidi anni.  \nNella casa di Dio abiterò,  \nper lunghissimi e splendidi anni.  \nIl Signore è il mio pastore.',s:'il buon pastore s martinez il signore e il mio pastore mi conduce ad acque tranquille mi rinfranca mi guida nel cammino per amore del santo suo nome mi rinfranca mi guida nel commino per amore del santo suo nome pur andando per valli oscure non dovro mai temere alcun male perche tu mi sostieni e mi proteggi il tuo braccio mi da sicurezza perche tu mi sostieni e mi proteggi il tuo braccio mi da sicurezza tu prepari per me una mensa sotto gli occhi dei miei nemici e cospargi di olio il mio capo il mio calice e pieno e trabocca e cospargi di olio il mio capo il mio calice e pieno e trabocca mi accompagnano gioia e grazia tutti i giorni di questa mia vita nella casa di dio abitero per lunghissimi e splendidi anni nella casa di dio abitero per lunghissimi e splendidi anni il signore e il mio pastore 137',type:'N',i:169},
{n:'138',t:'IL FIGLIOL PRODIGO',c:'Ritornerò alla casa del Padre mio  \ne poi gli chiederò perdono  \nperché ho sbagliato:  \n \"Padre non sono degno di restare qui,  \n ma tienimi con te, qui con te\".  \n \nIl Padre che da lontano lo vide, si alzò  \ne poi gli corse incontro e a lungo l\'abbracciò.  \n\"Sia fatta festa perché  \nquesto figlio che  \nera perduto è tornato qui\".  \n \n(muto)  \n \n\"Sia fatta festa perché  \nquesto figlio che  \nera perduto è tornato qui\".',s:'il figliol prodigo ritornero alla casa del padre mio e poi gli chiedero perdono perche ho sbagliato padre non sono degno di restare qui ma tienimi con te qui con te il padre che da lontano lo vide si alzo e poi gli corse incontro e a lungo l abbraccio sia fatta festa perche questo figlio che era perduto e tornato qui muto sia fatta festa perche questo figlio che era perduto e tornato qui 138',type:'N',i:170},
{n:'139',t:'IL PANE DI VITA',c:'Sono il Pane di vita,   \nchi viene a me non ha più fame   \nchi viene a me non ha più sete,   \nchi può venire a me,   \nse il Padre non lo chiama.  \n  \nE LO RISUSCITERÒ,  E LO RISUSCITERÒ  \nE LO RISUSCITERÒ  NELL\'ULTIMO DÌ.  \n \nIl pane che io vi do  \nè il mio corpo per la vita del mondo.  \nChi mangia di questo pane,  \nanche se morrà avrà la vita eterna. (RIT) \n  \nSe non mangiate del corpo  \ndel Figlio dell\'uomo  \ne bevete del suo sangue,  \ne bevete del suo sangue  \nnon avrete in voi la vita. (RIT) \n \nSono la risurrezione,  \nio sono la vita,  \ncolui che crede in me  \nvivrà in eterno,  \n\nvivrà in eterno. (RIT) \n  \nSignore sì, io credo  \nche tu sei il Cristo  \nil Figlio di Dio  \nche è venuto in mezzo a noi,  \nche è venuto in mezzo a noi. (RIT) \n  \nALLELUIA…',s:'il pane di vita sono il pane di vita chi viene a me non ha piu fame chi viene a me non ha piu sete chi puo venire a me se il padre non lo chiama e lo risuscitero e lo risuscitero e lo risuscitero nell ultimo di il pane che io vi do e il mio corpo per la vita del mondo chi mangia di questo pane anche se morra avra la vita eterna rit se non mangiate del corpo del figlio dell uomo e bevete del suo sangue e bevete del suo sangue non avrete in voi la vita rit sono la risurrezione io sono la vita colui che crede in me vivra in eterno vivra in eterno rit signore si io credo che tu sei il cristo il figlio di dio che e venuto in mezzo a noi che e venuto in mezzo a noi rit alleluia 139',type:'N',i:171},
{n:'140',t:'IL SACRIFICIO DELLA LODE',c:'Il sacrificio della lode  \nalla tua casa  portiam.  \nIl sacrificio della lode  \nalla tua casa  portiam.  \nE offriamo a te Signor  \nun sacrificio di gioia,  \ne offriamo a te Signor  \nun sacrificio d\'amor.',s:'il sacrificio della lode il sacrificio della lode alla tua casa portiam il sacrificio della lode alla tua casa portiam e offriamo a te signor un sacrificio di gioia e offriamo a te signor un sacrificio d amor 140',type:'N',i:172},
{n:'140',t:'IL SIGNORE È LA MIA SALVEZZA',c:'IL SIGNORE È LA MIA SALVEZZA \nE CON LUI NON TEMO PIÙ  \nPERCHÉ HO NEL CUORE LA CERTEZZA:  \nLA SALVEZZA  È QUI CON ME.  \n \nTi lodo Signore perché  \n \nun giorno eri lontano da me,   \nora invece sei tornato  \ne mi hai preso con te. (RIT) \n  \nBerrete con gioia alle fonti,  \nalle fonti della salvezza  \ne quel giorno voi direte:  \nlodate il Signore, invocate il suo nome. (RIT) \n  \nFate conoscere ai popoli  \ntutto quello che lui ha compiuto  \ne ricordino per sempre,  \nricordino sempre che il suo Nome è grande. (RIT) \n  \nCantate a chi ha fatto grandezze  \ne sia fatto sapere nel mondo;  \n\nsia forte la tua gioia,  \nabitante di Sion, perché grande con te è il Signore. (RIT)',s:'il signore e la mia salvezza il signore e la mia salvezza e con lui non temo piu perche ho nel cuore la certezza la salvezza e qui con me ti lodo signore perche un giorno eri lontano da me ora invece sei tornato e mi hai preso con te rit berrete con gioia alle fonti alle fonti della salvezza e quel giorno voi direte lodate il signore invocate il suo nome rit fate conoscere ai popoli tutto quello che lui ha compiuto e ricordino per sempre ricordino sempre che il suo nome e grande rit cantate a chi ha fatto grandezze e sia fatto sapere nel mondo sia forte la tua gioia abitante di sion perche grande con te e il signore rit 140',type:'N',i:173},
{n:'142',t:'IL TUO AMORE E\' GRANDE',c:'SIGNORE IL TUO AMORE È GRANDE,  \nSIGNORE IL TUO AMORE È IMMENSO.   \nSEI QUI PRESENTE E VIVI IN MEZZO A NOI,  \nLA MORTE NO NON PUÒ  \nSTRAPPARCI DAL TUO AMORE.  \nSIGNORE IL TUO AMORE È GRANDE,  \nSIGNORE IL TUO AMORE È IMMENSO.  \nSENZA FINE IL MIO CUORE CANTERÀ PER TE,   \nPER LA TUA ETERNA FEDELTA.  \n  \nMio Signor con te nulla mancherà,  \ntu sei il mio pastore, mi consoli.    \nL\'anima riposa in te sicura,  \nla forza del tuo amore mi sostiene. (RIT) \nAnche se nel buio io camminerò  \ntu sarai con me, non avrò timore,   \nmi proteggerai con le tue ali,  \nin te confido, sei con me per sempre. (RIT) \n \n(oppure coda facoltativa) \n \nIl tuo amore è grande, grande.  \nIl tuo amore è grande, grande.  \n \nSenza fine il mio cuore canterà per te,  \nper la tua eterna fedeltà.  \nSenza fine il mio cuore canterà per te,  \nper la  tua eterna fedeltà.',s:'il tuo amore e grande signore il tuo amore e grande signore il tuo amore e immenso sei qui presente e vivi in mezzo a noi la morte no non puo strapparci dal tuo amore signore il tuo amore e grande signore il tuo amore e immenso senza fine il mio cuore cantera per te per la tua eterna fedelta mio signor con te nulla manchera tu sei il mio pastore mi consoli l anima riposa in te sicura la forza del tuo amore mi sostiene rit anche se nel buio io camminero tu sarai con me non avro timore mi proteggerai con le tue ali in te confido sei con me per sempre rit oppure coda facoltativa il tuo amore e grande grande il tuo amore e grande grande senza fine il mio cuore cantera per te per la tua eterna fedelta senza fine il mio cuore cantera per te per la tua eterna fedelta 142',type:'N',i:174},
{n:'143',t:'IL TUO CORPO IL TUO SANGUE',c:'Adesso Signore mangerò il tuo corpo  \ne riceverò nel cuore il dono di salvezza.  \nAdesso Signore io berrò il tuo sangue  \ned accoglierò nel cuore il dono di vita eterna.  \n  \nIL CORPO TUO SANTO E IL SANGUE TUO DIVINO  \nCUSTODIRÒ NEL CUORE E IN ME DIMORERAI.  \nIL TUO SACRIFICIO CELEBRERÒ SIGNORE,  \nL\'ANIMA MIA REDENTA IN ETERNO TI LODERA.  \n\n  \nTu solo Signore hai liberato il mondo  \ned hai tolto ad ogni uomo il giogo del peccato.  \nEd ecco Signore ci hai donato la tua vita  \ne ti sei immolato per offrirci la redenzione. (RIT) \n \nEd ora Signore, in mezzo a noi la tua presenza,  \nconfidiamo solo in te, nostra unica speranza.  \nTu sei nostra roccia, la nostra protezione,  \nsicuri da ogni male, in te noi dimoriamo. (RIT)',s:'il tuo corpo il tuo sangue adesso signore mangero il tuo corpo e ricevero nel cuore il dono di salvezza adesso signore io berro il tuo sangue ed accogliero nel cuore il dono di vita eterna il corpo tuo santo e il sangue tuo divino custodiro nel cuore e in me dimorerai il tuo sacrificio celebrero signore l anima mia redenta in eterno ti lodera tu solo signore hai liberato il mondo ed hai tolto ad ogni uomo il giogo del peccato ed ecco signore ci hai donato la tua vita e ti sei immolato per offrirci la redenzione rit ed ora signore in mezzo a noi la tua presenza confidiamo solo in te nostra unica speranza tu sei nostra roccia la nostra protezione sicuri da ogni male in te noi dimoriamo rit 143',type:'N',i:175},
{n:'144',t:'INNALZERO\' LE MIE MANI',c:'Eccomi Signore, voglio incontrarti.  \nIl mio cuore, i miei occhi ricercano il tuo volto.   \nEccomi Signore, voglio incontrarti.  \nLa mia vita, le mie mani voglio offrirti adesso.  \nSono qui per incontrare te. \n  \nINNALZERÒ LE MIE MANI A TE, LA MIA BOCCA SI APRIRÀ   \nE NEL MIO CUORE UN CANTO NUOVO NASCERÀ.  \nINNALZERÒ LE MIE MANI A TE, LA MIA BOCCA SI APRIRÀ   \nED IL MIO CUORE A TE SIGNORE CANTERÀ.  \n  \nTu sei qui Signore, mi stavi aspettando.  \nLa tua gioia, la tua pace già sento nel mio cuore.  \nTu sei qui Signore, mi stavi aspettando.  \nLa tua luce, il tuo amore infondi nel mio cuore.  \nTu sei qui per incontrare me. (RIT) \n  \nInnalzerò, innalzerò, innalzerò, innalzerò.  \n \n ED IL MIO CUORE A TE SIGNORE CANTERÀ.',s:'innalzero le mie mani eccomi signore voglio incontrarti il mio cuore i miei occhi ricercano il tuo volto eccomi signore voglio incontrarti la mia vita le mie mani voglio offrirti adesso sono qui per incontrare te innalzero le mie mani a te la mia bocca si aprira e nel mio cuore un canto nuovo nascera innalzero le mie mani a te la mia bocca si aprira ed il mio cuore a te signore cantera tu sei qui signore mi stavi aspettando la tua gioia la tua pace gia sento nel mio cuore tu sei qui signore mi stavi aspettando la tua luce il tuo amore infondi nel mio cuore tu sei qui per incontrare me rit innalzero innalzero innalzero innalzero ed il mio cuore a te signore cantera 144',type:'N',i:176},
{n:'145',t:'INNALZIAMO IL NOME TUO SANTO',c:'Entrerò alla tua presenza  \ncol sacrificio della lode,  \ncon il canto io ti esalterò,  \nbenedetto il Nome tuo.  \n  \nTi darò tutta la glora,  \nmi hai liberato dal timore,  \nla tua giustizia mi ha salvato,  \nbenedetto il Nome tuo.  \n   \nINNALZIAM IL NOME TUO SANTO,  \nESALTIAM IL NOME TUO SIGNOR.   \n\nINNALZIAM IL NOME TUO SANTO,  \nIL NOME TUO SIGNOR.  \n(x2)',s:'innalziamo il nome tuo santo entrero alla tua presenza col sacrificio della lode con il canto io ti esaltero benedetto il nome tuo ti daro tutta la glora mi hai liberato dal timore la tua giustizia mi ha salvato benedetto il nome tuo innalziam il nome tuo santo esaltiam il nome tuo signor innalziam il nome tuo santo il nome tuo signor x2 145',type:'N',i:177},
{n:'146',t:'IO CELEBRERÒ',c:'lo celebrerò il Signore,  \ncanterò un canto nuovo.  (x2)  \n \nLode  al Signor,  \ncanterò un canto nuovo.  (x2)  \n  \nAlleluia, alleluia, alleluia, alleluia,   \nallelu, alleluia! (x2)  \n \nLode al Signor, \ncanterò un canto nuovo. (x2)',s:'io celebrero lo celebrero il signore cantero un canto nuovo x2 lode al signor cantero un canto nuovo x2 alleluia alleluia alleluia alleluia allelu alleluia x2 lode al signor cantero un canto nuovo x2 146',type:'N',i:178},
{n:'147',t:'IO HO UN AMICO CHE MI AMA',c:'C\'è grande gioia nel mio cuor,   \nc\'è grande gioia nel mio cuor  \nsono salvato, son perdonato   \nc\'è grande gioia nel mio cuor.  \n  \nIO HO UN AMICO CHE MI AMA,  \nMI AMA E MI PERDONA.  \nIO HO UN AMICO CHE MI AMA,  \nIL SUO NOME È GESÙ.  \n \nCHE MI AMA, CHE MI AMA,  \nCHE MI AMA COL SUO IMMENSO AMORE  (x2)  \n  \nTU HAI UN AMICO…  \n  \nNOI ABBIAMO UN AMICO… \n  \nC\'è grande gioia ...',s:'io ho un amico che mi ama c e grande gioia nel mio cuor c e grande gioia nel mio cuor sono salvato son perdonato c e grande gioia nel mio cuor io ho un amico che mi ama mi ama e mi perdona io ho un amico che mi ama il suo nome e gesu che mi ama che mi ama che mi ama col suo immenso amore x2 tu hai un amico noi abbiamo un amico c e grande gioia 147',type:'N',i:179},
{n:'148',t:'IO HO UNA GIOIA',c:'lo ho una gioia nel cuore,  \ngioia nel cuore, gioia nel cuore dentro me.  \nAlleluia! Gloria a Dio!  \n\nÈ come un fiume d\'acqua viva, fiume d\'acqua viva,   \nfiume d\'acqua viva dentro me.   \nAlza le braccia e loda il tuo Signor,   \nalza le braccia e loda il tuo Signor,   \ndà gloria a Dio, gloria a Dio, gloria a Lui,   \nalza le braccia e loda il tuo Signor.   \n  \nIo ho la pace nel cuore...  \n \nIo ho l\'amore nel cuore...  \n \nCon la sua forza cantando camminiam (x2)   \nGloria al Signor, al Signor, gloria al Signor.    \nCon la sua forza cantando camminiam.  \n \nNon vergognarti e loda il tuo Signor  (x2)   \nGloria al Signor, al Signor, gloria al Signor.   \nNon vergognarti e loda il tuo Signor.  \n \nAma i fratelli e loda il tuo Signor (x2)   \nGloria al Signor, al Signor, gloria al Signor.   \nAma i fratelli e loda il tuo Signor.',s:'io ho una gioia lo ho una gioia nel cuore gioia nel cuore gioia nel cuore dentro me alleluia gloria a dio e come un fiume d acqua viva fiume d acqua viva fiume d acqua viva dentro me alza le braccia e loda il tuo signor alza le braccia e loda il tuo signor da gloria a dio gloria a dio gloria a lui alza le braccia e loda il tuo signor io ho la pace nel cuore io ho l amore nel cuore con la sua forza cantando camminiam x2 gloria al signor al signor gloria al signor con la sua forza cantando camminiam non vergognarti e loda il tuo signor x2 gloria al signor al signor gloria al signor non vergognarti e loda il tuo signor ama i fratelli e loda il tuo signor x2 gloria al signor al signor gloria al signor ama i fratelli e loda il tuo signor 148',type:'N',i:180},
{n:'149',t:'IO LODERÒ IL SIGNORE',c:'lo loderò il Signore con tutto il mio cuore.  \nRacconterò le tue meraviglie e loderò  il tuo Nome.  \n  \nIo  loderò il Signore con tutto  il mio cuore.  \nFarò di te l\'oggetto della mia lode.  Alleluia!  \n \nlo canterò...  \n \nIo servirò...      \n  \nIo invocherò...',s:'io lodero il signore lo lodero il signore con tutto il mio cuore raccontero le tue meraviglie e lodero il tuo nome io lodero il signore con tutto il mio cuore faro di te l oggetto della mia lode alleluia lo cantero io serviro io invochero 149',type:'N',i:181},
{n:'150',t:'IO SCELGO TE',c:'Io scelgo te come Signore della mia vita,  \nscelgo te  perché il mondo amore non mi dà.  \nlo voglio amare te,   \nguardare il tuo volto e vivere per te.  \n  \nLA MIA VOCE SALE A TE,  \nASCOLTAMI SIGNOR, PER SEMPRE IN TE VIVRÒ,   \nIO TI BENEDIRÒ, ACCOGLI LA MIA LODE.  \n\nLA MIA VOCE SALE A TE,  \nASCOLTAMI SIGNOR, PER SEMPRE IN TE VIVRÒ,  \nIO TI BENEDIRÒ PERCHÉ TU SEI IL MIO RE,  \nACCOGLI LA MIA LODE.  \n  \nIo cerco te, tu sei il Signore della mia vita,  \ncerco te perché il mondo pace non mi dà.  \nIo voglio amare te,  \nguardare il tuo volto e vivere per te. (RIT) \n \n(coda facoltativa) \n  \nMIO SIGNOR.  \n  \nLA MIA VOCE SALE A TE,  \nASCOLTAMI SIGNOR, PER SEMPRE IN TE VIVRÒ,  \nIO TI BENEDIRÒ PERCHÉ TU SEI IL MIO RE,  \nACCOGLI LA MIA LODE.',s:'io scelgo te io scelgo te come signore della mia vita scelgo te perche il mondo amore non mi da lo voglio amare te guardare il tuo volto e vivere per te la mia voce sale a te ascoltami signor per sempre in te vivro io ti benediro accogli la mia lode la mia voce sale a te ascoltami signor per sempre in te vivro io ti benediro perche tu sei il mio re accogli la mia lode io cerco te tu sei il signore della mia vita cerco te perche il mondo pace non mi da io voglio amare te guardare il tuo volto e vivere per te rit coda facoltativa mio signor la mia voce sale a te ascoltami signor per sempre in te vivro io ti benediro perche tu sei il mio re accogli la mia lode 150',type:'N',i:182},
{n:'151',t:'IO SONO CON TE',c:'IO SONO CON TE, NEL TUO CUORE SONO CON TE.  \nIO CERCO TE, NEL TUO CUORE CERCO TE.  \n  \nSon venuto e ti ho dato la vita,  \nnelle tue mani il mio Corpo e il mio Sangue,  \nho sofferto con te nel dolore  \nper donarti  l\'amore più grande. (RIT) \n  \nSon beati i puri di cuore  \nperché vedranno  Dio.  \nSono io che rivesto di luce  \nil buio del tuo io. (RIT) \n  \nGuarda le mie mani, i miei piedi  \nperché ancora  non credi?  \nMetti qui la tua mano,  \nè caldo il mio petto squarciato. (RIT) \n  \nSenti, ti chiamo per nome,  \nsono io la risurrezione,  \nti amo così come sei,  \ncon tutto quello che hai. (RIT)',s:'io sono con te io sono con te nel tuo cuore sono con te io cerco te nel tuo cuore cerco te son venuto e ti ho dato la vita nelle tue mani il mio corpo e il mio sangue ho sofferto con te nel dolore per donarti l amore piu grande rit son beati i puri di cuore perche vedranno dio sono io che rivesto di luce il buio del tuo io rit guarda le mie mani i miei piedi perche ancora non credi metti qui la tua mano e caldo il mio petto squarciato rit senti ti chiamo per nome sono io la risurrezione ti amo cosi come sei con tutto quello che hai rit 151',type:'N',i:183},
{n:'152',t:'IO TI DICO',c:'IO TI DICO CHE SE TU CREDI   \nVEDRAI LA GLORIA DI DIO.   \nIO TI DICO CHE SE TU CREDI   \nVEDRAI LA GLORIA DI DIO.   \nVEDRAI LA GLORIA DI DIO  \nVEDRAI LA GLORIA DI DIO  \nVEDRAI LA GLORIA DI DIO  \nVEDRAI LA GLORIA DI DIO.  \n  \nIo  ti dico che se tu preghi ...   \n \nIo ti dico che se tu ami ...  \n \nIo  ti dico che se ti umìli ...  \n \nIo ti dico che se perdoni. ..',s:'io ti dico io ti dico che se tu credi vedrai la gloria di dio io ti dico che se tu credi vedrai la gloria di dio vedrai la gloria di dio vedrai la gloria di dio vedrai la gloria di dio vedrai la gloria di dio io ti dico che se tu preghi io ti dico che se tu ami io ti dico che se ti umili io ti dico che se perdoni 152',type:'N',i:184},
{n:'153',t:'IO VEDO IL RE',c:'Io vedo il Re, il mio Signor    \nadorato  sulla terra, innalzato su nel ciel.   \nIo vedo il Re, il mio Signor,   \ni miei occhi han visto il Re,  \nl\'Agnello, il Salvator che sempre regnerà. (x2)  \n   \nLa gloria di Dio riempie il tempio    \ne gli angeli intorno a lui lo acclamano Re.   \nCon  loro cantiamo: \"Santo, santo è il Signor,  \nlui solo è il Re\".',s:'io vedo il re io vedo il re il mio signor adorato sulla terra innalzato su nel ciel io vedo il re il mio signor i miei occhi han visto il re l agnello il salvator che sempre regnera x2 la gloria di dio riempie il tempio e gli angeli intorno a lui lo acclamano re con loro cantiamo santo santo e il signor lui solo e il re 153',type:'N',i:185},
{n:'154',t:'ISAIA 11',c:'ED UN VIRGULTO DAL TRONCO DI IESSE   \nDOMANI GERMOGLIERÀ.  \nUN RAMOSCELLO DALLE SUE RADICI   \nA VESSILLO SI ELEVERÀ.  \n   \nSu lui sapienza, intelletto, consiglio,   \nfortezza e timor del Signor.  \nLa sua Parola sarà come verga   \ne dal male ci libererà. (RIT) \n\n  \nL\'agnello e il lupo insieme staranno  \ne accanto al capretto vivran.  \nPascoleranno con l\'orsa e il leone,  \nun fanciullo li guiderà. (RIT) \n \nEd in quel giorno di nuovo il Signore  \nla mano su lui stenderà.  \nCome vessillo il germoglio di lesse  \nsui popoli si eleverà. (RIT)',s:'isaia 11 ed un virgulto dal tronco di iesse domani germogliera un ramoscello dalle sue radici a vessillo si elevera su lui sapienza intelletto consiglio fortezza e timor del signor la sua parola sara come verga e dal male ci liberera rit l agnello e il lupo insieme staranno e accanto al capretto vivran pascoleranno con l orsa e il leone un fanciullo li guidera rit ed in quel giorno di nuovo il signore la mano su lui stendera come vessillo il germoglio di lesse sui popoli si elevera rit 154',type:'N',i:186},
{n:'155',t:'ISAIA 43',c:'JAHVÈ, TU HAI CREATO ME,  \nMl HAI CHIAMATO PER NOME  \nED IO SONO TUO.  \nPER SEMPRE CANTERÒ LA TUA BONTÀ,   \nCAMMINERÒ NELLA LIBERTÀ,  \nNEL REGNO DELLA GLORIA.  \n  \nQuando cammino tra le acque,  \nmio Dio, tu sei con me  \ned i fiumi non mi sommergeranno più. (RIT) \n  \nPur camminando nel fuoco,  \nnon mi scotterò, né brucerò  \ne le fiamme non avranno alcun potere. (RIT) \n  \nTu ci chiami tuo popolo,  \nsiamo preziosi agli occhi tuoi  \ne ci doni ogni giorno la tua vita. (RIT) \nNoi siamo tuoi servi  \nE non abbiamo mai paura,  \ntu sei con noi  \ne ci hai fatto per la tua gloria. (RIT)',s:'isaia 43 jahve tu hai creato me ml hai chiamato per nome ed io sono tuo per sempre cantero la tua bonta camminero nella liberta nel regno della gloria quando cammino tra le acque mio dio tu sei con me ed i fiumi non mi sommergeranno piu rit pur camminando nel fuoco non mi scottero ne brucero e le fiamme non avranno alcun potere rit tu ci chiami tuo popolo siamo preziosi agli occhi tuoi e ci doni ogni giorno la tua vita rit noi siamo tuoi servi e non abbiamo mai paura tu sei con noi e ci hai fatto per la tua gloria rit 155',type:'N',i:187},
{n:'156',t:'LASCIATI ANDARE',c:'Lasciati andare nelle mani  \ndi Gesù il Figliol di Dio.  \nLa tua anima e il tuo cuor soddisferà.   \nTutte  le cose a cui ti appoggi   \nlasci a che le prenda lui  \ne ripieno del suo Spirito sarai!  \n  \nGESÙ,  O GESÙ RIEMPICI DI  TE! (x2)  \n\n  \nSu canta una melodia  \ncon la gioia nel tuo cuor,  \ndolcemente le tue mani innalza al ciel.  \nDai a Gesù la tua tristezza,  \ni tuoi anni di dolor  \nEd allora nella vita entrerai. (RIT)',s:'lasciati andare lasciati andare nelle mani di gesu il figliol di dio la tua anima e il tuo cuor soddisfera tutte le cose a cui ti appoggi lasci a che le prenda lui e ripieno del suo spirito sarai gesu o gesu riempici di te x2 su canta una melodia con la gioia nel tuo cuor dolcemente le tue mani innalza al ciel dai a gesu la tua tristezza i tuoi anni di dolor ed allora nella vita entrerai rit 156',type:'N',i:188},
{n:'157',t:'LAUDATO SII',c:'LAUDATO SII, O MI SIGNORE. (x4)  \n  \nE per tutte le tue creature,  \nper il sole e per la luna,  \nper le stelle e per il vento,  \ne per l\'acqua e per il fuoco. (RIT) \n  \nPer sorella madre terra,  \nci alimenta e ci sostiene,  \nper i frutti, i fiori e l\'erba,  \nper i monti e per il mare. (RIT) \n  \nPerché il senso della vita  \nè cantare e lodarti  \ne perché la nostra vita  \nsia sempre una canzone. (RIT) \n  \nE per quelli che ora piangono,  \ne per quelli che ora soffrono,  \ne per quelli che ora nascono,  \ne per quelli che ora muoiono. (RIT)',s:'laudato sii laudato sii o mi signore x4 e per tutte le tue creature per il sole e per la luna per le stelle e per il vento e per l acqua e per il fuoco rit per sorella madre terra ci alimenta e ci sostiene per i frutti i fiori e l erba per i monti e per il mare rit perche il senso della vita e cantare e lodarti e perche la nostra vita sia sempre una canzone rit e per quelli che ora piangono e per quelli che ora soffrono e per quelli che ora nascono e per quelli che ora muoiono rit 157',type:'N',i:189},
{n:'158',t:'LE BEATITUDINI',c:'Beati i poveri in spirito, di essi è il regno dei cieli.  \nBeati gli afflitti, perché saranno consolati.  \nBeati i miti, perché erediteranno la terra.  \n\nBeati quelli che han fame e sete della giustizia,  \nperché saranno saziati. Beati.  \n  \nBeati i misericordiosi, troveranno misericordia.  \nBeati i puri di cuore, perché vedranno Dio.  \nBeati i costruttori di pace, saran chiamati figli di Dio  \nBeati i perseguitati a causa della giustizia,  \ndi essi è il regno dei cieli. Beati.  \n  \nRallegratevi ed esultate,  \nperché grande è la vostra ricompensa,  \nnei cieli, nei cieli.  Beati, beati',s:'le beatitudini beati i poveri in spirito di essi e il regno dei cieli beati gli afflitti perche saranno consolati beati i miti perche erediteranno la terra beati quelli che han fame e sete della giustizia perche saranno saziati beati beati i misericordiosi troveranno misericordia beati i puri di cuore perche vedranno dio beati i costruttori di pace saran chiamati figli di dio beati i perseguitati a causa della giustizia di essi e il regno dei cieli beati rallegratevi ed esultate perche grande e la vostra ricompensa nei cieli nei cieli beati beati 158',type:'N',i:190},
{n:'159',t:'LE MANI ALZATE',c:'LE MANI ALZATE VERSO TE, SIGNOR,  \nPER OFFRIRTI  IL MONDO.  \nLE MANI ALZATE VERSO TE, SIGNOR,  \nGIOIA È IN ME NEL PROFONDO.  \n \nGuardaci  tu, Signore, siamo tuoi,    \npiccoli siam davanti a te.  \nCome ruscelli siamo d\'acqua limpida,  \nsemplici e puri innanzi a te. (RIT) \n \nGuidaci tu, Signore, siamo tuoi,  \nsei via, vita e verità.   \nSe  ci terrai le mani nella mano,  \nil cuore più non temerà. (RIT) \n \nFormaci tu, Signore, siamo tuoi,  \nnulla noi siamo senza te.  \nFragili tralci uniti alla tua vite,  \nfecondi solo uniti a te. (RIT) \n  \nRiempici tu, Signore, siamo tuoi,  \ndonaci tu il Consolatore.  \nVivremo in te Signor, della tua gioia,   \ndaremo  gioia al mondo inter. (RIT) \n \nUsaci tu, Signore, siamo tuoi,  \nnulla possiamo senza te.   \nNel  Nome tuo potremo far prodigi,  \nnulla potremo senza te. (RIT)',s:'le mani alzate le mani alzate verso te signor per offrirti il mondo le mani alzate verso te signor gioia e in me nel profondo guardaci tu signore siamo tuoi piccoli siam davanti a te come ruscelli siamo d acqua limpida semplici e puri innanzi a te rit guidaci tu signore siamo tuoi sei via vita e verita se ci terrai le mani nella mano il cuore piu non temera rit formaci tu signore siamo tuoi nulla noi siamo senza te fragili tralci uniti alla tua vite fecondi solo uniti a te rit riempici tu signore siamo tuoi donaci tu il consolatore vivremo in te signor della tua gioia daremo gioia al mondo inter rit usaci tu signore siamo tuoi nulla possiamo senza te nel nome tuo potremo far prodigi nulla potremo senza te rit 159',type:'N',i:191},
{n:'160',t:'LODATE CIELI DEI CIELI',c:'LODATE CIELI DEI CIELI Il SIGNORE,   \nCANTATE DA TUTTA LA TERRA AL SIGNORE.  \n  \nSia benedetto Dio, per sempre regnerà.   \nHa cura dell\'umanità, egli salva. (RIT) \n  \nNon prevarrà la morte, l\'angoscia sparirà.  \nLui schiaccerà il nemico e vincerà. (RIT) \n  \nCon gli angeli e coi santi nel cielo splenderà.   \nEsulteranno i popoli della terra. (RIT) \n \nCavalca su nei cieli, potente il nostro Re.  \nRiconoscete o popoli il Signore. (RIT)',s:'lodate cieli dei cieli lodate cieli dei cieli il signore cantate da tutta la terra al signore sia benedetto dio per sempre regnera ha cura dell umanita egli salva rit non prevarra la morte l angoscia sparira lui schiaccera il nemico e vincera rit con gli angeli e coi santi nel cielo splendera esulteranno i popoli della terra rit cavalca su nei cieli potente il nostro re riconoscete o popoli il signore rit 160',type:'N',i:192},
{n:'161',t:'LODATE IL SUO NOME',c:'Lodate, o servi del Signore,   \nlodate il suo Nome con tutto il cuore.  \nSia benedetto il nome del Signore  \nora e sempre.  \n  \nCHI È PARI AL SIGNORE NOSTRO DIO,  \nCHE SIEDE NELL\'ALTO SUO TRONO  \nE SI CHINA A MIRARE  \nI CIELI E LA TERRA?  \n  \nDal sorgere del sole  \nsino al suo tramonto lode al suo Nome.  \nSu tutti i popoli Signore  \neccelso è il tuo Nome e la tua gloria. (RIT) \n  \nFa abitare la sterile  \nnella sua dimora il nostro Signor.  \nLe dona figli nella sua bontà  \ne gioconda  lei  sarà. (RIT)',s:'lodate il suo nome lodate o servi del signore lodate il suo nome con tutto il cuore sia benedetto il nome del signore ora e sempre chi e pari al signore nostro dio che siede nell alto suo trono e si china a mirare i cieli e la terra dal sorgere del sole sino al suo tramonto lode al suo nome su tutti i popoli signore eccelso e il tuo nome e la tua gloria rit fa abitare la sterile nella sua dimora il nostro signor le dona figli nella sua bonta e gioconda lei sara rit 161',type:'N',i:193},
{n:'162',t:'LODE A TE SIGNOR',c:'Lode a te Signor,   \nlode a te Signor,  \nmia roccia,  mia fortezza,  \nmia vita, mio canto.  \nLode a te Signor,  \nlode a te Signor.  \n  \nALLELUIA. (x8)',s:'lode a te signor lode a te signor lode a te signor mia roccia mia fortezza mia vita mio canto lode a te signor lode a te signor alleluia x8 162',type:'N',i:194},
{n:'163',t:'LODE AL SIGNORE',c:'ALLELUIA, ALLELUIA, ALLELUIA!  \n \nLode al Signore nel tempio,   \nlode al gran Re del creato,   \nlode alla sua potenza,   \nlode alla sua maestà. (RIT) \n  \nLode con squilli di tromba,  \nlode con arpa e cetra,   \nlode con timpani e danze,  \nlode con viole e corde. (RIT) \n  \nLode con tamburi sonori,  \nlode con liuti e flauti,  \n lode con suoni e fragori,  \nlode alla sua maestà. (RIT) \n  \nLode con strumenti gioiosi,  \nlodi tutto ciò che respira,   \nlode al Signore lddio,  \nlodi il creato intero. (RIT) \n  \nLode al Padre eterno,  \nlode al Signore Gesù,   \nlode allo Spirito Santo,  \nlode alla Santa Trinità. (RIT)',s:'lode al signore alleluia alleluia alleluia lode al signore nel tempio lode al gran re del creato lode alla sua potenza lode alla sua maesta rit lode con squilli di tromba lode con arpa e cetra lode con timpani e danze lode con viole e corde rit lode con tamburi sonori lode con liuti e flauti lode con suoni e fragori lode alla sua maesta rit lode con strumenti gioiosi lodi tutto cio che respira lode al signore lddio lodi il creato intero rit lode al padre eterno lode al signore gesu lode allo spirito santo lode alla santa trinita rit 163',type:'N',i:195},
{n:'164',t:'LODE AL SIGNORE',c:'Lode al Signore per sempre,  \ncantiamo alla sua potenza.   \nLode alla sua maestà,  \namen, amen, amen!  \n  \nPoiché lui solo è santo,  \ndegno di lode nei secoli.   \nDio onnipotente,  \namen, amen, amen!  \n  \nSalvezza, forza e potenza,  \nonore e gloria e vittoria.  \nBenedizione al Signor,  \namen, amen, amen!',s:'lode al signore lode al signore per sempre cantiamo alla sua potenza lode alla sua maesta amen amen amen poiche lui solo e santo degno di lode nei secoli dio onnipotente amen amen amen salvezza forza e potenza onore e gloria e vittoria benedizione al signor amen amen amen 164',type:'N',i:196},
{n:'165',t:'LODE E GLORIA A TE',c:'LODE E GLORIA A TE, LODE E GLORIA A TE,  \nLUCE DEL MATTINO, LODE E GLORIA A TE.  \n \n(Insieme) Lode e gloria a te, lode e gloria a te,  \nluce del mattino, lode e gloria a te;  \n \n(solo) M\'ha fatto camminare, m\'ha fatto camminare,  \nper questo canto: lode e gloria a te. (RIT) \nLo loderò nel tempio, lo loderò nel ciel,  \nper sempre canto lode e gloria a te. (RIT) \n \nLo loderò con l\'arpa, io loderò il Signor,  \nmi ha fatto grandi cose, gloria a te. (RIT) \n \nLo loderò con danze, mi ha fatto camminar,  \nper questo canto: lode e gloria a te. (RIT)',s:'lode e gloria a te lode e gloria a te lode e gloria a te luce del mattino lode e gloria a te insieme lode e gloria a te lode e gloria a te luce del mattino lode e gloria a te solo m ha fatto camminare m ha fatto camminare per questo canto lode e gloria a te rit lo lodero nel tempio lo lodero nel ciel per sempre canto lode e gloria a te rit lo lodero con l arpa io lodero il signor mi ha fatto grandi cose gloria a te rit lo lodero con danze mi ha fatto camminar per questo canto lode e gloria a te rit 165',type:'N',i:197},
{n:'166',t:'LODE E GLORIA AL TUO NOME',c:'(uomini) Lode e gloria al tuo nome, alleluia, alleluia.  \n(donne) Dio dell\'universo, alleluia alleluia.  \n  \nGLORIA GLORIA AL-LE LU IA \nGLORIA GLORIA AL-LE LU IA \n  \n(uomini) Cantiamo al nostro Dio, alleluia, alleluia.  \n(donne) E lui il creator, alleluia, alleluia. (RIT) \n \n(uomini) Ha fatto meraviglie, alleluia, alleluia.  \n\n(donne) Eterno è il suo amor, alleluia, alleluia. (RIT) \n \n(uomini) Le mani elevo al suo Nome, alleluia, alleluia.  \n(donne) Per sempre lo loderò, alleluia, alleluia. (RIT)',s:'lode e gloria al tuo nome uomini lode e gloria al tuo nome alleluia alleluia donne dio dell universo alleluia alleluia gloria gloria al le lu ia gloria gloria al le lu ia uomini cantiamo al nostro dio alleluia alleluia donne e lui il creator alleluia alleluia rit uomini ha fatto meraviglie alleluia alleluia donne eterno e il suo amor alleluia alleluia rit uomini le mani elevo al suo nome alleluia alleluia donne per sempre lo lodero alleluia alleluia rit 166',type:'N',i:198},
{n:'167',t:'LOS QUE ESPERAN EN JESUS',c:'Los que esperan, los que esperan en Jesus.  \nLos que esperan, los que esperan en Jesus. (x2)  \n  \nComo las àguilas, como las àguilas sus alas levantaràn.  \nComo las àguilas, como las àguilas sus alas levantaràn.  \n  \nCaminaràn y no se cansaràn, correràn no se fatigaràn.  \nNuevas fuerzas tendràn, nuevas fuerzas tendràn.  \nLos que esperan los que esperan en Jesus.  \nNuevas fuerzas tendràn, nuevas fuerzas tendràn.  \nLos que esperan, los que esperan en Jesus.  \n  \nLos que aman...  \nLos que creen...  \nLos que siguen...   \nLos que sirven...  \nLos que viven...  \nLos que alaban...  \nLos que oran...  \nLos que aplauden ...',s:'los que esperan en jesus los que esperan los que esperan en jesus los que esperan los que esperan en jesus x2 como las aguilas como las aguilas sus alas levantaran como las aguilas como las aguilas sus alas levantaran caminaran y no se cansaran correran no se fatigaran nuevas fuerzas tendran nuevas fuerzas tendran los que esperan los que esperan en jesus nuevas fuerzas tendran nuevas fuerzas tendran los que esperan los que esperan en jesus los que aman los que creen los que siguen los que sirven los que viven los que alaban los que oran los que aplauden 167',type:'N',i:199},
{n:'168',t:'LUCE DEL MONDO',c:'Luce del mondo sei, Signor,  \nil tuo amore ci illumina  \ne le tenebre che avvolgono il nostro cuor  \ncon la tua luce svaniscono.  \n \nLuce del mondo sei, Signor,  \nil tuo amore ci illumina   \ne le tenebre che avvolgono il nostro cuor  \ncon la tua luce svaniscono,   \ncon la tua luce svaniscono.  \n\n \nLuce del mondo sei,  \nluce che illumina,  \nluce del mondo sei!  \nIl tuo amore, Signor, mai si  spegnerà,  \nperché   luce del mondo sei, luce che illumina.  \n \nGioia del mondo sei, Signor,  \nil tuo amore ci fa cantar,  \nle tristezze che sempre ci opprimono  \ncon la tua gioia svaniscono.  \n \nGioia del mondo sei, Signor,  \nil tuo amore ci fa cantar,  \nle tristezze che sempre ci opprimono  \ncon la tua gioia svaniscono,  \ncon la tua gioia svaniscono.  \n \nGioia del mondo sei,  \ngioia che fa cantar,  \ngioia del mondo sei!  \nIl tuo amore, Signor,  \nmai si spegnerà,  \nperché gioia del mondo sei,  \ngioia che fa cantar.  \n \nForza del mondo sei, Signor,  \nil tuo amore ci libera,  \nle catene che ci legano  \ncon la tua forza svaniscono.  \n \nForza del mondo sei, Signor,  \nil tuo amore ci libera,  \nle catene che ci legano  \ncon la tua forza svaniscono,  \ncon la tua forza svaniscono. \n  \nForza del mondo sei,  \nforza che libera, forza del mondo sei!  \nIl tuo amore, Signor, mai si spegnerà,  \nperché forza del mondo sei, forza che libera.',s:'luce del mondo luce del mondo sei signor il tuo amore ci illumina e le tenebre che avvolgono il nostro cuor con la tua luce svaniscono luce del mondo sei signor il tuo amore ci illumina e le tenebre che avvolgono il nostro cuor con la tua luce svaniscono con la tua luce svaniscono luce del mondo sei luce che illumina luce del mondo sei il tuo amore signor mai si spegnera perche luce del mondo sei luce che illumina gioia del mondo sei signor il tuo amore ci fa cantar le tristezze che sempre ci opprimono con la tua gioia svaniscono gioia del mondo sei signor il tuo amore ci f {n:'169',t:'LUI VERRÀ E TI SALVERÀ',c:'A chi è nell\'angoscia  tu dirai:  \nnon devi temere,   \nil tuo Signor è qui,  \ncon la forza sua.  \nQuando invochi il suo Nome  \nlui ti salverà.  \n  \nLUI VERRÀ E TI SALVERÀ,  \nDIO VERRÀ E TI SALVERÀ,  \nDI\' A CHI È SMARRITO CHE  \nCERTO LUI TORNERÀ.  \nDIO VERRÀ E TI SALVERÀ,  \nLUI VERRÀ E TI SALVERÀ,  \nDIO VERRÀ E TI SALVERÀ,  \nALZA I TUOI OCCHI A LUI,   \nPRESTO RITORNERÀ,  \nLUI VERRÀ E TI SALVERÀ.  \n  \nA chi ha il cuore ferito tu dirai:  \nconfida in Dio,  \nil tuo Signor è qui,  \ncol  suo grande amor.  \nQuando invochi il suo Nome  \nlui ti salverà. (RIT) \n  \nEgli è rifugio nelle avversità,  \ndalla tempesta ti riparerà.  \nÈ il tuo baluardo e ti difenderà,  \nla forza sua lui ti darà. (RIT)',s:'lui verra e ti salvera a chi e nell angoscia tu dirai non devi temere il tuo signor e qui con la forza sua quando invochi il suo nome lui ti salvera lui verra e ti salvera dio verra e ti salvera di a chi e smarrito che certo lui tornera dio verra e ti salvera lui verra e ti salvera dio verra e ti salvera alza i tuoi occhi a lui presto ritornera lui verra e ti salvera a chi ha il cuore ferito tu dirai confida in dio il tuo signor e qui col suo grande amor quando invochi il suo nome lui ti salvera rit egli e rifugio nelle avversita dalla tempesta ti riparera e il tuo baluardo e ti difendera la forza sua lui ti dara rit 169',type:'N',i:201},
{n:'170',t:'MAGNIFICA IL SIGNORE ANIMA MIA',c:'MAGNIFICA IL SIGNORE ANIMA MIA  \nED IL MIO SPIRITO ESULTA IN DIO.  \nALLELUIA, ALLELUIA, ALLELUIA!  \nALLELUIA, ALLELUIA!  \n  \nPerché ha guardato  \nl\'umiltà della sua serva:  \necco ora mi chiameran beata;  \nperché il potente  \nmi ha fatto grandi cose  \ne santo è il suo Nome.  \nAlleluia, alleluia! (RIT) \n \n\nHa spiegato la potenza del suo braccio,  \nha disperso i superbi di cuore,  \ni potenti rovescia dai troni  \ne innalza gli umili  \ne li ricolma di ogni bene. (RIT) \n  \nIl suo servo Israele egli solleva  \nricordando la sua misericordia   \npromessa  ad Abramo e ai nostri padri  \ne a tutti i suoi figli,  \nperché santo è il suo Nome. (RIT)',s:'magnifica il signore anima mia magnifica il signore anima mia ed il mio spirito esulta in dio alleluia alleluia alleluia alleluia alleluia perche ha guardato l umilta della sua serva ecco ora mi chiameran beata perche il potente mi ha fatto grandi cose e santo e il suo nome alleluia alleluia rit ha spiegato la potenza del suo braccio ha disperso i superbi di cuore i potenti rovescia dai troni e innalza gli umili e li ricolma di ogni bene rit il suo servo israele egli solleva ricordando la sua misericordia promessa ad abramo e ai nostri padri e a tutti i suoi figli perche santo e il suo nome rit 170',type:'N',i:202},
{n:'171',t:'MAGNIFICAT',c:'Magnificat, magnificat,  \nmagnificat anima mea Dominum.  \nMagnificat, magnificat,  \nmagnificat anima mea!',s:'magnificat magnificat magnificat magnificat anima mea dominum magnificat magnificat magnificat anima mea 171',type:'N',i:203},
{n:'172',t:'MAGNIFICAT',c:'L\'ANIMA MIA MAGNIFICA IL SIGNORE  \nED IL MIO SPIRITO ESULTA AL SALVATORE  \nPERCHE HA GUARDATO ALL\'UMILTA DELLA SUA SERVA  \nE D\'ORA IN POI Ml CHIAMERAN BEATA.  \n \nGrandi cose ha fatto in me il Signore  \ne santo è il suo Nome.  \nLa sua bontà si stende su chi lo teme,  \nha spiegato la potenza del suo braccio,  \nha disperso i superbi di cuore,  \nha rovesciato i potenti dai loro troni. (RIT) \n  \nHa innalzato gli umili,  \nha ricolmato di beni gli affamati,   \nha rimandato i ricchi a mani vuote;  \nha soccorso il suo servo Israele  \nricordando la sua bontà promessa  \nai nostri padri, ad Abramo  \ne a la sua discendenza per sempre. (RIT)',s:'magnificat l anima mia magnifica il signore ed il mio spirito esulta al salvatore perche ha guardato all umilta della sua serva e d ora in poi ml chiameran beata grandi cose ha fatto in me il signore e santo e il suo nome la sua bonta si stende su chi lo teme ha spiegato la potenza del suo braccio ha disperso i superbi di cuore ha rovesciato i potenti dai loro troni rit ha innalzato gli umili ha ricolmato di beni gli affamati ha rimandato i ricchi a mani vuote ha soccorso il suo servo israele ricordando la sua bonta promessa ai nostri padri ad abramo e a la sua discendenza per sempre rit 172',type:'N',i:204},
{n:'173',t:'MAGNIFICAT (rallegrati)',c:'RALLEGRATI PIENA DI GRAZIA,  \nIL SIGNOR È CON TE.  \n\n  \nL\'anima mia magnifica il Signore,  \ne il mio spirito esulta in Dio, mio Salvatore,   \nperché ha guardato l\'umiltà della sua serva.  \nD\'ora in poi tutte le generazioni mi chiameranno beata!  \n  \nGrandi cose ha fatto in me l\'Onnipotente,  \ne santo è il suo Nome:  \ndi generazione in generazione la sua misericordia   \nsi stende su quelli che lo temono.  \n  \nHa spiegato la potenza del suo braccio,  \nha disperso i superbi nei pensieri del loro cuore,   \nha rovesciato i potenti dai troni,  \nha innalzato gli umili.  \n  \nHa ricolmato di beni gli affamati,  \nha rimandato i ricchi a mani vuote.   \nHa soccorso Israele suo servo,  \nricordandosi  della sua misericordia.  \nCome aveva promesso ai nostri padri,  \nad Abramo e alla sua discendenza, per sempre!',s:'magnificat rallegrati rallegrati piena di grazia il signor e con te l anima mia magnifica il signore e il mio spirito esulta in dio mio salvatore perche ha guardato l umilta della sua serva d ora in poi tutte le generazioni mi chiameranno beata grandi cose ha fatto in me l onnipotente e santo e il suo nome di generazione in generazione la sua misericordia si stende su quelli che lo temono ha spiegato la potenza del suo braccio ha disperso i superbi nei pensieri del loro cuore ha rovesciato i potenti dai troni ha innalzato gli umili ha ricolmato di beni gli affamati ha rimandato i ricchi a mani vuote ha soccorso israele suo servo ricordandosi della sua misericordia come aveva promesso ai nostri padri ad abramo e alla sua discendenza per sempre 173',type:'N',i:205},
{n:'174',t:'MARANATHA’',c:'In un batter d\'occhio Gesù ritornerà,  \ncome un ladro nella notte arriverà,  \nandremo in cielo incontro a lui nella sua gloria,  \nMaranathà Gesù il vivente tornerà!  \n  \nMARANATHÀ,   MARANATHÀ,  \nGESÙ DI NUOVO TORNERÀ.  \nMARANATHÀ,   MARANATHÀ,  \nGESÙ DI NUOVO TORNERÀ, RITORNERÀ!  \n  \nSe lui oggi ritornasse saresti pronto?  \nSei sicuro che Gesù è il tuo Signor?  \nAccetta Gesù Cristo come il tuo Signore  \ne col Salvator Gesù regnerai! (RIT) \n  \nIn un batter d\'occhio Gesù ritornerà,  \ncome un ladro nella notte arriverà,  \nandremo in cielo incontro a lui nella sua gloria,  \nMaranathà Gesù vivente tornerà!  \n  \nMARANATHÀ,  \nTORNERÀ, OH OH TORNERÀ.  \n(x4)',s:'maranatha in un batter d occhio gesu ritornera come un ladro nella notte arrivera andremo in cielo incontro a lui nella sua gloria maranatha gesu il vivente tornera maranatha maranatha gesu di nuovo tornera maranatha maranatha gesu di nuovo tornera ritornera se lui oggi ritornasse saresti pronto sei sicuro che gesu e il tuo signor accetta gesu cristo come il tuo signore e col salvator gesu regnerai rit in un batter d occhio gesu ritornera come un ladro nella notte arrivera andremo in cielo incontro a lui nella sua gloria maranatha gesu vivente tornera maranatha tornera oh oh tornera x4 174',type:'N',i:206},
{n:'175',t:'MARANATHÀ (ti cantiam)',c:'Maranathà  Signor,  \nmaranathà!  \nNoi t\'invochiamo, vieni presto Signor!  \nTi apriamo i cuori, le nostre vite  ti  offriam,  \nfa\' di  noi il tuo popolo Signor.  \n \nGesù tu sei il Signor, il nostro Re.  \nA te la gloria,  la potenza e l\'onor!  \nTu sei l\'Agnello immolato per noi,  \ncol tuo sangue ci hai redenti o Signor.  \n  \nE CON GLI ANGELI E I SANTI, \nPROSTRATI TI CANTIAM  \nALLELUIA! ALLELUIA!  \nBENEDETIO NEI SECOLI IL SIGNOR!  \n \nOh...  \nOh...  \nEmanuele, le nostre vite ti offriam,  \nfà di noi la tua Chiesa, o Signor.  \n  \nFORMEREMO UN SOLO CORPO CHE LODA IL SIGNOR,   \nALLELUIA, ALLELUIA. BENEDETIO NEI SECOLI SIGNOR!  \n  \nE CON GLI ANGELI E I SANTI,PROSTRATI TI CANTIAM   \nALLELUIA, ALLELUIA, ALLELUIA, AMEN!',s:'maranatha ti cantiam maranatha signor maranatha noi t invochiamo vieni presto signor ti apriamo i cuori le nostre vite ti offriam fa di noi il tuo popolo signor gesu tu sei il signor il nostro re a te la gloria la potenza e l onor tu sei l agnello immolato per noi col tuo sangue ci hai redenti o signor e con gli angeli e i santi prostrati ti cantiam alleluia alleluia benedetio nei secoli il signor oh oh emanuele le nostre vite ti offriam fa di noi la tua chiesa o signor formeremo un solo corpo che loda il signor alleluia alleluia benedetio nei secoli signor e con gli angeli e i santi prostrati ti cantiam alleluia alleluia alleluia amen 175',type:'N',i:207},
{n:'176',t:'MARANATHÀ, VIENI  SIGNOR',c:'MARANATHÀ, VIENI SIGNOR.  \nVERSO TE, GESÙ, LE MANI NOI LEVIAM.  \nMARANATHÀ, VIENI SIGNOR.  \nPRENDICI CON TE E SALVACI SIGNOR.  \n  \nGuardo verso le montagne,   \ndonde mi verrà il soccorso,   \nil soccorso vien da Dio,  \nche ha creato il mondo intero.  (RIT) \n  \nSorgi con il tuo amore,  \nla tua luce splenderà,  \nogni ombra  svanirà,  \n\nla tua gloria apparirà. (RIT) \n  \nSanto è nostro Signor,  \nil peccato egli portò,  \ndalla morte ci salvò,  \ne la vita a noi donò. (RIT) \n  \nMio Signor son peccatore,  \na te apro il mio cuore,  \nfa\' di me quello che vuoi  \ne per sempre in te vivrò. (RIT) \n  \nLa Parola giungerà  \nsino ad ogni estremità,  \ntestimoni noi sarem  \ndella tua verità. (RIT) \n  \nTu sei la mia libertà,  \nsolo i n te potrò sperar,  \nho fiducia in te Signor,  \nla mia vita cambierai. (RIT) \n  \nMi consegno a te Signor,  \nvieni dentro il mio cuor,  \nti ricevo o Salvator,  \ntu sei il mio liberator. (RIT) \n  \nBenedicici o Signor,  \nsii custode ai nostri cuori,  \ngiorno e notte veglierai  \ne con noi sempre sarai. (RIT) \n  \nRingraziamo te, Signor,  \nte o Padre creator,  \nte o Spirito d\'amor,  \nvieni presto o Signor. (RIT)',s:'maranatha vieni signor maranatha vieni signor verso te gesu le mani noi leviam maranatha vieni signor prendici con te e salvaci signor guardo verso le montagne donde mi verra il soccorso il soccorso vien da dio che ha creato il mondo intero rit sorgi con il tuo amore la tua luce splendera ogni ombra svanira la tua gloria apparira rit santo e nostro signor il peccato egli porto dalla morte ci salvo e la vita a noi dono rit mio signor son peccatore a te apro il mio cuore fa di me quello che vuoi e per sempre in te vivro rit la parola giungera sino ad ogni estremita testimoni noi sarem della tua verita rit tu sei la mia liberta solo i n te potro sperar ho fiducia in te signor la mia vita cambierai rit mi consegno a te signor vieni dentro il mio cuor ti ricevo o salvator tu sei il mio liberator rit benedicici o signor sii custode ai nostri cuori giorno e notte veglierai e con noi sempre sarai rit ringraziamo te signor te o padre creator te o spirito d amor vieni presto o signor rit 176',type:'N',i:208},
{n:'177',t:'MARIA TU CHE HAI ATTESO NEL SILENZIO',c:'Maria, tu che hai atteso nel silenzio  \nla sua Parola per noi:  \n \n\nAIUTACI AD ACCOGLIERE  \nIL FIGLIO TUO CHE ORA VIVE IN NOI.  \n  \nMaria, tu che sei stata così docile  \ndavanti al tuo Signor: (RIT) \n  \nMaria, tu che hai portato dolcemente  \nl\'immenso  dono d\'amor: (RIT) \n  \nMaria madre, umilmente tu hai sofferto  \nil suo ingiusto dolor: (RIT) \n  \nMaria, tu che ora vivi nella gloria  \ninsieme al tuo Signor: (RIT)',s:'maria tu che hai atteso nel silenzio maria tu che hai atteso nel silenzio la sua parola per noi aiutaci ad accogliere il figlio tuo che ora vive in noi maria tu che sei stata cosi docile davanti al tuo signor rit maria tu che hai portato dolcemente l immenso dono d amor rit maria madre umilmente tu hai sofferto il suo ingiusto dolor rit maria tu che ora vivi nella gloria insieme al tuo signor rit 177',type:'N',i:209},
{n:'178',t:'MI MANO ESTA LLENA',c:'Le mie mani son piene di benedizioni. (x2)  \nIl fratello che tocco benedetto sarà. (x2)  \nLe mie mani son piene di benedizioni.  \n  \nCristo mi ha preso per mano e non mi vuole lasciar. (x2)  \nlo ero tanto triste ma ora son felice  \nperché Cristo mi ha preso per mano e non mi vuole lasciar.  \n  \nlo mi sono innamorato mi sono innamorato  \nmi sono innamorato di Dio. (x2) .  \n \nlo ero tanto triste ma ora son felice  \nperché Cristo mi ha preso per mano e non mi vuole lasciar.',s:'mi mano esta llena le mie mani son piene di benedizioni x2 il fratello che tocco benedetto sara x2 le mie mani son piene di benedizioni cristo mi ha preso per mano e non mi vuole lasciar x2 lo ero tanto triste ma ora son felice perche cristo mi ha preso per mano e non mi vuole lasciar lo mi sono innamorato mi sono innamorato mi sono innamorato di dio x2 lo ero tanto triste ma ora son felice perche cristo mi ha preso per mano e non mi vuole lasciar 178',type:'N',i:210},
{n:'179',t:'MI PENSAMIENTO ERES TU',c:'Mi pensamiento eres tu, Senor,  \nMi pensamiento eres tu, Senor,  \nMi pensamiento eres tu, Senor,  \nMi pensamiento eres tu.  \n  \nPorque tu me has dado la vida,  \nporque tu me has dado de existir,  \nporque tu me has dado carino,  \nme has dado amor.  \n  \nPorque tu me has dado la vida,  \nporque tu me has dado de existir,  \nporque tu me has dado carino,  \n\nme has dado amor.  \n  \nMi alegrìa eres tu, Senor...  \n \nMi fortaleza eres tu, Senor...',s:'mi pensamiento eres tu mi pensamiento eres tu senor mi pensamiento eres tu senor mi pensamiento eres tu senor mi pensamiento eres tu porque tu me has dado la vida porque tu me has dado de existir porque tu me has dado carino me has dado amor porque tu me has dado la vida porque tu me has dado de existir porque tu me has dado carino me has dado amor mi alegria eres tu senor mi fortaleza eres tu senor 179',type:'N',i:211},
{n:'180',t:'MIA FORZA E MIO CANTO',c:'MIA FORZA E MIO CANTO È IL SIGNORE   \nEGLI Ml HA SALVATO E LO VOGLIO LODARE.   \nMIA FORZA E MIO CANTO È IL SIGNORE   \nÈ IL MIO DIO, GLORIA!  \n   \nIl Signore abbatte cavalli e cavalieri,   \nla sua destra annienta il nemico.   \nVoglio cantare in onore del Signore,   \nperchè ha trionfato. (RIT) \n  \nChi è come te tra gli dei o Signore,  \nchi è come te, maestoso in santità.  \nTremendo nelle imprese, operatore di prodigi,  \nchi è come te Signore. (RIT) \n \nGuidasti il popolo che hai riscattato,  \nlo conducesti alla tua santa dimora.  \nLo fai entrare e lo pianti sul monte  \ndella tua eredità. (RIT) \n  \nCantate al Signore che Israele ha salvato,  \nhanno camminato sull\'asciutto in mezzo al mare  \ncon timpani e cori di danze formate.  \nPer sempre il Signore regna. (RIT)',s:'mia forza e mio canto mia forza e mio canto e il signore egli ml ha salvato e lo voglio lodare mia forza e mio canto e il signore e il mio dio gloria il signore abbatte cavalli e cavalieri la sua destra annienta il nemico voglio cantare in onore del signore perche ha trionfato rit chi e come te tra gli dei o signore chi e come te maestoso in santita tremendo nelle imprese operatore di prodigi chi e come te signore rit guidasti il popolo che hai riscattato lo conducesti alla tua santa dimora lo fai entrare e lo pianti sul monte della tua eredita rit cantate al signore che israele ha salvato hanno camminato sull asciutto in mezzo al mare con timpani e cori di danze formate per sempre il signore regna rit 180',type:'N',i:212},
{n:'181',t:'MIA GIOIA SEI',c:'Mia gioia sei, speranza che  \nriempie i cuori rivolti verso te.  \nlo canterò che hai vinto la tristezza in me.  \nTi adorerò, ti loderò,  \ndavanti a te, mio Signor, danzerò,  \nnell\'amore del Padre per sempre io dimorerò.  \n  \nMia roccia sei, fortezza che  \nrinfranca i cuori rivolti verso te.   \nProclamerò la fedeltà del tuo amor.   \nTi adorerò, ti loderò,  \ndavanti a te, mio Signor, danzerò,  \nnell\'amore del Padre per sempre io dimorerò.  \n\n  \nUh uh uh ...  \nTi adorerò, ti loderò,  \ndavanti a te, mio Signor, danzerò,  \nnell\'amore del Padre dimorerò.  \n  \nMia luce sei, Parola che  \nconsola i cuori rivolti verso te.  \nAnnuncerò che sei la via e la verità.  \nTi adorerò, ti loderò,  \ndavanti a te, mio Signor, danzerò,   \nnell\'amore del Padre per sempre io dimorerò,  \nper sempre io dimorerò.',s:'mia gioia sei mia gioia sei speranza che riempie i cuori rivolti verso te lo cantero che hai vinto la tristezza in me ti adorero ti lodero davanti a te mio signor danzero nell amore del padre per sempre io dimorero mia roccia sei fortezza che rinfranca i cuori rivolti verso te proclamero la fedelta del tuo amor ti adorero ti lodero davanti a te mio signor danzero nell amore del padre per sempre io dimorero uh uh uh ti adorero ti lodero davanti a te mio signor danzero nell amore del padre dimorero mia luce sei parola che consola i cuori rivolti verso te annuncero che sei la via e la verita ti adorero ti lodero davanti a te mio signor danzero nell amore del padre per sempre io dimorero per sempre io dimorero 181',type:'N',i:213},
{n:'182',t:'MIO DIO MI ABBANDONO A TE',c:'Mio Dio, mi abbandono a te,   \nmi arrendo al tuo amor.   \nMio Dio io amo la tua croce,  \nmio Dio vivo del tuo amor.    \nMio Dio io amo la tua croce,  \nmio Dio vivo del tuo amor.  \n  \nAnche l\'uccello trova la sua casa,  \nla rondine ritrova il suo nido.  \nla mia gioia è vivere in te \ne in te lodare la vita.  \n  \nPassando per la valle del pianto  \nne hanno fatto sgorgare fonti vive   \ne marceranno sempre più in alto  \ne in Sion vedranno il suo volto.  \n  \nlo ho scelto: un giorno con te vale per me  \nben più che mille altrove.   \nDio Sabaoth ho fiducia in te,  \no mio Dio amo la tua casa.',s:'mio dio mi abbandono a te mio dio mi abbandono a te mi arrendo al tuo amor mio dio io amo la tua croce mio dio vivo del tuo amor mio dio io amo la tua croce mio dio vivo del tuo amor anche l uccello trova la sua casa la rondine ritrova il suo nido la mia gioia e vivere in te e in te lodare la vita passando per la valle del pianto ne hanno fatto sgorgare fonti vive e marceranno sempre piu in alto e in sion vedranno il suo volto lo ho scelto un giorno con te vale per me ben piu che mille altrove dio sabaoth ho fiducia in te o mio dio amo la tua casa 182',type:'N',i:214},
{n:'183',t:'MIO RIFUGIO SEI TU',c:'Mio rifugio sei tu,  \nin te io trovo riparo.  \nSoltanto a te, Signore Gesù,  \nla mia vita donerò.  \nMio rifugio sei tu,  \n\nin te io trovo riparo.  \nSoltanto a  te, Signore Gesù,  \nla mia vita   donerò.  \n  \nNELLA TUA CASA   \nIO VIVRÒ PER SEMPRE   \nE ALL\'OMBRA DELLE ALI TUE  \nAL SICURO SARÒ.  \nMIO RIFUGIO SEI TU,  \nSOLTANTO A TE MI AFFIDERÒ.  \n \n(da capo) \n  \nMio rifugio sei tu,  \nsoltanto a te mi affiderò.',s:'mio rifugio sei tu mio rifugio sei tu in te io trovo riparo soltanto a te signore gesu la mia vita donero mio rifugio sei tu in te io trovo riparo soltanto a te signore gesu la mia vita donero nella tua casa io vivro per sempre e all ombra delle ali tue al sicuro saro mio rifugio sei tu soltanto a te mi affidero da capo mio rifugio sei tu soltanto a te mi affidero 183',type:'N',i:215},
{n:'184',t:'MISERERE',c:'Miserere mei Domine.   \nMiserere mei Domine.  \nPietà di me Signore pietà.  \nGesù di me abbi pietà.  \n \n(da capo)',s:'miserere miserere mei domine miserere mei domine pieta di me signore pieta gesu di me abbi pieta da capo 184',type:'N',i:216},
{n:'185',t:'MISERICORDIAS DOMINI',c:'Misericordias Domini  in aeternum  cantabo.',s:'misericordias domini misericordias domini in aeternum cantabo 185',type:'N',i:217},
{n:'186',t:'NE’ LA MORTE NE’ LA VITA',c:'NE’ LA MORTE NE’ LA VITA \nNE’ PRESENTE NE’ AVVENIRE \nCI POTRA’ MAI SEPARARE \nDALL’AMOR DI CRISTO (x2) \n \nTutto concorre al bene di color che aman Dio. \nSe Dio è con noi chi sarà contro di noi? (RIT) \n \nChi potrà mai separarci dall’amor di Dio? \nNé l’angoscia, né la fame, né pericolo, né spada. (RIT) \n \nIn colui che ci ha chiamati noi saremo vincitori. \nSe con lui moriremo, con lui risorgeremo! (RIT)',s:'ne la morte ne la vita ne la morte ne la vita ne presente ne avvenire ci potra mai separare dall amor di cristo x2 tutto concorre al bene di color che aman dio se dio e con noi chi sara contro di noi rit chi potra mai separarci dall amor di dio ne l angoscia ne la fame ne pericolo ne spada rit in colui che ci ha chiamati noi saremo vincitori se con lui moriremo con lui risorgeremo rit 186',type:'N',i:218},
{n:'187',t:'NEL NOM DI GESU’',c:'Nel nom di Gesù ogni ginocchio si pieghi, \nnei cieli, in terra e in ogni luogo. \nNel nom di Gesù ogni lingua proclaim \nche Gesù Cristo è il Signor. \nAlla gloria di Dio Padre nello Spirito. Alleluia! \n \n(tutto x2)',s:'nel nom di gesu nel nom di gesu ogni ginocchio si pieghi nei cieli in terra e in ogni luogo nel nom di gesu ogni lingua proclaim che gesu cristo e il signor alla gloria di dio padre nello spirito alleluia tutto x2 187',type:'N',i:219},
{n:'188',t:'NELLA LUCE DEL SIGNOR MARCIAMO',c:'Nella luce del Signor marciamo,  \nnella luce del Signor marciamo.  \nNella luce del Signor marciamo,  \nnella luce del Signor marciamo.  \nNella luce, luce del Signor marciamo,  \nnella luce del Signor marciamo.  \nNella luce, luce del Signor marciamo,  \nnella luce del Signor marciamo.  \n \nNella  forza...  \n \nNella fede...  \n \nNella gioia...  \n \nNella  pace...  \n \nNell\'amore...',s:'nella luce del signor marciamo nella luce del signor marciamo nella luce del signor marciamo nella luce del signor marciamo nella luce del signor marciamo nella luce luce del signor marciamo nella luce del signor marciamo nella luce luce del signor marciamo nella luce del signor marciamo nella forza nella fede nella gioia nella pace nell amore 188',type:'N',i:220},
{n:'189',t:'NELLA TUA SANTITÀ',c:'Custodisci o Signor,    \nla mia vita e il mio cuor,   \ncosì io t\'innalzerò   \nnella tua santità,   \nnella tua santità.  \n \nPrendi la mia vita,   \nè  l\'offerta del mio amor,  \ndegno Agnello del Signor,  \nnella tua santità,  \n\nnella tua santità.  \n  \nSanto,   santo,   \nsanto sei   Signor Gesù.   \nDegno,   degno,  \nnella tua santità,   \nnella tua santità,   \nnella tua santità.',s:'nella tua santita custodisci o signor la mia vita e il mio cuor cosi io t innalzero nella tua santita nella tua santita prendi la mia vita e l offerta del mio amor degno agnello del signor nella tua santita nella tua santita santo santo santo sei signor gesu degno degno nella tua santita nella tua santita nella tua santita 189',type:'N',i:221},
{n:'190',t:'NOI INNALZEREMO IL NOSTRO CANTO',c:'Noi innalzeremo il nostro canto  \na Gesù il nostro Salvator  \nNoi innalzeremo il nostro canto  \nall\'Agnello, nostro Redentor.   \nLa sua croce ci ha liberato  \ndalla morte, dal peccato,  \ncol suo sangue ci ha riscattato,  \nper sempre loderò il Signore.  \n \nAlleluia, alleluia, alleluia \nPer sempre loderò il Signor (x2)',s:'noi innalzeremo il nostro canto noi innalzeremo il nostro canto a gesu il nostro salvator noi innalzeremo il nostro canto all agnello nostro redentor la sua croce ci ha liberato dalla morte dal peccato col suo sangue ci ha riscattato per sempre lodero il signore alleluia alleluia alleluia per sempre lodero il signor x2 190',type:'N',i:222},
{n:'191',t:'NOI LODEREMO IL SIGNORE',c:'NOI LODEREMO IL SIGNORE, \nNOI CANTEREMO IL SUO NOME,   \nPROCLAMEREMO LA SUA GLORIA,  \nL\'AMORE CHE NUTRE PER NOI.  \n  \nNOI LODEREMO IL SIGNORE,  \nNOI CANTEREMO IL SUO NOME,   \nPROCLAMEREMO LA SUA GLORIA,  \nL\'AMORE CHE NUTRE PER NOI.  \n \nGrazie Signore per la gioia che dai,  \nle meraviglie che per noi tu fai.   \nCon te nel cuor paura più non c\'è,  \ncammineremo nel tuo amore. (RIT) \n  \nGrazie Signore per la forza che dai  \ne l\'amore che per noi tu hai.  \nCon te nel cuor paura più non c\'è,  \ncammineremo nel tuo Nome.  \nNOI LODEREMO IL SIGNORE,  \n\nNOI CANTEREMO IL SUO NOME,   \nPROCLAMEREMO LA SUA GLORIA,  \nL\'AMORE CHE NUTRE PER NOI.   \nL\'AMORE CHE NUTRE PER NOI.',s:'noi loderemo il signore noi loderemo il signore noi canteremo il suo nome proclameremo la sua gloria l amore che nutre per noi noi loderemo il signore noi canteremo il suo nome proclameremo la sua gloria l amore che nutre per noi grazie signore per la gioia che dai le meraviglie che per noi tu fai con te nel cuor paura piu non c e cammineremo nel tuo amore rit grazie signore per la forza che dai e l amore che per noi tu hai con te nel cuor paura piu non c e cammineremo nel tuo nome noi loderemo il signore noi canteremo il suo nome proclameremo la sua gloria l amore che nutre per noi l amore che nutre per noi 191',type:'N',i:223},
{n:'192',t:'NOI T\'INVOCHIAMO',c:'Noi t\'invochiamo, vieni Signore,  \nSpirito Santo visita i cuori,  \nla tua Parola suscita in noi,  \nla nostra vita doniamo a te.  \n  \nNoi t\'invochiamo, vieni Signore,  \nSpirito Santo visita i cuori,  \ndona fortezza e verità,  \ndona sapienza e santità.  \n  \nNoi t\'invochiamo, vieni Signore,  \nSpirito Santo visita i cuori,  \nai tuoi fedeli che credono in te  \nmanda i tuoi doni, consacrali a te.  \n  \nNoi t\'invochiamo, noi t\'invochiamo,  \nnoi t\'invochiamo, vieni Signor!',s:'noi t invochiamo noi t invochiamo vieni signore spirito santo visita i cuori la tua parola suscita in noi la nostra vita doniamo a te noi t invochiamo vieni signore spirito santo visita i cuori dona fortezza e verita dona sapienza e santita noi t invochiamo vieni signore spirito santo visita i cuori ai tuoi fedeli che credono in te manda i tuoi doni consacrali a te noi t invochiamo noi t invochiamo noi t invochiamo vieni signor 192',type:'N',i:224},
{n:'193',t:'O CIELI PIOVETE DALL\'ALTO',c:'O CIELI PIOVETE DALL\'ALTO,  \nO NUBI MANDATECI IL SANTO.  \nO TERRA, APRITI O TERRA  \nE GERMINA IL SALVATOR.  \n  \nSiamo il deserto, siamo l\'arsura:  \nMaranathà, Maranathà.  \nSiamo il vento, nessuno ci ode:  \nMaranathà, Maranathà. (RIT)  \n  \nSiamo le tenebre, nessuno ci guida:  \nMaranathà,  Maranathà.  \nSiam le catene, nessuno ci scioglie:  \nMaranathà, Maranathà. (RIT)   \n \nSiamo il freddo, nessuno ci copre:  \nMaranathà,  Maranathà.  \nSiamo la fame, nessuno ci nutre:  \n\nMaranathà, Maranathà. (RIT)  \n  \nSiamo le lacrime, nessuno ci asciuga:  \nMaranathà,  Maranathà.  \nSiamo il dolore, nessuno ci guarda:  \nMaranathà, Maranathà. (RIT)',s:'o cieli piovete dall alto o cieli piovete dall alto o nubi mandateci il santo o terra apriti o terra e germina il salvator siamo il deserto siamo l arsura maranatha maranatha siamo il vento nessuno ci ode maranatha maranatha rit siamo le tenebre nessuno ci guida maranatha maranatha siam le catene nessuno ci scioglie maranatha maranatha rit siamo il freddo nessuno ci copre maranatha maranatha siamo la fame nessuno ci nutre maranatha maranatha rit siamo le lacrime nessuno ci asciuga maranatha maranatha siamo il dolore nessuno ci guarda maranatha maranatha rit 193',type:'N',i:225},
