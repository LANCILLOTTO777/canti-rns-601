{n:'443',t:'CELEBRIAMO INSIEME',c:'Celebriamo insieme la gloria di Gesù  \ne cantiamo ad una voce alleluia,  \nrisorto dalla morte è il nostro Redentor,  \nalziam le nostre mani e acclamiamo.  \n  \nOSANNA, OSANNA, OSANNA \nOSANNA AL RE DEI RE. \nOSANNA, OSANNA, OSANNA \nOSANNA AL RE DEI RE. \n \nCelebriamo insieme la vittoria di Gesù  \n\ne cantiamo ad una voce alleluia,  \nha vinto sul peccato, potente il nome suo,  \nalziam le nostre mani e acclamiamo. (RIT) \n \nCelebriamo insieme la parola di Gesù  \ne cantiamo ad una voce alleluia,  \nfedele è il Signore e grande nell\'amor,  \nalziam le nostre mani e acclamiamo. (RIT)',s:'celebriamo insieme celebriamo insieme la gloria di gesu e cantiamo ad una voce alleluia risorto dalla morte e il nostro redentor alziam le nostre mani e acclamiamo osanna osanna osanna osanna al re dei re osanna osanna osanna osanna al re dei re celebriamo insieme la vittoria di gesu e cantiamo ad una voce alleluia ha vinto sul peccato potente il nome suo alziam le nostre mani e acclamiamo rit celebriamo insieme la parola di gesu e cantiamo ad una voce alleluia fedele e il signore e grande nell amor alziam le nostre mani e acclamiamo rit 443',type:'N',i:475},
{n:'444',t:'GRAZIE PADRE BUONO',c:'Ritornerò e andrò da mio padre  \ne gli dirò: ho peccato contro il cielo e contro di te,  \nnon sono più degno, lo so,  \ndel tuo santissimo nome.  \nRitornerò e andrò da mio padre  \ne gli dirò: come uno dei tuoi servi ora mi tratterai,  \nnon sono più degno, lo so,  \nma tu mi tendi la mano,  \nmi accogli e mi abbracci con gioia.  \n  \nGRAZIE DIO, SEI PADRE BUONO \nGRAZIE DIO, PER IL TUO PERDONO. \nECCOMI, NON SONO SERVO, TU MI DICI FIGLIO MIO. \nQUALE ONOR, L\'ANELLO AL DITO, \nQUALE AMOR, I CALZARI AI PIEDI, \nCUORE MIO, ESULTA PER L\'IMMENSO  \nAMOR DEL PADRE TUO \nCANTA GRAZIE DIO. \n  \nPadre mio sei misericordia,  \nPadre mio solo tu sei la speranza dell\'umanita.  \nAncora di certo cadrò  \nma il mio peccato, Signore,  \nsi perde nel tuo immenso amore.  \n \n(RIT) \nMh \n \nCUORE MIO, ESULTA PER L\'IMMENSO AMOR DEL PADRE \nCANTA GRAZIE DIO.',s:'grazie padre buono ritornero e andro da mio padre e gli diro ho peccato contro il cielo e contro di te non sono piu degno lo so del tuo santissimo nome ritornero e andro da mio padre e gli diro come uno dei tuoi servi ora mi tratterai non sono piu degno lo so ma tu mi tendi la mano mi accogli e mi abbracci con gioia grazie dio sei padre buono grazie dio per il tuo perdono eccomi non sono servo tu mi dici figlio mio quale onor l anello al dito quale amor i calzari ai piedi cuore mio esulta per l immenso amor del padre tuo canta grazie dio padre mio sei misericordia padre mio solo tu sei la speranza dell umanita ancora di certo cadro ma il mio peccato signore si perde nel tuo immenso amore rit mh cuore mio esulta per l immenso amor del padre canta grazie dio 444',type:'N',i:476},
{n:'445',t:'GUARISCIMI GESU\'',c:'Hai portato il mio peccato sulla croce,  \nhai donato la tua vita per amore,  \nle tua mani inchiodate  \nsono il segno del tuo perdono,  \nper la tua misericordia ti prego.  \n  \nGUARISCIMI GESU\' \nGUARISCIMI SIGNORE \nCON IL POTERE DELLE TUE PIAGHE \nGUARISCIMI GESU\' \nCON LA POTENZA DEL TUO NOME. \nNULLA E\' IMPOSSIBILE AL TUO AMORE, \nNULLA E\'IMPOSSIBILE A TE GESU\' \n  \nHai versato il tuo sangue sulla croce  \ncome agnello immolato senza colpa,  \ndal tuo cuore trafitto  \nscorre l\'acqua della salvezza,  \nper la tua infinita grazia ti prego.  \n \nGUARISCIMI GESU\' \nGUARISCIMI SIGNORE \nCON IL POTERE DELLE TUE PIAGHE \nGUARISCIMI GESU\' \nCON LA POTENZA DEL TUO NOME. \nNULLA E\' IMPOSSIBILE AL TUO AMORE, \nNULLA E\'IMPOSSIBILE A TE GESU\' \n \nUH. \n \nGUARISCIMI GESU\' \nCON LA POTENZA DEL TUO NOME. \nNULLA E\' IMPOSSIBILE AL TUO AMORE, \nNULLA E\'IMPOSSIBILE A TE GESU\'',s:'guariscimi gesu hai portato il mio peccato sulla croce hai donato la tua vita per amore le tua mani inchiodate sono il segno del tuo perdono per la tua misericordia ti prego guariscimi gesu guariscimi signore con il potere delle tue piaghe guariscimi gesu con la potenza del tuo nome nulla e impossibile al tuo amore nulla e impossibile a te gesu hai versato il tuo sangue sulla croce come agnello immolato senza colpa dal tuo cuore trafitto scorre l acqua della salvezza per la tua infinita grazia ti prego guariscimi gesu guariscimi signore con il potere delle tue piaghe guariscimi gesu con la potenza del tuo nome nulla e impossibile al tuo amore nulla e impossibile a te gesu uh guariscimi gesu con la potenza del tuo nome nulla e impossibile al tuo amore nulla e impossibile a te gesu 445',type:'N',i:477},
{n:'446',t:'LUCE',c:'Luce che illumina i passi, parola di vita sei tu,  \nGesù, sei il Figlio di Dio venuto nel mondo per noi,  \nnon lasciarci mai, stai con noi per sempre.  \n  \nNON È PIÙ CONFUSO IL NOSTRO CUORE  \nDA QUANDO CAMMINIAMO INSIEME A TE,  \nGIUSTIZIA E VERITÀ TU SEI PER NOI GESÙ.  \nTU DAI SENSO A QUESTA NOSTRA STORIA,  \n\nSU OGNI MALE È LA TUA VITTORIA,  \nNOI UNITI IN UN SOL CORPO ADORIAM  \nSOLO TE. \n  \nFuoco che scalda ogni cuore per vivere la carità,  \nGesù maestro d\'amore in te siamo comunità,  \nnon lasciarci mai, stai con noi per sempre. (RIT) \n  \nSole in questa inquietudine sei stella di santità,  \nGesù in te nostro Dio tutto si ricapitolerà,  \nnon lasciarci mai, stai con noi per sempre. (RIT)  \n  \nADORIAMO SOLO TE.',s:'luce luce che illumina i passi parola di vita sei tu gesu sei il figlio di dio venuto nel mondo per noi non lasciarci mai stai con noi per sempre non e piu confuso il nostro cuore da quando camminiamo insieme a te giustizia e verita tu sei per noi gesu tu dai senso a questa nostra storia su ogni male e la tua vittoria noi uniti in un sol corpo adoriam solo te fuoco che scalda ogni cuore per vivere la carita gesu maestro d amore in te siamo comunita non lasciarci mai stai con noi per sempre rit sole in questa inquietudine sei stella di santita gesu in te nostro dio tutto si ricapitolera non lasciarci mai stai con noi per sempre rit adoriamo solo te 446',type:'N',i:478},
{n:'447',t:'MANDA LA TUA LUCE',c:'Manda la tua luce mio Signor  \nperché vedo solo buio intorno a me,  \nso che tu non mi abbandonerai,  \nnessun male mi colpirà.  \nCome Daniele nella fossa del leone  \nvenga il tuo angelo a proteggermi dal male,  \nnon sarò confuso e triste,  \nnon avrò mai più timore,  \nla pace cercherò nel tuo nome.  \n  \nGESÙ, GESÙ, GESÙ,  \nGESÙ, GESÙ, GESÙ. \n  \nManda la tua rugiada del tuo amor  \nperché fonte di ogni bene sei per me,  \nsorge un\'alba nuova intorno a me,  \nnessun male mi colpirà.  \nCome Daniele nella fossa del leone  \nvenga il tuo angelo a proteggermi dal male,  \nnon sarò confuso e triste,  \nnon avrò mai più timore,  \nla pace cercherò nel tuo nome.  \n  \nGESÙ, GESÙ, GESÙ,  \nGESÙ, GESÙ, GESÙ.  (x2) \n \nSorge un\'alba nuova intorno a me,  \nnessun male mi colpirà.',s:'manda la tua luce manda la tua luce mio signor perche vedo solo buio intorno a me so che tu non mi abbandonerai nessun male mi colpira come daniele nella fossa del leone venga il tuo angelo a proteggermi dal male non saro confuso e triste non avro mai piu timore la pace cerchero nel tuo nome gesu gesu gesu gesu gesu gesu manda la tua rugiada del tuo amor perche fonte di ogni bene sei per me sorge un alba nuova intorno a me nessun male mi colpira come daniele nella fossa del leone venga il tuo angelo a proteggermi dal male non saro confuso e triste non avro mai piu timore la pace cerchero nel tuo nome gesu gesu gesu gesu gesu gesu x2 sorge un alba nuova intorno a me nessun male mi colpira 447',type:'N',i:479},
{n:'448',t:'MI ARRENDO A TE MIO SIGNORE',c:'Gesù verbo eterno d\'amore,  \nvero volto del Padre fatto uomo per me,  \nlascia bruciare il mio cuore  \ndel tuo fuoco divino,  \ndel tuo amore per me,  \nio da sempre ti appartengo.  \n  \nIO MI ARRENDO A TE MIO SIGNORE,  \nIO MI ARRENDO A TE MIO SIGNOR,  \nIL MIO PRESENTE,  \nIL MIO DOMANI SONO TUOI,  \nFA\' DEL MIO CUORE,  \nDELLA MIA VITA CIÒ CHE VUOI. \n  \nGesù redentore del mondo,  \nsole della giustizia, sei speranza per me,  \nvieni mio Signore e mio Dio,  \ncol tuo abbraccio di pace ora stringimi a te,  \nio da sempre ti appartengo.  \n \n(RIT) \n \nMh \n  \nIO MI ARRENDO A TE MIO SIGNORE,  \nIO MI ARRENDO A TE MIO SIGNORE  \nIO MI ARRENDO A TE MIO SIGNORE,  \nIO MI ARRENDO A TE MIO SIGNORE  \nIO MI ARRENDO A TE',s:'mi arrendo a te mio signore gesu verbo eterno d amore vero volto del padre fatto uomo per me lascia bruciare il mio cuore del tuo fuoco divino del tuo amore per me io da sempre ti appartengo io mi arrendo a te mio signore io mi arrendo a te mio signor il mio presente il mio domani sono tuoi fa del mio cuore della mia vita cio che vuoi gesu redentore del mondo sole della giustizia sei speranza per me vieni mio signore e mio dio col tuo abbraccio di pace ora stringimi a te io da sempre ti appartengo rit mh io mi arrendo a te mio signore io mi arrendo a te mio signore io mi arrendo a te mio signore io mi arrendo a te mio signore io mi arrendo a te 448',type:'N',i:480},
{n:'449',t:'PRODIGIO D\'AMORE',c:'Spirito Santo  \nche hai generato in una vergine  \nla carne umile e santissima del Figlio di Dio,  \n \nti ringraziamo perché  \nda allora ogni giorno visiti  \nla vita povera e ferita di questa nostra umanità.  \n  \nNOI TI LODIAMO SIGNORE,  \nTI ESALTIAMO CREATORE,  \nFONTE D\'AMORE INFINITO,  \nVITA CHE DONA LA VITA,  \n\nQUESTO MIRACOLO INCREDIBILE,  \nQUESTO PRODIGIO INDESCRIVIBILE  \nSI COMPIE ANCORA UNA VOLTA  \nORA QUI PER NOI. \n  \nSpirito Santo  \nche hai reso vivo oltre ogni limite  \nil corpo fragile e santissimo del Figlio di Dio,  \n \nti ringraziamo perché  \nda allora offri a tutti gli uomini  \nla vita vera e incorruttibile che dura per l\'eternità.  \n \n(RIT) \nPER NOI. \n \n(ponte musicale) \n  \nNOI TI LODIAMO SIGNORE,  \nTI ESALTIAMO CREATORE,  \nFONTE D\'AMORE INFINITO,  \nVITA CHE DONA LA VITA,  \nQUESTO MIRACOLO INCREDIBILE,  \nQUESTO PRODIGIO INDESCRIVIBILE  \nSI COMPIE ANCORA UNA VOLTA  \nORA QUI PER NOI. PER NOI. \n \nQUESTO MIRACOLO INCREDIBILE,  \nQUESTO PRODIGIO INDESCRIVIBILE  \nSI COMPIE ANCORA UNA VOLTA  \nORA QUI PER NOI. PER NOI.',s:'prodigio d amore spirito santo che hai generato in una vergine la carne umile e santissima del figlio di dio ti ringraziamo perche da allora ogni giorno visiti la vita povera e ferita di questa nostra umanita noi ti lodiamo signore ti esaltiamo creatore fonte d amore infinito vita che dona la vita questo miracolo incredibile questo prodigio indescrivibile si compie ancora una volta ora qui per noi spirito santo che hai reso vivo oltre ogni limite il corpo fragile e santissimo del figlio di dio ti ringraziamo perche da allora offri a tutti gli uomini la vita vera e incorruttibile che dura per l eternita rit per noi ponte musicale noi ti lodiamo signore ti esaltiamo creatore fonte d amore infinito vita che dona la vita questo miracolo incredibile questo prodigio indescrivibile si compie ancora una volta ora qui per noi per noi questo miracolo incredibile questo prodigio indescrivibile si compie ancora una volta ora qui per noi per noi 449',type:'N',i:481},
{n:'450',t:'RENDO GRAZIE A TE SIGNOR',c:'Rendo grazie a te Signor,  \nmia roccia e mia fortezza sei,  \nascolti il grido della mia preghiera.  \nRendo grazie al tuo nome,  \nper il tuo amore e la tua fedeltà Signor  \nper sempre canterò lode a te.  \n  \nLODE A TE, LODE A TE,  \nELEVIAMO IL NOSTRO CANTO PER ESALTARE TE,  \nNOI DIAMO LODE A TE, LODE A TE,  \nINNALZIAM LE NOSTRE MANI  \n\nPROCLAMANDOTI SIGNORE RE DEI RE.  \n  \nRendo grazie a te Signor,  \nmio liberatore sei,  \ntu mi rialzi e mi ridai la vita.  \nRendo grazie al tuo nome,  \nper la tua grazia e la tua santità Signor  \nper sempre canterò lode a te.  \n \n(RIT) \n  \nRendo grazie a te Signor,  \nscudo e baluardo sei,  \nsempre mi proteggi dal nemico.  \nRendo grazie al tuo nome,  \nper la tua forza e la tua maestà Signor  \nper sempre canterò lode a te.  \n \nLODE A TE, LODE A TE,  \nELEVIAMO IL NOSTRO CANTO PER ESALTARE TE,  \nNOI DIAMO LODE A TE, LODE A TE,  \nINNALZIAM LE NOSTRE MANI  \nPROCLAMANDOTI SIGNORE RE DEI RE. \n \n(strumentale) \n \nNOI DIAMO LODE A TE, (LODE A TE),  \nLODE A TE, (LODE A TE)  \nINNALZIAM LE NOSTRE MANI  \nPROCLAMANDOTI SIGNORE RE DEI RE. \nSEI RE DEI RE,  \nSEI RE DEI RE, \nSEI RE DEI RE,  \nSEI RE DEI RE.  \nSEI RE DEI RE,  \nSEI RE DEI RE,  \nSEI RE DEI RE.',s:'rendo grazie a te signor rendo grazie a te signor mia roccia e mia fortezza sei ascolti il grido della mia preghiera rendo grazie al tuo nome per il tuo amore e la tua fedelta signor per sempre cantero lode a te lode a te lode a te eleviamo il nostro canto per esaltare te noi diamo lode a te lode a te innalziam le nostre mani proclamandoti signore re dei re rendo grazie a te signor mio liberatore sei tu mi rialzi e mi ridai la vita rendo grazie al tuo nome per la tua grazia e la tua santita signor per sempre cantero lode a te rit rendo grazie a te signor scudo e baluardo sei sempre mi proteggi dal nemico rendo grazie al tuo nome per la tua forza e la tua maesta signor per sempre cantero lode a te lode a te lode a {n:'451',t:'STAI CON ME',c:'Stai con me, proteggimi,  \ncoprimi con le tue ali, o Dio.  \n\n  \nQUANDO LA TEMPESTA ARRIVERÀ  \nVOLERÒ PIÙ IN ALTO INSIEME A TE,  \nNELLE AVVERSITÀ SARAI CON ME  \nED IO SAPRÒ CHE TU SEI IL MIO RE.  \n \nIl cuore mio riposa in te,  \nio vivrò in pace e verità.  \n \n(RIT x2) \n \nED IO SAPRÒ CHE TU SEI IL MIO RE.  \nED IO SAPRÒ CHE TU SEI MIO RE.  \n \n(strumentale)  \n \n(RIT  x3) \n \nED IO SAPRÒ CHE TU SEI IL MIO RE.  \nED IO SAPRÒ CHE TU SEI MIO RE.',s:'stai con me stai con me proteggimi coprimi con le tue ali o dio quando la tempesta arrivera volero piu in alto insieme a te nelle avversita sarai con me ed io sapro che tu sei il mio re il cuore mio riposa in te io vivro in pace e verita rit x2 ed io sapro che tu sei il mio re ed io sapro che tu sei mio re strumentale rit x3 ed io sapro che tu sei il mio re ed io sapro che tu sei mio re 451',type:'N',i:483},
{n:'452',t:'T\'AMO GESU\'',c:'Pane di vita del cielo,  \ndivino mistero d\'amore vieni,  \ndiscendi nel cuore Gesù,  \nmio dolce Signore.  \n  \nSII TU IL MIO SOSTEGNO,  \nRESTA PER SEMPRE CON ME.  \nSE L\'AVVENIRE SEMBRA OSCURO  \nNULLA CON TE TEMERÒ,  \nCIBO E BEVANDA DI VITA,  \nIO T\'AMO, IO T\'AMO, T\'AMO GESÙ,  \nIO T\'AMO, IO T\'AMO, T\'AMO GESÙ. \n  \nNutrimento celeste,  \nconforto e letizia del cuore,  \ntu ostia santa e divina  \nio vivo di te, mio Signore.  \n \nSII TU IL MIO SOSTEGNO,  \nRESTA PER SEMPRE CON ME.  \nSE L\'AVVENIRE SEMBRA OSCURO  \nNULLA CON TE TEMERÒ,  \n\nCIBO E BEVANDA DI VITA,  \nIO T\'AMO, IO T\'AMO, T\'AMO GESÙ,  \nIO T\'AMO, IO T\'AMO, T\'AMO GESÙ. \nIO T\'AMO, IO T\'AMO, IO T\'AMO GESÙ. \nGESÙ.',s:'t amo gesu pane di vita del cielo divino mistero d amore vieni discendi nel cuore gesu mio dolce signore sii tu il mio sostegno resta per sempre con me se l avvenire sembra oscuro nulla con te temero cibo e bevanda di vita io t amo io t amo t amo gesu io t amo io t amo t amo gesu nutrimento celeste conforto e letizia del cuore tu ostia santa e divina io vivo di te mio signore sii tu il mio sostegno resta per sempre con me se l avvenire sembra oscuro nulla con te temero cibo e bevanda di vita io t amo io t amo t amo gesu io t amo io t amo t amo gesu io t amo io t amo io t amo gesu gesu 452',type:'N',i:484},
{n:'453',t:'TI LODERO\', TI ADORERO\' TI CANTERO\'',c:'Vivi nel mio cuore  \nda quando ti ho incontrato  \nsei con me, o Gesù,  \naccresci la mia fede  \nperché io possa amare  \ncome te, o Gesù.  \nPer sempre io ti dirò  \nil mio grazie  \ne in eterno canterò.  \n  \nTI LODERÒ, TI ADORERÒ,  \nTI CANTERÒ CHE SEI IL MIO RE.  \nTI LODERÒ, TI ADORERÒ,  \nBENEDIRÒ SOLTANTO TE,  \nCHI È PARI A TE SIGNOR,  \nETERNO AMORE SEI,  \nMIO SALVATOR RISORTO PER ME.  \nTI ADORERÒ, TI CANTERÒ  \nCHE SEI IL MIO RE,  \nTI LODERÒ, TI ADORERÒ,  \nBENEDIRÒ SOLTANTO TE. \n  \nNasce in me, Signore,  \nil canto della gioia,  \ngrande sei, o Gesù,  \nguidami nel mondo  \nse il buio è più profondo  \nsplendi tu, o Gesù.  \nPer sempre io ti dirò  \nil mio grazie  \ne in eterno canterò.  \n  \n(RIT) \n  \nTI LODERÒ, TI ADORERÒ,  \nTI CANTERÒ CHE SEI IL MIO RE.  \nTI LODERÒ, TI ADORERÒ,  \nBENEDIRÒ SOLTANTO TE. \n\nTI LODERÒ,  \nTI ADORERÒ,  \nTI CANTERÒ.  \nTI LODERÒ,  \nTI ADORERÒ,  \nTI CANTERÒ.',s:'ti lodero ti adorero ti cantero vivi nel mio cuore da quando ti ho incontrato sei con me o gesu accresci la mia fede perche io possa amare come te o gesu per sempre io ti diro il mio grazie e in eterno cantero ti lodero ti adorero ti cantero che sei il mio re ti lodero ti adorero benediro soltanto te chi e pari a te signor eterno amore sei mio salvator risorto per me ti adorero ti cantero che sei il mio re ti lodero ti adorero benediro soltanto te nasce in me signore il canto della gioia grande sei o gesu guidami nel mondo se il buio e piu profondo splendi tu o gesu per sempre io ti diro il mio grazie e in eterno cantero rit ti lodero ti adorero ti cantero che sei il mio re ti lodero ti adorero benediro soltanto te ti lodero ti adorero ti cantero ti lodero ti adorero ti cantero 453',type:'N',i:485},
{n:'454',t:'TU SEI',c:'Tu sei, tu sei, tu sei,  \ntu sei, tu sei il Signor,  \nsu di noi regnerai.  \n  \nCerchiamo solo te,  \nè un desiderio che  \nci fa lodare te,  \ntrasforma il nostro cuor,  \ntu sei, tu sei, tu sei, tu sei.  \n  \nTU SEI IL SIGNOR,  \nSU DI NOI REGNERAI,  \nTU SEI RE DEI RE,  \nDIO CON NOI  \nTI CANTIAM,  \nTU SEI, TU SEI, TU SEI, TU SEI.  \n  \nCerchiamo solo te...  \n  \n(RIT) \n  \nNoi t\'innalziam,  \nnoi t\'innalziam,  \nnoi t\'innalziamo, Signore  \n  \n(RIT) \n \nTU SEI IL SIGNOR,  \nSU DI NOI REGNERAI,  \nTU SEI RE DEI RE,  \nDIO CON NOI  \nTI CANTIAM,  \nTU SEI, TU SEI, TU SEI, TU SEI. (x2) \nTU SEI, TU SEI, TU SEI, TU SEI. \nTU SEI IL RE.',s:'tu sei tu sei tu sei tu sei tu sei tu sei il signor su di noi regnerai cerchiamo solo te e un desiderio che ci fa lodare te trasforma il nostro cuor tu sei tu sei tu sei tu sei tu sei il signor su di noi regnerai tu sei re dei re dio con noi ti cantiam tu sei tu sei tu sei tu sei cerchiamo solo te rit noi t innalziam noi t innalziam noi t innalziamo signore rit tu sei il signor su di noi regnerai tu sei re dei re dio con noi ti cantiam tu sei tu sei tu sei tu sei x2 tu sei tu sei tu sei tu sei tu sei il re 454',type:'N',i:486},
{n:'455',t:'CANTERÒ LE MERAVIGLIE DEL SIGNOR',c:'Alleluia, alleluia,  \nsei risorto mio Signore, mio Re di carità,  \nora vivi qui con me. \nCanterò un canto nuovo alla tua presenza,  \ntu sei grazia immensa, tu dimori in me. \nCanterò i tuoi prodigi, lo tua misericordia,  \nla mia gioia è piena se rimango in te.  \n         \nCANTERÒ LE MERAVIGLIE DEL SIGNOR,  \nCANTERÒ CON MANI ALZATE CRISTO REDENTOR,  \nCANTERÒ CON ARPA E CETRA LA TUA SANTITÀ,  \nCANTERÒ PER SEMPRE LA TUA FEDELTÀ.  \n \nAlleluia, alleluia,  \nsei risorto mio Signore,  \nvia vita e verità,  \ntu sei sempre qui con me.  \nCanterò un canto nuovo alla tua presenza,  \nper la tua alleanza vivi dentro me.  \nCanterò i tuoi prodigi, la tua misericordia,  \nla mia gioia è piena se rimango in te.  \n \n(RIT)  \n  \nAL tuo popolo hai promesso il regno dei cieli,  \nsulla croce hai donato la tua eredità,  \ndalla morte sei risorto, sei luce del mondo  \ne chi crede in te, Signore, per sempre vivrà.  \n \nCANTERÒ LE MERAVIGLIE DEL SIGNOR,  \nCANTERÒ CON MANI ALZATE CRISTO REDENTOR,  \nCANTERÒ CON ARPA E CETRA LA TUA SANTITÀ,  \nCANTERÒ PER SEMPRE LA TUA FEDELTÀ.  \nCANTERÒ CON ARPA E CETRA LA TUA SANTITÀ \nCANTERÒ PER SEMPRE LA TUA FEDELTÀ.',s:'cantero le meraviglie del signor alleluia alleluia sei risorto mio signore mio re di carita ora vivi qui con me cantero un canto nuovo alla tua presenza tu sei grazia immensa tu dimori in me cantero i tuoi prodigi lo tua misericordia la mia gioia e piena se rimango in te cantero le meraviglie del signor cantero con mani alzate cristo redentor cantero con arpa e cetra la tua santita cantero per sempre la tua fedelta alleluia alleluia sei risorto mio signore via vita e verita tu sei sempre qui con me cantero un canto nuovo alla tua presenza per la tua alleanza vivi dentro me cantero i tuoi prodigi la tua misericordia la mia gioia e piena se rimango in te rit al tuo popolo hai promesso il regno dei cieli sulla croce hai donato la tua eredita dalla morte sei risorto sei luce del mondo e chi crede in te signore per sempre vivra cantero le meraviglie del signor cantero con mani alzate cristo redentor cantero con arpa e cetra la tua santita cantero per sempre la tua fedelta cantero con arpa e cetra la tua santita cantero per sempre la tua fedelta 455',type:'N',i:487},
{n:'456',t:'CANTIAMO AL SIGNOR, GRANDE NELL\'AMOR',c:'Glorioso è il nostro Re, vestito di maestà,  \nla terra gioirà, per sempre canterà.  \nRisplende il nostro Dio,  \nla voce sua si udrà,  \nla notte fuggirà, per sempre fuggirà.  \n\n \nCANTIAM AL SIGNOR,  \nGRANDE NELL\'AMOR È IL SIGNOR,  \nCANTA INSIEME A NOI, È LUI IL SIGNOR.  \n \nEterno il nostro Re, il tempo guiderà,  \nprincipio e fine in lui per sempre riunirà.  \nE trino il nostro Dio, è Padre nell\'amor, \nè Figlio redentor, è Spirito creator.  \n \n(RIT) (x2)  \n  \nAltro Dio non ho, nel suo nome io vivrò  \ned il cuore mio saprà che egli è il Re (x2) \n \n(RIT) x2)',s:'cantiamo al signor grande nell amor glorioso e il nostro re vestito di maesta la terra gioira per sempre cantera risplende il nostro dio la voce sua si udra la notte fuggira per sempre fuggira cantiam al signor grande nell amor e il signor canta insieme a noi e lui il signor eterno il nostro re il tempo guidera principio e fine in lui per sempre riunira e trino il nostro dio e padre nell amor e figlio redentor e spirito creator rit x2 altro dio non ho nel suo nome io vivro ed il cuore mio sapra che egli e il re x2 rit x2 456',type:'N',i:488},
{n:'457',t:'CERCO IL VOLTO TUO SIGNORE',c:'Cerco il volto tuo Signore,  \ncerco lo sguardo tuo d\'amore,  \ntutto il mio essere anela  \na te, pienezza eterna,  \nfonte di felicità.  \n \nGESÙ IO TI ADORO,  \nGESÙ IO CONTEMPLO LA TUA MAESTÀ,  \nTU LO SPLENDORE CHE M\'INCANTA,  \nTRA I FIGLI DELL\'UOMO  \nSIGNORE IL PiÙ BELLO SEI TU. \n  \nUh, uh.  \n \nVivo di ogni tua parola, sento lo tua benedizione,  \nsempre la mia anima invoca  \nla tua presenza viva,  \nio ti amo, mio Signor.  \n \n(RIT)  \n  \nGesù io ti adoro,   \n(Gesù io ti adoro) \nGesù io ti lodo \n \n \n(Gesù io ti lodo) \nGesù io ti esalto \n \n \nGesù io ti esalto \n \n \nGesù io ti amo \n\nGesù io ti amo  \n  \nGESÙ IO TI ADORO,  \nGESÙ IO CONTEMPLO LA TUA MAESTÀ,  \nTU LO SPLENDORE CHE M\'INCANTA,  \nTRA I FIGLI DELL\'UOMO SIGNORE IL PIU BELLO,  \nTRA I FIGLI DELL\'UOMO SIGNORE IL PIU BELLO,  \nTRA I FIGLI DELL\'UOMO SIGNORE IL PiÙ BELLO SEI TU.',s:'cerco il volto tuo signore cerco il volto tuo signore cerco lo sguardo tuo d amore tutto il mio essere anela a te pienezza eterna fonte di felicita gesu io ti adoro gesu io contemplo la tua maesta tu lo splendore che m incanta tra i figli dell uomo signore il piu bello sei tu uh uh vivo di ogni tua parola sento lo tua benedizione sempre la mia anima invoca la tua presenza viva io ti amo mio signor rit gesu io ti adoro gesu io ti adoro gesu io ti lodo gesu io ti lodo gesu io ti esalto gesu io ti esalto gesu io ti amo gesu io ti amo gesu io ti adoro gesu io contemplo la tua maesta tu lo splendore che m incanta tra i figli dell uomo signore il piu bello tra i figli dell uomo signore il piu bello tra i figli dell uomo signore il piu bello sei tu 457',type:'N',i:489},
{n:'458',t:'FEDELE È DIO PER SEMPRE',c:'Cantiamo al Signor il nostro Re,  \nil suo amor dura per sempre,  \nbuono il Signor, su ogni cosa il Re,  \nil suo amor dura per sempre, \ncantiam, cantiam. \n \nTi libererà il braccio suo,   \nil suo amor dura per sempre, \nla vita in lui rinascerà,  \nil suo amor dura per sempre,  \ncantiam, cantiam, cantiam, cantiam. \n  \nFEDELE È DIO PER SEMPRE,     \nPER SEMPRE VINCERÀ,  \nE IL DIO CON NOI PER SEMPRE,    \nPER SEMPRE, PER SEMPRE, PER SEMPRE.  \n  \nDall\'aurora al tramontar  \nil suo amor dura per sempre,  \nla grazia sua ci solleverà,  \nil suo amor dura per sempre,  \ncantiam, cantiam, cantiam, cantiam.  \n \n(RIT) (x2)  \n  \nIl suo amor dura per sempre. (x8) \n  \nCantiam, cantiam, cantiam, cantiam.',s:'fedele e dio per sempre cantiamo al signor il nostro re il suo amor dura per sempre buono il signor su ogni cosa il re il suo amor dura per sempre cantiam cantiam ti liberera il braccio suo il suo amor dura per sempre la vita in lui rinascera il suo amor dura per sempre cantiam cantiam cantiam cantiam fedele e dio per sempre per sempre vincera e il dio con noi per sempre per sempre per sempre per sempre dall aurora al tramontar il suo amor dura per sempre la grazia sua ci sollevera il suo amor dura per sempre cantiam cantiam cantiam cantiam rit x2 il suo amor dura per sempre x8 cantiam cantiam cantiam cantiam 458',type:'N',i:490},
{n:'459',t:'IL NOSTRO CUORE OFFRIAMO A TE',c:'Con il pane e con il vino  \nnoi ti offriamo la vita,  \n\ndalle mani del tuo servo  \nprendi, o Padre, il nostro dono.  \n \nIL NOSTRO CUORE OFFRIAMO A TE,  \nSU QUESTO ALTARE LO PRESENTIAMO,  \nE IL NOSTRO CUORE PIENO DI TE,  \nSU QUESTO ALTARE LO ACCOGLIERAI. \n  \nDella terra portiamo il frutto  \nche tu accogli, Signore,  \nuna mensa per noi prepari,  \nsegno eterno del tuo amore. (RIT)',s:'il nostro cuore offriamo a te con il pane e con il vino noi ti offriamo la vita dalle mani del tuo servo prendi o padre il nostro dono il nostro cuore offriamo a te su questo altare lo presentiamo e il nostro cuore pieno di te su questo altare lo accoglierai della terra portiamo il frutto che tu accogli signore una mensa per noi prepari segno eterno del tuo amore rit 459',type:'N',i:491},
{n:'460',t:'MISERICORDIA SEI',c:'Misericordia sei Gesù,  \ncuore che mai tradisce,  \nsguardo che mi capisce,  \ngrazia che mi guarisce.  \nAl tuo trono vengo e credo in te,  \nso che tu mi accoglierai. \n  \nMISERICORDIA GESÙ,  \nMISERICORDIA SEI TU,  \nTU SEI BELLEZZA, TU SEI PUREZZA,     \nTU SEI PIENEZZA D\'AMOR.  \nMISERICORDIA GESÙ,  \nMISERICORDIA SEI TU,  \nTU SEI BEllEZZA, TU SEI PUREZZA,     \nTU SEI PIENEZZA D\'AMORE GESÙ.  \n  \nMisericordia sei Gesù,  \ncuore che mai tradisce,  \nsguardo che mi capisce,  \ngrazia che mi guarisce.  \nAL tuo trono vengo e credo in te,  \nso che tu mi accoglierai.  \n \n(RIT) \n \nMISERICORDIA GESU,  \nMISERICORDIA SEI TU,  \nTU SEI BELLEZZA, TU SEI PUREZZA,    \nTU SEI PIENEZZA D\'AMOR.  \n\nMISERICORDIA GESU,  \nMISERICORDIA SEI TU,  \nTU SEI BELLEZZA,TU SEI PUREZZA,     \nTU SEI PIENEZZA D\'AMORE GESÙ.',s:'misericordia sei misericordia sei gesu cuore che mai tradisce sguardo che mi capisce grazia che mi guarisce al tuo trono vengo e credo in te so che tu mi accoglierai misericordia gesu misericordia sei tu tu sei bellezza tu sei purezza tu sei pienezza d amor misericordia gesu misericordia sei tu tu sei bellezza tu sei purezza tu sei pienezza d amore gesu misericordia sei gesu cuore che mai tradisce sguardo che mi capisce grazia che mi guarisce al tuo trono vengo e credo in te so che tu mi accoglierai rit misericordia gesu misericordia sei tu tu sei bellezza tu sei purezza tu sei pienezza d amor misericordia gesu misericordia sei tu tu sei bellezza tu sei purezza tu sei pienezza d amore gesu 460',type:'N',i:492},
{n:'461',t:'NON SONO PiÙ IO CHE VIVO',c:'Tu che abiti in cielo e in terra  \nvieni a dimorare in me,  \nvoglio sentire la tua presenza,  \nnel mio cuore ti accoglierò.  \nTu che parli al vento e al mare,  \nil creato ti ascolterà,  \nfammi sentire la tua voce  \ne per sempre ti obbedirò.  \n \nNON SONO PIÙ IO CHE VIVO  \nMA È CRISTO CHE VIVE IN ME,  \nSOFFIO D\'AMORE CHE DÀ LA VITA,  \nPACE ETERNA MI DONERÀ.  \nNON SONO PIÙ IO CHE VIVO  \nMA È CRISTO CHE VIVE IN ME,  \nNELLA POTENZA DEL SUO AMORE  \nGIOIA VERA TROVERÒ.  \n \nTu che mandi la tua Parola,  \nviva nel mio cuore sarà,  \nfammi strumento nelle tue mani  \ne per sempre ti canterò.  \nTu che scruti e conosci il cuore,  \ntu che intendi tutto di me  \ndammi lo forza, voglio seguirti,  \nla mia vita ti donerò.  \n \n(RIT) \n \nTu che reggi lo notte e il giorno  \nmanda il tuo Spirito in me,  \nfammi vedere la tua luce  \ne per sempre ti seguirò.  \nTu che illumini il mio cammino  \nguida ogni mio passo Signor,  \nrestami accanto col tuo amore  \ne per sempre ti cercherò.  \n \n(RIT) \n\n \nOh,     mh  \n  \nNON SONO PIÙ IO CHE VIVO  \nMA È CRISTO CHE VIVE IN ME,  \nNELLA POTENZA DEL SUO AMORE  \nGIOIA VERA TROVERÒ.',s:'non sono piu io che vivo tu che abiti in cielo e in terra vieni a dimorare in me voglio sentire la tua presenza nel mio cuore ti accogliero tu che parli al vento e al mare il creato ti ascoltera fammi sentire la tua voce e per sempre ti obbediro non sono piu io che vivo ma e cristo che vive in me soffio d amore che da la vita pace eterna mi donera non sono piu io che vivo ma e cristo che vive in me nella potenza del suo amore gioia vera trovero tu che mandi la tua parola viva nel mio cuore sara fammi strumento nelle tue mani e per sempre ti cantero tu che scruti e conosci il cuore tu che intendi tutto di me dammi lo forza voglio seguirti la mia vita ti donero rit tu che reggi lo notte e il giorno manda il tuo spirito in me fammi vedere la tua luce e per sempre ti seguiro tu che illumini il mio cammino guida ogni mio passo signor restami accanto col tuo amore e per sempre ti cerchero rit oh mh non sono piu io che vivo ma e cristo che vive in me nella potenza del suo amore gioia vera trovero 461',type:'N',i:493},
{n:'462',t:'POTENTE SEI MIO SIGNOR',c:'Dio di misericordia,  \namore che non muore,  \nriempi il mio cuor,  \nDio che perdona sempre,  \npadre di tenerezza,  \nsperanza eterna.  \n \nMIO DIO MUOVI LE MONTAGNE,  \nPOTENTE SEI, MIO SIGNOR,  \nSO CHE MI SALVERAI  \nPER SEMPRE. DIO DELLA SALVEZZA  \nLA MORTE HAI VINTO PER NOI,  \nTU HAI VINTO PER NOI.  \n \nMi accogli come sono,  \nnon guardi ai miei errori,  \nriempi il mio cuor,  \nti dono lo mia vita,  \nmi arrendo a te, Signore,  \nsperanza eterna.  \n \n(RIT) (x2)  \n \nLa tua luce sempre splenderà,  \ngloria, noi cantiamo a Gesù il Signor.  \nGloria, la tua luce sempre splenderà,  \ngloria, noi cantiamo a Gesù il Signor.  \n \n(RIT) (x2) \n \nLa tua luce sempre splenderà,  \ngloria, noi cantiamo a Gesù il Signor.  \nGloria, la tua luce sempre splenderà,  \ngloria, noi cantiamo a Gesù il Signor.',s:'potente sei mio signor dio di misericordia amore che non muore riempi il mio cuor dio che perdona sempre padre di tenerezza speranza eterna mio dio muovi le montagne potente sei mio signor so che mi salverai per sempre dio della salvezza la morte hai vinto per noi tu hai vinto per noi mi accogli come sono non guardi ai miei errori riempi il mio cuor ti dono lo mia vita mi arrendo a te signore speranza eterna rit x2 la tua luce sempre splendera gloria noi cantiamo a gesu il signor gloria la tua luce sempre splendera gloria noi cantiamo a gesu il signor rit x2 la tua luce sempre splendera gloria noi cantiamo a gesu il signor gloria la tua luce sempre splendera gloria noi cantiamo a gesu il signor 462',type:'N',i:494},
{n:'463',t:'SIGNORE GRAZIE',c:'Grazie Signor per quello che sei,  \nper tutto l\'amore che sempre mi dai,  \ngrazie perché nei giorni miei  \ngioia, speranza e salvezza tu sei. \n  \nTI LODO ETERNO SIGNOR,  \nTI ESALTO PER IL TUO AMOR.  \nSIGNORE GRAZIE, GRAZIE, GRAZIE SIGNOR,  \nSIGNORE GRAZIE, GRAZIE, GRAZIE SIGNOR.  \nTI RENDO LODE, LODE, LODE E ONOR,  \nSIGNORE GRAZIE, GRAZIE, GRAZIE SIGNOR. \n \nGrazie Signor io ti canterò,  \nagli angeli e ai santi la voce unirò,  \ngrazie perché dall\'eternità  \nla festa del cielo in terra verrà.  \n \n(RIT)  \n  \nOggi canto grazie a te,  \ncon tutto il mio cuor, tutte le forze,  \noggi canto grazie a te,  \neterna salvezza.  \n \n(RIT)',s:'signore grazie grazie signor per quello che sei per tutto l amore che sempre mi dai grazie perche nei giorni miei gioia speranza e salvezza tu sei ti lodo eterno signor ti esalto per il tuo amor signore grazie grazie grazie signor signore grazie grazie grazie signor ti rendo lode lode lode e onor signore grazie grazie grazie signor grazie signor io ti cantero agli angeli e ai santi la voce uniro grazie perche dall eternita la festa del cielo in terra verra rit oggi canto grazie a te con tutto il mio cuor tutte le forze oggi canto grazie a te eterna salvezza rit 463',type:'N',i:495},
{n:'464',t:'TALITÀ KUM',c:'Signore Gesù le mani tue piagate  \nstendi su me con il tuo grande amore,  \ntu che mi hai redento morendo sulla croce  \npassa e guarisci come in Galilea.  \n \nTALITÁ KUM IO TI GUARISCO,  \nTALITÁ KUM IO TI RISANO,  \nTALlTÁ KUM SONO QUI PER TE,  \nRIALZATI ANCORA.  \n \nTALITÁ KUM IO TI GUARISCO,  \nTALITÁ KUM IO TI RISANO,  \nTALlTÁ KUM SONO QUI PER TE,  \nRIALZATI ANCORA.  \n\n  \nSignore Gesù fonte d\'acqua viva  \nfermati qui, di me abbi pietà,  \nnon guardare al mio peccato,  \nti prego o Signore,  \npassa e perdona come in Galilea.  \n \n(RIT) \n \nSignore Gesù io so che agirai,  \ndentro il mio cuor la pace cresce già,  \ntu che sei speranza dell\'umanità  \npassa ancora e libera come in Galilea.  \n \n(RIT)',s:'talita kum signore gesu le mani tue piagate stendi su me con il tuo grande amore tu che mi hai redento morendo sulla croce passa e guarisci come in galilea talita kum io ti guarisco talita kum io ti risano tallta kum sono qui per te rialzati ancora talita kum io ti guarisco talita kum io ti risano tallta kum sono qui per te rialzati ancora signore gesu fonte d acqua viva fermati qui di me abbi pieta non guardare al mio peccato ti prego o signore passa e perdona come in galilea rit signore gesu io so che agirai dentro il mio cuor la pace cresce gia tu che sei speranza dell umanita passa ancora e libera come in galilea rit 464',type:'N',i:496},
{n:'465',t:'TI DIAMO GLORIA',c:'Celebriamo insieme la vittoria tua Signor,  \nhai manifestato a noi la forza del tuo amor.  \nNoi seguiamo te perché sei il Re dei re,  \ntu ci rendi liberi da ogni schiavitù.  \n  \nTI DIAMO GLORIA, TI DIAMO LODE,  \nTU SEI RISORTO DALLA MORTE E  \nPER SEMPRE REGNERAI.  \nTI DIAMO GLORIA, TI DIAMO LODE,  \nTU SEI RISORTO DALLA MORTE E  \nPER SEMPRE REGNERAI.  \n  \nNella notte buia splende il sole del tuo amor,  \nnella vita nuova risorgiamo in te Signor.  \nNoi seguiamo te perché sei il Re dei re,  \ntu ci rendi liberi da ogni schiavitù.  \n \n(RIT) \n  \nGrideremo al mondo la speranza che c\'è in noi,  \nserviremo e annunceremo dove tu ci vuoi.  \nNoi seguiamo te perché sei il Re dei re,  \ntu ci rendi liberi da ogni schiavitù.  \n \nTI DIAMO GLORIA, TI DIAMO LODE,  \nTU SEI RISORTO DALLA MORTE E  \nPER SEMPRE REGNERAI.  \nTI DIAMO GLORIA, TI DIAMO LODE,  \n\nTU SEI RISORTO DALLA MORTE E  \nPER SEMPRE REGNERAI.  \n  \nGloria a te Signor, grande nell\'amor,  \nsii esaltato Re dei re.  \nGloria a te Signor, grande nell\'amor,  \nsii esaltato Re dei re.  \n \n(RIT) \n \nE PER SEMPRE REGNERAI,  \nREGNERAI,  \nSEMPRE REGNERAI.',s:'ti diamo gloria celebriamo insieme la vittoria tua signor hai manifestato a noi la forza del tuo amor noi seguiamo te perche sei il re dei re tu ci rendi liberi da ogni schiavitu ti diamo gloria ti diamo lode tu sei risorto dalla morte e per sempre regnerai ti diamo gloria ti diamo lode tu sei risorto dalla morte e per sempre regnerai nella notte buia splende il sole del tuo amor nella vita nuova risorgiamo in te signor noi seguiamo te perche sei il re dei re tu ci rendi liberi da ogni schiavitu rit grideremo al mondo la speranza che c e in noi serviremo e annunceremo dove tu ci vuoi noi seguiamo te perche sei il re dei re tu ci rendi liberi da ogni schiavitu ti diamo gloria ti diamo lode tu sei risorto dalla morte e per sempre regnerai ti diamo gloria ti diamo lode tu sei risorto dalla morte e per sempre regnerai gloria a te signor grande nell amor sii esaltato re dei re gloria a te signor grande nell amor sii esaltato re dei re rit e per sempre regnerai regnerai sempre regnerai 465',type:'N',i:497},
{n:'466',t:'VIENI E VEDI',c:'Se cerchi verità, cerchi felicità, il vero amore,  \nc\'è un grande amico che non delude .  \n  \nOgni certezza è in lui, ogni speranza è in lui,   \nse tu lo accoglierai e avrai creduto sarai salvato.  \n \nVIENI E VEDI GESÙ È IL SIGNORE,  \nVIENI E VEDI CiÒ CHE LUI FA,  \nCANTA CON NOI, VIVI CON NOI  \nIL SUO MESSAGGIO D\'AMORE. E ALLORA  \nVIENI E VEDI GESÙ È IL SIGNORE,  \nVIENI E VEDI COSA ACCADRÀ,  \nCANTA CON NOI, VIVI CON NOI  \nSENZA PAURA UNA NUOVA AVVENTURA IN GESÙ.  \n(VIENI, VIENI) E VEDRAI, (VIENI, VIENI)  \n  \nLui ti accompagnerà,  \n \n(lui ti accompagnerà) \nlui ti rafforzerà,  \n \n(lui ti rafforzerà) \nlibero tu sarai  \n \n(libero tu sarai) \ne avrai la pace e avrai la gioia.  \nSe il mondo ti dirà   \n(se il mondo ti dirà) \nche non c\'è verità   \n(che non c\'è verità) \ntu resta saldo in lui, \n \n(tu resta saldo in lui)  \nse avrai creduto sarai salvato. \n  \n(RIT)  \n \nVieni e vedi, vieni e vedi, vieni e vedi, vieni \n      \n\nVieni e vedi  \n(vieni e vedi)  \nVieni e vedi,   \n(vieni e vedi)  \nvieni e vedi  \n(vieni e vedi)  \nvieni, vieni.  \n \nVIENI E VEDI GESÙ È IL SIGNORE,  \nVIENI E VEDI CIÒ CHE LUI FA,  \nCANTA CON NOI, VIVI CON NOI  \nIL SUO MESSAGGIO D\'AMORE. E ALLORA  \nVIENI E VEDI GESÙ È IL SIGNORE,  \nVIENI E VEDI COSA ACCADRÀ,  \nCANTA CON NOI, VIVI CON NOI  \nSENZA PAURA UNA NUOVA AVVENTURA IN GESÙ.  \n \n(VIENI, VIENI) E VEDRAI, (VIENI, VIENI) (x5)  \nVIENI E VEDI.',s:'vieni e vedi se cerchi verita cerchi felicita il vero amore c e un grande amico che non delude ogni certezza e in lui ogni speranza e in lui se tu lo accoglierai e avrai creduto sarai salvato vieni e vedi gesu e il signore vieni e vedi cio che lui fa canta con noi vivi con noi il suo messaggio d amore e allora vieni e vedi gesu e il signore vieni e vedi cosa accadra canta con noi vivi con noi senza paura una nuova avventura in gesu vieni vieni e vedrai vieni vieni lui ti accompagnera lui ti accompagnera lui ti rafforzera lui {n:'467',t:'ALLA PORTA DEL MIO CUORE',c:'Alla porta del mio cuore  \nnon ti stanchi di bussare  \ncome è dolce la tua voce  \nattendi solo il mio sì  \nper entrare nella mia vita.  \n  \nAPRO IL MIO CUORE AL TUO AMORE  \nOGNI GIORNO A TE MI AFFIDERÒ  \nTRA LE TUE BRACCIA NON HO TIMORE  \nFAI SPLENDERE IL TUO VOLTO SU DI ME.  \nAPRO IL MIO CUORE AL TUO AMORE,  \nENTRERAI E CENERAI CON ME,  \nTRA LE TUE BRACCIA NON HO TIMORE,  \nFAI SPLENDERE IL TUO VOLTO SU DI ME,  \nFAI SPLENDERE IL TUO VOLTO SU DI ME.  \n  \nAlla porta del mio cuore  \nnon ti stanchi di bussare  \nla tua grazia mi concedi  \naccogli adesso il mio sì  \ne trasforma questa mia vita.  \n \nAPRO IL MIO CUORE AL TUO AMORE  \nOGNI GIORNO A TE MI AFFIDERÒ  \nTRA LE TUE BRACCIA NON HO TIMORE  \nFAI SPLENDERE IL TUO VOLTO SU DI ME.  \nAPRO IL MIO CUORE AL TUO AMORE,  \n\nENTRERAI E CENERAI CON ME,  \nTRA LE TUE BRACCIA NON HO TIMORE,  \nFAI SPLENDERE IL TUO VOLTO SU DI ME,  \nFAI SPLENDERE IL TUO VOLTO SU DI ME. \n \nAPRO IL MIO CUORE AL TUO AMORE,  \nENTRERAI E CENERAI CON ME,  \nTRA LE TUE BRACCIA NON HO TIMORE,  \nFAI SPLENDERE IL TUO VOLTO SU DI ME,  \nFAI SPLENDERE IL TUO VOLTO SU DI ME.',s:'alla porta del mio cuore alla porta del mio cuore non ti stanchi di bussare come e dolce la tua voce attendi solo il mio si per entrare nella mia vita apro il mio cuore al tuo amore ogni giorno a te mi affidero tra le tue braccia non ho timore fai splendere il tuo volto su di me apro il mio cuore al tuo amore entrerai e cenerai con me tra le tue braccia non ho timore fai splendere il tuo volto su di me fai splendere il tuo volto su di me alla porta del mio cuore non ti stanchi di bussare la tua grazia mi concedi accogli adesso il mio si e trasforma questa mia vita apro il mio cuore al tuo amore ogni giorno a te mi affidero tra le tue braccia non ho timore fai splendere il tuo volto su di me apro il mio cuore al tuo amore entrerai e cenerai con me tra le tue braccia non ho timore fai splendere il tuo volto su di me {n:'468',t:'APRE LA MANO IL SIGNORE',c:'Beato chi confida e spera nel Signore  \nEgli è fedele per sempre,  \nfonte di ogni bene santo è il suo nome,  \nil suo amore non delude mai,  \nè un Dio potente.  \n  \nAPRE LA MANO IL SIGNORE,  \nMOLTIPLICA ANCORA LA GIOIA PER NOI,  \nEGLI RINNOVA PRODIGI,  \nÉ GIORNO DI FESTA TORNIAMO A LUI.  \nCI HA REDENTI PER AMORE, SIAMO SUOI,  \nCON DANZE E CEMBALI SONORI  \nCELEBRIAMO IL RE  \n  \nPaziente e misericordioso è il Signore,  \negli è degno di ogni lode,  \nattira i cuori al cielo con la tenerezza,  \nil suo amore non delude mai,  \nè un Dio potente.  \n \n(RIT) \n  \nL\'amore ha vinto già, cantiamo ad una voce  \nosanna al Re dei re, osanna al nostro Redentore (x2)  \n \nAPRE LA MANO IL SIGNORE,  \nMOLTIPLICA ANCORA LA GIOIA PER NOI,  \nEGLI RINNOVA PRODIGI,  \nÉ GIORNO DI FESTA TORNIAMO A LUI.  \nCI HA REDENTI PER AMORE, SIAMO SUOI,  \nCON DANZE E CEMBALI SONORI  \nCELEBRIAMO IL RE   \nAPRE LA MANO IL SIGNORE.',s:'apre la mano il signore beato chi confida e spera nel signore egli e fedele per sempre fonte di ogni bene santo e il suo nome il suo amore non delude mai e un dio potente apre la mano il signore moltiplica ancora la gioia per noi egli rinnova prodigi e giorno di festa torniamo a lui ci ha redenti per amore siamo suoi con danze e cembali sonori celebriamo il re paziente e misericordioso e il signore egli e degno di ogni lode attira i cuori al cielo con la tenerezza il suo amore non delude mai e un dio potente rit l amore ha vinto gia cantiamo ad una voce osanna al re dei re osanna al nostro redentore x2 apre la mano il signore moltiplica ancora la gioia per noi egli rinnova prodigi e giorno di festa torniamo a lui ci ha redenti per amore siamo suoi con danze e cembali sonori celebriamo il re apre la mano il signore 468',type:'N',i:500},
{n:'469',t:'GRANDE DIO DELL\'UNIVERSO',c:'Credo che ogni cosa, Gesù,  \ntu permetti per il nostro bene,  \nbuono e giusto tu sei  \ne dal male ci libererai,  \ntu ci libererai.  \nSpero che ogni colpa, Gesù,  \ntu cancelli per la nosra fede,  \nbuono e giusto tu sei  \ne di grazia ci coronerai,  \ntu ci coronerai.  \n  \nGRANDE DIO DELL\'UNIVERSO  \nTI SEI FATTO UOMO,  \nDONO PER L\'UMANITA\'  \nSEI GRANDE, COMPI MERAVIGLIE,  \nPOTENTE E\' IL TUO AMORE,  \nDIO DELL\'IMPOSSIBILE TU SEI,  \nGRANDE DIO TU SEI,  \nGRANDE DIO TU SEI.  \n  \nCanto che il il tuo nome Gesù,  \nsalva e libera le nostre vite,  \nbuono e giusto tu sei  \ne di gioia ci ricolmerai,  \ntu ci ricolmerai.  \nAnnuncio che tu solo sei via  \nper la felicità sulla terra,  \ncon i santi acclamiamo  \ned in cielo che festa sarà,  \ngrande festa sarà.  \n \n(RIT) \n  \nCredo, credo solo il te Gesù,  \nspero, spero solo in te Gesù,  \ngrande compi meraviglie per l\'umanità.  \nCanto, canto solo te Gesù,  \nannuncio, annuncio solo te Gesù,  \ngrande compi meraviglie per l\'umanità.  \n \nGRANDE DIO DELL\'UNIVERSO  \nTI SEI FATTO UOMO,  \nDONO PER L\'UMANITA\'  \n\nSEI GRANDE, COMPI MERAVIGLIE,  \nPOTENTE E\' IL TUO AMORE,  \nDIO DELL\'IMPOSSIBILE TU SEI,  \nGRANDE DIO TU SEI,  \nGRANDE DIO TU SEI.',s:'grande dio dell universo credo che ogni cosa gesu tu permetti per il nostro bene buono e giusto tu sei e dal male ci libererai tu ci libererai spero che ogni colpa gesu tu cancelli per la nosra fede buono e giusto tu sei e di grazia ci coronerai tu ci coronerai grande dio dell universo ti sei fatto uomo dono per l umanita sei grande compi meraviglie potente e il tuo amore dio dell impossibile tu sei grande dio tu sei grande dio tu sei canto che il il tuo nome gesu salva e libera le nostre vite buono e giusto tu sei e di gioia ci ricolmerai tu ci ricolmerai annuncio che tu solo sei via per la felicita sulla terra con i santi acclamiamo ed in cielo che festa sara grande festa sara rit credo credo solo il te ges {n:'470',t:'IL BUON SAMARITANO',c:'Tu hai sofferto più di me,   \nper questo puoi comprendere  \ndavvero il mio dolore.  \nSe la pace più non c\'è  \ne all\'orizzonte sembra che  \nsi perda ogni speranza  \n \nSEI TU GESU\' CHE MI SALVERAI,   \nSEI TU GESU\'CHE MI RISOLLEVERAI  \nLAVERAI, FASCERAI, AVRAI CURA DI ME,   \nBUON SAMARITANO TU SEI.  \n  \nTu, abbandonato lì,  \nsu quella croce il sangue tuo  \nhai dato per amore.  \nSe nessuno è intorno a me  \na chi potrò mai tendere  \ncon fede la mia mano?  \n \n(RIT) \n  \nGESU\', GESU\'  \nGESU\', GESU\' GESU\'  \nLAVERAI, FASCERAI, AVRAI CURA DI ME,   \nBUON SAMARITANO TU SEI.  \n \nLAVERAI, FASCERAI, AVRAI CURA DI ME,   \nBUON SAMARITANO TU SEI, \nBUON SAMARITANO TU SEI, \nBUON SAMARITANO TU SEI.',s:'il buon samaritano tu hai sofferto piu di me per questo puoi comprendere davvero il mio dolore se la pace piu non c e e all orizzonte sembra che si perda ogni speranza sei tu gesu che mi salverai sei tu gesu che mi risolleverai laverai fascerai avrai cura di me buon samaritano tu sei tu abbandonato li su quella croce il sangue tuo hai dato per amore se nessuno e intorno a me a chi potro mai tendere con fede la mia mano rit gesu gesu gesu gesu gesu laverai fascerai avrai cura di me buon samaritano tu sei laverai fascerai avrai cura di me buon samaritano tu sei buon samaritano tu sei buon samaritano tu sei 470',type:'N',i:502},
{n:'471',t:'IL MIO CANTO SALE A TE',c:'Gesù son qui davanti a te  \nper adorarti e proclamarti mio Re.  \nGesù son qui davanti a te,  \n\ntutta la lode del mio cuore innalzo a te.  \n  \nED IL MIO CANTO SALE A TE GESÙ  \nPER ESALTARE ED ONORARE IL NOME TUO,  \nED IL MIO CANTO SALE A TE GESÙ  \nCON LE MIE MANI ALZATE VERSO IL TRONO TUO.  \n  \nGesù sei qui accanto a me  \nal mio fianco ed io mai più vacillerò.  \nGesù sei qui accanto a me,  \ntutta la gioia del mio cuore canto a te.  \n \n(RIT) \n \nIl mio canto sale a te, \nil mio canto sale a te, (x3) \nil mio canto sale a te, a te. \n  \nED IL MIO CANTO SALE A TE GESÙ  \nPER ESALTARE ED ONORARE IL NOME TUO,  \nED IL MIO CANTO SALE A TE GESÙ  \nCON LE MIE MANI ALZATE VERSO IL TRONO TUO, \nCON LE MIE MANI ALZATE VERSO IL TRONO TUO.',s:'il mio canto sale a te gesu son qui davanti a te per adorarti e proclamarti mio re gesu son qui davanti a te tutta la lode del mio cuore innalzo a te ed il mio canto sale a te gesu per esaltare ed onorare il nome tuo ed il mio canto sale a te gesu con le mie mani alzate verso il trono tuo gesu sei qui accanto a me al mio fianco ed io mai piu vacillero gesu sei qui accanto a me tutta la gioia del mio cuore canto a te rit il mio canto sale a te il mio canto sale a te x3 il mio canto sale a te a te ed il mio canto sale a te gesu per esaltare ed onorare il nome tuo ed il mio canto sale a te gesu con le mie mani alzate verso il trono tuo con le mie mani alzate verso il trono tuo 471',type:'N',i:503},
{n:'472',t:'QUESTO IO CREDO',c:'Tu Padre immortale  \no Dio creatore, Dio potente,  \nlo Spirito hai mandato  \nper generare il Figlio Cristo Signore.  \n  \nCREDO IN TE CHE SEI DIO PADRE,  \nCREDO IN TE FIGLIO GESÙ.  \nCREDO IN TE SPIRITO SANTO,  \nÈ TRINO IL NOSTRO DIO.  \nCREDO CHE NOI RISORGEREMO,  \nCREDO NELL\'ETERNITA\'  \nIO CREDO IN TE, NEL TUO NOME O CRISTO  \n  \nTu il nostro difensore  \nsu quella croce tu sei misericordia,  \ndisceso negli abissi  \nrisorto nella gloria, tu regni in eterno.  \n \n(RIT) \n  \n\nE io credo in te,  \ncredo che ritornerai  \ncredo che Gesù è il mio Signor. \nE io credo in te,  \ncredo che ritornerai  \ncredo che Gesù è il mio Signor. \n \n(RIT) \n \nCREDO IN TE CHE SEI DIO PADRE,  \nCREDO IN TE FIGLIO GESÙ.  \nCREDO IN TE SPIRITO SANTO,  \nÈ TRINO IL NOSTRO DIO.  \nCREDO CHE NOI RISORGEREMO,  \nCREDO NELL\'ETERNITA\'  \n \nIO CREDO IN TE, NEL TUO NOME O CRISTO  \nIO CREDO IN TE, NEL TUO NOME O CRISTO \nIO CREDO IN TE, NEL TUO NOME O CRISTO.',s:'questo io credo tu padre immortale o dio creatore dio potente lo spirito hai mandato per generare il figlio cristo signore credo in te che sei dio padre credo in te figlio gesu credo in te spirito santo e trino il nostro dio credo che noi risorgeremo credo nell eternita io credo in te nel tuo nome o cristo tu il nostro difensore su quella croce tu sei misericordia disceso negli abissi risorto nella gloria tu regni in eterno rit e io credo in te credo che ritornerai credo che gesu e il mio signor e io credo in te credo che ritornerai credo che gesu e il mio signor rit credo in te che sei dio padre credo in te figlio gesu credo in te spirito santo e trino il nostro dio credo che noi risorgeremo credo nell eternita io credo in te nel tuo nome o cristo io credo in te nel tuo nome o cristo io credo in te nel tuo nome o cristo 472',type:'N',i:504},
{n:'473',t:'RE DEI RE',c:'Hai sollevato i nostri volti dalla polvere,  \nle nostre colpe hai portato su di te,  \nSignore ti sei fatto uomo in tutto come noi  \nper amore.  \n  \nFiglio dell\'Altissimo, povero tra i poveri  \nvieni a dimorare tra noi.  \nDio dell\'impossibile, Re di tutti i secoli,   \nvieni nella tua maestà.  \n  \nRE DEI RE  \nI POPOLI TI ACCLAMANO  \nI CIELI TI PROCLAMANO.  \nRE DEI RE  \nLUCE DEGLI UOMINI  \nREGNA COL TUO AMORE TRA NOI.  \nOH, OH  OH.  \n  \nCi hai riscattati dalla stretta delle tenebre  \nperchè potessimo glorificare te.  \nHai riversato in noi la vita del tuo Spirito  \nper amore.   \n \nFiglio dell\'Altissimo, povero tra i poveri  \nvieni a dimorare tra noi.  \n\nDio dell\'impossibile, Re di tutti i secoli,   \nvieni nella tua maestà.  \n  \nRE DEI RE  \nI POPOLI TI ACCLAMANO  \nI CIELI TI PROCLAMANO.  \nRE DEI RE  \nLUCE DEGLI UOMINI  \nREGNA COL TUO AMORE TRA NOI.  \nOH, OH  OH.  \n  \nTua è la gloria per sempre,  \ntua è la gloria per sempre, \ngloria, gloria, gloria, gloria. \n \nFiglio dell\'Altissimo, povero tra i poveri  \nvieni a dimorare tra noi.  \nDio dell\'impossibile, Re di tutti i secoli,   \nvieni nella tua maestà.  \n  \nRE DEI RE  \nI POPOLI TI ACCLAMANO  \nI CIELI TI PROCLAMANO.  \nRE DEI RE  \nLUCE DEGLI UOMINI  \nREGNA COL TUO AMORE TRA NOI.  \nOH, OH  OH.',s:'re dei re hai sollevato i nostri volti dalla polvere le nostre colpe hai portato su di te signore ti sei fatto uomo in tutto come noi per amore figlio dell altissimo povero tra i poveri vieni a dimorare tra noi dio dell impossibile re di tutti i secoli vieni nella tua maesta re dei re i popoli ti acclamano i cieli ti proclamano re dei re luce degli uomini regna col tuo amore tra noi oh oh oh ci hai riscattati dalla stretta delle tenebre perche potessimo glorificare te hai riversato in noi la vita del tuo spirito per amore figlio dell altissimo povero tra i poveri vieni a dimorare tra noi dio dell impossibile re di tutti i secoli vieni nella tua maesta re dei re i popoli ti acclamano i cieli ti proclamano re dei re luce degli uomini regna col tuo amore tra noi oh oh oh tua e la gloria per sempre tua e la gloria per sempre gloria gloria gloria gloria figlio dell altissimo povero tra i poveri vieni a dimorare tra noi dio dell impossibile re di tutti i secoli vieni nella tua maesta re dei re i popoli ti acclamano i cieli ti proclamano re dei re luce degli uomini regna col tuo amore tra noi oh oh oh 473',type:'N',i:505},
{n:'474',t:'SEI LA VITA IN ME',c:'Ci sono giorni in cui il mio cuore è triste  \nmi sento perso e sono senza forze,  \nma quando invoco te, di notte nell\'oscurità,  \ntu sei pronto a dirmi: eccomi.  \n  \nPERCHÈ SEI LA VITA CHE C\'È IN ME  \nNON ESISTO SENZA TE,  \nSEI LA STELLA CHE MI GUIDA,  \nLA LUCE CHE MAI VACILLA,  \nTU LA MIA EREDITÀ,  \nSPERANZA CHE MAI FINIRÀ  \nSEI LA STELLA CHE MI GUIDA,  \nSOLE CHE MAI TRAMONTA.  \n  \nO mio Signore sei gioia del mio cuore,  \n\ntu mi rialzi e mi liberi dal male,  \nper questo cerco te,  \nperchè io so che sei il mio Re  \nsono pronto a dirti: eccomi.  \n \n(RIT) \n  \nPERCHE\' SEI LA VITA CHE C\'E\' IN ME  \nNON ESISTO SENZA TE (x2)  \n \n(RIT)',s:'sei la vita in me ci sono giorni in cui il mio cuore e triste mi sento perso e sono senza forze ma quando invoco te di notte nell oscurita tu sei pronto a dirmi eccomi perche sei la vita che c e in me non esisto senza te sei la stella che mi guida la luce che mai vacilla tu la mia eredita speranza che mai finira sei la stella che mi guida sole che mai tramonta o mio signore sei gioia del mio cuore tu mi rialzi e mi liberi dal male per questo cerco te perche io so che sei il mio re sono pronto a dirti eccomi rit perche sei la vita che c e in me non esisto senza te x2 rit 474',type:'N',i:506},
{n:'475',t:'SEI POTENTE E GLORIOSO',c:'Cieli lodate il nostro Creator  \nschiere celesti lodate il Signor,  \ntutto lodi Dio.  \nLodi la luna, ogni stella ed il sol,  \nlodino i cieli e le acque del mar,  \ntutto lodi Dio.  \n  \nSEI POTENTE, SEI GLORIOSO,  \nDIO PIETOSO RE DEI CIELI,  \nIN BATTAGLIA VITTORIOSO,  \nGRANDE IN SION RE DELLA TERRA.  \n \n(da capo) \n \nSEI POTENTE, SEI GLORIOSO,  \nDIO PIETOSO RE DEI CIELI,  \nIN BATTAGLIA VITTORIOSO,  \nGRANDE IN SION RE DELLA TERRA.',s:'sei potente e glorioso cieli lodate il nostro creator schiere celesti lodate il signor tutto lodi dio lodi la luna ogni stella ed il sol lodino i cieli e le acque del mar tutto lodi dio sei potente sei glorioso dio pietoso re dei cieli in battaglia vittorioso grande in sion re della terra da capo sei potente sei glorioso dio pietoso re dei cieli in battaglia vittorioso grande in sion re della terra 475',type:'N',i:507},
{n:'476',t:'SIGNORE APRI LE MIE LABBRA',c:'Date al Signore figli di Dio \ndategli gloria e potenza,  \nsenza timore cantino a lui  \nvoci di popoli in festa  \nperchè rette sono tutte le sue vie.  \n  \nSIGNORE APRI LE MIE LABBRA,  \nLA MIA LINGUA CANTI LA TUA LODE,  \nGIOIRÒ PER SEMPRE NEL TUO NOME.  \nAPRI LE MIE LABBRA,  \n\nFONTE ETERNA DI SALVEZZA SEI PER ME,  \nPER SEMPRE IO CANTERÒ A TE  \nSEI VIVO, VIVO GESÙ  \n  \nOgni nazione torni a lui,  \ncelebri Cristo Signore,  \nnella sua casa entra anche tu,  \ncanta con noi la sua lode  \nperchè rette sono tutte le sue vie.  \n \n(RIT) \n  \nSopre le acque tuona il Signore  \nvoce di forza e potenza  \nscuote il deserto, regna sul mondo,  \nsiede sul trono di gloria  \nperchè rette sono tutte le sue vie.  \n \n(RIT) \n  \nSempre ti benedirò,  \nsempre ti benedirò.    \n  \nSIGNORE APRI LE MIE LABBRA,  \nLA MIA LINGUA CANTI LA TUA LODE,  \nGIOIRÒ PER SEMPRE NEL TUO NOME.  \nAPRI LE MIE LABBRA,  \nFONTE ETERNA DI SALVEZZA SEI PER ME,  \nPER SEMPRE IO CANTERÒ A TE  \nSEI VIVO, VIVO GESÙ \n  \nLA MIA LINGUA CANTI LA TUA LODE,  \nGIOIRO\' PER SEMPRE NEL TUO NOME.  \nAPRI LE MIE LABBRA,  \nFONTE ETERNA DI SALVEZZA SEI PER ME,  \nPER SEMPRE IO CANTERO\' A TE  \nSEI VIVO, VIVO GESÙ, \nSEI VIVO, SEI VIVO GESÙ',s:'signore apri le mie labbra date al signore figli di dio dategli gloria e potenza senza timore cantino a lui voci di popoli in festa perche rette sono tutte le sue vie signore apri le mie labbra la mia lingua canti la tua lode gioiro per sempre nel tuo nome apri le mie labbra fonte eterna di salvezza sei per me per sempre io cantero a te sei vivo vivo gesu ogni nazione torni a lui celebri cristo signore nella sua casa entra anche tu canta con noi la sua lode perche rette sono tutte le sue vie rit sopre le acque tuona il signore voce di forza e potenza scuote il deserto regna sul mondo siede sul trono di gloria perche rette sono tutte le sue vie rit sempre ti benediro sempre ti benediro signore apri le mie labbra la mia lingua canti la tua lode gioiro per sempre nel tuo nome apri le mie labbra fonte eterna di salvezza sei per me per sempre io cantero a te sei vivo vivo gesu la mia lingua canti la tua lode gioiro per sempre nel tuo nome apri le mie labbra fonte eterna di salvezza sei per me per sempre io cantero a te sei vivo vivo gesu sei vivo sei vivo gesu 476',type:'N',i:508},
{n:'477',t:'SU INNALZIAMO CON GIOIA IL SIGNORE',c:'Noi innalziam con gioia il Signor,  \nnoi innalziam con gioia il Signor,  \nnoi innalziam con gioia il Signor, \nnoi innalziam con gioia. \n  \n\nSU INNALZIAM CON GIOIA IL SIGNOR  \nACCLAMIAMO VERSO LA ROCCIA DI SALVEZZA   \nSU INNALZIAM CON GIOIA IL SIGNOR  \nACCLAMIAMO VERSO LA ROCCIA DI SALVEZZA     \n  \nAccostiamoci a lui con gioia  \ncon la musica e il canto preghiam,  \nchi è pari a lui? È il Signore Dio,  \negli e Re su tutti i re. \n \n(RIT)  \n  \nAdoriamolo con tutto il cuore  \ne prostrati cantiamo al Signor,  \nè il nostro Dio e noi suoi figli,  \nper questo a lui cantiam.  \n  \nNoi innalziam con gioia il Signor,   \n(innalziam) \nnoi innalziamo con gioia il Signor,     (il Signor) \nnoi innalziamo con gioia il Signor \nnoi lo innalziamo con gioia. \n \nSU INNALZIAM CON GIOIA IL SIGNOR  \nACCLAMIAMO VERSO LA ROCCIA DI SALVEZZA   \nSU INNALZIAM CON GIOIA IL SIGNOR  \nACCLAMIAMO VERSO LA ROCCIA DI SALVEZZA  \n \n(x2)',s:'su innalziamo con gioia il signore noi innalziam con gioia il signor noi innalziam con gioia il signor noi innalziam con gioia il signor noi innalziam con gioia su innalziam con gioia il signor acclamiamo verso la roccia di salvezza su innalziam con gioia il signor acclamiamo verso la roccia di salvezza accostiamoci a lui con gioia con la musica e il canto preghiam chi e pari a lui e il signore dio egli e re su tutti i re rit adoriamolo con tutto il cuore e prostrati cantiamo al signor e il nostro dio e noi suoi figli per questo a lui cantiam noi innalziam con gioia il signor innalziam noi innalziamo con gioia il signor il signor noi innalziamo con gioia il signor noi lo innalziamo con gioia su innalziam con gioia il signor acclamiamo verso la roccia di salvezza su innalziam con gioia il signor acclamiamo verso la roccia di salvezza x2 477',type:'N',i:509},
{n:'478',t:'TU SEI DEGNO',c:'Beato l\'uomo che confida in te Signore  \nche custodisce la tua legge nel suo cuore,  \ncosì ti seguirò, sulle tue vie camminerò.  \n  \nFammi conoscere la pace e la giustizia,  \npiega il mio cuore verso la tua volontà,  \ncosì ti ascolterò, la verità conoscerò.  \n  \nTU SEI DEGNO ETERNO SIGNORE DI OGNI ONORE,  \nVOGLIO INNALZARE UN CANTO NUOVO AL TUO NOME  \nDEGNO DI LODE MIO SALVATORE,  \nLA TUA PAROLA HA TRASFORMATO IL MIO CUOR.  \n  \nHai liberato la mia vita dalla morte  \ne le mie lacrime non sono più cadute,  \n\ncosì ti servirò, nella tua caso io vivrò. \n \n(RIT)   \n \n \n  \nIn te vivrò,   \n \n \n(in te vivrò) \nti adorerò Signore  \nin te vivrò, in te vivrò  \n \n(in te vivrò) \nti adorerò Signore   \nin te vivrò,   \n \n \n(in te vivrò) \nti adorerò Signore  \nin te vivrò,  \nin te vivrò, ti adorerò per sempre  \n(per sempre) \n \nTU SEI DEGNO ETERNO SIGNORE DI OGNI ONORE,  \nVOGLIO INNALZARE UN CANTO NUOVO AL TUO NOME  \nDEGNO DI LODE MIO SALVATORE,  \nLA TUA PAROLA HA TRASFORMATO IL MIO CUOR, \nLA TUA PAROLA HA TRASFORMATO IL MIO CUOR.',s:'tu sei degno beato l uomo che confida in te signore che custodisce la tua legge nel suo cuore cosi ti seguiro sulle tue vie camminero fammi conoscere la pace e la giustizia piega il mio cuore verso la tua volonta cosi ti ascoltero la verita conoscero tu sei degno eterno signore di ogni onore voglio innalzare un canto nuovo al tuo nome degno di lode mio salvatore la tua parola ha trasformato il mio cuor hai liberato la mia vita dalla morte e le mie lacrime non sono piu cadute cosi ti serviro nella tua caso io vivro rit in te vivro in te vivro ti adorero signore in te vivro in te vivro in te vivro ti adorero signore in te vivro in te vivro ti adorero signore in te vivro in te vivro ti adorero per sempre per sempre tu sei degno eterno signore di ogni onore voglio innalzare un canto nuovo al tuo nome degno di lode mio salvatore la tua parola ha trasformato il mio cuor la tua parola ha tr {n:'479',t:'ALLELUIA AL RE',c:'A Dio cantiam con gioia  \na Lui gridiam  \nal Re le mani noi leviam. \n  \nA Dio pieghiamo il cuore  \ne lo adoriam,   \nnoi diam gloria al Re dei re.  \n  \nALLELUIA EGLI È RE DI GLORIA  \nALLELUIA È IL SIGNOR PER NOI  \nALLELUIA EGLI È DIO E REGNERA\'!  \nSI PER SEMPRE REGNERA\'   (2 volte)  \n \nA Dio cantiam con gioia  \na Lui gridiam  \nal Re le mani noi leviam. \n  \nA Dio pieghiamo il cuore  \ne lo adoriam,   \nnoi diam gloria al Re dei re.  \n \nALLELUIA EGLI E\' RE DI GLORIA  \nALLELUIA È IL SIGNOR PER NOI  \n\nALLELUIA EGLI È DIO E REGNERÀ!  \nSI PER SEMPRE REGNERA\'   \n \nALLELUIA EGLI È RE DI GLORIA  \nALLELUIA È IL SIGNOR PER NOI  \nALLELUIA EGLI È DIO E REGNERÀ!  \nSI PER SEMPRE REGNA,  \nSEMPRE REGNA! \n \nALLELUIA EGLI È RE DI GLORIA  \nALLELUIA È IL SIGNOR PER NOI  \nALLELUIA EGLI E\' DIO E REGNERÀ! \nSI PER SEMPRE REGNA,  \nSEMPRE REGNERÀ  \n \n(PAUSA MUSICALE) \n  \nPer sempre regnerà,  \nper sempre regnerà  \nper sempre regnerà,  \nper sempre regna!  \nsempre regnerà (X2)',s:'alleluia al re a dio cantiam con gioia a lui gridiam al re le mani noi leviam a dio pieghiamo il cuore e lo adoriam noi diam gloria al re dei re alleluia egli e re di gloria alleluia e il signor per noi alleluia egli e dio e regnera si per sempre regnera 2 volte a dio cantiam con gioia a lui gridiam al re le mani noi leviam a dio pieghiamo il cuore e lo adoriam noi diam gloria al re dei re alleluia egli e re di gloria alleluia e il signor per noi alleluia egli e dio e regnera si per sempre regnera alleluia egli e re di gloria alleluia e il signor per noi alleluia egli e dio e regnera si per sempre regna sempre regna alleluia egli e re di gloria alleluia e il signor per noi alleluia egli e dio e regnera si per sempre regna sempre regnera pausa musicale per sempre regnera per sempre regnera per sempre regnera per sempre regna sempre regnera x2 479',type:'N',i:511},
{n:'480',t:'CANTIAMO A TE',c:'Noi cantiam la gloria del tuo Nome o Re  \ndalla terra in festa noi gridiamo a te  \nlode a te, lode a te,  \nNoi riconosciamo che il Signore sei  \nil tuo volto santo splende su di noi.  \nLode a te, lode a te Gesù.  \n  \nDAVANTI A TE ESULTA LA TERRA,  \nLA TUA FEDELTA\' PER TUTTE LE GENTI,  \nLA TUA BONTÀ MAI FINIRÀ  \nTU SEI IL SIGNORE E PER SEMPRE REGNERAI  \nTU SEI IL SIGNOR,  \nTU SEI IL SIGNOR.  \n  \nSulla tua parola camminiamo o Re,  \nper la tua promessa noi gioiamo in te  \nlode a te, lode a te.  \nCieli e terra esulteranno nel tuo amor,  \ncon la tua giustizia regnerai Signor,  \nlode a te, lode a te Gesù.    (RIT) \n  \n\nCantiamo a te, cantiamo a te,  \nlode a te,  \nlode a te.  \nCantiamo a te,  \ncantiamo a te  \nlode a te  \nlode a te  \n \nDAVANTI A TE ESULTA LA TERRA,  \nLA TUA FEDELTÀ PER TUTTE LE GENTI,  \nLA TUA BONTÀ MAI FINIRÀ  \nTU SEI IL SIGNORE E PER SEMPRE REGNERAI  \n \n(RIT) \n \nDAVANTI A TE ESULTA LA TERRA,  \nLA TUA FEDELTA\' PER TUTTE LE GENTI,  \nLA TUA BONTÀ MAI FINIRÀ  \nTU SEI IL SIGNORE E PER SEMPRE REGNERAI  \nTU SEI IL SIGNOR,  \nTU SEI IL SIGNOR.',s:'cantiamo a te noi cantiam la gloria del tuo nome o re dalla terra in festa noi gridiamo a te lode a te lode a te noi riconosciamo che il signore sei il tuo volto santo splende su di noi lode a te lode a te gesu davanti a te esulta la terra la tua fedelta per tutte le genti la tua bonta mai finira tu sei il signore e per sempre regnerai tu sei il signor tu sei il signor sulla tua parola camminiamo o re per la tua promessa noi gioiamo in te lode a te lode a te cieli e terra esulteranno nel tuo amor con la tua giustizia regnerai signor lode a te lode a te gesu rit cantiamo a te cantiamo a te lode a te lode a te cantiamo a te cantiamo a te lode a te lode a te davanti a te esulta la terra la tua fedelta per tutte le genti la tua bonta mai finira tu sei il signore e per sempre regnerai rit davanti a te esulta la terra la tua fedelta per tutte le genti la {n:'481',t:'DIO È QUI',c:'Oh oh oh oh oh oh oh oh oh (x6) \n  \nAd occhi aperti vogliam vederti  \ncon cuore puro vogliamo amarti.  \nFa che ascoltiamo la tua Parola  \ne Gesù il Signor noi conoscerem.  \n  \nDIO È QUI, DIO È QUI  \nDIO È QUI È POTENTE  \nE GESU\' NELLA FEDE NOI VEDREM.  \nDIO È QUI, DIO È QUI  \nDIO È QUI È FEDELE  \nE GESU\' IL SIGNORE  \nOH NOI CONOSCEREM.  \nOh oh oh oh oh oh oh oh oh (x2) \n  \nApri le porte della tua gloria  \nsulle nazioni fonda il tuo regno  \nSpalanca i cieli, dona lo Spirito  \ne Gesù il Signor noi conoscerem.  \n \n(RIT) \n\n  \nSanto egli è santo  \nalleluia Dio è qui  \nSanto egli è santo  \nAlleluia Dio è qui. (x2) \n \n(RIT) \n \nFinale come imizio \nOh oh oh oh oh oh oh oh oh \nOh oh oh oh oh oh oh oh oh',s:'dio e qui oh oh oh oh oh oh oh oh oh x6 ad occhi aperti vogliam vederti con cuore puro vogliamo amarti fa che ascoltiamo la tua parola e gesu il signor noi conoscerem dio e qui dio e qui dio e qui e potente e gesu nella fede noi vedrem dio e qui dio e qui dio e qui e fedele e gesu il signore oh noi conoscerem oh oh oh oh oh oh oh oh oh x2 apri le porte della tua gloria sulle nazioni fonda il tuo regno spalanca i cieli dona lo spirito e gesu il signor noi conoscerem rit santo egli e santo alleluia dio e qui santo egli e santo alleluia dio e qui x2 rit finale come imizio oh oh oh oh oh oh oh oh oh oh oh oh oh oh oh oh oh oh 481',type:'N',i:513},
{n:'482',t:'ENTRERÒ NELLA TUA CASA O DIO',c:'Entrerò nella tua casa o Dio  \ne scioglierò per te le labbra mie.  \nGridano i miei peccati  \nma tu mi perdoni e vegli su me.  \nCon la tua giustizia tu ripari al male  \nrendi salde le mie vie, tu sei fedele.  \n  \nCON GIOIA CONTEMPLATE TUTTE LE OPERE DI DIO  \nSIA BENEDETTO IL SUO NOME, NON CI RESPINGERA\'  \nBEATO E\' COLUI CHE STA VICINO A DIO,  \nEGLI DOMINA IN ETERNO E SALVA I FIGLI SUOI. \n \nCON GIOIA CONTEMPLATE TUTTE LE OPERE DI DIO  \nSIA BENEDETTO IL SUO NOME, NON CI RESPINGERA\'  \nRISUONA FRA NOI LA VOCE DEL SIGNORE  \nEGLI ASCOLTA LA PREGHIERA E CI RISPONDE GIA\'. \n \nVisiti la terra mia Signor \nE mi purifichi Dio di bontà. \nAnche se il fuoco passerò \nCon te mi condurrai in santità. \n  \nIl deserto canta e la terra è in fiore   \ntu disseti il cuore, tu sei la speranza  \n \n(RIT) \n  \nCON GIOIA CONTEMPLATE TUTTE LE OPERE DI DIO  \nSIA BENEDETTO IL SUO NOME, NON CI RESPINGERA\'  \nBEATO E\' COLUI CHE STA VICINO A DIO,  \nEGLI DOMINA IN ETERNO E SALVA I FIGLI SUOI. \n  \n\nEntrerò  \nnella tua casa o Dio  \ne scioglierò per  \nle labbra mie.',s:'entrero nella tua casa o dio entrero nella tua casa o dio e sciogliero per te le labbra mie gridano i miei peccati ma tu mi perdoni e vegli su me con la tua giustizia tu ripari al male rendi salde le mie vie tu sei fedele con gioia contemplate tutte le opere di dio sia benedetto il suo nome non ci respingera beato e colui che sta vicino a dio egli domina in eterno e salva i figli suoi con gioia contemplate tutte le opere di dio sia benedetto il suo nome non ci respingera risuona fra noi la voce del signore egli ascolta la preghiera e ci risponde gia visiti la terra mia signor e mi purifichi dio di bonta anche se il fuoco passero con te mi condurrai in santita il deserto canta e la terra e in fiore tu disseti il cuore tu sei la speranza rit con gioia contemplate tutte le opere di dio sia benedetto il suo nome non ci respingera beato e colui che sta vicino a dio egli domina in eterno e salva i figli suoi entrero nella tua casa o dio e sciogliero per le labbra mie 482',type:'N',i:514},
{n:'483',t:'FIUMI DI MISERICORDIA',c:'Fiumi di misericordia  \ndalla croce lavano la colpa mia  \nLa tua salvezza mio Re  \nluce che rinnova  \ne dona alla mia vita  \nla tua eternità,  \nla tua misericordia Signor  \nè il sole che m\'illumina, Gesù.  \n  \nSEI AMORE CHE PERDONA  \nPAROLA CHE DÀ VITA,  \nRITROVO LA MIA GIOIA IN TE GESU\'  \nLA VOCE TUA MI ATTIRA,  \nLA GRAZIA TUA MI LIBERA  \nIN TE RITORNO A VIVERE.  \n  \nSei tu che visiti il mio cuore  \nmetti in me la pace del tuo Spirito.  \nE\' la tua grazia mio  \nbalsamo d\'amore  \nsopra le ferite della vita mia,  \nLa tua misericordia Signor  \nè il sole che m\'illumina, Gesù.  \n \n(RIT) \n  \nPerdoni il mio peccato,  \ngrande è la tua salvezza  \nDio di misericordia  \ne d\'infinita tenerezza  \nPerdoni il mio peccato,  \ngrande è la tua salvezza  \nDio di misericordia  \ne d\'infinita tenerezza  \n \nSEI AMORE CHE PERDONA  \nPAROLA CHE DÀ VITA,  \nRITROVO LA MIA GIOIA IN TE GESU\'  \nLA VOCE TUA MI ATTIRA,  \n\nLA GRAZIA TUA MI LIBERA  \nIN TE RITORNO A VIVERE.',s:'fiumi di misericordia fiumi di misericordia dalla croce lavano la colpa mia la tua salvezza mio re luce che rinnova e dona alla mia vita la tua eternita la tua misericordia signor e il sole che m illumina gesu sei amore che perdona parola che da vita ritrovo la mia gioia in te gesu la voce tua mi attira la grazia tua mi libera in te ritorno a vivere sei tu che visiti il mio cuore metti in me la pace del tuo spirito e la tua grazia mio balsamo d amore sopra le ferite della vita mia la tua misericordia signor e il sole che m illumina gesu rit perdoni il mio peccato grande e la tua salvezza dio di misericordia e d infinita tenerezza perdoni il mio peccato grande e la tua salvezza dio di misericordia e d infinita tenerezza sei amore che perdona parola che da vita ritrovo la mia gioia in te gesu la voce tua mi attira la grazia tua mi libera in te ritorno a vivere 483',type:'N',i:515},
{n:'484',t:'GESU’ SEI IL SIGNORE',c:'A quanti temono il tuo nome  \nricolmi della tua gloria mio Re.  \nEcco vieni sulle nubi  \nogni occhio ti vedrà  \nogni lingua ti proclamerà  \n  \nGESU\' GESU\' GESU\' SEI IL SIGNORE  \nGESU\' GESU\' GESU\' SEI IL SIGNORE  \n  \nTu sei degno di ogni lode   \nAgnello immolato in croce per me.  \nE\' caduta Babilonia,  \nnessuno più lo troverà  \nil tuo nome ha vinto già.  \n \n(RIT) \n  \nProstrati adoriamo il Signore  \nprostrati cantiamo al Signore  \nprostrati esaltiamo il Signore  \nprostrati onoriamo il SIgnore \nProstrati adoriamo il Signore   \nprostrati cantiamo al Signore  \nprostrati esaltiamo il Signore Gesù \n \n(RIT) \nGESU\' GESU\' GESU\' SEI IL SIGNORE  \nGESU\' GESU\' GESU\' SEI IL SIGNORE  \nGESU\' GESU\' GESU\' SEI IL SIGNORE  \nGESU\'',s:'gesu sei il signore a quanti temono il tuo nome ricolmi della tua gloria mio re ecco vieni sulle nubi ogni occhio ti vedra ogni lingua ti proclamera gesu gesu gesu sei il signore gesu gesu gesu sei il signore tu sei degno di ogni lode agnello immolato in croce per me e caduta babilonia nessuno piu lo trovera il tuo nome ha vinto gia rit prostrati adoriamo il signore prostrati cantiamo al signore prostrati esaltiamo il signore prostrati onoriamo il signore prostrati adoriamo il signore prostrati cantiamo al signore prostrati esaltiamo il signore gesu rit gesu gesu gesu sei il signore gesu gesu gesu sei il signore gesu gesu gesu sei il signore gesu 484',type:'N',i:516},
{n:'485',t:'IO TI AMO SIGNOR, MIA FORZA TU SEI',c:'Io ti amo Signore, mia forza tu sei  \nmia rupe in cui mi rifugio.  \nMia potente salvezza, mio scudo tu sei  \nio t\'invoco, tu sei Dio potente  \nla tua mano tu stendi, dalle acque mi salvi,  \nSignore in te io confido  \nTu mi cingi di forza, mi spiani la via  \n\nin eterno io ti loderò,  \nse tu sei con me io non temerò.  \n  \nBENEDETTO SEI  \nNOI CANTIAMO A TE  \nACCLAMIAMO AL TUO SANTO NOM.  \nBENEDETTO SEI SIGNOR  \nSEI GLORIOSO REDENTOR  \nED ETERNO E\' IL TUO AMORE PER NOI.  \nSEI RE, SEI RE, SEI RE,  \nNOI TI ADORIAM,  \nSEI RE, SEI RE, SEI RE  \nNOI TI ADORIAM  \n \nIo ti amo Signore mia roccia tu sei  \nmia fortezza mio liberatore  \nNell\'angoscia ti prego il mio grido tu ascolti  \nriparo mi doni Signore.  \nLa tua mano tu stendi dalle acque mi salvi  \nSignore in te io confido,  \nTu mi cingi di forza, mi spiani la via,  \nin eterno io ti loderò  \nse tu sei con me io non temerò.  \n \n(RIT) \n  \nSEI RE, SEI RE, SEI RE,  \nNOI TI ADORIAM, (x4) \nSEI RE  \n \nBENEDETTO SEI  \nNOI CANTIAMO A TE  \nACCLAMIAMO AL TUO SANTO NOM.  \nBENEDETTO SEI SIGNOR  \nSEI GLORIOSO REDENTOR  \nED ETERNO E\' IL TUO AMORE PER NOI.  \nSEI RE, SEI RE, SEI RE,  \nNOI TI ADORIAM,  \nSEI RE, SEI RE, SEI RE  \nNOI TI ADORIAM \nSEI RE, SEI RE, SEI RE',s:'io ti amo signor mia forza tu sei io ti amo signore mia forza tu sei mia rupe in cui mi rifugio mia potente salvezza mio scudo tu sei io t invoco tu sei dio potente la tua mano tu stendi dalle acque mi salvi signore in te io confido tu mi cingi di forza mi spiani la via in eterno io ti lodero se tu sei con me io non temero benedetto sei noi cantiamo a te acclamiamo al tuo santo nom benedetto sei signor sei glorioso redentor ed eterno e il tuo amore per noi sei re sei re sei re noi ti adoriam sei re sei re sei re noi ti adoriam io ti amo signore mia roccia tu sei mia fortezza mio liberatore nell angoscia ti prego il mio grido tu ascolti riparo mi doni signore la tua mano tu ste
