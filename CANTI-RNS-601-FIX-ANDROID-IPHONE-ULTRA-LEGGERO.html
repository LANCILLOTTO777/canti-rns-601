{n:'194',t:'O CHRISTE DOMINE JESÙ',c:'O Christe Domine Jesù!  \nO Christe Domine Jesù!  (x2)  \n  \nIl Signore è il mio pastore: non manco di nulla.  \nIn pascoli erbosi mi fa riposare, ad acque tranquille mi conduce.  \nMi rinfranca, mi guida per il giusto sentiero per amore del suo Nome.  \n  \nSe dovessi camminare per una valle oscura  \nnon temerei alcun male, perché tu sei con me.  \nIl tuo bastone e il tuo vincastro mi danno sicurezza.  \n \nDavanti a me tu prepari una mensa sotto gli occhi dei miei nemici.  \nCospargi di olio il mio capo, il mio calice trabocca.  \n \nFelicità e grazia mi saranno compagne tutti i giorni della mia vita,  \nabiterò nella casa del Signore per lunghissimi anni.  \n  \nGloria al Padre e al Figlio e allo Spirito Santo,  \ncome era nel principio e ora e sempre. Amen. Amen.  \n \nA te, Signore, innalzo l\'anima mia.  \nAdditami, Signore, le tue vie, avviami nella tua verità:  \nmio Dio sei tu la mia salvezza.  \n \nTutto il giorno io spero in te, Signore, per la tua bontà.  \nRicorda il tuo affetto, Signore, ed il tuo amore che è da sempre.',s:'o christe domine jesu o christe domine jesu o christe domine jesu x2 il signore e il mio pastore non manco di nulla in pascoli erbosi mi fa riposare ad acque tranquille mi conduce mi rinfranca mi guida per il giusto sentiero per amore del suo nome se dovessi camminare per una valle oscura non temerei alcun male perche tu sei con me il tuo bastone e il tuo vincastro mi danno sicurezza davanti a me tu prepari una mensa sotto gli occhi dei miei nemici cospargi di olio il mio capo il mio calice trabocca felicita e grazia mi saranno compagne tutti i giorni della mia vita abitero nella casa del signore per lunghissimi anni gloria al padre e al figlio e allo spirito santo come era nel principio e ora e sempre amen amen a te signore innalzo l anima mia additami signore le tue vie avviami nella tua verita mio dio sei tu la mia salvezza tutto il giorno io spero in te signore per la tua bonta ricorda il tuo affetto signore ed il tuo amore che e da sempre 194',type:'N',i:226},
{n:'195',t:'O GESÙ VOGLIO SEGUIRTI',c:'O GESÙ VOGLIO SEGUIRTI SEMPRE,  \nO GESÙ VOGLIO SEGUIRTI SEMPRE,  \nO GESÙ VOGLIO SEGUIRTI SEMPRE,  \nINDIETRO NON MI VOLTERÒ.  \n  \nCon la tua croce son morto al mondo...  \n \n\nCon te risorto a nuova vita ...  \n \nO Gesù voglio seguirti sempre...',s:'o gesu voglio seguirti o gesu voglio seguirti sempre o gesu voglio seguirti sempre o gesu voglio seguirti sempre indietro non mi voltero con la tua croce son morto al mondo con te risorto a nuova vita o gesu voglio seguirti sempre 195',type:'N',i:227},
{n:'196',t:'O SIGNOR PRENDI I NOSTRI CUORI',c:'O SIGNOR,PRENDI I NOSTRI CUORI,  \nCAMBIALI, TRASFORMALI  \nPERCHÉ DIVENTINO TUA GLORIA.  \n \nO Signor, prendi le nostre vite...  \n \nO Signor, prendi le nostre mani. ..  \n \nO Signor, prendi le nostre pene...  \n \nO Signor, prendi le nostre gioie...  \n \nO Signor, prendi  questo pane,   \ncambialo, trasformalo  \nperché diventi il Corpo tuo santo.  \n  \nO Signor, prendi  questo vino,  \ncambialo, trasformalo  \nperché diventi il Sangue tuo divin.',s:'o signor prendi i nostri cuori o signor prendi i nostri cuori cambiali trasformali perche diventino tua gloria o signor prendi le nostre vite o signor prendi le nostre mani o signor prendi le nostre pene o signor prendi le nostre gioie o signor prendi questo pane cambialo trasformalo perche diventi il corpo tuo santo o signor prendi questo vino cambialo trasformalo perche diventi il sangue tuo divin 196',type:'N',i:228},
{n:'197',t:'OFFERTORIO',c:'Prendiamo e mangiamo questo pane,   \nè il corpo di nostro Signor.  \nPrendiamo e beviamo questo vino,   \nè il sangue di nostro Signor. \n  \nSei la nostra fame, dacci sempre di questo pane.  \nSei la nostra sete, dacci sempre di questo vino.  \n \n(daccapo)',s:'offertorio prendiamo e mangiamo questo pane e il corpo di nostro signor prendiamo e beviamo questo vino e il sangue di nostro signor sei la nostra fame dacci sempre di questo pane sei la nostra sete dacci sempre di questo vino daccapo 197',type:'N',i:229},
{n:'198',t:'OSANNA',c:'Osanna, osanna, osanna  all\'Altissimo!  (x2)  \n  \nINNALZIAMO IL TUO NOM CON LE LODI NEL CUOR,  \nTI  ESALTIAMO  SIGNORE  DIO, OSANNA ALL\'ALTISSIMO!  \n \n\nGloria, gloria, gloria al Re dei re! (x2) \n  \nINNALZIAMO IL TUO NOM… \n...GLORIA AL RE DEI RE! \n \nGesù, Gesù, Gesù è il Re dei re! (x2) \n \nINNALZIAMO IL TUO NOM… \n...GESU\' E\' Il RE DEI RE!',s:'osanna osanna osanna osanna all altissimo x2 innalziamo il tuo nom con le lodi nel cuor ti esaltiamo signore dio osanna all altissimo gloria gloria gloria al re dei re x2 innalziamo il tuo nom gloria al re dei re gesu gesu gesu e il re dei re x2 innalziamo il tuo nom gesu e il re dei re 198',type:'N',i:230},
{n:'199',t:'OSANNA (al Re dei re)',c:'Osanna, osanna, \nosanna al Re dei re! \nOsanna, osanna, \nosanna al Re dei re!',s:'osanna al re dei re osanna osanna osanna al re dei re osanna osanna osanna al re dei re 199',type:'N',i:231},
{n:'200',t:'OSANNA AL RE DEI RE',c:'OSANNA,  \nOSANNA,  \nOSANNA,  \nOSANNA AL RE DEI RE! (x2)  \n  \nSu cantiamo al Signore  \nun canto nuovo  \ne gioiosi proclamiamo  \nche  Gesù è il Re. (RIT)  \nLui ci porta alla vittoria,  \nè un Dio potente.  \nInnalziamo a lui la gloria,  \negli è il Signor. (RIT) \n  \nEleviamo su nel cielo  \nla nostra lode  \ne con gli angeli cantiamo  \n\"Gloria al Signor\". (RIT)',s:'osanna al re dei re osanna osanna osanna osanna al re dei re x2 su cantiamo al signore un canto nuovo e gioiosi proclamiamo che gesu e il re rit lui ci porta alla vittoria e un dio potente innalziamo a lui la gloria egli e il signor rit eleviamo su nel cielo la nostra lode e con gli angeli cantiamo gloria al signor rit 200',type:'N',i:232},
{n:'201',t:'OSTENDE DOMINE',c:'Ostende nobis Domine,  \nmisericordiam tuam.  \nAmen! Amen!  \nMaranathà! Maranathà!',s:'ostende domine ostende nobis domine misericordiam tuam amen amen maranatha maranatha 201',type:'N',i:233},
{n:'202',t:'PADRE MIO',c:'La mia preghiera sale a te,  \nsalvezza e forza sei per me,  \nvoglio lodarti e ringraziarti  \ne dire ti amo Padre mio.  \n  \nE la mia voce sale a te,  \nmisericordia sei per me,   \nvoglio  lodarti e ringraziarti  \ne dire ti amo Padre mio.  \n  \nEd il mio canto sale a te,  \nsperanza e gioia sei per me,   \nvoglio prostrarmi  per adorarti  \ne dire ti amo Padre mio.  \n  \nE la mia lode sale a te,  \nil mio Signore sei per me,  \nvoglio prostrarmi  per adorarti  \ne dire ti amo Padre mio.  \n  \nlo ti chiamerò  Abbà, Abbà, Abbà,  \nti chiamerò  Abbà.  \n  \nE la mia lode sale a te,  \nil mio Signore sei per me,  \nvoglio  prostrarmi per adorarti  \ne dire ti amo Padre mio.',s:'padre mio la mia preghiera sale a te salvezza e forza sei per me voglio lodarti e ringraziarti e dire ti amo padre mio e la mia voce sale a te misericordia sei per me voglio lodarti e ringraziarti e dire ti amo padre mio ed il mio canto sale a te speranza e gioia sei per me voglio prostrarmi per adorarti e dire ti amo padre mio e la mia lode sale a te il mio signore sei per me voglio prostrarmi per adorarti e dire ti amo padre mio lo ti chiamero abba abba abba ti chiamero abba e la mia lode sale a te il mio signore sei per me voglio prostrarmi per adorarti e dire ti amo padre mio 202',type:'N',i:234},
{n:'203',t:'PADRE NOSTRO',c:'Padre nostro che sei nei cieli santificato sia il tuo Nome,  \nvenga il tuo Regno, sia fatta la tua volontà  \ncome in cielo così in terra.  \n \nDacci oggi il nostro pane quotidiano,   \nrimetti a noi nostri debiti  \ncome anche noi li rimettiamo ai nostri debitori.  \nE non abbandonarci alla tentazione  \nma libera noi dal male.  \nE non abbandonarci alla tentazione  \nma libera noi dal male.',s:'padre nostro padre nostro che sei nei cieli santificato sia il tuo nome venga il tuo regno sia fatta la tua volonta come in cielo cosi in terra dacci oggi il nostro pane quotidiano rimetti a noi nostri debiti come anche noi li rimettiamo ai nostri debitori e non abbandonarci alla tentazione ma libera noi dal male e non abbandonarci alla tentazione ma libera noi dal male 203',type:'N',i:235},
{n:'204',t:'PADRE T\'ADORIAMO',c:'Padre, t\'adoriamo,   \nla nostra vita ti offriamo,  \nnoi ti amiamo.  \n \n\nGesù...  \n \nSpirito...',s:'padre t adoriamo padre t adoriamo la nostra vita ti offriamo noi ti amiamo gesu spirito 204',type:'N',i:236},
{n:'205',t:'PADRE T\'AMIAMO',c:'Padre t\'amiamo e ti adoriamo,  \ngloria al tuo Nome sulla terra!  \nGloria  al tuo Nome,  \ngloria al tuo Nome,  \ngloria al tuo Nome sulla terra!  \n \nGesù t\'amiamo...  \n \nSpirito t\'amiamo...',s:'padre t amiamo padre t amiamo e ti adoriamo gloria al tuo nome sulla terra gloria al tuo nome gloria al tuo nome gloria al tuo nome sulla terra gesu t amiamo spirito t amiamo 205',type:'N',i:237},
{n:'206',t:'PADRE T\'AMIAMO, LODE A TE SIGNOR',c:'Padre t\'amiamo, siam riuniti qui per celebrare il tuo Nome.  \nPadre t\'amiamo, lode e gloria a te, Signor.  \nGesù t\'amiamo, sei l\'Agnel di Dio sacrificato per noi.    \nGesù t\'amiamo, lode e gloria a te, Signor.  \n  \nGloria a te Signore, eleviam le nostre mani a te  \nper adorarti e celebrare il tuo santo Nom. \n \n \nOh, oh, Spirito, t\'amiamo guidaci a Gesù, mostraci la via.    \nSpirito, t\'amiamo, lode e gloria a te, Signor.  \n  \nLode a te Signore,   eleviam le nostre mani a te  \nper adorarti e celebrare il tuo  Nome,  \ncelebrare il tuo Nome, celebrare il tuo santo Nom!',s:'padre t amiamo lode a te signor padre t amiamo siam riuniti qui per celebrare il tuo nome padre t amiamo lode e gloria a te signor gesu t amiamo sei l agnel di dio sacrificato per noi gesu t amiamo lode e gloria a te signor gloria a te signore eleviam le nostre mani a te per adorarti e celebrare il tuo santo nom oh oh spirito t amiamo guidaci a gesu mostraci la via spirito t amiamo lode e gloria a te signor lode a te signore eleviam le nostre mani a te per adorarti e celebrare il tuo nome celebrare il tuo nome celebrare il tuo santo nom 206',type:'N',i:238},
{n:'207',t:'PADRE TI PREGHIAM',c:'Padre ti preghiam,  fa\' che uno siam!  \nPerché il mondo creda al tuo amore, Padre ti preghiam.',s:'padre ti preghiam padre ti preghiam fa che uno siam perche il mondo creda al tuo amore padre ti preghiam 207',type:'N',i:239},
{n:'208',t:'PARTIRETE CON GIOIA/CANTERÒ',c:'Voi dunque partirete con gioia,    \nsarete condotti in pace.   \nI monti e le colline davanti a voi  \neromperanno in grida di  gioia.  \n  \nE TUTTI GLI ALBERI  \nBATTERAN LE MANI  \nE CIÒ SARÀ A GLORIA DEL SIGNORE.  \n\nE TUTTI GLI ALBERI  \nBATTERAN LE MANI,  \nUN SEGNO ETERNO CHE NON SPARIRÀ.  \n \n(da capo)  \n \n...PER SEMPRE \n  \nCanterò alleluia al Signor,  \ncanterò alleluia al Signor.   \nCanterò e loderò, esalterò  \nil suo Nome sempre  \ne canterò alleluia al Signor!  \n \nVoi dunque  \npartirete con gioia.  Canterò alleluia al Signor.  \n \n(da capo)  \n  \n(Finale)  \nE TUTTI GLI ALBERI BATTERAN LE MANI  \nE CIÒ SARÀ A GLORIA DEL SIGNORE. (x2)  \nE TUTTI GLI ALBERI BATTERAN LE MANI,  \nUN SEGNO ETERNO CHE NON SPARIRÀ.  \nPER SEMPRE  \nALLELUIA AL SIGNOR, PER SEMPRE.',s:'partirete con gioia cantero voi dunque partirete con gioia sarete condotti in pace i monti e le colline davanti a voi eromperanno in grida di gioia e tutti gli alberi batteran le mani e cio sara a gloria del signore e tutti gli alberi batteran le mani un segno eterno che non sparira da capo per sempre cantero alleluia al signor cantero alleluia al signor cantero e lodero esaltero il suo nome sempre e cantero alleluia al signor voi dunque partirete con gioia cantero alleluia al signor da capo finale e tutti gli alberi batteran le mani e cio sara a gloria del signore x2 e tutti gli alberi batteran le mani un segno eterno che non sparira per sempre alleluia al signor per sempre 208',type:'N',i:240},
{n:'209',t:'POPOLI TUTTI ACCLAMATE',c:'Mio Dio, Signore, nulla è pari a te.  \nOra e per sempre,  \nvoglio lodare   \nil tuo grande amor per noi.  \n  \nMia roccia tu sei,   \npace e conforto mi dai.   \nCon tutto il cuore e le mie forze,    \nsempre io ti adorerò.  \n  \nPOPOLI TUTTI ACCLAMATE AL SIGNORE  \nGLORIA E POTENZA CANTIAMO AL RE,  \nMARI E MONTI SI PROSTRINO A TE,  \nAL TUO NOME, O SIGNORE.  \nCANTO DI GIOIA PER QUELLO CHE FAI,  \nPER SEMPRE SIGNORE CON TE RESTERÒ,  \nNON C\'È PROMESSA,  \n\nNON C\'È FEDELTÀ CHE IN TE.',s:'popoli tutti acclamate mio dio signore nulla e pari a te ora e per sempre voglio lodare il tuo grande amor per noi mia roccia tu sei pace e conforto mi dai con tutto il cuore e le mie forze sempre io ti adorero popoli tutti acclamate al signore gloria e potenza cantiamo al re mari e monti si prostrino a te al tuo nome o signore canto di gioia per quello che fai per sempre signore con te restero non c e promessa non c e fedelta che in te 209',type:'N',i:241},
{n:'210',t:'PROSTRATI ADORIAMO',c:'Prostrati adoriamo  \ndavanti a te Signore,  \ncantando le tue lodi  \ngridiamo: alleluia!  \n \nALLELUIA, ALLELUIA, ALLELUIA, AMEN!  \n  \nInsieme  coi fratelli  \nti diamo onore e gloria,  \na te che sei sul trono  \ncantiamo: alleluia! (RIT)  \n \nRiempi i nostri cuori  \ndi lodi e canti nuovi,  \nperché tu sei l\'Agnello  \ndel Dio eterno e santo. (RIT)',s:'prostrati adoriamo prostrati adoriamo davanti a te signore cantando le tue lodi gridiamo alleluia alleluia alleluia alleluia amen insieme coi fratelli ti diamo onore e gloria a te che sei sul trono cantiamo alleluia rit riempi i nostri cuori di lodi e canti nuovi perche tu sei l agnello del dio eterno e santo rit 210',type:'N',i:242},
{n:'211',t:'QOL RINNA',c:'Qol - rinna(h) - wishua(h)  \n \nQol - rinna(h) - wishua(h)  \nbe ahalézaddiqim. (x2)  \n \nYemin - yemin - yemin - Adonai  \nOsa(h)hayl. (x2)   \n \nVoci di giubilo e vittoria  \nnelle tende dei giusti. (x2)  \n  \nLa mano del Signore  \nha fatto meraviglie. (x2)',s:'qol rinna qol rinna h wishua h qol rinna h wishua h be ahalezaddiqim x2 yemin yemin yemin adonai osa h hayl x2 voci di giubilo e vittoria nelle tende dei giusti x2 la mano del signore ha fatto meraviglie x2 211',type:'N',i:243},
{n:'212',t:'QUANDO ANDREMO SU NEL CIEL',c:'Quando andremo su nel ciel  \nquando andremo su nel ciel  \nil tuo canto durerà in eterno.  \nLa tua vita canterà  \nquando andremo su nel ciel,  \ncanterà, canterà il suo amor.  \n \nQuando andremo su nel ciel (x2)  \n\nla tua danza durerà in eterno.  \nCon la vita danzerai  \nquando andremo su nel ciel.  \nDanzerà, danzerà il suo amor.  \n  \nQuando andremo su nel ciel (x2)  \nla tua lode durerà in eterno.  \nLa tua vita loderà  \nquando andremo su nel ciel.  \nLoderà, loderà il suo amor.',s:'quando andremo su nel ciel quando andremo su nel ciel quando andremo su nel ciel il tuo canto durera in eterno la tua vita cantera quando andremo su nel ciel cantera cantera il suo amor quando andremo su nel ciel x2 la tua danza durera in eterno con la vita danzerai quando andremo su nel ciel danzera danzera il suo amor quando andremo su nel ciel x2 la tua lode durera in eterno la tua vita lodera quando andremo su nel ciel lodera lodera il suo amor 212',type:'N',i:244},
{n:'213',t:'QUANDO GUARDO ALLA TUA SANTITA\'',c:'Quando guardo alla tua santità,  \nquando ammiro il tuo gran splendor  \nla tua luce mi circonda  \ne le ombre svaniscono.  \n  \nQuale gioia  \ncontemplare il tuo cuor,  \nesaltare il tuo amor,  \nla tua luce mi circonda  \ne le ombre svaniscono.  \n  \nIO TI ADORO, IO TI ADORO,  \nIL VIVERE PER ME È ADORARE TE.  \nIO TI ADORO, IO TI ADORO,  \nIL VIVERE PER ME È ADORARE TE.',s:'quando guardo alla tua santita quando guardo alla tua santita quando ammiro il tuo gran splendor la tua luce mi circonda e le ombre svaniscono quale gioia contemplare il tuo cuor esaltare il tuo amor la tua luce mi circonda e le ombre svaniscono io ti adoro io ti adoro il vivere per me e adorare te io ti adoro io ti adoro il vivere per me e adorare te 213',type:'N',i:245},
{n:'214',t:'QUANDO LO SPIRITO',c:'QUANDO LO SPIRITO VIVE IN ME  \nIO CANTO COME DAVID, (x2)  \n \nIO CANTO, IO CANTO, \nIO CANTO COME DAVID. (x2)  \n  \nQuando lo Spirito vive in me  \nio lodo come David...  \n \nQuando lo Spirito vive in me  \nio prego come David...  \n \nQuando lo Spirito vive in me  \nio amo come David...  \n \n\nQuando lo Spirito vive in me  \nio danzo come David...',s:'quando lo spirito quando lo spirito vive in me io canto come david x2 io canto io canto io canto come david x2 quando lo spirito vive in me io lodo come david quando lo spirito vive in me io prego come david quando lo spirito vive in me io amo come david quando lo spirito vive in me io danzo come david 214',type:'N',i:246},
{n:'215',t:'QUESTA E\' LA MIA FEDE',c:'QUESTA È LA MIA FEDE,  \nPROCLAMARTI MIO RE,   \nUNICO DIO, GRANDE SIGNORE.  \nQUESTA È LA SPERANZA,  \nSO CHE RISORGERÒ   \nE IN TE DIMORERÒ.  \n  \nQUESTA È LA MIA FEDE,  \nPROCLAMARTI MIO RE,  \nUNICO DIO, GRANDE SIGNORE.  \nQUESTA È LA SPERANZA,  \nSO CHE RISORGERÒ  \nE IN TE DIMORERÒ.  \n  \nCanterò la gioia  \ndi esser figlio, canterò  \nche tu non abbandoni,  \nnon tradisci mai.  \n \nDammi sempre la tua grazia  \ne in te dimorerò  \nper adorarti,  \nper servirti in verità,  \nmio re. (RIT) \n  \nCanterò che solo  \ntu sei vita e verità,  \nche sei salvezza,  \nche sei vera libertà.  \nIo porrò la mia fiducia  \nin te che sei la via,  \ncamminerò nella tua  \nsanta volontà, mio re. (RIT)',s:'questa e la mia fede questa e la mia fede proclamarti mio re unico dio grande signore questa e la speranza so che risorgero e in te dimorero questa e la mia fede proclamarti mio re unico dio grande signore questa e la speranza so che risorgero e in te dimorero cantero la gioia di esser figlio cantero che tu non abbandoni non tradisci mai dammi sempre la tua grazia e in te dimorero per adorarti per servirti in verita mio re rit cantero che solo tu sei vita e verita che sei salvezza che sei vera liberta io porro la mia fiducia in te che sei la via camminero nella tua santa volonta mio re rit 215',type:'N',i:247},
{n:'216',t:'QUESTO È IL MIO CORPO',c:'QUESTO È IL MIO CORPO     \nSPEZZATO PER TE.  \nQUESTO È IL MIO SANGUE  \nVERSATO PER TE  \n  \n\nPrendi il mio Corpo offerto a te,  \nprendi il mio Sangue donato a te,  \ndonato a te. (RIT) \n \nVieni alla mensa e cena con me,  \nmangia il mio pane e bevi il mio vino,  \ne bevi il mio vino. (RIT) \n  \nMangia il mio Corpo  \nin memoria di me,  \nbevi il mio Sangue in memoria di me,  \nin memoria di me. (RIT)',s:'questo e il mio corpo questo e il mio corpo spezzato per te questo e il mio sangue versato per te prendi il mio corpo offerto a te prendi il mio sangue donato a te donato a te rit vieni alla mensa e cena con me mangia il mio pane e bevi il mio vino e bevi il mio vino rit mangia il mio corpo in memoria di me bevi il mio sangue in memoria di me in memoria di me rit 216',type:'N',i:248},
{n:'217',t:'RALLEGRATEVI NEL SIGNORE',c:'RALLEGRATEVI NEL SIGNORE SEMPRE,  \nRALLEGRATEVI  \nNON ANGUSTIATEVI PER NULLA.  \nRALLEGRATEVI NEL SIGNORE SEMPRE,  \nRALLEGRATEVI IL SIGNORE È VICINO.  \n  \nE la pace di Dio sarà  con voi,  \nnon angustiatevi per nulla.  \nE la pace di Dio sarà con voi,  \nalleluia. (RIT) \n  \nE la luce di Dio risplenda in voi,  \nnon angustiatevi per nulla.  \nE la luce di Dio risplenda in voi, \nalleluia.  (RIT)  \n  \nIl  Signore è la gioia,      (alleluia) \nIl Signore è la speranza,    (alleluia)  \nIl Signore è libertà,        (alleluia) \nIl Signore è verità,         (alleluia)  (RIT) \n  \nE la grazia di Dio dimori in voi,  \nnon angustiatevi per nulla.  \nE la grazia di Dio dimori in voi, \nalleluia.',s:'rallegratevi nel signore rallegratevi nel signore sempre rallegratevi non angustiatevi per nulla rallegratevi nel signore sempre rallegratevi il signore e vicino e la pace di dio sara con voi non angustiatevi per nulla e la pace di dio sara con voi alleluia rit e la luce di dio risplenda in voi non angustiatevi per nulla e la luce di dio risplenda in voi alleluia rit il signore e la gioia alleluia il signore e la speranza alleluia il signore e liberta alleluia il signore e verita alleluia rit e la grazia di dio dimori in voi non angustiatevi per nulla e la grazia di dio dimori in voi alleluia 217',type:'N',i:249},
{n:'218',t:'RENDETE GRAZIE',c:'Rendete grazie   \na colui che è santo,  \n\nrendete grazie a Dio  \nper suo Figlio Gesù! (x2) \n \nE possa il debole  \ndir son  forte  \ne possa il povero  \ndir son  ricco  \nper quel che ha fatto  \nil Signore per me. (x2)',s:'rendete grazie rendete grazie a colui che e santo rendete grazie a dio per suo figlio gesu x2 e possa il debole dir son forte e possa il povero dir son ricco per quel che ha fatto il signore per me x2 218',type:'N',i:250},
{n:'219',t:'RIMANETE IN ME',c:'Rimanete in me ed io in voi  \nperché senza di me  \nnon potete far nulla.  \nChi rimane in me ed io in lui  \nmolto  frutto farà.  \n  \nRimanete in me ed io in voi  \nperché senza di me  \nnon potete far nulla.  \nChi rimane in me ed io in lui  \nmolto frutto farà.  \n  \nIO SONO LA VITE,  \nVOI SIETE I TRALCI,  \nRIMANETE IN ME  \nSE LE MIE PAROLE  \nRESTERANNO IN VOI   \nCIÒ CHE CHIEDETE VI SARÀ DATO.  \n  \nRimanete in me ed io in voi,  \nquesto ho detto perché  \nla mia gioia sia in voi.   \nChi rimane in me ed io in lui  \nmolto frutto farà.  \n  \nRimanete in me ed io in voi,  \nquesto ho detto perché  \nla mia gioia sia in voi.  \nChi rimane in me ed io in lui  \nmolto frutto farà. (RIT) \n  \nIO SONO LA VITE,  \nVOI SIETE I TRALCI,  \nRIMANETE IN ME.   \n\nSE LE MIE PAROLE  \nRESTERANNO IN VOI  \nCIÒ CHE CHIEDETE  \nVI SARÀ DATO.',s:'rimanete in me rimanete in me ed io in voi perche senza di me non potete far nulla chi rimane in me ed io in lui molto frutto fara rimanete in me ed io in voi perche senza di me non potete far nulla chi rimane in me ed io in lui molto frutto fara io sono la vite voi siete i tralci rimanete in me se le mie parole resteranno in voi cio che chiedete vi sara dato rimanete in me ed io in voi questo ho detto perche la mia gioia sia in voi chi rimane in me ed io in lui molto frutto fara rimanete in me ed io in voi questo ho detto perche la mia gioia sia in voi chi rimane in me ed io in lui molto frutto fara rit io sono la vite voi siete i tralci rimanete in me se le mie parole resteranno in voi cio che chiedete vi sara dato 219',type:'N',i:251},
{n:'220',t:'RISORGERÒ CON TE',c:'Verso di te levo l\'anima mia,  \nascolta la mia preghiera.  \nTi donerò la mia piccola fede, \ncresci dentro di me.  \nIl mio cuore ha sete di te,  \ndel tuo amore.  \n \nLODE A TE MIO SIGNORE TI CANTERÒ,  \nUN CANTO NUOVO SGORGA DAL MIO CUORE.   \nLODE A TE MIO SIGNORE TI CANTERÒ,   \nLA MIA PREGHIERA IO T\'INNALZERÒ.  \n  \nSolo in te trovo forza mio Dio,  \nnel tuo nome è la salvezza.  \nNon temerò, perché tu sei con me,  \ne mi rialzerai,  \nla mia gioia è vivere nella tua gloria. (RIT) \n  \nLa mia gioia è vivere nella tua gloria,  gloria.  \n  \nLODE A TE MIO SIGNORE TI CANTERÒ,  \nUN CANTO NUOVO SGORGA DAL MIO CUORE.  \nLODE A TE MIO SIGNORE TI CANTERÒ,  \nLA MIA PREGHIERA IO T\'INNALZO.  \n \n(coda) \n  \nPer sempre ti amerò,  \nper sempre ti amerò,  \nvivendo  nel tuo amore un giorno ti vedrò.  \n  \nRisorgerò con te Gesù.  \nRisorgerò con te Gesù.  \nRisorgerò con te Gesù.',s:'risorgero con te verso di te levo l anima mia ascolta la mia preghiera ti donero la mia piccola fede cresci dentro di me il mio cuore ha sete di te del tuo amore lode a te mio signore ti cantero un canto nuovo sgorga dal mio cuore lode a te mio signore ti cantero la mia preghiera io t innalzero solo in te trovo forza mio dio nel tuo nome e la salvezza non temero perche tu sei con me e mi rialzerai la mia gioia e vivere nella tua gloria rit la mia gioia e vivere nella tua gloria gloria lode a te mio signore ti cantero un canto nuovo sgorga dal mio cuore lode a te mio signore ti cantero la mia preghiera io t innalzo coda per sempre ti amero per sempre ti amero vivendo nel tuo amore un giorno ti vedro risorgero con te gesu risorgero con te gesu risorgero con te gesu 220',type:'N',i:252},
{n:'221',t:'RISUSCITÒ',c:'RISUSCITÒ, RISUSCITÒ,  \n\nRISUSCITÒ,  ALLELUIA!  \nALLELUIA, ALLELUIA,  \nALLELUIA, RISUSCITÒ!  \n  \nLa morte, dove sta la morte?  \nDov\'è la sua morte?  \nDov\'è la sua vittoria? (RIT)  \n  \nAllegria, allegria fratelli,   \nche se oggi noi amiamo  \nè perché risuscitò. (RIT)  \n  \nGrazie siano rese al Padre  \nche ci porta al suo Regno  \ndove si vive d\'amore. (RIT)  \n  \nSe con lui moriamo,  \ncon lui viviamo,  \ncon lui cantiamo: Alleluia! (RIT)',s:'risuscito risuscito risuscito risuscito alleluia alleluia alleluia alleluia risuscito la morte dove sta la morte dov e la sua morte dov e la sua vittoria rit allegria allegria fratelli che se oggi noi amiamo e perche risuscito rit grazie siano rese al padre che ci porta al suo regno dove si vive d amore rit se con lui moriamo con lui viviamo con lui cantiamo alleluia rit 221',type:'N',i:253},
{n:'222',t:'RISUSCITO\'  (CON POTENZA)',c:'Con potenza risuscitò,  \ncon potenza risuscitò,  \ncon potenza risuscitò Gesù,  \ncon potenza risuscitò!  \n  \nCon potenza ti salverà ...  \n \nCon potenza  ti guarirà ...  \n \n \nCon potenza  ritornerà ...',s:'risuscito con potenza con potenza risuscito con potenza risuscito con potenza risuscito gesu con potenza risuscito con potenza ti salvera con potenza ti guarira con potenza ritornera 222',type:'N',i:254},
{n:'223',t:'RISUSCITO\'  ALLELUJA',c:'RISUSCITÒ, RISUSCITÒ, RISUSCITÒ, RISUSCITÒ.  \nALLELUIA, ALLELUIA, ALLELUIA, ALLELUIA.  \n  \nEcco l\'angelo al sepolcro davanti a Maria  \ne i discepoli a Emmaus saranno consolati  \ne gli apostoli dallo Spirito saranno trasformati,  \nvoglio gridar, gridar la verità.  (RIT) \n \nPer annunciare al mondo intero l\'amor del Dio di bontà   \ne proclamare a tutti gliuomini il regno dell\'aldilà.  \n\nE un desiderio immenso che mi chiama alla gioia, \nvoglio gridar, gridar la verità. (RIT) \n \nÈ Gesù risuscitato che noi vogliam cantar  \nfame e sete noi abbiamo ma lui ci sazierà.  \nA colui che crederà che l\'amor lo salverà  \nvoglio gridar, gridar la verità. (RIT)',s:'risuscito alleluja risuscito risuscito risuscito risuscito alleluia alleluia alleluia alleluia ecco l angelo al sepolcro davanti a maria e i discepoli a emmaus saranno consolati e gli apostoli dallo spirito saranno trasformati voglio gridar gridar la verita rit per annunciare al mondo intero l amor del dio di bonta e proclamare a tutti gliuomini il regno dell aldila e un desiderio immenso che mi chiama alla gioia voglio gridar gridar la verita rit e gesu risuscitato che noi vogliam cantar fame e sete noi abbiamo ma lui ci saziera a colui che credera che l amor lo salvera voglio gridar gridar la verita rit 223',type:'N',i:255},
{n:'224',t:'RUAH',c:'Ruah, ruah, ruah.   \n  \nNon per potenza né per forza  \nma per lo Spirito di Dio. (x2)',s:'ruah ruah ruah ruah non per potenza ne per forza ma per lo spirito di dio x2 224',type:'N',i:256},
{n:'225',t:'SALDO È IL MIO CUORE DIO',c:'SALDO È IL MIO CUORE DIO,  \nVOGLIO CANTARE AL SIGNOR.  \nSVEGLIATI MIO CUORE,  \nSVEGLIATEVI ARPA E CETRA,  \nVOGLIO SVEGLIARE L\'AURORA.  \nSVEGLIATI MIO CUORE,  \nSVEGLIATEVI ARPA E CETRA,  \nVOGLIO SVEGLIARE L\'AURORA.  \n  \nTi loderò tra i popoli Signore,  \na te canterò inni tra le genti.  \nPoiché la tua bontà è grande fino ai cieli  \ne la tua fedeltà fino alle nubi. (RIT) \n  \nInnalzati sopra i cieli, o Signore,  \nsu tutta la terra splenda la tua gloria.   \nPerché siano liberati i tuoi amici,   \nsalvaci con la tua potente destra. (RIT) \n \nDio ha parlato nel suo santuario,   \ncontro il nemico ci darà soccorso.   \nCon Dio noi faremo cose grandi   \ned egli annienterà chi ci opprime. (RIT)',s:'saldo e il mio cuore dio saldo e il mio cuore dio voglio cantare al signor svegliati mio cuore svegliatevi arpa e cetra voglio svegliare l aurora svegliati mio cuore svegliatevi arpa e cetra voglio svegliare l aurora ti lodero tra i popoli signore a te cantero inni tra le genti poiche la tua bonta e grande fino ai cieli e la tua fedelta fino alle nubi rit innalzati sopra i cieli o signore su tutta la terra splenda la tua gloria perche siano liberati i tuoi amici salvaci con la tua potente destra rit dio ha parlato nel suo santuario contro il nemico ci dara soccorso con dio noi faremo cose grandi ed egli annientera chi ci opprime rit 225',type:'N',i:257},
{n:'226',t:'SALMO 27',c:'UNA COSA HO CHIESTO, QUESTA SOL IO CERCO,  \n\nABITAR NELLA CASA DEL SIGNOR.  \n(x2)  \n \nTutti i giorni della mia vita  \nper gustar la dolcezza del Signor  \ned ammirare il suo tempio. (RIT) \n \nTu mi hai detto: \"Cerca il mio volto\",  \ndi te dice il mio cuor  \nil tuo volto io cerco. (RIT) \n  \nHo abbandonato tutto di me,  \nte solo io cerco o Signor,  \nmostrami i tuoi sentier. (RIT) \n  \nSpero nel Signor  \ned egli mi dà la forza  \nperché conosco la sua bontà. (RIT)',s:'salmo 27 una cosa ho chiesto questa sol io cerco abitar nella casa del signor x2 tutti i giorni della mia vita per gustar la dolcezza del signor ed ammirare il suo tempio rit tu mi hai detto cerca il mio volto di te dice il mio cuor il tuo volto io cerco rit ho abbandonato tutto di me te solo io cerco o signor mostrami i tuoi sentier rit spero nel signor ed egli mi da la forza perche conosco la sua bonta rit 226',type:'N',i:258},
{n:'227',t:'SALMO 50',c:'Pietà di me, o Dio,  \nsecondo la tua misericordia;  \nnel tuo grande amore  \ncancella il mio peccato.  \nLavami dalle mie colpe,  \nmondami dal mio peccato.  \nRiconosco la mia colpa,  \nil mio peccato mi sta davanti.  \n  \nNEL TUO AMORE  \nFA\' GRAZIA A SION,  \nRIALZA LE MURA DI GERUSALEMME.  \nNEL TUO AMORE  \nFA\' GRAZIA A SION,  \nRIALZA LE MURA DI GERUSALEMME.  \n  \nCrea in me, o Dio,  \nun cuore puro,  \nrinnova in me uno spirito saldo.  \nNon allontanarmi dalla tua presenza  \ne non privarmi del tuo Santo Spirito. (RIT) \n  \nPurificami con issòpo e io sarò mondato;  \nlavami e sarò più bianco della neve.   \nFammi sentire gioia e letizia,  \nesulteranno le ossa che hai spezzato. (RIT)',s:'salmo 50 pieta di me o dio secondo la tua misericordia nel tuo grande amore cancella il mio peccato lavami dalle mie colpe mondami dal mio peccato riconosco la mia colpa il mio peccato mi sta davanti nel tuo amore fa grazia a sion rialza le mura di gerusalemme nel tuo amore fa grazia a sion rialza le mura di gerusalemme crea in me o dio un cuore puro rinnova in me uno spirito saldo non allontanarmi dalla tua presenza e non privarmi del tuo santo spirito rit purificami con issopo e io saro mondato lavami e saro piu bianco della neve fammi sentire gioia e letizia esulteranno le ossa che hai spezzato rit 227',type:'N',i:259},
{n:'228',t:'SALMO 113',c:'Dal sorgere del sol  \ne fino al tramontar,  \ndall\'ovest e dall\'est  \nlode al nome del Signor!  \nEccelso è il Signor  \nla sua gloria splende nel ciel.  \nChi è pari al Signore lddio   \nche siede su nei cieli.  \n \nCANTIAM  LODE Al SIGNOR, ESALTIAMO Il SIGNOR,  \nSIA  BENEDETIO Il NOME SUO, ORA E SEMPRE LODE  \nCANTIAM  LODE Al SIGNOR, ESALTIAMO Il SIGNOR,  \nSIA  BENEDETIO Il NOME SUO, ORA E SEMPRE  \nLODE Al SIGNOR!  \n \nDall\'alto del suo tron s\'inchina a mirar  \ne solleva il misero e rialza il povero.  \nLa sterile fa abitar qual madre dei figli suoi.  \nLodate servi del Signor  \nlodate il Nome suo! (RIT)   \n \nCANTIAM  LODE Al SIGNOR, ESALTIAMO IL SIGNOR   \nSU  GRIDIAMO LODE Al SIGNOR, LODE Al SIGNOR! \n \nLODE AL SIGNOR! (AD LIBITUM)',s:'salmo 113 dal sorgere del sol e fino al tramontar dall ovest e dall est lode al nome del signor eccelso e il signor la sua gloria splende nel ciel chi e pari al signore lddio che siede su nei cieli cantiam lode al signor esaltiamo il signor sia benedetio il nome suo ora e sempre lode cantiam lode al signor esaltiamo il signor sia benedetio il nome suo ora e sempre lode al signor dall alto del suo tron s inchina a mirar e solleva il misero e rialza il povero la sterile fa abitar qual madre dei figli suoi lodate servi del signor lodate il nome suo rit cantiam lode al signor esaltiamo il signor su gridiamo lode al signor lode al signor lode al signor ad libitum 228',type:'N',i:260},
{n:'229',t:'SALMO 150',c:'ALLELUIA, ALLELUIA, ALLELUIA,  \nALLELUIA, ALLELUIA, ALLELUIA.  \n  \nLodate lddio nel tempio suo santo,  \nlodatelo nell\'alto firmamento,  \nlodatelo nei grandi suoi portenti,  \nlodatene l\'eccelsa sua maestà (RIT) \n \nLodatelo al clangore delle trombe,  \nlodatelo sull\'arpe e le chitarre,   \nlodatelo coi timpani e coi sistri,  \nlodatelo coi flauti e sulle corde. (RIT) \n  \nLodatelo sui cembali sonori,  \n\nlodatelo sui cembali squillanti,   \nogni vivente celebri il Signore,  \nlodate, lodate Iddio. (RIT)',s:'salmo 150 alleluia alleluia alleluia alleluia alleluia alleluia lodate lddio nel tempio suo santo lodatelo nell alto firmamento lodatelo nei grandi suoi portenti lodatene l eccelsa sua maesta rit lodatelo al clangore delle trombe lodatelo sull arpe e le chitarre lodatelo coi timpani e coi sistri lodatelo coi flauti e sulle corde rit lodatelo sui cembali sonori lodatelo sui cembali squillanti ogni vivente celebri il signore lodate lodate iddio rit 229',type:'N',i:261},
{n:'230',t:'SALVE REGINA',c:'Ti salutiamo Regina,   \nMadre di misericordia.   \nSei tu sospiro, sei vita,  \nsei tu la nostra speranza.  \n  \nSotto il tuo manto di stelle  \nnoi cerchiamo  riparo.   \nI nostri fiumi di pianto  \ntu tergi e consola.  \n  \nNoi siam dispersi nel mondo  \nin questa valle di lacrime.  \nSei tu la nostra difesa,  \ntu ci proteggi, Signora.  \n \nPortaci in braccio, tu, Madre  \nverso il Santo tuo Figlio.  \nStringici forte la mano,  \ntu, dolce e clemente.  \n  \nE lodata sempre sia    \nla nostra bella Madre.  \nPer sempre sia lodata  \nla gran  Vergine Maria,  \nla gran Vergine Maria,  \nla gran Vergine Maria.',s:'salve regina ti salutiamo regina madre di misericordia sei tu sospiro sei vita sei tu la nostra speranza sotto il tuo manto di stelle noi cerchiamo riparo i nostri fiumi di pianto tu tergi e consola noi siam dispersi nel mondo in questa valle di lacrime sei tu la nostra difesa tu ci proteggi signora portaci in braccio tu madre verso il santo tuo figlio stringici forte la mano tu dolce e clemente e lodata sempre sia la nostra bella madre per sempre sia lodata la gran vergine maria la gran vergine maria la gran vergine maria 230',type:'N',i:262},
{n:'231',t:'SANTA MARIA DEL CAMMINO',c:'Mentre trascorre la vita   \nsolo tu non sei mai.  \nSanta Maria del cammino   \nsempre sarà con te.  \n  \nVIENI O MADRE IN MEZZO A NOI,  \nVIENI MARIA QUAGGIÙ,  \nCAMMINEREMO INSIEME A TE,  \nVERSO LA LIBERTÀ.  \n  \n\nQuando qualcuno ti dice:  \n\"Nulla mai cambierà\",   \nlotta per un mondo nuovo,  \nlotta per la libertà. (RIT) \n  \nLungo la strada la gente  \nchiusa in se stessa va,   \noffri per primo la mano  \na chi è vicino a te. (RIT) \n  \nQuando ti senti ormai stanco  \ne sembra inutile andar,   \ntu vai tracciando un cammino,  \nun altro ti seguirà. (RIT) \n  \nAve, o piena di grazia,  \nil Signore è con te.   \n\"Ecco l\'ancella di Dio,  \nopera tu in me\". (RIT) \n  \nLa tua risposta Maria  \ndiede a noi Gesù,   \nciò che tu avevi creduto  \necco si avverò. (RIT) \n  \nTu sei la luce a chi crede  \nnel Figlio tuo Gesù,  \ntu sei speranza e certezza  \nche lui ci cambierà.  (RIT)',s:'santa maria del cammino mentre trascorre la vita solo tu non sei mai santa maria del cammino sempre sara con te vieni o madre in mezzo a noi vieni maria quaggiu cammineremo insieme a te verso la liberta quando qualcuno ti dice nulla mai cambiera lotta per un mondo nuovo lotta per la liberta rit lungo la strada la gente chiusa in se stessa va offri per primo la mano a chi e vicino a te rit quando ti senti ormai stanco e sembra inutile andar tu vai tracciando un cammino un altro ti seguira rit ave o piena di grazia il signore e con te ecco l ancella di dio opera tu in me rit la tua risposta maria diede a noi gesu cio che tu avevi creduto ecco si avvero rit tu sei la luce a chi crede nel figlio tuo gesu tu sei speranza e certezza che lui ci cambiera rit 231',type:'N',i:263},
{n:'232',t:'SANTA MARIA DELLA LODE',c:'Ave Maria madre della lode,  \naccogli la mia preghiera  \nmettila accanto alla tua  \nnel cuore di Gesù.  \n  \nAve Maria madre della lode,  \nrendi libero il mio cuore,   \nfammi attento alla sua voce  \ncome lo fosti tu.  \n  \nAve Maria  madre della lode,  \noffri al Padre anche il mio sì  \ned insegnami a lodare  \nla Santa Trinità.  \n\n  \nAve Maria madre della lode,  \naccogli la mia preghiera,  \nmettila accanto alla tua  \nnel cuore di Gesù.',s:'santa maria della lode ave maria madre della lode accogli la mia preghiera mettila accanto alla tua nel cuore di gesu ave maria madre della lode rendi libero il mio cuore fammi attento alla sua voce come lo fosti tu ave maria madre della lode offri al padre anche il mio si ed insegnami a lodare la santa trinita ave maria madre della lode accogli la mia preghiera mettila accanto alla tua nel cuore di gesu 232',type:'N',i:264},
{n:'233',t:'SANTO',c:'Santo, santo,  \nsanto è il Signore.  \nSanto, santo,  \nsanto è il Signore  \nDio dell\'universo.  \n  \nI cieli e la terra  \nsono pieni di te.  \nI cieli e la terra  \nsono pieni di te,  \ndella tua gloria.  \n  \nOsanna, osanna,  \nosanna nelle altezze.  \nOsanna, osanna,  \nosanna nelle altezze.  \n  \nBenedetto è colui che viene.  \nBenedetto è colui che viene  \nnel nome del Signore.  \n  \nOsanna, osanna,  \nosanna nelle altezze.  \n(x2)',s:'santo santo santo santo e il signore santo santo santo e il signore dio dell universo i cieli e la terra sono pieni di te i cieli e la terra sono pieni di te della tua gloria osanna osanna osanna nelle altezze osanna osanna osanna nelle altezze benedetto e colui che viene benedetto e colui che viene nel nome del signore osanna osanna osanna nelle altezze x2 233',type:'N',i:265},
{n:'234',t:'SANTO (DO)',c:'Santo, santo, santo è il Signore   \nDio  dell\'universo. (x2)  \n \nI CIELI E LA TERRA  \nSONO PIENI DELLA TUA GLORIA, (x2)  \n \nOSANNA, OSANNA, OSANNA  \nNELL\'ALTO DEI CIELI. (x2)  \n \nBenedetto colui che viene  \nnel nome del Signore. (x2) \n\n  \nOSANNA, OSANNA, OSANNA  \n  \nNELL\'ALTO DEI CIELI. (x2)',s:'santo do santo santo santo e il signore dio dell universo x2 i cieli e la terra sono pieni della tua gloria x2 osanna osanna osanna nell alto dei cieli x2 benedetto colui che viene nel nome del signore x2 osanna osanna osanna nell alto dei cieli x2 234',type:'N',i:266},
{n:'235',t:'SANTO (Mi-)',c:'Sa  - nto,  \nsa - nto.  \n \nI cieli e la terra  \nsono pieni della tua gloria,  \n \nosanna, osanna, osanna  \nosanna nelle altezze. (x2)  \n  \nBenedetto colui che viene  \nnel nome del Signore,  \n \nosanna, osanna, osanna  \nosanna nelle altezze. (x2)',s:'santo mi sa nto sa nto i cieli e la terra sono pieni della tua gloria osanna osanna osanna osanna nelle altezze x2 benedetto colui che viene nel nome del signore osanna osanna osanna osanna nelle altezze x2 235',type:'N',i:267},
{n:'236',t:'SANTO (Osanna eh)',c:'OSANNA  EH, OSANNA EH,  \nOSANNA  A CRISTO SIGNOR. (x2)  \n  \nSolo:    Santo, santo,  \nCoro:      osan - na.  \n   \n     \nSolo:    Santo, santo,  \nCoro:      osan - na.    (RIT) \n \n   \n     \nSolo: I cieli e la terra o Signore  \nCoro: sono pieni di te.  \n \nSolo: I cieli e la terra o Signore  \nCoro: sono pieni di te.  (RIT) \n \n  \n     \nSolo: Benedetto colui che viene   \nCoro: nel nome tuo Signor.   \n  \n \nSolo: Benedetto colui che viene   \nCoro: nel nome tuo Signor.  (RIT)',s:'santo osanna eh osanna eh osanna eh osanna a cristo signor x2 solo santo santo coro osan na solo santo santo coro osan na rit solo i cieli e la terra o signore coro sono pieni di te solo i cieli e la terra o signore coro sono pieni di te rit solo benedetto colui che viene coro nel nome tuo signor solo benedetto colui che viene coro nel nome tuo signor rit 236',type:'N',i:268},
{n:'237',t:'SANTO SABAOTH',c:'SANTO È SANTO,  \nSANTO È SANTO, SANTO SANTO  \nÈ SANTO, SANTO È SANTO, SANTO SANTO  \nÈ SANTO, JAHVÈ SABAOTH.  \n \nI cieli e la terra sono pieni di te, (x2) \nosanna nelle altezze, osanna. (x2)  (RIT) \n  \nBenedetto colui che viene nel nome del Signore, (x2) \nosanna nelle altezze, osanna. (x2)  (RIT)',s:'santo sabaoth santo e santo santo e santo santo santo e santo santo e santo santo santo e santo jahve sabaoth i cieli e la terra sono pieni di te x2 osanna nelle altezze osanna x2 rit benedetto colui che viene nel nome del signore x2 osanna nelle altezze osanna x2 rit 237',type:'N',i:269},
{n:'238',t:'SANTO, SANTO, SANTO',c:'Santo, santo, santo, santo,  \nsanto lddio onnipotente, santo, santo.  \nPresentiamo il nostro cuore a te,   \nin  pegno di  amor.  \nSanto, santo, santo, santo.   \n \nPadre buono, Padre buono  \nsiamo tutti tuoi figli, Padre  buono.  \nInnalziamo il nostro sguardo a te  \nin  segno di amor,  \nPadre buono, Padre buono.  \n  \nGesù caro, Gesù caro  \nci hai redenti e salvati, Gesù caro.  \nInnalziamo il nostro sguardo a te  \nin segno di amor,  \nGesù caro, Gesù caro.  \n  \nSanto Spirito, Santo Spirito  \nRiempi i nostri cuori ancora, Santo Spirito.  \nInnalziam le nostre mani a te in segno di amor,  \nSanto Spirito, Santo Spirito.  \n  \nAlleluia, alleluia,  \nalleluia, alleluia, alleluia!  \nOffriam la nostra vita a te in pegno d\'amor,  \nalleluia, alleluia!',s:'santo santo santo santo santo santo santo santo lddio onnipotente santo santo presentiamo il nostro cuore a te in pegno di amor santo santo santo santo padre buono padre buono siamo tutti tuoi figli padre buono innalziamo il nostro sguardo a te in segno di amor padre buono padre buono gesu caro gesu caro ci hai redenti e salvati gesu caro innalziamo il nostro sguardo a te in segno di amor gesu caro gesu caro santo spirito santo spirito riempi i nostri cuori ancora santo spirito innalziam le nostre mani a te in segno di amor santo spirito santo spirito alleluia alleluia alleluia alleluia alleluia offriam la nostra vita a te in pegno d amor alleluia alleluia 238',type:'N',i:270},
{n:'239',t:'SANTO, SANTO, SANTO SEI SIGNOR',c:'Santo, santo, santo santo sei Signor.   \nSanto, santo, santo santo sei Signor!  \n \nGloria al tuo Nome sulla terra,  \ngloria al tuo Nome sulla terra,  \ngloria al tuo Nome sulla terra  \nsanto sei Signor!  \n \nDegno,  degno...  \n \nGesù, Gesù...',s:'santo santo santo sei signor santo santo santo santo sei signor santo santo santo santo sei signor gloria al tuo nome sulla terra gloria al tuo nome sulla terra gloria al tuo nome sulla terra santo sei signor degno degno gesu gesu 239',type:'N',i:271},
{n:'240',t:'SANTO SPIRITO VIENI',c:'SANTO SPIRITO VIENI,  \nSANTO SPIRITO VIENI,  \nSANTO SPIRITO VIENI,  \nSANTO SPIRITO VIENI.  \n \nPurifica il mio cuore,  \npurifica le mie labbra,   \nlavami o Signore,  \nlavami o Signore. (RIT) \n  \nCammina con me,  \nillumina la mia vita,  \ncammina con me o Signore,  \ncammina con me o Signore. (RIT)',s:'santo spirito vieni santo spirito vieni santo spirito vieni santo spirito vieni santo spirito vieni purifica il mio cuore purifica le mie labbra lavami o signore lavami o signore rit cammina con me illumina la mia vita cammina con me o signore cammina con me o signore rit 240',type:'N',i:272},
{n:'241',t:'SCENDI SANTO SPIRITO',c:'Scendi Santo Spirito.  \nScendi su di noi (me)  \n \nFondi i nostri cuori, trasformali;    \nplasma le nostre vite, cambiale;  \nusa i nostri corpi, guidali;   \nriempici d\'amore, Spirito.',s:'scendi santo spirito scendi santo spirito scendi su di noi me fondi i nostri cuori trasformali plasma le nostre vite cambiale usa i nostri corpi guidali riempici d amore spirito 241',type:'N',i:273},
{n:'242',t:'SE PRENDO LE ALI',c:'SE PRENDO LE ALI DELL\'AURORA  \nPER ABITARE Al CONFINI DEL MARE   \n\nANCHE LÀ Ml GUIDA LA TUA MANO,   \nMl AFFERRA IL TUO AMORE.  \nSE PRENDO LE ALI DELL\'AURORA,  \nDOVE ANDAR LONTANO DAL TUO SPIRITO,   \nDOVE FUGGIRE DALLA TUA PRESENZA   \nSIGNORE, MIO RE.  \n \nNemmeno le tenebre per te sono scure  \ne la notte è chiara come il giorno,   \nper te le tenebre sono luce  \no mio Signor.  \n(RIT)  \n  \nSignore, tu mi scruti e mi conosci,  \ntu sai quando seggo e mi alzo,  \ntu penetri nei miei pensieri,  \no mio Signor.  \n(RIT) \n  \nAncora informe mi hanno visto i tuoi occhi  \ne tutto era già scritto di me,  \ni miei giorni eran fissati, \no mio Signor. (RIT)   \n  \nScrutami e conosci il mio cuore,  \nprova tutti i miei pensieri  \ne guidami sulla via della vita,  \no mio Signor. (RIT)',s:'se prendo le ali se prendo le ali dell aurora per abitare al confini del mare anche la ml guida la tua mano ml afferra il tuo amore se prendo le ali dell aurora dove andar lontano dal tuo spirito dove fuggire dalla tua presenza signore mio re nemmeno le tenebre per te sono scure e la notte e chiara come il giorno per te le tenebre sono luce o mio signor rit signore tu mi scruti e mi conosci tu sai quando seggo e mi alzo tu penetri nei miei pensieri o mio signor rit ancora informe mi hanno visto i tuoi occhi e tutto era gia scritto di me i miei giorni eran fissati o mio signor rit scrutami e conosci il mio cuore prova tutti i miei pensieri e guidami sulla via della vita o mio signor rit 242',type:'N',i:274},
{n:'243',t:'SEI LA STORIA DELLA VITA MIA',c:'Sei la storia della vita mia, o mio Signor.  \nSei la storia della vita mia, o mio Signore.  \nTu sei mio Signore,  \ntu sei mio Signore,   \ntu sei mio Signor,  \nper sempre sei mio Signor.  \n \nSei la forza...  \n \nSei  l\'amore...  \n \nSei il Signore...  \n \nSei la grazia ...  \n \nSei la luce...  \n \n\nSei il Padre...  \n \nSei il tesoro...',s:'sei la storia della vita mia sei la storia della vita mia o mio signor sei la storia della vita mia o mio signore tu sei mio signore tu sei mio signore tu sei mio signor per sempre sei mio signor sei la forza sei l amore sei il signore sei la grazia sei la luce sei il padre sei il tesoro 243',type:'N',i:275},
{n:'244',t:'SEI TUTTA BELLA',c:'Sei tutta bella Maria,  \nsei tutta pura Maria,  \nbenedetta più di tutte le donne,  \nuna coppa molto pura ci voleva,   \nvaso d\'amor per una tale ostia,  \ntenerezza infinita di Maria,   \nanima vergine e bambina pura,  \nla bellezza di una fonte sigillata.  \nTutti i profumi della purezza,  \nci voleva una vigna ben protetta  \nper custodir l\'Agnello senza macchia,  \nci voleva un\'anima somigliante,   \nuno specchio d\'angelica purezza,  \nl\'umiltà e la maestà.  \nMadre del Verbo e la sua sposa,  \nci voleva  un\'arca d\'alleanza    \nimmensa più di tutto il firmamento,  \nin Maria l\'infinità di Dio,  \nperché Dio con l\'uomo si fidanzi.',s:'sei tutta bella sei tutta bella maria sei tutta pura maria benedetta piu di tutte le donne una coppa molto pura ci voleva vaso d amor per una tale ostia tenerezza infinita di maria anima vergine e bambina pura la bellezza di una fonte sigillata tutti i profumi della purezza ci voleva una vigna ben protetta per custodir l agnello senza macchia ci voleva un anima somigliante uno specchio d angelica purezza l umilta e la maesta madre del verbo e la sua sposa ci voleva un arca d alleanza immensa piu di tutto il firmamento in maria l infinita di dio perche dio con l uomo si fidanzi 244',type:'N',i:276},
{n:'245',t:'SEMPRE CANTERO\'',c:'SEMPRE CANTERÒ  \nLA GRAZIA TUA O DIO,   \nOGNI TEMPO LA TUA FEDELTÀ.   \nTU HAI DETIO CHE NEI CIELI È FONDATO       \nSENZA FINE IL  TUO AMOR.  \n     \n  \nHo stretto un\'alleanza  \ncol mio eletto  \ned ho giurato a lui:  \n\"La tua casa e il tuo Trono   \nsaldi per sempre saran\". (RIT) \n  \nQuelli che ti amano, o Signore,  \ne i cieli applaudono a te.  \nChi sulle nubi ti è rivale,  \nchi è uguale a te? (RIT) \n  \nBeato il popolo che sa acclamarti:  \n\ntrova luce in te.   \nTu sei la gloria e il nostro coraggio:  \nnoi speriamo in te. (RIT)  \n  \nlo ho parlato al mio eletto  \ne lui confida in me.  \nDonerò a lui amore eterno,  \nnel mio Nome vivrà. (RIT) \n  \nLui mi invocherà:  \n\"Mio Padre, mio Dio\",  \nlo farò primogenito.  \nMai ritirerò la mia promessa,  \nma nella mia gloria verrà. (RIT)',s:'sempre cantero sempre cantero la grazia tua o dio ogni tempo la tua fedelta tu hai detio che nei cieli e fondato senza fine il tuo amor ho stretto un alleanza col mio eletto ed ho giurato a lui la tua casa e il tuo trono saldi per sempre saran rit quelli che ti amano o signore e i cieli applaudono a te chi sulle nubi ti e rivale chi e uguale a te rit beato il popolo che sa acclamarti trova luce in te tu sei la gloria e il nostro coraggio noi speriamo in te rit lo ho parlato al mio eletto e lui confida in me donero a lui amore eterno nel mio nome vivra rit lui mi invochera mio padre mio dio lo faro primogenito mai ritirero la mia promessa ma nella mia gloria verra rit 245',type:'N',i:277},
{n:'246',t:'SGUARDO AL CROCIFISSO',c:'IL TUO AMORE È COME UN BIMBO,  \nHA GLI OCCHI GRANDI PIENI DI CIELO.  \nIL TUO AMORE È COME UNA LAMPADA  \nCHE BRILLA NEL BUIO.  \n  \nUna mano piccola che racchiude la dolcezza,  \nda quel foro che ti ho fatto ne è uscita una carezza.  \n  \nUna corona in testa non ti basta per regnare,  \nun sorriso come per dire: \"Sai, le spine non mi fanno male\".  \n \nRespiri a fatica ed io per farla finita  \nho aperto il tuo costato e mi hai amato, mi hai amato.  \n  \nI piedi incrociati ancora polverosi,  \nla strada che hai fatto ormai più non ti pesa.  \n  \nEd il manto rosso come un tramonto sul mare,  \nnel prenderlo ti hanno detto per scherzo: \"Scusi Signore\".   \n\"Perché queste cose, dove sono tutti i miei amici?  \nIl male non è l\'amore\", sembra che ci dici.  \n  \nIl dolore è grande e brucia come il sole,   \nti ricordi di Nazaret del tuo focolare.  \n  \nGesù, Gesù, Gesù, è la mamma che ti chiama,   \npresto vieni a casa è tardi e si fa sera.  \n  \nMamma cara e tu caro Padre mio perdona se puoi  \n\nquello che fanno al Figlio di Dio. (RIT)',s:'sguardo al crocifisso il tuo amore e come un bimbo ha gli occhi grandi pieni di cielo il tuo amore e come una lampada che brilla nel buio una mano piccola che racchiude la dolcezza da quel foro che ti ho fatto ne e uscita una carezza una corona in testa non ti basta per regnare un sorriso come per dire sai le spine non mi fanno male respiri a fatica ed io per farla finita ho aperto il tuo costato e mi hai amato mi hai amato i piedi incrociati ancora polverosi la strada che hai fatto ormai piu non ti pesa ed il manto rosso come un tramonto sul mare nel prenderlo ti hanno detto per scherzo scusi signore perche queste cose dove sono tutti i miei amici il male non e l amore sembra che ci dici il dolore e grande e brucia come il sole ti ricordi di nazaret del tuo focolare gesu gesu gesu e la mamma che ti chiama presto vieni a casa e tardi e si fa sera mamma cara e tu caro padre mio perdona se puoi quello che fanno al figlio di dio rit 246',type:'N',i:278},
{n:'247',t:'SHEMA ISRAEL',c:'Shemà lsrael Adonai elohenu, Adonai ehad. (x2)    \nShemà lsrael Adonai elohenu, Adonai ehad.  \nShemà lsrael Adonai elohenu, Adonai ehad.',s:'shema israel shema lsrael adonai elohenu adonai ehad x2 shema lsrael adonai elohenu adonai ehad shema lsrael adonai elohenu adonai ehad 247',type:'N',i:279},
{n:'248',t:'SIA GLORIA A GESÙ',c:'SIA GLORIA A GESÙ L\'EMMANUELE,   \nRE DEI  RE E SIGNOR DEI SIGNORI!  \n  \nIn eterno loderò il tuo Nome  \ne per sempre regnerò accanto a te. (RIT) \n  \nDegno sei tu Signor di onore e di gloria   \ne fedeli noi sarem al tuo voler! (RIT) \n  \nCon i santi tuoi verrem nella tua gloria  \ne di luce eterna noi risplenderem! (RIT)',s:'sia gloria a gesu sia gloria a gesu l emmanuele re dei re e signor dei signori in eterno lodero il tuo nome e per sempre regnero accanto a te rit degno sei tu signor di onore e di gloria e fedeli noi sarem al tuo voler rit con i santi tuoi verrem nella tua gloria e di luce eterna noi risplenderem rit 248',type:'N',i:280},
{n:'249',t:'SIA GLORIA AL SIGNORE GESÙ',c:'Al Signore battiamo le mani,  \nal nostro Dio cantiamo con gioia,  \nil suo Nome è degno di lode.  \n  \nSIA GLORIA AL SIGNORE GESÙ! (x3)  \n  \nDanziamo davanti a lui,  \nesultanti cantiam la sua lode,  \ngridiamo acclamando il suo Nome. (RIT) \n  \nNoi siamo l\'armata di Dio,  \nmarciamo insieme a Gesù,   \ncombattiamo nel suo santo Nome. (RIT) \n \nSorge il Signore per noi,  \ni nemici fuggono via,  \nil Signore è un potente guerriero. (RIT) \n  \nIl maligno è stato sconfitto,  \nGesù è risorto per sempre,  \n\nla vittoria di Dio proclamiamo. (RIT)',s:'sia gloria al signore gesu al signore battiamo le mani al nostro dio cantiamo con gioia il suo nome e degno di lode sia gloria al signore gesu x3 danziamo davanti a lui esultanti cantiam la sua lode gridiamo acclamando il suo nome rit noi siamo l armata di dio marciamo insieme a gesu combattiamo nel suo santo nome rit sorge il signore per noi i nemici fuggono via il signore e un potente guerriero rit il maligno e stato sconfitto gesu e risorto per sempre la vittoria di dio proclamiamo rit 249',type:'N',i:281},
{n:'250',t:'SIA LODE ALL\'AGNELLO',c:'A colui che siede sul trono e all\'Agnello.  \nA colui che siede sul trono e all\'Agnello. \n  \nSia lode e gloria, onore e potenza per sempre.  \nSia lode e gloria, onore e potenza per sempre.   \nSia lode e gloria, onore e potenza per sempre.',s:'sia lode all agnello a colui che siede sul trono e all agnello a colui che siede sul trono e all agnello sia lode e gloria onore e potenza per sempre sia lode e gloria onore e potenza per sempre sia lode e gloria onore e potenza per sempre 250',type:'N',i:282},
{n:'251',t:'SIAMO UN SOL CORPO',c:'ANCHE SE IN MOLTI SIAMO UN SOL CORPO,  \nUN SOLO CORPO IN GESÙ.  \nANCHE SE IN MOLTI SIAMO UN SOL CORPO,  \nUN SOLO CORPO IN GESU.  \n  \nUna è la fede in Gesù,   \nsiamo uniti insieme nel suo amor;   \nuna la speranza,  \nuno è il Padre nostro Dio. (RIT)',s:'siamo un sol corpo anche se in molti siamo un sol corpo un solo corpo in gesu anche se in molti siamo un sol corpo un solo corpo in gesu una e la fede in gesu siamo uniti insieme nel suo amor una la speranza uno e il padre nostro dio rit 251',type:'N',i:283},
{n:'252',t:'SIGNORE PIETÀ',c:'Signore pietà, Signore pietà,  \ndi noi abbi pietà, di noi peccatori.  \nSignore pietà, Signore pietà.  \nPerdonaci nel tuo grande amore, Signore,  \ndaremo gloria in eterno al tuo Nome.  \nPerdonaci nel tuo grande amore, Signore,   \ndaremo gloria in eterno al tuo Nome.  \n  \nSignore pietà, Signore pietà,  \ndi noi abbi pietà, di noi peccatori.  \nSignore pietà, Signore pietà.  \nPerdonaci nel tuo grande amore, Signore,  \ndaremo gloria in eterno al tuo Nome.  \nPerdonaci nel tuo grande amore, Signore,  \ndaremo gloria in eterno al tuo Nome,  \nal tuo Nome.',s:'signore pieta signore pieta signore pieta di noi abbi pieta di noi peccatori signore pieta signore pieta perdonaci nel tuo grande amore signore daremo gloria in eterno al tuo nome perdonaci nel tuo grande amore signore daremo gloria in eterno al tuo nome signore pieta signore pieta di noi abbi pieta di noi peccatori signore pieta signore pieta perdonaci nel tuo grande amore signore daremo gloria in eterno al tuo nome perdonaci nel tuo grande amore signore daremo gloria in eterno al tuo nome al tuo nome 252',type:'N',i:284},
{n:'253',t:'SII BENEDETTA',c:'SII BENEDETTA, MADRE DI DIO, VERGINE MARIA,  \nMADRE DEL RE DI GLORIA, O MADRE DEL SALVATORE!  \n  \nL\'anima mia magnifica il Signore  \ne il mio spirito esulta in Dio mio Salvatore.  \nPerché ha guardato all\'umiltà della sua serva,  \nd\'ora in poi tutte le generazioni mi chiameranno beata.  \n  \nGrandi cose ha fatto in me l\'Onnipotente  \ne santo è il suo Nome.  \nDi generazione in generazione la sua misericordia  \nsi stende su quelli che lo temono.  \n \nHa spiegato la potenza del suo braccio,  \nha disperso i superbi nei pensieri del loro cuore.  \nHa rovesciato i potenti dai troni,  \nha innalzato gli umili.  \n  \nHa ricolmato di beni gli affamati,  \nha rimandato i ricchi a mani vuote,  \n ha soccorso Israele suo servo  \nricordandosi  della sua misericordia. \n  \nCome aveva promesso a nostri Padri ad Abramo  \ne alla sua discendenza per sempre.  \nGloria al Padre, al Figlio e allo Spirito Santo,  \ncome era nel principio ed ora e sempre e nei secoli dei secoli. Amen.',s:'sii benedetta sii benedetta madre di dio vergine maria madre del re di gloria o madre del salvatore l anima mia magnifica il signore e il mio spirito esulta in dio mio salvatore perche ha guardato all umilta della sua serva d ora in poi tutte le generazioni mi chiameranno beata grandi cose ha fatto in me l onnipotente e santo e il suo nome di generazione in generazione la sua misericordia si stende su quelli che lo temono ha spiegato la potenza del suo braccio ha disperso i superbi nei pensieri del loro cuore ha rovesciato i potenti dai troni ha innalzato gli umili ha ricolmato di beni gli affamati ha rimandato i ricchi a mani vuote ha soccorso israele suo servo ricordandosi della sua misericordia come aveva promesso a nostri padri ad abramo e alla sua discendenza per sempre gloria al padre al figlio e allo spirito santo come era nel principio ed ora e sempre e nei secoli dei secoli amen 253',type:'N',i:285},
{n:'254',t:'SII ESALTATO',c:'Grazie a te io renderò,  \no Signore fra le genti  \ncanterò lodi a te fra le nazioni.  \nPoiché grande è il tuo amor  \nesso è grande su nei cieli.  \nLa tua fedeltà, la tua fedeltà  \nfino alle nubi.  \nSii esaltato o Signor lassù nei cieli,  \nla tua gloria risplenda nel mondo inter.  \nSii esaltato o Signor lassù nei cieli,  \nla tua gloria risplenda nel mondo inter. (da  capo)  \n  \n(finale) Sii esaltato o Signor lassù nei cieli,  \nla tua gloria, la tua gloria,  \nla tua gloria risplenda nel mondo inter.',s:'sii esaltato grazie a te io rendero o signore fra le genti cantero lodi a te fra le nazioni poiche grande e il tuo amor esso e grande su nei cieli la tua fedelta la tua fedelta fino alle nubi sii esaltato o signor lassu nei cieli la tua gloria risplenda nel mondo inter sii esaltato o signor lassu nei cieli la tua gloria risplenda nel mondo inter da capo finale sii esaltato o signor lassu nei cieli la tua gloria la tua gloria la tua gloria risplenda nel mondo inter 254',type:'N',i:286},
{n:'255',t:'SII ESALTATO, SIGNORE',c:'Sii esaltato, Signore, nell\'alto dei ciel,  \nlode a te, Signor!  \nSii esaltato, per sempre innalzato  \nil tuo santo Nom.  \n  \nTu sei Signor, per sempre regnerai.  \nLa terra e il ciel gioiscano nel tuo Nome.   \nSii esaltato, Signore, tu sei nostro Re!',s:'sii esaltato signore sii esaltato signore nell alto dei ciel lode a te signor sii esaltato per sempre innalzato il tuo santo nom tu sei signor per sempre regnerai la terra e il ciel gioiscano nel tuo nome sii esaltato signore tu sei nostro re 255',type:'N',i:287},
{n:'256',t:'SO CHE TU SEI IL MIO SIGNOR',c:'Il volto tuo risplende in me,  \nso che tu sei il mio Signor.  \nMi illumini, mi liberi,  \nso che tu sei il mio Signor.  \n  \nSE INTORNO A ME VEDRÒ  \nCHE TUTTO CROLLA, IO STARÒ  \nFRA LE TUE MANI NEL TUO AMOR,  \nSO CHE TU SEI IL MIO SIGNOR. (x2)  \n  \nMia forza sei, mia gioia o Dio,  \nso che tu sei il mio Signor.  \nMi salverai, confido in te,  \nso che tu sei il mio Signor. (RIT) (x3) \n \n(coda)  \n  \nFRA LE TUE MANI IO STARÒ,  \nSO CHE TU SEI IL MIO SIGNOR. (x2)',s:'so che tu sei il mio signor il volto tuo risplende in me so che tu sei il mio signor mi illumini mi liberi so che tu sei il mio signor se intorno a me vedro che tutto crolla io staro fra le tue mani nel tuo amor so che tu sei il mio signor x2 mia forza sei mia gioia o dio so che tu sei il mio signor mi salverai confido in te so che tu sei il mio signor rit x3 coda fra le tue mani io staro so che tu sei il mio signor x2 256',type:'N',i:288},
{n:'257',t:'SOLO IN DIO',c:'SOLO IN DIO  \nRIPOSA L\'ANIMA MIA,  \nDA LUI LA MIA SPERANZA.  \n  \nLui solo è mia rupe  \ne mia salvezza.  \nMia roccia di difesa,  \nnon potrò vacillare. (RIT)  \n\n  \nIn Dio è la mia salvezza  \ne la mia gloria.   \nIl mio saldo rifugio,  \nla mia difesa. (RIT) \n  \nConfida sempre in lui  \no popolo.  \nDavanti a lui effondi  \nil tuo cuore.  (RIT) \n  \nPoiché il potere  \nappartiene a Dio.  \nTua Signore  \nè la grazia.  (RIT)',s:'solo in dio solo in dio riposa l anima mia da lui la mia speranza lui solo e mia rupe e mia salvezza mia roccia di difesa non potro vacillare rit in dio e la mia salvezza e la mia gloria il mio saldo rifugio la mia difesa rit confida sempre in lui o popolo davanti a lui effondi il tuo cuore rit poiche il potere appartiene a dio tua signore e la grazia rit 257',type:'N',i:289},
{n:'258',t:'SOLO NEL SIGNORE',c:'SOLO NEL SIGNORE VITTORIA E POTENZA!  \nEGLI È IL NOSTRO DIO,  \nNON VE NE SONO ALTRI.  \nSOLO NEL SIGNORE GIUSTIZIA E SALVEZZA,  \nFUORI DI LUI NON C\'È ALTRO DIO.  \n  \nRadunatevi e venite,  \naccostatevi a lui  \nvoi popoli dispersi,  \nsuperstiti delle nazioni! (RIT) \n  \nNon sono forse io, il Signore?  \nDio giusto e salvatore.  \nAscoltate la mia voce  \ne sarete consolati.  (RIT) \n  \nSOLO NEL SIGNORE GIUSTIZIA E SALVEZZA!  \nFUORI DI LUI NON C\'È ALTRO DIO.  \n  \nGuardate a me e sarete salvi,  \npaesi tutti della terra,  \nperché io sono il vostro Dio   \ne non ve ne sono altri. (RIT) \n \n(coda facoltativa) \n  \n  \nSOLO NEL SIGNORE VITTORIA E POTENZA!  \n\nEGLI È IL NOSTRO DIO,  \nNON VE NE SONO ALTRI.  \nSOLO NEL SIGNORE GIUSTIZIA E SALVEZZA,  \nFUORI DI LUI NON C\'È ALTRO DIO.  \n  \nSOLO NEL SIGNORE VITIORIA E POTENZA!  \nEGLI È IL NOSTRO DIO,  \nNON VE NE SONO ALTRI.  \nSOLO NEL SIGNORE GIUSTIZIA E SALVEZZA,  \nFUORI DI LUI NON C\'È ALTRO DIO. (x3)',s:'solo nel signore solo nel signore vittoria e potenza egli e il nostro dio non ve ne sono altri solo nel signore giustizia e salvezza fuori di lui non c e altro dio radunatevi e venite accostatevi a lui voi popoli dispersi superstiti delle nazioni rit non sono forse io il signore dio giusto e salvatore ascoltate la mia voce e sarete consolati rit solo nel signore giustizia e salvezza fuori di lui non c e altro dio guardate a me e sarete salvi paesi tutti della terra perche io sono il vostro dio e non ve ne sono altri rit coda facoltativa solo nel signore vittoria e potenza egli e il nostro dio non ve ne sono altri solo nel signore giustizia e salvezza fuori di lui non c e altro dio solo nel signore vitioria e potenza egli e il nostro dio non ve ne sono altri solo nel signore giustizia e salvezza fuori di lui non c e altro dio x3 258',type:'N',i:290},
{n:'259',t:'SONO CON VOI',c:'SONO CON VOI, \nDICE IL SIGNOR,  \nPER TUTTI I GIORNI IO RESTERÒ.  \nE NON TEMETE,  \nSONO CON VOI,  \nMAI DA SOLI VI LASCERÒ.  \n  \nCome seme che muore  \nmi sono offerto al mondo,  \nperché sul trono della croce  \nho vinto la morte. (RIT) \n  \nChi vive in me ed io in lui  \nfa molto frutto,  \nperché senza di me  \nnon potete far nulla. (RIT) \n  \nCieli e terra passeranno  \nma non le mie parole,  \nquesto ho detto, perché in voi  \nla gioia sia piena. (RIT)',s:'sono con voi sono con voi dice il signor per tutti i giorni io restero e non temete sono con voi mai da soli vi lascero come seme che muore mi sono offerto al mondo perche sul trono della croce ho vinto la morte rit chi vive in me ed io in lui fa molto frutto perche senza di me non potete far nulla rit cieli e terra passeranno ma non le mie parole questo ho detto perche in voi la gioia sia piena rit 259',type:'N',i:291},
{n:'260',t:'SONO IL SIGNOR CHE TI GUARISCE',c:'Sono il tuo Dio,  \nil tuo Signor,  \ncolui che ti  guarisce.  \nLa mia Parola ti sanerà,  \nsono il Signor che ti guarisce.  \n  \nTu sei il mio Dio,  \nil mio Signor,  \n\ncolui che mi guarisce.  \nLa tua Parola mi sanerà,  \ntu sei il Signor che mi guarisce.',s:'sono il signor che ti guarisce sono il tuo dio il tuo signor colui che ti guarisce la mia parola ti sanera sono il signor che ti guarisce tu sei il mio dio il mio signor colui che mi guarisce la tua parola mi sanera tu sei il signor che mi guarisce 260',type:'N',i:292},
{n:'261',t:'SORGA DIO (Salmo 68)',c:'SORGA DIO SUI SUOI NEMICI,  \nPRESTO SCONFITTI SARAN.  \nSI RALLEGRINO I GIUSTI IN LUI,  \nDI GIOIA CANTERAN.  \n  \n  \nCantate a Dio al suo Nome,   \ngioite davanti a lui,  \n\"Signore\" è il suo Nome,  \nsulle nubi la sua fedeltà. (RIT)  \n  \nBenedetto il Signore per sempre,  \nha cura di noi il Salvator,  \nè il nostro Dio che ci salva,  \ndalla morte ci libererà. (RIT)  \n  \nDispiega la tua potenza,  \nnessuno è pari a te,  \ncantate inni al Signore,  \nsu Israele la sua maestà. (RIT)',s:'sorga dio salmo 68 sorga dio sui suoi nemici presto sconfitti saran si rallegrino i giusti in lui di gioia canteran cantate a dio al suo nome gioite davanti a lui signore e il suo nome sulle nubi la sua fedelta rit benedetto il signore per sempre ha cura di noi il salvator e il nostro dio che ci salva dalla morte ci liberera rit dispiega la tua potenza nessuno e pari a te cantate inni al signore su israele la sua maesta rit 261',type:'N',i:293},
{n:'262',t:'SORGI  GERUSALEMME',c:'SORGI,GERUSALEMME,  \nGRIDA AL TUO DIO, TI LIBERERÀ.  \nSORGI,GERUSALEMME,  \nCHI TI HA DATO UN NOME TI CONSOLERÀ.  \n  \nDeponi, o Gerusalemme,  \nla veste dell\'afflizione,   \nrivestiti dello splendore,  \ngloria che viene da Dio. (RIT) \n  \nMetti sul capo il diadema,  \ne il manto della giustizia,  \nDio mostrerà il tuo splendore,  \nla gloria del Salvatore. (RIT) \n  \nLa gloria viene dal Santo,  \nl\'Eterno, il Salvatore.  \n\nSarai chiamata per sempre  \npace della giustizia. (RIT) \n \n(oppure coda facoltativa) \n  \n  \nSORGI,GERUSALEMME,  \nGRIDA AL TUO DIO, TI LIBERERÀ.  \nSORGI,GERUSALEMME,  \nCHI TI HA DATO UN NOME TI CONSOLERÀ. OH \n \n \nOH  \nSORGI,GERUSALEMME,  \n SI GRIDA AL TUO DIO,TI LIBERERÀ.  \n SORGI,GERUSALEMME,  \n CHI TI HA DATO UN NOME TI CONSOLERÀ.  \n  \nOH \nSORGI,GERUSALEMME,  \nCHI TI HA DATO UN NOME TI CONSOLERÀ.   \nGERUSALEM!',s:'sorgi gerusalemme sorgi gerusalemme grida al tuo dio ti liberera sorgi gerusalemme chi ti ha dato un nome ti consolera deponi o gerusalemme la veste dell afflizione rivestiti dello splendore gloria che viene da dio rit metti sul capo il diadema e il manto della giustizia dio mostrera il tuo splendore la gloria del salvatore rit la gloria viene dal santo l eterno il salvatore sarai chiamata per sempre pace della giustizia rit oppure coda facoltativa sorgi gerusalemme grida al tuo dio ti liberera sorgi gerusalemme chi ti ha dato un nome ti consolera oh oh sorgi gerusalemme si grida al tuo dio ti liberera sorgi gerusalemme chi ti ha dato un nome ti consolera oh sorgi gerusalemme chi ti ha dato un nome ti consolera gerusalem 262',type:'N',i:294},
{n:'263',t:'SORGI RISPLENDI',c:'Le tenebre coprono tutta la terra,  \nl\'oscurità si stende sui popoli.  \nMa su te si leva l\'Eterno e  \nla sua gloria appare su di te.  \n  \n  \nO SORGI E RISPLENDI, LA TUA LUCE È VENUTA  \nE LA GLORIA DEL SIGNORE SI È LEVATA.  \nO SORGI E RISPLENDI, LA TUA LUCE È VENUTA   \nE LA GLORIA DEL SIGNORE È SU DI TE.  \n  \nLe nazioni cammineranno alla tua luce  \ne i re allo splendore dell\'aurora.  \nE ti chiameranno la \"Città del Signore\",  \nla Sion del Santo d\'Israele. (RIT) \n  \nAlza gli occhi e guardati intorno,  \ns\'adunano e vengon tutti a te.  \nI tuoi figli giungono da lontano,  \nle tue figlie saran portate a te. (RIT) \n  \nAllora guarderai e sarai raggiante,  \n\nil tuo cuore si colmerà di gioia.  \nIl tesoro del mare si volgerà a te,  \nle ricchezze delle genti saran tue. (RIT)  \n  \nIl sole non tramonterà più,  \nla tua luna non calerà mai.  \nIl sole sarà la tua luce per sempre  \ne i giorni del tuo duolo finiranno. (RIT)',s:'sorgi risplendi le tenebre coprono tutta la terra l oscurita si stende sui popoli ma su te si leva l eterno e la sua gloria appare su di te o sorgi e risplendi la tua luce e venuta e la gloria del signore si e levata o sorgi e risplendi la tua luce e venuta e la gloria del signore e su di te le nazioni cammineranno alla tua luce e i re allo splendore dell aurora e ti chiameranno la citta del signore la sion del santo d israele rit alza gli occhi e guardati intorno s adunano e vengon tutti a te i tuoi figli giungono da lontano le tue figlie saran portate a te rit allora guarderai e sarai raggiante il tuo cuore si colmera di gioia il tesoro del mare si volgera a te le ricchezze delle genti saran tue rit il sole non tramontera piu la tua luna non calera mai il sole sara la tua luce per sempre e i giorni del tuo duolo finiranno rit 263',type:'N',i:295},
{n:'264',t:'SORGI, SALVAMI MIO DIO',c:'SORGI, SALVAMI MIO DIO  \nSORGI E SALVAMI,  \nSORGI, SALVAMI MIO DIO. ALLELUIA.  \n  \nAlzo gli occhi e guardo verso le montagne:  \nda dove mi verrà il soccorso?  \nIl soccorso viene dal Signore  \nche ha creato il cielo, il mare e la terra. (RIT)  \n \nNell\'angoscia ho gridato al Signore  \ne il Signore mi ha risposto e mi ha salvato.  \nIl Signore è con me non ho timore  \nil Signore è con me, è mio aiuto. (RIT)  \n  \nCelebrate il Signore perché è buono   \nperché eterna è la sua misericordia.   \nMia forza e mio canto è il Signore,  \negli è stato la mia salvezza. (RIT) \n \nApritemi le porte di giustizia  \nvoglio entrarvi a render grazie al Signor.  \nTi rendo grazie perché mi hai esaudito  \nperché sei stato tu la mia salvezza. (RIT)',s:'sorgi salvami mio dio sorgi salvami mio dio sorgi e salvami sorgi salvami mio dio alleluia alzo gli occhi e guardo verso le montagne da dove mi verra il soccorso il soccorso viene dal signore che ha creato il cielo il mare e la terra rit nell angoscia ho gridato al signore e il signore mi ha risposto e mi ha salvato il signore e con me non ho timore il signore e con me e mio aiuto rit celebrate il signore perche e buono perche eterna e la sua misericordia mia forza e mio canto e il signore egli e stato la mia salvezza rit apritemi le porte di giustizia voglio entrarvi a render grazie al signor ti rendo grazie perche mi hai esaudito perche sei stato tu la mia salvezza rit 264',type:'N',i:296},
{n:'265',t:'SOTTO L\'OMBRA',c:'Sotto l\'ombra delle ali tue   \nviviam  sicuri.  \nAlla tua presenza noi darem \ngloria, gloria, gloria a te o Re.  \n  \nIn te dimoriamo in armonia  \ne t\'adoriamo.  \nVoci unite insieme per cantar:  \n\ndegno, degno, degno sei Signor.  \n  \nCuore a cuore uniti nel tuo amor \nsiam puri agli occhi tuoi.  \nCome una colomba ci leviam.  \nSanto, santo, santo sei Signor.',s:'sotto l ombra sotto l ombra delle ali tue viviam sicuri alla tua presenza noi darem gloria gloria gloria a te o re in te dimoriamo in armonia e t adoriamo voci unite insieme per cantar degno degno degno sei signor cuore a cuore uniti nel tuo amor siam puri agli occhi tuoi come una colomba ci leviam santo santo santo sei signor 265',type:'N',i:297},
{n:'266',t:'SPEZZIAMO IL PANE',c:'Spezziamo il pane,  \nmangiamo il corpo di Gesù. (x2)  \n \nANCHE SE IN MOLTI,  \nSIAMO UN SOL CORPO,  \nPERCHÉ INSIEME NOI  \nMANGIAMO UN SOLO PANE. (x2) \n \n...MANGIAMO UN SOLO PANE.   \n \nPrendiamo il vino,  \nbeviamo il sangue di Gesù. (x2) (RIT)',s:'spezziamo il pane spezziamo il pane mangiamo il corpo di gesu x2 anche se in molti siamo un sol corpo perche insieme noi mangiamo un solo pane x2 mangiamo un solo pane prendiamo il vino beviamo il sangue di gesu x2 rit 266',type:'N',i:298},
{n:'267',t:'SPIRITO D\'AMORE',c:'SPIRITO D\'AMORE FAMMI VIBRAR  \nCOME LE CORDE DELL\'ARPA DI DAVID.  \nSPIRITO SANTO SUONACI INSIEME  \nCOME LE CORDE DELL\'ARPA,  \nLE CORDE DELL\'ARPA,  \nLE CORDE DELL\'ARPA DI DAVID. \n  \nSpirito d\'amore scendi su di me  \ncome la musica nel cuore di David.  \nSpirito Santo dimora in noi   \ncome  la musica nel cuore,  \nla musica nel cuore,  \nla musica nel cuore di David.  \n  \nSpirito d\'amore fammi amar  \ncome il Figlio dei figli di David.  \nSpirito Santo guidaci tu  \nfino al Figlio dei figli,  \nal Figlio dei figli,  \nal Figlio dei figli di David.',s:'spirito d amore spirito d amore fammi vibrar come le corde dell arpa di david spirito santo suonaci insieme come le corde dell arpa le corde dell arpa le corde dell arpa di david spirito d amore scendi su di me come la musica nel cuore di david spirito santo dimora in noi come la musica nel cuore la musica nel cuore la musica nel cuore di david spirito d amore fammi amar come il figlio dei figli di david spirito santo guidaci tu fino al figlio dei figli al figlio dei figli al figlio dei figli di david 267',type:'N',i:299},
{n:'268',t:'SPIRITO DEL DIO VIVENTE',c:'Spirito del Dio vivente   \naccresci in noi l\'amore.  \nPace, gioia, forza  \nnella tua dolce presenza. (x2)   \n \nFonte d\'acqua viva purifica i cuori,    \nsole della vita ravviva la tua fiamma. (x2)',s:'spirito del dio vivente spirito del dio vivente accresci in noi l amore pace gioia forza nella tua dolce presenza x2 fonte d acqua viva purifica i cuori sole della vita ravviva la tua fiamma x2 268',type:'N',i:300},
{n:'269',t:'SPIRITO DI SANTITÀ',c:'SPIRITO DI SANTITÀ,  \nSPIRITO DI LUCE,  \nSPIRITO DI FUOCO,  \nSCENDI SU DI NOI.  \n  \nSpirito del Padre,  \ntu sei la luce \nmanda a noi dal ciel  \nlo splendore di gloria. (RIT)  \n  \nUnzione celeste,  \nfonte di vita,  \nrinfranca i cuori  \ne guarisci i corpi. (RIT)  \n  \nTestimone verace,  \ntu ci mandi nel mondo  \na proclamare  \nche Cristo è risorto. (RIT)   \n  \nSpirito d\'esultanza,  \ngioia della Chiesa  .  \nfai scaturire dal cuore  \nil canto dell\'Agnello. (RIT)  \n \nFacci conoscere  \nl\'amore del Padre  \ne rivelaci il volto  \ndi Cristo Gesù. (RIT)  \n \nFuoco che illumini,  \nsoffio di vita  \ntu rendi gloriosa  \n\nla croce del Signor. (RIT)',s:'spirito di santita spirito di santita spirito di luce spirito di fuoco scendi su di noi spirito del padre tu sei la luce manda a noi dal ciel lo splendore di gloria rit unzione celeste fonte di vita rinfranca i cuori e guarisci i corpi rit testimone verace tu ci mandi nel mondo a proclamare che cristo e risorto rit spirito d esultanza gioia della chiesa fai scaturire dal cuore il canto dell agnello rit facci conoscere l amore del padre e rivelaci il volto di cristo gesu rit fuoco che illumini soffio di vita tu rendi gloriosa la croce del signor rit 269',type:'N',i:301},
{n:'270',t:'SPIRITO SANTO',c:'Spirito Santo scendi su di me,  \nvieni mio consolator,  \nprendi il mio cuor,  \nponi custodia alla mia bocca,   \nalla  porta delle mie labbra,  \nche lodino te, lodino te Signor.  \n  \nI miei occhi son rivolti a te,  \nin te mi rifugerò Signore,  \nproteggi la mia vita,   \nfammi sentire la tua grazia  \npoiché confido in te,  \no Signore, mio Signore.  \n  \nInsegnami la tua volontà,  \ntu che sei il mio Dio,  \nil tuo Spirito mi guidi nella vita.  \nPer il tuo Nome vivere io voglio,  \nsono il tuo servo, il tuo servo.  \n  \nPer il tuo Nome vivere io voglio,  \nsono il tuo servo, il tuo servo.',s:'spirito santo spirito santo scendi su di me vieni mio consolator prendi il mio cuor poni custodia alla mia bocca alla porta delle mie labbra che lodino te lodino te signor i miei occhi son rivolti a te in te mi rifugero signore proteggi la mia vita fammi sentire la tua grazia poiche confido in te o signore mio signore insegnami la tua volonta tu che sei il mio dio il tuo spirito mi guidi nella vita per il tuo nome vivere io voglio sono il tuo servo il tuo servo per il tuo nome vivere io voglio sono il tuo servo il tuo servo 270',type:'N',i:302},
{n:'271',t:'SPIRITO SANTO DAI LUCE',c:'Spirito Santo scendi su di me,   \ninfiamma il mio cuore,  \ndai luce alla mia mente.  \nTu sei speranza, tu sei la vita.  \nO consolatore, riempimi di te.  \n  \nSpirito Santo scendi su di noi,  \ninfiamma i nostri cuori,  \ndai luce alle menti.  \nTu sei speranza, tu sei la vita.  \nO consolatore, riempici di te.  \n \nSpirito Santo scendi su di noi,  \ninfiamma i nostri cuori,   \ndai luce alle menti.  \nTu sei speranza,  \n\ntu sei la vita.  \nO consolatore, riempici di te. (x2)',s:'spirito santo dai luce spirito santo scendi su di me infiamma il mio cuore dai luce alla mia mente tu sei speranza tu sei la vita o consolatore riempimi di te spirito santo scendi su di noi infiamma i nostri cuori dai luce alle menti tu sei speranza tu sei la vita o consolatore riempici di te spirito santo scendi su di noi infiamma i nostri cuori dai luce alle menti tu sei speranza tu sei la vita o consolatore riempici di te x2 271',type:'N',i:303},
{n:'272',t:'STABAT MATER',c:'Mi si è buttata lì davanti nella via,  \nera quella donna che tutti chiamano Maria,  \naveva con sé il freddo di un corpo senza vita,  \nsu quel monte per una croce era venuta.  \n  \nDa parte a parte l\'aveva trapassata,  \nsenza pietà, senza un lamento era caduta,  \nchinò il capo e una parola le uscì di bocca:  \n\"Ora sei tu, il figlio mio Gesù\".  \n  \nSul suo viso c\'era terra e pianto  \nma dal suo petto stava nascendo un canto,  \nun Dio sulla croce era morto per amore  \ne per amore una madre muore.  \n  \nMi parla di un angelo e del vecchio Simeone,   \nnemmeno a Giuseppe questo lo aveva mai detto,   \naveva un segreto che teneva stretto stretto  \nche una spada le avrebbe passato il petto.  \n  \nCome giocava, come rideva, com\'era  bello   \nun figlio maschio troppo presto strappato,   \ndiceva che aveva la sua voce, il suo sorriso,   \nma un lenzuolo stringeva intriso.  \n \n(muto)  \n \n\"Ora sei tu, il figlio mio, Gesù\".',s:'stabat mater mi si e buttata li davanti nella via era quella donna che tutti chiamano maria aveva con se il freddo di un corpo senza vita su quel monte per una croce era venuta da parte a parte l aveva trapassata senza pieta senza un lamento era caduta chino il capo e una parola le usci di bocca ora sei tu il figlio mio gesu sul suo viso c era terra e pianto ma dal suo petto stava nascendo un canto un dio sulla croce era morto per amore e per amore una madre muore mi parla di un angelo e del vecchio simeone nemmeno a giuseppe questo lo aveva mai detto aveva un segreto che teneva stretto stretto che una spada le avrebbe passato il petto come giocava come rideva com era bello un figlio maschio troppo presto strappato diceva che aveva la sua voce il suo sorriso ma un lenzuolo stringeva intriso muto ora sei tu il figlio mio gesu 272',type:'N',i:304},
{n:'273',t:'STIRPE ELETTA',c:'Stirpe eletta,  \ngente santa,  \no regale sacerdozio  \nvieni, adora il Signore,  \nil glorioso Redentore.',s:'stirpe eletta stirpe eletta gente santa o regale sacerdozio vieni adora il signore il glorioso redentore 273',type:'N',i:305},
{n:'274',t:'SU LODIAMO IL SIGNOR',c:'SU LODIAMO IL SIGNOR,  \n\nSU LODIAMO IL SIGNOR  \nDALL\'INTIMO DEL CUORE,  \nSU LODIAMO IL SIGNOR!  \n \nProclamiamo il Signor ...  \n \nAdoriamo il Signor ...  \n \nGloria e onore al Signor ...  \n \nAlleluia ...',s:'su lodiamo il signor su lodiamo il signor su lodiamo il signor dall intimo del cuore su lodiamo il signor proclamiamo il signor adoriamo il signor gloria e onore al signor alleluia 274',type:'N',i:306},
