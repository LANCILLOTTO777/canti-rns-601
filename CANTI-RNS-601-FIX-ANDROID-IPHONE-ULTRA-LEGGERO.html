{n:'337',t:'NOZZE A CANA',c:'DANZANO CON GIOIA LE FIGLIE D\'ISRAELE,  \nLE NOZZE SONO PRONTE PER IL FIGLIO DEL RE.  \nALLELUIA, ALLELUIA PER IL FIGLIO DEL RE,  \nALLELUIA, ALLELUIA PER IL FIGLIO DEL RE.  \n  \nA Cana in Galilea nel nome del Signore  \ngli sposi han giurato amore e fedeltà.  \nCoi cembali e coi flauti le danze fan corona,  \nil vino sulla mensa il cuor rallegrerà. (RIT) \n  \nNel mezzo della festa il vino viene meno,   \nnon hanno più la gioia, la danza finirà.   \nLa Madre dice ai servi: «Udite la Parola   \nche il Figlio mio vi dona, lui vi disseterà». (RIT)  \n\n  \nSi arrossano le coppe di vino nuovo colme,  \nè il dono dello Sposo per nuova fedeltà.   \nDanziamo allor fratelli: del Re noi siamo figli,   \na lui cantiamo lodi per sempre, alleluia! (RIT)',s:'nozze a cana danzano con gioia le figlie d israele le nozze sono pronte per il figlio del re alleluia alleluia per il figlio del re alleluia alleluia per il figlio del re a cana in galilea nel nome del signore gli sposi han giurato amore e fedelta coi cembali e coi flauti le danze fan corona il vino sulla mensa il cuor rallegrera rit nel mezzo della festa il vino viene meno non hanno piu la gioia la danza finira la madre dice ai servi udite la parola che il figlio mio vi dona lui vi dissetera rit si arrossano le coppe di vino nuovo colme e il dono dello sposo per nuova fedelta danziamo allor fratelli del re noi siamo figli a lui cantiamo lodi per sempre alleluia rit 337',type:'N',i:369},
{n:'338',t:'ORA I MIEI OCCHI TI VEDONO',c:'Sento in me la tua presenza,  \nil tuo grande amore che mi consola,  \nil male più non mi colpirà,  \nadesso che tu vivi in me.  \n \nORA I MIEI OCCHI TI VEDONO   \nE LA MIA BOCCA PROCLAMA  \nCHE TU SEI IL SIGNORE, IL SALVATORE.  \nORA I MIEI OCCHI TI VEDONO   \nE LA MIA BOCCA INNALZA  \nUN CANTO DI LODE A TE  \nCHE SEI IL MIO RE,  \nIL MIO SIGNORE.  \n  \nSento in me la tua presenza,  \nla tua immensa grazia che mi dà forza.  \nSui tuoi sentieri camminerò,  \nadesso che tu vivi in me. (RIT)',s:'ora i miei occhi ti vedono sento in me la tua presenza il tuo grande amore che mi consola il male piu non mi colpira adesso che tu vivi in me ora i miei occhi ti vedono e la mia bocca proclama che tu sei il signore il salvatore ora i miei occhi ti vedono e la mia bocca innalza un canto di lode a te che sei il mio re il mio signore sento in me la tua presenza la tua immensa grazia che mi da forza sui tuoi sentieri camminero adesso che tu vivi in me rit 338',type:'N',i:370},
{n:'339',t:'QUESTO È IL GIORNO FATTO DAL SIGNORE',c:'Questo è il giorno fatto dal Signore, rallegriamoci in lui. \nCristo ha vinto la morte per sempre, rallegriamoci in lui. \n   \nQUESTO È IL GIORNO FATTO DAL SIGNORE,  \nRALLEGRIAMOCI IN LUI.  \nCRISTO HA VINTO LA MORTE PER SEMPRE,  \nRALLEGRIAMOCI IN LUI.   \nQUESTO È IL GIORNO FATTO DAL SIGNORE,  \nRALLEGRIAMOCI IN LUI.  \nCRISTO HA VINTO LA MORTE PER SEMPRE,  \nRALLEGRIAMOCI IN LUI.  \n  \nSfolgora il sole di Pasqua,  \nrisuona il cielo di canti,  \nesulta di gioia la terra:  \ndagli abissi della morte  \nascende il Signore Gesù. (RIT) \n\n  \nCristo, Signore immortale,  \nunisci alla tua vittoria  \ni figli rinati alla vita,  \nirradia oggi sulla Chiesa  \nla tua luce, Signor. (RIT) \n  \nSia gloria e onore a Cristo,  \nal Padre e allo Spirito Santo,   \nora e nei secoli eterni,  \nnella Chiesa proclamiamo  \nla vittoria di Dio. (RIT)',s:'questo e il giorno fatto dal signore questo e il giorno fatto dal signore rallegriamoci in lui cristo ha vinto la morte per sempre rallegriamoci in lui questo e il giorno fatto dal signore rallegriamoci in lui cristo ha vinto la morte per sempre rallegriamoci in lui questo e il giorno fatto dal signore rallegriamoci in lui cristo ha vinto la morte per sempre rallegriamoci in lui sfolgora il sole di pasqua risuona il cielo di canti esulta di gioia la terra dagli abissi della morte ascende il signore gesu rit cristo signore immortale unisci alla tua vittoria i figli rinati alla vita irradia oggi sulla chiesa la tua luce signor rit sia gloria e onore a cristo al padre e allo spirito santo ora e nei secoli eterni nella chiesa proclamiamo la vittoria di dio rit 339',type:'N',i:371},
{n:'340',t:'ROCCIA DI FEDELTA\'',c:'Hai ascoltato, o Dio,  \nil grido di chi soffre e spera,   \nfonte di ogni bene,  \nhai liberato il cuore.   \nTu l\'acqua viva sei    \nquando il deserto è intorno a noi,  \nsempre noi loderemo il tuo Nome.  \n  \nGRANDE SEI TU,SIGNOR,  \nROCCIA DI FEDELTÀ,  \nTU SEI CON NOI, \nNON Cl ABBANDONI MAI.  \nALL\'OMBRA DEL TUO AMOR  \nSU QUESTA TERRA CAMMINIAM   \nFORTI CON TE,  \nVERSO L\'ETERNITÀ,  \nROCCIA DI FEDELTÀ.  \n  \nHai riscattato, o Dio,  \nla vita di chi in te confida,   \ndifesa da ogni male,  \ntu sciogli le catene.  \nNella tempesta sei  \nla mano che ci salverà,  \nsempre noi loderemo  \nil tuo Nome. (RIT) \n \n(coda facoltativa) \n  \nGRANDE SEI TU,SIGNOR, ROCCIA DI FEDELTÀ,  \nGRANDE SEI TU SIGNOR, TU SEI CON NOI, ROCCIA DI FEDELTÀ,   \n\nROCCIA DI FEDELTÀ, ROCCIA DI FEDELTÀ.  \nGRANDE SEI TU,SIGNOR, TU SEI CON NOI, ROCCIA DI FEDELTÀ.  \nALL\'OMBRA DEL TUO AMOR  \nSU QUESTA TERRA CAMMINIAM  \nFORTI CON TE, VERSO L\'ETERNITÀ,  \n \nROCCIA DI FEDELTÀ.',s:'roccia di fedelta hai ascoltato o dio il grido di chi soffre e spera fonte di ogni bene hai liberato il cuore tu l acqua viva sei quando il deserto e intorno a noi sempre noi loderemo il tuo nome grande sei tu signor roccia di fedelta tu sei con noi non cl abbandoni mai all ombra del tuo amor su questa terra camminiam forti con te verso l eternita roccia di fedelta hai riscattato o dio la vita di chi in te confida difesa da ogni male tu sciogli le catene nella tempesta sei la mano che ci salvera sempre noi loderemo il tuo nome rit coda facoltativa grande sei tu signor roccia di fedelta grande sei tu signor tu sei con noi roccia di fedelta roccia di fedelta roccia di fedelta grande sei tu signor tu sei con noi roccia di fedelta all ombra del tuo amor su questa terra camminiam forti con te verso l eternita roccia di fedelta 340',type:'N',i:372},
{n:'341',t:'SANTO SPIRITO',c:'Spirito d\'amore, vieni in noi,  \nSpirito consolatore, vieni in noi,   \nSpirito di preghiera, vieni in noi,  \nSpirito di adorazione, vieni in noi.  \n  \nSANTO SPIRITO, VIENI IN NOI,  \nSANTO SPIRITO, VIENI IN NOI, VIENI IN NOI.  \n  \nSpirito di potenza, vieni in noi,  \nSpirito liberatore, vieni in noi. (RIT)',s:'santo spirito spirito d amore vieni in noi spirito consolatore vieni in noi spirito di preghiera vieni in noi spirito di adorazione vieni in noi santo spirito vieni in noi santo spirito vieni in noi vieni in noi spirito di potenza vieni in noi spirito liberatore vieni in noi rit 341',type:'N',i:373},
{n:'342',t:'VIA, VERITA\' E VITA',c:'GESÙ MIO SIGNORE, GESÙ MIO SALVATORE,  \nVIA, VERITÀ, VITA SEI PER ME,  \nTU GIOIA DEL MIO CUORE, TU FONTE DELL\'AMORE.  \nIO TI ADORO MIO RE, IN ETERNO GLORIA A TE.  \n  \nA te veniamo per la via dell\'amore,  \nalla tua mensa al convito nuziale.   \nCristo sei cibo, pane di vita,  \nsalvezza eterna per I\'umanità. (RIT) \n  \nLa tua Parola guida i passi al cammino,  \nfuoco che arde nell\'oscurità.  \nFonte di grazia, sapienza e forza,  \nrivelazione della verità. (RIT) \n  \nSulla tua croce ci hai donato la vita,  \nsu quest\'altare ci doni l\'Amore.  \nManda il tuo Spirito consolatore,  \nvincolo santo di eterna unità. (RIT)',s:'via verita e vita gesu mio signore gesu mio salvatore via verita vita sei per me tu gioia del mio cuore tu fonte dell amore io ti adoro mio re in eterno gloria a te a te veniamo per la via dell amore alla tua mensa al convito nuziale cristo sei cibo pane di vita salvezza eterna per i umanita rit la tua parola guida i passi al cammino fuoco che arde nell oscurita fonte di grazia sapienza e forza rivelazione della verita rit sulla tua croce ci hai donato la vita su quest altare ci doni l amore manda il tuo spirito consolatore vincolo santo di eterna unita rit 342',type:'N',i:374},
{n:'343',t:'ADORO TE',c:'Sei qui davanti a me, o mio Signore,  \nsei in questa brezza che ristora il cuore.  \nRoveto che mai si consumerà,   \npresenza che riempie l\'anima.  \n  \nADORO TE, FONTE DELLA VITA,   \nADORO TE, TRINITÀ INFINITA.  \nI MIEI CALZARI LEVERÒ  \nSU QUESTO SANTO SUOLO,   \nALLA PRESENZA TUA MI PROSTRERO.  \n  \nSei qui davanti a me, o mio Signore,   \nnella tua grazia trovo la mia gioia.  \nIo lodo, ringrazio e prego perché  \nil mondo ritorni a vivere in te. (RIT)  \n \nMIO  SIGNOR.  \n \n(coda facoltativa) \n \nO SIGNOR,  OH   \nI MIEI CALZARI LEVERÒ  \nSU QUESTO SANTO SUOLO,   \nALLA PRESENZA TUA MI PROSTRERÒ,  \nMIO SIGNOR.',s:'adoro te sei qui davanti a me o mio signore sei in questa brezza che ristora il cuore roveto che mai si consumera presenza che riempie l anima adoro te fonte della vita adoro te trinita infinita i miei calzari levero su questo santo suolo alla presenza tua mi prostrero sei qui davanti a me o mio signore nella tua grazia trovo la mia gioia io lodo ringrazio e prego perche il mondo ritorni a vivere in te rit mio signor coda facoltativa o signor oh i miei calzari levero su questo santo suolo alla presenza tua mi prostrero mio signor 343',type:'N',i:375},
{n:'344',t:'ALZA LE BRACCIA, APRI IL TUO CUORE',c:'Grida la tua voglia di pace,   \ngrida  la giustizia che vuoi.    \nScoprirai che da sempre  \nuna voce grida più forte di te.  \n  \nSenti, questa voce ti cerca,  \nsenti, ha bisogno di te.  \nCredi che nel profondo del cuore   \nchi sta chiamando è Gesù.  \n  \nALZA LE BRACCIA, APRI IL TUO CUORE,  \nDONA AL SIGNORE SPLENDIDA LODE.  \nNON DARE SPAZIO ALLA TRISTEZZA,  \nMA CANTA GLORIA.  \n  \nIN OGNI COSA RENDI IL TUO GRAZIE,   \nCONTINUAMENTE INVOCA IL SUO NOME.  \n\nAPRI IL TUO CUORE,  \nLA FORZA DEL SUO AMORE È GIÀ IN TE.  \n  \n   \nCanta la tua voglia di gioia,  \ncanta la speranza che è in te.        \nScoprirai che la voce di Cristo     \n     \ncanta più forte che mai.   \n   \n     \nCredi, è parola di vita,  \ncredi, egli è via e verità.     \n     \nLascia che nel suo amore infinito  \n   \n     \ntrovi un amico anche in te. (RIT) \n \n(coda facoltativa)       \n  \n   \n \nALZA LE BRACCIA, APRI IL TUO CUORE,  \nDONA AL SIGNORE SPLENDIDA LODE.  \nNON DARE SPAZIO ALLA TRISTEZZA,   \nMA CANTA  \n \nGLORIA. \nGLORIA, GLORIA,  \nCANTA  \nGLORIA.  \n \n(segue sulla coda)   \n  \nIN OGNI COSA RENDI IL TUO GRAZIE,  \nCONTINUAMENTE INVOCA IL SUO NOME.  \nAPRI IL TUO CUORE, IL SUO AMORE È GIÀ IN TE.  \nIN OGNI COSA RENDI IL TUO GRAZIE,  \nCONTINUAMENTE INVOCA IL SUO NOME.  \nCANTA CON GIOIA, GLORIA.',s:'alza le braccia apri il tuo cuore grida la tua voglia di pace grida la giustizia che vuoi scoprirai che da sempre una voce grida piu forte di te senti questa voce ti cerca senti ha bisogno di te credi che nel profondo del cuore chi sta chiamando e gesu alza le braccia apri il tuo cuore dona al signore splendida lode non dare spazio alla tristezza ma canta gloria in ogni cosa rendi il tuo grazie continuamente invoca il suo nome apri il tuo cuore la forza del suo amore e gia in te canta la tua voglia di gioia canta la speranza che e in te scoprirai che la voce di cristo canta piu forte che mai credi e parola di vita credi egli e via e verita lascia che nel suo amore infinito trovi un amico anche in te rit coda facoltativa alza le braccia apri il tuo cuore dona al signore splendida lode non dare spazio alla tristezza ma canta gloria gloria gloria canta gloria segue sulla coda in ogni cosa rendi il tuo grazie continuamente invoca il suo nome apri il tuo cuore il suo amore e gia in te in ogni cosa rendi il tuo grazie continuamente invoca il suo nome canta con gioia gloria 344',type:'N',i:376},
{n:'345',t:'GLORIFICHIAMO IL TUO NOME',c:'GLORIFICHIAMO IL TUO NOME, SIGNORE,  \nGLORIFICHIAMO IL TUO NOME.  \nRACCONTEREMO LE TUE MERAVIGLIE  \nPERCHÉ GRANDE È LA TUA SANTITÀ. (x2 solo prima volta)  \n  \nInneggiamo  al nostro Dio  \nperché forte è il suo amore.  \nEgli regna sulla terra  \ne nei cieli potente è la sua gloria. (RIT) \n  \n\nAcclamiamo a Dio con gioia  \nperché è degno di ogni lode.  \nEgli vive in mezzo a noi  \ne per sempre con noi lui resterà. (RIT) \n  \nEsultiamo senza fine  \nperché saldo è il suo trono.  \nEgli guida la sua Chiesa  \nnella luce e nella verità. (RIT) \n  \nInneggiamo  al nostro Dio  \nperché forte è il suo amore.   \nEgli regna sulla terra  \ne nei cieli potente è la sua gloria, gloria.  \n \n \nGRANDE SEI, DIO DI BONTÀ.',s:'glorifichiamo il tuo nome glorifichiamo il tuo nome signore glorifichiamo il tuo nome racconteremo le tue meraviglie perche grande e la tua santita x2 solo prima volta inneggiamo al nostro dio perche forte e il suo amore egli regna sulla terra e nei cieli potente e la sua gloria rit acclamiamo a dio con gioia perche e degno di ogni lode egli vive in mezzo a noi e per sempre con noi lui restera rit esultiamo senza fine perche saldo e il suo trono egli guida la sua chiesa nella luce e nella verita rit inneggiamo al nostro dio perche forte e il suo amore egli regna sulla terra e nei cieli potente e la sua gloria gloria grande sei dio di bonta 345',type:'N',i:377},
{n:'346',t:'IO VOGLIO AMARTI',c:'Vivo d\'amore, Signore,  \nre glorioso e delizia del cuor.  \nTu vivi nascosto in un\'ostia per me,  \nil tuo Spirito m\'infiamma d\'amor.  \nTu che prendi dimora dei cuori, Gesù,  \nfa\' ch\'io resti cuore a cuore con te.  \n  \nIO VOGLIO AMARTI E VIVER D\'AMORE,  \nCUSTODIRTI PAROLA DI DIO  \nE CON IL PADRE DIMORI IN ME,  \nIO CHIEDO IL TUO AMORE INFINITO.  \n  \nIO VOGLIO AMARTI E VIVER D\'AMORE,  \nCUSTODIRTI PAROLA DI DIO  \nE CON IL PADRE DIMORI IN ME,   \nIO CHIEDO IL TUO AMORE INFINITO.  \n  \nT\'amo divino Signore,  \nVerbo eterno, Parola di Dio.  \nAmandoti attiro il Padre a me  \ne con lui prendi dimora nel cuor.  \nVisitate il mio cuore col vostro amor  \ne ricolmo di ogni pace sarò. (RIT) \n  \nFiamma divina tu sei,  \ncol tuo amore cancelli il timor.  \nTu bruci i peccati commessi, Gesù,   \n\ncol tuo fuoco tu li fai scomparir.  \nO mia dolce fornace che ardi d\'amor,  \ncol tuo fuoco tu m\'incendi il cuor. (RIT)',s:'io voglio amarti vivo d amore signore re glorioso e delizia del cuor tu vivi nascosto in un ostia per me il tuo spirito m infiamma d amor tu che prendi dimora dei cuori gesu fa ch io resti cuore a cuore con te io voglio amarti e viver d amore custodirti parola di dio e con il padre dimori in me io chiedo il tuo amore infinito io voglio amarti e viver d amore custodirti parola di dio e con il padre dimori in me io chiedo il tuo amore infinito t amo divino signore verbo eterno parola di dio amandoti attiro il padre a me e con lui prendi dimora nel cuor visitate il mio cuore col vostro amor e ricolmo di ogni pace saro rit fiamma divina tu sei col tuo amore cancelli il timor tu bruci i peccati commessi gesu col tuo fuoco tu li fai scomparir o mia dolce fornace che ardi d amor col tuo fuoco tu m incendi il cuor rit 346',type:'N',i:378},
{n:'347',t:'KYRIE',c:'Signore pietà, o Cristo pietà,  \nSignore di noi abbi pietà.  \n \nKyrie eleison, Christe eleison,  \nKyrie eleison, Signore pietà.  \n \nKyrie eleison, Christe eleison,  \nKyrie eleison, Signore pietà.  \n  \nSignore pietà,  \nSignore pietà.  \n  \n  \n  348 -',s:'kyrie signore pieta o cristo pieta signore di noi abbi pieta kyrie eleison christe eleison kyrie eleison signore pieta kyrie eleison christe eleison kyrie eleison signore pieta signore pieta signore pieta 348 347',type:'N',i:379},
{n:'348',t:'LA FORZA DEL TUO AMORE',c:'O SIGNORE, GUARISCIMI  \nCON LA FORZA DEL TUO AMORE,  \nIL MIO CUORE IO OFFRO A TE,  \nRISANALO E RIVIVRÒ. (x2·solo prima volta)  \n  \nMio Signore io credo in te, stendi la tua mano,  \ni miei occhi riaprirai e il tuo volto io vedrò.    \nAi tuoi piedi ripongo, o Dio, tutta la mia vita,  \noggi voglio rinascere dalla fonte del tuo amore. (RIT) \n  \nMio Signore io spero in te, volgi a me il tuo sguardo,   \nnella luce del volto tuo io per sempre splenderò.  \nSolo se io camminerò nella tua Parola,  \nniente mai più mi colpirà, al riparo tuo vivrò. (RIT) \n \n(coda facoltativa) \n  \nGUARISCIMI, O SIGNORE, GUARISCIMI.',s:'la forza del tuo amore o signore guariscimi con la forza del tuo amore il mio cuore io offro a te risanalo e rivivro x2 solo prima volta mio signore io credo in te stendi la tua mano i miei occhi riaprirai e il tuo volto io vedro ai tuoi piedi ripongo o dio tutta la mia vita oggi voglio rinascere dalla fonte del tuo amore rit mio signore io spero in te volgi a me il tuo sguardo nella luce del volto tuo io per sempre splendero solo se io camminero nella tua parola niente mai piu mi colpira al riparo tuo vivro rit coda facoltativa guariscimi o signore guariscimi 348',type:'N',i:380},
{n:'349',t:'MI BASTA LA TUA GRAZIA',c:'Quando sono debole,  \nallora sono forte  \n\nperché tu sei la mia forza.  \nQuando sono triste  \nè in te che trovo gioia  \nperché tu sei la mia gioia.  \nGesù io confido in te,  \nGesù mi basta la tua grazia.  \n  \nSEI LA MIA FORZA, LA MIA SALVEZZA,  \nSEI LA MIA PACE, SICURO RIFUGIO.  \nNELLA TUA GRAZIA VOGLIO RESTARE,  \nSANTO SIGNORE, SEMPRE CON TE.  \n  \nQuando sono povero,  \nallora sono ricco   \nperché sei la mia ricchezza.  \nQuando son malato  \nè in te che trovo vita  \nperché tu sei guarigione.  \nGesù, io confido in te,  \nGesù, mi basta la tua grazia. (RIT) \n  \nQuando sono debole,  \nallora sono forte perché  \ntu sei la mia forza.',s:'mi basta la tua grazia quando sono debole allora sono forte perche tu sei la mia forza quando sono triste e in te che trovo gioia perche tu sei la mia gioia gesu io confido in te gesu mi basta la tua grazia sei la mia forza la mia salvezza sei la mia pace sicuro rifugio nella tua grazia voglio restare santo signore sempre con te quando sono povero allora sono ricco perche sei la mia ricchezza quando son malato e in te che trovo vita perche tu sei guarigione gesu io confido in te gesu mi basta la tua grazia rit quando sono debole allora sono forte perche tu sei la mia forza 349',type:'N',i:381},
{n:'350',t:'PADRE PER SEMPRE',c:'lo vengo a te cantando con gioia,  \nil tuo cuore è in festa per me.  \nTu mi hai protetto e mi hai custodito,  \nil mio cuore esulta per te.  \nOra so che vivo per te, nell\'amore più grande,  \npoiché io riconosco che tu sei per me,  \ntu per me sei Padre immortale  \n \nTI CHIAMO PADRE PER SEMPRE,  \nNELLE TUE MANI RESTERÒ,  \nLA GIOIA CHE Ml HAI DATO  \nAL MONDO INTERO DONERÒ.  \nPADRE, PER SEMPRE  \nNELLE TUE MANI RESTERÒ,  \nLA GIOIA CHE MI HAI DATO  \nAL MONDO INTERO DONERÒ.  \nAL  MONDO INTERO,  \nAL MONDO INTERO, .  \nIO DONERÒ.  \n\n \nRisplenda in me la tua bellezza,  \nluce sfolgorante tu sei  \ned il sorriso hai dato al mio volto,  \nvita nuova che nasce in me.  \nOra so che vivo per te,  \nnell\'amore più grande,   \npoiché io riconosco che tu sei per me,  \ntu per me sei Padre immortale.  (RIT)',s:'padre per sempre lo vengo a te cantando con gioia il tuo cuore e in festa per me tu mi hai protetto e mi hai custodito il mio cuore esulta per te ora so che vivo per te nell amore piu grande poiche io riconosco che tu sei per me tu per me sei padre immortale ti chiamo padre per sempre nelle tue mani restero la gioia che ml hai dato al mondo intero donero padre per sempre nelle tue mani restero la gioia che mi hai dato al mondo intero donero al mondo intero al mondo intero io donero risplenda in me la tua bellezza luce sfolgorante tu sei ed il sorriso hai dato al mio volto vita nuova che nasce in me ora so che vivo per te nell amore piu grande poiche io riconosco che tu sei per me tu per me sei padre immortale rit 350',type:'N',i:382},
{n:'351',t:'PAROLA D\'AMORE',c:'Hai mandato, Padre, la tua Parola,  \nè la vera Forza della salvezza.  \nNel tuo Verbo, Dio, mi hai generato,  \nquesta mia vita voglio vivere in te.  \n \nSULLA TUA PAROLA GETTO LE RETI,  \nSEGNI E PRODIGI PRESTO VEDRÒ.  \nIO DEPONGO,PADRE, OGNI PECCATO  \nE NEL MIO CUORE ACCOLGO TE,  \nPAROLA  D\'AMOR.  \n  \nSulla mia strada ti sei rivelato,  \nogni mio passo la Parola ha guidato.  \nNelle tue promesse non mi hai mai deluso,  \ncanterò per sempre la tua bontà. (RIT) \n \n(coda facoltativa) \n  \nD\'AMOR, D\'AMORE, D\'AMORE.  \nIO DEPONGO, PADRE, OGNI PECCATO  \nE NEL MIO CUORE ACCOLGO TE, PAROLA D\'AMOR,  \nPAROLA D\'AMOR, PAROLA D\'AMORE, PAROLA D\'AMORE.',s:'parola d amore hai mandato padre la tua parola e la vera forza della salvezza nel tuo verbo dio mi hai generato questa mia vita voglio vivere in te sulla tua parola getto le reti segni e prodigi presto vedro io depongo padre ogni peccato e nel mio cuore accolgo te parola d amor sulla mia strada ti sei rivelato ogni mio passo la parola ha guidato nelle tue promesse non mi hai mai deluso cantero per sempre la tua bonta rit coda facoltativa d amor d amore d amore io depongo padre ogni peccato e nel mio cuore accolgo te parola d amor parola d amor parola d amore parola d amore 351',type:'N',i:383},
{n:'352',t:'REGNA SUL TUO TRONO',c:'Qui è il trono tuo, Signor, \nqui dentro il mio cuor.  \nRegnerai su quel trono che  \nspetta solo a te.  \n  \nSEMPRE PIÙ GRANDE IL TUO REGNO,  \nFINE NON AVRÀ, FINE NON AVRÀ,  \nFINE NON AVRÀ,  \n\nTU SEI DEGNO, RE DEI RE.  \n  \nQui è il trono tuo, Signor,  \nsulla terra e il ciel.  \nRegnerai su quel trono che  \nspetta solo a te. (RIT) \n  \nQui è il trono tuo, Signor, \nqui dentro il mio cuor.  \nRegnerai su quel trono che  \nspetta solo a te. (RIT)  \n  \nQui è il trono tuo, Signor.',s:'regna sul tuo trono qui e il trono tuo signor qui dentro il mio cuor regnerai su quel trono che spetta solo a te sempre piu grande il tuo regno fine non avra fine non avra fine non avra tu sei degno re dei re qui e il trono tuo signor sulla terra e il ciel regnerai su quel trono che spetta solo a te rit qui e il trono tuo signor qui dentro il mio cuor regnerai su quel trono che spetta solo a te rit qui e il trono tuo signor 352',type:'N',i:384},
{n:'353',t:'SIAMO QUI RIUNITI',c:'Siamo qui riuniti nel nome del Signore  \nper elevare insieme un canto nuovo a lui,  \nper fare risuonare la lode in questa terra  \nche come incenso sale verso il trono suo.  \n  \nDanzeremo insieme in onore del Signore,  \na lui faremo festa perché ci ha liberati.  \nEgli ha cancellato la macchia del peccato,  \nsu, gridiamo insieme il nostro grazie a Dio.  \n  \nALLELUIA, CANTIAMO Al SIGNORE,  \nALLELUIA, ECCELSO È IL SUO NOME.  \nALLELUIA Al DIO IMMORTALE,  \nSIAMO Il SUO POPOLO E LUI È Il NOSTRO RE.  \n  \nALLELUIA, CANTIAMO Al SIGNORE,  \nALLELUIA, ECCELSO È IL SUO NOME.  \nALLELUIA AL DIO IMMORTALE,  \nSIAMO SUO POPOLO, SIAMO SUO POPOLO,  \nSIAMO SUO POPOLO E LUI È NOSTRO RE. IL NOSTRO RE.   \nIL NOSTRO RE, IL NOSTRO RE.  \n  \nSanto, santo, santo, santo è il Signor,  \nsanto è il Signore,  \nriecheggi il nuovo canto nel popolo di Dio.  \nSanto, santo, santo, santo, santo è il Signor,  \nriecheggi il nuovo canto nel popolo di Dio, di Dio.  \n  \nALLELUIA, CANTIAMO AL SIGNORE,  \nALLELUIA, ECCELSO È IL SUO NOME.  \n\nALLELUIA AL DIO IMMORTALE,  \nSIAMO IL SUO POPOLO E LUI È IL NOSTRO RE.  \n  \nALLELUIA, CANTIAMO AL SIGNORE,  \nALLELUIA, ECCELSO È IL SUO NOME. \nALLELUIA AL DIO IMMORTALE,  \nSIAMO IL SUO POPOLO,  \nSIAMO IL SUO POPOLO,  \nSIAMO IL SUO POPOLO  \nÈ LUI IL NOSTRO RE,  IL NOSTRO RE.',s:'siamo qui riuniti siamo qui riuniti nel nome del signore per elevare insieme un canto nuovo a lui per fare risuonare la lode in questa terra che come incenso sale verso il trono suo danzeremo insieme in onore del signore a lui faremo festa perche ci ha liberati egli ha cancellato la macchia del peccato su gridiamo insieme il nostro grazie a dio alleluia cantiamo al signore alleluia eccelso e il suo nome alleluia al dio immortale siamo il suo popolo e lui e il nostro re alleluia cantiamo al signore alleluia eccelso e il suo nome alleluia al dio immortale siamo suo popolo siamo suo popolo siamo suo popolo e lui e nostro re il nostro re il nostro re il nostro re santo santo santo santo e il signor santo e il signore riecheggi il nuovo canto nel popolo di dio santo santo santo santo santo e il signor riecheggi il nuovo canto nel popolo di dio di dio alleluia cantiamo al signore alleluia eccelso e il suo nome alleluia al dio immortale siamo il suo popolo e lui e il nostro re alleluia cantiamo al signore alleluia eccelso e il suo nome alleluia al dio immortale siamo il suo popolo siamo il suo popolo siamo il suo popolo e lui il nostro re il nostro re 353',type:'N',i:385},
{n:'354',t:'SULLA TUA PAROLA',c:'È bello star con te  \ne non lasciarti mai,  \nSignore resta qui,  \nconsola i nostri cuori   \ne parlaci d\'amore.  \n  \nTra mille voci che  \naffollano i pensieri  \nla voce tua è per noi  \nun suono dolce, ma  \npiù forte di ogni voce.  \n  \nIO SULLA TUA PAROLA, SIGNORE,  \nLE RETI GETTERÒ E NON TEMERÒ  \nPERCHÉ HO FIDUCIA IN TE,  \nPAROLA VIVA CHE MI DONA NUOVA VITA.  \n  \nLA TUA PAROLA IN ME È SALVEZZA,  \nÈ LAMPADA AI MIEI PASSI E MI GUIDERÀ  \nPER STRADE NUOVE CHE  \nNON VEDO INTORNO A ME,  \nMA IO CONFIDO IN TE, SIGNOR,  \nPAROLA VIVA SEI.  \n  \nÈ bello star con te per sempre  \ne non lasciarti mai,  \nSignore resta qui,  \nconsola i nostri cuori  \ne parlaci  d\'amore.  \n  \nTra mille voci che  \nnel mondo affollano i pensieri   \nla voce tua è per noi un suono dolce, ma  \n\npiù forte di ogni voce, Signor. (RIT)',s:'sulla tua parola e bello star con te e non lasciarti mai signore resta qui consola i nostri cuori e parlaci d amore tra mille voci che affollano i pensieri la voce tua e per noi un suono dolce ma piu forte di ogni voce io sulla tua parola signore le reti gettero e non temero perche ho fiducia in te parola viva che mi dona nuova vita la tua parola in me e salvezza e lampada ai miei passi e mi guidera per strade nuove che non vedo intorno a me ma io confido in te signor parola viva sei e bello star con te per sempre e non lasciarti mai signore resta qui consola i nostri cuori e parlaci d amore tra mille voci che nel mondo affollano i pensieri la voce tua e per noi un suono dolce ma piu forte di ogni voce signor rit 354',type:'N',i:386},
{n:'355',t:'ACCLAMIAMO AL SIGNORE',c:'Acclamate al Signore  \nvoi tutti abitanti della terra,  \nservite il Signore nella gioia,  \nesultanti andate a lui.  \n \nRiconoscete che egli è Dio,  \nlui ci ha fatti e siamo suoi,  \nsuo popolo benedetto e santo   \ngregge che dirige ai suoi pascoli.  \n  \nE TUTTI INSIEME DANZIAMO CON GIOIA  \nALL\'AGNELLO IMMOLATO PER NOI,  \nE TUTTI INSIEME ACCLAMIAMO E CON FORZA  \nCANTIAMO GLORIA AL NOSTRO REDENTORE.  \n  \nVarcate con inni le sue porte  \ni suoi atri con canti di lode,  \nlodatelo e acclamatelo a gran voce  \ne benedite il suo santo Nome.  \n  \nPoiché è buono il Signore,  \ngrande è la sua misericordia,  \nla sua fedeltà che è per ogni uomo  \nin eterno durerà.  (RIT) \n  \n  \nAcclamate ...   \n \nRiconoscete ... (RIT) \n    \nGloria  \n \nVarcate  con inni le sue porte   \ni suoi atri con canti di lode,  \nlodatelo e acclamatelo a gran voce  \ne benedite il suo santo Nome.  \n  \nPoiché è buono il Signore,   \ngrande è la sua misericordia,  \nla sua fedeltà che è per ogni uomo   \nin eterno durerà. (RIT) \n  \n\nPoiché è buono il Signore,   \ngrande è la sua misericordia,  \nla sua fedeltà che è per ogni uomo  \nin eterno durerà,  \nper ogni uomo sempre durerà,  \nper ogni uomo sempre durerà.',s:'acclamiamo al signore acclamate al signore voi tutti abitanti della terra servite il signore nella gioia esultanti andate a lui riconoscete che egli e dio lui ci ha fatti e siamo suoi suo popolo benedetto e santo gregge che dirige ai suoi pascoli e tutti insieme danziamo con gioia all agnello immolato per noi e tutti insieme acclamiamo e con forza cantiamo gloria al nostro redentore varcate con inni le sue porte i suoi atri con canti di lode lodatelo e acclamatelo a gran voce e benedite il suo santo nome poiche e buono il signore grande e la sua misericordia la sua fedelta che e per ogni uomo in eterno durera rit acclamate riconoscete rit gloria varcate con inni le sue porte i suoi atri con canti di lode lodatelo e acclamatelo a gran voce e benedite il suo santo nome poiche e buono il signore grande e la sua misericordia la sua fedelta che e per ogni uomo in eterno durera rit poiche e buono il signore grande e la sua misericordia la sua fedelta che e per ogni uomo in eterno durera per ogni uomo sempre durera per ogni uomo sempre durera 355',type:'N',i:387},
{n:'356',t:'GESÙ MIO BUON PASTORE',c:'Gesù mio buon pastore guida la mia vita,  \nmetti sul mio cuore il sigillo tuo.  \nPortami con te sui sentieri dell\'amor  \ne difendimi dal male o Signor.  \n  \nPRENDIMI PER MANO, DIO,  \nSOLO IN TE CONFIDO,  \nIO NON TEMERÒ ALCUN MALE   \nSE TU SEI CON ME.  \nANCHE NELLA VALLE OSCURA  \nTU SEI LUCE AL MIO CAMMINO,   \nE CON TE LA VIA NON SMARRIRO\'   \nGESÙ MIO BUON PASTORE.  \n  \nUngi il mio capo con olio profumato,   \nriempi la mia vita con la grazia tua.  \nVoglio star con te,  \nnel tuo tempio, o Signor,  \ncon i santi tuoi le lodi innalzerò. (RIT)',s:'gesu mio buon pastore gesu mio buon pastore guida la mia vita metti sul mio cuore il sigillo tuo portami con te sui sentieri dell amor e difendimi dal male o signor prendimi per mano dio solo in te confido io non temero alcun male se tu sei con me anche nella valle oscura tu sei luce al mio cammino e con te la via non smarriro gesu mio buon pastore ungi il mio capo con olio profumato riempi la mia vita con la grazia tua voglio star con te nel tuo tempio o signor con i santi tuoi le lodi innalzero rit 356',type:'N',i:388},
{n:'357',t:'GESÙ VERRÀ',c:'Grande gioia ci sarà,  \n \nla speranza rivivrà,  \nla tua vita cambierà,  \n \ndevi crederlo perché  \nGesù verrà.  \n  \nIl tuo deserto sparirà, nuove vie lui ti aprirà,  \nla tristezza passerà e la notte più non tornerà,  \nGesù verrà.  \n  \nGESÙ VERRÀ, LA SUA GLORIA APPARIRÀ,  \nGESÙ VERRÀ, COME IL SOLE SPLENDERÀ,  \nGESÙ VERRÀ E CON NOI LUI RESTERÀ,  \nCOME UNA STELLA LUI SARÀ  \nED IL TUO CUORE ORIENTERÀ,  \nGESÙ VERRÀ. (RIP)   \n\nGESÙ VERRÀ.  \n  \nLa città di Dio verrà, per gli eletti si aprirà,   \nla giustizia regnerà e la pace tornerà,  \nGesù verrà.  \n  \nOgni uomo adorerà Gesù Cristo che verrà  \ne lo Spirito sarà l\'acqua viva che ci riempirà,  \nGesù verrà.  (RIT)  \n  \nVieni, vieni, vieni Gesù, (x3)   \nvieni, vieni, vieni  Gesù.  \n  \nVieni,  vieni.',s:'gesu verra grande gioia ci sara la speranza rivivra la tua vita cambiera devi crederlo perche gesu verra il tuo deserto sparira nuove vie lui ti aprira la tristezza passera e la notte piu non tornera gesu verra gesu verra la sua gloria apparira gesu verra come il sole splendera gesu verra e con noi lui restera come una stella lui sara ed il tuo cuore orientera gesu verra rip gesu verra la citta di dio verra per gli eletti si aprira la giustizia regnera e la pace tornera gesu verra ogni uomo adorera gesu cristo che verra e lo spirito sara l acqua viva che ci riempira gesu verra rit vieni vieni vieni gesu x3 vieni vieni vieni gesu vieni vieni 357',type:'N',i:389},
{n:'358',t:'INSIEME CANTIAMO',c:'INSIEME CANTIAMO AL SIGNORE  \nA COLUI CHE REGNA NEI CIELI,  \nCELEBRIAMO LA SUA REGALITÀ,  \nLA SAPIENZA SUA NOI CONTEMPLIAMO  \nFINCHÉ VITA CI DARÀ  \nAL SUO TRONO CANTEREM   \nGLORIA ALLELUIA.  \n  \nIl Signore è buono, lodiamo il suo Nome,  \neterna è la sua misericordia.  \nCon sapienza lui creò la terra e il ciel,  \neterna è la sua misericordia. (RIT) \n  \nIl Signore ha fatto prodigi per noi,   \neterna è la sua misericordia.  \nCol suo braccio lui sconfisse la schiavitù,   \neterna è la sua misericordia. (RIT) \n  \nIl Signore è grande e dona il suo amore,  \neterna è la sua misericordia.  \nAlleanza eterna ha promesso a noi,  \neterna è la sua misericordia.   \n  \nLodiamo il Signore che è buono,   \neterna è la sua misericordia.  \nSi canti da oriente a occidente,  \neterna è la sua misericordia.  \n  \nLo dicano tutti i suoi figli,   \n\neterna è la sua misericordia.  \nLo dica chi crede in lui,  \neterna è la sua misericordia.  \n(RIT)    \n \nGLORIA ALLELUIA,   \nGLORIA ALLELUIA,  \nGLORIA ALLELUIA,  \nGLORIA ALLELUIA.',s:'insieme cantiamo insieme cantiamo al signore a colui che regna nei cieli celebriamo la sua regalita la sapienza sua noi contempliamo finche vita ci dara al suo trono canterem gloria alleluia il signore e buono lodiamo il suo nome eterna e la sua misericordia con sapienza lui creo la terra e il ciel eterna e la sua misericordia rit il signore ha fatto prodigi per noi eterna e la sua misericordia col suo braccio lui sconfisse la schiavitu eterna e la sua misericordia rit il signore e grande e dona il suo amore eterna e la sua misericordia alleanza eterna ha promesso a noi eterna e la sua misericordia lodiamo il signore che e buono eterna e la sua misericordia si canti da oriente a occidente eterna e la sua misericordia lo dicano tutti i suoi figli eterna e la sua misericordia lo dica chi crede in lui eterna e la sua misericordia rit gloria alleluia gloria alleluia gloria alleluia gloria alleluia 358',type:'N',i:390},
{n:'359',t:'IO TI SEGUIRÒ',c:'Mostrami la via per seguire te,   \napri i miei occhi Gesù,  \ndonami la forza per camminare  \nsulla via che hai tracciato per me.  \nLa tua croce, o Dio, amerò  \ne con te nel mondo la porterò,  \no Signore mia vera libertà,  \nse con me sarai io ti seguirò  \n  \nMostrami la via per raggiungere te,  \nvenga il tuo Spirito in me,  \ndonami la grazia per rimanere  \nsulla via che mi porta a te.  \nLa tua croce, o Dio, amerò  \ne con te nel mondo la porterò,  \no Signore mia vera libertà,  \nse con me sarai io ti seguirò.  \n  \nTi seguirò, (ti seguirò,) ti seguirò.  \n  \nLa tua croce, o Dio, amerò  \ne con te nel mondo la porterò,  \no Signore mia vera libertà,  \nse con me sarai io ti seguirò.  \n  \nTi seguirò, ti seguirò, ti seguirò, ti seguirò.',s:'io ti seguiro mostrami la via per seguire te apri i miei occhi gesu donami la forza per camminare sulla via che hai tracciato per me la tua croce o dio amero e con te nel mondo la portero o signore mia vera liberta se con me sarai io ti seguiro mostrami la via per raggiungere te venga il tuo spirito in me donami la grazia per rimanere sulla via che mi porta a te la tua croce o dio amero e con te nel mondo la portero o signore mia vera liberta se con me sarai io ti seguiro ti seguiro ti seguiro ti seguiro la tua croce o dio amero e con te nel mondo la portero o signore mia vera liberta se con me sarai io ti seguiro ti seguiro ti seguiro ti seguiro ti seguiro 359',type:'N',i:391},
{n:'360',t:'MARANATHÀ SOFFIO DI DIO',c:'Spirito Santo scendi su di me  \ne donami un cuore puro,  \napri i miei occhi con la tua luce,  \nsolleva le mie braccia verso te,  \nrivelami la verità, o Spirito d\'amor,   \n\ninfiamma col tuo fuoco il mio cuore.  \n  \nMARANATHÀ VIENI SIGNOR,   \nMARANATHÀ VIENI IN ME SIGNOR.  \n  \nDai quattro venti soffia su di noi  \ne sana ogni ferita col tuo amore,   \nscendi dal cielo Spirito di Dio  \ne semina la sua Parola in noi,  \nè acqua che zampilla questo canto che leviam,  \nbattezzaci nel tuo eterno amore. (RIT)',s:'maranatha soffio di dio spirito santo scendi su di me e donami un cuore puro apri i miei occhi con la tua luce solleva le mie braccia verso te rivelami la verita o spirito d amor infiamma col tuo fuoco il mio cuore maranatha vieni signor maranatha vieni in me signor dai quattro venti soffia su di noi e sana ogni ferita col tuo amore scendi dal cielo spirito di dio e semina la sua parola in noi e acqua che zampilla questo canto che leviam battezzaci nel tuo eterno amore rit 360',type:'N',i:392},
{n:'361',t:'RIMANI CON NOI',c:'Noi ti abbiamo incontrato  \nmentre il giorno si spegneva,  \nti sei fatto pellegrino insieme a noi  \nhai effuso una luce sull\'incredulità  \nche copriva i nostri occhi  \ne il nostro cuore.  \n  \nCon la tua Parola  \nhai svelato a noi il mistero  \ndell\'eterno amore fatto uomo in te,  \nuna nuova speranza  \nhai messo dentro il cuor,  \nuna fiamma che mai più si spegnerà.  \n  \nRIMANI CON NOI SIGNORE GESÙ,  \nIL GIORNO GIÀ VOLGE AL TRAMONTO.  \nRIMANI CON NOI SIGNORE GESÙ,  \nLA SERA È VICINA, RIMANI CON NOI.  \nRIMANI CON NOI SIGNORE GESÙ,  \nIL GIORNO GIÀ VOLGE AL TRAMONTO.  \nRIMANI CON NOI SIGNORE GESÙ,  \nLA SERA È VICINA, RIMANI CON NOI.  \n  \nAlla mensa con noi  \nprendi il pane tra le mani,  \nti riveli agli occhi dell\'umanità,  \ndietro il velo dei segni  \nriconosciamo te,   \nil Signore della vita,  \nil Salvatore.  \n  \nNoi ti abbiamo  incontrato,  \n\nquesta vita hai trasformato,  \nil tuo amore è rifiorito dentro noi,  \ncon la gioia nel cuore  \nannunzieremo che  \nla salvezza noi abbiamo solo in te. (RIT)',s:'rimani con noi noi ti abbiamo incontrato mentre il giorno si spegneva ti sei fatto pellegrino insieme a noi hai effuso una luce sull incredulita che copriva i nostri occhi e il nostro cuore con la tua parola hai svelato a noi il mistero dell eterno amore fatto uomo in te una nuova speranza hai messo dentro il cuor una fiamma che mai piu si spegnera rimani con noi signore gesu il giorno gia volge al tramonto rimani con noi signore gesu la sera e vicina rimani con noi rimani con noi signore gesu il giorno gia volge al tramonto rimani con noi signore gesu la sera e vicina rimani con noi alla mensa con noi prendi il pane tra le mani ti riveli agli occhi dell umanita dietro il velo dei segni riconosciamo te il signore della vita il salvatore noi ti abbiamo incontrato questa vita hai trasformato il tuo amore e rifiorito dentro noi con la gioia nel cuore annunzieremo che la salvezza noi abbiamo solo in te rit 361',type:'N',i:393},
{n:'362',t:'SIGNORE DEI SIGNORI',c:'SOLO IN TE BELLEZZA E TENEREZZA C\'È,   \nGRANDE SEI O DIO CHE REGNI SU DI NOI.  \nESALTIAMO E PROCLAMIAMO TE,  \nETERNO NOSTRO SALVATORE,  \nSIGNORE DEI SIGNORI, \nRE DEI RE, RE DEI RE. (RIT)   \nRE DEI RE.  \n \n(seconda volta) RE DEI RE \n  \nEleviam le nostre voci a te che regni  \nrivestito di splendore e maestà,  \ncontempliamo la tua gloria sulla terra,  \nil tuo volto splende su di noi,  \naltissimo Signore Re dei re, Re dei re. (RIT) \n  \nEleviam le nostre lodi a te che salvi  \ne con gli angeli e coi santi noi cantiamo,   \nacclamiamo all\'Agnello che è sul trono,   \ncelebrando ed adorando te,  \naltissimo Signore Re dei re, Re dei re. (RIT) \n  \n \n RE DEI RE, RE DEI RE,  \nRE DEI RE.',s:'signore dei signori solo in te bellezza e tenerezza c e grande sei o dio che regni su di noi esaltiamo e proclamiamo te eterno nostro salvatore signore dei signori re dei re re dei re rit re dei re seconda volta re dei re eleviam le nostre voci a te che regni rivestito di splendore e maesta contempliamo la tua gloria sulla terra il tuo volto splende su di noi altissimo signore re dei re re dei re rit eleviam le nostre lodi a te che salvi e con gli angeli e coi santi noi cantiamo acclamiamo all agnello che e sul trono celebrando ed adorando te altissimo signore re dei re re dei re rit re dei re re dei re re dei re 362',type:'N',i:394},
{n:'363',t:'SOLE DI GIUSTIZIA',c:'Nella tua casa Signor  \nrifugio noi troviamo,  \ne contempliamo l\'amor  \ndel sacrificio offerto per noi.  \n  \nSempre ci benedirai,  \na te ci fidanzerai,  \nnon ci abbandonerai,  \nsempre con noi resterai, (sempre,)  \nsempre.  \n \n\nSOLE DI GIUSTIZIA  \nLA TUA PRESENZA CI DONA LA VITA,  \nNELLA TUA PAROLA   \nIL GIUSTO PER SEMPRE VIVRÀ.  \n  \nTu ci rinnovi Signor,  \neffondi la tua grazia,  \nla tua alleanza con noi  \nuna promessa che mai finirà.  \n  \nSempre ci benedirai,  \na te ci fidanzerai,  \nnon ci abbandonerai,  \nsempre con noi resterai, (sempre,)  \nsempre. (RIT) \n \nChi è uguale a te, o Signore,  \nDio di verità,  \nnoi canteremo il tuo Nome,  \nla tua fedeltà. (RIT) \n  \nIL GIUSTO PER SEMPRE VIVRÀ,   \nIL GIUSTO PER SEMPRE VIVRÀ.',s:'sole di giustizia nella tua casa signor rifugio noi troviamo e contempliamo l amor del sacrificio offerto per noi sempre ci benedirai a te ci fidanzerai non ci abbandonerai sempre con noi resterai sempre sempre sole di giustizia la tua presenza ci dona la vita nella tua parola il giusto per sempre vivra tu ci rinnovi signor effondi la tua grazia la tua alleanza con noi una promessa che mai finira sempre ci benedirai a te ci fidanzerai non ci abbandonerai sempre con noi resterai sempre sempre rit chi e uguale a te o signore dio di verita noi canteremo il tuo nome la tua fedelta rit il giusto per sempre vivra il giusto per sempre vivra 363',type:'N',i:395},
{n:'364',t:'TU SEI QUI',c:'TU SEI QUI MIO SIGNOR,  \nMIA FORZA E MIO AMORE.   \nTU SEI IN ME LIBERTÀ,   \nLUCE DI VERITÀ.  \n  \nTU SEI QUI MIO RE,  \nSEI LA GIOIA DEL MIO CUORE.  \nTU SEI IN ME CARITA,   \nFONTE DI SANTITÀ.  \n  \nlo custodirò la tua Parola in me,  \nnella fedeltà la tua legge amerò. (RIT) \n  \nIo per te vivrò, come incenso brucerò,  \nil tuo amore in me come giglio fiorirà,  \nmio Signor. (RIT) \n  \nMio  Signore, mio Signore, mio Signore,  \ntu sei qui mio Signor,  \ntu sei qui, luce di verità. (RIT) \n\n \nFONTE DI SANTITA.',s:'tu sei qui tu sei qui mio signor mia forza e mio amore tu sei in me liberta luce di verita tu sei qui mio re sei la gioia del mio cuore tu sei in me carita fonte di santita lo custodiro la tua parola in me nella fedelta la tua legge amero rit io per te vivro come incenso brucero il tuo amore in me come giglio fiorira mio signor rit mio signore mio signore mio signore tu sei qui mio signor tu sei qui luce di verita rit fonte di santita 364',type:'N',i:396},
{n:'365',t:'TU SEI SANTO',c:'Ti adoro Parola viva,  \nti adoro Verbo di Dio,  \ntu sei dono di salvezza,   \nsolo te Signor ascolterò.  \n  \nTi adoro luce del mondo,  \nvieni e splendi in questo mio cuore,  \na te offro la mia vita,  \nsempre annunzierò  \nil tuo grande amor, Gesù.  \n  \nTU SEI SANTO, TU SEI DEGNO,  \nSEI GRANDE E COMPI  \nMERAVIGLIE IN MEZZO A NOI.  \nTU SEI FORTE, SEI POTENTE,  \nSEI FEDELE E VIENI  \nNELLA TUA GLORIA,   \nE IL TUO REGNO MAI FINIRÀ.  \n  \nTi adoro pane del cielo,  \nti adoro Figlio di Dio,   \nhai salvato la mia vita,  \nsempre innalzerò il Nome tuo.  \n  \nTi adoro Nome glorioso,  \nti adoro Agnello di Dio,   \na te levo la mia voce,  \nsempre annunzierò  \nil tuo grande amor, Gesù. (RIT) (x2) \n  \nE IL TUO REGNO MAI FINIRÀ,   \nE IL TUO REGNO MAI FINIRÀ.',s:'tu sei santo ti adoro parola viva ti adoro verbo di dio tu sei dono di salvezza solo te signor ascoltero ti adoro luce del mondo vieni e splendi in questo mio cuore a te offro la mia vita sempre annunziero il tuo grande amor gesu tu sei santo tu sei degno sei grande e compi meraviglie in mezzo a noi tu sei forte sei potente sei fedele e vieni nella tua gloria e il tuo regno mai finira ti adoro pane del cielo ti adoro figlio di dio hai salvato la mia vita sempre innalzero il nome tuo ti adoro nome glorioso ti adoro agnello di dio a te levo la mia voce sempre annunziero il tuo grande amor gesu rit x2 e il tuo regno mai finira e il tuo regno mai finira 365',type:'N',i:397},
{n:'366',t:'UNO SPIRITO NUOVO',c:'Davanti a te Signore  \ndepongo il mio cuore,  \ntoccalo, trasformalo,  \nperdona i miei peccati,  \nla mia iniquità,  \ne la pietra carne viva diventerà.  \n\n  \nMETTI IN ME UNO SPIRITO NUOVO,  \nCON ACQUA VIVA MI PURIFICHERAI,   \nPONI IN ME LA TUA LEGGE SIGNORE,  \nSUL MIO CUORE LA SCRIVERAI.  \n \nRingrazio te Signore  \nper questo immenso amore,  \nsolo in te io rivivrò,  \nconcludi un\'alleanza,  \nrinnova questo cuor,  \ne camminerò con te nella fedeltà. (RIT)(x2)   \n  \nMETTI IN ME,  \nUNO SPIRITO NUOVO,  \nMETTI IN  ME,   \nUNO SPIRITO NUOVO,  \nLA TUA LEGGE SUL MIO CUORE  \nTU SCRIVERAI.',s:'uno spirito nuovo davanti a te signore depongo il mio cuore toccalo trasformalo perdona i miei peccati la mia iniquita e la pietra carne viva diventera metti in me uno spirito nuovo con acqua viva mi purificherai poni in me la tua legge signore sul mio cuore la scriverai ringrazio te signore per questo immenso amore solo in te io rivivro concludi un alleanza rinnova questo cuor e camminero con te nella fedelta rit x2 metti in me uno spirito nuovo metti in me uno spirito nuovo la tua legge sul mio cuore tu scriverai 366',type:'N',i:398},
{n:'367',t:'ALZATI!',c:'Alzati   \nVedi, la tua luce splende già.  \nAlzati   \nLa gloria del Signore ti avvolgerà  \npoiché le tenebre ricoprono la terra  \nma su te risplende il Signore. \n  \nAlzati   \nEcco i tuoi figli vengono a te.  \nAlzati   \nTutti i re vedranno il tuo splendore. \n  \nÈ LUI IL TUO DIO, IL TUO SIGNORE,  \nÈ LUI CHE DÀ LA GIOIA AL TUO CUORE.  \nTU SEI IL MIO DIO, IL MIO SIGNORE,  \nHAI CAMBIATO LA MIA VITA  \nCON IL TUO IMMENSO AMOR.  \n TU SEI IL MIO DIO,IL MIO SIGNORE,   \nSOLO TE IO LODERÒ, SOLO TE ADORERÒ  \nGESÙ MIO RE.  \n \nAlzati!  \nOggi la salvezza è su di te.  \nAlzati!  \n\nDi pace e di giustizia ti vestirai   \npoiché è finito il tempo del tuo lutto,   \ntu sarai la gioia del Signore.  \n   \nAlzati!  \nNon tramonta il sole sopra di te.  \nAlzati!  \nTutti i re vedranno il tuo splendore. (RIT) \n \n(coda facoltativa) \n  \nMIO SIGNORE, GESÙ MIO RE.  \nMIO SIGNORE, GESÙ MIO RE.  \nMIO SIGNORE, GESÙ MIO RE,  \nGESÙ MIO RE.',s:'alzati alzati vedi la tua luce splende gia alzati la gloria del signore ti avvolgera poiche le tenebre ricoprono la terra ma su te risplende il signore alzati ecco i tuoi figli vengono a te alzati tutti i re vedranno il tuo splendore e lui il tuo dio il tuo signore e lui che da la gioia al tuo cuore tu sei il mio dio il mio signore hai cambiato la mia vita con il tuo immenso amor tu sei il mio dio il mio signore solo te io lodero solo te adorero gesu mio re alzati oggi la salvezza e su di te alzati di pace e di giustizia ti vestirai poiche e finito il tempo del tuo lutto tu sarai la gioia del signore alzati non tramonta il sole sopra di te alzati tutti i re vedranno il tuo splendore rit coda facoltativa mio signore gesu mio re mio signore gesu mio re mio signore gesu mio re gesu mio re 367',type:'N',i:399},
{n:'368',t:'DEL TUO AMORE IO VIVRÒ',c:'Alzo gli occhi e cerco il tuo volto,  \ntu sei il mio Dio, confido in te.  \nIl tuo cuore è fonte d\'amore,  \nsei il mio Signore e spero in te.  \n  \nDEL TUO AMORE IO VIVRÒ,   \nSOLO TU Ml PROTEGGERAI.  \nSIGNORE IO DI TE VIVRÒ,  \nRESTERÒ CON TE   \nE NULLA TEMERÒ.   \nCON TE RESTERÒ  \nE NULLA TEMERÒ.  \nCON TE RESTERÒ.  \n  \nAlzo gli occhi e vedo il tuo volto,   \ntu sei il mio Dio, ho pace in te.  \nIl tuo cuore è fonte di vita,  \nsei il mio Signore e spero in te. (RIT) (x2)',s:'del tuo amore io vivro alzo gli occhi e cerco il tuo volto tu sei il mio dio confido in te il tuo cuore e fonte d amore sei il mio signore e spero in te del tuo amore io vivro solo tu ml proteggerai signore io di te vivro restero con te e nulla temero con te restero e nulla temero con te restero alzo gli occhi e vedo il tuo volto tu sei il mio dio ho pace in te il tuo cuore e fonte di vita sei il mio signore e spero in te rit x2 368',type:'N',i:400},
{n:'369',t:'DIAMO GLORIA AL SIGNORE',c:'DIAMO GLORIA AL SIGNORE NOSTRO DIO,  \nSENZA FINE LE SUE LODI CANTEREMO.  \nESALTIAMO LA SUA FEDELTÀ,   \nPROCLAMIAMO LA SUA GLORIA.  \n  \nDIAMO GLORIA AL SIGNORE  NOSTRO  DIO,   \n\nSENZA FINE LE SUE LODI CANTEREMO.   \nESALTIAMO LA SUA FEDELTÀ,  \nPROCLAMIAMO LA SUA GLORIA.  \n  \nCome è bello dar lode al Signore   \ne cantare al suo Nome.  \nSua la gloria, la potenza e l\'onore,  \nla sua fedeltà sarà per sempre.  \n  \nDIAMO GLORIA AL SIGNORE NOSTRO DIO,  \nSENZA FINE LE SUE LODI CANTEREMO.  \nESALTIAMO LA SUA FEDELTÀ,   \nPROCLAMIAMO LA SUA GLORIA.  \nESALTIAMO LA SUA FEDELTÀ,  \nPROCLAMIAMO LA SUA GLORIA.  \n \nTu mi dai gioia, tu fai meraviglie.  \nGrandi le opere che compi  \ne profondi sono i tuoi pensieri,  \nSignore, l\'eccelso sei per sempre.  \n \nDIAMO GLORIA AL SIGNORE NOSTRO DIO,  \nSENZA FINE LE SUE LODI CANTEREMO.  \nESALTIAMO LA SUA FEDELTÀ,   \nPROCLAMIAMO LA SUA GLORIA.  \nESALTIAMO LA SUA FEDELTÀ,  \nPROCLAMIAMO LA SUA GLORIA.  \n  \nLa tua forza ci doni Signore,  \nnei tuoi atri noi vivremo  \ne diremo quanto è buono il Signore,  \nè lui la roccia di salvezza.  \n \nDIAMO GLORIA AL SIGNORE NOSTRO DIO,  \nSENZA FINE LE SUE LODI CANTEREMO.  \nESALTIAMO LA SUA FEDELTÀ,   \nPROCLAMIAMO LA SUA GLORIA.  \nESALTIAMO LA SUA FEDELTÀ,  \nPROCLAMIAMO LA SUA GLORIA. (x2) \n \nPROCLAMIAMO LA SUA GLORIA. \nPROCLAMIAMO LA SUA GLORIA.',s:'diamo gloria al signore diamo gloria al signore nostro dio senza fine le sue lodi canteremo esaltiamo la sua fedelta proclamiamo la sua gloria diamo gloria al signore nostro dio senza fine le sue lodi canteremo esaltiamo la sua fedelta proclamiamo la sua gloria come e bello dar lode al signore e cantare al suo nome sua la gloria la potenza e l onore la sua fedelta sara per sempre diamo gloria al signore nostro dio senza fine le sue lodi canteremo esaltiamo la sua fedelta proclamiamo la sua gloria esaltiamo la sua fedelta proclamiamo la sua gloria tu mi dai gioia tu fai meraviglie grandi le opere che compi e profondi sono i tuoi pensieri signore l eccelso sei per sempre diamo gloria al signore nostro dio senza fine le sue lodi canteremo esaltiamo la sua fedelta proclamiamo la sua gloria esaltiamo la sua fedelta proclamiamo la sua gloria la tua forza ci doni signore nei tuoi atri noi vivremo e diremo quanto e buono il signore e lui la roccia di salvezza diamo gloria al signore nostro dio senza fine le sue lodi canteremo esaltiamo la sua fedelta proclamiamo la sua gloria esaltiamo la sua fedelta proclamiamo la sua gloria x2 proclamiamo la sua gloria proclamiamo la sua gloria 369',type:'N',i:401},
{n:'370',t:'GESÙ SONO QUI DAVANTI A TE',c:'Gesù sono qui davanti a te  \n\nche perdoni oggi la mia infedeltà.  \nLo Spirito consolatore  \ntrasforma l\'esser mio  \ned io mi prostro qui davanti a te. \n  \nGESÙ ADORO TE CON TUTTO IL CUOR,  \nMIO DIO E MIO RE,  \nADORO TE CON TUTTO IL CUOR.  \n  \nGesù sono qui davanti a te,  \ntu rinnovi la mia vita ed il mio cuor.  \nLa luce del tuo santo volto  \nio voglio contemplare  \nper adorare la tua santità. (RIT)  \n  \nGesù sono qui davanti a te,  \nnel tuo Nome è la salvezza, mio Signor.  \nPer sempre nel tuo tempio santo  \nio voglio dimorare  \ne proclamare la tua fedeltà. (RIT) (x2)',s:'gesu sono qui davanti a te gesu sono qui davanti a te che perdoni oggi la mia infedelta lo spirito consolatore trasforma l esser mio ed io mi prostro qui davanti a te gesu adoro te con tutto il cuor mio dio e mio re adoro te con tutto il cuor gesu sono qui davanti a te tu rinnovi la mia vita ed il mio cuor la luce del tuo santo volto io voglio contemplare per adorare la tua santita rit gesu sono qui davanti a te nel tuo nome e la salvezza mio signor per sempre nel tuo tempio santo io voglio dimorare e proclamare la tua fedelta rit x2 370',type:'N',i:402},
{n:'371',t:'INNO ALLA CARITÀ',c:'Se anche io parlassi tutte le lingue  \ne conoscessi i misteri e la scienza,  \nse avessi il dono della profezia   \nma non avessi la carità,  \nnon sarei nulla, nulla.  \n  \nLA CARITÀ È PAZIENTE,  \nLA CARITÀ È BENIGNA  \nE SI COMPIACE DELLA VERITÀ.  \nTUTTO ESSA TOLLERA,  \nTUTTO CREDE E SPERA,   \nNON FINIRÀ LA CARITÀ.  \n  \nSe avessi fede da spostar le montagne   \ne offrissi ai poveri tutti i miei beni,  \nse dessi il corpo per essere arso  \nma non avessi la carità,  \nnon sarei nulla, nulla. (RIT)  \n  \nNON FINIRÀ LA CARITÀ.(x2)   \nNON FINIRÀ LA CARITÀ.',s:'inno alla carita se anche io parlassi tutte le lingue e conoscessi i misteri e la scienza se avessi il dono della profezia ma non avessi la carita non sarei nulla nulla la carita e paziente la carita e benigna e si compiace della verita tutto essa tollera tutto crede e spera non finira la carita se avessi fede da spostar le montagne e offrissi ai poveri tutti i miei beni se dessi il corpo per essere arso ma non avessi la carita non sarei nulla nulla rit non finira la carita x2 non finira la carita 371',type:'N',i:403},
{n:'372',t:'LODATE IL SIGNORE',c:'Lodate il Signore dei cieli,  \nlodate angeli suoi,  \nlodate voi tutte sue schiere la sua maestà.  \n  \nLodate da tutta la terra,  \nlodate popoli suoi,   \nlodate giovani e vecchi la sua bontà.  \n \nCANTATE AL SIGNORE  \nUN CANTICO NUOVO,  \nSIA ONORE AL RE,  \nSIA GLORIA AL DIO  \nCHE SIEDE SUL TRONO.  \nRISUONI LA LODE,  \nLA BENEDIZIONE AL SIGNOR  \nCHE ERA E CHE È,  \nCHE SEMPRE SARÀ,     \nALLELUIA, ALLELUIA.  \n  \nGioiscano nel Creatore,  \nesultino i figli di Sion,   \ndanzino, facciano festa al loro Dio.  \n  \nLodino il nome del Padre,  \ncon timpani inneggino a lui,  \ncieli e terra si prostrino al Re dei re. (RIT) \n  \nRISUONI LA LODE,  \nLA BENEDIZIONE AL SIGNOR  \nCHE ERA E CHE È,   \nCHE SEMPRE SARÀ,  \nALLELUIA.  \n \n(coda facoltativa) \n \n(RIT)  \n \nALLELUIA, ALLELUIA, ALLELUIA. (x5)',s:'lodate il signore lodate il signore dei cieli lodate angeli suoi lodate voi tutte sue schiere la sua maesta lodate da tutta la terra lodate popoli suoi lodate giovani e vecchi la sua bonta cantate al signore un cantico nuovo sia onore al re sia gloria al dio che siede sul trono risuoni la lode la benedizione al signor che era e che e che sempre sara alleluia alleluia gioiscano nel creatore esultino i figli di sion danzino facciano festa al loro dio lodino il nome del padre con timpani inneggino a lui cieli e terra si prostrino al re dei re rit risuoni la lode la benedizione al signor che era e che e che sempre sara alleluia coda facoltativa rit alleluia alleluia alleluia x5 372',type:'N',i:404},
{n:'373',t:'MANDA IL TUO SPIRITO',c:'MANDA IL TUO SPIRITO,  \nMANDA IL TUO SPIRITO,  \nMANDA IL TUO  \n\nSIGNORE, SU DI NOI.   \nMANDA IL TUO SPIRITO,  \nMANDA IL TUO SPIRITO,   \nMANDA IL TUO SPIRITO,  \nSIGNORE, SU DI NOI.  \n  \nLa tua presenza noi invochiamo  \nper esser come tu ci vuoi.  \nManda il tuo Spirito,  \nSignore, su di noi,  \nimpareremo ad amare  \nproprio come ami tu.  \nUn sol corpo, un solo Spirito saremo,  \nun sol corpo, un solo Spirito saremo. (RIT) \n  \nLa tua sapienza noi invochiamo,   \nsorgente eterna del tuo amore.   \nDono radioso che dà luce ai figli tuoi,  \nnel tuo amore confidiamo.  \nLa tua grazia ci farà  \nChiesa unita e santa per l\'eternità,  \nChiesa unita e santa per l\'eternità. (RIT) \n \nMANDA IL TUO SPIRITO,  \nMANDA IL TUO SPIRITO,  \nSIGNORE, SU DI NOI.  \n  \nSignore vieni in noi (Signore vieni in noi). (x3)  \nSignore vieni in noi.',s:'manda il tuo spirito manda il tuo spirito manda il tuo spirito manda il tuo signore su di noi manda il tuo spirito manda il tuo spirito manda il tuo spirito signore su di noi la tua presenza noi invochiamo per esser come tu ci vuoi manda il tuo spirito signore su di noi impareremo ad amare proprio come ami tu un sol corpo un solo spirito saremo un sol corpo un solo spirito saremo rit la tua sapienza noi invochiamo sorgente eterna del tuo amore dono radioso che da luce ai figli tuoi nel tuo amore confidiamo la tua grazia ci fara chiesa unita e santa per l eternita chiesa unita e santa per l eternita rit manda il tuo spirito manda il tuo spirito signore su di noi signore vieni in noi signore vieni in noi x3 signore vieni in noi 373',type:'N',i:405},
{n:'374',t:'MI ARRENDO AL TUO AMORE',c:'Sotto la tua croce apro le mia braccia,  \naccolgo il tuo perdono, la tua misericordia.  \nAdoro nel silenzio il tuo splendore,  \nil volto tuo che libera il mio cuore.  \n  \nMI ARRENDO AL TUO AMORE, SIGNORE GESÙ,   \nNON POSSO RESTARE LONTANO DA TE.  \nMI ARRENDO AL TUO AMORE, SIGNORE GESÙ,   \nALLA TUA PRESENZA PER SEMPRE RESTERÒ.  \n  \nAi piedi della croce visiti il mio cuore,  \nmi doni la tua pace,  consoli la mia vita.  \nContemplo la maestà della tua gloria,  \nil sangue tuo che sana le ferite. (RIT)',s:'mi arrendo al tuo amore sotto la tua croce apro le mia braccia accolgo il tuo perdono la tua misericordia adoro nel silenzio il tuo splendore il volto tuo che libera il mio cuore mi arrendo al tuo amore signore gesu non posso restare lontano da te mi arrendo al tuo amore signore gesu alla tua presenza per sempre restero ai piedi della croce visiti il mio cuore mi doni la tua pace consoli la mia vita contemplo la maesta della tua gloria il sangue tuo che sana le ferite rit 374',type:'N',i:406},
{n:'375',t:'O SIGNORE GUARDAMI',c:'O Signore, guardami, nella fede sono qui,  \nper toccare appeno il lembo del montello,  \ne la forza che verrà sarà come unguento che  \nmi risonerà e guarito io sarò.  \n  \nGESÙ, GESÙ VIENI IN ME E GUARISCIMI,  \nGESÙ VIENI IN ME E NELLA TUA PACE IO VIVRÒ.  \n  \nO Signore, guardaci, nello fede siamo qui,  \nil tuo Nome è potenza che guarisce  \ne se il mondo finirà, lo Parola resterà  \nperché tu sei via, vita e verità.  \n  \nGESÙ, GESÙ VIENI IN NOI E GUARISCICI,  \nGESÙ VIENI IN NOI E NELLA TUA PACE NOI VIVREMO.  \n  \nO Signore, guardaci, ai tuoi piedi siamo qui,  \ntu ci chiami olla presenza del tuo amore  \ned il cuore canta già la tua grande fedeltà,  \ntu ci doni vita nuova e libertà. (RIT) \n  \nGESÙ, GESÙ VIENI IN NOI E GUARISCICI,  \nO GESÙ, VIENI IN NOI  \nE NELLA TUA PACE NOI VIVREMO,  \nE NELLA TUA PACE NOI VIVREMO,  \nE NELLA TUA PACE IO VIVRÒ.',s:'o signore guardami o signore guardami nella fede sono qui per toccare appeno il lembo del montello e la forza che verra sara come unguento che mi risonera e guarito io saro gesu gesu vieni in me e guariscimi gesu vieni in me e nella tua pace io vivro o signore guardaci nello fede siamo qui il tuo nome e potenza che guarisce e se il mondo finira lo parola restera perche tu sei via vita e verita gesu gesu vieni in noi e guariscici gesu vieni in noi e nella tua pace noi vivremo o signore guardaci ai tuoi piedi siamo qui tu ci chiami olla presenza del tuo amore ed il cuore canta gia la tua grande fedelta tu ci doni vita nuova e liberta rit gesu gesu vieni in noi e guariscici o gesu vieni in noi e nella tua pace noi vivremo e nella tua pace noi vivremo e nella tua pace io vivro 375',type:'N',i:407},
{n:'376',t:'REDENTORE DELLE GENTI',c:'Redentore delle genti  \nci hai salvato col tuo grande amore,   \nbuon pastore, noi tuo gregge,   \nci conduci alla libertà.  \n  \nCRISTO SALVATORE  \nHAI POSTO IN MEZZO A NOI  \nLA TUA DIMORA  \nPER L\'ETERNITÀ.  \n  \nRedentore delle genti  \nti fai dono per l\'umanità,  \ntu sei il Verbo fatto carne,  \n\nnoi le membra del tuo divin corpo. (RIT) \n  \nRedentore delle genti  \nsei la luce nell\'oscurità,   \nnoi il tuo popolo fedele  \nche cammina nella verità. (RIT) \n  \nRedentore delle genti  \nsei speranza per l\'umanità,  \ntu la vite, noi i tuoi tralci,  \nnel tuo amore saldi noi vivremo. (RIT) \n \nPER L\'ETERNITA, PER L\'ETERNITÀ.',s:'redentore delle genti redentore delle genti ci hai salvato col tuo grande amore buon pastore noi tuo gregge ci conduci alla liberta cristo salvatore hai posto in mezzo a noi la tua dimora per l eternita redentore delle genti ti fai dono per l umanita tu sei il verbo fatto carne noi le membra del tuo divin corpo rit redentore delle genti sei la luce nell oscurita noi il tuo popolo fedele che cammina nella verita rit redentore delle genti sei speranza per l umanita tu la vite noi i tuoi tralci nel tuo amore saldi noi vivremo rit per l eternita per l eternita 376',type:'N',i:408},
{n:'377',t:'SERVIREMO IL SIGNORE',c:'Mi hai chiamato per nome,  \nmi hai donato la vita,  \nCreatore del mondo,  \nDio di eterna bontà.  \nTu sei il mio Signore,  \nil mio unico bene,  \nla mia anima esulta per te.  \n  \nQUANTO A ME E ALLA MIA CASA  \nSERVIREMO IL NOME TUO,  \nLA TUA VOCE, O SIGNORE, ASCOLTEREMO.  \nQUANTO A ME E ALLA MIA CASA  \nSERVIREMO IL NOME TUO,  \nED IL CUORE VOLGEREMO A TE, SIGNOR,   \nPER L\'ETERNITÀ.  \n  \nMi hai donato il tuo Spirito,  \nhai guarito il mio cuore,   \nSalvatore potente  \nmi hai plasmato per te.  \nDi te solo parlerò,  \nDio d\'amore e di pace,  \nla mia anima esulta per te. (RIT) \n \nPER L\'ETERNITÀ, PER L\'ETERNITÀ,  \nPER L\'ETERNITÀ, PER L\'ETERNITÀ,   \nNOI SERVIREMO TE PER L\'ETERNITÀ.',s:'serviremo il signore mi hai chiamato per nome mi hai donato la vita creatore del mondo dio di eterna bonta tu sei il mio signore il mio unico bene la mia anima esulta per te quanto a me e alla mia casa serviremo il nome tuo la tua voce o signore ascolteremo quanto a me e alla mia casa serviremo il nome tuo ed il cuore volgeremo a te signor per l eternita mi hai donato il tuo spirito hai guarito il mio cuore salvatore potente mi hai plasmato per te di te solo parlero dio d amore e di pace la mia anima esulta per te rit per l eternita per l eternita per l eternita per l eternita noi serviremo te per l eternita 377',type:'N',i:409},
{n:'378',t:'VERO CIBO È IL TUO CORPO',c:'Vero cibo è il tuo corpo  \ne bevanda il sangue tuo.  \nSe mangiamo questo pane,   \nsempre in noi dimorerai.  \n  \nTu sei il pane degli angeli,  \ncibo d\'immortalità.  \nTu sei il pane dell\'amore,  \nsacramento di pietà.  \n \nPANE SEI DISCESO A NOI DAL CIELO,  \nPANE CHE HA IN SÉ OGNI DOLCEZZA.   \nPANE DELLA VITA VIENI ANCORA IN NOI   \nE SAREMO UNITI PER L\'ETERNITÀ.  \nDACCI SEMPRE QUESTO PANE,  \nDACCI SEMPRE QUESTO PANE.  \n  \nPane che dai vita al mondo,  \ndona forza e santità.  \nCi sostieni nel cammino,  \nti adoriamo in verità.   \nO Signore, non siam degni  \ndi venire alla tua mensa.   \nDi\' soltanto una parola,  \nla salvezza ci darai. (RIT) \n \n DACCI SEMPRE QUESTO PANE.  \n \nTu sei il pane degli angeli,  \ncibo d\'immortalità.   \nTu sei il pane dell\'amore,  \nsacramento di bontà. (RIT)',s:'vero cibo e il tuo corpo vero cibo e il tuo corpo e bevanda il sangue tuo se mangiamo questo pane sempre in noi dimorerai tu sei il pane degli angeli cibo d immortalita tu sei il pane dell amore sacramento di pieta pane sei disceso a noi dal cielo pane che ha in se ogni dolcezza pane della vita vieni ancora in noi e saremo uniti per l eternita dacci sempre questo pane dacci sempre questo pane pane che dai vita al mondo dona forza e santita ci sostieni nel cammino ti adoriamo in verita o signore non siam degni di venire alla tua mensa di soltanto una parola la salvezza ci darai rit dacci sempre questo pane tu sei il pane degli angeli cibo d immortalita tu sei il pane dell amore sacramento di bonta rit 378',type:'N',i:410},
{n:'379',t:'IDDIO DIMORA NEL SUO TEMPIO',c:'Iddio  dimora nel suo tempio: \n \nadoriamo il Signor!  \nIddio dimora tra noi qui riuniti:  adoriamo il Signor!  \nGloria a lui! Gloria a lui!   \nAdoriamo il Signor! \nGloria a lui! Gloria a lui!   \nAdoriamo Gesù!  \n  \n  \nIddio dimora nel suo tempio:  \n \ncontempliamo il Signor! \nIddio dimora tra noi qui riuniti:   \ncontempliamo il Signor! \nGloria a lui! Gloria a lui! \n \nContempliamo il Signor! \nGloria a lui! Gloria a lui! \n \nContempliamo il Signor! \n\n \nIddio dimora nel suo tempio:  \n \ndiamo lode al Signor! \nIddio dimora tra noi qui riuniti:   \ndiamo lode al Signor! \nGloria a lui! Gloria a lui! \n \nDiamo lode al Signor! \nGloria a lui! Gloria a lui! \n \nDiamo lode al Signor! \n  \nIddio dimora nel suo tempio:  \n \ninneggiamo al Signor! \nIddio dimora tra noi qui riuniti:   \ninneggiamo al Signor! \nGloria a lui! Gloria a lui! \n \nInneggiamo al Signor! \nGloria a lui! Gloria a lui! \n \nInneggiamo al Signor!',s:'iddio dimora nel suo tempio iddio dimora nel suo tempio adoriamo il signor iddio dimora tra noi qui riuniti adoriamo il signor gloria a lui gloria a lui adoriamo il signor gloria a lui gloria a lui adoriamo gesu iddio dimora nel suo tempio contempliamo il signor iddio dimora tra noi qui riuniti contempliamo il signor gloria a lui gloria a lui contempliamo il signor gloria a lui gloria a lui contempliamo il signor iddio dimora nel suo tempio diamo lode al signor iddio dimora tra noi qui riuniti diamo lode al signor gloria a lui gloria a lui diamo lode al signor gloria a lui gloria a lui diamo lode al signor iddio dimora nel suo tempio inneggiamo al signor iddio dimora tra noi qui riuniti inneggiamo al signor gloria a lui gloria a lui inneggiamo al signor gloria a lui gloria a lui inneggiamo al signor 379',type:'N',i:411},
{n:'380',t:'SOLO TU IL MIO DIO',c:'SOLO TU IL MIO DIO,  \nSOLO TU LA MIA GIOIA.  \nDIFENDIMI   O  \nSIGNOR!  \n  \nCustodiscimi tu, o Signore,  \nperché solo in te ho fiducia  \nio ho detto a Dio:  \n\"Tu sei il mio unico bene, Signore!\". (RIT) \n  \nIl Signore è la mia eredità,  \nlui la parte del mio possesso,  \nmio calice e mia delizia,  \nin sue mani è la mia porzione. (RIT)  \n  \nUn podere in luoghi ameni  \ncome sorte mi ha assegnato,  \nsì, stupendo e gioioso e ricco è  \nil suo dono, il mio retaggio. (RIT) \n  \nLa mia vita di questo gioisce  \ned esulta lo spirito mio  \nil mio corpo riposa sicuro,  \nlui mi strappa di mano alla morte. (RIT) \n  \nChe non veda la fossa il tuo santo,  \nma la via alla vita m\' insegni:  \ngioia  piena alla tua presenza,  \nsolo gioia lo starti vicino. (RIT)',s:'solo tu il mio dio solo tu il mio dio solo tu la mia gioia difendimi o signor custodiscimi tu o signore perche solo in te ho fiducia io ho detto a dio tu sei il mio unico bene signore rit il signore e la mia eredita lui la parte del mio possesso mio calice e mia delizia in sue mani e la mia porzione rit un podere in luoghi ameni come sorte mi ha assegnato si stupendo e gioioso e ricco e il suo dono il mio retaggio rit la mia vita di questo gioisce ed esulta lo spirito mio il mio corpo riposa sicuro lui mi strappa di mano alla morte rit che non veda la fossa il tuo santo ma la via alla vita m insegni gioia piena alla tua presenza solo gioia lo starti vicino rit 380',type:'N',i:412},
{n:'381',t:'SU ALI D\'AQUILA',c:'Tu che abiti al riparo del Signore \n e che dimori alla sua ombra,  \ndì al Signore: \"Mio rifugio,  \nmia roccia in cui confido\".  \n  \nE TI RIALZERÀ, TI SOLLEVERÀ,  \nSU ALI D\'AQUILA TI REGGERÀ,  \nSULLA BREZZA DELL\'ALBA  \nTI FARÀ BRILLAR COME IL SOLE,  \nCOSÌ NELLE SUE MANI VIVRAI.  \n  \nDal laccio del cacciatore ti libererà  \ne dalla carestia che distrugge.  \nPoi ti coprirà con le sue ali  \ne rifugio troverai. (RIT)  \n  \nNon devi temere i terrori della notte  \nné freccia che vola di giorno  \nmille cadranno al tuo fianco  \nma nulla ti colpirà.  (RIT) \n  \nPerché ai suoi angeli ha dato un comando  \ndi preservarti in tutte le tue vie  \nti porteranno sulle loro mani  \ncontro la pietra non inciamperai. (RIT)   \n  \nE TI RIALZERÒ, TI SOLLEVERÒ,  \nSU ALI D\'AQUILA TI REGGERÒ,  \nSULLA BREZZA DELL\'ALBA  \nTI FARÒ BRILLAR COME IL SOLE,  \nCOSÌ NELLE MIE MANI VIVRAI.',s:'su ali d aquila tu che abiti al riparo del signore e che dimori alla sua ombra di al signore mio rifugio mia roccia in cui confido e ti rialzera ti sollevera su ali d aquila ti reggera sulla brezza dell alba ti fara brillar come il sole cosi nelle sue mani vivrai dal laccio del cacciatore ti liberera e dalla carestia che distrugge poi ti coprira con le sue ali e rifugio troverai rit non devi temere i terrori della notte ne freccia che vola di giorno mille cadranno al tuo fianco ma nulla ti colpira rit perche ai suoi angeli ha dato un comando di preservarti in tutte le tue vie ti porteranno sulle loro mani contro la pietra non inciamperai rit e ti rialzero ti sollevero su ali d aquila ti reggero sulla brezza dell alba ti faro brillar come il sole cosi nelle mie mani vivrai 381',type:'N',i:413},
{n:'382',t:'AVE REGINA',c:'Ave Regina, madre di grazia,  \nfulgida stella, fuoco d\'amore.   \n \nSciogli il mio cuore al divin sole,   \nfai   germogliare il Salvatore.  \n  \nLUCE DEL MATTINO  \nCHE ILLUMINI IL CAMMINO   \nRIEMPI Il MIO CUORE  \nDI FEDE E CARITÀ.  \nGUIDAMI, O MADRE,  \n\nVERSO GESÙ, VERSO GESÙ.  \n  \nAve Regina, porta del cielo,  \ndolce rifugio, consolazione.  \n \nConduci il mio sguardo al Redentore,  \nmanda dal cielo benedizione.  \n  \nLUCE  DEL MATTINO  \nCHE ILLUMINI IL CAMMINO    \nRIEMPI IL MIO CUORE  \nDI FEDE E CARITÀ.  \nGUIDAMI, O MADRE,  \nVERSO GESÙ, VERSO GESÙ.  \nVERSO GESU. \n  \nAve Regina, vergine e sposa,  \nmistico grembo, splendido fiore.  \n \nEleva al tuo Figlio questo mio canto,  \nvesti di gioia questo mio  cuore.  \n  \nLUCE DEL MATIINO  \nCHE ILLUMINI IL CAMMINO  \nA TE DOLCE E PIA  \nRENDO GRAZIE, O MARIA.  \nLA MIA PREGHIERA  \nVOLA VERSO GESÙ, \nVERSO GESÙ,   \nVERSO GESÙ.',s:'ave regina ave regina madre di grazia fulgida stella fuoco d amore sciogli il mio cuore al divin sole fai germogliare il salvatore luce del mattino che illumini il cammino riempi il mio cuore di fede e carita guidami o madre verso gesu verso gesu ave regina porta del cielo dolce rifugio consolazione conduci il mio sguardo al redentore manda dal cielo benedizione luce del mattino che illumini il cammino riempi il mio cuore di fede e carita guidami o madre verso gesu verso gesu verso gesu ave regina vergine e sposa mistico grembo splendido fiore eleva al tuo figlio questo mio canto vesti di gioia questo mio cuore luce del matiino che illumini il cammino a te dolce e pia rendo grazie o maria la mia preghiera vola verso gesu verso gesu verso gesu 382',type:'N',i:414},
{n:'383',t:'CON QUESTO PANE, CON QUESTO VINO',c:'In questo pane  \nnoi riceviamo il \nvero corpo  \ndel Salvatore  \nche si fa cibo  \nper tutti noi.  \n  \nCON QUESTO PANE,  \nCON QUESTO VINO  \nGESÙ SIGNORE  \nDIMORA IN MEZZO A NOI,  \nÈ LA SALVEZZA  \nOFFERTA AD OGNI UOMO.  \n\n  \nIn questo vino  \nnoi riceviamo il  \nvero sangue  \ndell\'alleanza  \nche è bevanda  \nper tutti noi. (RIT)  \n  \nSu questa mensa  \nnoi celebriamo il  \nsacrificio  \ndel Redentore  \nche ci consacra  \nnel suo amore.  \n(RIT)',s:'con questo pane con questo vino in questo pane noi riceviamo il vero corpo del salvatore che si fa cibo per tutti noi con questo pane con questo vino gesu signore dimora in mezzo a noi e la salvezza offerta ad ogni uomo in questo vino noi riceviamo il vero sangue dell alleanza che e bevanda per tutti noi rit su questa mensa noi celebriamo il sacrificio del redentore che ci consacra nel suo amore rit 383',type:'N',i:415},
{n:'384',t:'DIFENDIMI SIGNORE',c:'Manda la tua luce, la tua verità  \nperché mi guidino  \ne mi conducano alle tue dimore.  \nIo mi avvicinerò  \nal tuo santo altare   \ne ti celebrerò Signor.  \n  \nFAMMI GIUSTIZIA O DIO, DIFENDIMI SIGNOR,  \nDA COLUI CHE È MALVAGIO TU LIBERAMI  \nE QUANDO CADO NEL PECCATO RIALZAMI,  \nDEL TUO AMORE RIEMPIMI.  \nFAMMI GIUSTIZIA O DIO,DIFENDIMI SIGNOR,  \nDA COLUI CHE È MALVAGIO TU LIBERAMI   \nE QUANDO CADO NEL PECCATO RIALZAMI,   \nCONFIDO IN TE GESÙ.  \n  \nTu sei la mia forza, sei la fedeltà,   \nnon mi abbandonerai  \ne dal nemico mi proteggerai  \nIo mi avvicinerò  \nal tuo santo altare  \ne ti celebrerò Signor (RIT)',s:'difendimi signore manda la tua luce la tua verita perche mi guidino e mi conducano alle tue dimore io mi avvicinero al tuo santo altare e ti celebrero signor fammi giustizia o dio difendimi signor da colui che e malvagio tu liberami e quando cado nel peccato rialzami del tuo amore riempimi fammi giustizia o dio difendimi signor da colui che e malvagio tu liberami e quando cado nel peccato rialzami confido in te gesu tu sei la mia forza sei la fedelta non mi abbandonerai e dal nemico mi proteggerai io mi avvicinero al tuo santo altare e ti celebrero signor rit 384',type:'N',i:416},
{n:'385',t:'DONAMI IL TUO AMORE',c:'All\'aurora il mio spirito ti cerca  \ncome terra arida senz\'acqua.  \nO Signore vieni in mio aiuto,  \n\nla tua mano poni su di me.  \n  \nVengo a te Signore della vita,  \nla mia anima anela solo a te.  \ni miei occhi cercano il tuo volto  \nmio Dio, mio Re.  \n  \nDONAMI IL TUO AMORE, O SIGNOR,  \nCON IL TUO POTERE TOCCAMI,  \nMANDA LA TUA GRAZIA  \nCOME UN FIUME SU DI ME   \nE LIBERAMI, CONSOLAMI, GUARISCIMI.  \n  \nHo bisogno di te, o mio Signore,   \nla tua pace scenda nel mio cuore.   \nCome un cieco cerco la tua luce,   \nla tua mano guidi i passi miei.  \n  \nVengo a te Signore della vita,   \nla mia anima anela solo a te.  \nI miei occhi cercano il tuo volto  \nmio Dio, mio Re. (RIT)',s:'donami il tuo amore all aurora il mio spirito ti cerca come terra arida senz acqua o signore vieni in mio aiuto la tua mano poni su di me vengo a te signore della vita la mia anima anela solo a te i miei occhi cercano il tuo volto mio dio mio re donami il tuo amore o signor con il tuo potere toccami manda la tua grazia come un fiume su di me e liberami consolami guariscimi ho bisogno di te o mio signore la tua pace scenda nel mio cuore come un cieco cerco la tua luce la tua mano guidi i passi miei vengo a te signore della vita la mia anima anela solo a te i miei occhi cercano il tuo volto mio dio mio re rit 385',type:'N',i:417},
{n:'386',t:'GLORIA NOI CANTIAMO AL RE',c:'Non ha alcun senso questa vita senza te,  \nin questo mondo in cui non c\'è armonia   \nsalvaci tu Signore, vieni liberatore.  \n  \nSPLENDA LA LUCE DEL TUO IMMENSO AMOR  \nSU OGNI UOMO,  \nTUTTO IL CREATO CELEBRI LA TUA REGALITÀ,  \nGLORIA, GLORIA, GLORIA.  \nNOI CANTIAMO AL  RE,  \nGESÙ È IL SIGNORE,  \nGLORIA, GLORIA, GLORIA.   \nNOI CANTIAMO AL  RE,  \nNOI CANTIAMO AL RE.  \n  \n  \n  \n     \nSolo di te ha bisogno questa umanità,    \n  \n     \ninfondi la speranza in tutti noi,  \nguidaci tu Signore,  \nvieni, o buon Pastore.  \n (RIT)    \n     \n  \nEcco i tuoi figli son riuniti qui per te,  \nfacci strumento della tua bontà,  \nplasmaci tu Signore,  \n\nvieni, o Redentore.  \n \nSPLENDA LA LUCE DEL TUO IMMENSO AMOR  \nSU  OGNI UOMO, \nTUTTO IL CREATO CELEBRI LA TUA REGALITÀ,  \nGLORIA, GLORIA, GLORIA.  \nNOI CANTIAMO AL  RE,  \nGESÙ È IL SIGNORE, \nGLORIA, GLORIA, GLORIA.  \nNOI CANTIAMO AL  RE,  \nGESÙ È IL SIGNORE,  \nGLORIA, GLORIA, GLORIA.  \nNOI CANTIAMO AL  RE,  \nNOI CANTIAMO AL RE,  \nCANTIAMO AL RE.',s:'gloria noi cantiamo al re non ha alcun senso questa vita senza te in questo mondo in cui non c e armonia salvaci tu signore vieni liberatore splenda la luce del tuo immenso amor su ogni uomo tutto il creato celebri la tua regalita gloria gloria gloria noi cantiamo al re gesu e il signore gloria gloria gloria noi cantiamo al re noi cantiamo al re solo di te ha bisogno questa umanita infondi la speranza in tutti noi guidaci tu signore vieni o buon pastore rit ecco i tuoi figli son riuniti qui per te facci strumento della tua bonta plasmaci tu signore vieni o redentore splenda la luce del tuo immenso amor su ogni uomo tutto il creato celebri la tua regalita gloria gloria gloria noi cantiamo al re gesu e il signore gloria gloria gloria noi cantiamo al re gesu e il signore gloria gloria gloria noi cantiamo al re noi cantiamo al re cantiamo al re 386',type:'N',i:418},
{n:'387',t:'IN UNA NOTTE COME TANTE',c:'Una notte come tante,  \nin una città qualunque,  \nper una strada un po\' isolata  \nun pastore torna a casa,  \nil pastore guarda avanti  \ne per il freddo stringe i denti,  \ngià s\'immagina il ristoro  \ndopo un giorno di lavoro.  \nMa nell\'aria c\'è qualcosa  \nche lo abbraccia  \ne ad un tratto  \nuna voce nella testa.  \n  \nIn questa notte come tante  \nquesto mondo cambia rotta,  \nnasce Dio, bambino in una grotta.  \n  \nAd un tratto quel posto  \nsi riempie di persone,  \ntutti vanno a quella grotta  \ncome fosse ad un altare   \ne Giuseppe non capisce  \ncosa accade nella via,  \nma poi incontra la dolcezza  \ndello sguardo di Maria,   \nche come sempre ha capito  \ngià ogni cosa ed assiste  \nalla scena silenziosa.  \n\n  \nIn questa notte come tante  \noggi il mondo cambia rotta,  \nnasce Dio, bambino in una grotta.  \n \nCOME BREZZA LEGGERA  \nCHE ACCAREZZA L\'ANIMA  \nVIENI BAMBINO IN QUESTA FREDDA CITIÀ,  \nTRA LA POVERA GENTE  \nE ANCHE TU NON HAI NIENTE,  \nMA IL TUO AMORE RESTERÀ PER SEMPRE.  \n \nIn una notte come tante  \nin una città qualunque  \nc\'è chi adesso torna a casa  \ne chi aspetta in una chiesa,  \nc\'è qualcuno che usa ancora  \nla violenza e chi cerca  \normai deluso una speranza.  \n  \nMa tu vieni e prova ancora  \na cambiare questa rotta,  \nnasci qui, bambino in questa grotta.  \n  \nCOME BREZZA LEGGERA  \nCHE ACCAREZZA L\'ANIMA  \nVIENI INDIFESO  \nIN QUESTA PICCOLA CITIÀ,  \nTRA LA POVERA GENTE  \nE ANCHE TU NON HAI NIENTE,  \nMA IL TUO AMORE ARRIVERÀ.  \nCOME BREZZA LEGGERA  \nCHE ACCAREZZA  L\'ANIMA,   \nVIENI BAMBINO  \nIN QUESTA PICCOLA CITTA,   \nTRA LA POVERA GENTE  \nE ANCHE TU NON HAI NIENTE,  \nMA IL TUO AMORE RESTERÀ PER SEMPRE.',s:'in una notte come tante una notte come tante in una citta qualunque per una strada un po isolata un pastore torna a casa il pastore guarda avanti e per il freddo stringe i denti gia s immagina il ristoro dopo un giorno di lavoro ma nell aria c e qualcosa che lo abbraccia e ad un tratto una voce nella testa in questa notte come tante questo mondo cambia rotta nasce dio bambino in una grotta ad un tratto quel posto si riempie di persone tutti vanno a quella grotta come fosse ad un altare e giuseppe non capisce cosa accade nella via ma poi incontra la dolcezza dello sguardo di maria che come sempre ha capito gia ogni cosa ed assiste alla scena silenziosa in questa notte come tante oggi il mondo cambia rotta nasce dio bambino in una grotta come brezza leggera che accarezza l anima vieni bambino in questa fredda citia tra la povera gente e anche tu non hai niente ma il tuo amore restera per sempre in una notte come tante in una citta qualunque c e chi adesso torna a casa e chi aspetta in una chiesa c e qualcuno che usa ancora la violenza e chi cerca ormai deluso una speranza ma tu vieni e prova ancora a cambiare questa rotta nasci qui bambino in questa grotta come brezza leggera che accarezza l anima vieni indifeso in questa piccola citia tra la povera gente e anche tu non hai niente ma il tuo amore arrivera come brezza leggera che accarezza l anima vieni bambino in questa piccola citta tra la povera gente e anche tu non hai niente ma il tuo amore restera per sempre 387',type:'N',i:419},
{n:'388',t:'INVOCHIAMO LA TUA PRESENZA',c:'Invochiamo la tua presenza vieni Signor,  \ninvochiamo la tua presenza scendi su di noi.  \nVieni Consolatore dona pace ed umiltà,  \nacqua viva d\'amore questo cuore apriamo a te.  \n  \n\nVIENI SPIRITO, VIENI SPIRITO SCENDI SU DI NOI.  \nVIENI SPIRITO, VIENI SPIRITO SCENDI SU DI NOI.  \nVIENI SU NOI MARANATHÀ, VIENI SU NOI SPIRITO.  \nVIENI SPIRITO, VIENI SPIRITO SCENDI SU DI NOI.  \nVIENI SPIRITO, VIENI SPIRITO SCENDI SU DI NOI,   \nSCENDI SU DI NOI.  \n  \nInvochiamo la tua presenza vieni Signor,  \ninvochiamo la tua presenza scendi su di noi.  \nVieni luce dei cuori dona forza e fedeltà,  \nfuoco eterno d\'amore questa vita offriamo a te. (RIT) \n  \nVIENI SPIRITO, VIENI SPIRITO SCENDI SU DI NOI.  \nVIENI SPIRITO, VIENI SPIRITO SCENDI SU DI NOI.',s:'invochiamo la tua presenza invochiamo la tua presenza vieni signor invochiamo la tua presenza scendi su di noi vieni consolatore dona pace ed umilta acqua viva d amore questo cuore apriamo a te vieni spirito vieni spirito scendi su di noi vieni spirito vieni spirito scendi su di noi vieni su noi maranatha vieni su noi spirito vieni spirito vieni spirito scendi su di noi vieni spirito vieni spirito scendi su di noi scendi su di noi invochiamo la tua presenza vieni signor invochiamo la tua presenza scendi su di noi vieni luce dei cuori dona forza e fedelta fuoco eterno d amore questa vita offriamo a te rit vieni spirito vieni spirito scendi su di noi vieni spirito vieni spirito scendi su di noi 388',type:'N',i:420},
