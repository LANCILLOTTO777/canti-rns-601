{n:'524',t:'AFFIDATI A DIO',c:'Sai che in mezzo a tanti pensieri  \nc\'è una voce che grida forte, \ne c\'è stata da sempre,  \nmi ha parlato più volte, \nè un progetto più grande per me. \nSai che in mezzo a troppe domande  \nla risposta è più semplice, \nnei disegni del Padre  \nc\'è il senso di tutto, \nun sogno su misura per te. \n \nAFFIDATI A DIO E LODALO SEMPRE, \nRESTA CON LUI CHE HA VINTO PER NOI, \nGRANDE E POTENTE SPERANZA PER TUTTA L\'UMANITÀ. \n \nOh (alleluia) \n \nC\'è chi vive tra mille paure,  \nprigioniero della vergogna. \nNoi viviamo da figli,  \nnon viviamo da schiavi, \nla paura non fa parte di noi. \nCanta l\'inno di gioia e salvezza,  \nin Gesù tu sei libero. \nSe cadrai non fermarti, \nbrucia forte nel petto \nil tuo sogno,  \nil più grande che hai.  \n \n\nAFFIDATI A DIO E LODALO SEMPRE, \nRESTA CON LUI CHE HA VINTO PER NOI, \nGRANDE E POTENTE SPERANZA PER TUTTA L\'UMANITÀ.',s:'affidati a dio sai che in mezzo a tanti pensieri c e una voce che grida forte e c e stata da sempre mi ha parlato piu volte e un progetto piu grande per me sai che in mezzo a troppe domande la risposta e piu semplice nei disegni del padre c e il senso di tutto un sogno su misura per te affidati a dio e lodalo sempre resta con lui che ha vinto per noi grande e potente speranza per tutta l umanita oh alleluia c e chi vive tra mille paure prigioniero della vergogna noi viviamo da figli non viviamo da schiavi la paura non fa parte di noi canta l inno di gioia e salvezza in gesu tu sei libero se cadrai non fermarti brucia forte nel petto il tuo sogno il piu grande che hai affidati a dio e lodalo sempre resta con lui che ha vinto per noi grande e potente speranza per tutta l umanita 524',type:'N',i:556},
{n:'525',t:'DIO CHE TUTTO PUOI',c:'La tua parola o Dio corre veloce, \nopera grazie e prodigi, ridona la pace. \nSpalanca adesso gli occhi del mio cuore, \nche io ti veda splendere di gloria o mio Signore. \n \nDIO CHE TUTTO PUOI AUMENTA LA MIA FEDE, \nDIO CHE TUTTO PUOI, COLMA QUESTA SETE. \nRINNOVA LA MIA VITA IN TE A LODE DEL TUO SANTO NOME, \nCHE SIA TESTIMONE ANCH\'IO PER SEMPRE DEL TUO AMORE. \n \nLa tua parola o Dio è la mia salvezza, \nè come acqua nel deserto, è una dolce brezza, \nspalanca adesso gli occhi del mio cuore \nche io ti veda splendere di gloria o mio Signore.  \n \nDIO CHE TUTTO PUOI AUMENTA LA MIA FEDE, \nDIO CHE TUTTO PUOI, COLMA QUESTA SETE. \nRINNOVA LA MIA VITA IN TE A LODE DEL TUO SANTO NOME, \nCHE SIA TESTIMONE ANCH\'IO PER SEMPRE DEL TUO AMORE. \n \nPonte \nche libera, purifica \nè luce che sovrasta ogni paura nella notte, \ncolonna di fuoco che illumina e guida, \nche dona la gioia piena. \n \nDIO CHE TUTTO PUOI AUMENTA LA MIA FEDE, \nDIO CHE TUTTO PUOI, COLMA QUESTA SETE. \nRINNOVA LA MIA VITA IN TE A LODE DEL TUO SANTO NOME, \nCHE SIA TESTIMONE ANCH\'IO PER SEMPRE DEL TUO AMORE. \n \nFinale: \nDIO CHE TUTTO PUOI AUMENTA LA MIA FEDE',s:'dio che tutto puoi la tua parola o dio corre veloce opera grazie e prodigi ridona la pace spalanca adesso gli occhi del mio cuore che io ti veda splendere di gloria o mio signore dio che tutto puoi aumenta la mia fede dio che tutto puoi colma questa sete rinnova la mia vita in te a lode del tuo santo nome che sia testimone anch io per sempre del tuo amore la tua parola o dio e la mia salvezza e come acqua nel deserto e una dolce brezza spalanca adesso gli occhi del mio cuore che io ti veda splendere di gloria o mio signore dio che tutto puoi aumenta la mia fede dio che tutto puoi colma questa sete rinnova la mia vita in te a lode del tuo santo nome che sia testimone anch io per sempre del tuo amore ponte che libera purifica e luce che sovrasta ogni paura nella notte colonna di fuoco che illumina e guida che dona la gioia piena dio che tutto puoi aumenta la mia fede dio che tutto puoi colma questa sete rinnova la mia vita in te a lode del tuo santo nome che sia testimone anch io per sempre del tuo amore finale dio che tutto puoi aumenta la mia fede 525',type:'N',i:557},
{n:'526',t:'DIO DELLA STORIA',c:'Possiamo ogni cosa in colui  \nche ci da la forza e la libertà, \nnon c\'è altra quiete al di sopra  \n\nné a parità della pace del cuore. \nSaziamoci dell’abbondanza della sua casa, dimora per noi, \nbeviamo al torrente infinito  \ndi quelle delizie che dona Gesù. \n \nORA, HO POSTO IN TE LA FIDUCIA  \nED ESULTA IL MIO CUORE, \nSIGNORE DI OGNI TEMPO, \nGRANDI COSE TU HAI FATTO IN QUESTA MIA VITA  \nO DIO DELLA STORIA, \nNEL TUO VOLERE IO TROVO DA SEMPRE LA GIOIA, \nLA TUA PAROLA È IL MIO CIBO, \nSEI LA FONTE DA CUI SCATURISCE  \nL’AMORE E LA VITA ETERNA. \n \nOh \n \nPossiamo ogni cosa in colui  \nche dona la vita nella santità, \nlasciamo nel mondo i segni  \ndella nostra fede a gloria di Dio, \napriamoci alla speranza  \ndella promessa pronta per noi, \ntralci uniti alla vite,  \nsaremo una sola cosa in Gesù. \n \nORA, HO POSTO IN TE LA FIDUCIA  \nED ESULTA IL MIO CUORE, \nSIGNORE DI OGNI TEMPO, \nGRANDI COSE TU HAI FATTO IN QUESTA MIA VITA  \nO DIO DELLA STORIA, \nNEL TUO VOLERE IO TROVO DA SEMPRE LA GIOIA, \nLA TUA PAROLA È IL MIO CIBO, \nSEI LA FONTE DA CUI SCATURISCE  \nL’AMORE E LA VITA ETERNA.',s:'dio della storia possiamo ogni cosa in colui che ci da la forza e la liberta non c e altra quiete al di sopra ne a parita della pace del cuore saziamoci dell abbondanza della sua casa dimora per noi beviamo al torrente infinito di quelle delizie che dona gesu ora ho posto in te la fiducia ed esulta il mio cuore signore di ogni tempo grandi cose tu hai fatto in questa mia vita o dio della storia nel tuo volere io trovo da sempre la gioia la tua parola e il mio cibo sei la fonte da cui scaturisce l amore e la vita eterna oh possiamo ogni cosa in colui che dona la vita nella santita lasciamo nel mondo i segni della nostra fede a gloria di dio apriamoci alla speranza della promessa pronta per noi tralci uniti alla vite saremo una sola cosa in gesu ora ho posto in te la fiducia ed esulta il mio cuore signore di ogni tempo grandi cose tu hai fatto in questa mia vita o dio della storia nel tuo volere io trovo da sempre la gioia la tua parola e il mio cibo sei la fonte da cui scaturisce l amore e la vita eterna 526',type:'N',i:558},
{n:'527',t:'LIBERI',c:'Libertà per chi ascolterà, \namerà ed accoglierà la Parola,  \nla Parola di Dio. \nOggi no, non c’è schiavitù, \nper amor ci salvasti tu sulla croce,  \nsulla croce Gesù. \n \nLA VERITÀ CI HA FATTO LIBERI, \n\nE ADESSO SIAMO LIBERI DI SEGUIRE LA TUA VOLONTÀ. \nNEL MONDO SIAMO LIBERI, PER SEMPRE SIAMO LIBERI, \nDI CERCARE, DI SPERARE IN TE L’ETERNITÀ. \n \nServi no, siamo amici tuoi, \nschiavi mai, siamo figli ormai, \nnel tuo nome nel tuo nome Gesù!  \n \nLA VERITÀ CI HA FATTO LIBERI, \nE ADESSO SIAMO LIBERI DI SEGUIRE LA TUA VOLONTÀ. \nNEL MONDO SIAMO LIBERI, PER SEMPRE SIAMO LIBERI, \nDI CERCARE, DI SPERARE IN TE L’ETERNITÀ. \n \nPonte \nLiberi, liberi di cercarti \nLiberi, liberi di seguirti \nLiberi, liberi di annunciarti \nGesù, Gesù. (x 2)  \n \nLA VERITÀ CI HA FATTO LIBERI, \nE ADESSO SIAMO LIBERI DI SEGUIRE LA TUA VOLONTÀ. \nNEL MONDO SIAMO LIBERI, PER SEMPRE SIAMO LIBERI, \nDI CERCARE, DI SPERARE IN TE L’ETERNITÀ.',s:'liberi liberta per chi ascoltera amera ed accogliera la parola la parola di dio oggi no non c e schiavitu per amor ci salvasti tu sulla croce sulla croce gesu la verita ci ha fatto liberi e adesso siamo liberi di seguire la tua volonta nel mondo siamo liberi per sempre siamo liberi di cercare di sperare in te l eternita servi no siamo amici tuoi schiavi mai siamo figli ormai nel tuo nome nel tuo nome gesu la verita ci ha fatto liberi e adesso siamo liberi di seguire la tua volonta nel mondo siamo liberi per sempre siamo liberi di cercare di sperare in te l eternita ponte liberi liberi di cercarti liberi liberi di seguirti liberi liberi di annunciarti gesu gesu x 2 la verita ci ha fatto liberi e adesso siamo liberi di seguire la tua volonta nel mondo siamo liberi per sempre siamo liberi di cercare di sperare in te l eternita 527',type:'N',i:559},
{n:'528',t:'MI AMI TU?',c:'MI AMI TU, MI AMI? \nDIMMELO ANCORA CHE MI AMI. \nLO SAI GESÙ CHE T\'AMO, IO T\'AMO, \nE NON VORREI MAI PIÙ LASCIARTI  \nE NON VORREI MAI PIÙ TRADIRTI, \nMA SOLO AMARTI, E IN TUTTI AMARTI,  \nPER SEMPRE AMARTI GESÙ. \n \nSeguimi, mi chiami come allora, \npasci, di me ti fidi ancora, \nprendi il largo, il tuo regno affidi a me. (x2) \n \nMI AMI TU, MI AMI? \nDIMMELO ANCORA CHE MI AMI. \nLO SAI GESÙ CHE T\'AMO, IO T\'AMO, \nE NON VORREI MAI PIÙ LASCIARTI  \nE NON VORREI MAI PIÙ TRADIRTI, \nMA SOLO AMARTI, E IN TUTTI AMARTI,  \nPER SEMPRE AMARTI GESÙ. \n\n \n... MA SOLO AMARTI, E IN TUTTI AMARTI,  \nPER SEMPRE AMARTI GESÙ. \nAMARTI DI PIÙ, GESÙ, GESÙ, GESÙ.',s:'mi ami tu mi ami tu mi ami dimmelo ancora che mi ami lo sai gesu che t amo io t amo e non vorrei mai piu lasciarti e non vorrei mai piu tradirti ma solo amarti e in tutti amarti per sempre amarti gesu seguimi mi chiami come allora pasci di me ti fidi ancora prendi il largo il tuo regno affidi a me x2 mi ami tu mi ami dimmelo ancora che mi ami lo sai gesu che t amo io t amo e non vorrei mai piu lasciarti e non vorrei mai piu tradirti ma solo amarti e in tutti amarti per sempre amarti gesu ma solo amarti e in tutti amarti per sempre amarti gesu amarti di piu gesu gesu gesu 528',type:'N',i:560},
{n:'529',t:'MI HAI AMATO PER PRIMO',c:'Prima che io fossi, prima che nascessi, \ndal grembo di mia madre tu mi hai chiamato. \nTu che mi hai plasmato e mi hai custodito, \nsul palmo della mano mi hai disegnato. \n \nTU CHE MI HAI AMATO PER PRIMO, \nPADRE DI MISERICORDIA ACCOGLI LA MIA LODE. \nVOLTO DELLA VERITÀ, GIOIA DEL MATTINO, \nRENDI LA MIA VITA UN MIRACOLO D’AMOR. \n \nPadre generoso, luce nel cammino, \nin ogni mio passo tu mi hai guidato. \nNemmeno un solo istante dimentichi il mio nome, \nnemmeno un momento tu guardi altrove.  \n \nTU CHE MI HAI AMATO PER PRIMO, \nPADRE DI MISERICORDIA ACCOGLI LA MIA LODE. \nVOLTO DELLA VERITÀ, GIOIA DEL MATTINO, \nRENDI LA MIA VITA UN MIRACOLO D’AMOR. \n \nPonte: \nHai amato me, hai amato me, \nper primo hai amato me. (2 volte) \n \nHai cercato me, hai cercato me, \nper primo hai cercato me. (2 volte) \n \nHai chiamato me, hai chiamato me, \nper primo hai chiamato me. (2 volte) \n \nFinale: \nHai amato me, hai amato me, \nper primo hai amato me. (2 volte)',s:'mi hai amato per primo prima che io fossi prima che nascessi dal grembo di mia madre tu mi hai chiamato tu che mi hai plasmato e mi hai custodito sul palmo della mano mi hai disegnato tu che mi hai amato per primo padre di misericordia accogli la mia lode volto della verita gioia del mattino rendi la mia vita un miracolo d amor padre generoso luce nel cammino in ogni mio passo tu mi hai guidato nemmeno un solo istante dimentichi il mio nome nemmeno un momento tu guardi altrove tu che mi hai amato per primo padre di misericordia accogli la mia lode volto della verita gioia del mattino rendi la mia vita un miracolo d amor ponte hai amato me hai amato me per primo hai amato me 2 volte hai cercato me hai cercato me per primo hai cercato me 2 volte hai chiamato me hai chiamato me per primo hai chiamato me 2 volte finale hai amato me hai amato me per primo hai amato me 2 volte 529',type:'N',i:561},
{n:'530',t:'NUOVA LUCE C\'E\'',c:'Cerco te, cerco la pace e l\'amore, \nveglia su di me, io spero in te. \nDove andar, dove trovare risposte, \n\nalzo gli occhi al ciel e vedo che... \n \nNUOVA LUCE C’È, TUTTO RINASCE CON TE, \nSÌ, TUTTO RIVIVE IN TE, SIGNOR, \nTU SEI L’UNICA VIA,  \nTU NON DELUDI MAI CHI CONFIDA IN TE. \nTUTTO RINASCE CON TE, SÌ,  \nTUTTO RIVIVE IN TE, SIGNOR, \nIL TUO FUOCO D\'AMOR  \nSEMPRE ACCESO SARÀ PER L\'UMANITÀ. \n \nSogno che nel mondo regni l’amore, \nusami Signor come vuoi tu. \nSo che tu, tu sei la vera risposta \nguardo intorno a me e annuncio che...  \n \nNUOVA LUCE C’È, TUTTO RINASCE CON TE, \nSÌ, TUTTO RIVIVE IN TE, SIGNOR, \nTU SEI L’UNICA VIA,  \nTU NON DELUDI MAI CHI CONFIDA IN TE. \nTUTTO RINASCE CON TE, SÌ,  \nTUTTO RIVIVE IN TE, SIGNOR, \nIL TUO FUOCO D\'AMOR  \nSEMPRE ACCESO SARÀ PER L\'UMANITÀ.',s:'nuova luce c e cerco te cerco la pace e l amore veglia su di me io spero in te dove andar dove trovare risposte alzo gli occhi al ciel e vedo che nuova luce c e tutto rinasce con te si tutto rivive in te signor tu sei l unica via tu non deludi mai chi confida in te tutto rinasce con te si tutto rivive in te signor il tuo fuoco d amor sempre acceso sara per l umanita sogno che nel mondo regni l amore usami signor come vuoi tu so che tu tu sei la vera risposta guardo intorno a me e annuncio che nuova luce c e tutto rinasce con te si tutto rivive in te signor tu sei l unica via tu non deludi mai chi confida in te tutto rinasce con te si tutto rivive in te signor il tuo fuoco d amor sempre acceso sara per l umanita 530',type:'N',i:562},
{n:'531',t:'SPEZZA LE CATENE',c:'Questo povero grida e tu lo ascolterai, \nla mia anima spera e tu la esaudirai. \nDio che dai la vittoria a chi si affida a te, \nil tuo braccio potente stendi su di me, liberami! \n \nSPEZZA LE CATENE DI OGNI MALE, \nVINCI IL MIO PECCATO  \nE IL MIO DOLORE CHE ORA SALE FINO A TE, \nFINO AL TRONO DELL’AMORE CHE VINCE OGNI PAURA, \nPERCHÉ LA TUA GIOIA IN ME SIA PIENA E \nLA CONSOLAZIONE CHE TU RIVERSI SU DI ME MI DA FORZA, \nIL MIO CALICE TRABOCCA,  \nLA TUA GRAZIA MI SOSTIENE E MI BASTA. \n \nIl mio cuore riposa e trova pace in te, \nnon si addormenta il custode d\'Israele. \nFonte della mia vita e del mio bene, \nil tuo braccio potente stendi su di me, liberami.  \n \nSPEZZA LE CATENE DI OGNI MALE, \n\nVINCI IL MIO PECCATO  \nE IL MIO DOLORE CHE ORA SALE FINO A TE, \nFINO AL TRONO DELL’AMORE CHE VINCE OGNI PAURA, \nPERCHÉ LA TUA GIOIA IN ME SIA PIENA E \nLA CONSOLAZIONE CHE TU RIVERSI SU DI ME MI DA FORZA, \nIL MIO CALICE TRABOCCA,  \nLA TUA GRAZIA MI SOSTIENE E MI BASTA. \n \nPonte: \nNotte, tenebre e nebbia, fuggite, entra la luce. (X2)  \n \nSPEZZA LE CATENE DI OGNI MALE, \nVINCI IL MIO PECCATO  \nE IL MIO DOLORE CHE ORA SALE FINO A TE, \nFINO AL TRONO DELL’AMORE CHE VINCE OGNI PAURA, \nPERCHÉ LA TUA GIOIA IN ME SIA PIENA E \nLA CONSOLAZIONE CHE TU RIVERSI SU DI ME MI DA FORZA, \nIL MIO CALICE TRABOCCA,  \nLA TUA GRAZIA MI SOSTIENE E MI BASTA.',s:'spezza le catene questo povero grida e tu lo ascolterai la mia anima spera e tu la esaudirai dio che dai la vittoria a chi si affida a te il tuo braccio potente stendi su di me liberami spezza le catene di ogni male vinci il mio peccato e il mio dolore che ora sale fino a te fino al trono dell amore che vince ogni paura perche la tua gioia in me sia piena e la consolazione che tu riversi su di me mi da forza il mio calice trabocca la tua grazia mi sostiene e mi basta il mio cuore riposa e trova pace in te non si addormenta il custode d israele fonte della mia vita e del mio bene il tuo braccio potente stendi su di me liberami spezza le catene di ogni male vinci il mio peccato e il mio dolore che ora sale fino a te fino al trono dell amore che vince ogni paura perche la tua gioia in me sia piena e la consolazione che tu riversi su di me mi da forza il mio calice trabocca la tua grazia mi sostiene e mi basta ponte notte tenebre e nebbia fuggite entra la luce x2 spezza le catene di ogni male vinci il mio peccato e il mio dolore che ora sale fino a te fino al trono dell amore che vince ogni paura perche la tua gioia in me sia piena e la consolazione che tu riversi su di me mi da forza il mio calice trabocca la tua grazia mi sostiene e mi basta 531',type:'N',i:563},
{n:'532',t:'SPIRITO VIENI',c:'SPIRITO VIENI, VIENI! \nDIVINO SPOSO, VIENI! \nSPIRITO VIENI, VIENI! \nSPIRITO, SPIRITO, VIENI! \n \nTu del Padre altissimo sei dono, \neffondi il tuo respiro oltre il creato. \nD\'amore e fuoco sei fonte vivente, \nriversa in noi pienezza di ogni grazia. \n \nSPIRITO VIENI, VIENI! \nDIVINO SPOSO, VIENI! \nSPIRITO VIENI, VIENI! \nSPIRITO, SPIRITO, VIENI! \n \nConcedi i sette doni a chi ti invoca, \nsapienza inaccessibile e divina \nCompiendo le promesse dei profeti \nle nostre labbra apri a lingue nuove. \n \nSPIRITO VIENI, VIENI! \nDIVINO SPOSO, VIENI! \nSPIRITO VIENI, VIENI! \n\nSPIRITO, SPIRITO, VIENI! \n \nUnzione che santifichi e risani, \ncon forza creatrice tu rinnovi. \nGuarisci i nostri corpi e dona vita, \nle nostre piaghe tu trasformi in luce. \n \nSPIRITO VIENI, VIENI! \nDIVINO SPOSO, VIENI! \nSPIRITO VIENI, VIENI! \nSPIRITO, SPIRITO, VIENI! \n \nPonte: \nL\'avversario antico disperdi e metti in fuga, \naccordaci la pace e l\'unità. \nSii tu nostra dimora, sii tu nostra difesa, \nconsacraci con cuore indiviso. \n \nSPIRITO VIENI, VIENI! \nDIVINO SPOSO, VIENI! \nSPIRITO VIENI, VIENI! \nSPIRITO, SPIRITO, VIENI!',s:'spirito vieni spirito vieni vieni divino sposo vieni spirito vieni vieni spirito spirito vieni tu del padre altissimo sei dono effondi il tuo respiro oltre il creato d amore e fuoco sei fonte vivente riversa in noi pienezza di ogni grazia spirito vieni vieni divino sposo vieni spirito vieni vieni spirito spirito vieni concedi i sette doni a chi ti invoca sapienza inaccessibile e divina compiendo le promesse dei profeti le nostre labbra apri a lingue nuove spirito vieni vieni divino sposo vieni spirito vieni vieni spirito spirito vieni unzione che santifichi e risani con forza creatrice tu rinnovi guarisci i nostri corpi e dona vita le nostre piaghe tu trasformi in luce spirito vieni vieni divino sposo vieni spirito vieni vieni spirito spirito vieni ponte l avversario antico disperdi e metti in fuga accordaci la pace e l unita sii tu nostra dimora sii tu nostra difesa consacraci con cuore indiviso spirito vieni vieni divino sposo vieni spirito vieni vieni spirito spirito vieni 532',type:'N',i:564},
{n:'533',t:'STIAMO UNITI',c:'Noi siamo popolo, noi siam famiglia, \nnoi siam cenacolo, comunità, \nci sia la pace  \ne la concordia tra noi, tra noi. \n \nSTIAMO UNITI, UNITI IN UN SOLO CORPO, \nUNITI, IN UNA SOLA CHIESA UNITI, \nNEL NOME DEL SIGNORE GESÙ, GESÙ. \nSTIAMO UNITI, UNITI IN UN SOLO CORPO, \nUNITI, CHE IL MONDO CREDA PER QUESTO AMORE, \nNEL NOME DEL SIGNORE GESÙ, GESÙ. \n \nMai più la guerra, la divisione, \nil pregiudizio, l\'ostilità. \nCi sia la stima,  \nci sia la cura tra noi, tra noi. Rit.',s:'stiamo uniti noi siamo popolo noi siam famiglia noi siam cenacolo comunita ci sia la pace e la concordia tra noi tra noi stiamo uniti uniti in un solo corpo uniti in una sola chiesa uniti nel nome del signore gesu gesu stiamo uniti uniti in un solo corpo uniti che il mondo creda per questo amore nel nome del signore gesu gesu mai piu la guerra la divisione il pregiudizio l ostilita ci sia la stima ci sia la cura tra noi tra noi rit 533',type:'N',i:565},
{n:'534',t:'ABBI CURA DI ME',c:'Signore del cielo ascolta la mia preghiera, \nporgi l\'orecchio alle parole della mia bocca. \nIn te da sempre trovo il mio rifugio, \n\ntu tieni saldi i miei passi sulle tue vie. \nPiù preziosi dell’oro, il più puro che ci sia, \ne più dolci del miele di un favo stillante \ni giudizi tuoi mio Dio. \nHai inseguito il mio cuore come nessuno ha fatto mai, \nper la mia gioia eterna hai donato te Stesso, \nti amo mio Gesù. \n \nA TE IO TENDO LE MANI, ABBI CURA DI ME \nSOLO TU SEI SALVEZZA, ALTRO IO NON HO. \nTI OFFRO QUESTA MIA VITA, ABBI CURA DI ME, \nE NELLA TUA MISERICORDIA PIÙ PAURA IO NON HO, \nPIÙ PAURA IO NON HO. \n \nA te che hai creato il cielo con sapienza, \na te io porgo il mio cuore e la mia fiducia. \nTu mi fai dono di ogni meraviglia \nperché il tuo amore è per sempre, Signore mio. \nPiù preziosi dell\'oro, il più puro che ci sia, \ne più dolci del miele di un favo stillante \ni giudizi tuoi mio Dio. \nHai inseguito il mio cuore come nessuno ha fatto mai, \nper la mia gioia eterna hai donato te stesso, \nti amo mio Gesù.  \n \nA TE IO TENDO LE MANI, ABBI CURA DI ME \nSOLO TU SEI SALVEZZA, ALTRO IO NON HO. \nTI OFFRO QUESTA MIA VITA, ABBI CURA DI ME, \nE NELLA TUA MISERICORDIA PIÙ PAURA IO NON HO, \nPIÙ PAURA IO NON HO. \n \nPonte \nSe la terra trema non avrò paura, \nsotto le tue ali è la mia dimora (x2).  \n \nA TE IO TENDO LE MANI, ABBI CURA DI ME \nSOLO TU SEI SALVEZZA, ALTRO IO NON HO. \nTI OFFRO QUESTA MIA VITA, ABBI CURA DI ME, \nE NELLA TUA MISERICORDIA PIÙ PAURA IO NON HO, \nPIÙ PAURA IO NON HO.',s:'abbi cura di me signore del cielo ascolta la mia preghiera porgi l orecchio alle parole della mia bocca in te da sempre trovo il mio rifugio tu tieni saldi i miei passi sulle tue vie piu preziosi dell oro il piu puro che ci sia e piu dolci del miele di un favo stillante i giudizi tuoi mio dio hai inseguito il mio cuore come nessuno ha fatto mai per la mia gioia eterna hai donato te stesso ti amo mio gesu a te io tendo le {n:'535',t:'CAMMINA DAVANTI A TE IL SIGNORE',c:'Non temere, non spaventarti, \nperché è con te il Signore tuo Dio, \nè con te dovunque tu vada, \n\ncammina il Signore davanti a te. \n \nCAMMINA DAVANTI A TE IL SIGNORE, \nSARÀ CON FE IL TUO SIGNORE, \nDOVUNQUE TU VADA NON TI LASCERÀ, \nNON TEMERE, NON TI ABBANDONERÀ. \n \nSii forte e fatti coraggio \nperché è con te il Signore tuo Dio, \nnon deviare dalla sua legge, \nluce sul tuo cammino la sua Parola.  \n \nCAMMINA DAVANTI A TE IL SIGNORE, \nSARÀ CON TE IL TUO SIGNORE, \nDOVUNQUE TU VADA NON TI LASCERÀ, \nNON TEMERE, NON TI ABBANDONERÀ. \n \nPonte \nNon un passo senza te (non un passo senza te), \nsolo un passo dietro te (oh). \nNon un passo senza te (non un passo senza te), \nsolo un passo dietro te (oh). \n \nCAMMINI DAVANTI A ME SIGNORE, \nTU SEI CON ME, MIO SIGNORE, \nDOVUNQUE IO VADA NON MI LASCERAI, \nSON SICURO CHE NON MI ABBANDONERAI. \n \nCAMMINA DAVANTI A TE IL SIGNORE, (DAVANTI A TE) \nSARÀ CON TE IL TUO SIGNORE (IL TUO SIGNOR), \nDOVUNQUE TU VADA NON TI LASCERÀ, \nNON TEMERE, (TU SEI CON ME) NON TI ABBANDONERÀ  \n(TU SEI CON ME, TU SEI CON ME) \nNON TEMERE, (TU SEI CON ME) NON TI ABBANDONERÀ, \nNON TEMERE, CAMMINA DAVANTI A TE IL SIGNORE.',s:'cammina davanti a te il signore non temere non spaventarti perche e con te il signore tuo dio e con te dovunque tu vada cammina il signore davanti a te cammina davanti a te il signore sara con fe il tuo signore dovunque tu vada non ti lascera non temere non ti abbandonera sii forte e fatti coraggio perche e con te il signore tuo dio non deviare dalla sua legge luce sul tuo cammino la sua parola cammina davanti a te il signore sara con te il tuo signore dovunque tu vada non ti lascera non temere non ti abbandonera ponte non un passo senza te non un passo senza te solo un passo dietro te oh non un passo senza te non un passo senza te solo un passo dietro te oh cammini davanti a me signore tu sei con me mio signore dovunque io vada non mi lascerai son sicuro che non mi abbandonerai cammina davanti a te il signore davanti a te sara con te il tuo signore il tuo signor dovunque tu vada non ti lascera non temere tu sei con me non ti abbandonera tu sei con me tu sei con me non temere tu sei con me non ti abbandonera non temere cammina davanti a te il signore 535',type:'N',i:567},
{n:'536',t:'GLORIA AL LEONE CHE HA VINTO',c:'Il leone vincitore fatto agnello per noi, \nora apre le sue porte per entrare in mezzo a noi. (x2) \n \nSPLENDE IL SOLE DEL SUO VOLTO SU DI NOI, SUA PROPRIETA\' \nE LE LACRIME DAGLI OCCHI IL SUO AMORE ASCIUGHERA\'. \n \nCon il fuoco della lode accogliamo il nostro Re \nDiamo gloria, diamo amore al leone vincitor. Rit. \n \n\nCon il canto dei suoi santi celebriamo il Salvator, \nimmolato e innalzato, Egli è degno di ogni onor. Rit. \n \nOgni popolo e nazione il suo nome acclamerà, \nil creato, il mondo intero a gran voce esulterà. Rit. \n \nOgni nostra debolezza la sua gloria coprirà, \nnel suo nome c\'è salvezza, gloria al nome di Gesù. Rit. \n \nLo vedremo faccia a faccia così come Egli è, \nnella vita senza morte, nella vita che verrà. Rit. \n \nGLORIA AL LEONE CHE HA VINTO.',s:'gloria al leone che ha vinto il leone vincitore fatto agnello per noi ora apre le sue porte per entrare in mezzo a noi x2 splende il sole del suo volto su di noi sua proprieta e le lacrime dagli occhi il suo amore asciughera con il fuoco della lode accogliamo il nostro re diamo gloria diamo amore al leone vincitor rit con il canto dei suoi santi celebriamo il salvator immolato e innalzato egli e degno di ogni onor rit ogni popolo e nazione il suo nome acclamera il creato il mondo intero a gran voce esultera rit ogni nostra debolezza la sua gloria coprira nel suo nome c e salvezza gloria al nome di gesu rit lo vedremo faccia a faccia cosi come egli e nella vita senza morte nella vita che verra rit gloria al leone che ha vinto 536',type:'N',i:568},
{n:'537',t:'GRANDE TU SEI',c:'Ti loderò mio Signor con tutto il cuore, \ngloria al tuo nome darò. \nGrande con me è la tua misericordia, \nso che non mi lascerai, mai, mai, mai, mai. \n \nTendi l\'orecchio alla voce del tuo servo \ne custodisci il mio cuore. \nHai liberato la vita mia dal male, \nso che non mi lascerai, mai, mai, mai. \n \nNO, NON C’È NESSUNO CHE È PARI A TE SIGNOR, \nNON C’È NULLA CHE UGUAGLI LE TUE OPERE. \nTUTTE LE NAZIONI VERRANNO AL TRONO TUO \nE SI PROSTRERANNO INNANZI A TE SIGNORE. \nGRANDE TU SEI, GRANDE TU SEI, \nGRANDE TU SEI E COMPI MERAVIGLIE, \nGRANDE TU SEI, GRANDE TU SEI, \nGRANDE TU SEI E COMPI MERAVIGLIE, \nGRANDE TU SEI. \n \nDio di pietà lento all’ira, Dio fedele, \ntu che sei pieno d\'amor. \nDona al tuo servo la tua immensa forza, \nso che non mi lascerai mai, mai, mai. \n \nNO, NON C’È NESSUNO CHE È PARI A TE SIGNOR, \nNON C’È NULLA CHE UGUAGLI LE TUE OPERE. \nTUTTE LE NAZIONI VERRANNO AL TRONO TUO \nE SI PROSTRERANNO INNANZI A TE SIGNORE. \nGRANDE TU SEI, GRANDE TU SEI, \nGRANDE TU SEI E COMPI MERAVIGLIE, \n\nGRANDE TU SEI, GRANDE TU SEI, \nGRANDE TU SEI E COMPI MERAVIGLIE, \nGRANDE TU SEI.',s:'grande tu sei ti lodero mio signor con tutto il cuore gloria al tuo nome daro grande con me e la tua misericordia so che non mi lascerai mai mai mai mai tendi l orecchio alla voce del tuo servo e custodisci il mio cuore hai liberato la vita mia dal male so che non mi lascerai mai mai mai no non c e nessuno che e pari a te signor non c e nulla che uguagli le tue opere tutte le nazioni verranno al trono tuo e si prostreranno innanzi a te signore grande tu sei grande tu sei grande tu sei e compi meraviglie grande tu sei grande tu sei grande tu sei e compi meraviglie grande tu sei dio di pieta lento all ira dio fedele tu che sei pieno d amor dona al tuo servo la tua immensa forza so che non mi lascerai mai mai mai no non c e nessuno che e pari a te signor non c e nulla che uguagli le tue opere tutte le nazioni verranno al trono tuo e si pro {n:'538',t:'LA MIA GIOIA IN TE',c:'Signore guariscimi, risana il mio cuor, \ndepongo ai tuoi piedi fatica e dolor. \nSignore perdonami le mie iniquità, \nqueste catene spezza per me. \n \nGESÙ SONO QUI, MI GETTO AI TUOI PIEDI, \nCONSEGNO LA MIA VITA A TE, \nACCOGLI TUTTI I MIEI AFFANNI, \nEFFONDI LA TUA GRAZIA IN ME. \nABBRACCIA IL MIO CUORE ADESSO, \nPERCHÉ IO POSSA AMARE TE, \nCON TE NON SONO SOLO E PERSO, \nRITROVO LA MIA GIOIA IN TE, GESÙ. \n \nSignore accompagnami e guida il mio cuor, \nin questa mia vita io pace non ho. \nSignore rinnovami, opera in me, \ncon la tua grazia salvo sarò.  \n \nGESÙ SONO QUI, MI GETTO AI TUOI PIEDI, \nCONSEGNO LA MIA VITA A TE, \nACCOGLI TUTTI I MIEI AFFANNI, \nEFFONDI LA TUA GRAZIA IN ME. \nABBRACCIA IL MIO CUORE ADESSO, \nPERCHÉ IO POSSA AMARE TE, \nCON TE NON SONO SOLO E PERSO, \nRITROVO LA MIA GIOIA IN TE, GESÙ. \n \nPonte \nAgisci tu, agisci tu, agisci tu, o mio Signore agisci tu. \nAgisci tu (agisci tu), agisci tu (agisci tu), \nagisci tu (agisci tu), o mio Signore. \n \nGESÙ SONO QUI, MI GETTO AI TUOI PIEDI, \nCONSEGNO LA MIA VITA A TE, \nACCOGLI TUTTI I MIEI AFFANNI, \nEFFONDI LA TUA GRAZIA IN ME. \nABBRACCIA IL MIO CUORE ADESSO, \nPERCHÉ IO POSSA AMARE TE, \nCON TE NON SONO SOLO E PERSO, \n\nRITROVO LA MIA GIOIA IN TE, \nGESÙ, GESÙ, GESÙ. \nABBRACCIA IL MIO CUORE ADESSO, \nPERCHÉ IO POSSA AMARE TE, \nCON TE NON SONO SOLO E PERSO, \nRITROVO LA MIA GIOIA IN TE.',s:'la mia gioia in te signore guariscimi risana il mio cuor depongo ai tuoi piedi fatica e dolor signore perdonami le mie iniquita queste catene spezza per me gesu sono qui mi getto ai tuoi piedi consegno la mia vita a te accogli tutti i miei affanni effondi la tua grazia in me abbraccia il mio cuore adesso perche io possa amare te con te non sono solo e perso ritrovo la mia gioia in te gesu signore accompagnami e guida il mio cuor in questa mia vita io pace non ho signore rinnovami opera in me con la tua grazia salvo saro gesu sono qui mi getto ai tuoi piedi conseg {n:'539',t:'NELLA TENDA DI DAVIDE',c:'Nella tenda di Davide le donne danzano \nalla presenza del Signore, con i cembali in mano, \ncon le lampade accese, lodando il nome di Jahvé. \n \nHODÙ LADONÀY KI TOV, KI LEOLÀM CHASDÒ \nHODÙ LADONÀY KI TOV, KI LEOLÀM CHASDÒ . \nLODE A LUI PERCHÉ EGLI È BUONO ED ETERNO È IL SUO AMORE. \nLODE A LUI PERCHÉ EGLI È BUONO ED ETERNO È IL SUO AMORE PER NOI. \n \nNella tenda di Davide (lai lai lai, nella tenda di Davide) \ngli uomini cantano alla presenza del Signor (lai lai), \ncon le offerte in mano (lai lai lai), con i corni vibranti, \nlodando il nome di Jahvè.  \n \nHODÙ LADONÀY KI TOV, KI LEOLÀM CHASDÒ \nHODÙ LADONÀY KI TOV, KI LEOLÀM CHASDÒ . \nLODE A LUI PERCHÉ EGLI È BUONO ED ETERNO È IL SUO AMORE. \nLODE A LUI PERCHÉ EGLI È BUONO ED ETERNO È IL SUO AMORE PER NOI. \n \nNella tenda di Davide (nella tenda di Davide) \ngiovani e vecchi alla presenza del Signor, \ncontemplando l\'Alleanza, la sua fedeltà \nlodando il nome di Jahvè, Jahvè.  \n \nHODÙ LADONÀY KI TOV, KI LEOLÀM CHASDÒ \nHODÙ LADONÀY KI TOV, KI LEOLÀM CHASDÒ . \nLODE A LUI PERCHÉ EGLI È BUONO ED ETERNO È IL SUO AMORE. \nLODE A LUI PERCHÉ EGLI È BUONO ED ETERNO È IL SUO AMORE PER NOI. \n \nNella tenda di Davide, esulta il popolo \nalla presenza del Signor, con il cuore in festa \ne con grida di giubilo, lodando il nome di Jahvè. \n \nHODÙ LADONÀY KI TOV, KI LEOLÀM CHASDÒ \nHODÙ LADONÀY KI TOV, KI LEOLÀM CHASDÒ . \nLODE A LUI PERCHÉ EGLI È BUONO ED ETERNO È IL SUO AMORE. \nLODE A LUI PERCHÉ EGLI È BUONO ED ETERNO È IL SUO AMORE PER NOI. \n \n\nCODA: \n \nDanza, danza, figlia di Sion, esulta nel Signore (uh). \nCanta, canta, figlio di Davide, facciamo festa al Re dei re, \nfacciamo festa al Re dei re (x 5) \nfesta, festa al Re dei re. (x 4) \nAh (festa, festa al Re dei re) \nAh (festa, festa al Re dei re) \nAh (festa, festa al Re dei re) \nnella tenda di Davide. Lai.',s:'nella tenda di davide nella tenda di davide le donne danzano alla presenza del signore con i cembali i {n:'540',t:'RICORDATI SIGNORE',c:'RICORDATI, SIGNORE, DEL TUO AMOR, \nCHE LA TUA FEDELTÀ È PER L\'ETERNITÀ, \nCHE GLI OCCHI MIEI RIVOLGO SEMPRE A TE, \nA TE CHE GUIDI GLI UMILI AL TUO CUOR, \nE NEL TUO AMORE TU CI ACCOGLIERAI \nDA OGNI MALE LIBERI, SIGNOR. \n \nVita, tu sei davanti a me, sei via in cui camminerò. \nConfido in te Signore Dio e con questi occhi certo ti vedrò.  \n \nRICORDATI, SIGNORE, DEL TUO AMOR, \nCHE LA TUA FEDELTÀ È PER L\'ETERNITÀ, \nCHE GLI OCCHI MIEI RIVOLGO SEMPRE A TE, \nA TE CHE GUIDI GLI UMILI AL TUO CUOR, \nE NEL TUO AMORE TU CI ACCOGLIERAI \nDA OGNI MALE LIBERI, SIGNOR. \n \nGuidami nella verità, tu solo salvezza sei per me. \nInsegnami i sentieri tuoi e accanto a te deluso mai sarò. \n \nPonte \nMh. \n \nÎl volto tuo Signor sempre cercherà, la via dei tuoi decreti osserverò. \nVolgiti a me, Signore, guardami, accanto a te deluso mai sarò.  \n \nRICORDATI, SIGNORE, DEL TUO AMOR, \nCHE LA TUA FEDELTÀ È PER L\'ETERNITÀ, \nCHE GLI OCCHI MIEI RIVOLGO SEMPRE A TE, \nA TE CHE GUIDI GLI UMILI AL TUO CUOR, \nE NEL TUO AMORE TU CI ACCOGLIERAI \nDA OGNI MALE LIBERI, SIGNOR.',s:'ricordati signore ricordati signore del tuo amor che la tua fedelta e per l eternita che gli occhi miei rivolgo sempre a te a te che guidi gli umili al tuo cuor e nel tuo amore tu ci accoglierai da ogni male liberi signor vita tu sei davanti a me sei via in cui camminero confido in te signore dio e con questi occhi certo ti vedro ricordati signore del tuo amor che la tua fedelta e per l eternita che gli occhi miei rivolgo sempre a te a te che guidi gli umili al tuo cuor e nel tuo amore tu ci accoglierai da ogni male liberi signor guidami nella verita tu solo salvezza sei per me insegnami i sentieri tuoi e accanto a te deluso mai saro ponte mh il volto tuo signor sempre cerchera la via dei tuoi decreti osservero volgiti a me signore guardami accanto a te deluso mai saro ricordati signore del tuo amor che la tua fedelta e per l eternita che gli occhi miei rivolgo sempre a te {n:'541',t:'TI SEGUIRO\'',c:'Voglio cantare con gli angeli la fedeltà del tuo amor. \nQuello che cerco è star con te, appartenere a te, solo a te. \n \nTI SEGUIRÒ, (TI SEGUIRÒ), TI SEGUIRÒ, (TI SEGUIRÒ), \nSULLA STRADA CHE TU TRACCERAI SOLO NON SARÒ, \nTI SEGUIRÒ. \n \nSe io cadrò tu mi rialzerai, dal male mi salverai. \nMonti e colline tu spianerai, per mano mi condurrai mio Signor. \n \nTI SEGUIRÒ, (TI SEGUIRÒ), TI SEGUIRÒ, (TI SEGUIRÒ), \nSULLA STRADA CHE TU TRACCERAI SOLO NON SARÒ, \nTI SEGUIRÒ. \n \nPonte \nSe nel buio io sarò tu mi guiderai, se nel pianto io sarò mi consolerai. \nSicuro io camminerò, amato io amerò, la salvezza annuncerò. \n \nTI SEGUIRÒ, (TI SEGUIRÒ), TI SEGUIRÒ, (TI SEGUIRÒ), \nSULLA STRADA CHE TU TRACCERAI SOLO NON SARÒ, \nNELLA VITA CHE PER ME VORRAI, VITA TROVERÒ, \nTI SEGUIRÒ. \nVOGLIO CANTARE AL SIGNOR.',s:'ti seguiro voglio cantare con gli angeli la fedelta del tuo amor quello che cerco e star con te appartenere a te solo a te ti seguiro ti seguiro ti seguiro ti seguiro sulla strada che tu traccerai solo non saro ti seguiro se io cadro tu mi rialzerai dal male mi salverai monti e colline tu spianerai per mano mi condurrai mio signor ti seguiro ti seguiro ti seguiro ti seguiro sulla strada che tu traccerai solo non saro ti seguiro ponte se nel buio io saro tu mi guiderai se nel pianto io saro mi consolerai sicuro io camminero amato io amero la salvezza annuncero ti seguiro ti seguiro ti seguiro ti seguiro sulla strada che tu traccerai solo non saro nella vita che per me vorrai vita trovero ti seguiro voglio cantare al signor 541',type:'N',i:573},
{n:'542',t:'TU SEI QUI',c:'Tu ci chiedi chi sei, chi sei per noi, \nse ti riconosciamo, se crediamo in te. \nMendicante d\'amore, tu speri in noi, \nsei tu che ancora e sempre chiedi il nostro sì. \n \nTU SEI QUI MIO SIGNORE, \nTU SEI IL FIGLIO DI DIO, TU SEI IL CRISTO. \nTU SEI QUI, SEI IL VIVENTE, \nED IL MALE MAI VINCERÀ. \n \nTra la folla tu cerchi chi ha sete del tuo amor, \nfa\' che noi ti vediamo, che ascoltiamo te. \nUna voce dal cielo, il Padre che ama te \n«chiede che ti accogliamo, che crediamo in te. Rit \n \nPonte \nTu sei il futuro, la libertà, \ntu sei il nostro cammino, luce che splenderà. \n\nTu sei il presente, la verità, \ne nel tuo nome ogni creatura rivivrà. (x 2) \n \nTU SEI QUI MIO SIGNORE, \nTU SEI IL FIGLIO DI DIO, TU SEI IL CRISTO. \nTU SEI QUI, SEI IL VIVENTE, \nED IL MALE MAI VINCERÀ. (X2) \nMH, L’AMORE RESTERÀ, \nMH, L’AMORE RESTERÀ, L’AMORE RESTERÀ.',s:'tu sei qui tu ci chiedi chi sei chi sei per noi se ti riconosciamo se crediamo in te mendicante d amore tu speri in noi sei tu che ancora e sempre chiedi il nostro si tu sei qui mio signore tu sei il figlio di dio tu sei il cristo tu sei qui sei il vivente ed il male mai vincera tra la folla tu cerchi chi ha sete del tuo amor fa che noi ti vediamo che ascoltiamo te una voce dal cielo il padre che ama te chiede che ti accogliamo che crediamo in te rit ponte tu sei il futuro la liberta tu sei il nostro cammino luce che splendera tu sei il presente la verita e nel tuo nome ogni creatura rivivra x 2 tu sei qui mio signore tu sei il figlio di dio tu sei il cristo tu sei qui sei il vivente ed il male mai vincera x2 mh l amore restera mh l amore restera l amore restera 542',type:'N',i:574},
{n:'543',t:'UOMO DELLA CROCE',c:'Uomo della croce, volgi il tuo sguardo su di me \ne rispondi al mio grido,  \nparlami Signore, il mio cuore ascolta. \nNel buio più profondo invoco te,  \nuomo della croce. \n \nSALVAMI, GUIDAMI, TOCCAMI, GUARISCIMI. \nINNALZO LA PREGHIERA, COME INCENSO SALGA A TE, \nNEL TUO NOME SALVAMI. \nSIGNORE SALVAMI, GUIDAMI, NEL TUO CUOR NASCONDIMI. \nLA TUA CROCE MIO DIO IO ADORO E NEL TUO NOME CAMMINERÒ. \n \nUomo della croce, volgi il tuo sguardo su di me, \nproteggimi Signore, Io credo in te, il tuo nome salva. \nTu sei il mio Signore ed il mio Re, \nuomo della croce.  \n \nSALVAMI, GUIDAMI, TOCCAMI, GUARISCIMI. \nINNALZO LA PREGHIERA, COME INCENSO SALGA A TE, \nNEL TUO NOME SALVAMI. \nSIGNORE SALVAMI, GUIDAMI, NEL TUO CUOR NASCONDIMI. \nLA TUA CROCE MIO DIO IO ADORO E NEL TUO NOME CAMMINERÒ. \n \nSALVAMI, SALVAMI \n \nSIGNORE SALVAMI, GUIDAMI, NEL TUO CUOR NASCONDIMI. \nLA TUA CROCE MIO DIO IO ADORO E NEL TUO NOME CAMMINERÒ.',s:'uomo della croce uomo della croce volgi il tuo sguardo su di me e rispondi al mio grido parlami signore il mio cuore ascolta nel buio piu profondo invoco te uomo della croce salvami guidami toccami guariscimi innalzo la preghiera come incenso salga a te nel tuo nome salvami signore salvami guidami nel tuo cuor nascondimi la tua croce mio dio io adoro e nel tuo nome camminero uomo della croce volgi il tuo sguardo su di me proteggimi signore io credo in te il tuo nome salva tu sei il mio signore ed il mio re uomo della croce salvami guidami toccami guariscimi innalzo la preghiera come incenso salga a te nel tuo nome salvami signore salvami guidami nel tuo cuor nascondimi la tua croce mio dio io adoro e nel tuo nome camminero salvami salvami signore salvami guidami nel tuo cuor nascondimi la tua croce mio dio io adoro e nel tuo nome camminero 543',type:'N',i:575},
{n:'544',t:'VIVE!',c:'Il Signore è la gioia del suo popolo, \nperché mite è la sua regalità, \nha sconfitto la morte e ci ha resi liberi, \nè la via, è la vita, è la verità. \n\nPer sempre è il suo trono, da sempre il suo amore, \ni suoi progetti per ogni generazione. \n \nPERCHÉ VIVE E COMPIE MERAVIGLIE SU QUESTE NOSTRE VITE, \nNOI CANTIAMO A GESÙ. \nSÌ, LUI VIVE E REGNA CON AMORE SU QUESTE NOSTRE VITE, \nNOI CANTIAMO A GESÙ, DIO POTENTE SU CIELO, TERRA E MARE, \nGRANDE È IL SUO NOME E NON C\'È DIO COME LUI, NO, NON C’È. \n \nIl Signore è rifugio di chi conosce \nil suo nome e la sua eterna fedeltà, \nnon dimentica il grido di chi è più fragile, \nDio rialza e dona la libertà. \nPer sempre è il suo trono, da sempre il suo amore, \ni suoi progetti per ogni generazione. \n \nPERCHÉ VIVE E COMPIE MERAVIGLIE SU QUESTE NOSTRE VITE, \nNOI CANTIAMO A GESÙ. \nSÌ, LUI VIVE E REGNA CON AMORE SU QUESTE NOSTRE VITE, \nNOI CANTIAMO A GESÙ, DIO POTENTE SU CIELO, TERRA E MARE, \nGRANDE È IL SUO NOME, IMMENSO È IL SUO AMORE. \n \nPonte \nFonte di gioia per noi, che non finirà mai, \nla pace vedremo scendere, \nsu chi confida in lui, \nsu chi confida in lui.  \n \nPERCHÉ VIVE E COMPIE MERAVIGLIE SU QUESTE NOSTRE VITE, \nNOI CANTIAMO A GESÙ. \nSÌ, LUI VIVE E REGNA CON AMORE SU QUESTE NOSTRE VITE, \nNOI CANTIAMO A GESÙ, DIO POTENTE SU CIELO, TERRA E MARE, \nGRANDE È IL SUO NOME, IMMENSO È IL SUO AMORE.',s:'vive il signore e la gioia del suo popolo perche mite e la sua regalita ha sconfitto la morte e ci ha resi liberi e la via e la vita e la verita per sempre e il suo trono da sempre il suo amore i suoi progetti per ogni generazione perche vive e compie meraviglie su queste nostre vite noi cantiamo a gesu si lui vive e regna con amore su queste nostre vite noi cantiamo a gesu dio potente su cielo terra e mare grande e il suo nome e non c e dio come lui no non c e il signore e rifugio di chi conosce il suo nome e la sua eterna fedelta non dimentica il grido di chi e piu fragile dio ri {n:'545',t:'VOGLIO INCONTRARTI',c:'Ci sono tante strade da percorrere, \nma una sola Signore hai scelto per me. \nMostrami la via,  \nquella strada che tu hai preparato per me. \n \nVOGLIO INCONTRARTI, VEDERTI, ABBRACCIARTI, \nGESÙ, TU HAI GUARITO IL MIO CUOR. \nVOGLIO INCONTRARTI, DIRTI IL MIO GRAZIE, \nGESÙ, CHE HAI SOFFERTO PER ME. \n\nLO TI AMO, AMO TE CHE MI HAI AMATO PER PRIMO, PER PRIMO. \n \nUna cosa ho chiesto, questa cercherò, \nabitare Signore per sempre con te. \nMostrami la via,  \nquella strada che tu hai preparato per me.  \n \nVOGLIO INCONTRARTI, VEDERTI, ABBRACCIARTI, \nGESÙ, TU HAI GUARITO IL MIO CUOR. \nVOGLIO INCONTRARTI, DIRTI IL MIO GRAZIE, \nGESÙ, CHE HAI SOFFERTO PER ME. \nLO TI AMO, AMO TE CHE MI HAI AMATO PER PRIMO, PER PRIMO. \n \nAh \n \nVoglio incontrarti, dirti il mio grazie, \nGesù, che hai sofferto per me. \nlo ti amo, amo te che mi hai amato per primo, per primo, Gesù.',s:'voglio incontrarti ci sono tante strade da percorrere ma una sola signore hai scelto per me mostrami la via quella strada che tu hai preparato per me voglio incontrarti vederti abbracciarti gesu tu hai guarito il mio cuor voglio incontrarti dirti il mio grazie gesu che hai sofferto per me lo ti amo amo te che mi hai amato per primo per primo una cosa ho chiesto questa cerchero abitare signore per sempre con te mostrami la via quella strada che tu hai preparato per me voglio incontrarti vederti abbracciarti gesu tu hai guarito il mio cuor voglio incontrarti dirti il mio grazie gesu che hai sofferto per me lo ti amo amo te che mi hai amato per primo per primo ah voglio incontrarti dirti il mio grazie gesu che hai sofferto per me lo ti amo amo te che mi hai amato per primo per primo gesu 545',type:'N',i:577},

{n:'547',t:'IL SIGNORE E\' IL MIO PASTORE',c:'Il Signore è il mio pastore e con lui nulla mi manca, \nnei suoi sentieri mi conduce. \nGesù rinfranchi il cuore mio e mi guidi nel cammino \nper amore del tuo nome. \nIo credo in te, io spero in te, io confido in te mio Dio, \nio credo in te, io spero in te, io confido in te, nel tuo amore. \n \nANCHE NELLA VALLE OSCURA, NEGLI AFFANNI DELLA VITA, \nIO NON TEMO ALCUN MALE. \nQUANDO CADO NEL PECCATO, LA TUA GRAZIA MI SOSTIENE,  \nTU GESÙ SEI IL DIO FEDELE. \nIO CREDO NEL TUO AMOR, (OH OH HO) \nNEL TUO IMMENSO AMOR, (OH OH HO)  \nCHE MAI FINIRÀ. \nIO CREDO NEL TUO AMOR, (OH OH HO) \nNEL TUO IMMENSO AMOR, (OH OH HO) \nCHE MAI FINIRÀ, \nCHE NON MI ABBANDONERÀ. \n \nTu mi inviti alla tua mensa, ungi d\'olio il mio capo, \nil mio calice trabocca. \nPer tutti i giorni abiterò la tua casa mio Signore, \na te il mio grazie renderò. \nIo credo in te, io spero in te, io confido in te mio Dio, \n\nio credo in te, io spero in te, io confido in te, nel tuo amore. \n \nANCHE NELLA VALLE OSCURA, NEGLI AFFANNI DELLA VITA, \nIO NON TEMO ALCUN MALE. \nQUANDO CADO NEL PECCATO, LA TUA GRAZIA MI SOSTIENE,  \nTU GESÙ SEI IL DIO FEDELE. \nIO CREDO NEL TUO AMOR, (OH OH HO) \nNEL TUO IMMENSO AMOR, (OH OH HO) \nCHE MAI FINIRÀ. \nIO CREDO NEL TUO AMOR, (OH OH HO) \nNEL TUO IMMENSO AMOR, (OH OH HO) \nCHE MAI FINIRÀ, \nCHE NON MI ABBANDONERÀ.',s:'il signore e il mio pastore il signore e il mio pastore e con lui nulla mi manca nei suoi sentieri mi conduce gesu rinfranchi il cuore mio e mi guidi nel cammino per amore del tuo nome io credo in te io spero in te io confido in te mio dio io credo in te io spero in te io confido in te nel tuo amore anche nella valle oscura negli affanni della vita io non temo alcun male quando cado nel peccato la tua grazia mi sostiene tu gesu sei il dio fedele io credo nel tuo amor oh oh ho nel tuo immenso amor oh oh ho che mai finira io credo nel tuo amor oh oh ho nel tuo immenso amor oh oh ho che mai finira che non mi ab {n:'548',t:'MI FIDO DI TE',c:'Grido di giorno, di notte non trovo riposo, \nsalvami o Dio, con tutto me stesso t\'invoco. \nNon ho più forza, mi trovo già in acque profonde, \ntu sei l\'unica roccia, sostienimi con la tua grazia. \n \nMI FIDO DI TE, ANCHE QUANDO IL DUBBIO MI ASSALE, \nLE TEMPESTE SCATENANO IL MARE, \nMA TU SEI CON ME, SO CHE NON SONO MAI SOLO E MI FIDO DI TE, \nANCHE QUANDO NON VEDO IL DOMANI \nE LA VITA SCONVOLGE I MIEI PIANI, \nMA TU SEI CON ME, REGNI DA SEMPRE E PER SEMPRE, \nMI FIDO DI TE. \n \nFammi giustizia tu che scruti il mio cuore,  \ncustode dei giusti, fedele ad ogni promessa.  \nTramano quelli che mi odiano senza ragione,  \ntendimi ora la mano, ti prego Signore. \n \nMI FIDO DI TE, ANCHE QUANDO IL DUBBIO MI ASSALE, \nLE TEMPESTE SCATENANO IL MARE, \nMA TU SEI CON ME, SO CHE NON SONO MAI SOLO E MI FIDO DI TE, \nANCHE QUANDO NON VEDO IL DOMANI \nE LA VITA SCONVOLGE I MIEI PIANI, \nMA TU SEI CON ME, REGNI DA SEMPRE E PER SEMPRE, \nMI FIDO DI TE. \n \nSpecial \n \n \nTuona o Dio della gloria, trovo pace nella tua vittoria, \n\nmi fido di te. Uh Uh \nSe la vita sconvolge i miei piani, \nso sei con me, regni da sempre e per sempre, \nregni da sempre e per sempre, mi fido di te.',s:'mi fido di te grido di giorno di notte non trovo riposo salvami o dio con tutto me stesso t invoco non ho piu forza mi trovo gia in acque profonde tu sei l unica roccia sostienimi con la tua grazia mi fido di te anche quando il dubbio mi assale le tempeste scatenano il mare ma tu sei con me so che non sono mai solo e mi fido di te anche quando non vedo il domani e la vita sconvolge i miei piani ma tu sei con me regni da sempre e per sempre mi fido di te fammi giustizia tu che scruti il mio cuore custode dei giusti fedele ad ogni promessa tramano quelli che mi odiano senza ragione tendimi ora la mano ti prego signore mi fido di te anche quando il dubbio mi assale le tempeste scatenano il mare ma tu sei con me so che non sono mai solo e mi fido di te anche quando no {n:'549',t:'MIO DIO, GRANDE E\' IL TUO AMORE',c:'Mio Dio grande è il tuo amore, \nla tua salvezza è per l\'eternità.  \nMio Dio, potente è il tuo nome \nche respinge il nemico e vittoria mi dà, \nil mio canto sale a te. \n \nFEDELE SEI SIGNORE, \nLE TUE PROMESSE NON DELUDONO MAI. \nCON GIOIA INNALZO A TE QUESTA LODE, \nCANTERÒ PER SEMPRE QUELLO CHE SEI, \nDIO POTENTE, DIO FEDELE, \nDIO POTENTE, DIO FEDELE TU SEI. \n \nMio Dio, il mio peccato \nmi sta sempre dinanzi ma tu mi salverai. \nMio Dio, nel tuo amore ho sperato \nil giorno in cui ti ho invocato, mia roccia tu sei, \nil mio canto sale a te. \n \nFEDELE SEI SIGNORE, \nLE TUE PROMESSE NON DELUDONO MAI. \nCON GIOIA INNALZO A TE QUESTA LODE, \nCANTERÒ PER SEMPRE QUELLO CHE SEI, \nDIO POTEN-TE, DIO FEDELE, \nDIO POTEN-TE, DIO FEDELE TU SEI. \n \nPonte \n \n \nGrandi sono le tue opere, grandi, \nil mio canto sale a te,  \nil mio canto sale a te, sale a te. \n \nFEDELE SEI SIGNORE, \nLE TUE PROMESSE NON DELUDONO MAI. \nCON GIOIA INNALZO A TE QUESTA LODE,  \nCANTERÒ PER SEMPRE QUELLO CHE SEI, \nDIO POTENTE, DIO FEDELE, \nDIO POTENTE, DIO FEDELE TU SEI. \n\nDIO POTENTE (TU SEI) \nDIO FEDELE (TU SEI) \nDIO POTENTE (TU SEI) \nDIO FEDELE (TU SEI) \n \nDIO POTENTE!',s:'mio dio grande e il tuo amore mio dio grande e il tuo amore la tua salvezza e per l eternita mio dio potente e il tuo nome che respinge il nemico e vittoria mi da il mio canto sale a te fedele sei signore le tue promesse non deludono mai con gioia innalzo a te questa lode cantero per sempre quello che sei dio potente dio fedele dio potente dio fedele tu sei mio dio il mio peccato mi sta sempre dinanzi ma tu mi salverai mio dio nel tuo amore ho sperato il giorno in cui ti ho invocato mia roccia tu sei il mio canto sale a te fedele sei signore le tue promesse non deludono mai con gioia innalzo a te questa lode cantero per sempre quello che sei dio poten te dio fedele dio poten te dio fedele tu sei ponte grandi sono le tue opere grandi il mio canto sale a te i {n:'550',t:'NON TEMERE',c:'E ora Signore che cosa aspetto, la mia speranza è in te, \nperché sei fedele alle tue promesse Gesù. \nMi hai risollevato, non sono mai solo, tu sei per sempre in me, \nla mia grande gioia, la mia sola pace sei tu, sei tu. \nQuando siamo due o tre, riuniti con te, tu fai meraviglie e prodigi \ne se tu resti qui il male non ha potere. \n \nMA QUANTE VOLTE HAI DETTO: \"NON TEMERE\", \nLA MIA VITTORIA È SOLO NEL TUO NOME, SEI TU IL MIO BENE. \nETERNO E GIUSTO È IL DIO CHE REGNA, \nGLORIA E ONORE AL DIO CHE AMA, \nQUANTE VOLTE HAI DETTO: “NON TEMERE\", \"NON TEMERE\". \n \nE ora Signore che cosa aspetto, tutto ho riposto in te, \ntu mi hai consolato, mi hai liberato Gesù, Gesù. \nQuando siamo due o tre, riuniti con te, tu fai meraviglie e prodigi \ne se tu resti qui il male non ha potere. \n \nMA QUANTE VOLTE HAI DETTO: \"NON TEMERE\", \nLA MIA VITTORIA È SOLO NEL TUO NOME, SEI TU IL MIO BENE. \nETERNO E GIUSTO È IL DIO CHE REGNA, \nGLORIA E ONORE AL DIO CHE AMA, \nQUANTE VOLTE HAI DETTO: “NON TEMERE\", “NON TEMERE\". \n \nPonte \n \nInsegnami ad amare, come solo tu puoi fare, \nper camminare nella verità. \nChe io sappia perdonare, guardando la tua croce, \nper servirti in gioia ed umiltà, senza paura. \n \nSpecial \n \nQUANTE VOLTE HAI DETTO: \"NON TEMERE\", \nQUANTE VOLTE HAI DETTO: \"NON TEMERE\", \nETERNO E GIUSTO È IL DIO CHE REGNA, \nGLORIA E ONORE AL DIO CHE AMA, \nQUANTE VOLTE HAI DETTO: \"NON TEMERE\", “NON TEMERE\".',s:'non temere e ora signore che cosa aspetto la mia speranza e in te perche sei fedele alle tue promesse gesu mi hai risollevato non sono mai solo tu sei per sempre in me la mia grande gioia la mia sola pace sei tu sei tu quando siamo due o tre riuniti con te tu fai meraviglie e prodigi e se tu resti qui il male non ha potere ma quante volte hai detto non temere la mia vittoria e solo nel tuo nome sei tu il mio bene eterno e giusto e il dio che regna gloria e onore al dio che ama quante volte hai detto non temere non te {n:'551',t:'SPIRITO CONSOLATORE',c:'Spirito di Dio scendi su di noi, \nSpirito d\'amore scendi su di noi. \nPlasmaci, convertici, salvaci, proteggici, \ntoccaci, guariscici, Spirito consolatore, \nSpirito di Dio rimani in noi. \n \nSpirito di Dio scendi su di noi, \nSpirito di pace scendi su di noi. \nPlasmaci, convertici, salvaci, proteggici, \nusaci, uniscici, Spirito consolatore. \n \nSpirito di Dio scendi su di noi \nSpirito di vita scendi su di noi. \nPlasmaci, convertici, salvaci, proteggici e rimani. \n \nSpirito di Dio scendi su di noi, \nSpirito di fuoco scendi su di noi. \nPlasmaci, convertici, salvaci, proteggici, \nmandaci, rinnovaci, o Spirito consolatore, \nSpirito di Dio rimani in noi.',s:'spirito consolatore spirito di dio scendi su di noi spirito d amore scendi su di noi plasmaci convertici salvaci proteggici toccaci guariscici spirito consolatore spirito di dio rimani in noi spirito di dio scendi su di noi spirito di pace scendi su di noi plasmaci convertici salvaci proteggici usaci uniscici spirito consolatore spirito di dio scendi su di noi spirito di vita scendi su di noi plasmaci convertici salvaci proteggici e rimani spirito di dio scendi su di noi spirito di fuoco scendi su di noi plasmaci convertici salvaci proteggici mandaci rinnovaci o spirito consolatore spirito di dio rimani in noi 551',type:'N',i:583},

{n:'554',t:'VEDREMO COSE GRANDI',c:'Il mare sì apre, possiamo passare sicuri, \nil Signo-re degli eserciti è con noi. \nFacciamo festa sui nostri giacigli \ncome vivi tornati dai morti \ne siamo forti, siamo forti solo nel Signor. \n \nUh Uh \n \nVedremo prodigi se continueremo a lodare, \nse cammineremo alla luce del suo nom. \nLa sua vittoria è la nostra speranza, \nper la sua morte noi siamo risorti \ne siamo forti, siamo forti solo nel Signor. \n \nOGGI COME ALLORA IL SIGNORE PASSA ANCORA IN MEZZO A NOI, \nVEDREMO COSE GRANDI, \nSIAMO GIÀ SICURI CHE LA SUA PAROLA NON DELUDERÀ \nVEDREMO COSE GRANDI. \nLA SUA PROMESSA È VERA \nE CI DARÀ LA VITA SE CREDEREMO IN LUI. \n \nUH UH \n \nLa gioia trionfa, possiamo annunciare il suo amore, \nè risorto dalla morte ed è con noi. \nGettiamo in lui ogni nostra tristezza, \nper la sua morte noi siamo risorti \ne siamo forti, siamo forti solo nel Signore. \n \nOGGI COME ALLORA IL SIGNORE PASSA ANCORA IN MEZZO A NOI, \nVEDREMO COSE GRANDI, \nSIAMO GIÀ SICURI CHE LA SUA PAROLA NON DELUDERÀ \nVEDREMO COSE GRANDI. \nLA SUA PROMESSA È VERA \nE CI DARÀ LA VITA SE CREDEREMO IN LUI. \nIN LUI, IN LUI. \n \nUH UH \n \nSE CREDEREMO IN LUI, IN LUI, IN LUI, \nSE CREDEREMO IN LUI.',s:'vedremo cose grandi il mare si apre possiamo passare sicuri il signo re degli eserciti e con noi facciamo festa sui nostri giacigli come vivi tornati dai morti e siamo forti siamo forti solo nel signor uh uh vedremo prodigi se continueremo a lodare se cammineremo alla luce del suo nom la sua vittoria e la nostra speranza per la sua morte noi siamo risorti e siamo forti siamo forti solo nel signor oggi come allora il signore passa ancora in mezzo a noi vedremo cose grandi siamo gia sicuri che la sua parola non deludera vedremo cose grandi la sua promessa e vera e ci dara la vita se crederemo in lui uh uh la gioia trionfa possiamo annunciare il suo amore e risorto dalla morte ed e con noi gettiamo in lui ogni nostra tristezza per la sua morte noi siamo risorti e {n:'555',t:'VIENE IL SIGNORE',c:'Venne in mezzo a noi, \n\nlui venne qui fra i suoi, \nma non lo hanno accolto. \nSe Gesù tu accoglierai \nriceverai il potere di esser figlio \ndi Dio Padre. \n \nVIENE IL SIGNORE, \nÈ LA PAROLA VIVENTE ED ETERNA, \nÈ LUI LA VITA, È LUI LA LUCE \nCHE LE TENEBRE VINCE SEMPRE. \nVENUTO NEL MONDO, \nÈ FATTO UOMO ED È FIGLIO DI DIO. \nIN LUI VEDIAMO IL VOLTO DEL PADRE, \nLA SUA GLORIA RISPLENDE, \nÈ LUCE NEL MONDO. \n \nNoi contempliamo in lui \npienezza e verità \ngrazia che trabocca. \nSe Gesù tu accoglierai \nriceverai il potere di esser figlio di Dio Padre. \n \nVIENE IL SIGNORE, \nÈ LA PAROLA VIVENTE ED ETERNA, \nÈ LUI LA VITA, È LUI LA LUCE \nCHE LE TENEBRE VINCE SEMPRE. \nVENUTO NEL MONDO, \nÈ FATTO UOMO ED È FIGLIO DI DIO. \nIN LUI VEDIAMO IL VOLTO DEL PADRE, \nLA SUA GLORIA RISPLENDE, \nÈ LUCE NEL MONDO.',s:'viene il signore venne in mezzo a noi lui venne qui fra i suoi ma non lo hanno accolto se gesu tu accoglierai riceverai il potere di esser figlio di dio padre viene il signore e la parola vivente ed eterna e lui la vita e lui la luce che le tenebre vince sempre venuto nel mondo e fatto uomo ed e figlio di dio in lui vediamo il volto del padre la sua gloria risplende e luce nel mondo noi contempliamo in lui pienezza e verita grazia che trabocca se gesu tu accoglierai riceverai il potere di esser figlio di dio padre viene il signore e la parola vivente ed eterna e lui la vita e lui la luce che le tenebre vince sempre venuto nel mondo e fatto uomo ed e figlio di dio in lui vediamo il volto del padre la sua gloria risplende e luce nel mondo 555',type:'N',i:587},
{n:'556',t:'VIENI O SPIRITO',c:'Vieni o Spirito di sapienza,  \ndistaccaci dalle cose della terra \ne facci amare quelle del cielo,  \nvieni o Spirito di sapienza. \n \nVieni o Spirito d\'intelletto,  \ncon la tua luce rischiaraci la mente \ned arricchiscila dei santi pensieri,  \nvieni o Spirito d\'intelletto. \n \nVieni o Spirito di consiglio,  \nrendici miti alle tue ispirazioni \ne guida tutti alla salvezza,  \nvieni o Spirito di consiglio. \n \n\nVieni o Spirito di fortezza,  \ndonaci forza, costanza e vittoria \ncontro gli spiriti nostri nemici,  \nvieni o Spirito di fortezza. \n \nVieni o Spirito di scienza,  \nsii tu maestro e concedici la grazia \ndi poter vivere i tuoi insegnamenti,  \nvieni o Spirito di scienza. \n \nVieni o Spirito di pietà  \na dimorare dentro i nostri cuori, \nsantificando tutti i nostri affetti,  \nvieni o Spirito di pietà. \n \nVieni o Spirito di santo timore,  \ntieni a freno la nostra volontà \ne fa\' che siamo pronti a soffrire  \npiuttosto che accettare il male, \nvieni o Spirito di timore. \n \nVieni o Spirito del Signore,  \nvieni, vieni.',s:'vieni o spirito vieni o spirito di sapienza distaccaci dalle cose della terra e facci amare quelle del cielo vieni o spirito di sapienza vieni o spirito d intelletto con la tua luce rischiaraci la mente ed arricchiscila dei santi pensieri vieni o spirito d intelletto vieni o spirito di consiglio rendici miti alle tue ispirazioni e guida tutti alla salvezza vieni o spirito di consiglio vieni o spirito di fortezza donaci forza costanza e vittoria contro gli spiriti nostri nemici vieni o spirito di fortezza vieni o spirito di scienza sii tu maestro e concedici la grazia di poter vivere i tuoi insegnamenti vieni o spirito di scienza vieni o spirito di pieta a dimorare dentro i nostri cuori santificando tutti i nostri affetti vieni o spirito di pieta vieni o spirito di santo timore tieni a freno la nostra volonta e fa che siamo pronti a soffrire piuttosto che accettare il male vieni o spirito di timore vieni o spirito del signore vieni vieni 556',type:'N',i:588},
{n:'557',t:'ALZO GLI OCCHI VERSO IL CIELO',c:'Alzo gli occhi verso il cielo,  \nper vedere il Re dei re, \nDio che salva e che consola. \nIl mio aiuto è nel Signore,  \nmi circonda del suo amore, \nporta pace nel mio cuore. \nLe mie mani elevo al cielo,  \nlodo te in adorazione, \nti proclamo mio re. \nIo ti acclamo mio Dio,  \nti professo con il cuore: \n\nGesù sei il mio Signore. \n \nOSANNA AL RE, OSANNA AL RE,  \nOSANNA AL RE DEI RE. \nOSANNA AL RE, OSANNA AL RE,  \nOSANNA AL RE DEI RE. \nBENEDETTO SEI SIGNORE,  \nVITTORIOSO REDENTOR, \nSONO QUI PER ADORARTI, OH OH OH. \nTU SALVEZZA ETERNA SEI,  \nTU SEI IL SANTO, SEI IL SIGNORE. \nAMORE GRANDE CHE PERDONA, CANTIAMO ATE. \nAMORE GRANDE CHE CONSOLA, CANTIAMO A TE. \nOSANNA AL RE. \n \nNella notte mi conduce,  \ncome ombra lui mi copre, \nveglia sempre il mio custode. \nMi protegge da ogni male,  \nnon mi lascia vacillare, \nsta alla destra il mio Signore. \nLe mie mani elevo al cielo,  \nlodo te in adorazione, \nti proclamo mio re. \nIo ti acclamo mio Dio,  \nti professo con il cuore: \nGesù sei il mio Signore. (RIT) \n \nCoda \n \nOSANNA AL RE, OSANNA AL RE,  \nOSANNA AL RE DEI RE. \nOSANNA AL RE, OSANNA AL RE,  \nOSANNA AL RE DEI RE. \nOSANNA AL RE, OSANNA AL RE,  \nOSANNA AL RE DEI RE.',s:'alzo gli occhi verso il cielo alzo gli occhi verso il cielo per vedere il re dei re dio che salva e che consola il mio aiuto e nel signore mi circonda del suo amore porta pace nel mio cuore le mie mani elevo al cielo lodo te in adorazione ti proclamo mio re io ti acclamo mio dio ti professo con il cuore gesu sei il mio signore osanna al re osanna al re osanna al re dei re osanna al re osanna al re osanna al re dei re benedetto sei signore vittorioso redentor sono qui per adorarti oh oh oh tu salvezza eterna sei tu sei il santo sei il signore amore grande che perdona cantiamo ate amore grande che consola cantiamo a te osanna al re nella notte mi conduce come ombra lui mi copre veglia sempre il mio custode mi protegge da ogni {n:'558',t:'BEATO',c:'Apro gli occhi,  \nvedo il vero volto tuo, \ncome un fiume nel deserto sei per me. \nIl tuo sguardo, la mia libertà,  \nla speranza che sa già di eternità. \nLa tua grazia è nuova ogni mattina,  \namore che non abbandona, \n\nla tua promessa guida il mio cammino  \ne non delude mai, mai. \n \nBEATO SONO QUANDO STO CON TE, \nANCHE OGGI CANTO LA TUA FEDELTÀ SIGNORE. \nSONO BEATO SE DIMORO IN TE MIO DIO, \nTU SEI RIFUGIO, IMMENSA PACE E NULLA \nPUÒ PORTARMI VIA DA TE, DA TE, \nBEATO SONO SE TU SEI IL MIO RE. \n \nApro il cuore,  \nma che incanto sei per me, \nquesta gioia sembra incontenibile. \nFonte dì vita e di felicità,  \nvia che conduce alla verità. \nLa tua grazia è nuova ogni mattina,  \namore che non abbandona, \nla tua promessa guida il mio cammino  \ne non delude mai, mai. \n \nBEATO SONO QUANDO STO CON TE, \nANCHE OGGI CANTO LA TUA FEDELTÀ SIGNORE. \nSONO BEATO SE DIMORO IN TE MIO DIO, \nTU SEI RIFUGIO, IMMENSA PACE E NULLA \nPUÒ PORTARMI VIA DA TE, DA TE, \n \nPonte \n \nche sei l\'alfa e l\'omega,  \nil principio e la fine,  \nla luce che risplende, \nl\'amore che redime,  \nsei la voce che mi chiama  \ne tutto il resto tace, \ntutto il resto tace. (RIT) \n \nBEATO SONO QUANDO STO CON TE, \nANCHE OGGI CANTO LA TUA FEDELTÀ SIGNORE. \nSONO BEATO SE DIMORO IN TE MIO DIO, \nTU SEI RIFUGIO, IMMENSA PACE E NULLA  \nPUÒ PORTARMI VIA DA TE, DA TE, \nBEATO SONO SE TU SEI IL MIO RE.',s:'beato apro gli occhi vedo il vero volto tuo come un fiume nel deserto sei per me il tuo sguardo la mia liberta la speranza che sa gia di eternita la tua grazia e nuova ogni mattina amore che non abbandona la tua promessa guida il mio cammino e non delude mai mai beato sono quando sto con te anche oggi canto la tua fedelta signore sono beato se dimoro in te mio dio tu sei rifugio immensa pace e nulla puo portarmi via da te da te beato sono se tu sei il mio re apro il cuore ma che incanto sei per me questa gioia sembra incontenibile fonte di vita e di felicita vi {n:'559',t:'FERMATI GESÙ',c:'Fermati, Gesù, qui davanti a me adesso, \ncerco pace, cerco verità. \nIl tempo vola via, tutto sfugge e sembra perso, \n\ndentro me c\'è un vuoto dove manchi tu. \n \nSE SOLTANTO IO POTRÒ  \nTOCCARE UN LEMBO DEL TUO MANTELLO, \nGUARITO IO SARÒ \nSE CON FEDE GRIDERÒ IL TUO NOME  \nMI GUARDERAI CON AMORE \nCOME SOLO SAI FAR TU. \nFERMATI, GESÙ, QUI DAVANTI A ME,  \nFERMATI GESÙ, FERMATI GESÙ. \n \nGuardami, Gesù, tu conosci la mia storia, \nanche il buio che c’è dentro me. \nIn ogni istante puoi trasformare questa vita, \ncol tuo amore portami alla santità. \n \nSE SOLTANTO IO POTRÒ  \nTOCCARE UN LEMBO DEL TUO MANTELLO, \nGUARITO IO SARÒ \nSE CON FEDE GRIDERÒ IL TUO NOME  \nMI GUARDERAI CON AMORE \nCOME SOLO SAI FAR TU. \nFERMATI, GESÙ, QUI DAVANTI A ME. \n \nPonte \n \nSguardo che guarisce, sguardo che perdona, \nsguardo che consola, fermati Gesù. \nSguardo che mi libera, sguardo che pacifica, \nsguardo che mi illumina, fermati Gesù. \nSguardo che guarisce, sguardo che perdona, \nsguardo che consola, fermati Gesù, \nfermati Gesù, qui davanti a me, fermati Gesù, fermati Gesù.',s:'fermati gesu fermati gesu qui davanti a me adesso cerco pace cerco verita il tempo vola via tutto sfugge e sembra perso dentro me c e un vuoto dove manchi tu se soltanto io potro toccare un lembo del tuo mantello guarito io saro se con fede gridero il tuo nome mi guarderai con amore come solo sai far tu fermati gesu qui davanti a me fermati gesu fermati gesu guardami gesu tu conosci la mia storia anche il buio che c e dentro me in ogni istante puoi trasformare questa vita col tuo amore portami alla santita se soltanto io potro toccare un lembo del tuo mantello guarito io saro se con fede gridero il tuo nome mi guarderai con amore come solo sai far tu fermati gesu qui davanti a me ponte sguardo che guarisce sguardo che perdona sguardo che consola fermati gesu sguardo che mi libera sguardo che pacifica sguardo che mi illumina fermati gesu sguardo che guarisce sguard {n:'560',t:'GESÙ NOME POTENTE',c:'GESÙ, GESÙ, GESÙ. \n \nGesù, il nome in cui la salvezza vive, \nla vittoria regna, la potenza agisce. \nGesù, il nome che ogni male scaccia, \nle catene rompe, i peccati brucia. (RIT) \n \nGesù, il nome in cui la bellezza vive \nil perdono regna e la grazia agisce. \nGesù, il nome che ogni male scaccia, \nle catene rompe, i peccati brucia. (RIT) \n\n \nGesù il nome in cui la sapienza vive, \nla speranza regna e la forza agisce. \nGesù, il nome che ogni male scaccia, \nle catene rompe, i peccati brucia. \n \nGESÙ, GESÙ, GESÙ. \nGESÙ, GESÙ, GESÙ. \n \nCoda \n \nTu sei qui, sei il Signore, sei glorioso redentore \ne potente è il tuo nome.  \nTu sei qui, sei il Signore, sei glorioso redentore  \ne potente è il tuo nome, il tuo nome.',s:'gesu nome potente gesu gesu gesu gesu il nome in cui la salvezza vive la vittoria regna la potenza agisce gesu il nome che ogni male scaccia le catene rompe i peccati brucia rit gesu il nome in cui la bellezza vive il perdono regna e la grazia agisce gesu il nome che ogni male scaccia le catene rompe i peccati brucia rit gesu il nome in cui la sapienza vive la speranza regna e la forza agisce gesu il nome che ogni male scaccia le catene rompe i peccati brucia gesu gesu gesu gesu gesu gesu coda tu sei qui sei il signore sei glorioso redentore e potente e il tuo nome tu sei qui sei il signore sei glorioso redentore e potente e il tuo nome il tuo nome 560',type:'N',i:592},
{n:'561',t:'GESÙ TU SEI IL SIGNORE',c:'Il mondo dice che tu \nsei un grande uomo, un profeta sei. \nTu mi chiedi, Gesù: «Chi io sono per te?». \nIo, con fede, proclamerò che tu sei il Signore \n \nPER OGNI UOMO CHE IN TE CONFIDA, \nOGNI FAMIGLIA CHE A TE SI AFFIDA, \nIN OGNI STORIA, GESÙ, TU SEI IL SIGNOR! \nIN OGNI AVVERSITÀ, OGNI DIFFICOLTÀ, \nCON LA TUA GRAZIA SEI LA LUCE AI PASSI MIEI \nIN OGNI STORIA, GESÙ, TU SEI IL SIGNOR! \nALLELUIA, ALLELUIA. \nIN OGNI STORIA, GESÙ, TU SEI IL SIGNOR! \nALLELUIA, ALLELUIA. \nIN OGNI STORIA, GESÙ, TU SEI IL SIGNOR! \nGESÙ, TU SEI IL SIGNOR! \n \nVoglio annunciar che tu sei \nsenso di tutta la vita mia. \nOgni giorno con te troverò i miei perché \ne con fede proclamerò che tu sei il Signore! (RIT) \n \nIN OGNI STORIA, GESÙ, TU SEI IL SIGNORE! \n \nPonte \n \nSignore, Signore, \nGesù, tu sei il Signore. \n \n\nCoda \n \nAlleluia, alleluia. \nIn ogni storia, Gesù, tu sei il Signor! \nAl - le - lu - ia, alleluia. \nIn ogni storia, Gesù, tu sei il Signore, \nSi - gno - re, Gesù tu sei Signor',s:'gesu tu sei il signore il mondo dice che tu sei un grande uomo un profeta sei tu mi chiedi gesu chi io sono per te io con fede proclamero che tu sei il signore per ogni uomo che in te confida ogni famiglia che a te si affida in ogni storia gesu tu sei il signor in ogni avversita ogni difficolta con la tua grazia sei la luce ai passi miei in ogni storia gesu tu sei il signor alleluia alleluia in ogni storia gesu tu sei il signor alleluia alleluia in ogni storia gesu tu sei il signor gesu tu sei il signor voglio annunciar che tu sei senso di tutta la vita mia ogni giorno con te trovero i miei perche e con fede proclamero che tu sei il signore rit in ogni storia gesu tu sei il signore ponte signore signore gesu tu sei il signore coda alleluia alleluia in ogni storia gesu tu sei il signor al le lu ia alleluia in ogni storia gesu tu sei il signore si gno re gesu tu sei signor 561',type:'N',i:593},

{n:'563',t:'PER SEMPRE',c:'Ti cerco nel silenzio,  \nquando tutto attorno a me \nsembra portarmi più giù e più lontano da te, \nio grido il tuo nome, Gesù. \nAlzo le braccia verso il cielo,  \nti prego, ascoltami Signore, \nio ti conosco e lo so, non c\'è altro Dio come te. \n \nTU MI AMI DA SEMPRE,  \nE SALVI LA MIA VITA PER SEMPRE \nCAMMINI ACCANTO A ME E NON MI LASCI MAI, \nMA STRINGI LA MIA MANO E MI LIBERI, DA SEMPRE \n\nLA TUA PAROLA È VERA PER SEMPRE, \nIL MONDO PASSERÀ MA LA PROMESSA TUA \nRESISTERÀ IN ETERNO E NON CAMBIERÀ \n \nIn ogni lacrima t\'incontro,  \ntu mi guarisci nel profondo \ne mi accogli Signore,  \nio ti dono il mio cuore \nper farne ciò che vuoi tu. \nTu che sei l\'alfa e l\'omega hai dato la tua vita \nsolo per salvare me, non c\'è altro Dio come te. (RIT) \nPER SEMPRE \n \nPonte \n \nRacconterò dell’Ineffabile, \nDio d\'amore che mi chiama a sé, \nper ogni tua opera io ti lodo per sempre, \ntu salvi la mia vita da sempre, \nil mondo passerà ma la promessa tua  \nresisterà in eterno e non cambierà.',s:'per sempre ti cerco nel silenzio quando tutto attorno a me sembra portarmi piu giu e piu lontano da te io grido il tuo nome gesu alzo le braccia verso il cielo ti prego ascoltami signore io ti conosco e lo so non c e altro dio come te tu mi ami da sempre e salvi la mia vita per sempre cammini accanto a me e non mi lasci mai ma stringi la mia mano e mi liberi da sempre la tua parola e vera per sempre il mondo passera ma la promessa tua resistera in eterno e non cambiera in ogni lacrima t incontro tu mi guarisci nel profondo e mi accogli signore io ti dono il mio cuore per farne cio che vuoi tu tu che sei l alfa e l omega hai dato la tua vita solo per salvare me non c e altro dio come te rit per sempre ponte raccontero dell ineffabile dio d amore che mi chiama a se per ogni tua opera io ti lodo per sempre tu salvi la mia vita da sempre il mondo passera ma la promessa tua resistera in eterno e non cambiera 563',type:'N',i:595},
{n:'564',t:'PORTIAMO IL NOSTRO DONO',c:'Portiamo il frutto della terra, \nil pane che trasformerai. \nCorpo santo, cibo di vita, \nsii benedetto tu, Signore. \n \nACCOGLI, 0 DIO, IL NOSTRO DONO \nNEL TUO ABBRACCIO SANTO. \nFIAMMA ARDENTE, ETERNO AMORE, \nIN TE SPERIAMO DIO DI BONTÀ. \n \nPortiamo il frutto della vigna,  \nil vino che trasformerai. \nPura fonte di salvezza,  \nsii benedetto tu, Signore. (RIT) \n \nOffriamo a te la nostra vita, \nnelle tue mani è il nostro cuore. \nTi serviamo nella gioia, \nsii benedetto tu, Signore. (RIT) \n \nACCOGLI, O DIO, IL NOSTRO DONO \nNEL TUO ABBRACCIO SANTO. \nFIAMMA ARDENTE, ETERNO AMORE, \n\nIN TE SPERIAMO DIO DI BONTÀ.',s:'portiamo il nostro dono portiamo il frutto della terra il pane che trasformerai corpo santo cibo di vita sii benedetto tu signore accogli 0 dio il nostro dono nel tuo abbraccio santo fiamma ardente eterno amore in te speriamo dio di bonta portiamo il frutto della vigna il vino che trasformerai pura fonte di salvezza sii benedetto tu signore rit offriamo a te la nostra vita nelle tue mani e il nostro cuore ti serviamo nella gioia sii benedetto tu signore rit accogli o dio il nostro dono nel tuo abbraccio santo fiamma ardente eterno amore in te speriamo dio di bonta 564',type:'N',i:596},
{n:'565',t:'SANTO È IL TUO NOME',c:'Nel silenzio di ogni mattino  \ninnalziamo il nostro canto \ndi lode e adorazione,  \ncome incenso che si alza a Dio. \nDavanti al tuo trono,  \ncon cuori ripieni di gioia, \nsiamo inondati della tua grazia  \nche in noi risplende. \n \n \nSANTO È IL TUO NOME,  \nCON IL CUORE NOI TI RINGRAZIAMO. \nSANTO È IL TUO NOME,  \nQUESTE MANI INNALZIAMO A TE. \nTUTTA LA CREAZIONE CANTA LA GLORIA TUA, \nIN QUESTA LODE CHE,  \nCOME UN ABBRACCIO, \nCI UNISCE A TE, CI UNISCE A TE,  \nCOME UN ABBRACCIO, \nCI UNISCE A TE, CI UNISCE A TE,  \nIN QUESTO ABBRACCIO \nCI RIEMPI DI TE,  \nDEL TUO GRANDE AMOR. \n \nTra le valli nell\'ombra e nel buio,  \nla tua luce in noi risplende. \nLa tua mano, una guida sicura,  \nci sorregge tra venti e tempeste. \nSei roccia sicura,  \nsu te noi fondiamo la vita. \nCon te nel cuore noi  \nnon temeremo alcun male, Gesù. (RIT) \n \n \nCI RIEMPI DI TE,  \nIN QUESTO ABBRACCIO CI RIEMPI DI TE, \nDEL TUO GRANDE AMOR. \nIN QUESTO ABBRACCIO CI RIEMPI DI TE,  \nDEL TUO GRANDE AMOR.',s:'santo e il tuo nome nel silenzio di ogni mattino innalziamo il nostro canto di lode e adorazione come incenso che si alza a dio davanti al tuo trono con cuori ripieni di gioia siamo inondati della tua grazia che in noi risplende santo e il tuo nome con il cuore noi ti ringraziamo santo e il tuo nome queste mani innalziamo a te tutta la creazione canta la gloria tua in questa lode che come un abbraccio ci unisce a te ci unisce a te come un abbraccio ci unisce a te ci unisce a te in questo abbraccio ci riempi di te del tuo grande amor tra le valli nell ombra e nel buio la tua luce in noi risplende la tua mano una guida sicura ci sorregge tra venti e tempeste sei roccia sicura su te noi fondiamo la vita con te nel cuore noi non temeremo alcun male gesu rit ci riempi di te in questo abbraccio ci riempi di te del tuo grande amor in questo abbraccio ci riempi di te del tuo grande amor 565',type:'N',i:597},
{n:'566',t:'SORGI PER ME',c:'Grido a te Signore dal profondo,  \nrisolleva il mio cuore stanco. \nIl tuo orecchio resti attento  \nalla voce del mio pianto. \n \nVivi e forti sono i miei nemici,  \nma da tutti tu mi libererai. \nSui tuoi sentieri mi conduci,  \nnon mi smarrirò mai. \n \nSORGI PER ME,  \nSQUARCIA ANCORA IL MIO BUIO, \nENTRA CON ME NELLA FORNACE DI FUOCO. \nABBATTERÒ IL GIGANTE,  \nSPOSTERÒ LE MONTAGNE, \nDALLA ROCCIA SIGNOR, MI DISSETERAI. \nANCHE NELLA MIA PRIGIONE, \nDALLA FOSSA DEL LEONE MI SALVERAI. \n \nGrido a te Signore dal profondo,  \nrisolleva il mio cuore stanco. \nIl peccato mio lo riconosco,  \nTu perdona e non ricordarlo. \n \nLa mia causa sia nelle tue mani,  \nnei potenti io non confiderò. \nSolo tu conosci la mia strada  \ne cammini con me. (RIT) \n \nCoda \n \nANCHE NELLA MIA PRIGIONE, \nDALLA FOSSA DEL LEONE MI SALVERAI, \nMI SALVERAI.',s:'sorgi per me grido a te signore dal profondo risolleva il mio cuore stanco il tuo orecchio resti attento alla voce del mio pianto vivi e forti sono i miei nemici ma da tutti tu mi libererai sui tuoi sentieri mi conduci non mi smarriro mai sorgi per me squarcia ancora il mio buio entra con me nella fornace di fuoco abbattero il gigante spostero le montagne dalla roccia signor mi disseterai anche nella mia prigione dalla fossa del leone mi salverai grido a te signore dal profondo risolleva il mio cuore stanco il peccato mio lo riconosco tu perdona e non ricordarlo la mia causa sia nelle tue mani nei potenti io non confidero solo tu conosci la mia strada e cammini con me rit coda anche nella mia prigione dalla fossa del leone mi salverai mi salverai 566',type:'N',i:598},
{n:'567',t:'TI LODERÒ (MIO SIGNORE)',c:'Ti loderò mio Signore,  \nfonte di vita,  \nsapienza e verità. \nDolce presenza del cuore,  \ntu mio sostegno, \nsei tu la brezza del mattino  \nche pace porterà. \n \nTi loderò. \nTi loderò mio Signore,  \n\nmite sentiero della carità. \nFiamma che non muore mai,  \ntu, grazia immensa, \nsei tu la luce nella notte  \nche i passi guiderà. \n \nTi loderò. \nTi loderò mio Signore,  \nstrada sicura della santità. \nLa tua parola è salvezza,  \ntu, mia speranza, \nsei l’acqua viva che la sete  \nper sempre spegnerà. \n \nTi loderò, \nTi loderò, \nTi loderò.',s:'ti lodero mio signore ti lodero mio signore fonte di vita sapienza e verita dolce presenza del cuore tu mio sostegno sei tu la brezza del mattino che pace portera ti lodero ti lodero mio signore mite sentiero della carita fiamma che non muore mai tu grazia immensa sei tu la luce nella notte che i passi guidera ti lodero ti lodero mio signore strada sicura della santita la tua parola e salvezza tu mia speranza sei l acqua viva che la sete per sempre spegnera ti lodero ti lodero ti lodero 567',type:'N',i:599},
{n:'568',t:'TU SEI IL RE DEI RE',c:'Gesù Cristo tu sei il Re dei re, \nGesù Cristo tu sei il Figlio di Dio. \nDella mia vita tu sei il Signore \ndi tutto il mio passato tu sei il Signore. \n \nTU SEI IL RE, TU SEI IL RE. \nNON ADORO NESSUN ALTRO FUORI DI TE. \nTU SEI IL RE, TU SEI IL RE. \nRICONOSCO IN TE IL MIO LIBERATORE. \n \nDi ogni mia parola tu sei il Signor \ndi ogni mia azione tu sei il Signore \nDella mia casa tu sei il Signore \ntutta la creazione tu sei il Signore. (RIT) \n \nSu ogni peccato tu sei il Signor \nsu ogni malattia tu sei il Signor. \nDi ogni mio progetto tu sei il Signor, \ndi ogni mio servizio tu sei il Signore. (RIT) \n \nPonte \n \nTu sei il Re. \n\nTu sei il Re (7 volte) \nTu sei il Re. \nOh oh oh \nTu sei il Re. \nOh oh oh \nTu sei il Re. \nTu sei il Re. \nTu sei il Re. \nTu sei il Re. \nTu sei il Re.',s:'tu sei il re dei re gesu cristo tu sei il re dei re gesu cristo tu sei il figlio di dio della mia vita tu sei il signore di tutto il mio passato tu sei il signore tu sei il re tu sei il re non adoro nessun altro fuori di te tu sei il re tu sei il re riconosco in te il mio liberatore di ogni mia parola tu sei il signor di ogni mia azione tu sei il signore della mia casa tu sei il signore tutta la creazione tu sei il signore rit su ogni peccato tu sei il signor su ogni malattia tu sei il signor di ogni mio progetto tu sei il signor di ogni mio servizio tu sei il signore rit ponte tu sei il re tu sei il re 7 volte tu sei il re oh oh oh tu sei il re oh oh oh tu sei il re tu sei il re tu sei il re tu sei il re tu sei il re 568',type:'N',i:600}

var tipo='all';
var filtrati=canti;

function render(lista) {
  var h='';
  var max=150;
  for (var i=0;i<lista.length && i<max;i++) {
    var c=lista[i];
    var cls=c.type==='A'?'A':'N';
    h+='<div class="item" onclick="apri('+c.i+')"><div class="num '+cls+'">'+c.n+'</div><div class="title">'+c.t+'</div></div>';
  }
  if (lista.length>max) h+='<div style="text-align:center;padding:12px;color:#666;font-weight:800;">'+max+' mostrati su '+lista.length+' - scrivi meglio</div>';
  if (lista.length===0) h='<div style="text-align:center;padding:30px;color:#666;font-weight:800;">Nessun canto trovato</div>';
  document.getElementById('list').innerHTML=h;
  document.getElementById('info').innerHTML=lista.length+' trovati - Tocca titolo per testo';
}

function cerca() {
  var q=document.getElementById('search').value.toLowerCase().trim();
  q=q.replace(/[àáâãä]/g,'a').replace(/[èéêë]/g,'e').replace(/[ìíîï]/g,'i').replace(/[òóôõö]/g,'o').replace(/[ùúûü]/g,'u');
  q=q.replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
  if (q==='') {
    filtrati=[];
    for (var i=0;i<canti.length;i++) if (tipo==='all'||canti[i].type===tipo) filtrati.push(canti[i]);
  } else {
    var terms=q.split(' ');
    filtrati=[];
    for (var i=0;i<canti.length;i++) {
      var c=canti[i];
      if (tipo!=='all' && c.type!==tipo) continue;
      var ok=true;
      for (var t=0;t<terms.length;t++) if (terms[t] && c.s.indexOf(terms[t])<0) {ok=false;break;}
      if (ok) filtrati.push(c);
    }
  }
  render(filtrati);
}

function filtro(t,b) {
  tipo=t;
  var chips=document.querySelectorAll('.chip');
  for (var i=0;i<chips.length;i++) chips[i].classList.remove('active');
  b.classList.add('active');
  cerca();
}

function pulisci() {
  document.getElementById('search').value='';
  tipo='all';
  var chips=document.querySelectorAll('.chip');
  for (var i=0;i<chips.length;i++) chips[i].classList.remove('active');
  document.getElementById('cAll').classList.add('active');
  cerca();
}

function apri(idx) {
  var c=canti[idx];
  document.getElementById('mtitle').innerText=c.n+' - '+c.t;
  document.getElementById('mlyrics').innerText=c.c;
  document.getElementById('modal').style.display='block';
}
function chiudi() {document.getElementById('modal').style.display='none';}

document.getElementById('search').addEventListener('keydown', function(e){if(e.key==='Enter') cerca();});

render(canti);
document.getElementById('info').innerText='601 canti caricati - Scrivi e premi CERCA';
</script>
