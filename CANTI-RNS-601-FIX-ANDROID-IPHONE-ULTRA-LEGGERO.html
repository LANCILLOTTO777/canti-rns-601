{n:'49',t:'CANTERÒ ALLELUIA',c:'Grande, Signore, potente sei Re,  \n\nè senza fine la tua maestà. (x2)  \n \nCANTERÒ ALLELUIA,  \nCANTERÒ PER L\'ETERNITÀ ALLELUIA.  \nCANTERÒ, CANTERÒ PER TE.  \nCANTERÒ, CANTERÒ PER TE.  \nCANTERÒ, CANTERÒ PER TE.  \n  \n Grande,  Signore, potente sei Re, \n la tua vittoria per sempre sarà. (x2) (RIT) \n  \nGrande, Signore, potente sei Re,  \nla tua salvezza è per l\'eternità. (x2) (RIT) \n  \n(coda facoltativa) \n \n  \n     \nAlleluia   alleluia. (x8).   (RIT) \n \n   \nCANTERÒ, CANTERÒ PER TE.',s:'cantero alleluia grande signore potente sei re e senza fine la tua maesta x2 cantero alleluia cantero per l eternita alleluia cantero cantero per te cantero cantero per te cantero cantero per te grande signore potente sei re la tua vittoria per sempre sara x2 rit grande signore potente sei re la tua salvezza e per l eternita x2 rit coda facoltativa alleluia alleluia x8 rit cantero cantero per te 49',type:'N',i:81},
{n:'50',t:'CANTIAM LODE A DIO',c:'Cantiam lode a Dio, lode a Dio,  \neleviam le nostre mani lodando Dio.  \nCantiam lode a Dio, lode a Dio,  \neleviam le nostre mani lodando Dio.  \n  \nCantiam gloria...  \n \nGesù è il Signor...  \n \nAlleluia ...',s:'cantiam lode a dio cantiam lode a dio lode a dio eleviam le nostre mani lodando dio cantiam lode a dio lode a dio eleviam le nostre mani lodando dio cantiam gloria gesu e il signor alleluia 50',type:'N',i:82},
{n:'51',t:'CANTIAMO CON GIOIA',c:'CANTIAMO CON GIOIA AL NOSTRO DIO,   \nGRIDIAMO CON FORZA AL NOSTRO RE!  \nLE MANI BATTIAMO,INSIEME DANZIAMO,  \nCANTIAMO PER LA FELICITÀ!  \n   \nRialza chiunque è caduto,  \nRafforza chi è debole tra noi,  \nchi è triste ritrova in lui la gioia.  \nSu canta insieme a noi  \ne grida più che puoi   \nche Gesù Cristo è il Signor! (RIT) \n\n Eterna è la sua misericordia,   \nfedele per sempre è il suo amor,   \ncon forza ha sconfitto il nemico.  \nSu canta insieme a noi  \ne grida più che puoi  \nche Gesù Cristo è il Signor! (RIT) \n   \n…LE  MANI BATTIAMO, INSIEME  DANZIAMO  \n  CANTIAMO PER LA FELICITÀ… \n  CANTIAMO PER LA FELICITÀ!',s:'cantiamo con gioia cantiamo con gioia al nostro dio gridiamo con forza al nostro re le mani battiamo insieme danziamo cantiamo per la felicita rialza chiunque e caduto rafforza chi e debole tra noi chi e triste ritrova in lui la gioia su canta insieme a noi e grida piu che puoi che gesu cristo e il signor rit eterna e la sua misericordia fedele per sempre e il suo amor con forza ha sconfitto il nemico su canta insieme a noi e grida piu che puoi che gesu cristo e il signor rit le mani battiamo insieme danziamo cantiamo per la felicita cantiamo per la felicita 51',type:'N',i:83},
{n:'52',t:'CANTIAMO INSIEME',c:'Cantiamo insiem  \nalla potenza del Signor,  \nche verrà, \nalla potenza del Signor \nalziam le man \ndiam gloria a Dio  \nsenza timor \nci salverà.  \nEgli è Gesù Cristo il Signor.  \n  \nGridiamo  insiem...  \n \nDanziamo  insiem...  \n \nSaltiamo insiem...   \n \nLodiamo insiem...  \n \nBattiam le man...',s:'cantiamo insieme cantiamo insiem alla potenza del signor che verra alla potenza del signor alziam le man diam gloria a dio senza timor ci salvera egli e gesu cristo il signor gridiamo insiem danziamo insiem saltiamo insiem lodiamo insiem battiam le man 52',type:'N',i:84},
{n:'53',t:'CANTICO DEI TRE GIOVANI',c:'Benedite opere tutte del Signore il Signore,  \nlodatelo ed esaltatelo nei secoli.  \nBenedite angeli del Signore il Signore,  \nbenedite cieli il Signore.  \nBenedite acque tutte, che siete sopra i cieli,  \nil Signore.  \nBenedite potenze tutte del Signore il Signore,   \nlode e gloria nei secoli.  \n  \nBENEDICA ISRAELE IL SIGNORE,  \n\nLO LODI E LO ESALTI NEI SECOLI.  \n  \nBenedite piogge e rugiade il Signore,  \nbenedite o venti tutti il Signore.  \nBenedite fuoco e calore il Signore,  \nbenedite freddo e caldo il Signore.   \nBenedite rugiada e brina il Signore,  \nbenedite gelo e freddo il Signore.  \nBenedite ghiacci e nevi il Signore,  \nbenedite notti e giorni il Signore. (RIT) \n  \nBenedite sacerdoti del Signore il Signore,  \nlodatelo ed esaltatelo nei secoli.  \nBenedite servi del Signore il Signore,  \nlodatelo ed esaltatelo nei secoli.  \nBenedite anime dei giusti il Signore,  \nlode e gloria nei secoli.  \nBenedite pii ed umili di cuore il Signore,  \nlode e gloria nei secoli. (RIT)',s:'cantico dei tre giovani benedite opere tutte del signore il signore lodatelo ed esaltatelo nei secoli benedite angeli del signore il signore benedite cieli il signore benedite acque tutte che siete sopra i cieli il signore benedite potenze tutte del signore il signore lode e gloria nei secoli benedica israele il signore lo lodi e lo esalti nei secoli benedite piogge e rugiade il signore benedite o venti tutti il signore benedite fuoco e calore il signore benedite freddo e caldo il signore benedite rugiada e brina il signore benedite gelo e freddo il signore benedite ghiacci e nevi il signore benedite notti e giorni il signore rit benedite sacerdoti del signore il signore lodatelo ed esaltatelo nei secoli benedite servi del signore il signore lodatelo ed esaltatelo nei secoli benedite anime dei giusti il signore lode e gloria nei secoli benedite pii ed umili di cuore il signore lode e gloria nei secoli rit 53',type:'N',i:85},
{n:'54',t:'CANTICO  DELL\'AGNELLO',c:'GRANDI E MIRABILI SONO LE TUE OPERE  \nSIGNORE DIO ONNIPOTENTE,  \nGIUSTE E VERACI SONO LE TUE VIE  \nO RE DELLE GENTI.  \n  \nChi non temerà il tuo nome,  \no Signore,  \nchi non ti darà gloria,  \ntu solo sei santo. (RIT) \n  \nTutte le genti verranno,  \ndavanti a te si prostreranno  \nperché i tuoi giusti giudizi  \nSignore hai manifestato. (RIT) \n  \nTutte le genti verranno,  \ndavanti a te si prostreranno  \nperché i tuoi giusti giudizi  \nSignore hai manifestato. (RIT)',s:'cantico dell agnello grandi e mirabili sono le tue opere signore dio onnipotente giuste e veraci sono le tue vie o re delle genti chi non temera il tuo nome o signore chi non ti dara gloria tu solo sei santo rit tutte le genti verranno davanti a te si prostreranno perche i tuoi giusti giudizi signore hai manifestato rit tutte le genti verranno davanti a te si prostreranno perche i tuoi giusti giudizi signore hai manifestato rit 54',type:'N',i:86},
{n:'55',t:'CANTICO DI ANNA',c:'IL MIO CUORE ESULTA NEL SIGNOR,  \nLA MIA FRONTE SI INNALZA  \nGRAZIE AL MIO DIO  \n\nPERCHÉ GODO DEI SUOI BENEFICI,  \nNON C\'È SANTO COME IL SIGNOR.    \n  \nNon vi siano discorsi superbi,   \nné arroganza sulla vostra bocca;  \nil Signore è il Dio che sa tutto,   \nle sue opere sono  eterne. (RIT) \n  \nL\'arco dei forti si è spezzato,  \nma i deboli son pieni di vigore.  \nSette volte la sterile ha partorito  \ne la ricca di figli è sfiorita. (RIT) \n \nIl Signore fa vivere e morire,  \nil Signore abbassa  ed esalta;  \nsolleva il misero dalla polvere  \ne gli assegna un trono di gloria. (RIT)  \n  \nAl Signore appartiene la terra,  \nsui passi dei giusti egli veglia.  \nMa gli empi svaniscono nelle tenebre,  \nil Signore sconfigge i nemici. (RIT)',s:'cantico di anna il mio cuore esulta nel signor la mia fronte si innalza grazie al mio dio perche godo dei suoi benefici non c e santo come il signor non vi siano discorsi superbi ne arroganza sulla vostra bocca il signore e il dio che sa tutto le sue opere sono eterne rit l arco dei forti si e spezzato ma i deboli son pieni di vigore sette volte la sterile ha partorito e la ricca di figli e sfiorita rit il signore fa vivere e morire il signore abbassa ed esalta solleva il misero dalla polvere e gli assegna un trono di gloria rit al signore appartiene la terra sui passi dei giusti egli veglia ma gli empi svaniscono nelle tenebre il signore sconfigge i nemici rit 55',type:'N',i:87},
{n:'56',t:'CANTO DI GIUDITTA',c:'LODATE  IL MIO DIO CON TIMPANI, \nCANTATE AL SIGNORE CON CEMBALI.  \n  \nS\'inneggi a lui con canti di lode  \npoiché è il Signore  \nche stronca le guerre.  \nGioite  e proclamatelo a gran voce.  \nLui mi ha portato  \ndi nuovo col suo popolo. (RIT) \n  \nT\'innalzerò un cantico Signore,   \ngrande e glorioso nella tua potenza.  \nTi sia sottomessa ogni creatura.  \nCon la tua Parola doni la vita. (RIT) \n  \nManda il tuo Spirito Signore,   \nnessuno può resistere alla tua voce.  \nSussultano i cuori dei tuoi figli  \nal tuo passare, o immenso Dio. (RIT)',s:'canto di giuditta lodate il mio dio con timpani cantate al signore con cembali s inneggi a lui con canti di lode poiche e il signore che stronca le guerre gioite e proclamatelo a gran voce lui mi ha portato di nuovo col suo popolo rit t innalzero un cantico signore grande e glorioso nella tua potenza ti sia sottomessa ogni creatura con la tua parola doni la vita rit manda il tuo spirito signore nessuno puo resistere alla tua voce sussultano i cuori dei tuoi figli al tuo passare o immenso dio rit 56',type:'N',i:88},
{n:'57',t:'CELEBRIAMO IL DIO D\'AMORE',c:'Cambia il tuo dolor nella gioia sua,  \nha operato in te il Signor.  \nSiam riuniti qui per cantare a lui,  \ncelebriamo il Dio d\'amor.  \n  \nÈ Gesù il Signor, egli è il Redentor,  \nil suo regno proclamiam.  \nL\'ombra fuggirà, splenderà il Signor,  \ncelebriamo il Dio d\'amor.  \n  \nSenti intorno a noi               (senti intorno a noi)  \nl\'universo che, senza fine loda il suo Signor.  \n(senza fine, senza fine)   \n \nCambia il tuo dolor nella gioia sua...  \n \nE Gesù il Signor, egli è il Redentor...  \n  \nSenti intorno a noi...  \n  \nCambia il tuo dolor nella gioia sua...  \n \nÈ Gesù il Signor, egli è il Redentor...  \n \nCelebriamo il Dio d\'amor,  \ncelebriamo il Dio d\'amor,      d\'amor.  I',s:'celebriamo il dio d amore cambia il tuo dolor nella gioia sua ha operato in te il signor siam riuniti qui per cantare a lui celebriamo il dio d amor e gesu il signor egli e il redentor il suo regno proclamiam l ombra fuggira splendera il signor celebriamo il dio d amor senti intorno a noi senti intorno a noi l universo che senza fine loda il suo signor senza fine senza fine cambia il tuo dolor nella gioia sua e gesu il signor egli e il redentor senti intorno a noi cambia il tuo dolor nella gioia sua e gesu il signor egli e il redentor celebriamo il dio d amor celebriamo il dio d amor d amor i 57',type:'N',i:89},
{n:'58',t:'CELEBRIAMO IL SIGNORE',c:'Celebriamo  il Signore.  \n{x4)  \n \nÈ risorto, è risorto e per sempre lui vivrà.   \nÈ risorto, è risorto, su canta insieme a noi  \nla vittoria del Signor. (da capo)',s:'celebriamo il signore celebriamo il signore x4 e risorto e risorto e per sempre lui vivra e risorto e risorto su canta insieme a noi la vittoria del signor da capo 58',type:'N',i:90},
{n:'59',t:'CERCO SOLO TE',c:'Cerco solo te, Signor mio liberatore   \nsei fonte dell\'amore, tu riempi la mia vita.    \ncerco solo te, Signor mio liberatore  \nsei fonte dell\'amore, tu riempi la mia vita.  \n  \nVolgi il tuo sguardo su di me Dio d\'immensa bontà  \ne rendi forte la mia fede, più non vacillerò.  \nCrea un cuore puro in me,  rinnova il mio spirito,  \nla mia bocca proclami la tua lode.  \n \n(da capo)  \n \n\nCerco solo te, Signor mio liberatore  \nsei fonte dell\'amore, tu riempi la mia vita.  \n  \nCerco solo te, Signor.  \nCerco solo te, Signor.  \n  \nVolgi il tuo sguardo su di me Dio d\'immensa bontà  \ne rendi forte la mia fede, più non vacillerò.  \nCrea un cuore puro in me, rinnova il mio spirito,  \nla mia bocca proclami la tua lode.  \n \nCerco solo te, Signor mio liberatore  \nsei fonte dell\'amore, tu riempi la mia vita.',s:'cerco solo te cerco solo te signor mio liberatore sei fonte dell amore tu riempi la mia vita cerco solo te signor mio liberatore sei fonte dell amore tu riempi la mia vita volgi il tuo sguardo su di me dio d immensa bonta e rendi forte la mia fede piu non vacillero crea un cuore puro in me rinnova il mio spirito la mia bocca proclami la tua lode da capo cerco solo te signor mio liberatore sei fonte dell amore tu riempi la mia vita cerco solo te signor cerco solo te signor volgi il tuo sguardo su di me dio d immensa bonta e rendi forte la mia fede piu non vacillero crea un cuore puro in me rinnova il mio spirito la mia bocca proclami la tua lode cerco solo te signor mio liberatore sei fonte dell amore tu riempi la mia vita 59',type:'N',i:91},
{n:'60',t:'CESAREA DI FILIPPO',c:'La gente chi dice ch\'io sia?                      Che sei Geremia.  \nChe pensa del Figlio dell\'uomo?               Che tu sei il Battista. \nUno mi ha detto che                                  Ma io credo che, \nsei un rivoluzionario.                                  che tu sei il Messia,   \n \nSei un profeta vero                                    che sei il Figlio  \no un illuso?                                                di Dio \n \nMA CRISTO È UN AMICO CHE  \nNON CONDANNA MAI, NON TRADISCE MAI.  \nMA CRISTO È LA SPERANZA PER NOI,  \nÈ LA FORZA CHE CI ACCOMPAGNERÀ.  \n  \nIo sono la strada e la vita,                    Sei la verità.  \nio sono il Pastore che cerca.                Tu sei il mio Papà. \nUno mi ha detto che                             Ma io credo che, \nnon hai vinto il mondo.                         che tu hai vinto il mondo, \nTutto è rimasto, il male,                        tu mi dai \ncome prima.                                         speranza. \n \nMA CRISTO È UN AMICO CHE  \nNON CONDANNA MAI, NON TRADISCE MAI.  \nMA CRISTO È LA SPERANZA PER NOI,  \nÈ LA FORZA CHE CI ACCOMPAGNERÀ.  \n \n          \n  \nNessuno di voi mi domanda:                 Dove va il Signore? \nL\'angoscia si abbatte su voi,                 Tu ci lasci soli.  \nuno mi ha detto che                              Ma io credo che \n\ntu non ritornerai,                                   manderai il tuo Spirito \nche tu non sarai                                    a cambiare \npiù con  noi.                                          il mondo! \n  \nMA CRISTO È UN AMICO CHE  \nNON CONDANNA MAI, NON TRADISCE MAI.  \nMA CRISTO È LA SPERANZA PER NOI,  \nÈ LA FORZA CHE CI ACCOMPAGNERÀ.',s:'cesarea di filippo la gente chi dice ch io sia che sei geremia che pensa del figlio dell uomo che tu sei il battista uno mi ha detto che ma io credo che sei un rivoluzionario che tu sei il messia sei un profeta vero che sei il figlio o un illuso di dio ma cristo e un amico che non condanna mai non tradisce mai ma cristo e la speranza per noi e la forza che ci accompagnera io sono la strada e la vita sei la verita io sono il pastore che cerca tu sei il mio papa uno mi ha detto che ma io credo che non hai vinto il mondo che tu hai vinto il mondo tutto e rimasto il male tu mi dai come prima speranza ma cristo e un amico che non condanna mai non tradisce mai ma cristo e la speranza per noi e la forza che ci accompagnera nessuno di voi mi domanda dove va il signore l angoscia si abbatte su voi tu ci lasci soli uno mi ha detto che ma io credo che tu non ritornerai manderai il tuo spirito che tu non sarai a cambiare piu con noi il mondo ma cristo e un amico che non condanna mai non tradisce mai ma cristo e la speranza per noi e la forza che ci accompagnera 60',type:'N',i:92},
{n:'61',t:'CHI CI SEPARERÀ',c:'Chi mi separerà dal tuo amor,  \nin ogni avversità, sofferenza o nudità   \nson più che vincitore   \nperché tu mi hai amato o Signore.  \n   \nChi mi separerà dal tuo amor,  \nmorte o vita, principati o potestà,  \npresente o avvenire,  \nmai niente separarmi potrà dal tuo amor.  \n \nChi ci separerà dal tuo amor,  \nin ogni avversità, sofferenza o nudità  \nsiam più che vincitori  \nperché tu ci hai amato o Signore  \n  \nChi ci separerà dal tuo amor,  \nmorte o vita, principati o potestà,  \npresente o avvenire,  \nmai niente separarci potrà dal tuo amor  \n  \nPerché tu ci hai amato o Signore, o Signore.  \n  \nChi ci separerà dal tuo amor,   \nmorte o vita, principati o potestà,  \npresente o avvenire,  \nmai niente separarci potrà dal tuo amore. \n \n(coda facoltativa)  \n  \nDal tuo amore,  \ndal tuo amore,  \ndal tuo amore,  \ndal tuo amore,  \ndal tuo amore,  \ndal tuo amore,  \n\ndal tuo amore.  \nMai niente separarci potrà  \ndal tuo amor.',s:'chi ci separera chi mi separera dal tuo amor in ogni avversita sofferenza o nudita son piu che vincitore perche tu mi hai amato o signore chi mi separera dal tuo amor morte o vita principati o potesta presente o avvenire mai niente separarmi potra dal tuo amor chi ci separera dal tuo amor in ogni avversita sofferenza o nudita siam piu che vincitori perche tu ci hai amato o signore chi ci separera dal tuo amor morte o vita principati o potesta presente o avvenire mai niente separarci potra dal tuo amor perche tu ci hai amato o signore o signore chi ci separera dal tuo amor morte o vita principati o potesta presente o avvenire mai niente separarci potra dal tuo amore coda facoltativa dal tuo amore dal tuo amore dal tuo amore dal tuo amore dal tuo amore dal tuo amore dal tuo amore mai niente separarci potra dal tuo amor 61',type:'N',i:93},
{n:'62',t:'CHI HA SETE',c:'CHI HA SETE VENGA E BEVA DA ME  \nA NUOVA VITA VERRÀ  \nPERCHÉ LA MIA ACQUA COME SORGENTE  \nDA LUI SGORGHERÀ.  \n  \nNon avranno fame, niente li turberà,  \ndietro l\'Agnello, loro pastore,  \nin pascoli erbosi, ad acque limpide. (RIT)  \n  \nViene sulle nubi e ognuno lo vedrà:  \n\"lo sono l’alfa, sono l\'omega,  \nprincipio e fine, il primo e l\'ultimo\". (RIT)  \n  \nSei Parola viva, Dio di verità  \nguida i tuoi servi, tu che ci salvi.  \nLa vita che doni è amore e libertà. (RIT) \n  \nTi lodiamo o Cristo, gloria e onore a te.  \nSorga la terra, cantino i cieli,  \nproclami ogni lingua la tua fedeltà. (RIT)',s:'chi ha sete chi ha sete venga e beva da me a nuova vita verra perche la mia acqua come sorgente da lui sgorghera non avranno fame niente li turbera dietro l agnello loro pastore in pascoli erbosi ad acque limpide rit viene sulle nubi e ognuno lo vedra lo sono l alfa sono l omega principio e fine il primo e l ultimo rit sei parola viva dio di verita guida i tuoi servi tu che ci salvi la vita che doni e amore e liberta rit ti lodiamo o cristo gloria e onore a te sorga la terra cantino i cieli proclami ogni lingua la tua fedelta rit 62',type:'N',i:94},
{n:'63',t:'CI LIBERERA\' IL SIGNOR',c:'CI LIBERERÀ IL SIGNOR, Cl LIBERERÀ IL SIGNOR,  \nCOL SUO BRACCIO SANTO  Cl LIBERERÀ.  \nCI LIBERERÀ IL SIGNOR, CI LIBERERÀ IL SIGNOR,  \nDAL LACCIO DELLA MORTE  CI LIBERERÀ.  \n  \nGrande è il nostro Dio nella sua bontà,  \nnon ci lascia soli nelle avversità.  \nE se il piede destro dal laccio scioglierà  \nquesto nostro piede per lui danzerà.  \n  \n...e se l\'altro piede             ...anche questo piede...  \n \n...se la mano destra          ...questa mano destra ...  \n \n...e se l\'altra mano             ...anche questa mano...  \n \n...e se il nostro corpo         ...tutto il nostro corpo...',s:'ci liberera il signor ci liberera il signor cl liberera il signor col suo braccio santo cl liberera ci liberera il signor ci liberera il signor dal laccio della morte ci liberera grande e il nostro dio nella sua bonta non ci lascia soli nelle avversita e se il piede destro dal laccio sciogliera questo nostro piede per lui danzera e se l altro piede anche questo piede se la mano destra questa mano destra e se l altra mano anche questa mano e se il nostro corpo tutto il nostro corpo 63',type:'N',i:95},
{n:'64',t:'COL TUO AMOR',c:'COL TUO AMOR, COL TUO POTER  \nGESÙ RIEMPI LA MIA VITA.  (x2)  \n   \nEd io ti adorerò con tutto il cuore,   \ned io ti adorerò con tutta la mente,   \ned io ti adorerò con tutte le forze,   \ntu sei il mio Dio! (RIT)   \n \n \nE cercherò il tuo volto  \ncon tutto il cuore.  \nE cercherò il tuo volto  \ncon tutta la mente.  \nE cercherò il tuo volto  \ncon tutte le forze.  \n \nEd io ti adorerò…. \n  \nTu sei il mio Dio,  \ntu sei il mio Signor,  \nsei il mio Signor.',s:'col tuo amor col tuo amor col tuo poter gesu riempi la mia vita x2 ed io ti adorero con tutto il cuore ed io ti adorero con tutta la mente ed io ti adorero con tutte le forze tu sei il mio dio rit e cerchero il tuo volto con tutto il cuore e cerchero il tuo volto con tutta la mente e cerchero il tuo volto con tutte le forze ed io ti adorero tu sei il mio dio tu sei il mio signor sei il mio signor 64',type:'N',i:96},
{n:'65',t:'COME È BELLO',c:'COME È BELLO, COME DÀ GIOIA  \nCHE I FRATELLI STIANO INSIEME.  \n  \nÈ come unguento che dal capo discende  \ngiù sulla barba di Aronne. (x2) (RIT)    \n  \nÈ come unguento che dal capo discende  \ngiù sugli orli del manto. (x2)  (RIT)   \n  \nCome rugiada che dall\'Ermon discende  \ngiù sui monti di Sion. (x2) (RIT)   \n  \nCi benedica il Signore dall\'alto:  \nla vita ci dona in eterno. (x2) (RIT)',s:'come e bello come e bello come da gioia che i fratelli stiano insieme e come unguento che dal capo discende giu sulla barba di aronne x2 rit e come unguento che dal capo discende giu sugli orli del manto x2 rit come rugiada che dall ermon discende giu sui monti di sion x2 rit ci benedica il signore dall alto la vita ci dona in eterno x2 rit 65',type:'N',i:97},
{n:'66',t:'COM\'È BELLO (dar lode al Signor}',c:'COM\'È BELLO DAR LODE AL SIGNOR  \nCANTARE AL NOME TUO SANTO  \nE DI GIORNO ANNUNZIARE IL TUO AMOR   \nLA TUA FEDELTÀ PER SEMPRE   \nLA TUA FEDELTÀ SIGNOR.  \n\n  \nSono grandi le tue opere    \nprofondi i tuoi pensier.  \nNon tutti possono intenderli    \nma tu l\'eccelso sei. (RIT)   \n  \nTu mi doni la tua forza  \nmi riempi di te  \nper annunziare che in te Signor  \nc’è sicurezza e amor. (RIT)',s:'com e bello dar lode al signor com e bello dar lode al signor cantare al nome tuo santo e di giorno annunziare il tuo amor la tua fedelta per sempre la tua fedelta signor sono grandi le tue opere profondi i tuoi pensier non tutti possono intenderli ma tu l eccelso sei rit tu mi doni la tua forza mi riempi di te per annunziare che in te signor c e sicurezza e amor rit 66',type:'N',i:98},
{n:'67',t:'COME DAVIDE',c:'Come Davide che cantò a Jahvè,   \ndanzerò ed esulterò  \ndavanti al Re dei re!            (danzare)  \n  \nCome Miryam che suonò i timpani,  \nbatterò le mie mani  \ndavanti al Re dei re!                   (battere le mani)  \n  \nCome Giuda fece in battaglia,  \nfaremo un suono gioioso  \ndavanti al Re dei re!                   (marciare gridando: \"Alleluia!\")  \n  \nCome Giosuè fece a Gerico,  \ngridiamo la nostra vittoria  \ndavanti al Re dei re!                   (marciare gridando:  \"Teru\'ah!\")  \n   \nNoi veniam davanti a te   \nper adorarti,o Re.    \nNoi veniam e t\'adoriam,  \nGesù sei il Re!',s:'come davide come davide che canto a jahve danzero ed esultero davanti al re dei re danzare come miryam che suono i timpani battero le mie mani davanti al re dei re battere le mani come giuda fece in battaglia faremo un suono gioioso davanti al re dei re marciare gridando alleluia come giosue fece a gerico gridiamo la nostra vittoria davanti al re dei re marciare gridando teru ah noi veniam davanti a te per adorarti o re noi veniam e t adoriam gesu sei il re 67',type:'N',i:99},
{n:'68',t:'COME TU MI VUOI',c:'Eccomi Signor, vengo a te mio Re,  \nche si compia in me la tua volontà.   \nEccomi Signor, vengo a te mio Dio,  \nplasma il cuore mio e di te vivrò.  \nSe tu lo vuoi Signore manda me  \ne il tuo Nome annuncerò.  \n  \nCOME TU MI  VUOI IO SARÒ, \nDOVE TU MI VUOI IO ANDRÒ.   \nQUESTA VITA IO VOGLIO DONARLA A TE   \nPER DAR GLORIA AL TUO NOME MIO RE.    \nCOME TU MI VUOI IO SARÒ,   \n\nDOVE TU MI VUOI IO ANDRÒ.  \nSE MI GUIDA IL TUO AMORE PAURA NON HO,   \nPER SEMPRE IO SARÒ COME TU MI VUOI.  \n  \nEccomi Signor, vengo a te mio Re,  \nche si compia in me la tua volontà.  \nEccomi Signor, vengo a te mio Dio,  \nplasma il cuore mio e di te vivrò.  \nTra le tue mani mai più vacillerò  \ne strumento tuo sarò. (RIT)   \n \n(coda facoltativa) \n  \nCOME TU MI VUOI (x2) \n(IO SARÒ) COME TU MI VUOI (x3) \n(IO SARÒ) COME TU MI VUOI.',s:'come tu mi vuoi eccomi signor vengo a te mio re che si compia in me la tua volonta eccomi signor vengo a te mio dio plasma il cuore mio e di te vivro se tu lo vuoi signore manda me e il tuo nome annuncero come tu mi vuoi io saro dove tu mi vuoi io andro questa vita io voglio donarla a te per dar gloria al tuo nome mio re come tu mi vuoi io saro dove tu mi vuoi io andro se mi guida il tuo amore paura non ho per sempre io saro come tu mi vuoi eccomi signor vengo a te mio re che si compia in me la tua volonta eccomi signor vengo a te mio dio plasma il cuore mio e di te vivro tra le tue mani mai piu vacillero e strumento tuo saro rit coda facoltativa come tu mi vuoi x2 io saro come tu mi vuoi x3 io saro come tu mi vuoi 68',type:'N',i:100},
{n:'69',t:'CON GIOIA VENIAMO A TE',c:'Tu ci raduni da ogni parte del mondo,   \nnoi siamo i tuoi figli, tuo popolo santo.    \nLodiamo in coro con le schiere celesti,   \ninsieme cantiamo, gioiosi acclamiamo.  \n  \nO SIGNORE VENIAMO A TE  \nCON I CUORI RICOLMI DI GIOIA,   \nTI RINGRAZIAMO PER I DONI CHE DAI   \nE PER L\'AMORE CHE RIVERSI IN NOI.  \nO SIGNORE VENIAMO A TE  \nCON I CUORI RICOLMI DI GIOIA,   \nLE NOSTRE MANI INNALZIAMO AL CIELO,   \nA TE CON GIOIA VENIAM.  \n  \nLa Parola che ci doni, Signore,  \nillumina i cuori, ci mostra la via.  \nDove andremo se non resti con noi?  \nTu solo sei vita, tu sei verità. (RIT)   \n  \nLa grazia immensa che ci doni, Signore,   \npurifica i cuori, consola i tuoi figli  \nNel tuo Nome noi speriamo Signore,  \nsalvezza del mondo, eterno splendore. (RIT)   \n   \n(oppure coda facoltativa) \n \nCANTIAMO    \n\nO SIGNORE VENIAMO A TE  \nCON I CUORI RICOLMI DI GIOIA,    \nTI RINGRAZIAMO PER I DONI CHE DAI  \nE PER L\'AMORE CHE RIVERSI IN NOI.  \nO SIGNORE VENIAMO A TE  \nCON I CUORI RICOLMI DI GIOIA,  \nLE NOSTRE MANI INNALZIAMO AL CIELO,    \nA TE CON GIOIA VENIAM.  \nA TE CON GIOIA VENIAM.  \nA TE CON GIOIA VENIAM.  \nO SIGNOR    A TE CON GIOIA VENIAM.',s:'con gioia veniamo a te tu ci raduni da ogni parte del mondo noi siamo i tuoi figli tuo popolo santo lodiamo in coro con le schiere celesti insieme cantiamo gioiosi acclamiamo o signore veniamo a te con i cuori ricolmi di gioia ti ringraziamo per i doni che dai e per l amore che riversi in noi o signore veniamo a te con i cuori ricolmi di gioia le nostre mani innalziamo al cielo a te con gioia veniam la parola che ci doni signore illumina i cuori ci mostra la via dove andremo se non resti con noi tu solo sei vita tu sei verita rit la grazia immensa che ci doni signore purifica i cuori consola i tuoi figli nel tuo nome noi speriamo signore salvezza del mondo eterno splendore rit oppure coda facoltativa cantiamo o signore veniamo a te con i cuori ricolmi di gioia ti ringraziamo per i doni che dai e per l amore che riversi in noi o signore veniamo a te con i cuori ricolmi di gioia le nostre mani innalziamo al cielo a te con gioia veniam a te con gioia veniam a te con gioia veniam o signor a te con gioia veniam 69',type:'N',i:101},
{n:'70',t:'CON IL TUO SANGUE',c:'Prendi questo pane, accettalo,   \ncon le tue mani consacralo,   \ncon il tuo Santo Spirito  trasformalo.  \n  \nPrendi questo vino, accettalo,  \ncon le tue mani consacralo,  \ncon il tuo Santo Spirito trasformalo.  \n  \nCon il tuo sguardo convertimi,  \ncon le tue lacrime bagnami,  \ncon il tuo Santo Spirito rinnovami.  \n  \nCon il tuo sangue lavami,  \ncon le tue piaghe guariscimi,  \ncon il tuo Santo Spirito rinnovami.  \n  \nCon la tua mano sollevami,  \ncon la tua croce attirami,  \ncon il tuo Santo Spirito rinnovami.  \n  \nCon il tuo amore salvami,  \nnella tua morte immergimi,  \ncon il tuo Santo Spirito rinnovami.  \n  \nNella tua vita nascondimi,  \nper la tua gloria usami,  \ncon il tuo Santo Spirito rinnovami.',s:'con il tuo sangue prendi questo pane accettalo con le tue mani consacralo con il tuo santo spirito trasformalo prendi questo vino accettalo con le tue mani consacralo con il tuo santo spirito trasformalo con il tuo sguardo convertimi con le tue lacrime bagnami con il tuo santo spirito rinnovami con il tuo sangue lavami con le tue piaghe guariscimi con il tuo santo spirito rinnovami con la tua mano sollevami con la tua croce attirami con il tuo santo spirito rinnovami con il tuo amore salvami nella tua morte immergimi con il tuo santo spirito rinnovami nella tua vita nascondimi per la tua gloria usami con il tuo santo spirito rinnovami 70',type:'N',i:102},
{n:'71',t:'CONFIDO IN TE',c:'O mio Signore Gesù \nche hai vissuto per me \npene e afflizione   e sulla croce   \n\nhai dato tanto amor.  \n  \nCONFIDO IN TE MIO SIGNOR,  \nQUANTO È GRANDE IL TUO AMOR.  \nSOLO PER TE VIVRÒ PERCHÉ  \nTU Ml HAI INSEGNATO AD AMAR.  \n  \nDi\' a tuo Padre: \"Perdona...\",  \ndi\' a tua Madre: \"Ecco tuo figlio...\"  \ndi\' a me stesso o Salvator:  \n\"Oggi saremo in  Paradiso!\". (RIT)   \n  \nNon mi lasciare Gesù,  \nti prego non mi abbandonar.  \nlo ho sete solo di te,  \nfontana di acqua viva. (RIT)   \n  \nI miei giorni se ne vanno via,  \ncompiuto tutto sarà.  \nAlle tue mani ora e per sempre  \nil mio spirito affido. (RIT)',s:'confido in te o mio signore gesu che hai vissuto per me pene e afflizione e sulla croce hai dato tanto amor confido in te mio signor quanto e grande il tuo amor solo per te vivro perche tu ml hai insegnato ad amar di a tuo padre perdona di a tua madre ecco tuo figlio di a me stesso o salvator oggi saremo in paradiso rit non mi lasciare gesu ti prego non mi abbandonar lo ho sete solo di te fontana di acqua viva rit i miei giorni se ne vanno via compiuto tutto sara alle tue mani ora e per sempre il mio spirito affido rit 71',type:'N',i:103},
{n:'72',t:'CONFITEMINI DOMINO',c:'Confitemini Domino  \nquoniam bonus.   \nConfitemini Domino.  \nAlleluia!',s:'confitemini domino confitemini domino quoniam bonus confitemini domino alleluia 72',type:'N',i:104},
{n:'73',t:'CORPO DI GESÙ',c:'Corpo di Gesù offerto a noi.  \nCorpo di Gesù offerto a noi.  \nCorpo di Gesù offerto a noi.  \nCorpo di Gesù offerto a noi.   \n  \nSangue di Gesù donato a noi...   \n \nSpirito di Gesù effuso in noi...',s:'corpo di gesu corpo di gesu offerto a noi corpo di gesu offerto a noi corpo di gesu offerto a noi corpo di gesu offerto a noi sangue di gesu donato a noi spirito di gesu effuso in noi 73',type:'N',i:105},
{n:'74',t:'CREATI PER TE',c:'Tu ci hai fatti per te,  \nnella tua immensità,  \nnel tuo grande amore tu Signore  \nci hai creati per te.  \n\nE il nostro cuore non trova pace  \nse Signor, tu non sei qui con noi.  \n  \nNOI TI DIAMO GLORIA,  \nDIAMO GLORIA A TE SIGNORE,   \nRE DEL CIELO DIAMO GLORIA,  \nDIAMO GLORIA A TE SIGNORE,    \nRE DI OGNI COSA SEI,  \nRE DI OGNI COSA SEI.',s:'creati per te tu ci hai fatti per te nella tua immensita nel tuo grande amore tu signore ci hai creati per te e il nostro cuore non trova pace se signor tu non sei qui con noi noi ti diamo gloria diamo gloria a te signore re del cielo diamo gloria diamo gloria a te signore re di ogni cosa sei re di ogni cosa sei 74',type:'N',i:106},
{n:'75',t:'CRISTO È RISORTO VERAMENTE',c:'CRISTO È RISORTO VERAMENTE, ALLELUIA!  \nGESÙ, IL VIVENTE, QUI CON NOI RESTERÀ.   \nCRISTO GESÙ, CRISTO GESÙ  \nÈ IL SIGNORE DELLA VITA.  \nMorte, dov\'è la tua vittoria?  \nPaura non mi puoi far più   \nSe sulla croce io morirò insieme a lui,  \npoi insieme a lui risorgerò. (RIT)   \n  \nTu, Signore, amante della vita,  \nmi hai creato per l\'eternità.  \nLa vita mia tu dal sepolcro strapperai,  \ncon questo mio corpo ti vedrò (RIT)   \n  \nTu mi hai donato la tua vita,  \nio voglio donar la mia a te.  \nFa\' che possa dire: \"Cristo vive anche in me\"  \ne quel giorno io risorgerò. (RIT)',s:'cristo e risorto veramente cristo e risorto veramente alleluia gesu il vivente qui con noi restera cristo gesu cristo gesu e il signore della vita morte dov e la tua vittoria paura non mi puoi far piu se sulla croce io moriro insieme a lui poi insieme a lui risorgero rit tu signore amante della vita mi hai creato per l eternita la vita mia tu dal sepolcro strapperai con questo mio corpo ti vedro rit tu mi hai donato la tua vita io voglio donar la mia a te fa che possa dire cristo vive anche in me e quel giorno io risorgero rit 75',type:'N',i:107},
{n:'76',t:'CRISTO VIVE IN ME',c:'Cristo vive in me,      (in te, in noi) alleluia. \nCristo vive in me,  \noh che meraviglia  è che Cristo vive in me!',s:'cristo vive in me cristo vive in me in te in noi alleluia cristo vive in me oh che meraviglia e che cristo vive in me 76',type:'N',i:108},
{n:'77',t:'CUSTODISCIMI',c:'Ho detto a Dio: senza di te  \nalcun bene non ho, custodiscimi.   \nMagnifica è la mia  eredità,   \nbenedetto sei tu, sempre sei con me.  \n   \nCUSTODISCIMI, MIA FORZA SEI TU.  \nCUSTODISCIMI MIA GIOIA GESU! (x2) \n  \nTi pongo sempre innanzi a me,  \n\nal sicuro sarò, mai vacillerò.  \nVia, verità e vita sei,  \nmio Dio credo che tu mi guiderai. (RIT)',s:'custodiscimi ho detto a dio senza di te alcun bene non ho custodiscimi magnifica e la mia eredita benedetto sei tu sempre sei con me custodiscimi mia forza sei tu custodiscimi mia gioia gesu x2 ti pongo sempre innanzi a me al sicuro saro mai vacillero via verita e vita sei mio dio credo che tu mi guiderai rit 77',type:'N',i:109},
{n:'78',t:'DA\' GLORIA AL TUO NOME',c:'DA\' GLORIA AL TUO NOME, O SIGNORE,  \nRISPLENDA LA TUA LUCE SU DI NOI.   \nPER LA TUA FEDELTÀ E PER LA TUA GRAZIA,   \nNON A NOI SIGNORE MA AL TUO NOME DA\' GLORIA.  \n  \nPerché i popoli dovrebbero dire: \"Dov\'è il loro Dio?\".  \nIl nostro Dio è nei ciel, egli compie ciò che vuole. (RIT)   \n  \nIsraele confida nel Signore, egli è loro aiuto e scudo.  \nConfida nel Signore chi lo teme, Dio è loro aiuto e scudo. (RIT)   \n  \nSiate benedetti dal Signore che ha fatto cielo e terra.  \nI cieli sono del Signore, la terra ha dato agli uomini.  \n(RIT)',s:'da gloria al tuo nome da gloria al tuo nome o signore risplenda la tua luce su di noi per la tua fedelta e per la tua grazia non a noi signore ma al tuo nome da gloria perche i popoli dovrebbero dire dov e il loro dio il nostro dio e nei ciel egli compie cio che vuole rit israele confida nel signore egli e loro aiuto e scudo confida nel signore chi lo teme dio e loro aiuto e scudo rit siate benedetti dal signore che ha fatto cielo e terra i cieli sono del signore la terra ha dato agli uomini rit 78',type:'N',i:110},
{n:'79',t:'DAI LA MANO A TUO FRATELLO',c:'DAI LA MANO A TUO FRATELLO  \nDAI LA MANO. (x2)  \n \nDAGLI UN CALDO BENVENUTO,   \nMOSTRA A LUI IL VOLTO SERENO,  \nDAI LA MANO A TUO FRATELLO,  \nDAI LA MANO. (tutto x2)  \nCi ha riuniti per lodarlo  \ned insieme ringraziarlo  \nper i doni che darà  \na chi con fede  \nli chiederà.  (RIT)    \n  \nE riuniti nel suo amore  \nformeremo un solo cuore  \ned insieme nella gioia  \ngiungeremo alla sua gloria. (RIT)',s:'dai la mano a tuo fratello dai la mano a tuo fratello dai la mano x2 dagli un caldo benvenuto mostra a lui il volto sereno dai la mano a tuo fratello dai la mano tutto x2 ci ha riuniti per lodarlo ed insieme ringraziarlo per i doni che dara a chi con fede li chiedera rit e riuniti nel suo amore formeremo un solo cuore ed insieme nella gioia giungeremo alla sua gloria rit 79',type:'N',i:111},
{n:'80',t:'DALLA TRISTEZZA ALLA DANZA',c:'EGLI HA CAMBIATO IL MIO PIANTO  \nE LA MIA TRISTEZZA IN DANZA.  \nPROCLAMERÒ E CANTERÒ  \nLA SUA GIOIA IN ME. (x2)  \n  \nDove c\'era il dolore,  \n\noperò  la  guarigione.  \nDove c\'era sofferenza,  \nci donò consolazione.  \nSento il suo dolce amor per me  \nche mi illumina  \ne la sua luce brillerà  \nnell\'oscurità del nostro cuore. (RIT)   \n  \nDove c\'era il dolore, operò la guarigione...  \n(RIT)   \n  \nE su di noi la tua collera Signor,  \nun istante durerà,  \nma la tua bontà sarà per sempre.  \n(RIT)',s:'dalla tristezza alla danza egli ha cambiato il mio pianto e la mia tristezza in danza proclamero e cantero la sua gioia in me x2 dove c era il dolore opero la guarigione dove c era sofferenza ci dono consolazione sento il suo dolce amor per me che mi illumina e la sua luce brillera nell oscurita del nostro cuore rit dove c era il dolore opero la guarigione rit e su di noi la tua collera signor un istante durera ma la tua bonta sara per sempre rit 80',type:'N',i:112},
{n:'81',t:'DATE GLORIA A LUI',c:'LODATE IL SIGNORE, POPOLI TUTTI,  \nVOI TUTTE NAZIONI, DATE GLORIA A LUI,  \n POICHÉ È FORTE IL SUO AMORE PER NOI,  \n LA  SUA FEDELTÀ DURA IN ETERNO. (x2)  \n \nDall\'angoscia mi  ha liberato,  \negli è Dio e mi ha tratto in salvo.  \nIl Signore è con me, non avrò mai paura.  \n(RIT)   \n  \nMia forza e mio canto è il Signore,  \nla sua destra compie meraviglie.  \nPer sempre proclamerò le tue gesta Signore. (RIT)   \n \n(cosa facoltativa) \n  \nLodate il Signore,  popoli tutti,  \nlodate il Signore, popoli tutti.  \nLodate il Signore, a lui la gloria.  \nGloria, gloria,  gloria al Signor. Gloria a lui.  \n  \nLodate il Signore, lodate.  \nLodate il Signore, lodate.   \nLodate, lodate il Signore.   \n  \nLodate, lodate il Signor!',s:'date gloria a lui lodate il signore popoli tutti voi tutte nazioni date gloria a lui poiche e forte il suo amore per noi la sua fedelta dura in eterno x2 dall angoscia mi ha liberato egli e dio e mi ha tratto in salvo il signore e con me non avro mai paura rit mia forza e mio canto e il signore la sua destra compie meraviglie per sempre proclamero le tue gesta signore rit cosa facoltativa lodate il signore popoli tutti lodate il signore popoli tutti lodate il signore a lui la gloria gloria gloria gloria al signor gloria a lui lodate il signore lodate lodate il signore lodate lodate lodate il signore lodate lodate il signor 81',type:'N',i:113},
{n:'82',t:'DEGNO SEI SIGNOR',c:'Degno sei Signor di gloria,  \ndegno sei Signor di gloria,   \ndegno sei Signor di gloria,  \n\ndegno sei Signor di gloria.  \n  \nDegno sei Signor di lode, (x3)  \ndegno sei Signor di lode.   \n \nDegno sei Signor di onore, (x4)  \n \nDegno sei Signor di potenza. (x4)',s:'degno sei signor degno sei signor di gloria degno sei signor di gloria degno sei signor di gloria degno sei signor di gloria degno sei signor di lode x3 degno sei signor di lode degno sei signor di onore x4 degno sei signor di potenza x4 82',type:'N',i:114},
{n:'83',t:'DIAMO LODE',c:'DIAMO LODE AL SIGNOR, DIAMO LODE,  \nDIAMO LODE AL SIGNOR (x2)  \n  \nEd al mattino gli uccelli cantano  \na lode e gloria di Dio Salvator. (x2)  \n  \nDIAMO GRAZIE…  \n  \nE per le strade i ragazzi cantan  \na lode e gloria di Dio Salvator. (x2)  \n  \nDIAMO GLORIA…  \n  \nE tu fratello canta con noi  \na lode e gloria di Dio Salvator. (x2)  \n  \nDIAMO AMORE…  \n  \nE tu sorella canta con noi  \na lode e gloria di Dio Salvator. (x2)  \n  \nDIAMO FESTA…  \n  \nE tutti insieme cantiam con gioia  \na lode e gloria di Dio Salvator. (x2)  \n  \nALLELUIA AL SIGNORE, ALLELUIA…',s:'diamo lode diamo lode al signor diamo lode diamo lode al signor x2 ed al mattino gli uccelli cantano a lode e gloria di dio salvator x2 diamo grazie e per le strade i ragazzi cantan a lode e gloria di dio salvator x2 diamo gloria e tu fratello canta con noi a lode e gloria di dio salvator x2 diamo amore e tu sorella canta con noi a lode e gloria di dio salvator x2 diamo festa e tutti insieme cantiam con gioia a lode e gloria di dio salvator x2 alleluia al signore alleluia 83',type:'N',i:115},
{n:'84',t:'DIO APRIRA\' UNA VIA',c:'Dio aprirà una via dove sembra non ci sia,   \ncome opera non so, ma una nuova via vedrò.   \nDio mi guiderà, mi terrà vicino a sé.  \nPer ogni giorno amore e forza  \nlui mi donerà, una via aprirà.  \n\n  \nTraccerà una strada nel deserto,  \nfiumi d\'acqua viva io vedrò.  \nSe tutto passerà  \nla sua parola resterà,  \nuna cosa nuova lui farà.  \n \n(tutto da capo)',s:'dio aprira una via dio aprira una via dove sembra non ci sia come opera non so ma una nuova via vedro dio mi guidera mi terra vicino a se per ogni giorno amore e forza lui mi donera una via aprira traccera una strada nel deserto fiumi d acqua viva io vedro se tutto passera la sua parola restera una cosa nuova lui fara tutto da capo 84',type:'N',i:116},
{n:'85',t:'DIO MIO RE',c:'TI ESALTO SIGNORE MIO RE,  \nORA E SEMPRE TI LODERÒ.  \nDIO MIO SALVATORE, DIO MIO  RE,  \nIN ETERNO IL TUO NOME ESALTERÒ.  \n(ESALTERÒ)  \nTI ESALTO SIGNORE MIO RE,  \nORA E SEMPRE TI LODERÒ.  \nDIO MIO SALVATORE, DIO MIO RE,  \nIN ETERNO IL TUO NOME ESALTERÒ.  \n  \nSignore mia forza tu sei, Dio della mia speranza.   \nL\'anima  mia è ricolma  della tua grazia,  \nrenderò onore e gloria al tuo Nome, mio Re. (RIT)    \n  \nPer questo io ti rendo grazie, Dio della mia salvezza.  \nHai trasformato il mio cuore con la tua potenza,  \nrenderò onore e gloria al tuo Nome, mio Re. (RIT)  \n \n(oppure coda facoltativa)   \n  \nTI ESALTO SIGNORE MIO RE,  \nORA E SEMPRE TI LODERÒ.  \nDIO MIO SALVATORE, DIO MIO RE,  \nIN ETERNO IL TUO NOME ESALTERÒ.  \n \nTI ESALTO SIGNORE MIO RE,  \nORA E SEMPRE TI LODERÒ.  \nDIO MIO SALVATORE, DIO MIO RE,  \nIN ETERNO IL TUO NOME ESALTERÒ.  \nIN ETERNO ESALTERÒ  \nESALTERÒ  \n(ESALTERÒ)  \nESALTERÒ  \n(ESALTERÒ)',s:'dio mio re ti esalto signore mio re ora e sempre ti lodero dio mio salvatore dio mio re in eterno il tuo nome esaltero esaltero ti esalto signore mio re ora e sempre ti lodero dio mio salvatore dio mio re in eterno il tuo nome esaltero signore mia forza tu sei dio della mia speranza l anima mia e ricolma della tua grazia rendero onore e gloria al tuo nome mio re rit per questo io ti rendo grazie dio della mia salvezza hai trasformato il mio cuore con la tua potenza rendero onore e gloria al tuo nome mio re rit oppure coda facoltativa ti esalto signore mio re ora e sempre ti lodero dio mio salvatore dio mio re in eterno il tuo nome esaltero ti esalto signore mio re ora e sempre ti lodero dio mio salvatore dio mio re in eterno il tuo nome esaltero in eterno esaltero esaltero esaltero esaltero esaltero 85',type:'N',i:117},
{n:'86',t:'DIO REGNA',c:'Come è bello sentir sulle montagne   \nil passo di chi porta lieti annunci,   \n\nproclama la pace, annuncia la salvezza:  \nil nostro Dio regna, Dio regna.  \n  \nDIO REGNA, DIO REGNA,  \nDIO REGNA, DIO REGNA. (x2)  \n  \nCantate inni, cantate con gioia,  \nrovine di Gerusalemme,  \nperché il Signore consola il suo popolo:  \nil nostro Dio salva. Dio salva.  \n \nDIO SALVA, DIO SALVA,  \nDIO SALVA, DIO SALVA.  \n(x2)  \n  \nIl Signore stende il suo braccio santo  \ndavanti ai popoli della terra.  \nTutti i confini del mondo lo vedranno:  \nil nostro Dio ama, Dio ama.  \nDIO AMA, DIO AMA  \nDIO AMA, DIO AMA. (x2)',s:'dio regna come e bello sentir sulle montagne il passo di chi porta lieti annunci proclama la pace annuncia la salvezza il nostro dio regna dio regna dio regna dio regna dio regna dio regna x2 cantate inni cantate con gioia rovine di gerusalemme perche il signore consola il suo popolo il nostro dio salva dio salva dio salva dio salva dio salva dio salva x2 il signore stende il suo braccio santo davanti ai popoli della terra tutti i confini del mondo lo vedranno il nostro dio ama dio ama dio ama dio ama dio ama dio ama x2 86',type:'N',i:118},
{n:'87',t:'DOLCE E\' LODARLO',c:'LODATE IL SIGNORE, È BELLO CANTARE A DIO,   \nDOLCE È LODARLO COME A LUI CONVIENE.  \n \nIl Signore ricostruisce Gerusalemme  \nraduna  i dispersi d\'Israele.  \nRisana i cuori affranti e fascia le ferite,  \negli conta il numero delle stelle. (RIT) \n  \nGrande è il Signore onnipotente,  \nla sua sapienza non ha confini.  \nIl Signore sostiene tutti gli umili  \nma abbassa fino a terra tutti gli empi. (RIT) \n  \nCantate al Signore un canto di grazie,  \nintonate sulla cetra inni a Dio.  \nEgli copre il cielo di grandi nubi,  \nprepara la pioggia per la terra. (RIT) \n  \nEgli ha messo pace nei tuoi confini  \ne ti sazia con fior di frumento.  \nManda sulla terra la sua Parola,  \nil suo messaggio corre veloce. (RIT)',s:'dolce e lodarlo lodate il signore e bello cantare a dio dolce e lodarlo come a lui conviene il signore ricostruisce gerusalemme raduna i dispersi d israele risana i cuori affranti e fascia le ferite egli conta il numero delle stelle rit grande e il signore onnipotente la sua sapienza non ha confini il signore sostiene tutti gli umili ma abbassa fino a terra tutti gli empi rit cantate al signore un canto di grazie intonate sulla cetra inni a dio egli copre il cielo di grandi nubi prepara la pioggia per la terra rit egli ha messo pace nei tuoi confini e ti sazia con fior di frumento manda sulla terra la sua parola il suo messaggio corre veloce rit 87',type:'N',i:119},
{n:'88',t:'È APPARSO L\'ANGELO GABRIEL',c:'(coro) È apparso l\'angelo Gabriel  \ndavanti ad una Vergine:  \n(uomo) \"Darai alla luce il Messia  \ne lo chiamerai Gesù\".  \n  \n(donna) Dal mio Signore ho ricevuto,  \n finora l\'ho servito   \nsia fatta la sua volontà,  \nmi abbandono al suo amor.  \n  \n(coro) È apparso l\'angelo Gabriel  \ndavanti ad una Vergine:  \n(uomo) \"Darai alla luce il Messia  \ne lo chiamerai Gesù\".  \n \n(donna) Magnifico è il Signore e santo è il suo Nome,  \nha innalzato gli umili, ha soccorso lsrael.  \n  \n(coro) È apparso  l\'angelo Gabriel  \ndavanti ad una Vergine:  \n(uomo) \"Darai alla luce il Messia  \ne lo chiamerai Gesù\".  \n \n(coro) Dio si fece bambino e di carne Maria lo coprì,  \ns\'immerse nella vita e morì per ognuno di noi.  \n  \n(coro) La, la, la, la, la ...  \n(uomo) \"Darai alla luce il Messia  \nil suo nome è Emmanuel\".  \n(coro) È apparso l\'angelo Gabriel  \ndavanti ad una Vergine.',s:'e apparso l angelo gabriel coro e apparso l angelo gabriel davanti ad una vergine uomo darai alla luce il messia e lo chiamerai gesu donna dal mio signore ho ricevuto finora l ho servito sia fatta la sua volonta mi abbandono al suo amor coro e apparso l angelo gabriel davanti ad una vergine uomo darai alla luce il messia e lo chiamerai gesu donna magnifico e il signore e santo e il suo nome ha innalzato gli umili ha soccorso lsrael coro e apparso l angelo gabriel davanti ad una vergine uomo darai alla luce il messia e lo chiamerai gesu coro dio si fece bambino e di carne maria lo copri s immerse nella vita e mori per ognuno di noi coro la la la la la uomo darai alla luce il messia il suo nome e emmanuel coro e apparso l angelo gabriel davanti ad una vergine 88',type:'N',i:120},
{n:'89',t:'È BELLO DIMORARE IN TE',c:'È BELLO DIMORARE IN TE  \nO MIO SIGNOR,  \nLA MIA ANIMA ESULTA NEL TUO AMOR.  \nALLA TUA PRESENZA  \nIL MIO CUORE RIEMPIRAI (2: DI GIOIA),  \n(prima volta da capo)  \n \nÈ BELLO DIMORARE IN TE.  \n  \nTrova anche rifugio il passer  \n\ne la rondine il nido ai suoi piccoli.  \nIl pellegrino si rifugia dalla tempesta.  \nBeato chi trova in te la forza sua.   (RIT) \n  \nUn solo giorno è meglio  \nquando è speso per te, Signor,  \nche mille vissuti senza te.  \nLa tua mano protegga chi confida in te  \ne benedica i retti di cuor. (RIT)',s:'e bello dimorare in te e bello dimorare in te o mio signor la mia anima esulta nel tuo amor alla tua presenza il mio cuore riempirai 2 di gioia prima volta da capo e bello dimorare in te trova anche rifugio il passer e la rondine il nido ai suoi piccoli il pellegrino si rifugia dalla tempesta beato chi trova in te la forza sua rit un solo giorno e meglio quando e speso per te signor che mille vissuti senza te la tua mano protegga chi confida in te e benedica i retti di cuor rit 89',type:'N',i:121},
{n:'90',t:'È IL SIGNOR',c:'È il Signor, è il Signor,  \nè  risorto dalla morte ed è il Signor,  \nogni ginocchio si pieghi ed ogni lingua professi  \nche Gesù Cristo è il Signor.',s:'e il signor e il signor e il signor e risorto dalla morte ed e il signor ogni ginocchio si pieghi ed ogni lingua professi che gesu cristo e il signor 90',type:'N',i:122},
{n:'91',t:'È VERSO DI TE CHE GUARDO',c:'È verso di te che guardo,  \ncon te voglio camminar.  \nInnalzo le mani  per incontrarti,  \nil mio cuore vuol cantar,   \nper  benedire il tuo nome,  \nperché tu sei fedel.  \n  \nGESÙ, O GESÙ, IO VOGLIO DONAR,  \nGESÙ, O GESÙ, LA MIA VITA A TE.  \n  \nGuardando la tua gloria,  \nla fede crescerà.  \nHo pace e gioia dentro il cuore  \nda quando ho creduto in te.  \nAl mondo dirò che  \ntu sei il Signore  \nche salva e guarisce ancor.  \n \nGESU\', O GESU\' DI TE PARLERÒ,  \nGESU\', O GESU\', PER L\'ETERNITA\'.',s:'e verso di te che guardo e verso di te che guardo con te voglio camminar innalzo le mani per incontrarti il mio cuore vuol cantar per benedire il tuo nome perche tu sei fedel gesu o gesu io voglio donar gesu o gesu la mia vita a te guardando la tua gloria la fede crescera ho pace e gioia dentro il cuore da quando ho creduto in te al mondo diro che tu sei il signore che salva e guarisce ancor gesu o gesu di te parlero gesu o gesu per l eternita 91',type:'N',i:123},
{n:'92',t:'ED ORA SIGNORE',c:'ED ORA SIGNORE TU SEI IN ME,  \nNELLA TUA IMMENSITÀ HAI SCELTO ME.  \n  \nDall\'alto dei cieli  \nsulla terra sei venuto,  \n\nhai portato tanto amore per ogni cuore.  \n \nCome cibo eterno ti sei trasformato,  \npane e vino, Corpo e Sangue,  \nti sei frazionato.       \n \n \nTu mio Dio e Signore    \n       \n \nsei morto di un folle amore,    \n       \n \nmi hai liberato dal mio passato,  \ndal mio peccato. (RIT) \n \nSulle tue mani      \nmi hai formato, accarezzato,         \n \ndal tuo Volto santo sono stato ammirato.  \n  \n     \n \n\"È cosa buona e giusta\"    \n      \n \ntu mi hai detto,    \n\"Non posso mai lasciarti    \n      \n \nmai dimenticarti\". \n  \n  \n     \nLa tua fedeltà va oltre tutti i tempi,        \nmi hai giurato amore, amore per sempre. (RIT)',s:'ed ora signore ed ora signore tu sei in me nella tua immensita hai scelto me dall alto dei cieli sulla terra sei venuto hai portato tanto amore per ogni cuore come cibo eterno ti sei trasformato pane e vino corpo e sangue ti sei frazionato tu mio dio e signore sei morto di un folle amore mi hai liberato dal mio passato dal mio peccato rit sulle tue mani mi hai formato accarezzato dal tuo volto santo sono stato ammirato e cosa buona e giusta tu mi hai detto non posso mai lasciarti mai dimenticarti la tua fedelta va oltre tutti i tempi mi hai giurato amore amore per sempre rit 92',type:'N',i:124},
{n:'93',t:'EMMANUEL',c:'Emmanuel, Emmanuel, Emmanuel!  \n  \nTu sei con noi ... (x3) \nTu sei l\'amor ...   \nTu sei la luce ...  \nTu sei la gioia ...   \nMaranathà ...  \nVieni Signor ...  \n \nGrazie Signor ...  \nSpirito è amor ...   \nLode al Signor ...  \nGloria al Signor ...   \nGesù è il Signor ...  \nAlleluia ...  \nEmmanuel, Emmanuel, Emmanuel!',s:'emmanuel emmanuel emmanuel emmanuel tu sei con noi x3 tu sei l amor tu sei la luce tu sei la gioia maranatha vieni signor grazie signor spirito e amor lode al signor gloria al signor gesu e il signor alleluia emmanuel emmanuel emmanuel 93',type:'N',i:125},
{n:'94',t:'EMMANUEL (inno XV GMG )',c:'Dall\'orizzonte una grande luce  \nviaggia nella storia  \n\ne lungo gli anni ha vinto il buio  \nfacendosi Memoria  \ne illuminando la nostra vita,  \nchiaro ci rivela  \nche non si vive se non si cerca  \nla Verità.  \n \nDa mille strade arriviamo a Roma  \nsui passi della fede,  \nsentiamo l\'eco della Parola  \nche risuona ancora  \nda queste mura, da questo cielo  \nper il mondo intero:  \nè vivo oggi, è l\'Uomo vero  \nCristo tra noi.  \n \nSiamo qui  \nsotto la stessa luce,  \nsotto la sua croce,  \ncantando ad  una  voce.  \n  \nÈ l\'Emmanuel, l\'Emmanuel, l\'Emmanuel.  \nE l\'Emmanuel, l\'Emmanuel.  \n  \nDalla città di chi ha versato  \nil sangue per amore  \ned ha cambiato il vecchio mondo  \nvogliamo ripartire,  \nseguendo Cristo, insieme a Pietro,  \nrinasce in noi la fede,  \nParola viva che ci rinnova  \ne cresce in noi.  \n \nSiamo qui  \nsotto la stessa luce,  \nsotto la sua croce  \ncantando ad una voce.  \n  \nÈ l\'Emmanuel, l\'Emmanuel, l\'Emmanuel.  \nÈ l\'Emmanuel, l\'Emmanuel.  \n  \nUn grande dono che Dio ci ha fatto  \nè Cristo, il suo Figlio  \ne l\'umanità è rinnovata,  \nè in lui salvata.  \nÈ vero uomo, è vero Dio,  \nè il Pane della Vita, \n\nche ad ogni uomo ai suoi fratelli  \nridonerà.  \n  \nSiamo qui  \nsotto la stessa luce,  \nsotto la sua croce,  \ncantando ad una voce.  \n  \nÈ l\'Emmanuel, l\'Emmanuel, l\'Emmanuel.  \nÈ l\'Emmanuel, l\'Emmanuel.  \n \nLa morte è uccisa, la vita ha vinto,  \nè Pasqua in tutto il mondo,  \nun vento soffia in ogni uomo  \nlo Spirito fecondo,  \nche porta avanti nella storia  \nla Chiesa sua sposa,  \nsotto lo sguardo di Maria,  \ncomunità.  \n \nSiamo qui  \nsotto la stessa luce,  \nsotto la sua croce,  \ncantando ad una voce.  \n \nÈ l\'Emmanuel, l\'Emmanuel, l\'Emmanuel.  \nÈ l\'Emmanuel, l\'Emmanuel.  \n \nNoi debitori del passato  \ndi secoli di storia,  \ndi vite date per amore,  \ndi santi che han creduto,  \ndi uomini che ad alta quota  \ninsegnano a volare,  \ndi chi la storia sa cambiare,  \ncome Gesù.  \n \nSiamo qui  \nsotto la stessa luce,   \nsotto la sua croce,  \ncantando ad una voce.  \n \nÈ l\'Emmanuel, l\'Emmanuel, l\'Emmanuel.  \nÈ l\'Emmanuel, l\'Emmanuel.  \n  \nÈ giunta un\'era di primavera,  \nè tempo di cambiare.  \n\nÈ oggi il giorno sempre nuovo  \nper ricominciare,  \nper dare nuove svolte, parole nuove  \ne convertire il cuore,  \nper dire al mondo, ad ogni uomo:  \nSignore Gesù. \n \nSiamo qui  \nsotto la stessa luce,  \nsotto la sua croce,  \ncantando ad una voce. \n  \nÈ l\'Emmanuel, l\'Emmanuel, l\'Emmanuel.  \nÈ l\'Emmanuel, l\'Emmanuel.  \n(Sotto la stessa croce, cantando ad una voce)  \n  \nÈ l\'Emmanuel, (Dio con noi)  \nl\'Emmanuel, l\'Emmanuel. (Cristo fra noi)  \nÈ l\'Emmanuel, l\'Emmanuel. (Sotto la stessa croce cantando ad una voce)  \n  \nÈ l\'Emmanuel, l\'Emmanuel, l\'Emmanuel. (Sotto la sua croce) È l\'Emmanuel,l\'Emmanuel.',s:'emmanuel inno xv gmg dall orizzonte una grande luce viaggia nella storia e lungo gli anni ha vinto il buio facendosi memoria e illuminando la nostra vita chiaro ci rivela che non si vive se non si cerca la verita da mille strade arriviamo a roma sui passi della fede sentiamo l eco della parola che risuona ancora da queste mura da questo cielo per il mondo intero e vivo oggi e l uomo vero cristo tra noi siamo qui sotto la stessa luce sotto la sua croce cantando ad una voce e l emmanuel l emmanuel l emmanuel e l emmanuel l emmanuel dalla citta di chi ha versato il sangue per amore ed ha cambiato il vecchio mondo vogliamo ripartire seguendo cristo insieme a pietro rinasce in noi la fede parola viva che ci rinnova e cresce in noi siamo qui sotto la stessa luce sotto la sua croce cantando ad una voce e l emmanuel l emmanuel l emmanuel e l emmanuel l emmanuel un grande dono che dio ci ha fatto e cristo il suo figlio e l umanita e rinnovata e in lui salvata e vero uomo e vero dio e il pane della vita che ad ogni uomo ai suoi fratelli ridonera siamo qui sotto la stessa luce sotto la sua croce cantando ad una voce e l emmanuel l emmanuel l emmanuel e l emmanuel l emmanuel la morte e uccisa la vita ha vinto e pasqua in tutto il mondo un vento soffia in ogni uomo lo spirito fecondo che porta avanti nella storia la chiesa sua sposa sotto lo sguardo di maria comunita siamo qui sotto la stessa luce sotto la sua croce cantando ad una voce e l emmanuel l emmanuel l emmanuel e l emmanuel l emmanuel noi debitori del passato di secoli di storia di vite date per amore di santi che han creduto di uomini che ad alta quota insegnano a volare di chi la storia sa cambiare come gesu siamo qui sotto la stessa luce sotto la sua croce cantando ad una voce e l emmanuel l emmanuel l emmanuel e l emmanuel l emmanuel e giunta un era di primavera e tempo di cambiare e oggi il giorno sempre nuovo per ricominciare per dare nuove svolte parole nuove e convertire il cuore per dire al mondo ad ogni uomo signore gesu siamo qui sotto la stessa luce sotto la sua croce cantando ad una voce e l emmanuel l emmanuel l emmanuel e l emmanuel l emmanuel sotto la stessa croce cantando ad una voce e l emmanuel dio con noi l emmanuel l emmanuel cristo fra noi e l emmanuel l emmanuel sotto la stessa croce cantando ad una voce e l emmanuel l emmanuel l emmanuel sotto la sua croce e l emmanuel l emmanuel 94',type:'N',i:126},
{n:'95',t:'EN EL CIELO SE OYE',c:'En el cielo se oye,  \nen la tierra se canta. (x2)  \nVamos todos alabar al Senor  \ncon panderos y guitarras. (x2)  \n  \nCristo me dijo que luchara etra vez,  \nque luchara otra vez,  \nque luchara otra vez. (x2)  \n  \nQue no me desesperara  \nsino que tuviera fe. (x2)  \nY yo, y yo, y yo lo sigo alabando. (x2)  \n  \nNosotros no, Senor, a ti es al que toca,  \nyo cantaré  \nlo que pongas en mi boca. (x2)  \n  \nLo que pongas, lo que pongas,  \nlo que pongas en mi boca,  \nyo cantaré  \nlo que pongas en mi boca.  \n(x2)',s:'en el cielo se oye en el cielo se oye en la tierra se canta x2 vamos todos alabar al senor con panderos y guitarras x2 cristo me dijo que luchara etra vez que luchara otra vez que luchara otra vez x2 que no me desesperara sino que tuviera fe x2 y yo y yo y yo lo sigo alabando x2 nosotros no senor a ti es al que toca yo cantare lo que pongas en mi boca x2 lo que pongas lo que pongas lo que pongas en mi boca yo cantare lo que pongas en mi boca x2 95',type:'N',i:127},
{n:'96',t:'EN LA IGLESIA',c:'En la lglesia vivo yo, en la lglesia vives tu.  \nEn la lglesia amo yo, en la lglesia amas tu.  \nEn la lglesia, en la lglesia vivimos nos dos.  \nEn la lglesia, en la lglesia amamos nos dos.   \nEn el corazòn de la lglesia el Espiritu de Dios  \nguia a todos hacia el Padre caminando con Jesùs.',s:'en la iglesia en la lglesia vivo yo en la lglesia vives tu en la lglesia amo yo en la lglesia amas tu en la lglesia en la lglesia vivimos nos dos en la lglesia en la lglesia amamos nos dos en el corazon de la lglesia el espiritu de dios guia a todos hacia el padre caminando con jesus 96',type:'N',i:128},
{n:'97',t:'ETERNA È LA SUA MISERICORDIA',c:'Celebrate il Signore perché è buono,  \nperché eterna è la sua misericordia.  \nLo dica Israele suo servo:  \nEterna è la sua misericordia. (x2)  \n \n  \n  \nALLELUIA, ALLELUIA, ALLELUIA AL SIGNOR.  \nALLELUIA, ALLELUIA, ALLELUIA  \nAL NOSTRO SALVATOR.  \n  \nDio è con me e non ho timore,  \nè con me e viene in mio aiuto.   \nLo dica chi teme Dio:  \nEterna è la sua misericordia. (x2) (RIT) \n \nDio è il Signore, è la mia luce,  \nè il mio Dio e gli rendo grazie.    \n  \n     \nDanziamo, esultiamo in lui,  \neterna è la sua misericordia. (x2) (RIT)',s:'eterna e la sua misericordia celebrate il signore perche e buono perche eterna e la sua misericordia lo dica israele suo servo eterna e la sua misericordia x2 alleluia alleluia alleluia al signor alleluia alleluia alleluia al nostro salvator dio e con me e non ho timore e con me e viene in mio aiuto lo dica chi teme dio eterna e la sua misericordia x2 rit dio e il signore e la mia luce e il mio dio e gli rendo grazie danziamo esultiamo in lui eterna e la sua misericordia x2 rit 97',type:'N',i:129},
{n:'98',t:'ETERNO SIGNOR',c:'Gloria e onore, lode e potenza   \ndiamo al nostro Signor.  \nOgni nazione, tutta la creazione   \n  \n  \nal Signore si prostrerà.  \n  \nOgni lingua proclamerà la tua gloria, o Dio,    \nogni uomo si prostrerà al tuo trono.  \nEsaltato sempre sarai  \ne il tuo Regno non passerà mai,  \neterno Signor.  \n(x2)  \n  \nSU TUTTA LA TERRA TU REGNERAI,   \n\nCANTA ALL\'ETERNO SIGNOR.  \nPERCHÉ NON C\'È DIO CHE È UGUALE A TE,  \nCANTA ALL\'ETERNO SIGNOR.  \n  \nOgni lingua proclamerà la tua gloria o Dio,   \nogni uomo si prostrerà al tuo trono.  \nEsaltato sempre sarai  \ne il tuo Regno non passerà mai  \neterno Signor. (RIT)',s:'eterno signor gloria e onore lode e potenza diamo al nostro signor ogni nazione tutta la creazione al signore si prostrera ogni lingua proclamera la tua gloria o dio ogni uomo si prostrera al tuo trono esaltato sempre sarai e il tuo regno non passera mai eterno signor x2 su tutta la terra tu regnerai canta all eterno signor perche non c e dio che e uguale a te canta all eterno signor ogni lingua proclamera la tua gloria o dio ogni uomo si prostrera al tuo trono esaltato sempre sarai e il tuo regno non passera mai eterno signor rit 98',type:'N',i:130},
{n:'99',t:'EVENU SHALOM',c:'EVENU SHALOM ALEJEM.  \nEVENU SHALOM ALEJEM.  \nEVENU SHALOM ALEJEM.  \nEVENU SHALOM, SHALOM, SHALOM ALEJEM.  \n  \nE sia la pace con noi. (x3)  \n \nEt la paix soit avec nous.     (x3)  \n  \nEnd sei der friede mit uns. (x3)  \n \nAnd the peace be with us.      (x3)  \n  \nY sea la paz con nosotros.       (x3) \n  \nDiciamo pace al mondo,  \ncantiamo pace al mondo,  \nla nostra vita sia gioiosa,  \ne il mio saluto, pace, giunga fino a voi.',s:'evenu shalom evenu shalom alejem evenu shalom alejem evenu shalom alejem evenu shalom shalom shalom alejem e sia la pace con noi x3 et la paix soit avec nous x3 end sei der friede mit uns x3 and the peace be with us x3 y sea la paz con nosotros x3 diciamo pace al mondo cantiamo pace al mondo la nostra vita sia gioiosa e il mio saluto pace giunga fino a voi 99',type:'N',i:131},
{n:'100',t:'FIGLIA DI SION',c:'D\'improvviso mi son svegliata,   \nil  mio cuore è un battito d\'ali,   \nfra  i colori del nuovo giorno,  \nda lontano l\'ho visto arrivare.  \n \nÈ vestito di rosso il mio re,  \nuna fiamma sull\'orizzonte,   \noro  scende dai suoi capelli,  \ned i fiumi ne son tutti colmi.  \nD\'ORO E DI GEMME MI VESTIRO\',  \nFRA TUTTE LE DONNE SARÒ LA PIÙ BELLA.  \nE QUANDO Il MIO SIGNORE  \n\nMl GUARDERÀ,  \nD\'AMORE IL SUO CUORE TRABOCCHERÀ.  \n  \nFate presto, correte tutti,  \nè il mio sposo che arriva già,  \nsulla strada stendete mantelli,   \naprite le porte della città.  \n \nQuando il Re vedrà la sua sposa  \nfiglia di Sion mi chiamerà  \nné giorno, né notte, né sole, né luna,  \ndella sua luce mi ricoprirà. (RIT) \n  \nD\'ORO E DI GEMME TI VESTIRAI,  \nFRA TUTTE LE DONNE SARAI LA PIÙ BELLA.   \nE QUANDO IL TUO SIGNORE  \nTI GUARDERÀ,  \nD\'AMORE IL SUO CUORE TRABOCCHERÀ.',s:'figlia di sion d improvviso mi son svegliata il mio cuore e un battito d ali fra i colori del nuovo giorno da lontano l ho visto arrivare e vestito di rosso il mio re una fiamma sull orizzonte oro scende dai suoi capelli ed i fiumi ne son tutti colmi d oro e di gemme mi vestiro fra tutte le donne saro la piu bella e quando il mio signore ml guardera d amore il suo cuore trabocchera fate presto correte tutti e il mio sposo che arriva gia sulla strada stendete mantelli aprite le porte della citta quando il re vedra la sua sposa figlia di sion mi chiamera ne giorno ne notte ne sole ne luna della sua luce mi ricoprira rit d oro e di gemme ti vestirai fra tutte le donne sarai la piu bella e quando il tuo signore ti guardera d amore il suo cuore trabocchera 100',type:'N',i:132},
{n:'101',t:'FIGLIO DI DAVIDE',c:'FIGLIO DI DAVIDE ABBI PIETÀ DI ME,   \nSIGNORE SE TU VUOI, SALVARMI PUOI.  \n  \nSe solo riesco a toccare un lembo  \ndel suo mantello, guarita io sarò. (RIT) \nCoraggio donna, coraggio donna  \nla tua fede ti ha guarita. (RIT)',s:'figlio di davide figlio di davide abbi pieta di me signore se tu vuoi salvarmi puoi se solo riesco a toccare un lembo del suo mantello guarita io saro rit coraggio donna coraggio donna la tua fede ti ha guarita rit 101',type:'N',i:133},
{n:'101',t:'FISSA GLI OCCHI',c:'Fissa gli occhi in Gesù,  \nda lui non distoglierli più.  \nE le cose del mondo tu vedi svanir,  \ne una luce di gloria apparir.  \n  \nApri il tuo cuore a Gesù,  \nè lui il tuo Signor.  \nE venuto a salvarti morendo per te,  \ne con lui risorto vivrai.  \n  \nEcco il cuor di Gesù,  \nche tanto gli uomini amò.  \nHa versato sangue ed acqua per te  \nama e adora Gesù.  \n  \nVia, vita è Gesù,  \n\nparola  di verità.  \nE’ l\'icona del Padre che viene per noi  \naccogliamo con gioia Gesù.  \n  \nAccogli nel cuore Gesù,   \nè  il pane di vita per te.  \nSe in lui per sempre tu resterai  \ngioia e forza lui ti darà.  \n  \nEffonde il suo amore Gesù,  \nil cuore vuole cambiar.  \nCon il Padre prende dimora in noi,  \ncreature nuove noi siam.  \n \nLode e gloria al Signor,  \nche salva te peccator.  \nAlleluia, alleluia tu devi gridar   \nè  qui il tuo Signor.',s:'fissa gli occhi fissa gli occhi in gesu da lui non distoglierli piu e le cose del mondo tu vedi svanir e una luce di gloria apparir apri il tuo cuore a gesu e lui il tuo signor e venuto a salvarti morendo per te e con lui risorto vivrai ecco il cuor di gesu che tanto gli uomini amo ha versato sangue ed acqua per te ama e adora gesu via vita e gesu parola di verita e l icona del padre che viene per noi accogliamo con gioia gesu accogli nel cuore gesu e il pane di vita per te se in lui per sempre tu resterai gioia e forza lui ti dara effonde il suo amore gesu il cuore vuole cambiar con il padre prende dimora in noi creature nuove noi siam lode e gloria al signor che salva te peccator alleluia alleluia tu devi gridar e qui il tuo signor 101',type:'N',i:134},
{n:'103',t:'FUOCO CHE CONSUMA',c:'Fuoco che consuma scendi su di noi,  \nbrucia ogni peccato dentro me.  \n \nTu consolazione, tu liberazione,  \nfai che il nostro cuore lodi il Re.  \n  \nGloria all\'Agnello,  \nesaltiamo il nostro Re!  \nRegna sul glorioso trono  \nsolo in lui riposo avrò.',s:'fuoco che consuma fuoco che consuma scendi su di noi brucia ogni peccato dentro me tu consolazione tu liberazione fai che il nostro cuore lodi il re gloria all agnello esaltiamo il nostro re regna sul glorioso trono solo in lui riposo avro 103',type:'N',i:135},
{n:'103',t:'GERICO CADRÀ',c:'LEVIAMO I VESSILLI D\'AMOR, ALLELUIA!  \nLE TROMBE SUONIAMO AL SIGNOR.  \nCRISTO Cl DA LA VITIORIA, ALLELUIA!  \nGERICO CADRA.  \n   \nIl corpo di Cristo è un esercito,   \nche combatte potenze invisibili,   \nche libera i prigionieri,   \nnel nome di Cristo Re! (RIT) \n  \nFratelli il Signore ci chiama,   \n\ncombattiamo accanto a lui,  \negli ci dona la vita  \nper donarla a chi non ne ha. (RIT) \n  \nRestiamo tutti uniti,  \nnello Spirito suo Santo,  \nGesù viene a noi,  \ncon potenza e gloria. (RIT) \nAnnunciamo che lui è risorto  \ne chi crede avrà la salvezza,  \nveniamo contro le tenebre,  \nla potenza di Dio è con noi. (RIT) \n  \nSia lode a Dio che è Padre,  \na suo Figlio Gesù il Signore,  \ncombattendo nello Spirito,  \ngiungeremo alla sua gloria. (RIT)',s:'gerico cadra leviamo i vessilli d amor alleluia le trombe suoniamo al signor cristo cl da la vitioria alleluia gerico cadra il corpo di cristo e un esercito che combatte potenze invisibili che libera i prigionieri nel nome di cristo re rit fratelli il signore ci chiama combattiamo accanto a lui egli ci dona la vita per donarla a chi non ne ha rit restiamo tutti uniti nello spirito suo santo gesu viene a noi con potenza e gloria rit annunciamo che lui e risorto e chi crede avra la salvezza veniamo contro le tenebre la potenza di dio e con noi rit sia lode a dio che e padre a suo figlio gesu il signore combattendo nello spirito giungeremo alla sua gloria rit 103',type:'N',i:136},
{n:'104',t:'GESU\'',c:'Gesù, Gesù, Gesù, Gesù,    \nGesù, Gesù, Gesù.   \nGesù, Gesù, Gesù, Gesù,   \nGesù, Gesù, Gesù.  \n  \nMaria ...',s:'gesu gesu gesu gesu gesu gesu gesu gesu gesu gesu gesu gesu gesu gesu gesu maria 104',type:'N',i:137},
{n:'106',t:'GESÙ (al mattino)',c:'Gesù, Gesù, Gesù al mattino,  \nGesù alla sera  \nGesù, Gesù,  \nanche al tramontar del sol.  \n  \nLodalo, lodalo, lodalo al mattino,  \nlodalo alla sera  \nlodalo, lodalo,  \nanche al tramontar del sol.  \n  \nPregalo ...  \n \nCantalo ...',s:'gesu al mattino gesu gesu gesu al mattino gesu alla sera gesu gesu anche al tramontar del sol lodalo lodalo lodalo al mattino lodalo alla sera lodalo lodalo anche al tramontar del sol pregalo cantalo 106',type:'N',i:138},
{n:'107',t:'GESÙ (invocazione)',c:'Gesù, Gesù, Gesù, Gesù!  \nGesù,  Gesù, Gesù, Gesù!',s:'gesu invocazione gesu gesu gesu gesu gesu gesu gesu gesu 107',type:'N',i:139},
{n:'108',t:'GESÙ (Mi perdonò)',c:'GESÙ, GESÙ,  \nGESÙ, GESÙ, GESÙ.  \n  \nMi perdonò...  \n \nMi liberò...  \n \nMorì per me...  \n \nRisuscitò...  \n \nAlleluia ...',s:'gesu mi perdono gesu gesu gesu gesu gesu mi perdono mi libero mori per me risuscito alleluia 108',type:'N',i:140},
{n:'109',t:'GESÙ (Pentecoste \'81)',c:'Io ti offro mio Signore,  \nla mia vita, il mio cuore,  \ntu sei il mio Salvatore,  \ntu sei il mio liberatore.  \n  \nMARIA…',s:'gesu pentecoste 81 io ti offro mio signore la mia vita il mio cuore tu sei il mio salvatore tu sei il mio liberatore maria 109',type:'N',i:141},
{n:'110',t:'GESÙ AMICO MIO',c:'Senz\'anima ci  guardiamo noi,  \ndagli angoli ci sfidiamo ormai,  \nandiamo avanti senza mai parlare un po\'  \ncresciamo soli e freddi ma ci chiamiamo umanità.  \nTra mura di città quanti soffrono,  \nsperduti rinchiusi in un cerchio senza stimoli.  \nVivere senza mai domandarsi perché  \nio non ci sto, di forza ne ho  \nper cambiare.  \n  \nGESÙ AMICO MIO, LE STRADE PERCORRERÒ  \nTRA GLI OCCHI DI CHI NON SA ANCORA CHI SEI,  \nVORREI GRIDARE CHE TU SEI VIVO   \nANCHE SE QUESTO MONDO ORMAI  \n\nNON GIRA COME VUOI.  \n  \nCON TE AMICO MIO, LA PACE IO CERCHERÒ  \nIL TUO SORRISO E UNA SPERANZA CERTO AVRÒ,  \nTEMPO ANCORA C\'È PER SOGNARE  \nQUELLO CHE TU HAI SOGNATO GIÀ,  \nUN UOMO LIBERO.  \n  \nLa verità segna l\'anima  \nma il mondo sa quanto è scomoda.  \nUn fiore nasce e muore anche se non lo so.   \nMi basta solo questo per sapere che ci sei.   \nTra mura di città parlerò di te,  \nc\'è un uomo che aspetta le parole che non muoiono.   \nCredere, continuare a sperare,  \nio ce la farò, di forza né ho  \nper cambiare. (RIT)',s:'gesu amico mio senz anima ci guardiamo noi dagli angoli ci sfidiamo ormai andiamo avanti senza mai parlare un po cresciamo soli e freddi ma ci chiamiamo umanita tra mura di citta quanti soffrono sperduti rinchiusi in un cerchio senza stimoli vivere senza mai domandarsi perche io non ci sto di forza ne ho per cambiare gesu amico mio le strade percorrero tra gli occhi di chi non sa ancora chi sei vorrei gridare che tu sei vivo anche se questo mondo ormai non gira come vuoi con te amico mio la pace io cerchero il tuo sorriso e una speranza certo avro tempo ancora c e per sognare quello che tu hai sognato gia un uomo libero la verita segna l anima ma il mondo sa quanto e scomoda un fiore nasce e muore anche se non lo so mi basta solo questo per sapere che ci sei tra mura di citta parlero di te c e un uomo che aspetta le parole che non muoiono credere continuare a sperare io ce la faro di forza ne ho per cambiare rit 110',type:'N',i:142},
{n:'111',t:'GESÙ DOLCE MUSICA',c:'Gesù dolce musica al mio cuor,   \nGesù ascolti sempre il mio pregar.  \nGesù quando cado tu sei lì,  \ndolcemente mi rialzi su!  \n  \nGesù è così bello amare te,  \nGesù solo tu non cambi mai,   \nGesù col tuo sangue hai lavato  \nil peccato che era dentro me!  \n \nGesù tu ben presto tornerai,  \nGesù la tua chiesa rapirai,  \nGesù che gran festa allor sarà,  \nsempre insieme per l\'eternità!',s:'gesu dolce musica gesu dolce musica al mio cuor gesu ascolti sempre il mio pregar gesu quando cado tu sei li dolcemente mi rialzi su gesu e cosi bello amare te gesu solo tu non cambi mai gesu col tuo sangue hai lavato il peccato che era dentro me gesu tu ben presto tornerai gesu la tua chiesa rapirai gesu che gran festa allor sara sempre insieme per l eternita 111',type:'N',i:143},
{n:'112',t:'GESÙ È IL SIGNOR',c:'GESÙ È IL SIGNOR, GESÙ È IL SIGNOR,  \nGESÙ È IL SIGNOR, GESÙ È IL SIGNOR.  \n  \nAma il Signor...  \n\nPace...  \nGuarda ...  \nSanto...  \nLoda ...  \nVita ...  \nAlleluia ...  \nLuce...  \nGioia...  \nMaria è la Madre del Signor...',s:'gesu e il signor gesu e il signor gesu e il signor gesu e il signor gesu e il signor ama il signor pace guarda santo loda vita alleluia luce gioia maria e la madre del signor 112',type:'N',i:144},
{n:'113',t:'GESU\' E\' LA PACE',c:'Gesù è la pace che scioglie ogni timor,  \negli è la pace, la nostra pace.  \nGesù è la pace che libera il tuo cuor,  \negli è la  pace, la  nostra pace.  \n \nGetta in lui ogni affanno  \nperché egli avrà cura di te,  \negli  è la pace, la nostra pace.  \nDona a Gesù il tuo cuore e lo risanerà,  \negli  è la  pace, la nostra pace.',s:'gesu e la pace gesu e la pace che scioglie ogni timor egli e la pace la nostra pace gesu e la pace che libera il tuo cuor egli e la pace la nostra pace getta in lui ogni affanno perche egli avra cura di te egli e la pace la nostra pace dona a gesu il tuo cuore e lo risanera egli e la pace la nostra pace 113',type:'N',i:145},
{n:'114',t:'GESÙ È VIVO',c:'Alleluia! Vive il nostro Re.  \nLa  morte è sconfitta, la vittoria è del Signor.    \nLui vivrà per sempre, Gesù vive, Gesù vive.  \n  \nEgli  è l\'alfa e l\'omega, il primo e l\'ultimo.  \nHa  vinto sul peccato e noi abbiam la libertà.  \nL\'Agnello immolato è risorto, è risorto.  \n \n \n(da capo) \n  \nAlleluia! Vive il Signor...',s:'gesu e vivo alleluia vive il nostro re la morte e sconfitta la vittoria e del signor lui vivra per sempre gesu vive gesu vive egli e l alfa e l omega il primo e l ultimo ha vinto sul peccato e noi abbiam la liberta l agnello immolato e risorto e risorto da capo alleluia vive il signor 114',type:'N',i:146},
{n:'115',t:'GESU\' GESU\'',c:'Gesù, Gesù, sono qui davanti a te  \nper cantare il tuo amore   \ne donarti il  cuor.  \n  \nGesù, Gesù, quando al buio ti cercavo   \ndove eri o mio Signor  \n\ndentro al mio cuor.  \n  \nGesù, Gesù, lode e gloria a te,  \nSignor che mi cerchi e mi consoli  \nquando ho triste il cuor.  \nGesù, Gesù, questo è il tempo d\'inneggiare  \nquesto è il tempo di amare  \nchi mi ha preso il cuor.  \n \nGesù, Gesù, mio Dio e mio Salvator  \nio ti credo e ti adoro  \ncon tutto il mio cuor.  \n  \nGesù, Gesù, che sui monti vai annunciando  \nla parola del Signor,  \nparla tu al mio cuor.  \n  \nGesù, Gesù, grazie a te, o mio Signor  \nche nel dì dell\'effusione  \nm\'hai riempito il cuor.  \n \nAlleluia ...',s:'gesu gesu gesu gesu sono qui davanti a te per cantare il tuo amore e donarti il cuor gesu gesu quando al buio ti cercavo dove eri o mio signor dentro al mio cuor gesu gesu lode e gloria a te signor che mi cerchi e mi consoli quando ho triste il cuor gesu gesu questo e il tempo d inneggiare questo e il tempo di amare chi mi ha preso il cuor gesu gesu mio dio e mio salvator io ti credo e ti adoro con tutto il mio cuor gesu gesu che sui monti vai annunciando la parola del signor parla tu al mio cuor gesu gesu grazie a te o mio signor che nel di dell effusione m hai riempito il cuor alleluia 115',type:'N',i:147},
{n:'116',t:'GESÙ MIO REDENTORE',c:'Gesù mio Redentor,  \nla gloria tua risplende.    \nLoderò e innalzerò  \nil nome tuo Signore,  \nrisorto dalla morte.  \nGrande  Signore sei tu per me,  \nio per sempre starò con te Gesù.  \n  \nVIENI MIO SIGNORE, VIENI IN ME   \nE  CONSOLAMI, DIFENDIMI, GUARISCIMI,   \nPERCHÉ SOLO IN TE RIPOSO AVRÒ,  \nETERNO MIO SIGNOR. (x2)  \n  \nDegno sei di lode e onor,  \nSignore io ti adoro.  \nRe dei re io canterò  \na te che hai vinto il mondo,  \nmorendo per amore.   \nGrande Signore sei tu per me,  \nio per sempre starò con te Gesù. (RIT)',s:'gesu mio redentore gesu mio redentor la gloria tua risplende lodero e innalzero il nome tuo signore risorto dalla morte grande signore sei tu per me io per sempre staro con te gesu vieni mio signore vieni in me e consolami difendimi guariscimi perche solo in te riposo avro eterno mio signor x2 degno sei di lode e onor signore io ti adoro re dei re io cantero a te che hai vinto il mondo morendo per amore grande signore sei tu per me io per sempre staro con te gesu rit 116',type:'N',i:148},
{n:'117',t:'GESU\' T\'ADORIAMO',c:'Gesù t\'adoriamo,  \nti proclamiam nostro Re!  \nTu sei qui proprio in mezzo a noi  \ncon lodi noi t\'esaltiam!  \nDi lodi un trono ti prepariam,   \ndi lodi un trono ti prepariam.   \nDi lodi un trono ti prepariam.  \ne tu siedi Signore sei il Re!  \n \n \n(da capo)  \n  \nE tu siedi Signore sei il Re,  \ne tu siedi Signore sei il Re!',s:'gesu t adoriamo gesu t adoriamo ti proclamiam nostro re tu sei qui proprio in mezzo a noi con lodi noi t esaltiam di lodi un trono ti prepariam di lodi un trono ti prepariam di lodi un trono ti prepariam e tu siedi signore sei il re da capo e tu siedi signore sei il re e tu siedi signore sei il re 117',type:'N',i:149},
{n:'118',t:'GESÙ TI ADORO',c:'Gesù ti adoro; mio Dio ti amo.  \nMio re ti lodo, santo tu sei.  \n  \nGesù ti prego, mio Dio ti esalto.  \nMio re ti canto, degno tu sei.  \n  \nGesù ti adoro, mio Dio ti amo.  \n Mio re ti lodo, santo tu sei.  \n  \nGesù ti prego, mio Dio ti esalto.  \nMio re ti canto, degno tu sei.  \n  \nMio re ti canto, degno tu sei.',s:'gesu ti adoro gesu ti adoro mio dio ti amo mio re ti lodo santo tu sei gesu ti prego mio dio ti esalto mio re ti canto degno tu sei gesu ti adoro mio dio ti amo mio re ti lodo santo tu sei gesu ti prego mio dio ti esalto mio re ti canto degno tu sei mio re ti canto degno tu sei 118',type:'N',i:150},
{n:'119',t:'GIOISCI FIGLIA DI SION',c:'Oh oh  oh oh   oh oh \nOh oh oh  oh oh oh \n  \nGIOISCI FIGLIA DI SION,  \nESULTA ISRAELE.  \nRALLEGRATI CON TUTTO IL CUORE,   \nFIGLIA DI GERUSALEMME.  \n  \nIl Signore ha revocato la tua condanna  \nha disperso il tuo nemico, Re d\'Israele è il Signore. (RIT) \n \nIl Signore è in mezzo a te, più non vedrai la sventura  \nnon lasciarti cadere le braccia,  \nin mezzo a te è un Salvatore potente. (RIT) \n  \n\nIl Signore per te esulterà, ti riempirà del suo amore  \ne con te si rallegrerà  \ncome nei giorni gioiosi di festa.  \n \nOh oh   oh oh oh oh \nOh oh oh  oh oh oh oh. \n  \nGIOISCI FIGLIA DI SION, ESULTA ISRAELE.  \nRALLEGRATI CON TUTTO IL CUORE,   \nFIGLIA DI GERUSALEMME.  \nGERUSALEM.',s:'gioisci figlia di sion oh oh oh oh oh oh oh oh oh oh oh oh gioisci figlia di sion esulta israele rallegrati con tutto il cuore figlia di gerusalemme il signore ha revocato la tua condanna ha disperso il tuo nemico re d israele e il signore rit il signore e in mezzo a te piu non vedrai la sventura non lasciarti cadere le braccia in mezzo a te e un salvatore potente rit il signore per te esultera ti riempira del suo amore e con te si rallegrera come nei giorni gioiosi di festa oh oh oh oh oh oh oh oh oh oh oh oh oh gioisci figlia di sion esulta israele rallegrati con tutto il cuore figlia di gerusalemme gerusalem 119',type:'N',i:151},
{n:'120',t:'GIOVANI E VECCHI',c:'Giovani e vecchi si rallegreranno  \ne insieme le fanciulle danzeran!  \nLai lai lai lai lai lai lai lai lai lai lai  \nlai lai lai lai lai lai lai lai lai lai lai!  \n\"lo cambierò il dolore in allegrezza!  \nEd io li consolerò!\"  \nSi canterà amore e libertà,  \ngran festa ci sarà,  \nla pace tornerà, lai lai lai lai!  \nSi canterà amore e libertà,  \ngran festa ci sarà,  \nla pace regnerà,  lai   lai!',s:'giovani e vecchi giovani e vecchi si rallegreranno e insieme le fanciulle danzeran lai lai lai lai lai lai lai lai lai lai lai lai lai lai lai lai lai lai lai lai lai lai lo cambiero il dolore in allegrezza ed io li consolero si cantera amore e liberta gran festa ci sara la pace tornera lai lai lai lai si cantera amore e liberta gran festa ci sara la pace regnera lai lai 120',type:'N',i:152},
{n:'121',t:'GLORIA (a Gesù il Signor)',c:'Gloria, gloria (x2)  \na Gesù il Signor,  \nall\'Agnello di Dio,  \nal Nome sopra ogni altro nome,  \na Gesù il Signor, all\'Agnello di Dio,  \nal Nome sopra ogni altro nome,  \nal Nome sopra ogni altro nome.',s:'gloria a gesu il signor gloria gloria x2 a gesu il signor all agnello di dio al nome sopra ogni altro nome a gesu il signor all agnello di dio al nome sopra ogni altro nome al nome sopra ogni altro nome 121',type:'N',i:153},
