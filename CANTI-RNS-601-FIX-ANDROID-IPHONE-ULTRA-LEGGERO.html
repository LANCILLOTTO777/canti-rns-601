{n:'275',t:'SVEGLIATI,SION!',c:'SVEGLIATI, SVEGLIATI O SION,  \nMETTI LE VESTI PIÙ BELLE,  \nSCUOTI LA POLVERE ED ALZATI,  \nSANTA GERUSALEMME.  \n  \nEcco ti tolgo di mano  \nil calice della vertigine,  \nla coppa della mia ira  \ntu non berrai più. (RIT)  \n  \nSciogli dal collo i legami  \ne leva al cielo i tuoi occhi,  \nschiava, figlia di Sion  \nio ti libererò. (RIT)  \n  \nCome son belli sui monti  \ni piedi del messaggero,  \ncolui che annunzia la pace  \nè messaggero di bene. (RIT)',s:'svegliati sion svegliati svegliati o sion metti le vesti piu belle scuoti la polvere ed alzati santa gerusalemme ecco ti tolgo di mano il calice della vertigine la coppa della mia ira tu non berrai piu rit sciogli dal collo i legami e leva al cielo i tuoi occhi schiava figlia di sion io ti liberero rit come son belli sui monti i piedi del messaggero colui che annunzia la pace e messaggero di bene rit 275',type:'N',i:307},
{n:'276',t:'T\'AMERÒ SIGNOR',c:'T\'amerò, Signor, ti adorerò,  \nil mio amor per te io proclamerò.  \nTi canterò Signor un cantico d\'amor;  \ngrazie a te.',s:'t amero signor t amero signor ti adorero il mio amor per te io proclamero ti cantero signor un cantico d amor grazie a te 276',type:'N',i:308},
{n:'277',t:'TE DEUM',c:'TI AMO SIGNORE,  \n\nMIA FORZA E MIO DIO,  \nMIA ROCCIA E MIA FORTEZZA,  \nSCUDO E BALUARDO,  \nMIO LIBERATORE,  \nMIA POTENTE SALVEZZA.  \n  \nSignore tu sei luce alla mia via,  \ntu rischiari le mie tenebre,  \nnulla temerò se tu sei con me.  (RIT)  \n  \nProvata al fuoco è la Parola tua, \nscudo per chi si rifugerà in te,   \nnulla temerò, retta è la tua via. (RIT)  \n  \nFra i popoli Signore ti loderò,  \ninni canterò di gioia al Nome tuo,  \nsempre ti amerò, tu sei il mio Dio. (RIT)',s:'te deum ti amo signore mia forza e mio dio mia roccia e mia fortezza scudo e baluardo mio liberatore mia potente salvezza signore tu sei luce alla mia via tu rischiari le mie tenebre nulla temero se tu sei con me rit provata al fuoco e la parola tua scudo per chi si rifugera in te nulla temero retta e la tua via rit fra i popoli signore ti lodero inni cantero di gioia al nome tuo sempre ti amero tu sei il mio dio rit 277',type:'N',i:309},
{n:'278',t:'TI ADORO, O MIO SIGNOR',c:'Ti adoro, o mio Signor,  \nchi è uguale a te.  \nTi adoro, o mio Signor,  \nprincipe di pace.  \nTi lodo, sei la mia giustizia.  \nTi adoro, o mio Signor,  \nchi è uguale a te. (x2)',s:'ti adoro o mio signor ti adoro o mio signor chi e uguale a te ti adoro o mio signor principe di pace ti lodo sei la mia giustizia ti adoro o mio signor chi e uguale a te x2 278',type:'N',i:310},
{n:'279',t:'TI AMO SIGNOR',c:'Ti amo Signor a te elevo la voce   \nper adorarti con tutta l\'anima mia.   \nGioisci mio Re, si rallegri il mio cuor,  \ndolce Signor e divin Redentor.',s:'ti amo signor ti amo signor a te elevo la voce per adorarti con tutta l anima mia gioisci mio re si rallegri il mio cuor dolce signor e divin redentor 279',type:'N',i:311},
{n:'280',t:'TI DONO LA MIA VITA',c:'Ti dono la mia vita,  \nti affido il mio cuore,   \nm\'hai dato tu la vita,  \naperto il tuo cuore.  \n  \nTi offro il mio pianto,  \nla mia debolezza  \n\ne dal tuo cuore aperto  \nm\'inondi la tua luce.  \n  \nSon povero e ferito,  \nho fede nel tuo amore,   \ntu tocchi la mia piaga,  \nrinasco a nuova vita.  \n  \nI nom di chi amo  \nleggili nel mio cuore,   \nle loro pene prendi  \ne colmali di gioia.',s:'ti dono la mia vita ti dono la mia vita ti affido il mio cuore m hai dato tu la vita aperto il tuo cuore ti offro il mio pianto la mia debolezza e dal tuo cuore aperto m inondi la tua luce son povero e ferito ho fede nel tuo amore tu tocchi la mia piaga rinasco a nuova vita i nom di chi amo leggili nel mio cuore le loro pene prendi e colmali di gioia 280',type:'N',i:312},
{n:'281',t:'TI ESALTERÒ',c:'Mio Dio ti darò gloria e onor,  \nmio Dio per sempre ti esalterò.  \n  \nPERCHÉ SEI IL RE DEI RE,  \nTU SEI IL SIGNOR E REGNI IN MAESTÀ.  \nPOTENTE SEI PADRE, DI OGNI COSA IL RE,  \nPERCHÉ SEI IL RE DEI RE,  \nTU SEI IL SIGNOR E REGNI IN MAESTÀ.   \nPOTENTE SEI PADRE, DI OGNI COSA IL RE,  \nDI OGNI COSA IL RE.  \n  \nMio Dio ti darò gloria e onor,  \nmio Dio per sempre ti esalterò. (RIT)   \n  \nDI OGNI COSA IL RE.',s:'ti esaltero mio dio ti daro gloria e onor mio dio per sempre ti esaltero perche sei il re dei re tu sei il signor e regni in maesta potente sei padre di ogni cosa il re perche sei il re dei re tu sei il signor e regni in maesta potente sei padre di ogni cosa il re di ogni cosa il re mio dio ti daro gloria e onor mio dio per sempre ti esaltero rit di ogni cosa il re 281',type:'N',i:313},
{n:'282',t:'TI ESALTERO\' SIGNORE',c:'TI ESALTERÒ SIGNORE  \nPERCHÉ Ml HAI RISOLLEVATO.  \nHAI CAMBIATO LA MIA TRISTEZZA  \nIN UNA DANZA PER ME.  \nHAI SCIOLTO IL MIO SAIO  \nM\'HAI CINTO D\'ALLEGRIA.  \nALLELUIA! ALLELUIA! ALLELUIA!  \nALLELUIA! ALLELUIA! ALLELUIA!  \n  \nSignore, ho invocato il tuo aiuto,  \nmio Dio, m\'hai guarito:  \nhai liberato dal laccio della morte  \n\nl\'anima mia,  \ndal discendere nella fossa  \nm\'hai fatto rivivere. (RIT)   \n  \nCantate inni al Signore,  \nrendete grazie al suo Nome.   \nLa sua collera non dura,  \nla sua bontà tutta la vita.  \nAlla sera giunge il pianto  \nma al mattino, ecco la gioia! (RIT)',s:'ti esaltero signore ti esaltero signore perche ml hai risollevato hai cambiato la mia tristezza in una danza per me hai sciolto il mio saio m hai cinto d allegria alleluia alleluia alleluia alleluia alleluia alleluia signore ho invocato il tuo aiuto mio dio m hai guarito hai liberato dal laccio della morte l anima mia dal discendere nella fossa m hai fatto rivivere rit cantate inni al signore rendete grazie al suo nome la sua collera non dura la sua bonta tutta la vita alla sera giunge il pianto ma al mattino ecco la gioia rit 282',type:'N',i:314},
{n:'283',t:'TI ESALTO DIO MIO RE',c:'TI ESALTO DIO MIO RE,  \nCANTERÒ IN ETERNO A TE,  \nIO VOGLIO LODARTI SIGNOR  \nE BENEDIRTI, ALLELUIA!  \n  \nIl Signore è degno di ogni lode,  \nnon si può misurar la sua grandezza;  \nogni vivente proclami la sua gloria,  \nla sua opera è giustizia e verità. (RIT)  \n  \nIl Signore è paziente e pietoso,  \nlento all\'ira e ricco di grazia;   \ntenerezza  ha  per ogni creatura,  \nil Signore è buono verso tutti. (RIT)  \n  \nIl Signore sostiene chi vacilla  \ne rialza  chiunque è caduto.  \nGli occhi di tutti ricercano il suo volto  \nla sua mano provvede loro il cibo. (RIT)  \n  \nIl Signore protegge chi lo teme  \nma disperde i superbi di cuore;  \negli ascolta il grido del suo servo,  \nogni lingua benedica il suo Nome. (RIT)',s:'ti esalto dio mio re ti esalto dio mio re cantero in eterno a te io voglio lodarti signor e benedirti alleluia il signore e degno di ogni lode non si puo misurar la sua grandezza ogni vivente proclami la sua gloria la sua opera e giustizia e verita rit il signore e paziente e pietoso lento all ira e ricco di grazia tenerezza ha per ogni creatura il signore e buono verso tutti rit il signore sostiene chi vacilla e rialza chiunque e caduto gli occhi di tutti ricercano il suo volto la sua mano provvede loro il cibo rit il signore protegge chi lo teme ma disperde i superbi di cuore egli ascolta il grido del suo servo ogni lingua benedica il suo nome rit 283',type:'N',i:315},
{n:'284',t:'TI LODERÒ (col mio canto)',c:'Col mio canto ti loderò,  ti loderò.  \nCol mio canto ti loderò   Gesù!  \n  \nNella vita ...  \n \n\nCon i santi...  \n \nSu nel cielo...',s:'ti lodero col mio canto col mio canto ti lodero ti lodero col mio canto ti lodero gesu nella vita con i santi su nel cielo 284',type:'N',i:316},
{n:'285',t:'TI LODERÒ (o mio Signore)',c:'Con le mie labbra ti loderò o mio Signore, ti loderò.  \nCon il mio cuore ti loderò o mio Signore, ti loderò.  \n \nCon le mie mani ti loderò o mio Signore, ti loderò.   \nCon la mia vita ti loderò o mio Signore, ti loderò.  \n \nCon le mie forze ti loderò o mio Signore, ti loderò.   \nCon la mia mente ti loderò o mio Signore, ti loderò.  \n \nCon la mia voce ti loderò o mio Signore, ti loderò.   \nCon i miei occhi ti loderò o mio Signore, ti loderò.   \nTi loderò, ti loderò, ti loderò.  \n  \nLode, lode, lode, lode, lode, lode, lode,  \nlode, lode, lode, lode, a te Signore.  \nGloria, gloria, gloria, gloria gloria, gloria,   \ngloria, gloria gloria, gloria, gloria a te Signore.',s:'ti lodero o mio signore con le mie labbra ti lodero o mio signore ti lodero con il mio cuore ti lodero o mio signore ti lodero con le mie mani ti lodero o mio signore ti lodero con la mia vita ti lodero o mio signore ti lodero con le mie forze ti lodero o mio signore ti lodero con la mia mente ti lodero o mio signore ti lodero con la mia voce ti lodero o mio signore ti lodero con i miei occhi ti lodero o mio signore ti lodero ti lodero ti lodero ti lodero lode lode lode lode lode lode lode lode lode lode lode a te signore gloria gloria gloria gloria gloria gloria gloria gloria gloria gloria gloria a te signore 285',type:'N',i:317},
{n:'286',t:'TI LODIAMO E T\'ADORIAMO',c:'TI  LODIAMO  E T\'ADORIAMO,  CRISTO  SIGNOR,  \nTI  LODIAMO  E T\'ADORIAMO,  CRISTO SIGNOR  \n  \nTi seguiamo nel cammino,  \nti seguiamo nel cammino  \nti seguiamo nel cammino,  \nCristo Signor. (RIT)  \n  \nTi doniam la nostra vita,  \nti doniam la nostra vita,  \nti doniam la nostra vita,  \nCristo Signor.  \n(RIT)  \n  \nDiamo a te tutta la gloria,  \ndiamo a te tutta la gloria,  \ndiamo a te tutta la gloria,  \nCristo Signor.  \n(RIT)',s:'ti lodiamo e t adoriamo ti lodiamo e t adoriamo cristo signor ti lodiamo e t adoriamo cristo signor ti seguiamo nel cammino ti seguiamo nel cammino ti seguiamo nel cammino cristo signor rit ti doniam la nostra vita ti doniam la nostra vita ti doniam la nostra vita cristo signor rit diamo a te tutta la gloria diamo a te tutta la gloria diamo a te tutta la gloria cristo signor rit 286',type:'N',i:318},
{n:'287',t:'T\'INVOCHIAMO SPIRITO',c:'T\'invochiamo Spirito,  \nt\'invochiamo Spirito,  \nvieni maranathà. \nT\'invochiamo Spirito, t\'invochiamo  Spirito,  \nvieni maranathà.  \n  \nEffondi su di noi la tua grazia o Signor.    \n(Vieni,vieni,vieni,vieni)  \nRinnovaci col tuo amore.  \n \nEffondi su di noi la tua grazia o Signor.  \nIllumina il nostro cuor.  \n  \nT\'invochiamo Spirito,  \nt\'invochiamo Spirito,  \nvieni  maranathà.  \nT\'invochiamo  Spirito,  \nt\'invochiamo Spirito,  \nvieni maranathà.  \n \nEffondi su di noi la tua grazia o Signor.    \n(Vieni,vieni,vieni,vieni)  \nConsolaci col tuo amore.  \n \nEffondi su di noi la tua grazia o Signor.  \nRivelaci Cristo SignOre.  \n  \nT\'invochiamo Spirito,  \n \nt\'invochiamo Spirito,  \nvieni maranathà.  \n \nT\'invochiamo Spirito,  \nt\'invochiamo Spirito,  \nvieni maranathà.  \n \nMaranathà ...  \nT\'invochiamo Spirito...  \n \nT\'invochiamo  Spirito,  \nt\'invochiamo Spirito. (Maranathà ...)   \nTu  vieni, vieni, vieni maranathà.   (Vieni,vieni maranathà)',s:'t invochiamo spirito t invochiamo spirito t invochiamo spirito vieni maranatha t invochiamo spirito t invochiamo spirito vieni maranatha effondi su di noi la tua grazia o signor vieni vieni vieni vieni rinnovaci col tuo amore effondi su di noi la tua grazia o signor illumina il nostro cuor t invochiamo spirito t invochiamo spirito vieni maranatha t invochiamo spirito t invochiamo spirito vieni maranatha effondi su di noi la tua grazia o signor vieni vieni vieni vieni consolaci col tuo amore effondi su di noi la tua grazia o signor rivelaci cristo signore t invochiamo spirito t invochiamo spirito vieni maranatha t invochiamo spirito t invochiamo spirito vieni maranatha maranatha t invochiamo spirito t invochiamo spirito t invochiamo spirito maranatha tu vieni vieni vieni maranatha vieni vieni maranatha 287',type:'N',i:319},
{n:'288',t:'TI RENDIAMO GRAZIE',c:'TI RENDIAMO GRAZIE  \nPER TANTA TENEREZZA,  \nDAL TUO CUOR TRAFITIO  \nDONI L\'ACQUA VIVA.  \nTI BENEDICIAMO  \nPER TANTE MERAVIGLIE,  \nTU DONI LO SPIRITO,  \nTU DONI LA VITA.  \n  \nDio, tu sei il mio Dio, sei tu che io cerco,  \nla mia carne anela a te, mio Signor.  \nVoglio che il tuo amore guidi la mia vita,  \nl\'anima mia ha sete di te! (RIT) \n  \nTi loderanno sempre le mie labbra,  \nfinché io vivo ti benedirò.  \nAl tuo Nome voglio alzare le mie mani,  \nl\'anima mia ha sete di te! (RIT) \n  \nQuando sogno te, quando spero in te,   \nquando ti chiamo sempre mi rispondi.   \nIo gioisco in pace sotto le tue ali,  \nl\'anima mia ha sete di te! (RIT) \n  \nQuando io ti chiamo ti lasci trovare   \ned io mi sazio della tua speranza.  \nIo sono una terra arida, senz\'acqua,  \nl\'anima mia ha sete di te! (RIT)',s:'ti rendiamo grazie ti rendiamo grazie per tanta tenerezza dal tuo cuor trafitio doni l acqua viva ti benediciamo per tante meraviglie tu doni lo spirito tu doni la vita dio tu sei il mio dio sei tu che io cerco la mia carne anela a te mio signor voglio che il tuo amore guidi la mia vita l anima mia ha sete di te rit ti loderanno sempre le mie labbra finche io vivo ti benediro al tuo nome voglio alzare le mie mani l anima mia ha sete di te rit quando sogno te quando spero in te quando ti chiamo sempre mi rispondi io gioisco in pace sotto le tue ali l anima mia ha sete di te rit quando io ti chiamo ti lasci trovare ed io mi sazio della tua speranza io sono una terra arida senz acqua l anima mia ha sete di te rit 288',type:'N',i:320},
{n:'289',t:'TU SEI MIO DIO',c:'Tu sei il mio Dio,  \ntu sei il mio Re!  \nIl Salvatore tu sei per me.  \nSei il mio Signore  \nper questo canterò:   \nalleluia,  alleluia!',s:'tu sei mio dio tu sei il mio dio tu sei il mio re il salvatore tu sei per me sei il mio signore per questo cantero alleluia alleluia 289',type:'N',i:321},
{n:'290',t:'TUA SIGNORE È LA GLORIA',c:'Tua Signore è la gloria,  \nla potenza e l\'onore,   \ntua Signor la vittoria  \ne maestà, e maestà.   \n\nTutto ciò che è in cielo  \ne sulla terra è tuo.  \nTu sei esaltato,  \nsu ogni cosa il Re.',s:'tua signore e la gloria tua signore e la gloria la potenza e l onore tua signor la vittoria e maesta e maesta tutto cio che e in cielo e sulla terra e tuo tu sei esaltato su ogni cosa il re 290',type:'N',i:322},
{n:'291',t:'TUO È IL REGNO...',c:'TUO È IL REGNO, TUA È LA POTENZA  \nE LA GLORIA NEI SECOLI. (x2)  \n  \nSii benedetto Dio d\'Israele  \ntu nostro Padre ora e per sempre.  \nDate al Signore gloria e potenza,  \ngloria al nostro Dio,  \ngloria al Re dei re. (RIT) \n  \nO mio Signore tuo è il Regno,  \ntu sei sovrano sopra ogni cosa.   \nGloria e ricchezza tu elargisci,  \ntu datore di vita,  \ngloria al Re dei re. (RIT) \n  \nNella tua mano forza e potenza,  \npace e gioia per chi crede in te.  \nNel tuo tempio noi acclamiamo,  \ngloria al nostro Dio,  \ngloria al Re dei re. (RIT) \n  \n  \n  292 -',s:'tuo e il regno tuo e il regno tua e la potenza e la gloria nei secoli x2 sii benedetto dio d israele tu nostro padre ora e per sempre date al signore gloria e potenza gloria al nostro dio gloria al re dei re rit o mio signore tuo e il regno tu sei sovrano sopra ogni cosa gloria e ricchezza tu elargisci tu datore di vita gloria al re dei re rit nella tua mano forza e potenza pace e gioia per chi crede in te nel tuo tempio noi acclamiamo gloria al nostro dio gloria al re dei re rit 292 291',type:'N',i:323},

{n:'293',t:'UMILIA TE STESSO',c:'Umilia te stesso davanti al Signore.    Umilia te stesso davanti al Signore (x2) \nE lui   \n \n \n \ne lui \nti rialzerà  \n \n \n \nti rialzerà, sempre più in alto \ne lui   \n \n \n \ne lui \nti rialzerà  \n \n \n \nti rialzerà \n  \nUmilia te stesso davanti al Signore.  \nUmilia te stesso davanti al Signore (x2)  \ne lui   \n \n \n \ne lui \nti rialzerà \n \n \n \nti rialzerà, sempre più in alto  \n\ne lui   \n \n \n \ne lui \nti rialzerà \n \n \n \nti rialzerà. (x2)  \n  \nUmilia te stesso davanti al Signore.  \nUmilia te stesso davanti al Signore. (x2)  \nE lui   \n \n \n \ne lui  \nti rialzerà  \n \n \n \nti rialzerà \n  \nUmilia te stesso davanti al Signore. (x2)  \nLui ti rialzerà.',s:'umilia te stesso umilia te stesso davanti al signore umilia te stesso davanti al signore x2 e lui e lui ti rialzera ti rialzera sempre piu in alto e lui e lui ti rialzera ti rialzera umilia te stesso davanti al signore umilia te stesso davanti al signore x2 e lui e lui ti rialzera ti rialzera sempre piu in alto e lui e lui ti rialzera ti rialzera x2 umilia te stesso davanti al signore umilia te stesso davanti al signore x2 e lui e lui ti rialzera ti rialzera umilia te stesso davanti al signore x2 lui ti rialzera 293',type:'N',i:325},
{n:'294',t:'UN SOL CORPO,UN SOL SPIRITO',c:'UN SOL CORPO,UN SOL SPIRITO,  \nUN SOLO SIGNORE,  \nUNA SOLA FEDE CI ACCOMUNERÀ.  \nUN SOL CORPO,UN SOL SPIRITO,  ·\'  \nUN SOLO SIGNORE,  \nQUESTA È LA SPERANZA  \nCHE UNITI CI RENDERÀ.  \n  \nRendici umili o Dio,  \nmansueti e pazienti.  \nFacci amare di più  \nchi vive accanto a noi. \nConservaci nell\'unità  \ncon vincoli di pace,  \navremo un solo  \nPadre   \nche vive in mezzo a noi. (RIT)  \n  \nRinnovaci con il tuo Spirito  \nnel corpo e nella mente.   \nGuidaci alla santità,  \nrafforza in noi la fede.  \nRivestici dell\'uomo nuovo  \nper essere più puri  \ne forti nella verità  \nla vita cambierem. (RIT)  \n  \nFa\' scomparire da noi   \nasprezza, sdegno ed  ira.   \nLe nostre bocche Signor  \nproclamino il tuo amor.  \nDacci il coraggio di aver  \nper sempre in te fiducia  \ne creature nuove  \ninsieme diverrem. (RIT)',s:'un sol corpo un sol spirito un sol corpo un sol spirito un solo signore una sola fede ci accomunera un sol corpo un sol spirito un solo signore questa e la speranza che uniti ci rendera rendici umili o dio mansueti e pazienti facci amare di piu chi vive accanto a noi conservaci nell unita con vincoli di pace avremo un solo padre che vive in mezzo a noi rit rinnovaci con il tuo spirito nel corpo e nella mente guidaci alla santita rafforza in noi la fede rivestici dell uomo nuovo per essere piu puri e forti nella verita la vita cambierem rit fa scomparire da noi asprezza sdegno ed ira le nostre bocche signor proclamino il tuo amor dacci il coraggio di aver per sempre in te fiducia e creature nuove insieme diverrem rit 294',type:'N',i:326},
{n:'295',t:'VENI, SANCTE SPIRITUS',c:'Veni Sancte Spiritus, veni Sancte Spiritus.  \n  \nVieni Santo Spirito, riempi i cuori dei tuoi fedeli   \ned accendi in essi il fuoco del tuo amore.  \n  \nVeni Sancte Spiritus. Consolatore perfetto,  \nospite mite dell\'anima, dolcissimo sollievo.  \nVeni Sancte Spiritus. \n \nO luce beatissima, invadi nell\'intimo  \nil cuore dei tuoi fedeli. \nVeni Sancte Spiritus.  \n  \nDona ai tuoi fedeli  \nche solo in te confidano  \ni tuoi santi doni.  \nVeni Sancte Spiritus. \n \nDona bontà e fiducia,  \ndona morte santa,  \ndona gioia eterna.  \nVeni Sancte Spiritus. \n \nNella fatica riposo,  \nnel timore riparo,  \nnel pianto conforto.  \nVeni Sancte Spiritus. \n \nRiempi il cuore dei tuoi fedeli  \ned accendi in essi  \nil fuoco del tuo amore. \nVeni Sancte Spiritus. \n  \nConsolatore perfetto,  \nospite mite dell\'anima,  \ndolcissimo sollievo.  \nVeni Sancte Spiritus. \n \nO luce beatissima,  \ninvadi nell\'intimo  \nil cuore dei tuoi fedeli.  \nVeni Sancte Spiritus. \n \n\nDona ai tuoi fedeli  \nche solo in te confidano  \ni tuoi santi doni.  \nVeni Sancte Spiritus. \n \nDona bontà e fiducia,  \ndona morte santa,  \ndona gioia eterna.  \nVeni Sancte Spiritus. \n \nNella fatica riposo,  \nnel timore riparo,  \nnel pianto conforto. \nVeni Sancte Spiritus.',s:'veni sancte spiritus veni sancte spiritus veni sancte spiritus vieni santo spirito riempi i cuori dei tuoi fedeli ed accendi in essi il fuoco del tuo amore veni sancte spiritus consolatore perfetto ospite mite dell anima dolcissimo sollievo veni sancte spiritus o luce beatissima invadi nell intimo il cuore dei tuoi fedeli veni sancte spiritus dona ai tuoi fedeli che solo in te confidano i tuoi santi doni veni sancte spiritus dona bonta e fiducia dona morte santa dona gioia eterna veni sancte spiritus nella fatica riposo nel timore riparo nel pianto conforto veni sancte spiritus riempi il cuore dei tuoi fedeli ed accendi in essi il fuoco del tuo amore veni sancte spiritus consolatore perfetto ospite mite dell anima dolcissimo sollievo veni sancte spiritus o luce beatissima invadi nell intimo il cuore dei tuoi fedeli veni sancte spiritus dona ai tuoi fedeli che solo in te confidano i tuoi santi doni veni sancte spiritus dona bonta e fiducia dona morte santa dona gioia eterna veni sancte spiritus nella fatica riposo nel timore riparo nel pianto conforto veni sancte spiritus 295',type:'N',i:327},
{n:'296',t:'VENITE DAL PROFONDO',c:'Venite dal profondo dei tempi,  \no cuori dalla sete piagati.  \nAprite il cuore alla gioia più profonda,  \n  \nDio ci ha messo il suo corpo  \ntra le mani.  (x3)  \n  \nStasera l\'acqua si trasforma in vino,  \nsul monte il pane è moltiplicato.  \nPrecoce è il frutto della vigna in fiore.  \n  \nDio ci ha messo il suo corpo  \ntra le mani.  (x3)  \n  \nCome ferita aperta è la parola,  \nparola di un eterno senza fine.  \nIl Verbo si fa carne e nutrimento.  \n  \nDio ci ha messo il suo corpo  \ntra le mani.  (x3)',s:'venite dal profondo venite dal profondo dei tempi o cuori dalla sete piagati aprite il cuore alla gioia piu profonda dio ci ha messo il suo corpo tra le mani x3 stasera l acqua si trasforma in vino sul monte il pane e moltiplicato precoce e il frutto della vigna in fiore dio ci ha messo il suo corpo tra le mani x3 come ferita aperta e la parola parola di un eterno senza fine il verbo si fa carne e nutrimento dio ci ha messo il suo corpo tra le mani x3 296',type:'N',i:328},
{n:'297',t:'VERGIN SANTA',c:'Vergin Santa, Dio t\'ha scelto  \ncon un palpito d\'amor  \nper dare a noi il tuo Gesù;  \npiena di grazia noi t\'acclamiam.  \n  \n\nAVE, AVE, AVE, MARIA.  \n  \nPer la fede e il tuo amore  \no ancella del Signor  \nportasti al mondo il Redentor;  \npiena di grazia noi ti lodiam. (RIT) \n \nO Maria rifugio tu sei  \ndei tuoi figli peccator,  \n \ntu ci comprendi e vegli su di noi;  \npiena di grazia noi ti lodiam. (RIT) \n  \nTu conforti la nostra vita,  \nsei speranza nel dolor,  \n \nperché di gioia ci colmi il cuor;  \npiena di grazia noi t\'acclamiam. (RIT) \n  \nBeato il cuor che ascolta il Signor  \nnella fede e nell\'amor,  \nperché in te trionferà  \ncol Figlio tuo nell\'eternità.  \n(RIT) \n  \nBeato il cuor che arso sarà  \ndi giustizia e di bontà,  \nperché il Signor lo sazierà  \nnel Regno dove ogni pace sarà. (RIT)  \n  \nBeato chi il cuor serberà  \nnella fede e nel condor,  \n  \nperché nei secoli eterni nei cieli  \nDio vedrà per sempre con te. (RIT) \n  \nBeato chi la pace portò  \nai fratelli con amor,  \nperché con Dio la gloria godrà  \ndei figli suoi nel regno dei ciel. (RIT) \n  \nEsultate con grande gioia,  \nDio attende i figli suoi,  \nnel Regno suo li colmerà  \nd\'ogni beata felicità.  \n(RIT).  \n  \nGloria eterna al Padre cantiamo,  \nal suo Figlio Redentor,  \n \nal Santo Spirito vivo nei cuor,  \nora e sempre nei secoli. Amen. (RIT)',s:'vergin santa vergin santa dio t ha scelto con un palpito d amor per dare a noi il tuo gesu piena di grazia noi t acclamiam ave ave ave maria per la fede e il tuo amore o ancella del signor portasti al mondo il redentor piena di grazia noi ti lodiam rit o maria rifugio tu sei dei tuoi figli peccator tu ci comprendi e vegli su di noi piena di grazia noi ti lodiam rit tu conforti la nostra vita sei speranza nel dolor perche di gioia ci colmi il cuor piena di grazia noi t acclamiam rit beato il cuor che ascolta il signor nella fede e nell amor perche in te trionfera col figlio tuo nell eternita rit beato il cuor che arso sara di giustizia e di bonta perche il signor lo saziera nel regno dove ogni pace sara rit beato chi il cuor serbera nella fede e nel condor perche nei secoli eterni nei cieli dio vedra per sempre con te rit beato chi la pace porto ai fratelli con amor perche con dio la gloria godra dei figli suoi nel regno dei ciel rit esultate con grande gioia dio attende i figli suoi nel regno suo li colmera d ogni beata felicita rit gloria eterna al padre cantiamo al suo figlio redentor al santo spirito vivo nei cuor ora e sempre nei secoli amen rit 297',type:'N',i:329},
{n:'298',t:'VIENI AL SIGNOR',c:'Benedici il Signor anima mia,  \nquanto è in me lo benedica.   \nNon dimenticare i suoi benefici, \nquanto è in me lo benedica. \n \nEGLI PERDONA TUTTE LE TUE COLPE  \n  \nBUONO E PIETOSO È IL SIGNORE  \nLENTO ALL\'IRA. VIENI AL SIGNOR,   \nRICEVI IL SUO AMOR.  \n  \nSalva dalla fossa la tua vita  \ne t\'incorona di grazia.  \n \nCome il cielo è alto sopra la terra,  \ncosì è la sua misericordia. (RIT) \n  \n  \nMa la grazia del Signor dura in eterno  \nper quelli che lo temono.  \nBenedici il Signor anima mia,  \nquanto è in me lo benedica. (RIT)',s:'vieni al signor benedici il signor anima mia quanto e in me lo benedica non dimenticare i suoi benefici quanto e in me lo benedica egli perdona tutte le tue colpe buono e pietoso e il signore lento all ira vieni al signor ricevi il suo amor salva dalla fossa la tua vita e t incorona di grazia come il cielo e alto sopra la terra cosi e la sua misericordia rit ma la grazia del signor dura in eterno per quelli che lo temono benedici il signor anima mia quanto e in me lo benedica rit 298',type:'N',i:330},
{n:'299',t:'VIENI DAL LIBANO',c:'Vieni dal Libano, mia sposa,  \nvieni dal Libano, vieni!  \nAvrai per corona le vette dei monti,  \nle alte cime dell\'Ermon.  \nTu m\'hai ferito, ferito il cuore,  \no sorella, mia sposa.  \nVieni dal Libano, mia sposa,  \nvieni dal Libano, vieni!  \n  \nCERCAI L\'AMORE DELL\'ANIMA MIA,  \nLO CERCAI SENZA TROVARLO.  \nTROVAI L\'AMORE DELL\'ANIMA MIA,  \nL\'HO ABBRACCIATO, NON LO LASCERÒ MAI.  \n  \nlo appartengo al mio diletto  \ned egli è tutto per me.   \nVieni usciamo alla campagna,  \ndimoriamo nei villaggi.   \nAndremo all\'alba nelle vigne,  \nvi raccoglieremo i frutti.  \n\nIo appartengo al mio diletto  \ned egli è tutto per me. (RIT) \n \nAlzati in fretta mia diletta,  \nvieni colomba  vieni.  \nl\'estate ormai è già passata,  \nil tempo dell\'uva è venuto.  \nI fiori se ne vanno dalla terra,  \nil grande sole è cessato.  \nAlzati in fretta, mia diletta,  \nvieni colomba, vieni.  \n(RIT)  \n \nCome sigillo sul tuo cuore   \ncome sigillo sul braccio,  \nche l\'amore è forte come fa morte  \ne le acque non lo spegneranno.   \nDare per esso tutti i beni  \ndella casa sarebbe disprezzarlo.  \nCome sigillo sul tuo cuore,  \ncome sigillo sul braccio. (RIT)',s:'vieni dal libano vieni dal libano mia sposa vieni dal libano vieni avrai per corona le vette dei monti le alte cime dell ermon tu m hai ferito ferito il cuore o sorella mia sposa vieni dal libano mia sposa vieni dal libano vieni cercai l amore dell anima mia lo cercai senza trovarlo trovai l amore dell anima mia l ho abbracciato non lo lascero mai lo appartengo al mio diletto ed egli e tutto per me vieni usciamo alla campagna dimoriamo nei villaggi andremo all alba nelle vigne vi raccoglieremo i frutti io appartengo al mio diletto ed egli e tutto per me rit alzati in fretta mia diletta vieni colomba vieni l estate ormai e gia passata il tempo dell uva e venuto i fiori se ne vanno dalla terra il grande sole e cessato alzati in fretta mia diletta vieni colomba vieni rit come sigillo sul tuo cuore come sigillo sul braccio che l amore e forte come fa morte e le acque non lo spegneranno dare per esso tutti i beni della casa sarebbe disprezzarlo come sigillo sul tuo cuore come sigillo sul braccio rit 299',type:'N',i:331},
{n:'300',t:'VIENI IN ME',c:'Vorrei cantarti un inno di lode,  \nvorrei danzare e gioire d\'amore,   \n  \nvorrei gridarti che t\'amo, Signore,  \nma queste labbra non parlano ancor.  \n \n DEH, VIENI IN ME O SIGNORE GESÙ!  \n DEH, VIENI IN ME O SIGNORE GESÙ!  \n  \nVorrei guardarti, fissare il tuo volto,  \nvorrei sentirmi guardato da te,   \nvorrei sentirmi raggiante, Signore,  \nma questi occhi non vedono ancor. (RIT) \n  \nVieni a cantare tu l\'inno di lode,  \nvieni a danzare ed esultare d\'amore,  \ne grida al Padre che l\'amo,  Signore,  \ntu sei la voce del mio cuor. (RIT) \n  \nManda il tuo Spirito dentro il mio petto,  \nsupplica il Padre  e loda il suo Nome,  \nprendi le mani, le labbra, il mio cuore,   \nprendi il mio canto e questa mia lode. (RIT)',s:'vieni in me vorrei cantarti un inno di lode vorrei danzare e gioire d amore vorrei gridarti che t amo signore ma queste labbra non parlano ancor deh vieni in me o signore gesu deh vieni in me o signore gesu vorrei guardarti fissare il tuo volto vorrei sentirmi guardato da te vorrei sentirmi raggiante signore ma questi occhi non vedono ancor rit vieni a cantare tu l inno di lode vieni a danzare ed esultare d amore e grida al padre che l amo signore tu sei la voce del mio cuor rit manda il tuo spirito dentro il mio petto supplica il padre e loda il suo nome prendi le mani le labbra il mio cuore prendi il mio canto e questa mia lode rit 300',type:'N',i:332},
{n:'301',t:'VIENI SANTO SPIRITO (sequenza)',c:'VIENI SANTO SPIRITO, VIENI IN NOI.  \nVIENI SANTO SPIRITO, VIENI IN NOI. \n  \nPadre dei poveri,  \nricco di doni,  \nvieni Spirito d\'amor. (RIT)  \n \nRiposo alla fatica,  \nriparo alla calura,  \nvieni Spirito d\'amor. (RIT) \n \nPiega ciò che è rigido,  \nbagna ciò che è arido,  \nvieni Spirito d\'amor. (RIT) \n \nLava ciò che è sordido,  \nbagna ciò che è arido,  \nvieni Spirito d\'amor. (RIT) \n  \nDona virtù e premio,  \ndona sapienza e gioia,  \nvieni Spirito d\'amor. (RIT)',s:'vieni santo spirito sequenza vieni santo spirito vieni in noi vieni santo spirito vieni in noi padre dei poveri ricco di doni vieni spirito d amor rit riposo alla fatica riparo alla calura vieni spirito d amor rit piega cio che e rigido bagna cio che e arido vieni spirito d amor rit lava cio che e sordido bagna cio che e arido vieni spirito d amor rit dona virtu e premio dona sapienza e gioia vieni spirito d amor rit 301',type:'N',i:333},
{n:'302',t:'VIENI, VIENI SPIRITO D\'AMORE',c:'VIENI, VIENI SPIRITO D\'AMORE  \nAD INSEGNAR LE COSE DI DIO.  \nVIENI, VIENI SPIRITO DI PACE  \nA SUGGERIR LE COSE CHE LUI  \nHA DETTO A NOI.  \n  \nNoi ti invochiamo, Spirito di Cristo,  \nvieni tu dentro di noi;  \ncambia i nostri occhi,  \nfa\' che noi vediamo  \nla bontà di Dio per noi. (RIT)  \n  \nVieni o Spirito dai quattro venti \ne soffia su chi non ha vita;  \nvieni o Spirito e soffia su di noi  \nperché anche noi riviviamo. (RIT) \n  \nInsegnaci a sperare,  \ninsegnaci ad amare,  \n\ninsegnaci a lodare lddio;  \ninsegnaci a pregare,  \ninsegnaci la via,  \ninsegnaci tu l\'unità. (RIT)',s:'vieni vieni spirito d amore vieni vieni spirito d amore ad insegnar le cose di dio vieni vieni spirito di pace a suggerir le cose che lui ha detto a noi noi ti invochiamo spirito di cristo vieni tu dentro di noi cambia i nostri occhi fa che noi vediamo la bonta di dio per noi rit vieni o spirito dai quattro venti e soffia su chi non ha vita vieni o spirito e soffia su di noi perche anche noi riviviamo rit insegnaci a sperare insegnaci ad amare insegnaci a lodare lddio insegnaci a pregare insegnaci la via insegnaci tu l unita rit 302',type:'N',i:334},
{n:'303',t:'VIVE JESUS EL SENOR',c:'Vive Jesùs, el Senor. (x4)  \n  \nEl vive, El vive, El vive, vive  \nVive Jesùs, el Senor! (x2)',s:'vive jesus el senor vive jesus el senor x4 el vive el vive el vive vive vive jesus el senor x2 303',type:'N',i:335},
{n:'304',t:'VOGLIO CANTARE AL SIGNORE',c:'VOGLIO CANTARE AL SIGNOR  \nE DARE GLORIA A LUI,  \nVOGLIO CANTARE  \nPER SEMPRE AL SIGNOR.  (x2)  \n  \nCavallo e cavaliere  \nha gettato nel mare,  \negli è il mio Dio  \ne lo voglio esaltare.  \nChi è come te,  \nlassù nei cieli, o Signor?  \nChi è come  te,   \nlassù, maestoso in santità? (RIT) \n  \nLa destra del Signore  \nha annientato i l nemico,   \nle sue schiere ha riversato  \nin fondo al mare.   \nSull\'asciutto tutto  \nil suo popolo passò,  \ncon timpani e con danze  \nal Signore s\'inneggiò.  \n(RIT)  \n  \nCon la tua potenza  \nIsraele hai salvato,  \nper la tua promessa   \nuna terra gli hai dato.   \nPer i suoi prodigi  \nal Signore canterò,  \ncon un canto nuovo  \nil suo Nome esalterò. (RIT)',s:'voglio cantare al signore voglio cantare al signor e dare gloria a lui voglio cantare per sempre al signor x2 cavallo e cavaliere ha gettato nel mare egli e il mio dio e lo voglio esaltare chi e come te lassu nei cieli o signor chi e come te lassu maestoso in santita rit la destra del signore ha annientato i l nemico le sue schiere ha riversato in fondo al mare sull asciutto tutto il suo popolo passo con timpani e con danze al signore s inneggio rit con la tua potenza israele hai salvato per la tua promessa una terra gli hai dato per i suoi prodigi al signore cantero con un canto nuovo il suo nome esaltero rit 304',type:'N',i:336},
{n:'305',t:'VOGLIO STARE ACCANTO A TE',c:'Voglio stare qui accanto a te  \nper adorare la tua presenza.  \nIo non posso vivere senza te,    \nvoglio stare accanto a te.  \n  \nVoglio stare qui accanto a te,  \nabitare la tua casa,  \nnel tuo luogo santo dimorar  \nper restare accanto a te.  \n \nAccanto a te Signore  \nvoglio dimorare,   \ngioire alla tua mensa  \nrespirando la tua gloria.   \nDel tuo amore  \nio voglio vivere Signor,  \nvoglio star con te,  \nvoglio star con te Gesù.  \n  \nVoglio stare qui accanto a te  \nper entrare alla tua presenza.   \nIo non posso vivere senza te,  \nvoglio stare accanto a te.  \n  \nMio Signor,  \ntu sei la mia forza,  \nla gioia del mio canto,  \nla fortezza del mio cuor.  \n  \nVoglio stare qui accanto a te,  \nper adorare la tua presenza.   \nNel tuo luogo santo dimorar,  \nvoglio star con te,  \nvoglio star con te Gesù.   \nVoglio star con te,  \nvoglio star con te Gesù,   \nvoglio star con te,  \nvoglio star con te Gesù.',s:'voglio stare accanto a te voglio stare qui accanto a te per adorare la tua presenza io non posso vivere senza te voglio stare accanto a te voglio stare qui accanto a te abitare la tua casa nel tuo luogo santo dimorar per restare accanto a te accanto a te signore voglio dimorare gioire alla tua mensa respirando la tua gloria del tuo amore io voglio vivere signor voglio star con te voglio star con te gesu voglio stare qui accanto a te per entrare alla tua presenza io non posso vivere senza te voglio stare accanto a te mio signor tu sei la mia forza la gioia del mio canto la fortezza del mio cuor voglio stare qui accanto a te per adorare la tua presenza nel tuo luogo santo dimorar voglio star con te voglio star con te gesu voglio star con te voglio star con te gesu voglio star con te voglio star con te gesu 305',type:'N',i:337},
{n:'306',t:'VOLGETE GLI OCCHI',c:'VOLGETE GLI OCCHI AL SIGNOR  \n\nED I VOSTRI CUOR.  \nCANTATE A LUI LODE E ONOR  \nÈ LUI IL SALVATOR,  \nÈ LUI VOSTRO SIGNOR.  \n  \nHo cercato il Signore  \ned egli mi ha risposto.  \nMi ha guarito dall\'angoscia  \nper sempre lo amerò. (RIT)  \n \nDio protegge il povero,  \nascolta la sua voce.  \nConsola le sue pene  \ne guida il suo cammino. (RIT) .  \n  \nQuelli che cercano il Signore  \nnon  saranno delusi.  \nSolo che guardino a lui  \nsaranno salvati. (RIT)',s:'volgete gli occhi volgete gli occhi al signor ed i vostri cuor cantate a lui lode e onor e lui il salvator e lui vostro signor ho cercato il signore ed egli mi ha risposto mi ha guarito dall angoscia per sempre lo amero rit dio protegge il povero ascolta la sua voce consola le sue pene e guida il suo cammino rit quelli che cercano il signore non saranno delusi solo che guardino a lui saranno salvati rit 306',type:'N',i:338},
{n:'307',t:'VOLTO SOAVE',c:'Volto soave di Gesù,  \nvolto soave di Gesù,  \nvolto soave di Gesù,  \nvolto soave di Gesù!  \n  \n(solo) Volto santo dell\'Agnello,  \ncuore aperto, mia trafittura,  \n mia sorgente di felicità,  \nvolto santo dell\'Agnello.  \n  \nVolto santo dell\'amore,  \ncuore infranto mia guarigione,   \ncarne di Dio immacolata,  \nvolto santo dell\'amore.',s:'volto soave volto soave di gesu volto soave di gesu volto soave di gesu volto soave di gesu solo volto santo dell agnello cuore aperto mia trafittura mia sorgente di felicita volto santo dell agnello volto santo dell amore cuore infranto mia guarigione carne di dio immacolata volto santo dell amore 307',type:'N',i:339},
{n:'308',t:'ANIMA DI CRISTO',c:'Anima di Cristo santificami,   \ncorpo di Cristo salvami,    \nsangue di Cristo inebriami,  \nacqua del costato lavami.  \n  \nLODE A TE PER LA TUA IMMENSA CARITÀ,   \n\nLODE A TE, TU TI DONI A ME.  \nLODE A TE PER LA TUA IMMENSA CARITÀ,   \nO SIGNOR IO MI DONO A TE.  \n  \nPassione di Cristo confortami,  \no buon Gesù esaudiscimi,   \nnelle tue piaghe nascondimi,  \nnon permetter ch\'io mi separi da te. (RIT)  \n  \nDal maligno difendimi,  \nnell\'ora della morte chiamami   \ne comandami di venire da te,  \ncon i santi tuoi adorarti. (RIT)   \n  \nAnima di Cristo santificami,  \ncorpo di Cristo salvami,   \nsangue di Cristo inebriami,  \nacqua del costato lavami. (RIT)   \n \nAmen, amen, amen.',s:'anima di cristo anima di cristo santificami corpo di cristo salvami sangue di cristo inebriami acqua del costato lavami lode a te per la tua immensa carita lode a te tu ti doni a me lode a te per la tua immensa carita o signor io mi dono a te passione di cristo confortami o buon gesu esaudiscimi nelle tue piaghe nascondimi non permetter ch io mi separi da te rit dal maligno difendimi nell ora della morte chiamami e comandami di venire da te con i santi tuoi adorarti rit anima di cristo santificami corpo di cristo salvami sangue di cristo inebriami acqua del costato lavami rit amen amen amen 308',type:'N',i:340},
{n:'309',t:'CANTERÒ AL SIGNOR PER SEMPRE',c:'Canterò al Signor per sempre,    \nnoi esaltiamo il suo Nome.   \nGrande è la sua fedeltà per sempre,    \nnoi esaltiamo il suo Nome.  \n  \nCANTERÒ AL SIGNOR PER SEMPRE,    \nNOI ESALTIAMO IL SUO NOME.   \nGRANDE È LA SUA FEDELTÀ PER SEMPRE,   \nNOI ESALTIAMO IL SUO NOME.  \n  \nInnalziamo insieme il Signor,  \nsanto è il suo Nom.  \nDiamo onore e gloria al Re,  \nlui per sempre regnerà. (RIT)  \n  \nSia lode al suo Nome,    \nlode al suo Nome,  \nlode al suo Nome,  \nper sempre al suo Nome.  \n \nInnalziamo insieme il Signor,  \nsanto è il suo Nom.  \nDiamo onore e gloria al Re,  \n\nlui per sempre regnerà.  \n  \nCANTERÒ AL SIGNOR PER SEMPRE,  \nNOI ESALTIAMO IL SUO NOME.  \nGRANDE È LA SUA FEDELTÀ PER SEMPRE,    \nNOI ESALTIAMO IL SUO NOME. (x4) \n \nCANTIAM  \nLODE AL SIGNOR CANTIAM.',s:'cantero al signor per sempre cantero al signor per sempre noi esaltiamo il suo nome grande e la sua fedelta per sempre noi esaltiamo il suo nome cantero al signor per sempre noi esaltiamo il suo nome grande e la sua fedelta per sempre noi esaltiamo il suo nome innalziamo insieme il signor santo e il suo nom diamo onore e gloria al re lui per sempre regnera rit sia lode al suo nome lode al suo nome lode al suo nome per sempre al suo nome innalziamo insieme il signor santo e il suo nom diamo onore e gloria al re lui per sempre regnera cantero al signor per sempre noi esaltiamo il suo nome grande e la sua fedelta per sempre noi esaltiamo il suo nome x4 cantiam lode al signor cantiam 309',type:'N',i:341},
{n:'310',t:'CANTERÒ IN TUO ONORE',c:'Grande sei mio Signor,  \ntu sei degno di lode per sempre,   \nresterò davanti a te  \nche mi hai dato l\'amore più grande.   \nMi hai liberato dal male  \ne la forza tua mi sostiene.  \n  \nIN TUO ONORE, O DIO, \nINNALZERÒ LE MANI  \nE ALLA PRESENZA TUA  \nCONTEMPLERÒ LA TUA SANTITÀ.  \n  \nGrande sei mio Signor,  \ntu sei degno di lode per sempre,   \nresterò davanti a te  \nche mi hai dato l\'amore più grande.  \nTu sei la fonte più pura  \ne la grazia tua mi risana.  \n  \nIN TUO ONORE, O DIO, \nINNALZERÒ LE MANI  \nE ALLA PRESENZA TUA  \nIO CANTERÒ PER SEMPRE.  \nIN TUO ONORE, O DIO,  \nINNALZERÒ LE MANI  \nE ALLA PRESENZA TUA  \nCONTEMPLERÒ LA TUA SANTITÀ.  \n  \nE ALLA PRESENZA TUA  \nCONTEMPLERÒ LA TUA SANTITÀ.',s:'cantero in tuo onore grande sei mio signor tu sei degno di lode per sempre restero davanti a te che mi hai dato l amore piu grande mi hai liberato dal male e la forza tua mi sostiene in tuo onore o dio innalzero le mani e alla presenza tua contemplero la tua santita grande sei mio signor tu sei degno di lode per sempre restero davanti a te che mi hai dato l amore piu grande tu sei la fonte piu pura e la grazia tua mi risana in tuo onore o dio innalzero le mani e alla presenza tua io cantero per sempre in tuo onore o dio innalzero le mani e alla presenza tua contemplero la tua santita e alla presenza tua contemplero la tua santita 310',type:'N',i:342},
{n:'311',t:'COSA OFFRIRTI',c:'Cosa offrirti, o Dio,  \ncosa posso darti,  \neccomi son qui davanti a te.  \n  \nLe gioie ed i dolori,  \ngli affanni di ogni giorno,  \ntutto voglio vivere in te.  \n  \nACCETTA, MIO RE, QUESTO POCO CHE HO,  \nOFFRO A TE LA MIA VI - TA,  \nGIOIA È PER ME FAR LA TUA VOLONTÀ,  \nIL MIO UNICO BENE SEI SOLO TU, SOLO TU.  \n  \nVengo a te mio Dio,  \napro le mie braccia  \nche la tua letizia riempirà.  \nRinnova questo cuore  \nperché ti sappia amare  \ne nella tua pace io vivrò. (RIT)  \n  \nGIOIA È PER ME FAR LA TUA VOLONTÀ,  \nIL MIO UNICO BENE SEI SOLO TU.  \n \nACCETTA, MIO RE, QUESTO POCO CHE HO,  \nOFFRO A TE LA MIA VITA,  \nGIOIA È PER ME FAR LA TUA VOLONTÀ,   \nIL MIO UNICO BENE SEI SOLO TU, SOLO TU.',s:'cosa offrirti cosa offrirti o dio cosa posso darti eccomi son qui davanti a te le gioie ed i dolori gli affanni di ogni giorno tutto voglio vivere in te accetta mio re questo poco che ho offro a te la mia vi ta gioia e per me far la tua volonta il mio unico bene sei solo tu solo tu vengo a te mio dio apro le mie braccia che la tua letizia riempira rinnova questo cuore perche ti sappia amare e nella tua pace io vivro rit gioia e per me far la tua volonta il mio unico bene sei solo tu accetta mio re questo poco che ho offro a te la mia vita gioia e per me far la tua volonta il mio unico bene sei solo tu solo tu 311',type:'N',i:343},
{n:'312',t:'EMMANUELE',c:'Adoriamo la tua presenza Gesù,  \n \nDio con noi,    \ne con fede cantiamo il tuo nome Gesù,   \nDio con noi,  \nnella tua santità ci fai dimorare.  \n \nEMMANUELE TI CONTEMPLIAMO,  \nIL TUO VOLTO RISPLENDE NELLA GLORIA.  \n  \nProclamiamo che tu sei il vivente Gesù,   \nDio con noi,  \ne con fede cantiamo il tuo nome Gesù,  \nDio con noi,  \nnella tua santità ci fai dimorare. (RIT)  \n  \nEMMANUELE  TI CONTEMPLIAMO,   \n\nIL TUO VOLTO RISPLENDE NELLA GLORIA.  \nEMMANUEL!',s:'emmanuele adoriamo la tua presenza gesu dio con noi e con fede cantiamo il tuo nome gesu dio con noi nella tua santita ci fai dimorare emmanuele ti contempliamo il tuo volto risplende nella gloria proclamiamo che tu sei il vivente gesu dio con noi e con fede cantiamo il tuo nome gesu dio con noi nella tua santita ci fai dimorare rit emmanuele ti contempliamo il tuo volto risplende nella gloria emmanuel 312',type:'N',i:344},
{n:'313',t:'GLORIA AL SIGNORE CHE SALVA',c:'Gloria al Signore che salva,  \ngloria alla sua potenza,  \nsolo da lui la vittoria,  \ngloria al suo Nome.  \n  \nGLORIA AL SIGNORE CHE SALVA,  \nGLORIA ALLA SUA POTENZA,  \nSOLO DA LUI LA VITIORIA,  \nGLORIA AL SUO NOME PER SEMPRE.  \n  \nHa sconfitto le nazioni, distrutto ogni fortezza,  \ndal suo trono di gloria trionfa la giustizia. (RIT)  \n \nHa disperso i suoi nemici, difeso chi lo teme,  \nla sua destra potente, è scudo di salvezza. (RIT)  \n  \nHa liberato i giusti dal laccio della morte,  \ncon il suo braccio santo ha fatto meraviglie.  \n  \nGloria al Signore che salva,   \ngloria alla sua potenza,   \nsolo da lui la vittoria,  \ngloria al suo Nome. \n  \nGloria al Signore che salva,  \ngloria alla sua potenza,  \nsolo da lui la vittoria,  \ngloria al Signore.  \n  \nGLORIA AL SIGNORE CHE SALVA,   \nGLORIA ALLA SUA POTENZA,   \nSOLO DA LUILA VITIORIA,  \nGLORIA AL SUO NOME PER SEMPRE.  \nGLORIA AL SUO NOME PER SEMPRE,  \nGLORIA AL SIGNOR, AL SIGNOR.',s:'gloria al signore che salva gloria al signore che salva gloria alla sua potenza solo da lui la vittoria gloria al suo nome gloria al signore che salva gloria alla sua potenza solo da lui la vitioria gloria al suo nome per sempre ha sconfitto le nazioni distrutto ogni fortezza dal suo trono di gloria trionfa la giustizia rit ha disperso i suoi nemici difeso chi lo teme la sua destra potente e scudo di salvezza rit ha liberato i giusti dal laccio della morte con il suo braccio santo ha fatto meraviglie gloria al signore che salva gloria alla sua potenza solo da lui la vittoria gloria al suo nome gloria al signore che salva gloria alla sua potenza solo da lui la vittoria gloria al signore gloria al signore che salva gloria alla sua potenza solo da luila vitioria gloria al suo nome per sempre gloria al suo nome per sempre gloria al signor al signor 313',type:'N',i:345},
{n:'314',t:'IN TE C\'È SALVEZZA',c:'Sei con me quando sento che  \nil timore mi avvolge  \n\ned ho sete di te,  \ndella tua Parola e del tuo amore.  \n  \nSOLO IN TE C\'È SALVEZZA,  \nSO CHE TU SEI MIA FORTEZZA,  \nVOGLIO RESTARE NEL TUO AMORE.  \nSOLO IN TE C\'È SALVEZZA,   \nSO CHE TU SEI MIA FORTEZZA,  \nPER SEMPRE CON TE, MIO SIGNORE,   \nNEL TUO AMORE VIVRÒ.  \n  \nSei con me ogni volta che  \nil mio cuore vacilla,  \ncon te camminerò  \nsulla tua Parola e nel tuo amore. (RIT)  \n  \nSOLO IN TE C\'È SALVEZZA,   \nSO CHE TU SEI MIA FORTEZZA,   \nPER SEMPRE CON TE, MIO SIGNORE,   \nNEL TUO AMORE VIVRÒ,   \nNEL TUO AMORE VIVRÒ.',s:'in te c e salvezza sei con me quando sento che il timore mi avvolge ed ho sete di te della tua parola e del tuo amore solo in te c e salvezza so che tu sei mia fortezza voglio restare nel tuo amore solo in te c e salvezza so che tu sei mia fortezza per sempre con te mio signore nel tuo amore vivro sei con me ogni volta che il mio cuore vacilla con te camminero sulla tua parola e nel tuo amore rit solo in te c e salvezza so che tu sei mia fortezza per sempre con te mio signore nel tuo amore vivro nel tuo amore vivro 314',type:'N',i:346},
{n:'315',t:'MARIA',c:'Ora che sei qui,  \nla tua dolcezza sento dentro me.  \nCome l\'aurora sorgi,   \nrisplendi fra noi.  \nOra che sei qui,  \ntu figlia e madre,  \nfra le braccia tue  \ndiffondi la tua luce  \n \nceleste di pace e di amor.  \n  \nTU MARIA, TU SEI DIMORA  \nPER GESÙ FIGLIO TUO.  \nREGINA CHE DAL CIELO  \nSPERANZA  E AMORE CI DAI.  \n  \nOra che sei qui,  \ntu dolce madre sono figlio tuo,   \ntrasforma il mio pianto  \nnel canto d\'amore per te.  \n  \nTU MARIA, TU SEI DIMORA  \nPER GESÙ FIGLIO TUO.  \n\nREGINA CHE DAL CIELO  \n \nSPERANZA  E AMORE CI DAI.  \n  \nOra che sei qui,  \ninsegnami ad amare come sai,  \nradiosa fra le stelle,  \n \npreghiera ora sei.',s:'maria ora che sei qui la tua dolcezza sento dentro me come l aurora sorgi risplendi fra noi ora che sei qui tu figlia e madre fra le braccia tue diffondi la tua luce celeste di pace e di amor tu maria tu sei dimora per gesu figlio tuo regina che dal cielo speranza e amore ci dai ora che sei qui tu dolce madre sono figlio tuo trasforma il mio pianto nel canto d amore per te tu maria tu sei dimora per gesu figlio tuo regina che dal cielo speranza e amore ci dai ora che sei qui insegnami ad amare come sai radiosa fra le stelle preghiera ora sei 315',type:'N',i:347},
{n:'316',t:'QUALE GIOIA È STAR CON TE',c:'Ogni volta che ti cerco,  \nogni volta che t\'invoco,  \nsempre mi accogli Signor.  \nGrandi sono i tuoi prodigi,  \ntu sei buono verso tutti,   \nsanto tu regni tra noi.  \n  \nQUALE GIOIA È STAR CON TE GESÙ  \nVIVO E VICINO,   \nBELLO È DAR LODE A TE,  \nTU SEI IL SIGNOR.  \nQUALE DONO È AVER CREDUTO IN TE  \nCHE NON MI ABBANDONI,  \nIO PER SEMPRE ABITERÒ  \nLA TUA CASA, MIO RE.  \n  \nHai guarito il mio dolore,  \nhai cambiato questo cuore,  \noggi rinasco, Signor.  \nGrandi sono i tuoi prodigi,  \ntu sei buono verso tutti,  \nsanto tu regni tra noi. (RIT)   \n  \nHai salvato la mia vita,  \nhai aperto la mia bocca,  \ncanto per te, mio Signor.  \nGrandi sono i tuoi prodigi,  \ntu sei buono verso tutti,  \nsanto tu regni tra noi. (RIT) .  \n  \nTi loderò, ti adorerò,  \nti canterò, canteremo  \n  \nQUALE GIOIA È STAR CON TE GESÙ VIVO E VICINO,   \nBELLO È DAR LODE A TE, TU SEI IL SIGNOR.  \nQUALE DONO È AVER CREDUTO IN TE  \n\nCHE NON MI ABBANDONI,  \nIO PER SEMPRE ABITERÒ CON TE, SIGNOR.  \n  \nQUALE GIOIA È STAR CON TE GESÙ VIVO E VICINO,  \nBELLO È DAR LODE A TE, TU SEI IL SIGNOR.  \nQUALE DONO È AVER CREDUTO IN TE  \nCHE NON MI ABBANDONI,  \nIO PER SEMPRE ABITERÒ LA TUA CASA, MIO RE.  \n  \nVIVO  E VICINO,  \nTU SEI IL SIGNOR.  \nQUALE DONO È AVER CREDUTO IN TE  \nCHE NON MlABBANDONI,  \nIO PER SEMPRE ABITERÒ LA TUA CASA, MIO RE,   \nLA TUA CASA MIO RE.  \nTU SEI IL SIGNOR MIO RE.',s:'quale gioia e star con te ogni volta che ti cerco ogni volta che t invoco sempre mi accogli signor grandi sono i tuoi prodigi tu sei buono verso tutti santo tu regni tra noi quale gioia e star con te gesu vivo e vicino bello e dar lode a te tu sei il signor quale dono e aver creduto in te che non mi abbandoni io per sempre abitero la tua casa mio re hai guarito il mio dolore hai cambiato questo cuore oggi rinasco signor grandi sono i tuoi prodigi tu sei buono verso tutti santo tu regni tra noi rit hai salvato la mia vita hai aperto la mi {n:'317',t:'TU SEI MISERICORDIA',c:'Tu sei misericordia,  \ntu sei la verità  \ne se io ti seguirò,  \nla tua croce prenderò,  \nse cadrò tu mi solleverai.  \n  \nTU SEI MORTO PER ME  \nE RISORTO PER SEMPRE,  \nCOL TUO SANGUE VERSATO  \nTU MI HAI PURIFICATO,   \nDAL NEMICO CHE OPPRIME  \nTU Ml HAI RISCATIATO,  \nDALLA MORTE MI HAI LIBERATO.  \n  \nTu sei la mia vittoria,  \ntu sei la libertà,  \nhai sofferto per amore, \n mi hai donato la salvezza,  \nal mio grido tu risponderai. (RIT)  \n  \nTu sei la mia dimora,  \nsolo in te riposerò,  \nil tuo spirito di vita  \nmi darà consolazione,  \nla mia anima tu sazierai.  \n \nTU SEI MORTO PER ME  \n\nE RISORTO PER SEMPRE,  \nCOL TUO SANGUE VERSATO  \nTU MI HAI PURIFICATO,  \nDAL NEMICO CHE OPPRIME  \nTU MI HAI RISCATTATO,  \nDALLA MORTE MI HAI LIBERATO,   \nDALLA MORTE MI HAI LIBERATO.',s:'tu sei misericordia tu sei misericordia tu sei la verita e se io ti seguiro la tua croce prendero se cadro tu mi solleverai tu sei morto per me e risorto per sempre col tuo sangue versato tu mi hai purificato dal nemico che opprime tu ml hai riscatiato dalla morte mi hai liberato tu sei la mia vittoria tu sei la liberta hai sofferto per amore mi hai donato la salvezza al mio grido tu risponderai rit tu sei la mia dimora solo in te riposero il tuo spirito di vita mi dara consolazione la mia anima tu sazierai tu sei morto per me e risorto per sempre col tuo sangue versato tu mi hai purificato dal nemico che opprime tu mi hai riscattato dalla morte mi hai liberato dalla morte mi hai liberato 317',type:'N',i:349},
{n:'318',t:'VOGLIO VEDERE IL TUO VOLTO',c:'La mia preghiera voglio innalzare  \na te che sei il mio Signor,   \ntu tanto atteso da tutte le genti  \nora sei qui in mezzo a noi.  \n  \nNEL TUO SANTO TEMPIO  \nINNALZO  LE MIE MANIVERSO  TE, GESÙ,  \nAPRI I MIEI OCCHI, SIGNORE.  \nNEL TUO SANTO TEMPIO  \nINNALZO LE MIE MANI VERSO TE, GESÙ,   \nAPRI IMIEI OCCHI, SIGNORE,   \nVOGLIO VEDERE IL TUO VOLTO.  \n  \nGuida i miei passi con la tua luce,  \nvoglio seguirti Signor,  \ntocca il mio cuore e le mie labbra  \nper annunciare il tuo amor. (RIT)  \n  \nAPRI IMIEI OCCHI,SIGNORE,  \nAPRI IMIEI OCCHI,SIGNORE,  \nAPRI IMIEI OCCHI,SIGNORE,   \nVOGLIO VEDERE IL TUO VOLTO.',s:'voglio vedere il tuo volto la mia preghiera voglio innalzare a te che sei il mio signor tu tanto atteso da tutte le genti ora sei qui in mezzo a noi nel tuo santo tempio innalzo le mie maniverso te gesu apri i miei occhi signore nel tuo santo tempio innalzo le mie mani verso te gesu apri imiei occhi signore voglio vedere il tuo volto guida i miei passi con la tua luce voglio seguirti signor tocca il mio cuore e le mie labbra per annunciare il tuo amor rit apri imiei occhi signore apri imiei occhi signore apri imiei occhi signore voglio vedere il tuo volto 318',type:'N',i:350},
{n:'319',t:'ALZA I TUOI OCCHI AL CIELO',c:'Cristo Gesù, Figlio di Dio,  \nad ogni uomo il suo amore mostrò.  \nEgli guarì e liberò,  \ntutto se stesso donò.  \nSai che Gesù, se tu lo vuoi,  \ni suoi prodigi rinnova per te.  \nSenza timor apriti a lui,  \nti ama così come sei, come sei.  \n  \nALZA I TUOI OCCHI AL CIELO E VEDRAI,  \n\nNUOVI ORIZZONTI TU SCOPRIRAI.  \nLASCIA OGNI COSA E INSIEME A NOI  \nCANTA Al DIO DELL\'AMOR.  \n  \nAPRI IL TUO CUORE A CRISTO E VEDRAI,   \nNELLA TRISTEZZA PIÙ NON VIVRAI.   \nLASCIA OGNI COSA E INSIEME A NOI  \nCANTA Al DIO DELL\'AMOR.  \n  \nCristo Gesù, Figlio di Dio,  \nparole eterne al mondo donò.   \nEgli morì, risuscitò,  \nla croce sua ci salvò.  \n  \nSai che Gesù, se tu lo vuoi,  \ni suoi prodigi rinnova per te.  \nSenza timor apriti a lui,  \nti ama così come sei, come sei. (RIT)  \n  \nCristo Gesù, Figlio di Dio,  \nai suoi amici la pace portò.   \nAl ciel salì ma vive in noi  \ncon il suo soffio d\'amor.  \n  \nSai che Gesù, se tu lo vuoi,  \ni suoi prodigi rinnova per te.  \nSenza timor apriti a lui,  \nti ama così come sei, come sei. (RIT)  \n \n(coda facoltativa) \n  \nALZA  I TUOI OCCHI AL CIELO E VEDRAI,  \nNUOVI ORIZZONTI TU SCOPRIRAI.  \nLASCIA OGNI COSA E INSIEME A NOI  \nCANTA AL DIO DELL\'AMOR,  \nCANTA AL DIO DELL\'AMOR,   \nCANTA AL DIO DELL\'AMOR.',s:'alza i tuoi occhi al cielo cristo gesu figlio di dio ad ogni uomo il suo amore mostro egli guari e libero tutto se stesso dono sai che gesu se tu lo vuoi i suoi prodigi rinnova per te senza timor apriti a lui ti ama cosi come sei come sei alza i tuoi occhi al cielo e vedrai nuovi orizzonti tu scoprirai lascia ogni cosa e insieme a noi canta al dio dell amor apri il tuo cuore a cristo e vedrai nella tristezza piu non vivrai lascia ogni cosa e insieme a noi canta al dio dell amor cristo gesu figlio di dio parole eterne al mondo dono egli mori risuscito la croce sua ci salvo sai che gesu se tu lo vuoi i suoi prodigi rinnova per te senza timor apriti a lui ti ama cosi come sei come sei rit cristo gesu figlio di dio ai suoi amici la pace porto al ciel sali ma vive in noi con il suo soffio d amor sai che gesu se tu lo vuoi i suoi prodigi rinnova per te senza timor apriti a lui ti ama cosi come sei come sei rit coda facoltativa alza i tuoi occhi al cielo e vedrai nuovi orizzonti tu scoprirai lascia ogni cosa e insieme a noi canta al dio dell amor canta al dio dell amor canta al dio dell amor 319',type:'N',i:351},
{n:'320',t:'ASCOLTO LA TUA VOCE',c:'Ascolto la tua voce, Signor,  \nspero nella tua Parola,  \nin te rifugio io troverò  \nperché sei la mia dimora.  \n  \nFINCHÉ SOFFIERÀ IL VENTO  \n\nE OGNI VITA AVRÀ IL SUO CANTO,  \nSE ALL\'ALBA UN FIORE SI APRIRÀ,  \nBAGNERÀ LA SABBIA IL MARE,  \nSCIOGLIERÀ LA NEVE IL SOLE,  \nIL CREATO LA TUA VOCE ASCOLTERÀ.  \n  \nlo vedo la tua luce Signor,  \ncome il sole all\'aurora.  \nVicino a te io camminerò,  \nnon avrà ombre la sera. (RIT)  \n \nlo sento la tua pace Signor,  \ntu mi dai la gioia vera.  \nA te per sempre io canterò,  \nproclamando la tua gloria. (RIT)  \n \n(coda facoltativa)  \n  \nFINCHÉ SOFFIERÀ IL VENTO  \nE OGNI VITA AVRÀ IL SUO CANTO,  \nSE ALL\'ALBA UN FIORE SI APRIRÀ, (x2)  \nIL CREATO LA TUA VOCE ASCOLTERÀ.',s:'ascolto la tua voce ascolto la tua voce signor spero nella tua parola in te rifugio io trovero perche sei la mia dimora finche soffiera il vento e ogni vita avra il suo canto se all alba un fiore si aprira bagnera la sabbia il mare sciogliera la neve il sole il creato la tua voce ascoltera lo vedo la tua luce signor come il sole all aurora vicino a te io camminero non avra ombre la sera rit lo sento la tua pace signor tu mi dai la gioia vera a te per sempre io cantero proclamando la tua gloria rit coda facoltativa finche soffiera il vento e ogni vita avra il suo canto se all alba un fiore si aprira x2 il creato la tua voce ascoltera 320',type:'N',i:352},
{n:'321',t:'CELEBRERÒ LE TUE LODI',c:'CELEBRERÒ LE TUE LODI, SIGNORE,  \nNEL TUO TEMPIO TI ESALTERÒ,  \nIO CANTERÒ A TE CHE SEI LA MIA GIOIA,   \nUN CANTO NUOVO T\'INNALZERÒ.  \n  \nÈ bello dar lode al tuo Nome  \ne cantare le tue meraviglie,  \nannunziare ogni giorno il tuo Nome,  \nla tua gloria in eterno e per sempre. (RIT)  \n  \nQuanto sei grande Signore,  \nsei potente e compi prodigi.  \nSon profondi i tuoi pensieri,  \nsei l\'eccelso in eterno e per sempre. (RIT)  \n  \nTu mi ridoni la forza,  \nmi cospargi di olio splendente.   \nIl giusto con te trova pace,  \nsono retti i tuoi giudizi.  \n \n(coda facoltativa) \n\n  \nCELEBRERÒ,  CELEBRERÒ,  CELEBRERÒ.  \n  \nCELEBRERÒ LE TUE LODI, SIGNORE,  \nNEL TUO TEMPIO TI ESALTERÒ.   \nCELEBRERÒ LE TUE LODI, SIGNORE,  \nNEL TUO TEMPIO IO T\'INNALZERÒ,   \nT\'INNALZERÒ,  \nIO T\'INNALZERÒ.',s:'celebrero le tue lodi celebrero le tue lodi signore nel tuo tempio ti esaltero io cantero a te che sei la mia gioia un canto nuovo t innalzero e bello dar lode al tuo nome e cantare le tue meraviglie annunziare ogni giorno il tuo nome la tua gloria in eterno e per sempre rit quanto sei grande signore sei potente e compi prodigi son profondi i tuoi pensieri sei l eccelso in eterno e per sempre rit tu mi ridoni la forza mi cospargi di olio splendente il giusto con te trova pace sono retti i tuoi giudizi coda facoltativa celebrero celebrero celebrero celebrero le tue lodi signore nel tuo tempio ti esaltero celebrero le tue lodi signore nel tuo tempio io t innalzero t innalzero io t innalzero 321',type:'N',i:353},
{n:'322',t:'CON UN CUORE SOLO',c:'CON UN CUORE SOLO  \nCANTIAMO ALLA GLORIA DI DIO,  \nCON  UN\'ANIMA  SOLA  \nNOI DIAMO LODE AL SIGNOR.  \nCOME INCENSO SALGA AL CIELO OGGI  \nQUESTA NOSTRA LODE,  \nFORMIAMO UN SOL CORPO  \nIN CRISTO IL SIGNOR. (x2)  \n  \n(finale) \nUNITI IN CRISTO IL SIGNOR.  \n  \nSignore, il popolo tuo è riunito  \nper fare un solo corpo che dia lode a te.  \nOgni distanza in te non ha misura,  \nnoi siamo la tua Chiesa, Gesù.  \n(RIT)   \n  \nSui tuoi sentieri di pace e amore  \nnoi camminiamo uniti verso te Signore.  \nNella Parola tua saremo salvi,  \nrafforza in noi la fede, Gesù. (RIT)   \n \nChe il mondo ci riconosca, Signore,  \ndal modo in cui ci ameremo gli uni gli altri.  \nNel volto di ogni uomo vediamo  \nla tua presenza viva, Gesù.  \n \n(coda facoltativa) \n \nCON UN CUORE SOLO, CON UN\'ANIMA SOLA  \nCANTIAMO INSIEME, INSIEME.  \nFORMIAMO UN SOL CORPO IN CRISTO IL SIGNORE,  \n  \nCANTIAMO CON UN\'ANIMA SOLA,  \nCANTIAMO INSIEME, INSIEME.  \n\nFORMIAMO UN SOL CORPO  \nIN CRISTO IL SIGNORE.  \n \nINSIEME CANTIAMO ALLA GLORIA DI DIO,  \nCON UN\'ANIMA SOLA NOI DIAMO LODE AL SIGNOR.  \nCOME INCENSO SALGA AL CIELO OGGI  \nQUESTA NOSTRA LODE,  \nFORMIAMO UN SOL CORPO UNITI IN CRISTO IL SIGNOR,  \nIL SIGNOR IL SIGNOR IL SIGNOR CRISTO SIGNORE.',s:'con un cuore solo con un cuore solo cantiamo alla gloria di dio con un anima sola noi diamo lode al signor come incenso salga al cielo oggi questa nostra lode formiamo un sol corpo in cristo il signor x2 finale uniti in cristo il signor signore il popolo tuo e riunito per fare un solo corpo che dia lode a te ogni distanza in te non ha misura noi siamo la tua chiesa gesu rit sui tuoi sentieri di pace e amore noi camminiamo uniti verso te signore nella parola tua saremo salvi rafforza in noi la fede gesu rit che il mondo ci riconosca signore dal modo in cui ci ameremo gli uni gli altri nel volto di ogni uomo vediamo la tua presenza viva gesu coda facoltativa con un cuore solo con un anima sola cantiamo insieme insieme formiamo un sol corpo in cristo il signore cantiamo con un anima sola cantiamo insieme insieme formiamo un sol corpo in cristo il signore insieme cantiamo alla gloria di dio con un anima sola noi diamo lode al signor come incenso salga al cielo oggi questa nostra lode formiamo un sol corpo uniti in cristo il signor il signor il signor il signor cristo signore 322',type:'N',i:354},
{n:'323',t:'CRISTO SPERANZA DELLE GENTI',c:'CRISTO GESÙ SPERANZA DELLE GENTI,  \nCRISTO GESÙ SALVEZZA DI OGNI DEBOLE,   \nCRISTO GESÙ RICCHEZZA DI OGNI POVERO,  \nSEI LA MIA EREDITÀ.   \n \nLuce del mondo sei,  \nsole senza tramonto,    \nil tuo splendore rischiara la notte   \ne guida i passi miei. (RIT)  \n  \nRe di speranza e di pace,  \ngioia del mondo sei.  \nLa tua giustizia e la tua misericordia  \nsplendono su di me. (RIT)  \n \nCRISTO GESÙ SPERANZA DELLE GENTI,  \nCRISTO GESU SPERANZA DELLE GENTI. (RIT)  \n \nQuando verrai nella gloria  \ndel regno del Padre tuo  \ngiudicherai con sapienza e indulgenza  \ne i miti accoglierai. (RIT)  \n \nSEI LA MIA EREDITÀ,  \nSEI LA MIA EREDITÀ.',s:'cristo speranza delle genti cristo gesu speranza delle genti cristo gesu salvezza di ogni debole cristo gesu ricchezza di ogni povero sei la mia eredita luce del mondo sei sole senza tramonto il tuo splendore rischiara la notte e guida i passi miei rit re di speranza e di pace gioia del mondo sei la tua giustizia e la tua misericordia splendono su di me rit cristo gesu speranza delle genti cristo gesu speranza delle genti rit quando verrai nella gloria del regno del padre tuo giudicherai con sapienza e indulgenza e i miti accoglierai rit sei la mia eredita sei la mia eredita 323',type:'N',i:355},
{n:'324',t:'DONNA DELLA SPERANZA',c:'DONNA DELL\'ATTESA,  \nDONNA DELLA SPERANZA.  \nDONNA DEL DOLORE,  \nDONNA DEL FUOCO D\'AMORE.  \nDONNA DELLO STUPORE,  \n\nDONNA VESTITA DI SOLE.  \n  \nNel grembo tuo accolta è la Parola  \nche l\'uomo attende per la sua salvezza,   \ncarne di  Dio tu ci  doni, o Madre. (RIT)  \n  \nDivora il cuore l\'affanno di ogni giorno,   \nl\'oro non sazia né fortuna umana,  \nsalvi noi siamo nel Bimbo tuo divino. (RIT)  \n  \nDolore muto sul tuo volto, o Madre santa,  \ndal cuore aperto sangue sgorga e acqua,  \ndal Figlio tuo donati a te noi siamo. (RIT)  \n  \nRoveto Ardente, vivo d\'amore, Vergine Maria,   \nper te che preghi viene forza nuova,  \narde nel nostro cuore, di Dio il fuoco santo.  \n \nDONNA DELL\'ATTESA,  \nDONNA DELLA SPERANZA.  \nDONNA DEL DOLORE,  \nDONNA DEL FUOCO D\'AMORE.  \nDONNA DELLO STUPORE,   \nDONNA VESTITA DI SOLE.  \n  \nSei segno in cielo di stelle incoronata,   \nsole è la veste, luce il tuo sorriso,  \nper noi ottieni,o Madre, il paradiso. (RIT)  \n  \nSia lode al Padre Onnipotente Dio dell\'universo   \nal Figlio tuo e allo Spirito d\'amore  \nche t\'han ricolmata d\'ogni onore. Amen. (RIT)  \n   \nOH   \nDONNA DEL FUOCO D\'AMOR.',s:'donna della speranza donna dell attesa donna della speranza donna del dolore donna del fuoco d amore donna dello stupore donna vestita di sole nel grembo tuo accolta e la parola che l uomo attende per la sua salvezza carne di dio tu ci doni o madre rit divora il cuore l affanno di ogni giorno l oro non sazia ne fortuna umana salvi noi siamo nel bimbo tuo divino rit dolore muto sul tuo volto o madre santa dal cuore aperto sangue sgorga e acqua dal figlio tuo donati a te noi siamo rit roveto ardente vivo d amore vergine maria per te che preghi viene forza nuova arde nel nostro cuore di dio il fuoco santo donna dell attesa donna della speranza donna del dolore donna del fuoco d amore donna dello stupore donna vestita di sole sei segno in cielo di stelle incoronata sole e la veste luce il tuo sorriso per noi ottieni o madre il paradiso rit sia lode al padre onnipotente dio dell universo al figlio tuo e allo spirito d amore che t han ricolmata d ogni onore amen rit oh donna del fuoco d amor 324',type:'N',i:356},
{n:'325',t:'GESU\' RICORDATI DI ME',c:'Io oggi alzo lo sguardo verso te,   \ntrafitto per i miei peccati.   \nPer le tue piaghe io guarirò,  \nGesù ricordati di me,   \nGesù ricordati di me.  \n  \nTU SEI VERAMENTE IL FIGLIO DI DIO   \nVENUTO A SALVARMI.  \n\nTU SEI VERAMENTE L\'AGNELLO DI DIO,   \nOGNI  PERDONO NELLA TUA CROCE.  \n  \nlo oggi alzo lo sguardo verso te,  \nmi doni Maria come madre.  \nQuesto ti chiedo,  \nnel regno dei cieli  \nGesù ricordati di me,  \nGesù ricordati di me. (RIT)',s:'gesu ricordati di me io oggi alzo lo sguardo verso te trafitto per i miei peccati per le tue piaghe io guariro gesu ricordati di me gesu ricordati di me tu sei veramente il figlio di dio venuto a salvarmi tu sei veramente l agnello di dio ogni perdono nella tua croce lo oggi alzo lo sguardo verso te mi doni maria come madre questo ti chiedo nel regno dei cieli gesu ricordati di me gesu ricordati di me rit 325',type:'N',i:357},
{n:'326',t:'IN UNITÀ',c:'Viviamo insieme in unità  \ndi mente e di cuore,  \nprotesi verso Dio.  \nQuesto è lo scopo della nostra vita,  \ntestimonianza vera  \nper il mondo in cui,  \nin cui viviamo.  \n  \nDi ogni cosa nessuno dica:  \nè mio è tuo; questo non è amore.  \nCome un tempo tutto sia in comune,  \nperché nessuno mai soffra ingiustizia.  \n  \nDACCI, DACCI SIGNORE LA COERENZA  \nDI VIVERE PER SEMPRE QUESTO DONO  \nCHE TU CI FAI OGNI GIORNO PORTANDOCI A TE.  \nE ALLORA DACCI, DACCI LA GIOIA DI SENTIRTI   \nIN CHI CI VIVE ACCANTO,  \nIN CHI RICERCA TE, O  SIGNOR. \n \n(da capo)  \n  \nDACCI, DACCI DI VIVERE SIGNORE PER SEMPRE IN UNITÀ.  \nDACCI, DACCI DI VIVERE SIGNORE PER SEMPRE IN UNITÀ.  \nDACCI, DACCI DI VIVERE SIGNORE PER SEMPRE IN UNITÀ.  \nDACCI, DACCI DI VIVERE SIGNORE IN UNITÀ.',s:'in unita viviamo insieme in unita di mente e di cuore protesi verso dio questo e lo scopo della nostra vita testimonianza vera per il mondo in cui in cui viviamo di ogni cosa nessuno dica e mio e tuo questo non e amore come un tempo tutto sia in comune perche nessuno mai soffra ingiustizia dacci dacci signore la coerenza di vivere per sempre questo dono che tu ci fai ogni giorno portandoci a te e allora dacci dacci la gioia di sentirti in chi ci vive accanto in chi ricerca te o signor da capo dacci dacci di vivere signore per sempre in unita dacci dacci di vivere signore per sempre in unita dacci dacci di vivere signore per sempre in unita dacci dacci di vivere signore in unita 326',type:'N',i:358},
{n:'327',t:'LA TUA GLORIA ILLUMINA IL CAMMINO',c:'LA TUA GLORIA ILLUMINA IL CAMMINO   \nDI CHE CERCA TE SIGNORE.   \nSEI COLONNA DI FUOCO NELLA NOTTE,   \nCI SOSTIENI CON LA TUA BONTA.  \n\n  \nPadre, santo tu sei, nel tuo amore ci hai creato.   \nHai guidato Israele nel deserto,   \ncon il pane del cielo lo hai nutrito.   \nCome ombra hai vegliato sui suoi passi,  \ndalla roccia lo hai dissetato. (RIT)  \n  \nCristo misericordioso, per amore offerto al mondo,  \nsei venuto buon samaritano,  \ne con noi ti sei fatto pellegrino.  \nIl tuo Corpo e il tuo Sangue ci hai donato  \nper restare per sempre con noi. (RIT)   \n \nSpirito Santo Signore, sei datore della vita,  \nsei consolatore di ogni uomo, ci riveli Cristo Gesù.  \nTu proteggi e rinnovi la tua Chiesa  \ne la guidi alla santità. (RIT)  \n \n(coda facoltativa) \n \nLA TUA GLORIA ILLUMINA IL CAMMINO  \nLA TUA GLORIA ILLUMINA IL CAMMINO   \nDI CHE CERCA TE SIGNOR. (RIT)  \n \n \nCI SOSTIENI CON LA TUA BONTA.',s:'la tua gloria illumina il cammino la tua gloria illumina il cammino di che cerca te signore sei colonna di fuoco nella notte ci sostieni con la tua bonta padre santo tu sei nel tuo amore ci hai creato hai guidato israele nel deserto con il pane del cielo lo hai nutrito come ombra hai vegliato sui suoi passi dalla roccia lo hai dissetato rit cristo misericordioso per amore offerto al mondo sei venuto buon samaritano e con noi ti sei fatto pellegrino il tuo corpo e il tuo sangue ci hai donato per restare per sempre con noi rit spirito santo signore sei datore della vita sei consolatore di ogni uomo ci riveli cristo gesu tu proteggi e rinnovi la tua chiesa e la guidi alla santita rit coda facoltativa la tua gloria illumina il cammino la tua gloria illumina il cammino di che cerca te signor rit ci sostieni con la tua bonta 327',type:'N',i:359},
{n:'328',t:'NOI CREDIAMO IN TE',c:'Gesù, nostro Signore, tu sei qui in mezzo a noi,  \nallontana il timore e mostraci il tuo grande amor.  \nSolo tu sei la vita, tu sei via e verità,  \nresta qui insieme a noi e nulla più mancherà.  \n  \nNOI CREDIAMO IN TE GESÙ,   \nTU SEI L\'UNICO SALVATOR.  \nCHI CREDE IN TE GRANDI COSE FARÀ  \nED IL TUO VOLTO VEDRÀ.  \nNOI CREDIAMO IN TE GESÙ,   \nNOI SPERIAMO NEL NOME TUO.  \nTU SEI NEL PADRE E IL PADRE È IN TE,  \nTU SEI IL SIGNOR, SEI IL RE, IL RE.  \n  \nSoli non ci hai lasciati, il tuo Spirito è in noi,   \negli è il Consolatore e nulla più mancherà.   \nNoi ti amiamo Signore, la tua legge seguiam,  \ntu ci doni la pace e nulla più mancherà. (RIT)  \n\n \n(coda facoltativa) \n  \nNOI CREDIAMO IN TE  GESÙ,  \nTU SEI L\'UNICO SALVATOR.  \nCHI CREDE IN TE GRANDI COSE FARÀ  \nED IL TUO VOLTO VEDRÀ,  \nSEI IL RE.  \n  \nNOI CREDIAMO IN TE GESÙ,  \nNOI SPERIAMO NEL NOME TUO.  \nTU SEI NEL PADRE E IL PADRE È IN TE,  \nTU SEI IL SIGNOR, SEI IL RE, IL RE.  \n  \nNOI CREDIAMO IN TE GESÙ,  \nNOI SPERIAMO NEL NOME TUO. NOI  \nCREDIAMO IN TE GESÙ,  \nNOI SPERIAMO NEL NOME TUO  \nIL RE, RE.',s:'noi crediamo in te gesu nostro signore tu sei qui in mezzo a noi allontana il timore e mostraci il tuo grande amor solo tu sei la vita tu sei via e verita resta qui insieme a noi e nulla piu manchera noi crediamo in te gesu tu sei l unico salvator chi crede in te grandi cose fara ed il tuo volto vedra noi crediamo in te gesu noi speriamo nel nome tuo tu sei nel padre e il padre e in te tu sei il signor sei il re il re soli non ci hai lasciati il tuo spirito e in noi egli e il consolatore e nulla piu manchera noi ti amiamo signore la tua legge seguiam tu ci doni la pace e nulla piu manchera rit coda facoltativa noi crediamo in te gesu tu sei l unico salvator chi crede in te grandi cose fara ed il tuo volto vedra sei il re noi crediamo in te gesu noi speriamo nel nome tuo tu sei nel padre e il padre e in te tu sei il signor sei il re il re noi crediamo in te gesu noi speriamo nel nome tuo noi crediamo in te gesu noi speriamo nel nome tuo il re re 328',type:'N',i:360},
{n:'329',t:'PER SEMPRE RE DELLA GLORIA',c:'A te Signore e mio Dio,  \n \na te che siedi nei cieli,  \nil mio canto innalzo con gioia     \nper le cose che hai fatto per me.  \n \nPER SEMPRE RE DELLA GLORIA  \nIO TI RINGRAZIERÒ,  \nMI HAI DATO UNO SPIRITO NUOVO,   \nCON LA MIA VITA IO TI ESALTERÒ.  \nPER SEMPRE RE DELLA GLORIA  \nIO TI BENEDIRO,  \nA TE IO CANTERÒ LODI,  \nNEL TUO TEMPIO T\'INNALZERÒ,  \nMIO SIGNOR.  \n  \nOgni ginocchio si pieghi  \ned ogni lingua ti acclami,  \nperché forte è il tuo amore per noi   \ned eterna è la tua fedeltà. (RIT)  \n  \nPER SEMPRE RE DELLA GLORIA  \nIO TI  BENEDIRÒ,  \nA TE IO CANTERÒ LODI,  \nNEL TUO TEMPIO T\'INNALZERÒ MIO SIGNOR,  \n\nMIO SIGNOR,  \nMIO SIGNOR, MIO SIGNOR.',s:'per sempre re della gloria a te signore e mio dio a te che siedi nei cieli il mio canto innalzo con gioia per le cose che hai fatto per me per sempre re della gloria io ti ringraziero mi hai dato uno spirito nuovo con la mia vita io ti esaltero per sempre re della gloria io ti benediro a te io cantero lodi nel tuo tempio t innalzero mio signor ogni ginocchio si pieghi ed ogni lingua ti acclami perche forte e il tuo amore per noi ed eterna e la tua fedelta rit per sempre re della gloria io ti benediro a te io cantero lodi nel tuo tempio t innalzero mio signor mio signor mio signor mio signor 329',type:'N',i:361},
{n:'330',t:'TI ADORERÒ',c:'Il mio sguardo fisso in te Gesù,   \nvoglio dare la mia vita a te,  \nio ti adoro, tu sei la mia libertà.  \nTu sei qui risorto mio Signor,  \nvivo e vero nella tua maestà,   \nla mia anima ti loda, Re dei re.  \n \nTI ADORERÒ, TI BENEDIRÒ  \nE CON GLI ANGELI IO TI ESALTERÒ.  \nTI ADORERÒ, TI BENEDIRÒ  \nPERCHÉ SEI POTENTE, MIO SIGNOR.  \n  \nTu sei l\'unico mio Salvator,  \nil pastore che mi guiderà,   \nmi conduci sul sentiero del tuo amor.  \nSe il buio mi circonderà  \nson sicuro che con me sarai,  \nmi hai promesso la tua eterna fedeltà. (RIT)  \n \nOh \nLa mia anima ti loda, Re dei re. (RIT)  \n \nPERCHÉ SEI POTENTE MIO SIGNOR.  \nTI ADORERÒ, TI BENEDIRÒ   \nPERCHÉ SEI POTENTE, MIO SIGNOR.  \nPERCHÉ SEI POTENTE, MIO SIGNOR.',s:'ti adorero il mio sguardo fisso in te gesu voglio dare la mia vita a te io ti adoro tu sei la mia liberta tu sei qui risorto mio signor vivo e vero nella tua maesta la mia anima ti loda re dei re ti adorero ti benediro e con gli angeli io ti esaltero ti adorero ti benediro perche sei potente mio signor tu sei l unico mio salvator il pastore che mi guidera mi conduci sul sentiero del tuo amor se il buio mi circondera son sicuro che con me sarai mi hai promesso la tua eterna fedelta rit oh la mia anima ti loda re dei re rit perche sei potente mio signor ti adorero ti benediro perche sei potente mio signor perche sei potente mio signor 330',type:'N',i:362},
{n:'331',t:'CRISTO RE',c:'Benedetto sei Signore,  \nRe di pace e di vittoria,  \nsei venuto in mezzo a noi,  \nmite ed umile di cuore.  \nBuon maestro ci hai insegnato ad amare,  \nquesto popolo ti eleva la sua lode.  \n  \nA TE CANTIAMO CRISTO RE DELL\'UNIVERSO,   \nTU DIVINO REDENTORE VIENI A DIMORARE IN NOI.  \nTI PROCLAMIAMO CRISTO RE DELL\'UNIVERSO,  \nLA TUA LUCE RISPLENDE SU DI NOI.  \n  \n\nLa speranza è solo in te  \nperché sei un Dio fedele,   \ncon la tua misericordia  \nhai guarito i nostri cuori.   \nTu ci guidi e ci consoli con amore,  \nquesto popolo ti eleva la sua lode. (RIT)',s:'cristo re benedetto sei signore re di pace e di vittoria sei venuto in mezzo a noi mite ed umile di cuore buon maestro ci hai insegnato ad amare questo popolo ti eleva la sua lode a te cantiamo cristo re dell universo tu divino redentore vieni a dimorare in noi ti proclamiamo cristo re dell universo la tua luce risplende su di noi la speranza e solo in te perche sei un dio fedele con la tua misericordia hai guarito i nostri cuori tu ci guidi e ci consoli con amore questo popolo ti eleva la sua lode rit 331',type:'N',i:363},
{n:'332',t:'DANZERO\' PER TE',c:'Danzerò per te Signore, Dio della mia vita,   \ndanzerò per te Signore, Dio della mia lode. \nTutto il mio corpo oggi canterà per te,  \ngioia piena tu mi doni alla tua presenza.  \n  \nCOSÌ DANZERÒ, DAVANTI A TE SIGNORE,   \nFIGLIO TUO NELLA LIBERTÀ.  \nIO VIVRÒ LA TUA MISERICORDIA   \nE TI BENEDIRÒ.  \n \n \n  333 -',s:'danzero per te danzero per te signore dio della mia vita danzero per te signore dio della mia lode tutto il mio corpo oggi cantera per te gioia piena tu mi doni alla tua presenza cosi danzero davanti a te signore figlio tuo nella liberta io vivro la tua misericordia e ti benediro 333 332',type:'N',i:364},
{n:'333',t:'DIO È AMORE',c:'Dio ha mandato il suo Figlio Gesù  \nperché avessimo la vita per lui.  \nÈ Dio che per primo ha scelto noi,  \nsuo Figlio si è offerto  \nper i nostri peccati, per noi.  \n \nDIO È AMORE, DIO È AMORE,  \nDIO AMA, DIO AMA,   DIO È AMORE.  \nDIO È AMORE, DIO È AMORE,  \nDIVINA TRINITÀ, PERFETTA CARITÀ,  \nDIO È AMORE.  \n  \nSe noi amiamo Dio abita in noi  \ne così noi dimoriamo in lui.  \nEgli ci dona il suo Spirito:  \nci ha dato la vita,  \nper sempre suoi figli noi siamo. (RIT) \n  \nDIO È AMORE, DIO È AMORE,  \nAMORE, AMORE, DIO È AMORE. RIT.',s:'dio e amore dio ha mandato il suo figlio gesu perche avessimo la vita per lui e dio che per primo ha scelto noi suo figlio si e offerto per i nostri peccati per noi dio e amore dio e amore dio ama dio ama dio e amore dio e amore dio e amore divina trinita perfetta carita dio e amore se noi amiamo dio abita in noi e cosi noi dimoriamo in lui egli ci dona il suo spirito ci ha dato la vita per sempre suoi figli noi siamo rit dio e amore dio e amore amore amore dio e amore rit 333',type:'N',i:365},
{n:'334',t:'\' IL SIGNORE LA MIA SALVEZZA',c:'È IL SIGNORE LA MIA SALVEZZA,  \nÈ IL SIGNORE CHE LUCE MI DÀ,  \nSOLO LUI È LA MIA DIFESA,   \nIL MIO CUORE MAI PIÙ TEMERÀ.  \nE IL SIGNORE LA MIA SALVEZZA,  \nÈ IL SIGNORE CHE LUCE MI DÀ,   \nSOLO LUI È LA MIA DIFESA,   \nIL MIO CUORE MAI PIÙ TEMERÀ.  \n  \nEgli mi ha difeso dall\'attacco del nemico,  \nla sua forza ha già sconfitto il male.  \nOra innalzo gli occhi a lui, verso il suo santo trono.  \nGloria a lui, gloria al Signor! (RIT) \n  \nUna cosa ho chiesto al Signore mio Dio:   \nabitare la sua casa per sempre,  \ncontemplando il volto suo, la dolcezza del suo amore.   \nGloria a lui, gloria al Signor! (RIT) \n  \nSeguirò la via che il mio Signor mi mostrerà,   \nalla sua presenza resterò.  \nIo cerco il volto suo che speranza mi darà.  \nGloria a lui, gloria al Signor! (RIT)',s:'il signore la mia salvezza e il signore la mia salvezza e il signore che luce mi da solo lui e la mia difesa il mio cuore mai piu temera e il signore la mia salvezza e il signore che luce mi da solo lui e la mia difesa il mio cuore mai piu temera egli mi ha difeso dall attacco del nemico la sua forza ha gia sconfitto il male ora innalzo gli occhi a lui verso il suo santo trono gloria a lui gloria al signor rit una cosa ho chiesto al signore mio dio abitare la sua casa per sempre contemplando il volto suo la dolcezza del suo amore gloria a lui gloria al signor rit seguiro la via che il mio signor mi mostrera alla sua presenza restero io cerco il volto suo che speranza mi dara gloria a lui gloria al signor rit 334',type:'N',i:366},
{n:'335',t:'LA NOSTRA LODE INNALZIAMO',c:'LA NOSTRA LODE INNALZIAMO A CRISTO,   \nFACCIAMO FESTA, ESULTIAMO IN LUI.  \nCON GIOIA GRANDE ACCLAMIAMO AL RISORTO,  \nALLELUIA, ALLELUIA!  \nLA NOSTRA LODE INNALZIAMO A CRISTO,   \nFACCIAMO FESTA, ESULTIAMO IN LUI.  \nCON GIOIA GRANDE ACCLAMIAMO AL RISORTO,  \nALLELUIA.  \n  \nGesù è risorto come aveva promesso,  \nvenite, cantiamo al Signore.  \nLa morte è stata sconfitta,  \nnella vittoria sua viviam, alleluia! (RIT) \n  \nGesù ha cambiato la paura in letizia,  \nvenite, cantiamo al Signore.  \nCon lui vivremo in eterno,  \nnella salvezza sua speriam, alleluia! (RIT) \n  \nGesù è Parola vivente del Padre,   \n\nvenite, cantiamo al Signore.  \nIl suo Spirito effonde,  \nnella sua pace dimoriam, alleluia!',s:'la nostra lode innalziamo la nostra lode innalziamo a cristo facciamo festa esultiamo in lui con gioia grande acclamiamo al risorto alleluia alleluia la nostra lode innalziamo a cristo facciamo festa esultiamo in lui con gioia grande acclamiamo al risorto alleluia gesu e risorto come aveva promesso venite cantiamo al signore la morte e stata sconfitta nella vittoria sua viviam alleluia rit gesu ha cambiato la paura in letizia venite cantiamo al signore con lui vivremo in eterno nella salvezza sua speriam alleluia rit gesu e parola vivente del padre venite cantiamo al signore il suo spirito effonde nella sua pace dimoriam alleluia 335',type:'N',i:367},
{n:'336',t:'MI AFFIDO A TE',c:'Come la cerva anela ai corsi d\'acqua  \ncosì il mio cuore cerca te.  \nL\'anima mia ha sete del Dio vivente,  \nil Dio della speranza.  \nVieni e manda la tua luce sui miei passi,  \nvieni e guida il mio cammino.  \n  \nMI AFFIDO A TE  \nGESÙ,  \nALLA TUA FEDELTÀ,  \nTU SEI IL SOLE CHE RISCHIARA  \nLE MIE TENEBRE.  \nMI AFFIDO A TE GESÙ  \nE IN TE RIPOSERÒ   \nPERCHÉ SO CHE LA MIA VITA  \nTU RINNOVERAI.  \n  \nOggi io vengo davanti  \nal tuo altare per adorare te, Signor.  \nNelle tue mani depongo  \ntutti gli affanni ed ogni mio dolore.  \nVieni e manda la tua luce sui miei passi,  \nvieni e guida il mio cammino. (RIT)',s:'mi affido a te come la cerva anela ai corsi d acqua cosi il mio cuore cerca te l anima mia ha sete del dio vivente il dio della speranza vieni e manda la tua luce sui miei passi vieni e guida il mio cammino mi affido a te gesu alla tua fedelta tu sei il sole che rischiara le mie tenebre mi affido a te gesu e in te riposero perche so che la mia vita tu rinnoverai oggi io vengo davanti al tuo altare per adorare te signor nelle tue mani depongo tutti gli affanni ed ogni mio dolore vieni e manda la tua luce sui miei passi vieni e guida il mio cammino rit 336',type:'N',i:368},
