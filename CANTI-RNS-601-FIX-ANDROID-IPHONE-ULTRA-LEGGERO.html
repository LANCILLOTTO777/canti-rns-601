{n:'486',t:'IO VENGO A TE',c:'Io vengo a te per adorarti Gesù,  \nper contemplare il tuo splendor.  \n\nMi prostro a te per darti gloria mio Re,  \nper esaltare il nome tuo.  \nVoglio fare spazio alla tua grazia  \nper rinascere a vita nuova.  \n  \nLE MIE MANI ELEVO A TE,  \nRICONOSCO CHE SEI IL MIO RE.  \nNON C\'E\' DIO CHE E\' PARI A TE   SIGNOR,  \nIL TUO NOME SALVA  \nMIO SIGNORE E MIO DIO.  \n  \nIo vengo a te per adorarti Gesù, \nper contemplare il tuo splendor.  \nCon i fratelli membra del corpo tuo,  \nio vivo il tuo perdono in me.  \nCon la tua parola m\'istruisci  \ncol tuo Spirito mi guidi al Padre.  \n \nLE MIE MANI ELEVO A TE,  \nRICONOSCO CHE SEI IL MIO RE.  \nNON C\'E\' DIO CHE E\' PARI A TE SIGNOR,  \nIL TUO NOME SALVA  \nMIO SIGNORE.  \n \nLE MIE MANI ELEVO A TE,  \nRICONOSCO CHE SEI IL MIO RE.  \nNON C\'E\' DIO CHE E\' PARI A TE SIGNOR,  \nIL TUO NOME SALVA  \nMIO SIGNORE E MIO DIO. \n \n(stacco musicale)  \n \nNON C\'E\' DIO CHE E\' PARI A TE SIGNOR,  \nIL TUO NOME SALVA  \nMIO SIGNORE E MIO DIO, \nMIO DIO.',s:'io vengo a te io vengo a te per adorarti gesu per contemplare il tuo splendor mi prostro a te per darti gloria mio re per esaltare il nome tuo voglio fare spazio alla tua grazia per rinascere a vita nuova le mie mani elevo a te riconosco che sei il mio re non c e dio che e pari a te signor il tuo nome salva mio signore e mio dio io vengo a te per adorarti gesu per contemplare il tuo splendor con i fratelli membra del corpo tuo io vivo il tuo perdono in me con la tua parola m istruisci col tuo spirito mi guidi al padre le mie mani elevo a te riconosco che sei il mio re non c e dio che e pari a te signor il tuo nome salva mio signore le mie mani elevo a te riconosco che sei il mio re non c e dio che e pari a te signor il tuo nome salva mio signore e mio dio stacco musicale non c e dio che e pari a te signor il tuo nome salva mio signore e mio dio mio dio 486',type:'N',i:518},
{n:'487',t:'NON SEI PIU\' TU CHE CERCHI ME',c:'Non sei più tu che cerchi me,  \nma sono io che oggi ho scelto te,  \nio ti darò da bere al cuore mio,  \nun\'acqua viva io ti donerò  \ne come fonte che zampillerà  \nla vita eterna in te sarà.  \n  \n\nVIENI SAMARITANA,  \nBEVI SAMARITANA  \nCREDI SAMARITANA,  \nMI ADORERAI IN SPIRITO E VERITA\'. (x2)  \n  \nNon sei più tu che cerchi me,  \nma sono io che oggi ho scelto te,  \nConoscerai un nuovo amore che  \nnon si consuma, ti disseterà,  \nio che ti parlo sono il tuo Messia  \nse crederai la vita eterna in te sarà.  \n \n(RIT) \n \nVIENI SAMARITANA, (VIENI) \nBEVI SAMARITANA   (VIENI) \nCREDI SAMARITANA,  \nMI ADORERAI IN SPIRITO E VERITA\'. \n \nVIENI SAMARITANA,  \nBEVI SAMARITANA  \nCREDI SAMARITANA,  \nMI ADORERAI IN SPIRITO E VERITA\' \nMI ADORERAI IN SPIRITO E VERITA\' \nMI ADORERAI IN SPIRITO E VERITA\'.',s:'non sei piu tu che cerchi me non sei piu tu che cerchi me ma sono io che oggi ho scelto te io ti daro da bere al cuore mio un acqua viva io ti donero e come fonte che zampillera la vita eterna in te sara vieni samaritana bevi samaritana credi samaritana mi adorerai in spirito e verita x2 non sei piu tu che cerchi me ma sono io che oggi ho scelto te conoscerai un nuovo amore che non si consuma ti dissetera io che ti parlo sono il tuo messia se crederai la vita eterna in te sara rit vieni samaritana vieni bevi samaritana vieni credi samaritana mi adorerai in spirito e verita vieni samaritana bevi samaritana credi samaritana mi adorerai in spirito e verita mi adorerai in spirito e verita mi adorerai in spirito e verita 487',type:'N',i:519},
{n:'488',t:'SE INNALZO GLI OCCHI',c:'Se innalzo gli occhi a contemplare le tue opere  \nche cosa è un uomo perchè te ne dia pensiero  \nma tu ci hai fatto poco meno dei tuoi angeli,  \nmio Signore,  \ntutto il creato gioisce e racconta le tue meraviglie.  \n  \nDIO DELL\'UNIVERSO  \nTUTTO VIVE DELLA TUA MISERICORDIA  \nLA TERRA E IL CIELO CANTANO AL TUO NOME  \nPER SEMPRE.  \nDIO STUPENDO  \nNEL TUO FIGLIO HAI DONATO AL MONDO LA SAVEZZA,  \nLA PAROLA DI UN AMORE VERO, ETERNO.  \n  \nTi benedicano coloro che ti amano  \nogni vivente canti sempre la tua lode.  \nTi diano gloria sulla terra le tue opere,  \nmio Signore  \n\ntutto il creato gioisce e racconte le tue meraviglie.  \n \n(RIT) \n  \nVero Dio, vero uomo,  \nchi è pari a te.  \nVera vita, vero amore  \nper l\'eternità.  \n \nDIO DELL\'UNIVERSO  \nTUTTO VIVE DELLA TUA MISERICORDIA  \nLA TERRA E IL CIELO CANTANO AL TUO NOME  \nPER SEMPRE.  \nDIO STUPENDO  \nNEL TUO FIGLIO HAI DONATO AL MONDO LA SAVEZZA,  \nLA PAROLA DI UN AMORE VERO, ETERNO, \nETERNO, ETERNO, ETERNO, ETERNO.  \n \nDIO STUPENDO  \nNEL TUO FIGLIO HAI DONATO AL MONDO LA SAVEZZA,  \nLA PAROLA DI UN AMORE VERO, ETERNO.',s:'se innalzo gli occhi se innalzo gli occhi a contemplare le tue opere che cosa e un uomo perche te ne dia pensiero ma tu ci hai fatto poco meno dei tuoi angeli mio signore tutto il creato gioisce e racconta le tue meraviglie dio dell universo tutto vive della tua misericordia la terra e il cielo cantano al tuo nome per sempre dio stupendo nel tuo figlio hai donato al mondo la savezza la parola di un amore vero eterno ti benedicano coloro che ti amano ogni vivente canti sempre la tua lode ti diano gloria sulla terra le tue opere mio signore tutto il creato gioisce e racconte le tue meraviglie rit vero dio vero uomo chi e pari a te vera vita vero amore per l eternita dio dell universo tutto vive della tua misericordia la terra e il cielo cantano al tuo nome per sempre dio stupendo nel tuo figlio hai donato al mondo la savezza la parola di un amore vero eterno eterno eterno eterno eterno dio stupendo nel tuo figlio hai donato al mondo la savezza la parola di un amore vero eterno 488',type:'N',i:520},
{n:'489',t:'SPIRITO SANTO, DOLCE PRESENZA',c:'SPirito Santo, dolce presenza  \nvieni a fonderci con la tua volontà  \nConsolatore, luce del cuore  \nsoffia la tua vita dentro noi  \ninebriaci di te, del tuo amore.  \n  \nSPIRITO SANTO, SPIRITO DI GESU\'  \nADESSO TU MANDA NOI AD INFIAMMARE LA TERRA.  \nSPIRITO SANTO, RENDICI UNO IN TE  \nUSACI COME VUOI, CON LA TUA GRAZIA.  \n  \nSpirito Santo testimone celeste  \ndonaci sapienza e verità.  \nPromessa del Padre, sorgente di grazia  \nvieni a dimorare dentro noi  \niniebriaci di te, del tuo amore. (RIT)  \n  \nScendi su di noi,  \nscendi su di noi  \ntu che sei l\'Eterno (4v)   \n\nL\'Eterno.  \n  \nSPIRITO SANTO, SPIRITO DI GESU\'  \nMUOVITI DENTRO NOI   \nPER RINNOVARE LA TERRA  \nSPIRITO SANTO, RENDICI UNO IN TE,  \nUSACI COME VUOI, USACI COME VUOI,   \nSPIRITO SANTO.',s:'spirito santo dolce presenza spirito santo dolce presenza vieni a fonderci con la tua volonta consolatore luce del cuore soffia la tua vita dentro noi inebriaci di te del tuo amore spirito santo spirito di gesu adesso tu manda noi ad infiammare la terra spirito santo rendici uno in te usaci come vuoi con la tua grazia spirito santo testimone celeste donaci sapienza e verita promessa del padre sorgente di grazia vieni a dimorare dentro noi iniebriaci di te del tuo amore rit scendi su di noi scendi su di noi tu che sei l eterno 4v l eterno spirito santo spirito di gesu muoviti dentro noi per rinnovare la terra spirito santo rendici uno in te usaci come vuoi usaci come vuoi spirito santo 489',type:'N',i:521},
{n:'490',t:'VIENI IN NOI',c:'VIENI IN NOI, VIENI IN NOI  \nSPIRITO D\'AMOR.  \nVIENI IN NOI, VIENI IN NOI  \nSPIRITO D\'AMOR.  \n  \nTu sei dono di Dio,  \no Santo Spirito,  \ndalla croce hai manifestato l\'amor.  \nNoi apriamo ancora il nostro cuor,  \nriempilo di te.  (RIT) \n \n \nDella Chiesa tu sei la vera anima, \nsei la luce di chi ha smarrito la via. \nNoi apriamo ancora il nostro cuor, \nriempilo di te. (RIT) \n \nSei la fortezza per noi,  \no Santo Spirito, \nla sapienza ci dai  \ned il timor di Dio. \nSei consiglio per noi,  \no Santo Spirito, \nintelletto, scienza e pietà. \n \nVIENI IN NOI, VIENI IN NOI  \nSPIRITO D\'AMOR.  \nVIENI IN NOI, VIENI IN NOI  \nSPIRITO D\'AMOR.    (x3) \n \nVIENI IN NOI, VIENI IN NOI  \nSPIRITO D\'AMOR.',s:'vieni in noi vieni in noi vieni in noi spirito d amor vieni in noi vieni in noi spirito d amor tu sei dono di dio o santo spirito dalla croce hai manifestato l amor noi apriamo ancora il nostro cuor riempilo di te rit della chiesa tu sei la vera anima sei la luce di chi ha smarrito la via noi apriamo ancora il nostro cuor riempilo di te rit sei la fortezza per noi o santo spirito la sapienza ci dai ed il timor di dio sei consiglio per noi o santo spirito intelletto scienza e pieta vieni in noi vieni in noi spirito d amor vieni in noi vieni in noi spirito d amor x3 vieni in noi vieni in noi spirito d amor 490',type:'N',i:522},
{n:'491',t:'ADONAI',c:'Adonay \'ôrî veyish\'î, mimmî \'ira\'? \nAdonay ma\'oz chayyay, mimmî \'efchad? \nAdonay \'ôrî veyish\'î, mimmî \'ira\'? \nAdonay ma\'oz chayyay, mimmî \'efchad? \n \nSpero in te, Signor, mi si rinfranca il cuor \nvivo nel tuo amor! \n \nIL SIGNORE È MIA LUCE E SALVEZZA, \nDI CHI AVRÒ TIMOR? \nIL SIGNORE È MIA FORZA DI VITA \nDI CHI AVRÒ TERROR? \nIL SIGNORE È MIA LUCE E SALVEZZA \nDI CHI AVRÒ TIMOR? \nIL SIGNORE È MIA FORZA DI VITA \nDI CHI AVRÒ TERROR? \n \nSpero in te, Signor, mi si rinfranca il cuor \nvivo nel tuo amor! \n \nAdonay \'ôrî veyish\'î, mimmî \'ira\'? \nAdonay ma\'oz chayyay, mimmî \'efchad? \n \nDice di te il mio cuor \ncercate il volto suo! \nIl tuo volto io cerco Signor! \nDice di te il mio cuor \ncercate il volto suo! \nIl tuo volto io cerco Signor! \nDice di te il mio cuor \ncercate il volto suo! \nil tuo volto io cerco Signor!',s:'adonai adonay ori veyish i mimmi ira adonay ma oz chayyay mimmi efchad adonay ori veyish i mimmi ira adonay ma oz chayyay mimmi efchad spero in te signor mi si rinfranca il cuor vivo nel tuo amor il signore e mia luce e salvezza di chi avro timor il signore e mia forza di vita di chi avro terror il signore e mia luce e salvezza di chi avro timor il signore e mia forza di vita di chi avro terror spero in te signor mi si rinfranca il cuor vivo nel tuo amor adonay ori veyish i mimmi ira adonay ma oz chayyay mimmi efchad dice di te il mio cuor cercate il volto suo il tuo volto io cerco signor dice di te il mio cuor cercate il volto suo il tuo volto io cerco signor dice di te il mio cuor cercate il volto suo il tuo volto io cerco signor 491',type:'N',i:523},
{n:'492',t:'ANDIAMO NEL MONDO',c:'Nella storia di ogni uomo sei venuto tu, \nNoi con gioia ti accogliamo, resta in mezzo a noi. \nDi te vogliamo parlar, a te vogliam cantar \nservire quelli che ci metti accanto. \nPortar la libertà, portar la verità, \ncosì strumenti tuoi saremo noi \n \nOH OH OH, OH OH OH \nANDIAMO NEL MONDO ANNUNCIANDO IL TUO AMOR \nOH OH OH, OH OH OH \nANDIAMO NEL MONDO VIVENDO IL TUO AMOR \n\nOH OH OH, OH OH OH \nANDIAMO NEL MONDO LODANDO IL TUO AMOR \nLODANDO IL TUO AMOR \n \n \nDalla morte sei risorto ed ora tu sei qui, \nnoi con fede lo gridiam che vivo sei Gesù. \nDi te vogliamo parlar, a te vogliam cantar \nservire quelli che ci metti accanto. \nPortar la libertà, portar la verità \ncosì strumenti tuoi saremo noi. \n \n(RIT) \n \n \nNella vita di ogni giorno luce sei per noi,  \ntu ci chiami, tu ci mandi, eccoci Signor \nDi te vogliamo parlar, a te vogliam cantar \nServire quelli che ci metti accanto \nportar la libertà, portar la verità \nCosì strumenti tuoi saremo noi \n \n(RIT) \n \nOh, oh oh oh, oh oh oh \nOh, oh oh oh, oh oh oh \nOh, oh oh oh, oh oh oh \nSei vivo, sei vivo,  \nSignore Gesù (RIT)',s:'andiamo nel mondo nella storia di ogni uomo sei venuto tu noi con gioia ti accogliamo resta in mezzo a noi di te vogliamo parlar a te vogliam cantar servire quelli che ci metti accanto portar la liberta portar la verita cosi strumenti tuoi saremo noi oh oh oh oh oh oh andiamo nel mondo annunciando il tuo amor oh oh oh oh oh oh andiamo nel mondo vivendo il tuo amor oh oh oh oh oh oh andiamo nel mondo lodando il tuo amor lodando il tuo amor dalla morte sei risorto ed ora tu sei qui noi con fede lo gridiam che vivo sei gesu di te vogliamo parlar a te vogliam cantar servire quelli che ci metti accanto portar la liberta portar la verita cosi strumenti tuoi saremo noi rit nella vita di ogni giorno luce sei per noi tu ci chiami tu ci mandi eccoci signor di te vogliamo parlar a te vogliam cantar servire quelli che ci metti accanto portar la liberta portar la verita cosi strumenti tuoi saremo noi rit oh oh oh oh oh oh oh oh oh oh oh oh oh oh oh oh oh oh oh oh oh sei vivo sei vivo signore gesu rit 492',type:'N',i:524},
{n:'493',t:'COME UN FIUME D\'ACQUA VIVA',c:'Come un fiume d\'acqua viva, come vino nuovo, \ncome balsamo d\'amore, vieni \nSanto Spirito del Padre, dono senza fine \nvieni e regna su di noi, vieni. \n \nVIENI SPIRITO D\'AMOR, DIO CONSOLATORE \nVIENI E BATTEZZACI NEL TUO AMORE. \nVIENI SPIRITO D\'AMOR, VITA CHE DÀ VITA \nVIENI E REGNA SU DI NOI, NEL TUO AMORE. \nVIENI, VIENI (NEL TUO AMORE) \nVIENI, VIENI. \n \nDona luce nel peccato, fede nella prova. \n\nCome crisma di salvezza, vieni. \nForza di resurrezione e di vita nuova, \nvieni e soffia su di noi, vieni. \n \n(RIT) \n \nVieni, vieni, \nvieni, vieni, \nvieni. \n \nVIENI SPIRITO D\'AMOR, DIO CONSOLATORE \nVIENI E BATTEZZACI NEL TUO AMORE. \nVIENI SPIRITO D\'AMOR, VITA CHE DÀ VITA \nVIENI E REGNA SU DI NOI, NEL TUO AMORE. \nVIENI, VIENI (NEL TUO AMORE) \nVIENI, VIENI.',s:'come un fiume d acqua viva come un fiume d acqua viva come vino nuovo come balsamo d amore vieni santo spirito del padre dono senza fine vieni e regna su di noi vieni vieni spirito d amor dio consolatore vieni e battezzaci nel tuo amore vieni spirito d amor vita che da vita vieni e regna su di noi nel tuo amore vieni vieni nel tuo amore vieni vieni dona luce nel peccato fede nella prova come crisma di salvezza vieni forza di resurrezione e di vita nuova vieni e soffia su di noi vieni rit vieni vieni vieni vieni vieni vieni spirito d amor dio consolatore vieni e battezzaci nel tuo amore vieni spirito d amor vita che da vita vieni e regna su di noi nel tuo amore vieni vieni nel tuo amore vieni vieni 493',type:'N',i:525},
{n:'494',t:'DI\' SOLTANTO UNA PAROLA',c:'Di\' soltanto una parola  \ne il mio cuore rivivrà. \nIl tuo nome è santo,  \ngioia del mio canto \nconfido in te, in ogni tempo. \n \nSe io tocco il tuo mantello,  \nla tua grazia in me sarà. \nIl tuo nome è santo,  \ngioia del mio canto \nconfido in te, in ogni tempo. \n \nSEI TUTTA LA MIA SPERANZA, NON TEMERÒ \nESULTO ALLA TUA PRESENZA PER IL TUO AMOR \nMI BASTA LA TUA GRAZIA, DI\' SOLTANTO \nUNA PAROLA, SIGNORE, E GUARITO SARÒ \nGESÙ, SEI TUTTA LA MIA SPERANZA, NON TEMERÒ \nESULTO ALLA TUA PRESENZA PER IL TUO AMOR \nMI BASTA LA TUA GRAZIA, TU DÌ SOLTANTO \nUNA PAROLA, GESÙ. \n \nOggi ascolto la tua voce  \ne cammino verso te  \nIl tuo nome è santo  \ngioia del mio canto  \nconfido in te, in ogni tempo. (RIT) \n \n\nSei tu, speranza \nGesù per sempre \nSei tu, salvezza \nGesù, mio Signor \n \n \nGESÙ, SEI TUTTA LA MIA SPERANZA, NON TEMERÒ \nGESÙ, ESULTO ALLA TUA PRESENZA  \nGESÙ, MI BASTA LA TUA GRAZIA,  \nDI\' SOLTANTO UNA PAROLA, SIGNORE, E GUARITO SARÒ. \nGESÙ, SEI TUTTA LA MIA SPERANZA,  \nGESÙ, ESULTO ALLA TUA PRESENZA  \nGESÙ, MI BASTA LA TUA GRAZIA,  \nTU DÌ SOLTANTO UNA PAROLA, GESÙ, GESÙ.  \nDÌ SOLTANTO UNA PAROLA, GESÙ.',s:'di soltanto una parola di soltanto una parola e il mio cuore rivivra il tuo nome e santo gioia del mio canto confido in te in ogni tempo se io tocco il tuo mantello la tua grazia in me sara il tuo nome e santo gioia del mio canto confido in te in ogni tempo sei tutta la mia speranza non temero esulto alla tua presenza per il tuo amor mi basta la tua grazia di soltanto una parola signore e guarito saro gesu sei tutta la mia speranza non temero esulto alla tua presenza per il tuo amor mi basta la tua grazia tu di soltanto una parola gesu oggi ascolto la tua voce e cammino verso te il tuo nome e santo gioia del mio canto confido in te in ogni tempo rit sei tu speranza gesu per sempre sei tu salvezza gesu mio signor gesu sei tutta la mia speranza non temero gesu esulto alla tua presenza gesu mi ba {n:'498',t:'MANO POTENTE',c:'Ecco la mano potente che ci salverà \ndal nemico e dall\'oppressore \nEcco l\'amore perfetto che libererà \ni cuori che sperano in lui \n\n \nEcco, viene a noi la sua fedeltà \nscudo contro ogni tempesta sarà \nCanta insieme a noi nella verità \nnon siamo più schiavi \n \nNON CI DIMENTICHERÀ,  \nSIAMO IL SUO POPOLO, CI GUARIRÀ \nAL CIELO ALZIAMO LE MANI,  \nNON SIAMO SOLI,  \nDIO È QUI, NON CI ABBANDONA \nNOSTRO CUSTODE SARÀ,  \nCONTRO LE TENEBRE RISPLENDERÀ \nIL SOLE DELLA GIUSTIZIA,  \nLA SUA LUCE SPLENDERÀ \nSPLENDERÀ. \n \nSe non avremo una terra in cui abitar \nDio la nostra terra sarà \nSe non avremo una strada su cui camminar \nper noi la sua via traccerà. \nEcco, viene a noi la sua fedeltà \nscudo contro ogni tempesta sarà. \nCanta insieme a noi nella verità \nnon siamo più schiavi. (RIT) \n \nSIAMO IL SUO POPOLO, CI GUARIRÀ \nAL CIELO ALZIAMO LE MANI,  \nNON SIAMO SOLI,  \nDIO È QUI, NON CI ABBANDONA \nNOSTRO CUSTODE SARÀ,  \nCONTRO LE TENEBRE RISPLENDERÀ \nIL SOLE DELLA GIUSTIZIA,  \nLA SUA LUCE SPLENDERÀ \nLA SUA LUCE SPLENDERÀ \n \nNON CI DIMENTICHERÀ,  \nSIAMO IL SUO POPOLO, CI GUARIRÀ \nAL CIELO ALZIAMO LE MANI,  \nNON SIAMO SOLI,  \nDIO È QUI, NON CI ABBANDONA \nNOSTRO CUSTODE SARÀ,  \nCONTRO LE TENEBRE RISPLENDERÀ \nIL SOLE DELLA GIUSTIZIA,  \nLA SUA LUCE SPLENDERÀ \nSPLENDERÀ.',s:'mano potente ecco la mano potente che ci salvera dal nemico e dall oppressore ecco l amore perfetto che liberera i cuori che sperano in lui ecco viene a noi la sua fedelta scudo contro ogni tempesta sara canta insieme a noi nella verita non siamo piu schiavi non ci dimentichera siamo il suo popolo ci guarira al cielo alziamo le mani non siamo soli dio e qui non ci abbandona nostro custode sara contro le tenebre risplendera il sole della giustizia la sua luce splendera splendera se non avremo una terra in cui abitar dio la nostra terra sara se non avremo una strada su cui camminar per noi la sua via traccera ecco viene a noi la sua fedelta scudo {n:'499',t:'MI PERDO NEL TUO AMORE',c:'Tu sei la mia pace,  \ntu sei la vera gioia, \ntu sei il Signor. \nTu sei la mia speranza,  \ntu sei la mia salvezza, \ntu sei il Signor. \n \nED IO MI PERDO NEL TUO AMOR, \nGUARDANDO LA TUA SANTITÀ. \nUN CANTO NUOVO NASCE \nE L\'UOMO VECCHIO MUORE. \nRISPLENDO DELLA GRAZIA TUA, \nMl PERDO NEL TUO AMORE. \n \nResta con me per sempre, \nil mondo mi delude,  \ntu sei il Signor. \nIl mio cuore arde  \nse ascolto la tua voce,  \ntu sei il Signor. \n \nED IO MI PERDO NEL TUO AMOR, \nGUARDANDO LA TUA SANTITÀ. \nUN CANTO NUOVO NASCE \nE L\'UOMO VECCHIO MUORE. \nRISPLENDO DELLA GRAZIA TUA, \nMl PERDO NEL TUO AMORE. \n \nSei il vivente, tu sei il Cristo, \nti riconosco tu sei il Santo, \nlode, gloria, onore a te, \nlode, gloria, onore a te. \nSei il vivente, tu sei il Cristo, \nti riconosco tu sei il Santo, \nlode, gloria, onore a te, \nlode, gloria, onore a te. \n \nED IO MI PERDO NEL TUO AMOR, \nGUARDANDO LA TUA SANTITÀ. \nUN CANTO NUOVO NASCE \nE L\'UOMO VECCHIO MUORE. \nRISPLENDO DELLA GRAZIA TUA, \nMI PERDO NEL TUO AMORE, \nMI PERDO NEL TUO AMORE, \n\nMI PERDO NEL TUO AMORE, \nGESÙ, GESÙ',s:'mi perdo nel tuo amore tu sei la mia pace tu sei la vera gioia tu sei il signor tu sei la mia speranza tu sei la mia salvezza tu sei il signor ed io mi perdo nel tuo amor guardando la tua santita un canto nuovo nasce e l uomo vecchio muore risplendo della grazia tua ml perdo nel tuo amore resta con me per sempre il mondo mi delude tu sei il signor il mio cuore arde se ascolto la tua voce tu sei il signor ed io mi perdo nel tuo amor guardando la tua santita un canto nuovo nasce e l uomo vecchio muore risplendo della grazia tua ml perdo nel tuo amore sei il vivente tu sei il cristo ti riconosco tu sei il santo lode gloria onore a te lode gloria onore a te sei il vivente tu sei il cristo ti riconosco tu sei il santo lode gloria onore a te lode gloria onore a te ed io mi perdo nel tuo amor guardando la tua santita un canto nuovo nasce e l uomo vecchio muore risplendo della grazia tua mi perdo nel tuo amore mi perdo nel tuo amore mi perdo nel tuo amore gesu gesu 499',type:'N',i:531},
{n:'500',t:'NEL TUO NOME',c:'Tu sei il mio Dio, dall\'aurora ti cerco, \nl\'anima mia ha sete di te, anela a te la mia carne. \nCosì ti ho cercato nel tuo santuario \nper contemplare la gloria tua e la tua regalità, \na te si stringe l\'anima mia, \nsei tu che mi sostieni, ti loderà la mia bocca. \n \nNEL TUO NOME LE MIE MANI INNALZERÒ, \nPOICHÉ LA TUA GRAZIA VALE PIÙ DI OGNI ALTRA COSA. \nCON VOCI DI GIOIA SEMPRE TI BENEDIRÒ, \nFINCHÉ IO VIVO LE MIE LABBRA DIRANNO LA TUA LODE. \n \nNel mio giaciglio di te mi ricordo, \nnelle veglie notturne io penso a te che sei stato il mio aiuto. \nCosì ti ho cercato nel tuo santuario \nper contemplare la gloria tua e la tua regalità, \nall\'ombra delle ali tue \nesulterò di gioia, ti loderà la mia bocca. \n \n(RIT) \n \nCome terra deserta tu mi sazierai \nalla tua mensa, Signore. \nCome terra deserta mi ricolmerai \ndella tua presenza e gioirò per sempre. \n \nNEL TUO NOME LE MIE MANI INNALZERÒ, \nPOICHÉ LA TUA GRAZIA VALE PIÙ DI OGNI ALTRA COSA. \nCON VOCI DI GIOIA SEMPRE TI BENEDIRÒ, \nFINCHÉ IO VIVO LE MIE LABBRA DIRANNO LA TUA LODE. \nE TI BENEDIRÒ FINCHÉ 10 VIVO, \nLE MIE LABBRA DIRANNO LA TUA LODE. \nE TI BENEDIRÒ FINCHÉ IO VIVO, \nLE MIE LABBRA DIRANNO LA TUA LODE.',s:'nel tuo nome tu sei il mio dio dall aurora ti cerco l anima mia ha sete di te anela a te la mia carne cosi ti ho cercato nel tuo santuario per contemplare la gloria tua e la tua regalita a te si stringe l anima mia sei tu che mi sostieni ti lodera la mia bocca nel tuo nome le mie mani innalzero poiche la tua grazia vale piu di ogni altra cosa con voci di gioia sempre ti benediro finche io vivo le mie labbra diranno la tua lode nel mio giaciglio di te mi ricordo nelle veglie notturne io penso a te che sei stato il mio aiuto cosi ti ho cercato nel tuo santuario per contemplare la gloria tua e la tua regalita all ombra delle ali tue esultero di gioia ti lodera la mia bocca rit come terra deserta tu mi sazierai alla tua mensa signore come terra deserta mi ricol {n:'501',t:'SIA GLORIA',c:'Dal cielo si udrà lo lode per te \ne tutto il creato ti proclamerò: \n\nSanto, Santo, Santo. \n \nIl popolo tuo esalto il tuo nom, \ntu sei il Signor e regni fra noi, \nSanto, Santo, Santo. \n \nEgli è il Re, degno di lode e di onor, \nè il nostro Dio, lui solo ci salverà. \n \nSIA GLORIA, POTENZA, ONORE A TE, SIGNOR. (x2) \n \nDal cielo si udrà lo lode per le \ne tutto il creolo ti proclamerà: \nSanto, Santo, San - to. \n \nIl popolo tuo esalta il tuo nom, \ntu sei il Signor e regni fra noi, \nSanto, Santo, Santo. \n \nEgli è il Re, degno di lode e di onor, \nè il nostro Dio, Lui solo ci salverà. \n \nOh, oh, oh, oh. \n \nSIA GLORIA, POTENZA, ONORE A TE, SIGNOR. (x4) \n \nA te cantiam, ti proclamiam, gloria e onore noi ti diam. (x6) \n \nSIA GLORIA, POTENZA, ONORE A TE, SIGNOR. (x4)',s:'sia gloria dal cielo si udra lo lode per te e tutto il creato ti proclamero santo santo santo il popolo tuo esalto il tuo nom tu sei il signor e regni fra noi santo santo santo egli e il re degno di lode e di onor e il nostro dio lui solo ci salvera sia gloria potenza onore a te signor x2 dal cielo si udra lo lode per le e tutto il creolo ti proclamera santo santo san to il popolo tuo esalta il tuo nom tu sei il signor e regni fra noi santo santo santo egli e il re degno di lode e di onor e il nostro dio lui solo ci salvera oh oh oh oh sia gloria potenza onore a te signor x4 a te cantiam ti proclamiam gloria e onore noi ti diam x6 sia gloria potenza onore a te signor x4 501',type:'N',i:533},
{n:'502',t:'SO CHE TU MI SALVERAI',c:'Le braccia stese sulla croce, \nil sangue di Gesù per me. \nChi mi darà lo stesso amore eterno, \nchi mai per me risorgerà! \n \nServo di ogni uomo, Re d\'immenso gloria, \nio proclamo te, riconosco te, o mio Gesù. \n \nIO SO CHE TU Ml SALVERAI \nDAL MALE CHE NON VINCE MAI, \nAMORE CHE NON SI CONSUMA. \nIO CREDO CHE Ml SALVERAI, \nUN CUORE APERTO SEI, \nSQUARCIATO \n\nD\'AMORE TU, \nOFFERTO AL MONDO. \n \nPercosso a morte ed umiliato, \nferito amore, amante sei, \ntu porta santa per il cielo eterno, \naurora che non passerà. \n \nServo di ogni uomo, Re d\'immensa gloria, \nio proclamo te, riconosco te, o mio Gesù. (RIT) \n \nIO SO CHE TU Ml SALVERAI \nDAL MALE CHE NON VINCE MAI, \nAMORE CHE NON SI CONSUMA. \nIO CREDO CHE Ml SALVERAI, \nUN CUORE APERTO SEI, \nSQUARCIATO D\'AMORE TU, \nOFFERTO AL MONDO, TU SEI IL MIO VANTO. \n \nL\'amore di Dio s\'è fatto carne \nper poterlo abbracciare in te, Gesù. \nL\'Altissimo Dio s\'è fatto uomo \nper poterlo guardare in te, Gesù \n \nIO SO CHE TU Ml SALVERAI \nDAL MALE CHE NON VINCE MAI, \nAMORE CHE NON SI CONSUMA. \nIO CREDO CHE Ml SALVERAI, \nUN CUORE APERTO SEI, \nSQUARCIATO D\'AMORE TU, \nOFFERTO AL MONDO (x2) \n \n(Seconda volta) \nOFFERTO AL MONDO.',s:'so che tu mi salverai le braccia stese sulla croce il sangue di gesu per me chi mi dara lo stesso amore eterno chi mai per me risorgera servo di ogni uomo re d immenso gloria io proclamo te riconosco te o mio gesu io so che tu ml salverai dal male che non vince mai amore che non si consuma io credo che ml salverai un cuore aperto sei squarciato d amore tu offerto al mondo percosso a morte ed umiliato ferito amore amante sei tu porta santa per il cielo eterno aurora che non passera servo di ogni uomo re d immensa gloria io proclamo te riconosco te o mio gesu rit io so che tu ml salverai dal male che non vince mai amore che non si consuma io credo che ml salverai un cuore aperto sei squarciato d amore tu offerto al mondo tu sei il mio vanto l amore di dio s e fatto carne per poterlo abbracciare in te gesu l altissimo dio s e fatto uomo per poterlo guardare in te gesu io so che tu ml salverai dal male che non vince mai amore che non si consuma io credo che ml salverai un cuore aperto sei squarciato d amore tu offerto al mondo x2 seconda volta offerto al mondo 502',type:'N',i:534},
{n:'503',t:'ANIMA MIA LODA IL SIGNORE',c:'Anima mia loda il Signor,  \nconfida solo in chi ti salverà. \nÈ Dio che il male sconvolgerà, \nla mia speranza solo in Dio  \nio fonderò per sempre, \nlui sarà per sempre. \n \nMi rialzerà quando cadrò,  \nnella sua mano io riposerò. \nÈ lui che salva chi crederà, ‘ \n\nla mia speranza solo in lui  \nio fonderò per sempre, \nluì sarà con me sempre. \n \nIO TI RENDO GRAZIE, DIO, \nFINCHÉ AVRÒ VITA DIRÒ \nMIO LIBERATORE SEI. \nLA FEDELTÀ DEL MIO RE  \nDURERÀ SEMPRE PER ME. \n \nAnima mia loda il Signor,  \nè lui che i giusti ricompenserà. \nSul mondo intero lui regnerà, \nla mia speranza solo in Dio  \nio fonderò per sempre, \nluì sarà con me sempre. \n \nIO TI RENDO GRAZIE, DIO, \nFINCHÉ AVRÒ VITA DIRÒ \nMIO LIBERATORE SEI. \nOGNI VITTORIA È SOLO IN TE. \n \nDio resterà, ci rialzerà, ci guarirà, ci sfamerà. \nDio resterà, ci rialzerà, ci guarirà, ci sfamerà. \nDio resterà, ci rialzerà, cì guarirà, ci sfamerà. \nDio resterà sempre. \n \nIO TI RENDO GRAZIE, GRAZIE, DIO, \nFINCHÉ AVRÒ VITA DIRÒ \nMIO LIBERATORE SEI, \nOGNI VITTORIA È SOLO IN TE. \n \nFINCHÉ AVRÒ VITA DIRÒ \nMIO LIBERATORE SEI, \nLA TUA SALVEZZA È PER ME. \nPER ME, PER ME. (PER ME) \nPER ME, PER ME. (PER ME) \nPER ME, PER ME. (PER ME) \nPER ME.',s:'anima mia loda il signore anima mia loda il signor confida solo in chi ti salvera e dio che il male sconvolgera la mia speranza solo in dio io fondero per sempre lui sara per sempre mi rialzera quando cadro nella sua mano io riposero e lui che salva chi credera la mia speranza solo in lui io fondero per sempre lui sara con me sempre io ti rendo grazie dio finche avro vita diro mio liberatore sei la fedelta del mio re durera sempre per me anima mia loda il signor e lui che i giusti ricompensera sul mondo intero lui regnera la mia speranza solo in dio io fondero per sempre lui sara con me sempre io ti rendo grazie dio finche avro vita diro mio liberatore sei ogni vittoria e solo in te dio restera ci rialzera ci guarira ci sfamera dio restera ci rialzera ci guarira ci sfamera dio restera ci rialzera ci guarira ci sfamera dio restera sempre io ti rendo grazie grazie dio finche avro vita diro mio liberatore sei ogni vittoria e solo in te finche avro vita diro mio liberatore sei la tua salvezza e per me per me per me per me per me per me per me per me per me per me per me 503',type:'N',i:535},
{n:'504',t:'AVE DOLCE MARIA',c:'Vergine celeste, gioia del cuor, \nmostraci la strada verso Gesù. \nVergine fedele, scelta da Dio, \nstella del mattino, degna d\'onor. \n\n \nAVE DOLCE MARIA, REGINA DEL CIELO, \nCON FIDUCIA A TE VENIAM. \nCUORE DI MADRE, NOI TI AFFIDIAMO OGNI FRAGILITÀ, \nPERCHÉ TUTTO TU PUOI NEL TUO FIGLIO GESÙ. \nSIAM SICURI CHE TU NON CI DELUDERAI, MARIA, \nINTERCEDI PER NOI, MH, \nINTERCEDI PER NOI, MH. \n \nVergine potente, Madre di Dio, \nil tuo buon consiglio è luce per noi. \nVergine clemente, ricca di grazie, \ntu che sei rifugio del peccator.  \n \n(RIT) \n \n \nMH \n \nPERCHÉ TUTTO TU PUOI NEL TUO FIGLIO GESÙ, \nSIAM SICURI CHE TU NON CI DELUDERAI, MARIA \nINTERCEDI PER NOI, \nINTERCEDI PER NOI.',s:'ave dolce maria vergine celeste gioia del cuor mostraci la strada verso gesu vergine fedele scelta da dio stella del mattino degna d onor ave dolce maria regina del cielo con fiducia a te veniam cuore di madre noi ti affidiamo ogni fragilita perche tutto tu puoi nel tuo figlio gesu siam sicuri che tu non ci deluderai maria intercedi per noi mh intercedi per noi mh vergine potente madre di dio il tuo buon consiglio e luce per noi vergine clemente ricca di grazie tu che sei rifugio del peccator rit mh perche tutto tu puoi nel tuo figlio gesu siam sicuri che tu non ci deluderai maria intercedi per noi intercedi per noi 504',type:'N',i:536},
{n:'505',t:'BENEDICIAMO TE SIGNORE',c:'Benediciamo te Signore \ntutti i giorni della nostra vita. \n \nin ogni tempo noi vivremo \ncon la forza della tua presenza. \n \nTI ESALTEREMO PER SEMPRE SIGNORE, \nTI SEGUIREMO ADORANDO IL TUO NOME, \nGRANDE TU SEI, FAI MERAVIGLIE. \n \nInvocheremo te Signore \ntutti i giorni della nostra vita. \nIn ogni tempo noi vedremo \nla potenza della tua salvezza. \n \nTI ESALTEREMO PER SEMPRE SIGNORE, \nTI SEGUIREMO ADORANDO IL TUO NOME, \nGRANDE TU SEI, FAI MERAVIGLIE. \n \nCanta la terra, si unisce il cielo, ad una voce \n\nannuncia la tua grazia e la tua vittoria \nnella storia, grande Dio sei tu. \n \nTI ESALTEREMO PER SEMPRE SIGNORE, \nTI SEGUIREMO ADORANDO IL TUO NOME, \nGRANDE TU SEI, FAI MERAVIGLIE. \n \nBenediciamo te Signore \ntutti i giorni della nostra vita.',s:'benediciamo te signore benediciamo te signore tutti i giorni della nostra vita in ogni tempo noi vivremo con la forza della tua presenza ti esalteremo per sempre signore ti seguiremo adorando il tuo nome grande tu sei fai meraviglie invocheremo te signore tutti i giorni della nostra vita in ogni tempo noi vedremo la potenza della tua salvezza ti esalteremo per sempre signore ti seguiremo adorando il tuo nome grande tu sei fai meraviglie canta la terra si unisce il cielo ad una voce annuncia la tua grazia e la tua vittoria nella storia grande dio sei tu ti esalteremo per sempre signore ti seguiremo adorando il tuo nome grande tu sei fai meraviglie benediciamo te signore tutti i giorni della nostra vita 505',type:'N',i:537},
{n:'506',t:'CANZONE D\'AMORE',c:'Tu mio Signore, vero Dio, \nsei disceso dal cielo quaggiù. \nHai guarito, liberato, \nmi hai donato la tua eredità. \n \nAdesso ascoltami, \nSignore mio Gesù, \nvoglio innalzare a te... \n \nQUESTA MIA CANZONE D\'AMORE \nSALGA FINO AL CUORE DEL MIO SIGNOR, \nGRIDERÒ FINCHÉ NON GIUNGERÀ ALLE STELLE \nE ANCHE PIÙ SU. \nCANTO LA FOLLIA DEL TUO AMORE, \nSOLO UN\'UTOPIA PER L\'UMANITÀ, \nMA IO CREDO CHE HAI DATO TU \nLA TUA VITA AL POSTO MIO. \nAL POSTO MIO, AL POSTO MIO. \n \nTu osannato, disprezzato, \nhai offerto in silenzio il tuo “sì”. \nHai gioito, hai patito, \nperdonando la mia iniquità. \nAdesso ascoltami, \nSignore fnio Gesù, \nvoglio innalzare a te... \n \n(RIT) \n \nUh. \n \nCANTO LA FOLLIA DEL TUO AMORE \nSOLO UN\'UTOPIA PER LUMANITÀ, \nMA IO CREDO CHE HAI DATO TU \n\nLA TUA VITA AL POSTO MIO. \nAL POSTO MIO \nAL POSTO MIO.',s:'canzone d amore tu mio signore vero dio sei disceso dal cielo quaggiu hai guarito liberato mi hai donato la tua eredita adesso ascoltami signore mio gesu voglio innalzare a te questa mia canzone d amore salga fino al cuore del mio signor gridero finche non giungera alle stelle e anche piu su canto la follia del tuo amore solo un utopia per l umanita ma io credo che hai dato tu la tua vita al posto mio al posto mio al posto mio tu osannato disprezzato hai offerto in silenzio il tuo si hai gioito hai patito perdonando la mia iniquita adesso ascoltami signore fnio gesu voglio innalzare a te rit uh canto la follia del tuo amore solo un utopia per lumanita ma io credo che hai dato tu la tua vita al posto mio al posto mio al posto mio 506',type:'N',i:538},
{n:'507',t:'IO GRIDO A TE SIGNORE',c:'Io grido a te Signore, mio rifugio sei, \nnella terra dei viventi la mia eredità.  \nAnche se l\'angoscia opprime la mia vita \nvoglio fare ogni giorno la tua volontà, Signore. \n \nIO TI PREGO, DONA LA SALVEZZA AI SERVI TUOI, \nIO TI PREGO, DONA LA VITTORIA AI FIGLI TUOI. \nTU SIGNORE DEGLI ESERCITI COMBATTI PER NOI, \nPER LA TUA GIUSTIZIA E LA TUA FEDELTÀ \nVINCERAI. \n \nIo grido a te Signore, mio rifugio sei, \nfai uscire la mia vita dalle tenebre, \nperché io possa cantare grazie a te, mio Dio, \ne gioire dei tuoi beni e della tua bontà, Signore. (RIT) \n \nPer noi vincerai, \nper noi Dio vincerà. \nVincerà per noi. \nÈ Dio e vincerà (vincerà, vincerà, vincerà). \nSì, lui vincerà (vincerà, vincerà, vincerà). \nÈ Dio e vincerà (vincerà, vincerà, vincerà). \nSì, lui vincerà (vincerà, vincerà, vincerà).  \nÈ Dio e vincerà. \n \nIO TI PREGO, DONA LA SALVEZZA AI SERVI TUOI,  \n(SÌ LUI VINCERÀ) \n \nIO TI PREGO, DONA LA VITTORIA Al FIGLI TUOI. \nTU SIGNORE DEGLI ESERCITI COMBATTI PER NOI \nPER LA TUA GIUSTIZIA E LA TUA FEDELTÀ \nTU VINCERAI PER NOI (VINCERAI, VINCERAI), \n \nTU VINCERAI PER NOI (VINCERAI, VINCERAI) \nDIO VINCERÀ.',s:'io grido a te signore io grido a te signore mio rifugio sei nella terra dei viventi la mia eredita anche se l angoscia opprime la mia vita voglio fare ogni giorno la tua volonta signore io ti prego dona la salvezza ai servi tuoi io ti prego dona la vittoria ai figli tuoi tu signore degli eserciti combatti per noi per la tua giustizia e la tua fedelta vincerai io grido a te signore mio rifugio sei fai uscire la mia vita dalle tenebre perche io possa cantare grazie a te mio dio e gioire dei tuoi beni e della tua bonta signore rit per noi vincerai per noi dio vincera vincera per noi e dio e vincera vincera vincera vincera si lui vincera vincera vincera vincera e dio e vincera vincera vincera vincera si lui vincera vincera vincera vincera e dio e vincera io ti prego dona la salvezza ai servi tuoi si lui {n:'508',t:'MUOVI LE MONTAGNE',c:'Verso le mie lacrime ai tuoi piedi, \n\nmio Signore vieni e spezza le catene che mi legano lontano da te. \nTu sei il mio tutto, sola luce del mio volto, \nvero scudo di difesa, canto e la mia mano è tesa verso te. \nSe tu non mi parli, se tu non mi parli, \nda chi andrò Signore? \nSe tu non mi parli amarti mi basta, \nmi basta il tuo sguardo, \nsoccorri il tuo figlio che innalza il suo canto. \n \nMUOVI LE MONTAGNE, MUOVI LE MONTAGNE, \nCREDO NEL TUO AMORE E NEL TUO NOME POTENTE. \nMUOVI LE MONTAGNE, VINCI LA MIA MORTE, \nTREMI LA TERRA DAVANTI AL SIGNOR, \nDAVANTI AL SUO SPLENDOR. \n \nOffro il mio dolore per la gloria tua Signore, \nsolo tu puoi trasformare tutto in grazia, potente Gesù. \nTu sei il mio tutto, sola luce del mio volto, \nvero scudo di difesa, canto e la mia mano è tesa verso te. \n \nSe tu non mi parli, se tu non mi parli, \nda chi andrò Signore? \nSe tu non mi parli amarti mi basta, \nmi basta il tuo sguardo, \nsoccorri il tuo figlio che innalza il suo canto. \n \n(RIT) \n \n(Gesù,) \n \n(Gesù, sei tu,) \nTU sei mio Signore, sei tu luce del mio volto, \n(sei tu.) (Uh.) \n \nSei tu scudo di difesa, \ncanto e la mia mano è tesa verso te  \nche sei il mio tutto, \nsei la luce del mio volto, tu sei scudo \ndi difesa, Gesù. \n \nMUOVI LE MONTAGNE, MUOVI LE MONTAGNE, \nCREDO NEL TUO AMORE E NEL TUO NOME POTENTE. \nMUOVI LE MONTAGNE, VINCI LA MIA MORTE, \nTREMI LA TERRA DAVANTI AL SIGNOR, \nTREMI LA TERRA DAVANTI AL SIGNOR, \nTREMI LA TERRA DAVANTI AL SIGNOR, \nDAVANTI AL SIGNOR.',s:'muovi le montagne verso le mie lacrime ai tuoi piedi mio signore vieni e spezza le catene che mi legano lontano da te tu sei il mio tutto sola luce del mio volto vero scudo di difesa canto e la mia mano e tesa verso te se tu non mi parli se tu non mi parli da chi andro signore se tu non mi parli amarti mi basta mi basta il tuo sguardo soccorri il tuo figlio che innalza il suo canto muovi le montagne muovi le montagne credo nel tuo amore e n {n:'509',t:'PARLA AL MIO CUORE',c:'Parla al mio cuore o Signore \nnel silenzio più intenso ti riconoscetò \nuna brezza soave accarezza il mio cuore,  \nsolo tu sei per sempre e sei per sempre con me, ti cerco. \n \nParla al mio cuore o Signore, \nnella notte pìù buia io t\'incontrerò, \ntu sei luce del mondo, sole senza tramonto, \nsei sorgente dì vita scaturita per me, per me, \n \nGUARDO TE SIGNORE, GUARDI ME, \nTU DA SEMPRE MI CONOSCI, \nNEL PROFONDO MI GUARISCI. \nVIVO DEL TUO AMORE, VIVI IN ME, \nVOCE ETERNA CHE MI CHIAMA, \nPRESENZA CHE PERDONA. \n \nParla al mio cuore o Signore, \nnel silenzio più intenso la tua voce udirò, \nin questo tempo di grazia sento la tua bellezza, \nsolo tu resti sempre è non passerai mai, ti amo, \n \nParla al mìo cuore o Signore, \nnella notte più lunga io t\'invocherò, \ntu sei luce del mondo, sole senza tramonto, \nmisericordia infinita riversata in me, in me, \n \n(RIT) \n \nParla al mio cuore. \nParla al mio cuore, \nParla al mio cuore, \nParla al mio cuore, \n \nGUARDO TE SIGNORE, GUARDI ME, \nTU DA SEMPRE MI CONOSCI, \nNEL PROFONDO MI GUARISCI, \nVIVO DEL TUO AMORE, VIVI IN ME, \nVOCE ETERNA CHE MI CHIAMA, \nPRESENZA CHE PERDONA. \n \nParla al mio cuore Gesù, io ti ascolto.',s:'parla al mio cuore parla al mio cuore o signore nel silenzio piu intenso ti riconosceto una brezza soave accarezza il mio cuore solo tu sei per sempre e sei per sempre con me ti cerco parla al mio cuore o signore nella notte piu buia io t incontrero tu sei luce del mondo sole senza tramonto sei sorgente di vita scaturita per me per me guardo te signore guardi me tu da sempre mi conosci nel profondo mi guarisci vivo del tuo amore vivi in me voce eterna che mi chiama presenza che perdona parla al mio cuore o signore nel silenzio piu intenso la tua voce udiro in questo tempo di grazia sento la tua bellezza solo tu resti sempre e non passerai mai ti amo parla al mio cuore o signore nella notte piu lunga io t invochero tu sei luce del mondo sole senza tram {n:'510',t:'QUANDO LUI VERRA\'',c:'Quando Lui verrà nella sua gloria \ntutte le genti radunerà. \nA chi è alla sua destra si volgerà: \n«Ecco il mio regno a voi in eredità». \n \nVEDRÒ IL SIGNOR, NON HO TIMORE, \nCREDO IN GESÙ CHE VERRÀ. \nPER IL SUO AMOR LUI MI HA LIBERATO, \nVEDRÒ IL SIGNOR, IL REDENTOR. \n \nQuando Lui verrà nella sua gloria \ngli uomini giusti benedirà: \n«Nei più piccoli avete accolto me, \necco il mio regno a voi in eredità». \n \nVEDRÒ IL SIGNOR, NON HO TIMORE, \nCREDO IN GESÙ CHE VERRÀ. \nPER IL SUO AMOR LUI MI HA LIBERATO, \nVEDRÒ IL SIGNOR, IL REDENTOR. \n \nVEDRÒ IL SIGNOR, NON HO TIMORE, \nCREDO IN GESÙ CHE VERRÀ. \nPER IL SUO AMOR LUI MI HA LIBERATO, \ni VEDRÒ IL SIGNOR, IL REDENTOR. \n \nIO VEDRÒ IL SIGNORE CHE VERRÀ.',s:'quando lui verra quando lui verra nella sua gloria tutte le genti radunera a chi e alla sua destra si volgera ecco il mio regno a voi in eredita vedro il signor non ho timore credo in gesu che verra per il suo amor lui mi ha liberato vedro il signor il redentor quando lui verra nella sua gloria gli uomini giusti benedira nei piu piccoli avete accolto me ecco il mio regno a voi in eredita vedro il signor non ho timore credo in gesu che verra per il suo amor lui mi ha liberato vedro il signor il redentor vedro il signor non ho timore credo in gesu che verra per il suo amor lui mi ha liberato i vedro il signor il redentor io vedro il signore che verra 510',type:'N',i:542},
{n:'511',t:'RENDIAMO GRAZIE A DIO',c:'Grande è il Signore e la sua fedeltà, \ncopre la terra con la sua bontà, \nil cielo narrerà \nla gloria e la maestà del Re. \n \nApre la mano e la vita ci dà,  \nstende il suo braccio e la via spianerà, \nlo sguardo volgerà \nall’umile che cerca il Re. \n \nChe cosa il mio cuore non ha? \nChe cosa io posso sperare di più? \n \nRENDIAMO GRAZIE A DIO \n\nPER IL SUO AMORE SEMPRE, \nPERCHÉ IL SUO AMORE SEMPRE È. \nRENDIAMO GRAZIE A LUI, \nSCIOGLIAMO IL NOSTRO CANTO, \nLEVIAMO I CUORI, DIO È QUI. \n \nPossa il mio cuore cercarti Signor, \nmai rinnegare il tuo grande amor, \nse non accolgo te \nchi mai diventerà mio Re? \n \nPassa la scena del mondo o Signor, \nma la Parola che hai detto sarà \neterna voce che \nper me la strada segnerà. \n \nChe cosa il mio cuore non ha? \nChe cosa io posso sperare di più? \n \n(RIT) \n \nE qui, è qui per sempre, \nè qui. \nPer sempre, per sempre, \nper sempre, per sempre Dio è qui. \nPer sempre, per sempre, \nper sempre, per sempre Dio è qui \nper sempre.',s:'rendiamo grazie a dio grande e il signore e la sua fedelta copre la terra con la sua bonta il cielo narrera la gloria e la maesta del re apre la mano e la vita ci da stende il suo braccio e la via spianera lo sguardo volgera all umile che cerca il re che cosa il mio cuore non ha che cosa io posso sperare di piu rendiamo grazie a dio per il suo amore sempre perche il suo amore sempre e rendiamo grazie a lui sciogliamo il nostro canto leviamo i cuori dio e qui possa il mio cuore cercarti signor mai rinnegare il tuo grande amor se non accolgo te chi mai diventera mio re passa la scena del mondo o signor ma la parola che hai detto sara eterna voce che per me la strada segnera che cosa il mio cuore non ha che cosa io posso sperare di piu rit e qui e qui per sempre e qui per sempre per sempre per sempre per sempre dio e qui per sempre per sempre per sempre per sempre dio e qui per sempre 511',type:'N',i:543},
{n:'512',t:'VIENI ANCORA NON TARDARE',c:'Dall\'eternità la tua presenza viva e potente \nattraversa il tempo e la storia. \nRiparo, luce e guida nella notte, \nnostra sicurezza, vita per le ossa aride. \n \nTu aleggiavi sulle acque, tu soffio del Padre, \ntu colonna sei di fuoco, tu brezza soave. \n \nVIENI ANCORA, SANTO SPIRITO DEL PADRE! \nVIENI ANCORA, FONTE ETERNA DELL\'AMORE! \nVIENI ANCORA, NON TARDARE, VIENI, \nVIENI ANCORA, DIO SPIRITO IN NOI. \nVIENI ANCORA, SANTO SPIRITO DEL PADRE! \nVIENI ANCORA, FONTE ETERNA DELL\'AMORE! \nVIENI ANCORA, NON TARDARE, VIENI, \n\nVIENI ANCORA, DIO SPIRITO IN NOI. \n \nGuida con sapienza la tua Chiesa, \ndalle vita nuova attraverso il tempo e la storia. \nDona a noi fortezza e gioia piena, \ncarità perfetta, pace per chi ha fiducia in te. \n \nTu acqua viva che disseta, tu sei guarigione, \ntu che spezzi le catene, tu grazia nel cuore. \n \n(RIT) \n \nFiamma inestinguibile, lode a te, \nbalsamo d\'amore, lode a te. \nDono che si dona, lode a te, \ngloria e santità, lode a te. \nVieni ancora, non tardare, vieni, \nvieni ancora, non tardare, vieni. \n \nVIENI ANCORA, SANTO SPIRITO DEL PADRE! \nVIENI ANCORA, FONTE ETERNA DELL\'AMORE! \nVIENI ANCORA, NON TARDARE, VIENI. \nVIENI ANCORA, DIO SPIRITO IN NOI. \nVIENI ANCORA, SANTO SPIRITO DEL PADRE! \nVIENI ANCORA, FONTE ETERNA DELL\'AMORE! \nVIENI ANCORA, NON TARDARE, VIENI. \nVIENI ANCORA, DIO SPIRITO INNOI. \nVIENI SPIRITO IN NOI.',s:'vieni ancora non tardare dall eternita la tua presenza viva e potente attraversa il tempo e la storia riparo luce e guida nella notte nostra sicurezza vita per le ossa aride tu aleggiavi sulle acque tu soffio del padre tu colonna sei di fuoco tu brezza soave vieni ancora santo spirito del padre vieni ancora fonte eterna dell amore vieni ancora non tardare vieni vieni ancora dio spirito in noi vieni ancora santo spirito del padre vieni ancora fonte eterna dell amore vieni ancora non tardare vieni vieni ancora dio spirito in noi guida con sapienza la {n:'513',t:'ADORO TE O MIO SIGNORE',c:'Sei qui davanti a me, alla tua presenza mi prostrerò \ne loderò con tutto il cuor il tuo immenso amore. \nTu sei il mio Signor, accanto a te nulla mancherà, \nbenedirò sempre nella gioia il tuo santo nome. \n \nADORO TE O MIO SIGNORE,  \nCANTO PER SEMPRE IL TUO NOME, \nLE BRACCIA INNALZO AL CIELO, \nDIO E MIO SIGNOR. \nADORO TE O MIO SIGNOR, \nCANTO PER SEMPRE IL TUO NOME,  \nINNALZERO\' CON GIOIA IL TUO NOME. \n \nOggi davanti a noi splende un sole che mai tramonterà, \ni nostri giorni a te doniam, li custodirai. \n\nTu sorgi su di noi, la tua Parola ci guiderà, \nriconosceremo che tu sei il Re vivo in mezzo a noi.  \n \nADORO TE O MIO SIGNORE,  \nCANTO PER SEMPRE IL TUO NOME, \nLE BRACCIA INNALZO AL CIELO, \nDIO E MIO SIGNOR. \nADORO TE O MIO SIGNOR, \nCANTO PER SEMPRE IL TUO NOME,  \nINNALZERO\' CON GIOIA IL TUO NOME. \n \nTu dimori in mezzo a noi,  \nil tuo volto contempliam, \nla gloria tua vediam,  \nsei giustizia e verità. \n \nADORO TE O MIO SIGNORE,  \nCANTO PER SEMPRE IL TUO NOME, \nLE BRACCIA INNALZO AL CIELO, \nDIO E MIO SIGNOR. \nADORO TE O MIO SIGNOR, \nCANTO PER SEMPRE IL TUO NOME,  \nT\'INNALZERO\' CON GIOIA  \nNESSUNO E\' PARI A TE MIO RE. \n \nADORO TE O MIO SIGNOR, \nCANTO PER SEMPRE IL TUO NOME,  \nT\'INNALZERO\' CON GIOIA  \nNESSUNO E\' PARI A TE MIO RE.',s:'adoro te o mio signore sei qui davanti a me alla tua presenza mi prostrero e lodero con tutto il cuor il tuo immenso amore tu sei il mio signor accanto a te nulla manchera benediro sempre nella gioia il tuo santo nome adoro te o mio signore canto per sempre il tuo nome le braccia innalzo al cielo dio e mio signor adoro te o mio signor canto per sempre il tuo nome innalzero con gioia il tuo nome oggi davanti a noi splende un sole che mai tramontera i nostri giorni a te doniam li custodirai tu sorgi su di noi la tua parola ci guidera riconosceremo che tu sei il re vivo in mezzo a noi adoro te o mio signore canto per sempre il tuo nome le braccia innalzo a {n:'514',t:'DALL\'ETERNITA\'',c:'Dall’eternità io ho scelto te, \ndall’eternità il tuo nome è scritto sul mio cuore. \nCambierò il tuo lutto in gioia,  \nti consolerò oh,  \ncon te sarò. \n \nDall’eternità già ti pensai, \ndall’eternità prima che nascessi io ti consacrai. \nTu sei mio, non temere nulla,  \nti consolerò sempre. \n \nNON DIRE SONO GIOVANE, \nNON CHIEDERTI PERCHÉ, \nSUI REGNI E LE NAZIONI  \nTI DARÒ AUTORITÀ. \n\nNON DIRE SONO DEBOLE, \nIO TI PROTEGGERÒ, \nSULLA TUA BOCCA METTERÒ, \nLE MIE PAROLE METTERÒ, \nDALL’ETERNITÀ TI HO SCELTO PER AMORE. \n \nDall’eternità io ho scelto te, \nio ti manderò e dirai le cose che ti ordinerò, \ntoccherò la tua bocca ora, ti proteggerò sempre. \n \nNON DIRE SONO GIOVANE, \nNON CHIEDERTI PERCHÉ, \nSUI REGNI E LE NAZIONI  \nTI DARÒ AUTORITÀ. \nNON DIRE SONO DEBOLE, \nIO TI PROTEGGERÒ, \nSULLA TUA BOCCA METTERÒ, \nLE MIE PAROLE METTERÒ, \nDALL’ETERNITÀ TI HO SCELTO PER AMORE. \n \nTu appartieni a me, ti custodirò per sempre, \nti consacrerò, tu sarai con me per sempre. \nTu appartieni a me, ti custodirò per sempre, \nti consacrerò, tu sarai con me per sempre. \n \nNON DIRE SONO GIOVANE, \nNON CHIEDERTI PERCHÉ, \nSUI REGNI E LE NAZIONI  \nTI DARÒ AUTORITÀ. \nNON DIRE SONO DEBOLE, \nIO TI PROTEGGERÒ, \nSULLA TUA BOCCA METTERÒ, \nLE MIE PAROLE METTERÒ, \nDALL’ETERNITÀ TI HO SCELTO PER AMORE.',s:'dall eternita dall eternita io ho scelto te dall eternita il tuo nome e scritto sul mio cuore cambiero il tuo lutto in gioia ti consolero oh con te saro dall eternita gia ti pensai dall eternita prima che nascessi io ti consacrai tu sei mio non temere nulla ti consolero sempre non dire sono giovane non chiederti perche sui regni e le nazioni ti daro autorita non dire sono debole io ti proteggero sulla tua bocca mettero le mie parole mettero dall eternita ti ho scelto per amore dall eternita io ho scelto te io ti mandero e dirai le cose che ti ordinero tocchero la tua bocca ora ti proteggero sempre non dire sono giovane non chiederti {n:'515',t:'GESU\' SIGNORE DI MISERICORDIA',c:'Gesù Signore di misericordia \ncerco il tuo volto,  \nio ti appartengo. \nCon la tua potenza inabita il mio cuore, \nvieni a consacrare  \nil tuo santo altare, \nvieni per restare. \n \nGESÙ, GESÙ, GESÙ, GESÙ, GESÙ, \nGESÙ, GESÙ. \n\n \nGesù Signore di misericordia \nsento la tua voce,  \nchiami il mio nome. \nDella tua presenza inebria la mia vita, \nil mio cuore plasma,  \nfa che possa amare \ndel tuo stesso amore.  \n \nGESÙ, GESÙ, GESÙ, GESÙ, GESÙ, \nGESÙ, GESÙ, GESÙ . \n \nGesù Signore di misericordia \nsale fino al cielo \noggi la mia lode, \nnel tuo nome santo io canterò in eterno. \nEcco la salvezza, \nla grazia, il regno, \necco il nostro Dio. \n \nGESÙ, GESÙ, GESÙ, GESÙ, GESÙ. \nTI AMO GESÙ.',s:'gesu signore di misericordia gesu signore di misericordia cerco il tuo volto io ti appartengo con la tua potenza inabita il mio cuore vieni a consacrare il tuo santo altare vieni per restare gesu gesu gesu gesu gesu gesu gesu gesu signore di misericordia sento la tua voce chiami il mio nome della tua presenza inebria la mia vita il mio cuore plasma fa che possa amare del tuo stesso amore gesu gesu gesu gesu gesu gesu gesu gesu gesu signore di misericordia sale fino al cielo oggi la mia lode nel tuo nome santo io cantero in eterno ecco la salvezza la grazia il regno ecco il nostro dio gesu gesu gesu gesu gesu ti amo gesu 515',type:'N',i:547},
{n:'516',t:'I MIEI OCCHI ELEVO A TE',c:'I miei occhi elevo a te \nche sei il mio Dio, che sei il mio Re, \nil mio piede non lasciar \nche vaghi nell\'oscurità. \nVeglia su di me \ncon lo sguardo tuo Signore, \ncol tuo Spirito d\'amor. \n \nMIA FORZA, MIO SOSTEGNO, \nMIO AIUTO SEI SIGNORE GESÙ, \nMIO CUSTODE, MIA DIFESA, \nMIO RIFUGIO SEI SIGNORE GESÙ, \nIN TE VIVO, IN TE RIPOSO, \nMIA FORZA GESÙ. \n \nSe la notte sei con me \nil giorno nulla mi accadrà, \nil tuo nome adorerò, \nper sempre ti benedirò. \nVeglia su di me \ncon lo sguardo tuo Signore, \n\ncol tuo Spirito d\'amor. \n \nMIA FORZA, MIO SOSTEGNO, \nMIO AIUTO SEI SIGNORE GESÙ, \nMIO CUSTODE, MIA DIFESA, \nMIO RIFUGIO SEI SIGNORE GESÙ, \nIN TE VIVO, IN TE RIPOSO, \nMIA FORZA GESÙ. \n \nT\'invoco è tu sei con ne \nl\'Altisstno Dio e Re dei re, \nt\'invoco e tu sei con ne, \nsel Dio e Re dei re. \n \nMIA FORZA, MIO SOSTEGNO, \nMIO AIUTO SEI SIGNORE GESÙ, \nMIO CUSTODE, MIA DIFESA, \nMIO RIFUGIO SEI SIGNORE GESÙ, \nIN TE VIVO, IN TE RIPOSO, \nMIA FORZA GESÙ.',s:'i miei occhi elevo a te i miei occhi elevo a te che sei il mio dio che sei il mio re il mio piede non lasciar che vaghi nell oscurita veglia su di me con lo sguardo tuo signore col tuo spirito d amor mia forza mio sostegno mio aiuto sei signore gesu mio custode mia difesa mio rifugio sei signore gesu in te vivo in te riposo mia forza gesu se la notte sei con me il giorno nulla mi accadra il tuo nome adorero per sempre ti benediro veglia su di me con lo sguardo tuo signore col tuo spirito d amor mia forza mio sostegno mio aiuto sei signore gesu mio custode mia difesa mio rifugio sei signore gesu in te vivo in te riposo mia forza gesu t invoco e tu sei con ne l altisstno dio e re dei re t invoco e tu sei con ne sel dio e re dei re mia forza mio sostegno mio aiuto sei signore gesu mio custode mia difesa mio rifugio sei signore gesu in te vivo in te riposo mia forza gesu 516',type:'N',i:548},
{n:'517',t:'MAGNIFICO SIGNORE',c:'Alzo gli occhi verso i monti,  \nda chi mi verrà il soccorso? \nIl soccorso trovo in te,  \nmia rupe, mia roccia sei tu, \nil custode dei giorni miei. \n \nNon mi colpirà alcun male,  \ntu sei l\'onbra che mi copre, \nla vittoria trovo in te,  \nmio scudo, mio vanto sei tu, \nla fortezza dei giorni miei. \n \nGRANDE, MAGNIFICO SIGNORE, \nSORGENTE DI OGNI BENE, \nALLA TUA PRESENZA SENZA FINE CANTERÒ \nLE TUE MISERICORDIE CHE RINNOVI SEMPRE \nPER CHI CONFIDA IN TE \nGRAZIE, MAGNIFICO SIGNORE, \nPIENEZZA DEI MIEI GIORNI, \nALLA TUA PRESENZA SENZA FINE GUSTERÒ \nQUANTO TU SEI BUONO \nE BEATO L\'UOMO CHE TROVA GRAZIA IN TE. \n \n\nNon vacillerà il mio piede,  \ntu cammini alla mia destra, \nla mia strada trovo in te,  \nmia meta, mio tutto sei tu, \nil Signore dei giorni miel. \n \nGRANDE, MAGNIFICO SIGNORE, \nSORGENTE DI OGNI BENE, \nALLA TUA PRESENZA SENZA FINE CANTERÒ \nLE TUE MISERICORDIE CHE RINNOVI SEMPRE \nPER CHI CONFIDA IN TE \nGRAZIE, MAGNIFICO SIGNORE, \nPIENEZZA DEI MIEI GIORNI, \nALLA TUA PRESENZA SENZA FINE GUSTERÒ \nQUANTO TU SEI BUONO \nE BEATO L\'UOMO CHE TROVA GRAZIA IN TE. \n \nMia delizia e mio calice, \nLa mia sorte è magnifica, \nsei Signore la mia eredità, \nin te esulta il mio spirito, \nil tuo regno dimora in me,  \nDio del cielo e del secoli. \n \nGRANDE, MAGNIFICO SIGNORE, \nSORGENTE DI OGNI BENE, \nALLA TUA PRESENZA SENZA FINE CANTERÒ \nLE TUE MISERICORDIE CHE RINNOVI SEMPRE \nPER CHI CONFIDA IN TE \nGRAZIE, MAGNIFICO SIGNORE, \nPIENEZZA DEI MIEI GIORNI, \nALLA TUA PRESENZA SENZA FINE GUSTERÒ \nQUANTO TU SEI BUONO \nE BEATO L\'UOMO CHE TROVA GRAZIA IN TE.',s:'magnifico signore alzo gli occhi verso i monti da chi mi verra il soccorso il soccorso trovo in te mia rupe mia roccia sei tu il custode dei giorni miei non mi colpira alcun male tu sei l onbra che mi copre la vittoria trovo in te mio scudo mio vanto sei tu la fortezza dei giorni miei grande magnifico signore sorgente di ogni bene alla tua presenza senza {n:'520',t:'PROCLAMO CHE TU SEI IL SIGNORE',c:'Mio Signore con potenza \nsei risorto e vivi per l\'eternità, \nla vittoria del tuo Regno \nresterà nei secoli dei secoli. \nPer sempre Signore, mio Dio, \nnel tuo Spirito annuncerò la tua salvezza. \n \nPROCLAMO CHE TU SEI IL SIGNORE, \nGESÙ IO CREDO NEL TUO AMORE, \nVOGLIO ANNUNCIARE AD OGNI UOMO IL TUO VANGELO. \nPROCLAMO CHE TU SEI IL SIGNORE, \nLO GRIDO SENZA PIÙ TIMORE \nPERCHÉ SULL\'OMBRA DELLA MORTE \nHA VINTO IL TUO AMORE. \n \nMio Signore dammi forza \nper seguire sempre la tua volontà, \nfa’ ch\'io sia tuo fedele testimone \nin parole ed opere. \nPer sempre Signore, mio Dio, \nnel tuo Spirito annuncerò la tua salvezza \n \nPROCLAMO CHE TU SEI IL SIGNORE, \nGESÙ IO CREDO NEL TUO AMORE, \n\nVOGLIO ANNUNCIARE AD OGNI UOMO IL TUO VANGELO. \nPROCLAMO CHE TU SEI IL SIGNORE, \nLO GRIDO SENZA PIÙ TIMORE \nPERCHÉ SULL\'OMBRA DELLA MORTE \nHA VINTO IL TUO AMORE. \n \nPer la tua gloria Gesù usa la mia vita, \nguidami sempre, con te non avrò paura. \nPer la tua gloria guidami sempre. \n \nPROCLAMO CHE TU SEI IL SIGNORE, \nGESÙ IO CREDO NEL TUO AMORE, \nVOGLIO ANNUNCIARE AD OGNI UOMO IL TUO VANGELO. \nPROCLAMO CHE TU SEI IL SIGNORE, \nLO GRIDO SENZA PIÙ TIMORE \nPERCHÉ SULL\'OMBRA DELLA MORTE \nHA VINTO IL TUO AMORE, \nHA VINTO IL TUO AMORE.',s:'proclamo che tu sei il signore mio signore con potenza sei risorto e vivi per l eternita la vittoria del tuo regno restera nei secoli dei secoli per sempre signore mio dio nel tuo spirito annuncero la tua salvezza proclamo che tu sei il signore gesu io credo nel tuo amore voglio annunciare ad ogni uomo il tuo vangelo proclamo che tu sei il signore lo grido senza piu timore perche sull ombra della morte ha vinto il tuo amore mio signore dammi forza per seguire sempre la tua volonta fa ch io sia tuo fedele testimone in parole ed opere per sempre signore mio dio nel tuo spirito annuncero la tua salvezza proclamo che tu sei il signore gesu io credo nel tuo amore voglio annunciare ad o {n:'521',t:'SE GUARDO LA STORIA (LODE A TE)',c:'Se guardo la storia e ogni cosa che tu hai creato, \ntutto mi parla di te, del tuo grande amor. \nLa vita provata rinasce e il deserto fiorisce, \nnuova speranza tu doni a chi crede în te. \n \nLODE A TE MIO SIGNORE E MIO DIO, LODE A TE, \nCANTO LA TUA BONTÀ, LA TUA FEDELTÀ, \nLA MIA GIOIA È SOLO IN TE. \n \nGuarisci il malato, il debole in te trova forza, \napri la mano e sazi i figli tuoi. \nEterno è il tuo regno glorioso \nda sempre per sempre, \nnuova alleanza tu doni all\'umanità. \n \nLODE A TE MIO SIGNORE E MIO DIO, LODE A TE, \nCANTO LA TUA BONTÀ, LA TUA FEDELTÀ, \nLA MIA GIOIA È SOLO IN TE. \nLODE A TE MIO SIGNORE E MIO DIO, LODE A TE, \nCANTO LA TUA BONTÀ, LA TUA FEDELTÀ, \nLA MIA GIOIA È SOLO IN TE. \n \nOgni vivente esalta il tuo nome \ne annuncia le meraviglie tue. \nGli occhi di tutti rivolti al tuo trono \ncontemplano la tua santità. \n\n \nLODE A TE MIO SIGNORE E MIO DIO, LODE A TE, \nCANTO LA TUA BONTÀ, LA TUA FEDELTÀ, \nLA MIA GIOIA È SOLO IN TE. \nLODE A TE, A TE MIO SIGNORE, LODE A TE, \nCANTO LA TUA BONTÀ, LA TUA FEDELTÀ, \nLA MIA GIOIA È SOLO IN TE. \nLODE A TE, LODE A TE, LODE A TE.',s:'se guardo la storia lode a te se guardo la storia e ogni cosa che tu hai creato tutto mi parla di te del tuo grande amor la vita provata rinasce e il deserto fiorisce nuova speranza tu doni a chi crede in te lode a te mio signore e mio dio lode a te canto la tua bonta la tua fedelta la mia gioia e solo in te guarisci il malato il debole in te trova forza apri la mano e sazi i figli tuoi eterno e il tuo regno glorioso da sempre per sempre nuova alleanza tu doni all umanita lode a te mio signore e mio dio lode a te canto la tua bonta la tua fedelta la mia gioia e solo in te lode a te mio signore e mio dio lode a te canto la tua bonta la tua fedelta la mia gioia e solo in te ogni vivente esalta il tuo nome e annuncia le meraviglie tue gli occhi di tutti rivolti al tuo trono contemplano la tua santita lode a te mio si {n:'522',t:'SEI TU GESU\'',c:'Sulla strada verso casa tu cammini a fianco a me, \nmi riveli la Parola e il mio cuore arde. \nQuando giunge ormai la sera resti a cena insieme a me \ne da come spezzi il pane io ti riconosco. \n \nSEI TU GESÙ, SEI TU IL MIO SIGNORE, \nSEI TU IL MIO SALVATORE, TU SEI IL MIO DIO. \nSEI TU, SEI TU, SEI TU IL MIO SIGNORE, \nSEI TU IL MIO SALVATORE, \nTU SEI IL MIO DIO. \n \nSei risorto anche per me, nella mia incredulità \nsei entrato a porte chiuse nella mia vita. \nIl tuo Spirito hai effuso, la tua pace è entrata in me, \nora tocco le tue piaghe e ti riconosco. \n \nSEI TU GESÙ, SEI TU IL MIO SIGNORE, \nSEI TU IL MIO SALVATORE, TU SEI IL MIO DIO. \nSEI TU, SEI TU, SEI TU IL MIO SIGNORE, \nSEI TU IL MIO SALVATORE, \nTU SEI IL MIO DIO. \nSEI TU IL MIO SIGNORE GESÙ.',s:'sei tu gesu sulla strada verso casa tu cammini a fianco a me mi riveli la parola e il mio cuore arde quando giunge ormai la sera resti a cena insieme a me e da come spezzi il pane io ti riconosco sei tu gesu sei tu il mio signore sei tu il mio salvatore tu sei il mio dio sei tu sei tu sei tu il mio signore sei tu il mio salvatore tu sei il mio dio sei risorto anche per me nella mia incredulita sei entrato a porte chiuse nella mia vita il tuo spirito hai effuso la tua pace e entrata in me ora tocco le tue piaghe e ti riconosco sei tu gesu sei tu il mio signore sei tu il mio salvatore tu sei il mio dio sei tu sei tu sei tu il mio signore sei tu il mio salvatore tu sei il mio dio sei tu il mio signore gesu 522',type:'N',i:554},
{n:'523',t:'TARDI T\'AMAI',c:'Vinse il tuo grido la mia sordità, \ngli occhi mi apristi con il tuo splendor, \nhai dissipato la mia cecità, \nil tuo profumo mi attira Signor. \n \nTi respirai e desidero te, \nio ti gustai ora ho sete di te, \ntu mi toccasti e il tuo fuoco d\'amor \nla pace accese fin dentro il mio cuor. \nEri con me e non ero con te. \n \n\nTARDI T’AMAI BELLEZZA ANTICA, \nTARDI T’AMAI, MA SEMPRE NUOVA, \nFORTE DENTRO DI ME IL TUO GRIDO \nMA IO ERO FUORI E NON CAPIVO. \nNELLE CREATURE MI GETTAVO \nMA MI PORTAVANO LONTANO \nDALLA TUA GIOIA CHE MI RIEMPIE. \nTARDI T\'AMAI MA T’AMERÒ PER SEMPRE. \n \nVinse il tuo grido la mia sordità, \ngli occhi mi apristi con il tuo splendor, \nhai dissipato la mia cecità, \nil tuo profumo mi attira Signor. \nEri con me e non ero con te. \n \nTARDI T’AMAI BELLEZZA ANTICA, \nTARDI T’AMAI, MA SEMPRE NUOVA, \nFORTE DENTRO DI ME IL TUO GRIDO \nMA IO ERO FUORI E NON CAPIVO. \nNELLE CREATURE MI GETTAVO \nMA MI PORTAVANO LONTANO \nDALLA TUA GIOIA CHE MI RIEMPIE. \nTARDI T\'AMAI MA T’AMERÒ PER SEMPRE. \n \nIo t’amerò per sempre, \nio t\'amerò per sempre, \nio t’amerò (per sempre), \nio t\'amerò, io t\'amerò \nper sempre, \nper sem — pre, \nGesù t\'amerò per sempre. \n \nTARDI T\'AMAI BELLEZZA ANTICA (PER SEMPRE), \nTARDI T\'AMAI, MA SEMPRE NUOVA (PER SEMPRE), \nFORTE DENTRO DI ME IL TUO GRIDO \nMA IO ERO FUORI E NON CAPIVO. \nNELLE CREATURE MI GETTAVO \nMA MI PORTAVANO LONTANO \nDALLA TUA GIOIA CHE MI RIEMPIE. \n \nTARDI T\'AMAI MA T\'AMERO\' PER SEMPRE (PER SEMPRE), \nFORTE DENTRO DI ME IL TUO GRIDO \nMA IO ERO FUORI E NON CAPIVO. \nNELLE CREATURE MI GETTAVO \nMA MI PORTAVANO LONTANO \nDALLA TUA GIOIA CHE MI RIEMPIE. \n \n\nTARDI T\'AMAI BELLEZZA ANTICA (PER SEMPRE), \nTARDI T\'AMAI, MA SEMPRE NUOVA (PER SEMPRE), \nFORTE DENTRO DI ME IL TUO GRIDO \nMA IO ERO FUORI E NON CAPIVO. \nNELLE CREATURE MI GETTAVO \nMA MI PORTAVANO LONTANO \nDALLA TUA GIOIA CHE MI RIEMPIE. \n \nTARDI T\'AMAI MA T\'AMERO\' PER SEMPRE (PER SEMPRE), \nF
