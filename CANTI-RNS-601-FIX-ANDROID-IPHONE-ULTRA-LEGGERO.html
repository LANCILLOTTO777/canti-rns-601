{n:'389',t:'IO CREDO IN TE GESÙ',c:'A te mio Dio affido me stesso  \ncon ciò che sono per te Signor.  \nIl mondo mio è nelle tue mani,  \nio sono tuo per sempre.  \n  \nIO CREDO IN TE  \nGESÙ,  \nAPPARTENGO A TE SIGNOR.  \nÈ PER TE CHE IO VIVRÒ,  \nPER TE IO CANTERÒ  \nCON TUTTO IL CUOR.  \n  \nTi seguirò ovunque tu andrai,  \ntra lacrime e gioia ho fede in te.   \nCamminerò nelle tue vie,  \nnelle promesse per sempre.  \n  \nIO CREDO IN TE GESÙ,  \nAPPARTENGO A TE  SIGNOR.   \nÈ PER TE CHE IO VIVRÒ,  \nPER TE IO CANTERÒ.  \n  \nIO CREDO IN TE GESÙ,  \nAPPARTENGO A TE SIGNOR.  \nÈ PER TE CHE IO VIVRÒ,  \nPER TE IO CANTERÒ  \nCON TUTTO IL CUOR.  \n  \nlo ti adoro e ti adorerò, \n\nio ti adoro e ti adorerò.  \n \nIO CREDO IN TE  \nGESÙ,  \nAPPARTENGO A TE SIGNOR.  \nÈ PER TE CHE IO VIVRÒ,  \nPER TE IO CANTERÒ.  \n \nIO CREDO IN TE  \nGESÙ,  \nAPPARTENGO A TE SIGNOR.  \nÈ PER TE CHE IO VIVRÒ,  \nPER TE IO CANTERÒ  \nCON TUTTO IL CUOR.  \nÈ PER TE CHE IO VIVRÒ,  \nPER TE IO CANTERÒ  \nCON TUTTO IL CUOR.',s:'io credo in te gesu a te mio dio affido me stesso con cio che sono per te signor il mondo mio e nelle tue mani io sono tuo per sempre io credo in te gesu appartengo a te signor e per te che io vivro per te io cantero con tutto il cuor ti seguiro ovunque tu andrai tra lacrime e gioia ho fede in te camminero nelle tue vie nelle promesse per sempre io credo in te gesu appartengo a te signor e per te che io vivro per te io cantero io credo in te gesu appartengo a te signor e per te che io vivro per te io cantero con tutto il cuor lo ti adoro e ti adorero io ti adoro e ti adorero io credo in te gesu appartengo a te signor e per te che io vivro per te io cantero io credo in te gesu appartengo a te signor e per te che io vivro per te io cantero con tutto il cuor e per te che io vivro per te io cantero con tutto il cuor 389',type:'N',i:421},
{n:'390',t:'LODE A TE',c:'Nel tuo tempio noi ti adoriamo  \ndegno Agnello di Dio,  \ntu Redentore, tu vero amore  \nabiti in mezzo a noi.  \n  \nAlla tua presenza ci fai dimorare,  \nqui davanti a te noi vogliamo restare.  \n  \nLODE A TE, TU SEI NOSTRO SIGNORE,  \nGRANDE IN POTENZA, FORTE IN BATTAGLIA   \nDIO PIENO D\'AMORE E DI BONTÀ.  \n  \nLODE A TE, TU SEI NOSTRO SIGNORE,   \nRICCO NEL PERDONO, VIA, VITA E VERITÀ,  \nTU SEI PER NOI LA VERA LIBERTA.  \n  \nIl tuo regno noi costruiamo  \nannunciando il tuo amore,   \ntu sei la luce,  \ntu vera pace guidi l\'umanità.  \n  \nA tutte le genti vogliamo gridare,  \ntu sei il nuovo giorno che deve arrivare. (RIT) \n  \nLODE A TE, TU SEI NOSTRO SIGNORE,   \nRICCO NEL PERDONO, VIA, VITA E VERITÀ,  \nTU SEI PER NOI LA VERA LIBERTÀ,  \nTU SEI PER NOI LA VERA LIBERTÀ,   \n\nTU SEI PER NOI LA VERA LIBERTÀ.',s:'lode a te nel tuo tempio noi ti adoriamo degno agnello di dio tu redentore tu vero amore abiti in mezzo a noi alla tua presenza ci fai dimorare qui davanti a te noi vogliamo restare lode a te tu sei nostro signore grande in potenza forte in battaglia dio pieno d amore e di bonta lode a te tu sei nostro signore ricco nel perdono via vita e verita tu sei per noi la vera liberta il tuo regno noi costruiamo annunciando il tuo amore tu sei la luce tu vera pace guidi l umanita a tutte le genti vogliamo gridare tu sei il nuovo giorno che deve arrivare rit lode a te tu sei nostro signore ricco nel perdono via vita e verita tu sei per noi la vera liberta tu sei per noi la vera liberta tu sei per noi la vera liberta 390',type:'N',i:422},
{n:'391',t:'LODE A TE TRINITÀ',c:'In un solo Dio credo, credo,  \nCreatore di ogni cosa credo, credo,  \ne in Gesù nostro Signore credo,  \ncredo, nato da Dio Padre credo.  \n \nSÌ, GESÙ, IO CREDO CHE TU SEI IL SIGNORE,  \nSÌ, GESÙ, IO CREDO CHE TU SEI IL FIGLIO DI DIO,  \nHAI MOSTRATO IL VOLTO DEL PADRE,  \nCI DONI IL SANTO SPIRITO,  \nSÌ, GESÙ, IO CREDO, IO CREDO IN TE.  \n  \nNel tuo Santo Spirito credo, credo,  \nè Signore e dà la vita credo, credo,  \ne la santa Chiesa credo, credo,  \nunita nel tuo Nome credo. (RIT) \'  \n  \nNella tua vittoria credo, credo,   \nnella tua risurrezione credo, credo,  \nnel tuo regno senza fine credo, credo,  \ne nella vita eterna credo. (RIT) \n \n(coda facoltativa)  \n  \nCredo (credo), credo (credo),  \ncredo (credo), credo, credo. (RIT) \n \nIO CREDO IN TE, IO CREDO IN TE,  \nIO CREDO IN TE, CREDO.',s:'lode a te trinita in un solo dio credo credo creatore di ogni cosa credo credo e in gesu nostro signore credo credo nato da dio padre credo si gesu io credo che tu sei il signore si gesu io credo che tu sei il figlio di dio hai mostrato il volto del padre ci doni il santo spirito si gesu io credo io credo in te nel tuo santo spirito credo credo e signore e da la vita credo credo e la santa chiesa credo credo unita nel tuo nome credo rit nella tua vittoria credo credo nella tua risurrezione credo credo nel tuo regno senza fine credo credo e nella vita eterna credo rit coda facoltativa credo credo credo credo credo credo credo credo rit io credo in te io credo in te io credo in te credo 391',type:'N',i:423},
{n:'392',t:'SIGNORE SALVAMI',c:'Innalzo la preghiera per la tua bontà  \nRispondi, o Signore per la tua fedeltà.  \nChe io non affondi, salvami, o Dio,  \ndalle acque più profonde, grido a te.  \n  \nSIGNORE SALVAMI, SALVAMI, \nAFFERRO LA TUA MANO  \nE TU MI ATTIRI A TE.  \nSIGNORE, SALVAMI, SALVAMI,  \nSE GUARDO NEI TUOI OCCHI  \n\nPAURA NON AVRÒ.  \n  \nMostrami il tuo volto nelle avversità.   \nVolgiti, o Signore, stai vicino a me.  \nMi ponga al sicuro la tua salvezza, o Dio,   \nravviva il mio cuore, grido a te. (RIT)  \n  \nMi ponga al sicuro la tua salvezza, o Dio,  \nravviva il mio cuore, grido a te. (RIT) \n  \nSE GUARDO NEI TUOI OCCHI  \nPAURA NON AVRÒ.',s:'signore salvami innalzo la preghiera per la tua bonta rispondi o signore per la tua fedelta che io non affondi salvami o dio dalle acque piu profonde grido a te signore salvami salvami afferro la tua mano e tu mi attiri a te signore salvami salvami se guardo nei tuoi occhi paura non avro mostrami il tuo volto nelle avversita volgiti o signore stai vicino a me mi ponga al sicuro la tua salvezza o dio ravviva il mio cuore grido a te rit mi ponga al sicuro la tua salvezza o dio ravviva il mio cuore grido a te rit se guardo nei tuoi occhi paura non avro 392',type:'N',i:424},
{n:'393',t:'SONO QUI A LODARTI',c:'Luce del mondo  \nnel buio del cuore vieni ed illuminami,  \ntu mia sola speranza di vita  \nresta per sempre con me.  \n \nSONO QUI A LODARTI,  \nQUI PER ADORARTI,  \nQUI PER DIRTI CHE TU SEI IL MIO DIO  \nE SOLO TU SEI SANTO,  \nSEI MERAVIGLIOSO,  \nDEGNO E GLORIOSO SEI PER ME.  \n  \nRe della storia e Re della gloria  \nsei sceso in terra fra noi,  \ncon umiltà il tuo trono hai lasciato  \nper dimostrarci il tuo amor. (RIT) \n  \nlo mai saprò quanto ti costò  \nlì sulla croce morir per me. (x4)  \n \nPoi (RIT) (x3)',s:'sono qui a lodarti luce del mondo nel buio del cuore vieni ed illuminami tu mia sola speranza di vita resta per sempre con me sono qui a lodarti qui per adorarti qui per dirti che tu sei il mio dio e solo tu sei santo sei meraviglioso degno e glorioso sei per me re della storia e re della gloria sei sceso in terra fra noi con umilta il tuo trono hai lasciato per dimostrarci il tuo amor rit lo mai sapro quanto ti costo li sulla croce morir per me x4 poi rit x3 393',type:'N',i:425},
{n:'394',t:'SU LODIAMO',c:'Un grido c\'è, giunge qui dai monti, per tutti è.  \nUn grido c\'è, per tutte le tribù e nazioni,  \nlode a lui all\'Agnello che è sul trono.  \n \nSU LODIAMO STIRPE ELETIA, \nSU LODIAMO GENTE SANTA,  \n\nSIA LODE A LUI, A LUI IL POTERE.  \nQUESTO È IL DÌ, QUESTO È IL TEMPO,  \nÈ IL GIORNO CHE HA FATTO IL SIGNORE PER NOI,   \nDI GIOIA GRANDE ESULTIAM.  \n  \nLassù, al suo monte santo andiamo,   \nlode a lui davanti al trono suo.  \nLassù, lodiamolo dinanzi al mondo, proclamiam  \nla gloria del Signor.  \n(RIT) \n  \nNei suoi atri andiam, con il cuore ringraziam.  \nNel suo tempio entriam perché questo giorno è ormai  \ngiunto, sacerdozio regale noi siam. (RIT)  \n  \nÈ IL GIORNO CHE HA FATIO IL SIGNOR PER NOI,   \nDI  GIOIA NOI ESULTIAM.',s:'su lodiamo un grido c e giunge qui dai monti per tutti e un grido c e per tutte le tribu e nazioni lode a lui all agnello che e sul trono su lodiamo stirpe eletia su lodiamo gente santa sia lode a lui a lui il potere questo e il di questo e il tempo e il giorno che ha fatto il signore per noi di gioia grande esultiam lassu al suo monte santo andiamo lode a lui davanti al trono suo lassu lodiamolo dinanzi al mondo proclamiam la gloria del signor rit nei suoi atri andiam con il cuore ringraziam nel suo tempio entriam perche questo giorno e ormai giunto sacerdozio regale noi siam rit e il giorno che ha fatio il signor per noi di gioia noi esultiam 394',type:'N',i:426},
{n:'395',t:'SPALANCA LE TUE PORTE',c:'SPALANCA LE TUE PORTE, GERUSALEMME,  \nFRA GLI ANGELI AVANZA IL RE DELLA GLORIA.  \nHA PRESO POSSESSO IL TUO PASTORE,  \nSIGNORE È IL SUO NOME!  \nCANTATE A LUI, O POPOLI TUTTI,  \nNOI SIAMO INVITATI ALLA MENSA DEL REGNO.   \nENTRIAMO CON GIOIA INSIEME Al SANTI,  \nÈ LUI IL SALVATORE.  \n  \nDall\'oriente all\'occidente  \nnoi veniamo al tuo altare  \ne saremo un solo corpo,  \nnoi nutriti col tuo pane. (RIT) \n  \nLode, onore e gioia grande  \nsgorghi oggi fra le genti,  \nè una festa senza fine,  \ncelebriamo il Dio d\'amore. (RIT) \n  \nGesù Cristo si è donato  \ncol suo Corpo e col suo Sangue,  \nè lui stesso nostro cibo  \nche prepara l\'eternità. (RIT) \n \n \n  396 -',s:'spalanca le tue porte spalanca le tue porte gerusalemme fra gli angeli avanza il re della gloria ha preso possesso il tuo pastore signore e il suo nome cantate a lui o popoli tutti noi siamo invitati alla mensa del regno entriamo con gioia insieme al santi e lui il salvatore dall oriente all occidente noi veniamo al tuo altare e saremo un solo corpo noi nutriti col tuo pane rit lode onore e gioia grande sgorghi oggi fra le genti e una festa senza fine celebriamo il dio d amore rit gesu cristo si e donato col suo corpo e col suo sangue e lui stesso nostro cibo che prepara l eternita rit 396 395',type:'N',i:427},
{n:'396',t:'KYRIE ELEISON',c:'Kyrie, eleison, Kyrie, eleison.  \nChriste, eleison, Christe, eleison.   \nKyrie, eleison, Kyrie, eleison.',s:'kyrie eleison kyrie eleison kyrie eleison christe eleison christe eleison kyrie eleison kyrie eleison 396',type:'N',i:428},
{n:'397',t:'GLORIA',c:'Gloria a Dio nell\'alto dei cieli  \ne pace in terra  agli uomini amati dal Signore.  \nNoi ti lodiamo, ti benediciamo,  .  \nti adoriamo, ti glorifichiamo,  \nti rendiamo grazie per la tua gloria immensa,  \nSignore Dio, re del cielo,  \nDio Padre onnipotente. \n \nSignore, Figlio unigenito, Gesù Cristo,  \nSignore, Dio, Agnello di Dio,   \nFiglio del Padre,  \ntu che togli i peccati del mondo,  \nabbi pietà di noi;  \ntu che togli i peccati del mondo,  \naccogli la nostra supplica;  \ntu che siedi alla destra del Padre,  \nabbi pietà di noi.  \n \nPerché tu solo il Santo, tu solo il Signore,  \ntu solo l\'Altissimo, Gesù Cristo,  \ncon lo Spirito Santo   \nnella gloria di Dio  Padre.   \nAmen, a \nmen.',s:'gloria gloria a dio nell alto dei cieli e pace in terra agli uomini amati dal signore noi ti lodiamo ti benediciamo ti adoriamo ti glorifichiamo ti rendiamo grazie per la tua gloria immensa signore dio re del cielo dio padre onnipotente signore figlio unigenito gesu cristo signore dio agnello di dio figlio del padre tu che togli i peccati del mondo abbi pieta di noi tu che togli i peccati del mondo accogli la nostra supplica tu che siedi alla destra del padre abbi pieta di noi perche tu solo il santo tu solo il signore tu solo l altissimo gesu cristo con lo spirito santo nella gloria di dio padre amen a men 397',type:'N',i:429},
{n:'398',t:'SALMO RESPONSORIALE',c:'LODA IL SIGNORE, GERUSALEMME  \n  \nCelebra il Signore, Gerusalemme,  \nloda il tuo Dio, Sian,  \nperché ha rinforzato le sbarre delle tue porte,  \nin mezzo a te ha benedetto i tuoi figli (RIT) \n  \nEgli mette pace nei tuoi confini  \ne ti sazia con fiore di frumento.  \nManda sulla terra il suo messaggio:  \nla sua parola corre veloce. (RIT) \n  \nAnnuncia a Giacobbe la sua parola,  \n\ni suoi decreti e i suoi giudizi a Israele.  \nCosì non ha fatto con nessun\'altra nazione,  \nnon ha fatto conoscere loro i suoi giudizi. (RIT) \n \n  \n  399 -',s:'salmo responsoriale loda il signore gerusalemme celebra il signore gerusalemme loda il tuo dio sian perche ha rinforzato le sbarre delle tue porte in mezzo a te ha benedetto i tuoi figli rit egli mette pace nei tuoi confini e ti sazia con fiore di frumento manda sulla terra il suo messaggio la sua parola corre veloce rit annuncia a giacobbe la sua parola i suoi decreti e i suoi giudizi a israele cosi non ha fatto con nessun altra nazione non ha fatto conoscere loro i suoi giudizi rit 399 398',type:'N',i:430},
{n:'399',t:'ALLELUIA (Io sono il Pane vivo)',c:'ALLELUIA, ALLELUIA, ALLELUIA, ALLELUIA.  \nALLELUIA, ALLELUIA, ALLELUIA, ALLELUIA.  \n  \nIo sono il pane vivo disceso dal cielo,  \nchi mangia questo pane vivrà in eterno. (RIT) \n  \n  \n 400 -',s:'alleluia io sono il pane vivo alleluia alleluia alleluia alleluia alleluia alleluia alleluia alleluia io sono il pane vivo disceso dal cielo chi mangia questo pane vivra in eterno rit 400 399',type:'N',i:431},
{n:'400',t:'SANTI PER TE',c:'Camminiamo, Signore, alla tua presenza,    \nalzeremo il calice della salvezza.  \nInvochiamo il tuo santo Nome,   \nbenedici,  Signore, tuoi figli. \n  \nLA NOSTRA OFFERTA A TE  PRESENTIAMO,  \nIN MEMORIA DEL TUO SACRIFICIO.  \nSAREMO SANTI PER IL NOSTRO DIO,  \nED IL TUO NOME PER SEMPRE INNALZEREMO.  \n  \nI tuoi figli ritornano a te, Padre buono,  \nhai cancellato ogni tristezza.  \nUn sacrificio di lode noi ti offriamo,  \nbenedetto sei tu, o Signore. (RIT) \n  \nSAREMO SANTI PER IL NOSTRO DIO,  \nED IL TUO NOME PER SEMPRE INNALZEREMO.',s:'santi per te camminiamo signore alla tua presenza alzeremo il calice della salvezza invochiamo il tuo santo nome benedici signore tuoi figli la nostra offerta a te presentiamo in memoria del tuo sacrificio saremo santi per il nostro dio ed il tuo nome per sempre innalzeremo i tuoi figli ritornano a te padre buono hai cancellato ogni tristezza un sacrificio di lode noi ti offriamo benedetto sei tu o signore rit saremo santi per il nostro dio ed il tuo nome per sempre innalzeremo 400',type:'N',i:432},
{n:'401',t:'SANTO',c:'Santo, Santo, Santo  \nil Signore Dio dell\'universo.  \nI cieli e la terra  \nsono pieni della tua gloria.  \n  \nOsanna, osanna,  \nosanna nell\'alto dei cieli.  \n  \nBenedetto colui che viene  \nnel nome del Signore.  \n\n  \nOsanna, osanna,  \nosanna nell\'alto dei cieli.  \nOsanna, osanna,  \nosanna nell\'alto dei cieli.',s:'santo santo santo santo il signore dio dell universo i cieli e la terra sono pieni della tua gloria osanna osanna osanna nell alto dei cieli benedetto colui che viene nel nome del signore osanna osanna osanna nell alto dei cieli osanna osanna osanna nell alto dei cieli 401',type:'N',i:433},
{n:'402',t:'ACCLAMAZIONI PER LA PREGHIERA EUCARISTICA',c:'- ANNUNCIAMO  \n \nMistero della fede.  \nAnnunziamo la tua morte, Signore,  \nproclamiamo la tua risurrezione,    \nnell\'attesa della tua venuta.  \n  \n   - TUO È IL REGNO  \n \nTuo è il regno,  \ntua la potenza  \ne la gloria nei secoli.  \n \n   - AMEN  \n \nAmen, amen, amen. \nAmen.',s:'acclamazioni per la preghiera eucaristica annunciamo mistero della fede annunziamo la tua morte signore proclamiamo la tua risurrezione nell attesa della tua venuta tuo e il regno tuo e il regno tua la potenza e la gloria nei secoli amen amen amen amen amen 402',type:'N',i:434},
{n:'403',t:'AGNELLO DI DIO',c:'Agnello di Dio  \nche togli i peccati del mondo,  \nabbi pietà di noi.  \n  \nAgnello di Dio  \nche togli i peccati del mondo,  \nabbi pietà di noi.  \n  \nAgnello di Dio  \nche togli i peccati del mondo,  \ndona a noi la pace.',s:'agnello di dio agnello di dio che togli i peccati del mondo abbi pieta di noi agnello di dio che togli i peccati del mondo abbi pieta di noi agnello di dio che togli i peccati del mondo dona a noi la pace 403',type:'N',i:435},
{n:'404',t:'VENIAMO A TE',c:'Noi veniamo al tuo altare,  \ntu ci chiami alla tua presenza,  \n\npane vivo ci doni, Signore,  \nsei respiro per l\'anima stanca.  \nCome sposa che attende lo Sposo  \nalle nozze noi siamo invitati,  \nsei per noi quella lampada accesa  \nche rischiara il buio del mondo. \nSenza te non troviamo dimora,  \ntu sei forza, rifugio sicuro.  \n \nVENIAMO A TE, INSIEME VENIAMO A TE,  \nQUESTO È IL TUO CORPO SPEZZATO PER NOI,  \nQUESTO È IL TUO SANGUE VERSATO PER NOI.  \nVENIAMO A TE, VENIAMO A TE.  \n  \nTu da sempre ci attendi, Signore,   \nanche quando vaghiamo nel mondo,   \ncome un passero cerca la strada  \nper volare in un nido sicuro.   \nSiamo terra deserta, senz\'acqua, \n noi veniamo a cercare ristoro,   \nsolo tu sei sorgente che sgorga,  \nacqua viva che placa ogni sete.  \nDal tuo cuore trafitto ci doni  \ncome un fiume la tua salvezza.  (RIT) \n  \nSiamo indegni tuoi figli, Signore,  \ndi venire a questa tua mensa  \nper un grande mistero d\'amore,  \nnelle mani ci metti il tuo Corpo.   \nTi lodiamo, o Padre del cielo,  \nper il dono prezioso del Figlio,   \ncustodiscici nel tuo Nome  \nsiamo un corpo uniti nel Cristo,  \nfa\' di noi un cuor solo in lui  \ne saremo un unico pane. (RIT)',s:'veniamo a te noi veniamo al tuo altare tu ci chiami alla tua presenza pane vivo ci doni signore sei respiro per l anima stanca come sposa che attende lo sposo alle nozze noi siamo invitati sei per noi quella lampada accesa che rischiara il buio del mondo senza te non troviamo dimora tu sei forza rifugio sicuro veniamo a te insieme veniamo a te questo e il tuo corpo spezzato per noi questo e il tuo sangue versato per noi veniamo a te veniamo a te tu da sempre ci attendi signore anche quando vaghiamo nel mondo come un passero cerca la strada per volare in un nido sicuro siamo terra deserta senz acqua noi veniamo a cercare ristoro solo tu sei sorgente che sgorga acqua viva che placa ogni sete dal tuo cuore trafitto ci doni come un fiume la tua salvezza rit siamo indegni tuoi figli signore di venire a questa tua mensa per un grande mistero d amore nelle mani ci metti il tuo corpo ti lodiamo o padre del cielo per il dono prezioso del figlio custodiscici nel tuo nome siamo un corpo uniti nel cristo fa di noi un cuor solo in lui e saremo un unico pane rit 404',type:'N',i:436},
{n:'405',t:'SORGENTE DI SALVEZZA',c:'TU SEI PER NOI SORGENTE DI SALVEZZA  \nA TE VENIAMO, SIGNORE NOSTRA VITA.  \nTU SEI LA FONTE CHE SGORGA NEL DESERTO,   \nSEI TU IL PANE DI VITA ETERNA.  \n  \nPane spezzato per un mondo nuovo,  \na noi donato per l\'eternità. (RIT)  \n  \n\nPane di vita, Corpo risorto,  \ntu Dio fedele per l\'umanità. (RIT)  \n  \nLuce tu sei che brilla nella notte,  \nsei tu la Via che conduce al Regno. (RIT) \n  \nForza più forte della nostra morte,  \nsei tu, Signore, la risurrezione. (RIT)  \n  \nResta con noi, tu sei gioia vera,  \nnoi canteremo questo tuo mistero. (RIT)',s:'sorgente di salvezza tu sei per noi sorgente di salvezza a te veniamo signore nostra vita tu sei la fonte che sgorga nel deserto sei tu il pane di vita eterna pane spezzato per un mondo nuovo a noi donato per l eternita rit pane di vita corpo risorto tu dio fedele per l umanita rit luce tu sei che brilla nella notte sei tu la via che conduce al regno rit forza piu forte della nostra morte sei tu signore la risurrezione rit resta con noi tu sei gioia vera noi canteremo questo tuo mistero rit 405',type:'N',i:437},
{n:'406',t:'GESÙ CRISTO È IL SIGNORE',c:'Nel cammino della vita  \nci accompagna la tua grazia,  \nè la tua presenza viva,  \nPadre Santo, Dio d\'amore.  \n \nPER LE STRADE DEL MONDO  \nANNUNZIEREMO IL TUO NOME,  \nPORTEREMO IL TUO AMORE,   \nPROCLAMEREMO LA VERITÀ:  \nGESÙ CRISTO È IL SIGNORE.  \n  \nNegli afflitti e nei malati  \nnoi vogliamo sempre amarti  \ne nei poveri servirti,  \nGesù Cristo, tu il Vivente. (RIT) \n  \nNel cammino verso il Regno,  \ntu sei luce che risplende,  \ntu sei Spirito creatore,  \ntu il fuoco, tu l\'amore. (RIT)',s:'gesu cristo e il signore nel cammino della vita ci accompagna la tua grazia e la tua presenza viva padre santo dio d amore per le strade del mondo annunzieremo il tuo nome porteremo il tuo amore proclameremo la verita gesu cristo e il signore negli afflitti e nei malati noi vogliamo sempre amarti e nei poveri servirti gesu cristo tu il vivente rit nel cammino verso il regno tu sei luce che risplende tu sei spirito creatore tu il fuoco tu l amore rit 406',type:'N',i:438},
{n:'407',t:'APRI I MIEI OCCHI SIGNORE',c:'APRI I MIEI OCCHI SIGNORE,  \nAPRIMI GLI OCCHI DEL CUOR,  \nVOGLIO VEDERTI, VOGLIO VEDERTI. (x2)  \n  \nVederti splendere Signor,  \nnella luce della tua gloria,  \nricolmi del tuo amor,  \ncantiamo \"Santo, Santo, Santo\".  \n\n \n(da capo)  \n  \nVederti splendere Signor,  \nnella luce della tua gloria,   \nricolmi del tuo amor,  \ncantiamo \"Santo, Santo, Santo\". (x2)  \n  \nSanto, Santo, Santo,  \nSanto, Santo, Santo,  \nSanto, Santo Santo, voglio vederti.',s:'apri i miei occhi signore apri i miei occhi signore aprimi gli occhi del cuor voglio vederti voglio vederti x2 vederti splendere signor nella luce della tua gloria ricolmi del tuo amor cantiamo santo santo santo da capo vederti splendere signor nella luce della tua gloria ricolmi del tuo amor cantiamo santo santo santo x2 santo santo santo santo santo santo santo santo santo voglio vederti 407',type:'N',i:439},
{n:'408',t:'ASCOLTA IL MIO CUORE',c:'Ascolta il mio cuore,  \nrispondi al mio grido,  \nt\'invoco nella mia povertà.  \nCustodisci i miei pensieri,  \ncon il tuo immenso amore  \nrinnova in me la tua fedeltà.  \n  \nPER TE CANTERÒ, PER TE IO VIVRÒ,  \nPERCHÉ SEI, OLTRE I CONFINI,  \nIL SIGNORE CHE VITA MI DA.  \nPER TE  \nDANZERÒ, CON TE CAMBIERÒ  \nIL MIO PIANTO NEL CANTO NUOVO  \nPERCHE VIVI IN ME,  \nSEI RISORTO E CON ME RESTERAI.  \n  \nRitorno a te mio Dio,  \naccolgo il tuo perdono,   \nla tua misericordia è per me.  \nDal profondo della terra  \nmi hai chiamato a nuova vita,  \nper sempre grazie ti renderò. (RIT) \n \n(coda facoltativa) \n  \nPER TE CANTERÒ, PER TE IO VIVRÒ,   \nPER TE CANTERÒ, PER TE IO VIVRÒ.  \nPER TE DANZERÒ, CON TE CAMBIERÒ,  \nPER TE DANZERÒ, CON TE CAMBIERÒ,  \nPERCHE\' SEI, OLTRE I CONFINI \nIL SIGNORE CHE VITA MI DA\' \nPER TE DANZERÒ, CON TE CAMBIERÒ, \nIL  MIO PIANTO NEL CANTO NUOVO \n\nPERCHE\' VIVI IN ME  \nSEI RISORTO E CON ME RESTERAI.',s:'ascolta il mio cuore ascolta il mio cuore rispondi al mio grido t invoco nella mia poverta custodisci i miei pensieri con il tuo immenso amore rinnova in me la tua fedelta per te cantero per te io vivro perche sei oltre i confini il signore che vita mi da per te danzero con te cambiero il mio pianto nel canto nuovo perche vivi in me sei risorto e con me resterai ritorno a te mio dio accolgo il tuo perdono la tua misericordia e per me dal profondo della terra mi hai chiamato a nuova vita per sempre grazie ti rendero rit coda facoltativa per te cantero per te io vivro per te cantero per te io vivro per te danzero con te cambiero per te danzero con te cambiero perche sei oltre i confini il signore che vita mi da per te danzero con te cambiero il mio pianto nel canto nuovo perche vivi in me sei risorto e con me resterai 408',type:'N',i:440},
{n:'409',t:'ASCOLTA LA NOSTRA LODE',c:'Danzeremo nel tuo nome,  \nper le strade esulteremo,  \ncostruiremo la tua pace,  \nche ogni uomo invochi Dio. \n  \nLA NEI CIELI E SULLA TERRA  \n QUESTO CANTO  \nGIUNGERÀ,  \nLA SUI MONTI E PER LE VALLI  \nQUESTA LODE CORRERÀ.  \n  \nSplenderemo nella fede  \ncamminando insieme a te,   \ndalla Croce che ci guida  \nla tua gloria brillerà. (RIT) \n  \nAlleluia, alleluia, alleluia, alleluia. (x6) \n \n(RIT) (x2) \n  \n  410 -',s:'ascolta la nostra lode danzeremo nel tuo nome per le strade esulteremo costruiremo la tua pace che ogni uomo invochi dio la nei cieli e sulla terra questo canto giungera la sui monti e per le valli questa lode correra splenderemo nella fede camminando insieme a te dalla croce che ci guida la tua gloria brillera rit alleluia alleluia alleluia alleluia x6 rit x2 410 409',type:'N',i:441},
{n:'410',t:'BENEDICI IL SIGNORE ANIMA MIA',c:'BENEDICI IL SIGNORE ANIMA MIA,  \nBENEDICI IL SIGNORE ANIMA MIA.   \nTU CHE SEI RIVESTITO  \nDI MAESTÀ E DI SPLENDORE  \nSEI TANTO GRANDE  \nSIGNORE MIO DIO.  \n \nVoglio cantare al mio Signore  \nfinché avrò vita,  \nlodare sempre,  \ninneggiare a lui finché esisto.  \nGli sia gradito il mio canto  \ne gioirò per sempre nel Signore. (RIT) \n  \nTu fai dei fulmini  \ne dei venti i tuoi messaggeri,   \ntu costruisci sulle acque le tue dimore.  \nEcco i tuoi mari, i tuoi monti  \ne con il frutto sazi la tua terra. (RIT) \n  \n\nTu che t\'illumini di luce come di un manto,   \ntu che distendi tutti i cieli come una tenda.   \nFai delle nubi il tuo carro,  \ncammini sulle ali del vento (RIT)',s:'benedici il signore anima mia benedici il signore anima mia benedici il signore anima mia tu che sei rivestito di maesta e di splendore sei tanto grande signore mio dio voglio cantare al mio signore finche avro vita lodare sempre inneggiare a lui finche esisto gli sia gradito il mio canto e gioiro per sempre nel signore rit tu fai dei fulmini e dei venti i tuoi messaggeri tu costruisci sulle acque le tue dimore ecco i tuoi mari i tuoi monti e con il frutto sazi la tua terra rit tu che t illumini di luce come di un manto tu che distendi tutti i cieli come una tenda fai delle nubi il tuo carro cammini sulle ali del vento rit 410',type:'N',i:442},
{n:'411',t:'CANTANO I CIELI',c:'Noi non possiamo più tacere  \nquello che abbiamo ascoltato e visto.  \nLe opere che abbiamo veduto tra noi  \ndicono al mondo: il Signore è vivo!  \n  \nCANTANO I CIELI LE TUE MERAVIGLIE, O DIO, \nGLI ANGELI ESALTANO IN CORO LA TUA FEDELTÀ.   \nO SIGNOR, QUALE DIO SARÀ MAI COME TE?  \nBEATO IL POPOLO CHE SA ACCLAMARTI O DIO,  \nAL TUO NOME INNEGGIA CON LODI D\'AMOR.  \nO SIGNOR, QUALE DIO SARÀ MAI COME TE?  \n  \nVolgi il tuo sguardo ai tuoi figli,  \nfa\' che annunciamo la tua Parola.   \nStendi la tua mano potente su noi,  \ncompi ancora grandi prodigi e segni. (RIT) \n  \nTutta la terra ti appartiene,  \nsei il Dio dell\'Universo intero,  \neppure sei disceso dal cielo per noi,  \nper donarci vita e salvezza eterna. (RIT) \n  \n  \nCANTANO I CIELI,  \nLE TUE MERAVIGLIE,  \nCANTANO I CIELI,  \nLE TUE MERAVIGLIE.  \nO SIGNOR, QUALE DIO SARÀ MAI COME TE?  \n  \nBEATO IL POPOLO CHE SA ACCLAMARTI O DIO,  \n \nAL TUO NOME INNEGGIA CON LODI D\'AMOR.  \nO SIGNOR, QUALE DIO SARÀ MAI COME TE?',s:'cantano i cieli noi non possiamo piu tacere quello che abbiamo ascoltato e visto le opere che abbiamo veduto tra noi dicono al mondo il signore e vivo cantano i cieli le tue meraviglie o dio gli angeli esaltano in coro la tua fedelta o signor quale dio sara mai come te beato il popolo che sa acclamarti o dio al tuo nome inneggia con lodi d amor o signor quale dio sara mai come te volgi il tuo sguardo ai tuoi figli fa che annunciamo la tua parola stendi la tua mano potente su noi compi ancora grandi prodigi e segni rit tutta la terra ti appartiene sei il dio dell universo intero eppure sei disceso dal cielo per noi per donarci vita e salvezza eterna rit cantano i cieli le tue meraviglie cantano i cieli le tue meraviglie o signor quale dio sara mai come te beato il popolo che sa acclamarti o dio al tuo nome inneggia con lodi d amor o signor quale dio sara mai come te 411',type:'N',i:443},
{n:'412',t:'DIO TU SEI BUONO',c:'Dio tu sei buono  \ne la tua fedeltà è per sempre. (x2)     \n \n\nPopoli di ogni diversa nazione,  \ncultura, lingua e generazione.  \n  \nLODIAMO TE, ALLELUIA, ALLELUIA,  \nLODIAMO TE, PER QUELLO CHE SEI;  \nLODIAMO TE, ALLELUIA, ALLELUIA,  \nLODIAMO TE, PER QUELLO CHE SEI,  \nPERCHÉ SEI IL RE.  \n \n(da capo) \n  \nTu sei il Signor, buono sei,  \ngrande Dio, il Re dei re.  \nTu sei il Signor, buono sei,  \ngrande Dio, il Re dei re,   \nil Re dei re.  \nIl Re dei re.  \n  \nDio tu sei buono  \ne la tua fedeltà è per sempre. (x4)  \n \nPopoli di ogni diversa nazione,  \ncultura, lingua e generazione.  \n \nLODIAMO TE, ALLELUIA, ALLELUIA,  \nLODIAMO TE, PER QUELLO CHE SEI;  \nLODIAMO TE, ALLELUIA, ALLELUIA,  \nLODIAMO TE, PER QUELLO CHE SEI.(x2)  \n  \nPER QUELLO CHE SEI,  \nPER QUELLO CHE SEI,  \nPERCHÉ SEI IL RE!',s:'dio tu sei buono dio tu sei buono e la tua fedelta e per sempre x2 popoli di ogni diversa nazione cultura lingua e generazione lodiamo te alleluia alleluia lodiamo te per quello che sei lodiamo te alleluia alleluia lodiamo te per quello che sei perche sei il re da capo tu sei il signor buono sei grande dio il re dei re tu sei il signor buono sei grande dio il re dei re il re dei re il re dei re dio tu sei buono e la tua fedelta e per sempre x4 popoli di ogni diversa nazione cultura lingua e generazione lodiamo te alleluia alleluia lodiamo te per quello che sei lodiamo te alleluia alleluia lodiamo te per quello che sei x2 per quello che sei per quello che sei perche sei il re 412',type:'N',i:444},
{n:'413',t:'GRAZIE',c:'Siamo cresciuti sotto l\'ombra delle tue ali,  \nabbiamo visto grande l\'opera delle tue mani  \ned imparato ad amare la vita e i fratelli,  \ntutti insieme alla scuola della tua Parola.  \n  \nCon il tuo Spirito ci hai dato grazia e carismi  \nper regalarci un cammino di vita nuova,  \ne quanti poi si son sentiti chiamati per nome   \nlasciando tutto per servirti nella tua santa Chiesa.  \n \nSIGNORE GRAZIE, PER QUESTA STORIA D\'AMORE,  \n\nPER L\'ALLEANZA DI PACE CHE HAI VOLUTO PROPRIO CON NOI.  \nRINNOVACI NELLO SPIRITO SANTO,  \nCARITÀ ETERNA, VINCOLO DI QUESTA FAMIGLIA.   \nGRAZIE SIGNOR, GRAZIE SIGNOR,  \nGRAZIE SIGNOR, GRAZIE SIGNOR.  \n  \nHai fatto nascere tra noi nuove famiglie,   \ni nostri figli son cresciuti tra le tue lodi,  \ne quanti giovani hai chiamato a offrirti la vita,   \nad impegnarsi con coraggio per il tuo Vangelo.  \n  \nNuove missioni e nuovi sogni ci hai affidato   \nperché vivessimo pregando e amando chi soffre,  \nriconoscendo in mezzo a noi chi è povero e oppresso  \ne mettendo in comune ogni nostra ricchezza. (RIT)  \n \nHai chiamato col tuo amore uomini e donne   \nche con gioia a tutti noi si sono donati,  \nci hanno servito e guidato in questo cammino come Gesù,   \npastore buono che ha dato la vita.  \n  \nQuesta grazia si è diffusa in tutto il mondo,   \nil tuo amore ha liberato, guarito e salvato.   \nLa speranza in te Signore vivo e operante  \nsi è riaccesa in tutti noi come luce all\'aurora. (RIT)',s:'grazie siamo cresciuti sotto l ombra delle tue ali abbiamo visto grande l opera delle tue mani ed imparato ad amare la vita e i fratelli tutti insieme alla scuola della tua parola con il tuo spirito ci hai dato grazia e carismi per regalarci un cammino di vita nuova e quanti poi si son sentiti chiamati per nome lasciando tutto per servirti nella tua santa chiesa signore grazie per questa storia d amore per l alleanza di pace che hai voluto proprio con noi rinnovaci nello spirito santo carita eterna vincolo di questa famiglia grazie signor grazie signor grazie signor grazie signor hai fatto nascere tra noi nuove famiglie i nostri figli son cresciuti tra le tue lodi e quanti giovani hai chiamato a offrirti la vita ad impegnarsi con coraggio per il tuo vangelo nuove missioni e nuovi sogni ci hai affidato perche vivessimo pregando e amando chi soffre riconoscendo in mezzo a noi chi e povero e oppresso e mettendo in comune ogni nostra ricchezza rit hai chiamato col tuo amore uomini e donne che con gioia a tutti noi si sono donati ci hanno servito e guidato in questo cammino come gesu pastore buono che ha dato la vita questa grazia si e diffusa in tutto il mondo il tuo amore ha liberato guarito e salvato la speranza in te signore vivo e operante si e riaccesa in tutti noi come luce all aurora rit 413',type:'N',i:445},
{n:'414',t:'IL CANTO DI UN POPOLO NUOVO',c:'Sentiamo il canto di un popolo nuovo  \ne dal profondo s\'innalza una lode,  \nè il giorno che gioia ci dà.  \n  \nAbbiam ricevuto lo Spirito Santo,   \nrinati alla vita leviamo lo sguardo,  \nè il giorno che gioia ci dà.  \n \nCantiamo insieme, è il re Gesù,  \nè lui il creatore,  noi siamo suoi.  \nPer sempre regna, cantiamo a lui,  \nraggianti noi guardiamo a lui.  \n  \nNAZIONE SANTA CHE TU HAI CHIAMATO, (LODE A TE)  \nSIAMO I PROFETI, LA STIRPE REGALE,  \nIL POPOLO UNITO CHE AMA E LODA IL SIGNORE. (PER SEMPRE IL SIGNORE REGNERÀ  \nTUTTO IL CREATO È NELLE SUE MANI, (LODE A TE)  \nEGLI È RISORTO NOI SIAMO SALVATI,  \n\nCOSÌ GRAZIA  E POTENZA ABBIAM,  \nPER LUI,CON LUI,IN LUI VIVIAM!  \n \nHai fatto il mondo da terra e deserto,   \nci hai dato vita e creato dal nulla,  \nè il giorno che gioia ci dà.  \n \nLì nelle valli del nostro dolore,   \ntu vivi con noi e ci porti alla luce,  \n  \nè il giorno che gioia ci dà.  \n \nCantiamo insieme, è il re Gesù,  \nè lui il creatore, noi siamo suoi.   \nPer sempre regna, cantiamo a lui,  \nraggianti noi guardiamo a lui. (RIT)',s:'il canto di un popolo nuovo sentiamo il canto di un popolo nuovo e dal profondo s innalza una lode e il giorno che gioia ci da abbiam ricevuto lo spirito santo rinati alla vita leviamo lo sguardo e il giorno che gioia ci da cantiamo insieme e il re gesu e lui il creatore noi siamo suoi per sempre regna cantiamo a lui raggianti noi guardiamo a lui nazione santa che tu hai chiamato lode a te siamo i profeti la stirpe regale il popolo unito che ama e loda il signore per sempre il signore regnera tutto il creato e nelle sue mani lode a te egli e risorto noi siamo salvati cosi grazia e potenza abbiam per lui con lui in lui viviam hai fatto il mondo da terra e deserto ci hai dato vita e creato dal nulla e il giorno che gioia ci da li nelle valli del nostro dolore tu vivi con noi e ci porti alla luce e il giorno che gioia ci da cantiamo insieme e il re gesu e lui il creatore noi siamo suoi per sempre regna cantiamo a lui raggianti noi guardiamo a lui rit 414',type:'N',i:446},
{n:'415',t:'LA MIA PREGHIERA ELEVO A TE',c:'La mia preghiera elevo a te  \nche sei l\'immenso amore,  \nsei il Dio dell\'impossibile.  \nSe questa bocca griderà,  \nse questo cuore invocherà,  \nio so che ascolterai.  \n \nDIO LA MIA VOCE SALE AL CIELO,  \nDIO TI PREGO AGISCI TU,  \nMIO DIO,L\'UOMO CHE CONFIDA IN TE NON È DELUSO,  \nSE TUTTO SEMBRA PERSO INNALZO Gli OCCHI AL CIELO.  \nDIO SO CHE NULLA POSSO IO,  \nDIO OGNICOSA AFFIDO A TE,  \nMIO DIO SPERO NELLA TUA BONTÀ,  \nTU FAI PRODIGI, TU FAI MIRACOLI, AGISCI TU.  \n  \nLa mia speranza è solo in te,  \nperché fedele Dio tu sei,  \nso che non mi abbandonerai.  \nSe questa bocca griderà,  \nse questo cuore invocherà,  \nio so che ascolterai. (RIT)',s:'la mia preghiera elevo a te la mia preghiera elevo a te che sei l immenso amore sei il dio dell impossibile se questa bocca gridera se questo cuore invochera io so che ascolterai dio la mia voce sale al cielo dio ti prego agisci tu mio dio l uomo che confida in te non e deluso se tutto sembra perso innalzo gli occhi al cielo dio so che nulla posso io dio ognicosa affido a te mio dio spero nella tua bonta tu fai prodigi tu fai miracoli agisci tu la mia speranza e solo in te perche fedele dio tu sei so che non mi abbandonerai se questa bocca gridera se questo cuore invochera io so che ascolterai rit 415',type:'N',i:447},
{n:'416',t:'LODE AL NOME TUO',c:'Lode al nome tuo,  \n\ndalle terre più floride,  \ndove tutto sembra vivere,  \nlode al nome tuo.  \n  \nLode al nome tuo,  \ndalle terre più aride,   \ndove tutto sembra sterile,  \nlode al nome tuo.  \n  \nTornerò a lodarti sempre,  \nper ogni dono tuo,  \ne quando scenderà la notte  \nsempre io dirò:  \n  \nBENEDETTO È IL NOME DEL SIGNOR,  \nLODE AL NOME TUO.  \nBENEDETTO È IL NOME DEL SIGNOR,  \nIL GLORIOSO NOME DI GESÙ.  \n \nLode al nome tuo,  \nquando il sole splende su di me,   \nquando tutto è incantevole,  \nlode al nome tuo.  \n  \nLode al nome tuo,  \nquando io sto davanti a te,   \ncon il cuore triste e fragile,  \nlode al nome tuo.  \n \nTornerò a lodarti sempre,  \nper ogni dono tuo,  \ne quando scenderà la notte  \nsempre io dirò:  (RIT)  \n \nTu doni e porti via, tu doni e porti via,  \nma sempre sceglierò di benedire te. (x2)  \n  \nTornerò a lodarti sempre,  \nper ogni dono tuo,  \ne quando scenderà la notte  \nsempre io dirò:  (RIT)',s:'lode al nome tuo lode al nome tuo dalle terre piu floride dove tutto sembra vivere lode al nome tuo lode al nome tuo dalle terre piu aride dove tutto sembra sterile lode al nome tuo tornero a lodarti sempre per ogni dono tuo e quando scendera la notte sempre io diro benedetto e il nome del signor lode al nome tuo benedetto e il nome del signor il glorioso nome di gesu lode al nome tuo quando il sole splende su di me quando tutto e incantevole lode al nome tuo lode al nome tuo quando io sto davanti a te con il cuore triste e fragile lode al nome tuo tornero a lodarti sempre per ogni dono tuo e quando scendera la notte sempre io diro rit tu doni e porti via tu doni e porti via ma sempre scegliero di benedire te x2 tornero a lodarti sempre per ogni dono tuo e quando scendera la notte sempre io diro rit 416',type:'N',i:448},
{n:'417',t:'LODERANNO I POPOLI',c:'Loderanno i popoli la tua santità,  \ngrideranno gli uomini la tua fedeltà. (lode a te)  \n\nGuariranno i deboli dalle infermità, (lode a te)   \ngioiranno gli ultimi per la tua bontà. (per la tua bontà)  \n  \nDAVANTI A TE  \n(DAVANTI A TE)  \nSI PROSTRERANNO POPOLI E GENTI PER L\'ETERNITÀ,  \nTU REGNERAI (TU REGNERAI) SUL MONDO IN FESTA,  \nGRANDE SIGNORE SU TUTTI GLI DEI.  \nGRANDE SIGNORE TU REGNERAI.  \n  \nOgni nostra lacrima certo asciugherai,   \ndal buio delle tenebre ci libererai. (lode a te) \nCieli e terre nuove tu ci mostrerai, (lode a te)  \ndi un\'aurora eterna c\'illuminerai. (c\'illuminerai) \n \n(RIT)  \n  \nSplenderanno i giusti nella verità,   \ncanteranno gli angeli la tua regalità. (lode a te)  \nGusteranno i martiri la tua eredità, (lode a te)  \nbrilleranno i santi dell\'umanità. (dell\'umanità)   \n \n(RIT) \n \n(coda facoltativa) \n \nDAVANTI A TE (DAVANTI A TE)  \nSI PROSTRERANNO POPOLI E GENTI PER L\'ETERNITÀ.     \nDAVANTI A TE  \nSI PROSTRERANNO POPOLI E GENTI PER L\'ETERNITÀ.  \nDAVANTI A TE (DAVANTI A TE)  \nSI PROSTRERANNO POPOLI E GENTI PER L\'ETERNITÀ.',s:'loderanno i popoli loderanno i popoli la tua santita grideranno gli uomini la tua fedelta lode a te guariranno i deboli dalle infermita lode a te gioiranno gli ultimi per la tua bonta per la tua bonta davanti a te davanti a te si prostreranno popoli e genti per l eternita tu regnerai tu regnerai sul mondo in festa grande signore su tutti gli dei grande signore tu regnerai ogni nostra lacrima certo asciugherai dal buio delle tenebre ci libererai lode a te cieli e terre nuove tu ci mostrerai lode a te di un aurora eterna c illuminerai c illuminerai rit splenderanno i giusti nella verita canteranno gli angeli la tua regalita lode a te gusteranno i martiri la tua eredita lode a te brilleranno i santi dell umanita dell umanita rit coda facoltativa davanti a te davanti a te si prostreranno popoli e genti per l eternita davanti a te si prostreranno popoli e genti per l eternita davanti a te davanti a te si prostreranno popoli e genti per l eternita 417',type:'N',i:449},
{n:'418',t:'VOGLIO ADORARE TE',c:'VOGLIO ADORARE TE, VOGLIO ADORARE TE,  \nVOGLIO ADORARE TE, SIGNOR, SOLO TE.  \nVOGLIO ADORARE TE, VOGLIO ADORARE TE,  \nVOGLIO ADORARE TE, SIGNOR, SOLO TE.  \n  \nNella gioia e nel dolore,  \nnell\'affanno della vita,  \nquando sono senza forze, adoro te.  \nNella pace e nell\'angoscia,  \nnella prova della croce,  \nquando ho sete del tuo amore,  \n\nadoro te Signore. (RIT) \n  \nNel coraggio e nel timore,  \nnel tormento del peccato,   \nquando il cuore mio vacilla, adoro te.  \n  \nNella fede e nella grazia,  \nnello zelo per il Regno,   \nquando esulto nel tuo nome,  \nadoro te Signore. (RIT) (x2)',s:'voglio adorare te voglio adorare te voglio adorare te voglio adorare te signor solo te voglio adorare te voglio adorare te voglio adorare te signor solo te nella gioia e nel dolore nell affanno della vita quando sono senza forze adoro te nella pace e nell angoscia nella prova della croce quando ho sete del tuo amore adoro te signore rit nel coraggio e nel timore nel tormento del peccato quando il cuore mio vacilla adoro te nella fede e nella grazia nello zelo per il regno quando esulto nel tuo nome adoro te signore rit x2 418',type:'N',i:450},
{n:'419',t:'ABBRACCIAMI',c:'Gesù parola viva e vera,  \nsorgente che disseta e cura ogni ferita,  \nferma su di me i tuoi occhi,  \nla tua mano stendi e donami la vita.  \n  \nABBRACCIAMI DIO DELL\'ETERNITÀ,  \nRIFUGIO DELL\'ANIMA,  \nGRAZIA CHE OPERA,  \nRISCALDAMI FUOCO CHE LIBERA,  \nMANDA Il TUO SPIRITO  \nMARANATHA GESU.  \n  \nGesù asciuga il nostro pianto,  \nleone vincitore della tribù di Giuda,  \nvieni nella tua potenza,  \nquesto cuore sciogli con ogni sua paura. (RIT)  \n  \nPer sempre io canterò  \nla tua immensa fedeltà,  \nil tuo Spirito in me   \nin eterno ti loderà.  \nPer sempre io canterò  \nla tua immensa fedeltà,  \nil tuo Spirito in me  \nin eterno ti loderà.  \n \nABBRACCIAMI DIO DELL\'ETERNITÀ,  \nRIFUGIO DELL\'ANIMA,  \nGRAZIA CHE OPERA,  \nRISCALDAMI FUOCO CHE LIBERA,  \nMANDA IL TUO SPIRITO  \nMARANATHÀ GESÙ.  \n\nRISCALDAMI FUOCO CHE LIBERA, (MANDA IL TUO SPIRITO)  \nMANDA IL TUO SPIRITO  \nMARANATHÀ GESÙ. (MARANATHÀ GESÙ)  \nRISCALDAMI FUOCO CHE LIBERA,  \nMANDA IL TUO SPIRITO  \nMARANATHA GESU. \nABBRACCIAMI.',s:'abbracciami gesu parola viva e vera sorgente che disseta e cura ogni ferita ferma su di me i tuoi occhi la tua mano stendi e donami la vita abbracciami dio dell eternita rifugio dell anima grazia che opera riscaldami fuoco che libera manda il tuo spirito maranatha gesu gesu asciuga il nostro pianto leone vincitore della tribu di giuda vieni nella tua potenza questo cuore sciogli con ogni sua paura rit per sempre io cantero la tua immensa fedelta il tuo spirito in me in eterno ti lodera per sempre io cantero la tua immensa fedelta il tuo spirito in me in eterno ti lodera abbracciami dio dell eternita rifugio dell anima grazia che opera riscaldami fuoco che libera manda il tuo spirito maranatha gesu riscaldami fuoco che libera manda il tuo spirito manda il tuo spirito maranatha gesu maranatha gesu riscaldami fuoco che libera manda il tuo spirito maranatha gesu abbracciami 419',type:'N',i:451},
{n:'420',t:'ASCOLTA QUESTE MIE PAROLE',c:'A te che sei sceso fin quaggiù  \nper lavarci dai peccati,  \nvoglio esprimere il mio amore  \ne dare lode  \n  \na te che hai voluto farti uomo  \nper portare quella croce  \nche era destinata a me,  \nsoltanto a me.  \n \nASCOLTA QUESTE MIE PAROLE   \nCHE NASCONO DAL CUORE,  \nIO TI AMO MIO SIGNORE  \nPERCHE SEI QUI CON ME.  \nMl PERDONI SE HO SBAGLIATO   \nE MI ACCETTI COME SONO,  \nÈ PER QUESTO CHE T\'INVOCO,   \nRESTA PER SEMPRE ACCANTO A ME.  \n  \nA te io confido ogni dolore  \ne lo so che puoi capire  \nperché hai sofferto come uomo,  \nio canto lode a te  \nche guarisci ogni rancore  \nnei ricordi e nel mio cuore,   \nindicandomi la strada  \nche porta a te. (RIT)  \n \nHai portato quella croce  \nche era destinata a me,  \nsoltanto a me.  \n  \nASCOLTA QUESTE MIE PAROLE  \nCHE NASCONO DAL CUORE,   \nIO TI AMO MIO SIGNORE  \nPERCHE SEI QUI CON ME.  \n\nMl PERDONI SE HO SBAGLIATO \nE MI ACCETII COME SONO,  \nÈ PER QUESTO CHE T\'INVOCO,   \nRESTA PER SEMPRE ACCANTO A ME.  \nMI PERDONI SE HO SBAGLIATO  \nE MI ACCETII COME SONO,  \nE\' PER QUESTO CHE T\'INVOCO,   \nRESTA PER SEMPRE ACCANTO A ME.',s:'ascolta queste mie parole a te che sei sceso fin quaggiu per lavarci dai peccati voglio esprimere il mio amore e dare lode a te che hai voluto farti uomo per portare quella croce che era destinata a me soltanto a me ascolta queste mie parole che nascono dal cuore io ti amo mio signore perche sei qui con me ml perdoni se ho sbagliato e mi accetti come sono e per questo che t invoco resta per sempre accanto a me a te io confido ogni dolore e lo so che puoi capire perche hai sofferto come uomo io canto lode a te che guarisci ogni rancore nei ricordi e nel mio cuore indicandomi la strada che porta a te rit hai portato quella croce che era destinata a me soltanto a me ascolta queste mie parole che nascono dal cuore io ti amo mio signore perche sei qui con me ml perdoni se ho sbagliato e mi accetii come sono e per questo che t inv {n:'421',t:'BELLO È LODARE IDDIO',c:'Bello è lodare lddio  \ne cantare al tuo nome, Re dei re,  \nproclamare la tua fedeltà,  \ngiorno e notte a te cantar.  \n  \nLAI LAI LAI...   \nLAI LAI LAI...  \n  \nGioirò dei prodigi che  \nla tua mano ha compiuto in me Signore,  \ngrandi sono le tue opere  \ne profondi i tuoi pensier.  \n \nLAI LAI LAI...  \nLAI LAI LAI...  \n \nFiorirà come il cedro che  \nè piantato nella casa del Signore,  \ntale il giusto resterà perché  \nbuono e retto è il Signore.  \n  \nLAI LAI LAI...  \nLAI LAI LAI... \nLAI LAI LAI...',s:'bello e lodare iddio bello e lodare lddio e cantare al tuo nome re dei re proclamare la tua fedelta giorno e notte a te cantar lai lai lai lai lai lai gioiro dei prodigi che la tua mano ha compiuto in me signore grandi sono le tue opere e profondi i tuoi pensier lai lai lai lai lai lai fiorira come il cedro che e piantato nella casa del signore tale il giusto restera perche buono e retto e il signore lai lai lai lai lai lai lai lai lai 421',type:'N',i:453},
{n:'422',t:'BENEDETTO SIGNORE (Cerco solo te)',c:'Cerco solo te mio Signor  \nperché solo tu dai gioia al mio cuore,  \nsi rallegra l\'anima mia  \nsolo in te, solo in te. \n  \nCerco solo te mio Signor  \nperché la tua via conduce alla vita,  \n\nsi rallegra l\'anima mia  \nsolo in te, solo in te.  \n  \nBENEDETTO SIGNORE, BENEDETTO IL TUO NOME,  \nCOME UN TENERO PADRE SEI VERSO DI ME MIO SIGNOR.  \nBENEDETTO SIGNORE, BENEDETTO IL TUO NOME,  \nDALLE TUE MANI QUESTA MIA VITA  \nRICEVE SALVEZZA ED AMOR.  \n  \nCerco solo te mio Signor  \nperché la tua grazia rimane in eterno,  \nsi rallegra l\'anima mia  \nsolo in te, solo in te.  \n  \nCerco solo te mio Signor  \nperché mi coroni di misericordia,  \nsi rallegra l\'anima mia  \nsolo in te, solo in te.  \n \nBENEDETTO  SIGNORE, BENEDETTO IL TUO NOME,  \nCOME UN TENERO PADRE SEI VERSO DI ME MIO SIGNOR.  \nBENEDETTO  SIGNORE, BENEDETTO IL TUO NOME,  \nDALLE TUE MANI QUESTA MIA VITA  \nRICEVE SALVEZZA ED AMOR. (x3)',s:'benedetto signore cerco solo te cerco solo te mio signor perche solo tu dai gioia al mio cuore si rallegra l anima mia solo in te solo in te cerco solo te mio signor perche la tua via conduce alla vita si rallegra l anima mia solo in te solo in te benedetto signore benedetto il tuo nome come un tenero padre sei verso di me mio signor benedetto signore benedetto il tuo nome dalle tue mani questa mia vita riceve salvezza ed amor cerco solo te mio signor perche la tua grazia rimane in eterno si rallegra l anima mia solo in te solo in te cerco solo te mio signor perche mi coroni di misericordia si rallegra l anima mia solo in te solo in te benedetto signore benedetto il tuo nome come un tenero padre sei verso di me mio signor benedetto signore benedetto il tuo nome dalle tue mani questa mia vita riceve salvezza ed amor x3 422',type:'N',i:454},
{n:'423',t:'GESÙ ROCCIA DI SALVEZZA',c:'GESÙ ROCCIA DI SALVEZZA  \nIN TE MI RIFUGERÒ,  \nGESÙ ROCCIA DI SALVEZZA  \nLA TUA PAROLA È SPERANZA IN ME,  \nLA TUA PAROLA È SPERANZA IN ME. (x2 SOLO QUI)  \n  \nSei la speranza in me, (sei la speranza in me) \nsei il mio futuro, (sei il mio futuro)  \nnel sogno che hai per me  (nel sogno che hai per me) \nconfiderò, confiderò. \n  \n (RIT) \n \nParola viva, (parola viva) \nvera e potente (vera e potente) \nche mi libererà, (che mi libererà) \nio credo in te, io credo in te.  \n  \n (RIT) \n\n    \nGESÙ ROCCIA DI SALVEZZA  \nIN TE MI RIFUGERÒ,  \nGESÙ ROCCIA DI SALVEZZA  \nLA TUA PAROLA È SPERANZA IN ME,   \nLA TUA PAROLA È SPERANZA IN ME.  \nGESÙ ROCCIA DI SALVEZZA  \nIN TE MI RIFUGERÒ,  \nGESÙ ROCCIA DI SALVEZZA  \nLA TUA PAROLA È SPERANZA IN ME,  \nLA TUA PAROLA È SPERANZA IN ME,   \nLA TUA PAROLA È SPERANZA IN ME.  \nROCCIA DI SALVEZZA,  \nROCCIA DI SALVEZZA TU SEI,  \nROCCIA DI SALVEZZA.',s:'gesu roccia di salvezza gesu roccia di salvezza in te mi rifugero gesu roccia di salvezza la tua parola e speranza in me la tua parola e speranza in me x2 solo qui sei la speranza in me sei la speranza in me sei il mio futuro sei il mio futuro nel sogno che hai per me nel sogno che hai per me confidero confidero rit parola viva parola viva vera e potente vera e potente che mi liberera che mi liberera io credo in te io credo in te rit gesu roccia di salvezza in te mi rifugero gesu roccia di salvezza la tua parola e speranza in me la tua parola e speranza in me gesu roccia di salvezza in te mi rifugero gesu roccia di salvezza la tua parola e speranza in me la tua parola e speranza in me la tua parola e speranza in me roccia di salvezza roccia di salvezza tu sei roccia di salvezza 423',type:'N',i:455},
{n:'424',t:'IL CANTO DEL TUO POPOLO',c:'SALGA A TE SIGNORE IL CANTO DEL TUO POPOLO  \nCON LA FORZA DEL TUO SPIRITO CHE GRIDA IN NOI,   \nLE NOSTRE MÀNI VERSO TE GESU\' \nPER OFFRIRTI IL SACRIFICIO DELLA LODE.  \n  \nTu sei la nostra vita, luce che non svanirà,    \nVerbo eterno, Salvatore dell\'umanità,  \nil cuore di ogni uomo accolga la tua verità,  \nla gloria tua nel mondo senza fine splenderà. (RIT) \n  \nTu sei il buon pastore che la via ci mostrerà,   \nguidi i nostri passi nella vera libertà,  \ntu sei promessa eterna, fonte di felicità,  \na te leviamo i cuori e ti adoriamo Maestà. (RIT) \n  \nNoi eleviam lo sguardo a te che regni in santità,  \nDio fedele tu ci ami dall\'eternità,  \nveniamo a te Signore vivo e vero in mezzo a noi,   \ngioiosi  ed esultanti acclamiamo al nostro Re.  \n  \nSALGA A TE SIGNORE IL CANTO DEL TUO POPOLO  \nCON LA FORZA DEL TUO SPIRITO CHE GRIDA IN NOI,   \nINNALZIAM LE NOSTRE MANI VERSO TE GESU\'  \nPER OFFRIRTI IL SACRIFICIO DELLA LODE.',s:'il canto del tuo popolo salga a te signore il canto del tuo popolo con la forza del tuo spirito che grida in noi le nostre mani verso te gesu per offrirti il sacrificio della lode tu sei la nostra vita luce che non svanira verbo eterno salvatore dell umanita il cuore di ogni uomo accolga la tua verita la gloria tua nel mondo senza fine splendera rit tu sei il buon pastore che la via ci mostrera guidi i nostri passi nella vera liberta tu sei promessa eterna fonte di felicita a te leviamo i cuori e ti adoriamo maesta rit noi eleviam lo sguardo a te che regni in santita dio fedele tu ci ami dall eternita veniamo a te signore vivo e vero in mezzo a noi gioiosi ed esultanti acclamiamo al nostro re salga a te signore il canto del tuo popolo con la forza del tuo spirito che grida in noi innalziam le nostre mani verso te gesu per offrirti il sacrificio della lode 424',type:'N',i:456},
{n:'425',t:'IL TUO AMORE PER ME',c:'IL TUO AMORE PER ME E GRANDE PIU DEL CIELO,  \nL\'EMMANUELE SEI TU ETERNO RE GESÙ,  \nCONFORTO E GIOIA Ml DAI E PACE IN FONDO AL CUORE,  \nMISERICORDIA E AMOR GLORIOSO REDENTOR.  \n  \nDalle tenebre Signore mi hai salvato  \ne per mano come un figlio mi hai guidato,  \nnon ti conoscevo ancora e già mi amavi,  \nsul sentiero della vita mi hai portato. (RIT) \n  \nGiunga a te la mia preghiera e la mia lode   \nper il dono di salvezza o mio Signore,  \nla tua luce possa splendere nel mondo  \ne guarir le piaghe dell\'umanità. (RIT) \n  \nMIO DIO MIO CREATOR  \nSOLO A TE LO SGUARDO RIVOLGERÒ,   \nL\'EMMANUELE SEI TU,  \nTU SEI RE GESU.',s:'il tuo amore per me il tuo amore per me e grande piu del cielo l emmanuele sei tu eterno re gesu conforto e gioia ml dai e pace in fondo al cuore misericordia e amor glorioso redentor dalle tenebre signore mi hai salvato e per mano come un figlio mi hai guidato non ti conoscevo ancora e gia mi amavi sul sentiero della vita mi hai portato rit giunga a te la mia preghiera e la mia lode per il dono di salvezza o mio signore la tua luce possa splendere nel mondo e guarir le piaghe dell umanita rit mio dio mio creator solo a te lo sguardo rivolgero l emmanuele sei tu tu sei re gesu 425',type:'N',i:457},
{n:'426',t:'IN ETERNO CANTERÒ',c:'In eterno canterò la tua lode mio Signor,  \nle mie labbra esalteranno la tua fedeltà,  \nio per sempre ti benedirò e annuncerò il tuo nome,  \nin eterno io ti canterò. (x2)  \n  \nIN ETERNO CANTERO\' LA TUA LODE MIO SIGNOR,  \nLE MIE LABBRA ESALTERANNO LA TUA FEDELTÀ,  \nIO PER SEMPRE TI BENEDIRÒ E ANNUNCERÒ IL TUO NOME,  \nIN ETERNO IO TI CANTERÒ SIGNOR.  \n  \nAnche se la tempesta mi colpirà  \nla mia lode a te Signore si eleverà,  \nsei tu la mia fiducia, io spero in te,  \ntu sei il mio Signore, il mio Re. (RIT) \n \nAnche se nel deserto mi perderò  \nla tua strada mio Signore io cercherò,  \nla luce del tuo amore mi guiderà,  \nriparo nella notte tu sarai. (RIT)   \n \nAnche se dal dolore io passerò  \nla tua croce mio Signore contemplerò,  \nle mani verso il cielo innalzerò,  \nla voce del tuo figlio ascolterai. (RIT) (x2)  \n\n \nIO PER SEMPRE TI BENEDIRÒ E ANNUNCERÒ IL TUO NOME,   \nIN ETERNO IO TI CANTERO SIGNOR,  \nIN ETERNO IO TI CANTERÒ SIGNOR.',s:'in eterno cantero in eterno cantero la tua lode mio signor le mie labbra esalteranno la tua fedelta io per sempre ti benediro e annuncero il tuo nome in eterno io ti cantero x2 in eterno cantero la tua lode mio signor le mie labbra esalteranno la tua fedelta io per sempre ti benediro e annuncero il tuo nome in eterno io ti cantero signor anche se la tempesta mi colpira la mia lode a te signore si elevera sei tu la mia fiducia io spero in te tu sei il mio signore il mio re rit anche se nel deserto mi perdero la tua strada mio signore io cerchero la luce del tuo amore mi guidera riparo nella notte tu sarai rit anche se dal dolore io passero la tua croce mio signore contemplero le mani verso il cielo innalzero la voce del tuo figlio ascolterai rit x2 io per sempre ti benediro e annuncero il tuo nome in eterno io ti cantero signor in eterno io ti cantero signor 426',type:'N',i:458},
{n:'427',t:'RESTA QUI CON NOI SI FA SERA',c:'Resta qui con noi,  \nSignore, la notte si avvicina,  \nresta qui con noi,  \navanza il buio ed il timore insidia il cuore.  \n \nResta qui con noi e dividi  \nquesto pane così in noi vivrai,  \nla via ci mostrerai,  \nresta con noi, si fa sera.  \n \nResta qui con noi,  \nSignore, la notte si avvicina, \nresta qui con noi, \navanza il buio ed il timore insidia il cuore. \n  \nResta qui con noi  \ne dacci questo vino  \ncosì in noi vivrai,  \nla via ci mostrerai,  \nresta con noi, si fa sera.  \n \nApri i nostri occhi  \ne ti riconasceremo  \ncosì in noi vivrai,  \nla via ci mostrerai,  \nresta con noi, si fa sera.',s:'resta qui con noi si fa sera resta qui con noi signore la notte si avvicina resta qui con noi avanza il buio ed il timore insidia il cuore resta qui con noi e dividi questo pane cosi in noi vivrai la via ci mostrerai resta con noi si fa sera resta qui con noi signore la notte si avvicina resta qui con noi avanza il buio ed il timore insidia il cuore resta qui con noi e dacci questo vino cosi in noi vivrai la via ci mostrerai resta con noi si fa sera apri i nostri occhi e ti riconasceremo cosi in noi vivrai la via ci mostrerai resta con noi si fa sera 427',type:'N',i:459},
{n:'428',t:'TU SEI LA PERLA PREZIOSA',c:'Tu sei la perla preziosa  \nche alla mia vita dà valore,  \nper te lascio ogni cosa  \ne seguo te o mio Signore.  \n  \nVOGLIO SEGUIRTI SIGNORE  \nPERCHE HAI SEDOTTO IL MIO CUORE,  \nVOGLIO OBBEDIRTI MAESTRO,  \nIL TUO VOLERE CON GIOIA FARÒ.  \n\nVOGLIO SEGUIRTI SIGNORE  \nPERCHÉ HAI SEDOTTO IL MIO CUORE,  \nVOGLIO OBBEDIRTI MAESTRO,   \nIL TUO VOLERE CON GIOIA FARÒ.  \n \nTu sei il tesoro più grande,   \nla vera fonte dell\'amore,   \nper te vendo ogni bene  \ne ti proclamo mio Signore. (RIT) \n  \nVOGLIO SEGUIRTI SIGNORE  \nPERCHE HAI SEDOTTO IL MIO CUORE,  \nVOGLIO OBBEDIRTI MAESTRO,  \nIL TUO VOLERE CON GIOIA FARÒ.  \nVOGLIO SEGUIRTI SIGNORE  \nPERCHÉ HAI SEDOTTO IL MIO CUORE,  \nVOGLIO OBBEDIRTI MAESTRO,   \nIL TUO VOLERE CON GIOIA FARÒ.  \n \n(coda facoltativa) \n  \nVOGLIO SEGUIRTI SIGNORE  \nPERCHÉ HAI SEDOTTO IL MIO CUORE,  \nVOGLIO OBBEDIRTI MAESTRO,  \nIL TUO VOLERE CON GIOIA FARO.  \nVOGLIO SEGUIRTI SIGNORE  \nPERCHÉ HAI SEDOTTO IL MIO CUORE,   \nVOGLIO OBBEDIRTI MAESTRO,  \nIL TUO VOLERE CON GIOIA FARÒ.  \n  \nTu sei la perla preziosa.',s:'tu sei la perla preziosa tu sei la perla preziosa che alla mia vita da valore per te lascio ogni cosa e seguo te o mio signore voglio seguirti signore perche hai sedotto il mio cuore voglio obbedirti maestro il tuo volere con gioia faro voglio seguirti signore perche hai sedotto il mio cuore voglio obbedirti maestro il tuo volere con gioia faro tu sei il tesoro piu grande la vera fonte dell amore per te vendo ogni bene e ti proclamo mio signore rit voglio seguirti signore perche hai sedotto il mio cuore voglio obbedirti maestro il tuo volere con gioia faro voglio seguirti signore perche hai sedotto il mio cuore voglio obbedirti maestro il tuo volere con gioia faro coda facoltativa voglio seguirti signore perche hai sedotto il mio cuore voglio obbedirti maestro il tuo volere con gioia faro voglio seguirti signore perche hai sedotto il mio cuore voglio obbedirti maestro il tuo volere con gioia faro tu sei la perla preziosa 428',type:'N',i:460},
{n:'429',t:'TU SEI SANTO TU SEI RE',c:'TU SEI SANTO, TU SEI RE,  \nTU SEI SANTO, TU SEI RE,  \nTU SEI SANTO, TU SEI RE,  \n \nTU SEI SANTO, TU SEI RE,   \nTU SEI SANTO, TU SEI RE,  \nTU SEI SANTO, TU SEI RE.  \n  \nLo confesso con il cuor,  \nlo professo a te Signor,   \nquando canto lode a te  \nsempre io ti cercherò,  \n\ntu sei tutto ciò che ho,  \noggi io ritorno a te.  \n  \nIo mi getto in te Signor,   \nstretto fra le braccia tue  \nvoglio vivere con te  \ne ricevo il tuo perdono,  \nla dolcezza del tuo amor,  \ntu non mi abbandoni mai Gesù.  \n \n(da capo)  \n \nRIT. (x4)  \n \nSEI RE, SEI RE, SEI RE.  \nTU SEI SANTO, TU SEI RE,  \nTU SEI SANTO, TU SEI RE,  \nTU SEI SANTO, TU SEI RE. (SEI RE)  \n \nTU SEI SANTO, TU SEI RE,  \nTU SEI SANTO, TU SEI RE, (SEI RE)  \nTU SEI SANTO, TU SEI RE. (SEI RE)  \nTU SEI SANTO, TU SEI RE, SEI RE, TU SEI RE.',s:'tu sei santo tu sei re tu sei santo tu sei re tu sei santo tu sei re tu sei santo tu sei re tu sei santo tu sei re tu sei santo tu sei re tu sei santo tu sei re lo confesso con il cuor lo professo a te signor quando canto lode a te sempre io ti cerchero tu sei tutto cio che ho oggi io ritorno a te io mi getto in te signor stretto fra le braccia tue voglio vivere con te e ricevo il tuo perdono la dolcezza del tuo amor tu non mi abbandoni mai gesu da capo rit x4 sei re sei re sei re tu sei santo tu sei re tu sei santo tu sei re tu sei santo tu sei re sei re tu sei santo tu sei re tu sei santo tu sei re sei re tu sei santo tu sei re sei re tu sei santo tu sei re sei re tu sei re 429',type:'N',i:461},
{n:'430',t:'TUTTO IL CREATO GIOISCE IN TE',c:'GRAZIE DIO, GRAZIE DIO,  \nGRANDE CREATORE, SPLENDIDO RE. (x2)  \nGRAZIE DIO, GRAZIE DIO,  \nTUTTO IL CREATO GIOISCE IN TE.  \n  \nGrazie mio Dio per il cielo e la terra,  \nper l\'alba e il tramonto  \nche assegni al tuo giorno,  \ngrazie mio Dio per le stelle splendenti  \nche rivesti di luce e ricami nel cielo.  \n  \nIl creato ti acclama e rivela il tuo volto,  \nil mio cuore ti loda eterno Signor. (RIT) \n  \nGrazie mio Dio per lo splendore  \ndi un raggio di sole  \nche scalda ogni cuore,  \ngrazie mio Dio per l\'arcobaleno  \nche segue ogni pioggia portando il sereno.  \n \n\nIl creato ti acclama ...     (RIT) \n  \nGrazie mio Dio per ogni creatura,  \nper un cuore che spera una vita che nasce,  \ngrazie mio Dio per le cose che hai fatto,  \nfa\' che ogni uomo sia pieno di te.  \n  \nIl creato ti acclama  \n \ne rivela il tuo volto,  \nil mio cuore ti loda   \neterno Signor.  \n \nGRAZIE DIO, GRAZIE DIO,  \nGRANDE CREATORE, SPLENDIDO RE. (x2)  \nGRAZIE DIO, GRAZIE DIO,  \nTUTTO IL CREATO GIOISCE,  \nTUTTO IL CREATO GIOISCE,  \nTUTTO IL CREATO GIOISCE IN TE,  \nIN TE.',s:'tutto il creato gioisce in te grazie dio grazie dio grande creatore splendido re x2 grazie dio grazie dio tutto il creato gioisce in te grazie mio dio per il cielo e la terra per l alba e il tramonto che assegni al tuo giorno grazie mio dio per le stelle splendenti che rivesti di luce e ricami nel cielo il creato ti acclama e rivela il tuo volto il mio cuore ti loda eterno signor rit grazie mio dio per lo splendore di un raggio di sole che scalda ogni cuore grazie mio dio per l arcobaleno che segue ogni pioggia portando il sereno il creato ti acclama rit grazie mio dio per ogni creatura per un cuore che spera una vita che nasce grazie mio dio per le cose che hai fatto fa che ogni uomo sia pieno di te il creato ti acclama e rivela il tuo volto il mio cuore ti loda eterno signor grazie dio grazie dio grande creatore splendido re x2 grazie dio grazie dio tutto il creato gioisce tutto il creato gioisce tutto il creato gioisce in te in te 430',type:'N',i:462},
{n:'431',t:'A TE GRIDO MIO SIGNORE',c:'A Te grido mio Signore  \nio ti prego vieni in mio aiuto  \nascolta il grido del mio cuore.  \nOggi invoco il tuo nome  \ne pregando io ti riconosco  \ne vedo che in ogni avversità  \nsei tu il mio rifugio.  \n  \nLE MIE MANI VERSO TE SIGNORE  \nCON FEDE SEMPRE INNALZERO\'  \nA TE RIVOLGO IL MIO CUORE  \nIO HO FIDUCIA IN TE, MIO DIO, SEMPRE \nLE MIE MANI VERSO TE SIGNORE  \nCON FEDE SEMPRE AL CIELO INNALZERO\'.  \nNELLA GIOIA VOLGO A TE IL MIO CUORE  \nIO HO FIDUCIA IN TE, MIO DIO, SEMPRE.  \n  \nSale a te la mia preghiera  \ncome incenso che si leva al cielo  \nascolta il grido del mio cuore.  \nOggi invoco il tuo nome  \ne pregando io ti riconosco  \ne credo che tu sei vivo in me  \nsei tu il mio Signore. (RIT)',s:'a te grido mio signore a te grido mio signore io ti prego vieni in mio aiuto ascolta il grido del mio cuore oggi invoco il tuo nome e pregando io ti riconosco e vedo che in ogni avversita sei tu il mio rifugio le mie mani verso te signore con fede sempre innalzero a te rivolgo il mio cuore io ho fiducia in te mio dio sempre le mie mani verso te signore con fede sempre al cielo innalzero nella gioia volgo a te il mio cuore io ho fiducia in te mio dio sempre sale a te la mia preghiera come incenso che si leva al cielo ascolta il grido del mio cuore oggi invoco il tuo nome e pregando io ti riconosco e credo che tu sei vivo in me sei tu il mio signore rit 431',type:'N',i:463},
{n:'432',t:'CANTIAMO INSIEME AL SIGNORE',c:'Ti esalterò per sempre, Signore  \nperchè mi hai liberato  \na te ho gridato e mi hai guarito,  \nmi hai dato la vita Signore.  \nCantate inni al Signore  \nrendete grazie a Lui  \nperchè la sua collera dura un istante  \nper sempre la sua bontà.  \n  \nCANTIAMO INSIEME AL SIGNOR \"LODE A TE\"  \nGRIDIAMO FORTE A LUI \"SANTO TU SEI\"  \nCANTIAMO INSIEME AL SIGNOR \"LODE A TE\"  \nGRIDIAMO FORTE A LUI \"SANTO TU SEI\"  \nLODE E GLORIA A DIO LODE E GLORIA A LUI  \nLODE E GLORIA A DIO LODE E GLORIA A LUI  \n  \nSignore vieni in mio aiuto  \nascolta la mia preghiera,  \nla sera sopraggiunge il pianto  \nma ecco al mattino la gioia.  \nTu hai cambiato il mio lamento  \nin gioia ed esultanza   \nperchè io possa cantare Signore  \nper sempre la tua bontà. (RIT)',s:'cantiamo insieme al signore ti esaltero per sempre signore perche mi hai liberato a te ho gridato e mi hai guarito mi hai dato la vita signore cantate inni al signore rendete grazie a lui perche la sua collera dura un istante per sempre la sua bonta cantiamo insieme al signor lode a te gridiamo forte a lui santo tu sei cantiamo insieme al signor lode a te gridiamo forte a lui santo tu sei lode e gloria a dio lode e gloria a lui lode e gloria a dio lode e gloria a lui signore vieni in mio aiuto ascolta la mia preghiera la sera sopraggiunge il pianto ma ecco al mattino la gioia tu hai cambiato il mio lamento in gioia ed esultanza perche io possa cantare signore per sempre la tua bonta rit 432',type:'N',i:464},
{n:'433',t:'DAI CONFINI DEL MONDO',c:'Dai confini del mondo,  \ndal profondo del mare,  \ndalle altezze del cielo,  \nnoi ti esaltiam.  \n \nE dal cuore del mite,  \ndalle grida del forte,   \ndalle labbra dei popoli,  \nnoi ti esaltiamo  \n  \nDA OGNI GENERAZIONE  \nDI LODI INCORONATO  \nO SIGNOR  \nSIA LODE DA OGNI NAZIONE  \nAL RE DELLA CREAZIONE  \n\nO SIGNOR,  \nNOI TI ESALTIAM.  \n \nDai confini del mondo... \n \nE dal cuore del mite... \n \n(RIT) (x2) \n \nDai condini del mondo...',s:'dai confini del mondo dai confini del mondo dal profondo del mare dalle altezze del cielo noi ti esaltiam e dal cuore del mite dalle grida del forte dalle labbra dei popoli noi ti esaltiamo da ogni generazione di lodi incoronato o signor sia lode da ogni nazione al re della creazione o signor noi ti esaltiam dai confini del mondo e dal cuore del mite rit x2 dai condini del mondo 433',type:'N',i:465},
{n:'434',t:'FUOCO D\'AMORE',c:'Fuoco d\'amore brucia nel mio cuore  \nacqua della vita zampilla dentro me.  \nO Spirito creatore vieni nel mio cuore,  \nConsolatore scendi su di me.  \n  \nVIENI SANTO SPIRITO VIENI DIO D\'AMORE  \nVIENI DIO DI GIOIA SCENDI SU DI ME.  \n  \nFuoco d\'amore brucia nel mio cuore  \nacqua della vita zampilla dentro me.  \nO balsamo d\'amore sana le ferite  \nSpirito di pace scendi su di me. (RIT) \n  \nPlasmami, guidami, usami salvami  \nPlasmami, guidami, usami salvami (Vieni Santo Spirito, scendi su di noi) \nPlasmami, guidami, usami salvami (Vieni Santo Spirito, scendi su di noi) \n \nVIENI SANTO SPIRITO VIENI DIO D\'AMORE  \nVIENI DIO DI GIOIA SCENDI SU DI ME.  \n \nVIENI SPIRITO VIENI IN ME. \nVIENI SPIRITO VIENI IN ME.',s:'fuoco d amore fuoco d amore brucia nel mio cuore acqua della vita zampilla dentro me o spirito creatore vieni nel mio cuore consolatore scendi su di me vieni santo spirito vieni dio d amore vieni dio di gioia scendi su di me fuoco d amore brucia nel mio cuore acqua della vita zampilla dentro me o balsamo d amore sana le ferite spirito di pace scendi su di me rit plasmami guidami usami salvami plasmami guidami usami salvami vieni santo spirito scendi su di noi plasmami guidami usami salvami vieni santo spirito scendi su di noi vieni santo spirito vieni dio d amore vieni dio di gioia scendi su di me vieni spirito vieni in me vieni spirito vieni in me 434',type:'N',i:466},
{n:'435',t:'GLORIA LA CHIESA CANTA',c:'Gloria la Chiesa canta,  \ninsieme prega e spera solo in te.  \nVieni presto, Signore vieni,  \nle nostre mani al cielo innalziam.  \n  \nALLELUIA ALLELUIA   \nNOI SIAMO QUI PER TE,   \n\nNOSTRO DIO E NOSTRO RE.  \nALLELUIA ALLELUIA CANTIAMO,  \nNOI GRIDIAMO AL MONDO CHE GESU\',  \nGESU\' E\' IL SIGNOR.  \n  \nSplendi grande Signore,  \nsplendi su tutti noi che qui cerchiamo te. \nRiempi della ta grazia i cuori \ndi chi è smarrito e solo senza te. \n \nALLELUIA ALLELUIA   \nNOI SIAMO QUI PER TE,   \nNOSTRO DIO E NOSTRO RE.  \nALLELUIA ALLELUIA CANTIAMO,  \nNOI GRIDIAMO AL MONDO CHE GESU\',  \nGESU\' E\' IL SIGNOR.  \n \nOh, oh ... \n  \nVieni, vieni Signore, regna,  \nregna Signore, ama,  \nama Signore salva. \nVieni, vieni Signore, regna,  \nregna Signore, ama,  \nama Signore salva. (RIT)',s:'gloria la chiesa canta gloria la chiesa canta insieme prega e spera solo in te vieni presto signore vieni le nostre mani al cielo innalziam alleluia alleluia noi siamo qui per te nostro dio e nostro re alleluia alleluia cantiamo noi gridiamo al mondo che gesu gesu e il signor splendi grande signore splendi su tutti noi che qui cerchiamo te riempi della ta grazia i cuori di chi e smarrito e solo senza te alleluia alleluia noi siamo qui per te nostro dio e nostro re alleluia alleluia cantiamo noi gridiamo al mondo che gesu gesu e il signor oh oh vieni vieni signore regna regna signore ama ama signore salva vieni vieni signore regna regna signore ama ama signore salva rit 435',type:'N',i:467},
{n:'436',t:'IO TI AMO',c:'Mh, mh, mh, mh.  \nIo ti amo, io ti amo, amo te, Signor.  \n \nSignore tu mi scruti e mi conosci  \nintendi da lontano i miei pensieri  \nproteggi sempre il mio cammino e il mio riposo  \ntu sei il mio Signor.  \n  \nIO TI AMO, IO TI AMO, AMO TE SIGNOR  \n \nMh, mh, mh, mh. \n \nSei tu che mi hai creato nel segreto  \nnel seno di mia madre mi hai formato  \nadesso vedo che tu hai fatto di me un prodigio  \ntu sei il mio Signor (RIT) \n  \nTu leggi nel mio cuore, sai cosa c\'è  \n\nconosci la mia vita sai tutto di me.  \nTu leggi nel mio cuore,  \nsai cosa c\'è affido la mia vita a te.  \n  \nIO TI AMO, IO TI AMO, AMO TE SIGNOR  (AMO TE, AMO TE)  \nIO TI AMO, IO TI AMO, AMO TE SIGNOR  (AMO TE, AMO TE)  \nIO TI AMO, IO TI AMO, AMO TE SIGNOR  (AMO TE, AMO TE)  \nIO TI AMO, IO TI AMO, AMO TE SIGNOR  (AMO TE, AMO TE)',s:'io ti amo mh mh mh mh io ti amo io ti amo amo te signor signore tu mi scruti e mi conosci intendi da lontano i miei pensieri proteggi sempre il mio cammino e il mio riposo tu sei il mio signor io ti amo io ti amo amo te signor mh mh mh mh sei tu che mi hai creato nel segreto nel seno di mia madre mi hai formato adesso vedo che tu hai fatto di me un prodigio tu sei il mio signor rit tu leggi nel mio cuore sai cosa c e conosci la mia vita sai tutto di me tu leggi nel mio cuore sai cosa c e affido la mia vita a te io ti amo io ti amo amo te signor amo te amo te io ti amo io ti amo amo te signor amo te amo te io ti amo io ti amo amo te signor amo te amo te io ti amo io ti amo amo te signor amo te amo te 436',type:'N',i:468},
{n:'437',t:'LA TUA FEDELTA\'',c:'Senza fine canterò la grandezza del tuo amore  \nin ogni tempo annuncerò la tua fedeltà.  \nEd il mio corpo danzerà alla tua presenza   \nla mia bocca sempre canterà la tua fedeltà.  \nE nel giorno della prova il mio capo innalzerò  \nal Signore dei signori la mia lode offrirò.  \n \nMio Signor esalterò la potenza del tuo nome  \nla tua destra annienterà la malvagità.   \nE su di me non trionferà il nemico e l\'invasor  \nper sempre io contemplerò la tua santità,  \nE nel giorno della prova il mio capo innalzerò  \nal Signore dei signori la mia lode offrirò.   \n \nSenza fine canterò la grandezza del tuo amore  \nin ogni tempo annuncerò la tua fedeltà.  \nEd il mio corpo danzerà alla tua presenza  (danzerà, danzerà) \nla mia bocca sempre canterà la tua fedeltà.  \nE nel giorno della prova il mio capo innalzerò  \nal Signore dei signori la mia lode offrirò. \n \nSenza fine canterò la grandezza del tuo amore (canterò, canterò) \nin ogni tempo annuncerò la tua fedeltà. \nSenza fine canterò la grandezza del tuo amore  \nin ogni tempo annuncerò la tua fedeltà.   \n \nEd il mio corpo danzerà alla tua presenza   \nla mia bocca sempre canterà la tua fedeltà.  \n  \nMio Signor esalterò la potenza del tuo nome  \nla tua destra annienterà la malvagità.   \nE su di me non trionferà il nemico e l\'invasor (non trionferà, non trionferà) \nper sempre io contemplerò la tua santità.  \n  \nAh,   ah,  ah,     \n\nlai, lai, lai, lai,   \nla tua fedeltà.',s:'la tua fedelta senza fine cantero la grandezza del tuo amore in ogni tempo annuncero la tua fedelta ed il mio corpo danzera alla tua presenza la mia bocca sempre cantera la tua fedelta e nel giorno della prova il mio capo innalzero al signore dei signori la mia lode offriro mio signor esaltero la potenza del tuo nome la tua destra annientera la malvagita e su di me non trionfera il nemico e l invasor per sempre io contemplero la tua santita e nel giorno della prova il mio capo innalzero al signore d {n:'438',t:'NOI CREDIAMO NEL TUO NOME',c:'O Signore  \nda chi andremo senza di te?  \nTu parola eterna sei,  \nvia vita e verità,  \nci hai donato il tuo amor  \ne ora apparteniamo a te;  \ne quando tutto passerà  \nquel che hai detto resterà  \nscolpito nei nostri cuori.  \n  \nNOI CREDIAMO NEL TUO NOME  \nDEGNO DI ONORE E DI GLORIA NEI SECOLI  \nSIGNORE TU CHE SIEDI ALLA DESTRA DEL PADRE  \nRITORNERAI NELLA GLORIA E REGNERAI.  \nCHIUNQUE CREDE NEL TUO NOME GESU\'  \nSARA\' SALVATO E MAI DA SOLO RESTERA\'.  \n  \nO Signore  \nda chi andremo senza di te?  \nTu parola eterna sei,  \nvia vita e verità,  \nci hai donato il tuo amor  \ne ora apparteniamo a te;  \ne se il buio arriverà  \ntu sarai presenza   \nviva e vera nei nostri cuori. (RIT)',s:'noi crediamo nel tuo nome o signore da chi andremo senza di te tu parola eterna sei via vita e verita ci hai donato il tuo amor e ora apparteniamo a te e quando tutto passera quel che hai detto restera scolpito nei nostri cuori noi crediamo nel tuo nome degno di onore e di gloria nei secoli signore tu che siedi alla destra del padre ritornerai nella gloria e regnerai chiunque crede nel tuo nome gesu sara salvato e mai da solo restera o signore da chi andremo senza di te tu parola eterna sei via vita e verita ci hai donato il tuo amor e ora apparteniamo a te e se il buio arrivera tu sarai presenza viva e vera nei nostri cuori rit 438',type:'N',i:470},
{n:'439',t:'PASSA ANCORA IN MEZZO A NOI',c:'Tu che sani i cuori affranti e fasci le ferite  \nsei venuto per guarirmi da ogni male  \ndì soltanto una parola e la mia infermità  \nsarà vinta e guarita dentro me.  \n  \nPASSA ANCORA IN MEZZO A NOI  \nFIGLIO DI DIO  \nSE TU VUOI SANARCI PUOI,  \nGRANDE LA TUA BONTA\'.  \nPASSA ANCORA IN MEZZO A NOI FIGLIO DI DIO  \nDAL PROFONDO GRIDIAMO A TE.  \n\nTU SEI GESU\' SIGNORE  \n  \nVolgi a me il tuo sguardo e fermati Signore  \nfammi grazia per amore del tuo nome  \nTi presento i miei affanni  \ne la fede del mio cuor,  \ntu sorgente di ogni bene  \nsei per me.  \n \n(RIT) \n  \nPASSA ANCORA IN MEZZO A NOI  \nFIGLIO DI DIO  \nDAL PROFONDO GRIDIAMO A TE.  \nTU SEI GESU\' SIGNORE.',s:'passa ancora in mezzo a noi tu che sani i cuori affranti e fasci le ferite sei venuto per guarirmi da ogni male di soltanto una parola e la mia infermita sara vinta e guarita dentro me passa ancora in mezzo a noi figlio di dio se tu vuoi sanarci puoi grande la tua bonta passa ancora in mezzo a noi figlio di dio dal profondo gridiamo a te tu sei gesu signore volgi a me il tuo sguardo e fermati signore fammi grazia per amore del tuo nome ti presento i miei affanni e la fede del mio cuor tu sorgente di ogni bene sei per me rit passa ancora in mezzo a noi figlio di dio dal profondo gridiamo a te tu sei gesu signore 439',type:'N',i:471},
{n:'440',t:'SANTO (ETERNO AMORE)',c:'Santo, santo, santo sei Signor, eterno amore,  \nbuono giusto non mi abbandoni mai.  \nIo confido in te, Signore mio Dio.  \n  \nSIGNORE SPERO IN TE, CREDO IN TE  \nLA TUA PAROLA RESTERA\'.  \nIO MI DONO A TE CHE MI SALVERAI,  \nIO SONO TUO TI APPARTENGO, \nMIO SIGNOR.  \n  \nSanto, santo, santo sei Signor, eterno amore,  \nbuono giusto non mi abbandoni mai.  \nIo confido in te, Signore mio Dio.  \n  \nSIGNORE SPERO IN TE, CREDO IN TE  \nLA TUA PAROLA RESTERA\'.  \nIL TUO AMORE SIA LA MIA GIOIA  \nE LA GRAZIA TUA MI RINFRANCHI,  \nVENGA IN ME.  \n \nMh, mh. \n  \nSanto, santo, santo sei Signor, eterno amore,  \nbuono giusto non mi abbandoni mai.  \nIo confido in te,  \nSignore mio Dio, confido in te.',s:'santo eterno amore santo santo santo sei signor eterno amore buono giusto non mi abbandoni mai io confido in te signore mio dio signore spero in te credo in te la tua parola restera io mi dono a te che mi salverai io sono tuo ti appartengo mio signor santo santo santo sei signor eterno amore buono giusto non mi abbandoni mai io confido in te signore mio dio signore spero in te credo in te la tua parola restera il tuo amore sia la mia gioia e la grazia tua mi rinfranchi venga in me mh mh santo santo santo sei signor eterno amore buono giusto non mi abbandoni mai io confido in te signore mio dio confido in te 440',type:'N',i:472},
{n:'441',t:'TI LODO SIGNORE (NELLA MIA VITA SEI)',c:'Per la mia vita sei unguento d\'amore,  \ncrisma che sana e guarisce il mio cuore  \nNella mia vita sei giustizia regale,  \nse cado mi alzi, mi difendi dal male.  \nGrazie Signore, per te canterò.  \n  \nTI LODO SIGNORE PER QUELLO CHE SEI,   \nTI LODO PER CIO\' CHE MI DAI,  \nTI LODO SIGNORE, SEI TUTTO PER ME  \nTI LODO SIGNORE PER QUELLO CHE SEI  \nTI LODO SIGNORE PER CIO\' CHE MI DAI  \nTI LODO SIGNORE RIMANI CON ME  \nIMMENSO E\' IL TUO AMORE PER ME.  \n  \nNella mia vita sei gioia infinita,  \ntu il mio aiuto, non sono mai solo.  \nNella mia vita sei luce che splende,  \ntu guidi i miei passi e rischiari la notte.  \nGrazie Signore, per te canterò.  \n  \nTI LODO SIGNORE PER QUELLO CHE SEI,   \nTI LODO PER CIO\' CHE MI DAI,  \nTI LODO SIGNORE RIMANI CON ME  \nIMMENSO E\' IL TUO AMORE PER ME.  \nIMMENSO E\' IL TUO AMORE PER ME.',s:'ti lodo signore nella mia vita sei per la mia vita sei unguento d amore crisma che sana e guarisce il mio cuore nella mia vita sei giustizia regale se cado mi alzi mi difendi dal male grazie signore per te cantero ti lodo signore per quello che sei ti lodo per cio che mi dai ti lodo signore sei tutto per me ti lodo signore per quello che sei ti lodo signore per cio che mi dai ti lodo signore rimani con me immenso e il tuo amore per me nella mia vita sei gioia infinita tu il mio aiuto non sono mai solo nella mia vita sei luce che splende tu guidi i miei passi e rischiari la notte grazie signore per te cantero ti lodo signore per quello che sei ti lodo per cio che mi dai ti lodo signore rimani con me immenso e il tuo amore per me immenso e il tuo amore per me 441',type:'N',i:473},
{n:'442',t:'TU MI HAI SEDOTTO',c:'Signore eccomi,  \ntu mi hai chiamato e vengo a te  \nvengo per fare o Dio, con gioia il tuo voler.  \nLa tua parola in me  \nè come un balsamo d\'amor  \nche profuma il cuore dall\'eternità.  \n  \nSIGNORE, ECCO MI HAI SEDOTTO  \nCON LA GRAZIA DEL TUO AMOR  \nED IO MI SON LASCIATO CONQUISTAR DA TE.  \nNESSUNO MAI POTREBBE ALLONTANARMI  \nDAL TUO GRANDE AMOR  \nCHE MI HA REDENTO E MI HA SALVATO  \nO MIO SIGNOR.  \n  \nSignore eccomi,  \ntu hai prevalso su di me  \n\ne nel mio cuore un fuoco ardente brucerà.  \nTu sei vicino a me  \ned il nemico fuggirà,  \nper questo benedico la tua fedeltà. \n \n(RIT) \n \nSignore ti benedirò,  \nSignore ti benedirò,  \nio ti benedirò,  \nio ti benedirò.   \n \nSIGNORE, ECCO MI HAI SEDOTTO  \nCON LA GRAZIA DEL TUO AMOR  \nED IO MI SON LASCIATO CONQUISTAR DA TE.  \nNESSUNO MAI POTREBBE ALLONTANARMI  \nDAL TUO GRANDE AMOR  \nCHE MI HA REDENTO E MI HA SALVATO  \nO MIO SIGNOR.  \n  \nSIGNORE, ECCO MI HAI SEDOTTO  \nCON LA GRAZIA DEL TUO AMOR  \nED IO MI SON LASCIATO CONQUISTAR DA TE.  \nNESSUNO MAI POTREBBE ALLONTANARMI  \nDAL TUO GRANDE AMOR  \nCHE MI HA REDENTO E MI HA SALVATO  \nO MIO SIGNOR.  \n \nHuuu, haaa, huuu, haaa. \n \nSIGNORE, ECCO MI HAI SEDOTTO COL TUO AMOR',s:'tu mi hai sedotto signore eccomi tu mi hai chiamato e vengo a te vengo per fare o dio con gioia il tuo voler la tua parola in me e come un balsamo d amor che profuma il cuore dall eternita signore ecco mi hai sedotto con la grazia del tuo amor ed io mi son lasciato conquistar da te nessuno mai potrebbe allontanarmi dal tuo grande amor che mi ha redento e mi ha salvato o mio signor signore eccomi tu hai prevalso su di me e nel mio cuore un fuoco ardente brucera tu sei vicino a me ed il nemico fuggira per questo benedico la tua fedelta rit signore ti benediro signore ti benediro io ti benediro io ti benediro signore ecco mi hai sedotto con la grazia del tuo amor ed io mi son lasciato conquistar da te nessuno mai potrebbe allontanarmi
